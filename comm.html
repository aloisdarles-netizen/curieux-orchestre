<style>
  .wrap{max-width:min(1500px, 97vw); margin:0 auto; font-variant-numeric:tabular-nums;}

  /* Mêmes pilules que les filtres des annuaires : aucun geste à réapprendre. */
  .vues{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px;}
  .vues button{
    cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text);
    border-radius:999px; padding:8px 17px; font-size:13.5px; font-weight:700; font-family:inherit;
  }
  .vues button[aria-pressed="true"]{background:var(--prune); color:var(--blanc); border-color:var(--prune);}
  [hidden]{display:none;}

  /* Un outil de travail avant une vitrine : cartes plates, couleurs d'état
     seulement (retard rouge, fait vert). La DA reste sur les pages publiques. */
  .stats-plates{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; margin-bottom:20px;}
  .stats-plates > div{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .stats-plates b{display:block; font-size:26px; font-weight:800; line-height:1; color:var(--accent);}
  .stats-plates b.ko{color:var(--ko);}
  .stats-plates span{display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-top:5px;}

  .bloc{margin-bottom:20px;}
  .bloc-tete{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin:0 0 10px;}
  .bloc-tete h2{font-size:15.5px; margin:0; color:var(--accent);}
  .bloc-tete .compte{font-size:12.5px; color:var(--muted); font-weight:700;}

  /* Une tâche : l'échéance à gauche, le contenu au milieu, la coche à droite —
     l'œil descend la colonne des échéances sans lire le reste. */
  .tache{display:flex; align-items:center; gap:14px; padding:11px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .tache:last-child{border-bottom:none;}
  .tache .quand{flex:0 0 128px; min-width:128px;}
  .tache .quand b{display:block; font-size:12.5px; font-weight:800;}
  .tache .quand small{display:block; font-size:11px; color:var(--muted); font-weight:700;}
  .tache .quoi{flex:1; min-width:200px;}
  .tache .quoi b{display:block; font-weight:800; font-size:13.5px;}
  .tache .quoi small{display:block; font-size:11.5px; color:var(--muted);}
  .tache.faite .quoi > b{text-decoration:line-through; color:var(--muted);}
  .tache .coche{display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); font-weight:700; cursor:pointer; white-space:nowrap;}
  .tache .coche input{width:17px; height:17px; accent-color:var(--ok); cursor:pointer;}
  .tache .outil{
    cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted);
    border-radius:8px; width:28px; height:28px; font-weight:800; font-size:13px; font-family:inherit;
    display:grid; place-items:center; flex-shrink:0;
  }
  .tache .outil:hover{border-color:var(--accent); color:var(--accent);}
  .tache .outil.danger:hover{border-color:var(--ko); color:var(--ko);}
  .tache .par{
    font-size:11px; color:var(--muted); font-weight:700; white-space:nowrap;
    background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:3px 10px;
  }
  .retard{border-left:3px solid var(--ko);}
  .aujourdhui{border-left:3px solid var(--secondary);}

  /* Le formulaire de tâche : une ligne de champs, rien de plus. */
  .tache-form{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;}
  .tache-form .champ{display:flex; flex-direction:column; gap:4px;}
  .tache-form label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
  .tache-form input, .tache-form select{
    padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:13.5px;
    background:var(--card); color:var(--text); font-family:inherit;
  }
  .tache-form input:focus, .tache-form select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .tache-form .libelle{flex:2 1 240px;}
  .tache-form .libelle input{width:100%;}
  .tache-form .notes-champ{flex:2 1 200px;}
  .tache-form .notes-champ input{width:100%;}

  .types-ligne{display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px dashed var(--border); font-size:13px;}
  .types-ligne:last-of-type{border-bottom:none;}
  .types-ligne .j{flex:0 0 60px; font-weight:800; color:var(--accent);}
  .types-ligne .lib{flex:1; min-width:160px; font-weight:700;}

  /* Les dates : une ligne par date, la comm en résumé à droite. */
  .date-ligne{display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .date-ligne:last-child{border-bottom:none;}
  .date-ligne .quand{flex:0 0 128px; min-width:128px; font-weight:800; font-size:13px;}
  .date-ligne .ou{flex:1; min-width:200px;}
  .date-ligne .ou b{display:block; font-weight:800; font-size:13.5px;}
  .date-ligne .ou small{display:block; font-size:11.5px; color:var(--muted);}
  .date-ligne .resume{font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap;}
  .date-ligne.passee{opacity:.55;}

  /* Le calendrier : une grille de sept, des pastilles dans les cases. */
  .cal{display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;}
  .cal-jour-nom{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); text-align:center; padding-bottom:4px;}
  .cal-case{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    min-height:96px; padding:6px 7px; display:flex; flex-direction:column; gap:3px;
  }
  .cal-case.hors{opacity:.4;}
  .cal-case.jour-j{border-color:var(--secondary); border-width:2px;}
  .cal-num{font-size:11.5px; font-weight:800; color:var(--muted);}
  .cal-case.jour-j .cal-num{color:var(--secondary);}
  .pastille{
    font-size:10.5px; font-weight:700; line-height:1.3; border-radius:6px; padding:3px 6px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .pastille.concert{background:var(--prune); color:var(--blanc);}
  .pastille.option{background:var(--maybe-tint); color:var(--maybe);}
  .pastille.annulee{background:var(--ko-tint); color:var(--ko); text-decoration:line-through;}
  .pastille.echeance{background:var(--secondary-tint); color:var(--prune);}
  .pastille.newsletter{background:var(--orange); color:var(--blanc);}
  @media (max-width:760px){
    .cal{grid-template-columns:1fr; gap:4px;}
    .cal-jour-nom{display:none;}
    .cal-case{min-height:0; flex-direction:row; align-items:center; flex-wrap:wrap;}
    .cal-case:not(:has(.pastille)){display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="co-page-head co-fade">
    <div>
      <h1>Espace comm</h1>
      <p class="subtitle">Tes tâches, les dates de l'orchestre, la newsletter du mois — la comm sur les canaux de l'orchestre, le tourneur s'occupe du reste.</p>
    </div>
  </div>

  <div class="vues" role="group" aria-label="Vues de l'espace comm">
    <button type="button" data-vue="semaine" aria-pressed="true">Ma semaine</button>
    <button type="button" data-vue="taches">Tâches</button>
    <button type="button" data-vue="dates">Les dates</button>
    <button type="button" data-vue="calendrier">Calendrier</button>
  </div>

  <section id="vue-semaine"><div class="empty-hint">Chargement…</div></section>
  <section id="vue-taches" hidden></section>
  <section id="vue-dates" hidden></section>
  <section id="vue-calendrier" hidden></section>
</div>

<script>
applyBrandLogo();
injectCurieuxFonts();
applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);

/* ---------------------------------------------------------------------------
   Espace comm — l'espace de travail de la chargée de comm.
   ---------------------------------------------------------------------------
   L'orchestre est produit par un tourneur : presse locale, salles et
   billetterie ne passent pas par ici. La comm interne parle sur les canaux de
   l'orchestre — et personne d'autre qu'elle ne sait ce qu'il y a à y faire.

   Les tâches sont donc SAISIES, jamais imposées. Ce que l'outil apporte que
   ses outils du marché n'ont pas :
   — une tâche rattachée à une date SUIT la date : elle compte en jours avant
     le concert, se déplace avec lui, s'alarme s'il est annulé (on l'a
     peut-être déjà annoncé publiquement) ;
   — les dates validées sans aucune tâche sont signalées, avec les tâches
     types en un clic — une proposition, pas un rétroplanning subi ;
   — la newsletter est un rendez-vous mensuel : sa tâche se crée toute seule
     chaque mois, parce qu'elle doit exister même si personne n'y pense.
--------------------------------------------------------------------------- */

let tourneesCache = [];
let tachesCache = [];
let reglagesCache = {};
let tacheEnEdition = null;    // id de la tâche ouverte dans le formulaire
let monEmail = '';            // le compte connecté — l'auteur des tâches qu'il crée
let moisAffiche = null;       // 'YYYY-MM' du calendrier

const TYPES_DEFAUT = [
  { libelle:'Annoncer la date', j:30 },
  { libelle:'Post le jour J', j:0 },
  { libelle:'Retombées et photos', j:-3 },
];

const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

function isoLocal(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function aujourdhui(){ return isoLocal(new Date()); }

function joli(iso, avecJour){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return (avecJour ? JOURS[d.getDay()].slice(0, 3) + '. ' : '') + d.getDate() + ' ' + MOIS[d.getMonth()];
}
function joliLong(iso){
  const d = new Date(iso + 'T00:00:00');
  return JOURS[d.getDay()] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()] + ' ' + d.getFullYear();
}
function libelleJ(j){ return j >= 0 ? 'J-' + j : 'J+' + (-j); }

/* --- Les dates de concert ------------------------------------------------- */

// Les dates sur lesquelles la comm peut avoir à parler : celles des tournées
// (pas des recordings — un album se traite en tâches libres), de nature
// concert, avec une vraie date. Une répétition ou une résidence n'a pas de
// public, donc pas de comm.
function datesConcert(){
  const out = [];
  tourneesCache.filter(t=> !estRecording(t)).forEach(t=>{
    (t.dates || []).forEach(d=>{
      if(!d.date) return;
      if(typeDateValide(t, d.type) !== 'concert') return;
      out.push({ tournee: t, d });
    });
  });
  return out.sort((a, b)=> a.d.date.localeCompare(b.d.date));
}
function trouverDate(tourneeId, dateId){
  const t = tourneesCache.find(x=> x.id === tourneeId);
  const d = t && (t.dates || []).find(x=> x.id === dateId);
  return d ? { tournee: t, d } : null;
}

/* --- Les tâches ----------------------------------------------------------- */

// L'échéance d'une tâche rattachée se recalcule depuis la date du concert :
// c'est ainsi qu'elle suit la date quand elle bouge.
function echeanceDe(t){
  if(t.dateId){
    const ref = trouverDate(t.tourneeId, t.dateId);
    if(ref) return addDaysIso(ref.d.date, -(t.j || 0));
  }
  return t.echeance || '';
}

function etatDe(t){
  const ref = t.dateId ? trouverDate(t.tourneeId, t.dateId) : null;
  const ech = echeanceDe(t);
  const reste = ech ? daysBetween(aujourdhui(), ech) : null;
  if(t.fait) return { etat:'fait', ech, reste };
  // La date a disparu (tournée supprimée) ou est annulée : la tâche reste
  // visible en alerte — on a peut-être déjà annoncé ce concert.
  if(t.dateId && (!ref || ref.d.statut === 'annulee')) return { etat:'date_annulee', ech, reste };
  if(ref && ref.d.statut === 'option' && reste != null && reste <= 0) return { etat:'attente', ech, reste };
  if(reste == null) return { etat:'libre', ech, reste };
  if(reste < 0) return { etat:'retard', ech, reste };
  if(reste === 0) return { etat:'aujourdhui', ech, reste };
  return { etat:'a_venir', ech, reste };
}

const LIBELLE_ETAT = { fait:'Fait', retard:'En retard', aujourdhui:"Aujourd'hui", date_annulee:'Date annulée',
  attente:'Attend la signature', a_venir:'À faire', libre:'Sans échéance' };
function pilleEtat(etat){
  return { fait:'ok', retard:'ko', aujourdhui:'att', date_annulee:'ko', attente:'att', a_venir:'info', libre:'' }[etat] || '';
}
function libelleEcheance(x){
  if(x.etat === 'fait') return '';
  if(x.etat === 'attente') return 'attend la signature';
  if(x.reste == null) return '';
  if(x.reste === 0) return "aujourd'hui";
  if(x.reste < 0) return 'en retard de ' + (-x.reste) + ' j';
  if(x.reste === 1) return 'demain';
  return 'dans ' + x.reste + ' jours';
}

function contexteDe(t){
  if(t.dateId){
    const ref = trouverDate(t.tourneeId, t.dateId);
    if(ref) return joli(ref.d.date) + ' · ' + (ref.d.ville || '?') + (ref.d.lieu ? ' · ' + ref.d.lieu : '') + ' — ' + libelleJ(t.j || 0);
    return 'date supprimée';
  }
  if(t.genre === 'newsletter') return 'le rendez-vous mensuel';
  return '';
}

function tachesDeDate(tourneeId, dateId){
  return tachesCache.filter(t=> t.tourneeId === tourneeId && t.dateId === dateId);
}

function typesTaches(){
  const types = reglagesCache.commTachesTypes;
  return Array.isArray(types) && types.length ? types : TYPES_DEFAUT;
}

/* --- La newsletter : le rendez-vous qui se crée tout seul ----------------- */

// Le jour du mois où la newsletter doit partir — réglable, borné à 28 pour
// exister dans tous les mois.
function jourNewsletter(){
  const j = Number(reglagesCache.commNewsletterJour) || 25;
  return Math.min(28, Math.max(1, j));
}

// Une newsletter par mois, sans que personne n'ait à y penser : la tâche du
// mois courant et celle du mois prochain existent toujours. Identifiant
// déterministe — deux onglets ouverts n'en créeront jamais deux.
async function garantirNewsletters(){
  const d = new Date();
  const mois = [
    [d.getFullYear(), d.getMonth()],
    d.getMonth() === 11 ? [d.getFullYear() + 1, 0] : [d.getFullYear(), d.getMonth() + 1],
  ];
  for(const [an, m] of mois){
    const id = `tache-nl-${an}-${String(m + 1).padStart(2, '0')}`;
    if(tachesCache.some(t=> t.id === id)) continue;
    const tache = {
      id, libelle: `Newsletter ${/^[aeiouy]/.test(MOIS[m]) ? "d'" : 'de '}${MOIS[m]}${an !== d.getFullYear() ? ' ' + an : ''}`,
      notes: '', auteur: '', echeance: `${an}-${String(m + 1).padStart(2, '0')}-${String(jourNewsletter()).padStart(2, '0')}`,
      tourneeId: '', dateId: '', j: null, genre: 'newsletter', fait: false, faitLe: '',
    };
    const { error } = await CurieuxDB.upsertOne('comm_taches', tache);
    if(!error) tachesCache.push(tache);
  }
}

/* --- Une ligne de tâche, partout la même ---------------------------------- */

function renderTache(t, avecContexte){
  const x = etatDe(t);
  const classe = ['tache', t.fait ? 'faite' : '', x.etat === 'retard' ? 'retard' : '', x.etat === 'aujourdhui' ? 'aujourdhui' : ''].filter(Boolean).join(' ');
  const contexte = avecContexte ? contexteDe(t) : '';
  const sous = [contexte, t.notes].filter(Boolean).join(' — ');
  // Qui a posté la tâche, toujours visible — le début de l'adresse suffit à
  // l'œil, l'adresse complète est au survol. Sans auteur (newsletter,
  // tâches d'avant la signature), c'est l'outil qui l'a posée.
  const par = t.auteur
    ? `<span class="par" title="${escapeAttr(t.auteur)}">par ${escapeHtml(t.auteur.split('@')[0])}</span>`
    : '<span class="par" title="Créée automatiquement">auto</span>';
  return `<div class="${classe}">
    <div class="quand">
      <b>${x.ech ? escapeHtml(joli(x.ech, true)) : '—'}</b>
      <small>${escapeHtml(t.fait && t.faitLe ? 'fait le ' + joli(t.faitLe) : libelleEcheance(x))}</small>
    </div>
    <div class="quoi">
      <b>${escapeHtml(t.libelle || 'Sans titre')}</b>
      ${sous ? `<small>${escapeHtml(sous)}</small>` : ''}
    </div>
    ${par}
    <span class="co-pill ${pilleEtat(x.etat)}">${escapeHtml(LIBELLE_ETAT[x.etat])}</span>
    <label class="coche"><input type="checkbox" data-coche="${escapeAttr(t.id)}" ${t.fait ? 'checked' : ''}> fait</label>
    <button type="button" class="outil" data-modif="${escapeAttr(t.id)}" title="Modifier">✎</button>
    <button type="button" class="outil danger" data-suppr="${escapeAttr(t.id)}" title="Supprimer">✕</button>
  </div>`;
}

/* --- Vue « Ma semaine » --------------------------------------------------- */

function renderSemaine(){
  const avecEtat = tachesCache.map(t=> ({ t, x: etatDe(t) }));
  const enRetard = avecEtat.filter(a=> a.x.etat === 'retard' || a.x.etat === 'date_annulee');
  const semaine = avecEtat.filter(a=> (a.x.etat === 'aujourdhui' || a.x.etat === 'a_venir') && a.x.reste <= 7);
  const urgentes = enRetard.concat(semaine).sort((a, b)=> (a.x.ech || '').localeCompare(b.x.ech || ''));
  const bloquees = avecEtat.filter(a=> a.x.etat === 'attente');

  const jour = aujourdhui();
  const aVenir = datesConcert().filter(x=> x.d.date >= jour && x.d.statut !== 'annulee');
  const sansTache = aVenir.filter(x=> x.d.statut === 'validee' && tachesDeDate(x.tournee.id, x.d.id).length === 0);
  const faitesCeMois = tachesCache.filter(t=> t.fait && (t.faitLe || '').startsWith(jour.slice(0, 7))).length;

  const nl = tachesCache.find(t=> t.id === `tache-nl-${jour.slice(0, 7)}`);
  const nlSuivante = tachesCache.filter(t=> t.genre === 'newsletter' && !t.fait && t.id !== (nl && nl.id))
    .sort((a, b)=> (a.echeance || '').localeCompare(b.echeance || ''))[0];

  const stats = [
    [enRetard.length, 'en retard', enRetard.length ? 'ko' : ''],
    [semaine.length, 'dans les 7 jours', ''],
    [aVenir.length, 'dates à venir', ''],
    [faitesCeMois, 'faites ce mois-ci', ''],
  ];

  document.getElementById('vue-semaine').innerHTML = `
    <div class="stats-plates">
      ${stats.map(([n, lib, cl])=> `<div><b class="${cl}">${n}</b><span>${escapeHtml(lib)}</span></div>`).join('')}
    </div>

    ${nl ? `<div class="co-note ${nl.fait ? 'info' : ''} bloc" style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <span style="flex:1; min-width:220px;">
        <b>${escapeHtml(nl.libelle)} : ${nl.fait ? 'envoyée le ' + joli(nl.faitLe || nl.echeance) + ' ✓' : 'à écrire — échéance le ' + joli(nl.echeance)}.</b>
        ${!nl.fait ? ' Le rendez-vous mensuel : sa tâche revient chaque mois, toute seule.' : (nlSuivante ? ' La prochaine : ' + escapeHtml(nlSuivante.libelle.toLowerCase()) + ', le ' + joli(nlSuivante.echeance) + '.' : '')}
      </span>
      ${!nl.fait ? `<label class="coche" style="display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; cursor:pointer;"><input type="checkbox" data-coche="${escapeAttr(nl.id)}" style="width:17px; height:17px; accent-color:var(--ok);"> envoyée</label>` : ''}
    </div>` : ''}

    ${sansTache.length ? `<div class="co-note bloc">
      <b>${sansTache.length} date${sansTache.length > 1 ? 's' : ''} validée${sansTache.length > 1 ? 's' : ''} sans aucune tâche :</b>
      ${sansTache.slice(0, 4).map(x=> `${escapeHtml(x.d.ville || '?')} le ${escapeHtml(joli(x.d.date))}
        <button type="button" class="co-btn secondary sm" data-types="${escapeAttr(x.tournee.id + ':' + x.d.id)}" style="margin:0 8px 0 4px;">Créer les tâches types</button>`).join(' ')}
      ${sansTache.length > 4 ? `… et ${sansTache.length - 4} autres dans « Les dates ».` : ''}
      <span style="display:block; font-weight:400; margin-top:4px;">Une proposition, pas une obligation — les tâches créées se modifient et se suppriment comme les autres.</span>
    </div>` : ''}

    <div class="bloc">
      <div class="bloc-tete"><h2>À faire maintenant</h2><span class="compte">${urgentes.length} tâche${urgentes.length > 1 ? 's' : ''} — en retard, puis les sept prochains jours</span>
        <button type="button" class="co-btn primary sm" data-nouvelle-tache style="margin-left:auto;">+ Nouvelle tâche</button></div>
      <div class="co-card co-clip">
        ${urgentes.length ? urgentes.map(a=> renderTache(a.t, true)).join('')
          : '<div class="empty-hint co-vide">Rien qui presse cette semaine.</div>'}
      </div>
    </div>

    ${bloquees.length ? `<div class="co-note info bloc">
      <b>${bloquees.length} tâche${bloquees.length > 1 ? 's' : ''} attend${bloquees.length > 1 ? 'ent' : ''} une signature.</b>
      Leur date est encore en option : l'échéance est passée, mais rien ne doit sortir avant que ce soit signé.
      ${bloquees.length > 1 ? 'Elles ne comptent' : 'Elle ne compte'} donc pas comme des retards.
    </div>` : ''}

    <div class="bloc">
      <div class="bloc-tete"><h2>Les prochaines dates</h2><span class="compte">ce qui arrive, et où en est la comm</span></div>
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:12px;">
        ${aVenir.slice(0, 3).map(x=>{
          const liees = tachesDeDate(x.tournee.id, x.d.id);
          const faites = liees.filter(t=> t.fait).length;
          return `<div class="co-card co-pad">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap;">
              <b style="font-size:14.5px;">${escapeHtml(x.d.ville || '?')}</b>${statutPill(x.d.statut)}
            </div>
            <div style="font-size:12.5px; color:var(--muted); margin-bottom:8px;">${escapeHtml(joliLong(x.d.date))}${x.d.lieu ? ' · ' + escapeHtml(x.d.lieu) : ''}<br>${escapeHtml(x.tournee.nom || '')}</div>
            <div style="font-size:12px; font-weight:700; color:var(--muted);">${liees.length ? `${faites} / ${liees.length} tâche${liees.length > 1 ? 's' : ''} faites` : 'aucune tâche'} — dans ${daysBetween(jour, x.d.date)} jours</div>
          </div>`;
        }).join('') || '<div class="empty-hint co-vide">Aucune date de concert à venir.</div>'}
      </div>
    </div>
  `;
}

function statutPill(statut){
  if(statut === 'validee') return '<span class="co-pill ok">Validée</span>';
  if(statut === 'option') return '<span class="co-pill att">Option</span>';
  return '<span class="co-pill ko">Annulée</span>';
}

/* --- Vue « Tâches » : le formulaire et toute la liste --------------------- */

function optionsRattachement(choisi){
  const jour = aujourdhui();
  const futures = datesConcert().filter(x=> x.d.date >= jour && x.d.statut !== 'annulee');
  return ['<option value="">— Tâche libre (échéance en clair) —</option>']
    .concat(futures.map(x=>{
      const val = x.tournee.id + ':' + x.d.id;
      return `<option value="${escapeAttr(val)}" ${val === choisi ? 'selected' : ''}>${escapeHtml(joli(x.d.date) + ' · ' + (x.d.ville || '?') + ' — ' + (x.tournee.nom || ''))}</option>`;
    })).join('');
}

function renderTaches(){
  const enCours = tacheEnEdition ? tachesCache.find(t=> t.id === tacheEnEdition) : null;
  const rattachement = enCours && enCours.dateId ? enCours.tourneeId + ':' + enCours.dateId : '';
  const avecEtat = tachesCache.map(t=> ({ t, x: etatDe(t) }));
  const aFaire = avecEtat.filter(a=> !a.t.fait).sort((a, b)=> (a.x.ech || '9999').localeCompare(b.x.ech || '9999'));
  const faites = avecEtat.filter(a=> a.t.fait).sort((a, b)=> (b.t.faitLe || '').localeCompare(a.t.faitLe || '')).slice(0, 30);
  const types = typesTaches();

  document.getElementById('vue-taches').innerHTML = `
    <div class="co-card co-pad-lg bloc">
      <div class="co-legend">${enCours ? 'Modifier la tâche' : 'Nouvelle tâche'}</div>
      <div class="tache-form">
        <div class="champ libelle">
          <label for="fLibelle">Quoi</label>
          <input type="text" id="fLibelle" placeholder="Post d'annonce, story, interview…" value="${escapeAttr(enCours ? enCours.libelle : '')}">
        </div>
        <div class="champ">
          <label for="fRattache">Rattachée à</label>
          <select id="fRattache">${optionsRattachement(rattachement)}</select>
        </div>
        <div class="champ" id="fEcheanceLibreChamp">
          <label for="fEcheance">Échéance</label>
          <input type="date" id="fEcheance" value="${escapeAttr(enCours && !enCours.dateId ? enCours.echeance : '')}">
        </div>
        <div class="champ" id="fJChamp" hidden>
          <label for="fJ">Jours avant la date</label>
          <input type="number" id="fJ" style="width:110px;" value="${escapeAttr(enCours && enCours.dateId ? String(enCours.j || 0) : '7')}">
        </div>
        <div class="champ notes-champ">
          <label for="fNotes">Notes (libre)</label>
          <input type="text" id="fNotes" placeholder="lien Drive, angle, qui relancer…" value="${escapeAttr(enCours ? enCours.notes : '')}">
        </div>
        <button type="button" class="co-btn primary md" id="fEnregistrer">${enCours ? 'Enregistrer' : 'Ajouter'}</button>
        ${enCours ? '<button type="button" class="co-btn ghost md" id="fAnnuler">Annuler</button>' : ''}
      </div>
      <p class="co-legend-hint" style="margin:10px 0 0;">Une tâche rattachée à une date compte en jours avant le concert :
        si la date bouge, l'échéance suit ; si la date est annulée, la tâche passe en alerte au lieu de disparaître.</p>
    </div>

    <div class="bloc">
      <div class="bloc-tete"><h2>À faire</h2><span class="compte">${aFaire.length} tâche${aFaire.length > 1 ? 's' : ''}, la plus pressée d'abord</span></div>
      <div class="co-card co-clip">
        ${aFaire.length ? aFaire.map(a=> renderTache(a.t, true)).join('')
          : '<div class="empty-hint co-vide">Aucune tâche à faire — ajoute la première avec le formulaire ci-dessus.</div>'}
      </div>
    </div>

    <div class="bloc">
      <div class="bloc-tete"><h2>Faites</h2><span class="compte">les 30 dernières, la plus récente d'abord</span></div>
      <div class="co-card co-clip">
        ${faites.length ? faites.map(a=> renderTache(a.t, true)).join('')
          : '<div class="empty-hint co-vide">Rien encore — les tâches cochées se rangent ici, datées du jour.</div>'}
      </div>
    </div>

    <div class="co-card co-pad-lg bloc">
      <div class="co-legend">La newsletter</div>
      <p class="co-legend-hint" style="margin-bottom:10px;">Sa tâche revient chaque mois, toute seule — impossible à oublier.
        Régler le jour recale les newsletters pas encore envoyées.</p>
      <label style="display:flex; align-items:center; gap:9px; font-size:13.5px; font-weight:700;">
        Échéance : le
        <input type="number" id="nlJour" min="1" max="28" value="${escapeAttr(String(jourNewsletter()))}"
          style="width:74px; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; background:var(--card); color:var(--text); font-family:inherit;">
        du mois
      </label>
    </div>

    <div class="co-card co-pad-lg bloc">
      <div class="co-legend">Les tâches types</div>
      <p class="co-legend-hint">Proposées — jamais imposées — quand une date validée n'a encore aucune tâche.
        Un clic les crée toutes, puis chacune se modifie ou se supprime comme les autres.</p>
      ${types.map((e, i)=> `<div class="types-ligne">
        <span class="j">${escapeHtml(libelleJ(e.j))}</span>
        <span class="lib">${escapeHtml(e.libelle)}</span>
        <button type="button" class="outil danger" data-type-suppr="${i}" title="Retirer" style="cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted); border-radius:8px; width:28px; height:28px; font-weight:800; font-family:inherit;">✕</button>
      </div>`).join('')}
      <div style="margin-top:12px;">
        <button type="button" class="co-btn secondary sm" data-type-ajout>+ Ajouter une tâche type</button>
      </div>
    </div>
  `;

  const rattache = document.getElementById('fRattache');
  const majChamps = ()=>{
    const liee = !!rattache.value;
    document.getElementById('fEcheanceLibreChamp').hidden = liee;
    document.getElementById('fJChamp').hidden = !liee;
  };
  rattache.addEventListener('change', majChamps);
  majChamps();

  document.getElementById('fEnregistrer').addEventListener('click', enregistrerFormulaire);
  document.getElementById('nlJour').addEventListener('change', reglerJourNewsletter);
  const annuler = document.getElementById('fAnnuler');
  if(annuler) annuler.addEventListener('click', ()=>{ tacheEnEdition = null; renderTaches(); });
}

async function reglerJourNewsletter(){
  const champ = document.getElementById('nlJour');
  const jour = Math.min(28, Math.max(1, Number(champ.value) || 25));
  champ.value = jour;
  const { error } = await CurieuxDB.setCommNewsletterJour(jour);
  if(error){ alert('Enregistrement impossible :\n\n' + error.message); return; }
  reglagesCache.commNewsletterJour = jour;
  // Les newsletters pas encore envoyées se recalent sur le nouveau jour —
  // celles déjà parties gardent leur histoire telle quelle.
  for(const t of tachesCache.filter(x=> x.genre === 'newsletter' && !x.fait && x.echeance)){
    t.echeance = t.echeance.slice(0, 8) + String(jour).padStart(2, '0');
    await CurieuxDB.upsertOne('comm_taches', t);
  }
  rendre();
  montrerVue('taches');
}

async function enregistrerFormulaire(){
  const libelle = document.getElementById('fLibelle').value.trim();
  if(!libelle){ alert('Il manque le « quoi » de la tâche.'); return; }
  const rattache = document.getElementById('fRattache').value;
  const enCours = tacheEnEdition ? tachesCache.find(t=> t.id === tacheEnEdition) : null;
  const tache = enCours || { id: genId('tache'), fait: false, faitLe: '', genre: '', auteur: monEmail };
  tache.libelle = libelle;
  tache.notes = document.getElementById('fNotes').value.trim();
  if(rattache){
    const [tourneeId, dateId] = rattache.split(':');
    tache.tourneeId = tourneeId; tache.dateId = dateId;
    tache.j = Number(document.getElementById('fJ').value) || 0;
    tache.echeance = '';
  } else {
    tache.tourneeId = ''; tache.dateId = ''; tache.j = null;
    tache.echeance = document.getElementById('fEcheance').value || '';
  }
  const { error } = await CurieuxDB.upsertOne('comm_taches', tache);
  if(error){ alert('Enregistrement impossible :\n\n' + error.message); return; }
  if(!enCours) tachesCache.push(tache);
  tacheEnEdition = null;
  rendre();
  montrerVue('taches');
}

/* --- Vue « Les dates » ---------------------------------------------------- */

function renderDates(){
  const jour = aujourdhui();
  const plancher = addDaysIso(jour, -45);
  const liste = datesConcert().filter(x=> x.d.date >= plancher);

  document.getElementById('vue-dates').innerHTML = `
    <div class="co-note info bloc">
      <b>Ce qui se passe côté tournées, sans rien ressaisir.</b> Les dates viennent des tournées ; le détail
      de ce qui a bougé depuis ta dernière visite est dans le
      <a href="newsletter.html" style="color:inherit; font-weight:800;">journal des changements</a>.
    </div>
    <div class="co-card co-clip bloc">
      ${liste.length ? liste.map(x=>{
        const liees = tachesDeDate(x.tournee.id, x.d.id);
        const faites = liees.filter(t=> t.fait).length;
        const passee = x.d.date < jour;
        const cle = x.tournee.id + ':' + x.d.id;
        return `<div class="date-ligne${passee ? ' passee' : ''}">
          <span class="quand">${escapeHtml(joli(x.d.date, true))}</span>
          <span class="ou">
            <b>${escapeHtml(x.d.ville || '?')}${x.d.lieu ? ' · ' + escapeHtml(x.d.lieu) : ''}</b>
            <small>${escapeHtml(x.tournee.nom || '')}</small>
          </span>
          ${statutPill(x.d.statut)}
          <span class="resume">${liees.length ? `${faites} / ${liees.length} tâche${liees.length > 1 ? 's' : ''}` : 'aucune tâche'}</span>
          ${!passee && x.d.statut !== 'annulee' ? `<button type="button" class="co-btn secondary sm" data-tache-sur="${escapeAttr(cle)}">+ Tâche</button>` : ''}
          ${!passee && x.d.statut === 'validee' && liees.length === 0 ? `<button type="button" class="co-btn primary sm" data-types="${escapeAttr(cle)}">Tâches types</button>` : ''}
        </div>`;
      }).join('') : '<div class="empty-hint co-vide">Aucune date de concert sur la période (45 derniers jours et à venir).</div>'}
    </div>
    <p class="co-legend-hint">Une date en option se prépare mais rien n'en sort avant la signature ; une date annulée
      garde ses tâches, en alerte — on l'a peut-être déjà annoncée.</p>
  `;
}

/* --- Vue « Calendrier » --------------------------------------------------- */

function renderCalendrier(){
  if(!moisAffiche) moisAffiche = aujourdhui().slice(0, 7);
  const [an, mo] = moisAffiche.split('-').map(Number);
  const premier = new Date(an, mo - 1, 1);
  const nbJours = new Date(an, mo, 0).getDate();
  const decalage = (premier.getDay() + 6) % 7;   // semaine qui commence lundi

  const parJour = {};
  const poser = (iso, html)=> { (parJour[iso] = parJour[iso] || []).push(html); };
  datesConcert().forEach(x=>{
    const style = x.d.statut === 'annulee' ? 'annulee' : x.d.statut === 'option' ? 'option' : 'concert';
    poser(x.d.date, `<span class="pastille ${style}" title="${escapeAttr((x.d.lieu || '') + ' — ' + (x.tournee.nom || ''))}">${escapeHtml(x.d.ville || '?')}</span>`);
  });
  tachesCache.forEach(t=>{
    if(t.fait) return;
    const ech = echeanceDe(t);
    if(!ech) return;
    poser(ech, `<span class="pastille ${t.genre === 'newsletter' ? 'newsletter' : 'echeance'}" title="${escapeAttr([t.libelle, contexteDe(t)].filter(Boolean).join(' — '))}">${escapeHtml(t.libelle)}</span>`);
  });

  const cases = [];
  for(let i = 0; i < decalage; i++) cases.push('<div class="cal-case hors"></div>');
  for(let n = 1; n <= nbJours; n++){
    const iso = `${an}-${String(mo).padStart(2, '0')}-${String(n).padStart(2, '0')}`;
    cases.push(`<div class="cal-case${iso === aujourdhui() ? ' jour-j' : ''}">
      <span class="cal-num">${n}</span>${(parJour[iso] || []).join('')}
    </div>`);
  }

  document.getElementById('vue-calendrier').innerHTML = `
    <div class="bloc-tete">
      <h2>${escapeHtml(MOIS[mo - 1].charAt(0).toUpperCase() + MOIS[mo - 1].slice(1) + ' ' + an)}</h2>
      <span class="compte">concerts, échéances et newsletter</span>
      <span style="margin-left:auto; display:flex; gap:6px;">
        <button type="button" class="co-btn ghost sm" data-mois="-1">← Mois précédent</button>
        <button type="button" class="co-btn ghost sm" data-mois="1">Mois suivant →</button>
      </span>
    </div>
    <div class="co-legend-row" style="margin-bottom:12px;">
      <span><span class="pastille concert">Concert</span></span>
      <span><span class="pastille option">Option</span></span>
      <span><span class="pastille annulee">Annulée</span></span>
      <span><span class="pastille echeance">Tâche</span></span>
      <span><span class="pastille newsletter">Newsletter</span></span>
    </div>
    <div class="cal">
      ${['lun','mar','mer','jeu','ven','sam','dim'].map(x=> `<div class="cal-jour-nom">${x}</div>`).join('')}
      ${cases.join('')}
    </div>
  `;
}

/* --- Câblage -------------------------------------------------------------- */

function rendre(){
  renderSemaine();
  renderTaches();
  renderDates();
  renderCalendrier();
}

const VUES = ['semaine', 'taches', 'dates', 'calendrier'];

document.querySelector('.vues').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-vue]');
  if(!btn) return;
  document.querySelectorAll('.vues button').forEach(b=>{
    if(b === btn) b.setAttribute('aria-pressed', 'true'); else b.removeAttribute('aria-pressed');
  });
  VUES.forEach(v=>{ document.getElementById('vue-' + v).hidden = v !== btn.dataset.vue; });
});

function montrerVue(nom){
  const btn = document.querySelector(`.vues button[data-vue="${nom}"]`);
  if(btn) btn.click();
}

async function creerTachesTypes(tourneeId, dateId){
  const ref = trouverDate(tourneeId, dateId);
  if(!ref) return;
  for(const type of typesTaches()){
    const tache = { id: genId('tache'), libelle: type.libelle, notes: '', auteur: monEmail,
      echeance: '', tourneeId, dateId, j: Number(type.j) || 0, genre: '', fait: false, faitLe: '' };
    const { error } = await CurieuxDB.upsertOne('comm_taches', tache);
    if(error){ alert('Création impossible :\n\n' + error.message); return; }
    tachesCache.push(tache);
  }
  rendre();
}

document.addEventListener('click', async (e)=>{
  const coche = e.target.closest('[data-coche]');
  if(coche){
    const t = tachesCache.find(x=> x.id === coche.dataset.coche);
    if(!t) return;
    t.fait = coche.checked;
    t.faitLe = coche.checked ? aujourdhui() : '';
    const { error } = await CurieuxDB.upsertOne('comm_taches', t);
    if(error){ alert('Enregistrement impossible :\n\n' + error.message); t.fait = !t.fait; }
    rendre();
    return;
  }
  const modif = e.target.closest('[data-modif]');
  if(modif){ tacheEnEdition = modif.dataset.modif; renderTaches(); montrerVue('taches'); return; }
  const suppr = e.target.closest('[data-suppr]');
  if(suppr){
    const t = tachesCache.find(x=> x.id === suppr.dataset.suppr);
    if(!t) return;
    if(!confirm(`Supprimer « ${t.libelle} » ?`)) return;
    const { error } = await CurieuxDB.removeOne('comm_taches', t.id);
    if(error){ alert('Suppression impossible :\n\n' + error.message); return; }
    tachesCache = tachesCache.filter(x=> x.id !== t.id);
    if(tacheEnEdition === t.id) tacheEnEdition = null;
    rendre();
    return;
  }
  const types = e.target.closest('[data-types]');
  if(types){
    const [tourneeId, dateId] = types.dataset.types.split(':');
    types.disabled = true;
    await creerTachesTypes(tourneeId, dateId);
    return;
  }
  const surDate = e.target.closest('[data-tache-sur]');
  if(surDate){
    tacheEnEdition = null;
    renderTaches();
    montrerVue('taches');
    document.getElementById('fRattache').value = surDate.dataset.tacheSur;
    document.getElementById('fRattache').dispatchEvent(new Event('change'));
    document.getElementById('fLibelle').focus();
    return;
  }
  const nouvelle = e.target.closest('[data-nouvelle-tache]');
  if(nouvelle){ tacheEnEdition = null; renderTaches(); montrerVue('taches'); document.getElementById('fLibelle').focus(); return; }
  const typeAjout = e.target.closest('[data-type-ajout]');
  if(typeAjout){
    const libelle = prompt('La tâche type à proposer sur chaque nouvelle date :', 'Story de rappel');
    if(!libelle) return;
    const j = Number(prompt('Combien de jours avant le concert ? (0 = le jour même, -3 = trois jours après)', '7'));
    if(!isFinite(j)) return;
    const nouveaux = typesTaches().concat([{ libelle: libelle.trim(), j }]);
    const { error } = await CurieuxDB.setCommTachesTypes(nouveaux);
    if(error){ alert('Enregistrement impossible :\n\n' + error.message); return; }
    reglagesCache.commTachesTypes = nouveaux;
    renderTaches();
    return;
  }
  const typeSuppr = e.target.closest('[data-type-suppr]');
  if(typeSuppr){
    const nouveaux = typesTaches().filter((_, i)=> i !== Number(typeSuppr.dataset.typeSuppr));
    const { error } = await CurieuxDB.setCommTachesTypes(nouveaux);
    if(error){ alert('Enregistrement impossible :\n\n' + error.message); return; }
    reglagesCache.commTachesTypes = nouveaux;
    renderTaches();
    return;
  }
  const mois = e.target.closest('[data-mois]');
  if(mois){
    const [a, m] = moisAffiche.split('-').map(Number);
    const dm = new Date(a, m - 1 + Number(mois.dataset.mois), 1);
    moisAffiche = dm.getFullYear() + '-' + String(dm.getMonth() + 1).padStart(2, '0');
    renderCalendrier();
    return;
  }
});

(async ()=>{
  let session;
  [tourneesCache, tachesCache, reglagesCache, session] = await Promise.all([
    CurieuxDB.fetchAll('tournees'),
    CurieuxDB.fetchAll('comm_taches'),
    CurieuxDB.fetchReglages(),
    CurieuxDB.getSession(),
  ]);
  monEmail = (session && session.user && session.user.email) || '';
  await garantirNewsletters();
  rendre();
})();
</script>
</body>
</html>
