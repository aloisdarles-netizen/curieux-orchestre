<style>
  body{
    margin:0; font-family:'Host Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  .wrap{max-width:640px; margin:0 auto;}

    padding:9px 11px; border:1px solid var(--border); border-radius:6px; font-size:14px;

  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:10px;}

  .rr-list{display:flex; flex-direction:column; gap:8px;}
  .rr-row{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 14px; display:flex; align-items:flex-start; gap:12px;

  .rr-row.editing{align-items:stretch;}
  .rr-rang{
    flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--accent-tint); color:var(--accent-dark);

  .rr-info{flex:1; min-width:0;}
  .rr-name{font-weight:700; font-size:14px;}

    padding:1px 6px; border-radius:999px; background:var(--accent-tint); color:var(--accent-dark); margin-left:6px; vertical-align:middle;
  }
  .rr-actions{flex-shrink:0; display:flex; gap:6px;}
  .rr-prise{flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .rr-poignee{
    touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  .rr-poignee:active{cursor:grabbing;}
  .rr-fleches{display:flex; gap:3px;}
  .rr-fleche{
    width:26px; height:26px; padding:0; line-height:1; border:1px solid var(--border); border-radius:6px;
    background:var(--bg); color:var(--text); font-size:12px; font-weight:800; cursor:pointer; font-family:inherit;

  .rr-fleche:disabled{opacity:.28; cursor:default;}
  /* base.css impose 44 px de haut aux boutons sous 820 px de large : autant

  @media (max-width:820px){ .rr-fleche{width:34px;} }
  .rr-row.rr-drag{border-color:var(--accent); box-shadow:0 10px 28px rgba(0,0,0,.18); position:relative; z-index:5;}
  .rr-row.rr-decale{transition:transform .12s ease;}
  body.rr-glisse{user-select:none; -webkit-user-select:none;}
  .rr-ordre-hint{font-size:11.5px; color:var(--muted); margin:0 2px 8px;}

  .rr-import{
    display:flex; flex-direction:column; gap:8px; padding:12px;
    background:var(--bg); border:1px dashed var(--border); border-radius:8px;
  }
  /* Aller chercher quelqu'un dans son répertoire est l'action principale de cet
     onglet : elle prend toute la largeur et la couleur de l'accent, au lieu du
     petit bouton gris qu'on ne voyait pas. */
  .rr-btn-import{
    width:100%; background:var(--accent-solid); color:#fff; border:none; border-radius:8px;
    padding:11px 14px; font-size:13.5px; font-weight:800; cursor:pointer; font-family:inherit; text-align:center;
  }
  .rr-btn-import:hover{background:var(--accent-dark);}
  .rr-import-note{font-size:11.5px; color:var(--muted); line-height:1.35;}
  .rr-import-msg{font-size:12px; font-weight:700; line-height:1.35;}
  .rr-import-msg.ok{color:var(--ok);}
  .rr-import-msg.ko{color:var(--danger);}
  .rr-coller{
    width:100%; box-sizing:border-box; padding:9px 11px; border:1px solid var(--border); border-radius:6px;
    font-size:14px; font-family:inherit; background:var(--card); color:var(--text); resize:vertical; min-height:54px;
  }
  .rr-coller:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .rr-lien{
    align-self:flex-start; background:none; border:none; padding:0; font-family:inherit; font-size:12px;
    font-weight:700; color:var(--accent-dark); text-decoration:underline; cursor:pointer;
  }
  .rr-ou{display:flex; align-items:center; gap:10px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .rr-ou::before, .rr-ou::after{content:''; flex:1; height:1px; background:var(--border);}
  .rr-btn-edit, .rr-btn-remove, .rr-btn-cancel{
    background:none; border:1px solid var(--border); border-radius:7px; padding:6px 10px; font-size:12px; font-weight:600;
    color:var(--text); cursor:pointer; font-family:inherit;
  }
  .rr-btn-remove{color:var(--danger); border-color:var(--danger-tint);}
  .rr-btn-add{
    flex:1; background:none; border:1.5px dashed var(--border); border-radius:8px; padding:8px 10px; font-size:13px;
    font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit; text-align:left;
  }
  .rr-btn-add:hover{border-color:var(--accent); color:var(--accent-dark);}
  .rr-edit-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:10px;}
  .rr-tabs{display:flex; gap:6px;}
  .rr-tab{
    background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:6px 12px; font-size:12px;
    font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit;
  }
  .rr-tab.active{background:var(--accent-solid); color:#fff; border-color:var(--accent-solid);}
  .rr-search-results{display:flex; flex-direction:column; gap:4px; max-height:220px; overflow-y:auto;}
  .rr-result{
    padding:8px 10px; border:1px solid var(--border); border-radius:7px; cursor:pointer; background:var(--bg);
  }
  .rr-result:hover{border-color:var(--accent);}
  .rr-result-name{font-weight:700; font-size:13px;}
  .rr-result-role{font-size:11.5px; color:var(--muted);}
  .rr-new-form{display:flex; flex-direction:column; gap:4px;}
  .rr-error{font-size:12px; color:var(--danger); min-height:1em;}
  .rr-btn-save{
    align-self:flex-start; background:var(--accent-solid); color:#fff; border:none; border-radius:8px; padding:9px 16px;
    font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .rr-btn-save:hover{background:var(--accent-dark);}
  .rr-empty-hint{font-size:12px; color:var(--muted); padding:2px 4px 14px;}

  .save-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:20; display:none;
    background:var(--card); border-top:1px solid var(--border);
    box-shadow:0 -8px 24px rgba(0,0,0,.1);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .save-bar.visible{display:block;}
  .save-bar-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .save-status{font-size:12px; color:var(--muted); line-height:1.3;}
  .save-status.dirty{color:#b8792a; font-weight:700;}
  .save-status.saved{color:var(--ok); font-weight:700;}
  .save-btn{
    flex-shrink:0; padding:11px 20px; border-radius:9px; border:none; background:var(--accent-solid); color:#fff;
    font-size:13.5px; font-weight:800; cursor:pointer; font-family:inherit; transition:background .15s, opacity .15s;
  }
  .save-btn:disabled{opacity:.45; cursor:default;}
  .save-btn:not(:disabled):hover{background:var(--accent-dark);}

  @media (max-width:600px){
    input, select, textarea{ font-size:16px !important; }
  }

  @media (max-width:420px){
    .rr-row{padding:10px 11px; gap:9px;}
    .rr-btn-edit, .rr-btn-remove{padding:6px 8px;}
  }

</style>

<body>
<div class="wrap">
  <img class="brand-logo-img" alt="Curieux orchestre">
  <div id="content"><div class="co-card co-pad state-box">Chargement…</div></div>
</div>
<div class="save-bar" id="saveBar">
  <div class="save-bar-inner">
    <span class="save-status saved" id="saveStatus">Ta liste est à jour.</span>
    <button type="button" class="save-btn" id="saveBtn" disabled>Enregistrer ma liste</button>
  </div>
</div>

<script>

const RANG_MAX = 10;

/* COMBIEN DE RANGS ON MONTRE.
   ---------------------------------------------------------------------------
   Les dix rangs étaient affichés d'emblée : dix cadres en pointillés « + Ajouter
   un·e remplaçant·e », alors que presque personne n'en désigne plus de trois.
   Sur un téléphone, il fallait passer sept cadres vides pour atteindre le bas
   de la page.

   On en montre donc trois au minimum — c'est l'usage — et un de plus que le
   dernier rempli, pour qu'il y ait toujours une place libre où ajouter
   quelqu'un sans chercher un bouton. Jusqu'à dix, comme avant. */
function rangsVisibles(){
  const plusHaut = state.items.reduce((m, it)=> Math.max(m, Number(it.rang) || 0), 0);
  const n = Math.min(RANG_MAX, Math.max(3, plusHaut + 1, state.editingRang || 0));
  return Array.from({ length: n }, (_, i)=> i + 1);
}

// Les remplaçant·es dans l'ordre, sans trou : c'est la liste sur laquelle on
// travaille pour réordonner.
function itemsOrdonnes(){
  return state.items.slice().sort((a, b)=> (Number(a.rang) || 0) - (Number(b.rang) || 0));
}

/* DÉPLACER QUELQU'UN D'UN RANG À UN AUTRE.
   ---------------------------------------------------------------------------
   Un rang n'est pas une étiquette mais une POSITION dans un ordre de
   préférence : passer le troisième en premier doit décaler les deux autres, pas
   échanger deux noms. On réordonne donc la liste, puis on renumérote de 1 à n.

   Les trous éventuels — un rang 1 et un rang 5, hérités d'une saisie ancienne —
   se referment à la première réorganisation. Une liste de préférence à trous ne
   veut rien dire : « la cinquième personne à appeler » quand il n'y en a que
   deux ne désigne rien. */
function deplacer(deRang, versRang){
  const ordre = itemsOrdonnes();
  const depuis = ordre.findIndex(it=> Number(it.rang) === Number(deRang));
  if(depuis < 0) return false;
  const vers = Math.max(0, Math.min(ordre.length - 1, Number(versRang) - 1));
  if(vers === depuis) return false;
  const [pris] = ordre.splice(depuis, 1);
  ordre.splice(vers, 0, pris);
  state.items = ordre.map((it, i)=> Object.assign({}, it, { rang: i + 1 }));
  return true;
}

// Monter ou descendre d'un cran : on raisonne sur la POSITION dans la liste
// ordonnée, pas sur le numéro de rang, sinon une liste à trous ne bougerait pas.
function positionDe(rang){
  return itemsOrdonnes().findIndex(it=> Number(it.rang) === Number(rang));
}
function deplacerDe(rang, pas){
  const p = positionDe(rang);
  if(p < 0) return false;
  return deplacer(rang, p + 1 + pas);
}
let state = { token:null, person:null, personType:null, items:[], roster:[], editingRang:null, editTab:'search' };

function showState(html){
  document.getElementById('content').innerHTML = `<div class="co-card co-pad state-box">${html}</div>`;
}

async function init(){
  if(!window.supabase){ showState("La librairie n'a pas pu être chargée. Réessaie dans un instant."); return; }
  const token = new URLSearchParams(location.search).get('token');
  if(!token){ showState("Lien invalide — il manque le jeton d'accès."); return; }

  // Le jeton peut être permanent ou lié à une demande de dispo : on demande
  // simplement à qui il appartient. Se verrouiller sur dispo_demandes refusait
  // les liens personnels permanents.
  const demande = await CurieuxDB.resolvePersonToken(token);
  if(!demande){ showState("Ce lien n'est plus valide. Contacte la production pour en obtenir un nouveau."); return; }

  // Voir C1 : cette page demandait auparavant TOUT le répertoire
  // (select('*') sur musiciens et techniciens) alors qu'elle n'affiche que le
  // nom et l'instrument. Elle reçoit désormais un annuaire réduit aux noms.
  const [person, roster, items] = await Promise.all([
    CurieuxDB.getOwnPersonByToken(token, demande.person_type, demande.person_id),
    CurieuxDB.getRosterForPicker(token),
    CurieuxDB.getRemplacantPrefsByToken(token)
  ]);
  if(!person){ showState("Cette fiche n'existe plus."); return; }
  const personRes = { data: person };

  state.token = token;
  state.person = personRes.data;
  // Le prénom pour la barre de l'application : la coque l'affiche en bout de
  // barre, et sans lui une arrivée directe sur cet écran ne dirait pas de qui
  // est l'espace qu'on regarde.
  if(window.CurieuxAppMusicien) CurieuxAppMusicien.etat({ prenom: (state.person && state.person.prenom) || '' });
  state.personType = demande.person_type;
  state.items = items || [];

  if((state.person.statut_poste || 'titulaire') !== 'titulaire'){
    showState("Cette page est réservée aux titulaires — les remplaçant·es n'ont pas de liste à gérer ici.");
    return;
  }

  state.roster = roster;

  // Le retour vers l'espace est posé par injecterRetourEspace (ui-helpers) :
  // un seul bouton, le même sur les quatre pages personnelles.

  render();
}

function nameKey(nom, prenom){ return `${(nom||'').trim().toLowerCase()}|${(prenom||'').trim().toLowerCase()}`; }

function isDuplicateName(nom, prenom, excludeRang){
  const target = nameKey(nom, prenom);
  if(state.roster.some(p=> nameKey(p.nom, p.prenom) === target)) return true;
  return state.items.some(it=> it.rang !== excludeRang && it.source === 'new' && nameKey(it.nom, it.prenom) === target);
}

let hasUnsavedChanges = false;
// Enregistrement volontaire (bouton), pas d'autosave à la frappe — sans ça, fermer
// l'onglet par réflexe perdrait silencieusement ce qui vient d'être classé.
window.addEventListener('beforeunload', (e)=>{
  if(!hasUnsavedChanges) return;
  e.preventDefault();
  e.returnValue = '';
});

function markDirty(){
  const status = document.getElementById('saveStatus');
  const btn = document.getElementById('saveBtn');
  status.textContent = 'Modifications non enregistrées.';
  status.className = 'save-status dirty';
  btn.disabled = false;
  hasUnsavedChanges = true;
}

async function doSave(){
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  const { error } = await CurieuxDB.upsertRemplacantPrefsByToken(state.token, state.items);
  btn.textContent = 'Enregistrer ma liste';
  if(error){
    status.textContent = "Erreur d'enregistrement — réessaie.";
    status.className = 'save-status dirty';
    btn.disabled = false;
  } else {
    status.textContent = '✓ Liste enregistrée.';
    status.className = 'save-status saved';
    hasUnsavedChanges = false;
  }
}
document.getElementById('saveBtn').addEventListener('click', doSave);

function rosterLabel(item){
  return state.roster.find(p=> p.id === item.personId && p.personType === item.personType) || null;
}

function rowHtml(rang){
  if(state.editingRang === rang) return editFormHtml(rang);

  const item = state.items.find(it=> it.rang === rang);
  if(!item){
    return `
      <div class="rr-row">
        <div class="rr-rang">${rang}</div>
        <button type="button" class="rr-btn-add" data-edit="${rang}">+ Ajouter un·e remplaçant·e</button>
      </div>
    `;
  }
  const roster = item.source === 'roster' ? rosterLabel(item) : null;
  const name = roster ? fullName(roster) : `${item.prenom || ''} ${item.nom || ''}`.trim();
  const sub = roster ? roster.roleLabel : [item.telephone, item.email].filter(Boolean).join(' · ');
  const tag = item.source === 'new' ? `<span class="rr-tag-new">Pas encore au répertoire</span>` : '';

  // À une seule personne, il n'y a rien à réordonner : ni poignée ni flèches,
  // pour ne pas encombrer la ligne d'outils qui ne servent à rien.
  const ordre = itemsOrdonnes();
  const pos = ordre.findIndex(it=> Number(it.rang) === rang);
  const reordonnable = ordre.length > 1;
  const poignee = reordonnable
    ? ` rr-poignee" data-poignee="${rang}" role="button" tabindex="-1" aria-label="Glisser pour changer le rang" title="Glisser pour changer le rang`
    : '';
  const fleches = reordonnable ? `
        <div class="rr-fleches">
          <button type="button" class="rr-fleche" data-monter="${rang}" ${pos <= 0 ? 'disabled' : ''} aria-label="Monter d'un rang" title="Monter">&#8593;</button>
          <button type="button" class="rr-fleche" data-descendre="${rang}" ${pos >= ordre.length - 1 ? 'disabled' : ''} aria-label="Descendre d'un rang" title="Descendre">&#8595;</button>
        </div>` : '';
  return `
    <div class="rr-row filled" data-rang="${rang}">
      <div class="rr-prise">
        <div class="rr-rang${poignee}">${rang}</div>${fleches}
      </div>
      <div class="rr-info">
        <div class="rr-name">${escapeHtml(name || 'Sans nom')} ${tag}</div>
        <div class="rr-sub">${escapeHtml(sub || '')}</div>
      </div>
      <div class="rr-actions">
        <button type="button" class="rr-btn-edit" data-edit="${rang}">Modifier</button>
        <button type="button" class="rr-btn-remove" data-remove="${rang}">Retirer</button>
      </div>
    </div>
  `;
}

function editFormHtml(rang){
  const tab = state.editTab || 'search';
  const item = state.items.find(it=> it.rang === rang);
  const newVals = item && item.source === 'new' ? item : { prenom:'', nom:'', telephone:'', email:'' };
  return `
    <div class="rr-row editing">
      <div class="rr-rang">${rang}</div>
      <div class="rr-edit-body">
        <div class="rr-tabs">
          <button type="button" class="rr-tab ${tab==='search'?'active':''}" data-tab="search">Dans le répertoire</button>
          <button type="button" class="rr-tab ${tab==='new'?'active':''}" data-tab="new">Quelqu'un d'autre</button>
        </div>
        ${tab === 'search' ? `
          <input type="text" id="rrSearchInput" placeholder="Chercher un nom…" autocomplete="off">
          <div id="rrSearchResults" class="rr-search-results"></div>
          <div class="rr-ou">pas dans l'orchestre ?</div>
          <button type="button" class="rr-btn-import" data-contacts="${rang}">${LIBELLE_CONTACTS}</button>
        ` : `
          <div class="rr-new-form">
            ${blocContactsHtml(rang)}
            <div class="field-row">
              <div class="field"><label for="rrNewPrenom">Prénom</label><input type="text" id="rrNewPrenom" value="${escapeAttr(newVals.prenom || '')}"></div>
              <div class="field"><label for="rrNewNom">Nom</label><input type="text" id="rrNewNom" value="${escapeAttr(newVals.nom || '')}"></div>
            </div>
            <div class="field-row">
              <div class="field"><label for="rrNewTelephone">Téléphone</label><input type="tel" id="rrNewTelephone" value="${escapeAttr(newVals.telephone || '')}"></div>
              <div class="field"><label for="rrNewEmail">Email (facultatif)</label><input type="email" id="rrNewEmail" value="${escapeAttr(newVals.email || '')}"></div>
            </div>
            <div id="rrNewError" class="rr-error"></div>
            <button type="button" class="rr-btn-save" data-save-new="${rang}">Ajouter au rang ${rang}</button>
          </div>
        `}
        <button type="button" class="rr-btn-cancel" data-cancel="${rang}" style="align-self:flex-start;">Annuler</button>
      </div>
    </div>
  `;
}

function render(){
  document.getElementById('content').innerHTML = `
    <h1>Mes remplaçant·es</h1>
    <div class="identity-banner">
      Bonjour <strong>${escapeHtml(fullName(state.person))}</strong> — choisis ici tes remplaçant·es par ordre de préférence
      (rang 1 = la personne à contacter en premier, jusqu'à 10).
      <div class="identity-note">Cette liste t'est personnelle et permanente : reviens-y quand tu veux pour la mettre à jour.</div>
    </div>
    ${itemsOrdonnes().length > 1 ? `<div class="rr-ordre-hint">Pour changer l'ordre : glisse la pastille du rang, ou utilise les flèches.</div>` : ''}
    <div class="rr-list" id="rrList">${rangsVisibles().map(rowHtml).join('')}</div>
    <div class="rr-empty-hint">Une personne pas encore au répertoire ? Onglet « Quelqu'un d'autre »${PIOCHE_CONTACTS ? ' : ton téléphone remplit sa fiche depuis tes contacts.' : ' : nom, prénom et téléphone suffisent.'}</div>
  `;
  bindRowEvents();
  document.getElementById('saveBar').classList.add('visible');
}

function bindRowEvents(){
  document.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.editingRang = parseInt(btn.dataset.edit, 10);
      const existing = state.items.find(it=> it.rang === state.editingRang);
      state.editTab = existing && existing.source === 'new' ? 'new' : 'search';
      render();
    });
  });
  document.querySelectorAll('[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rang = parseInt(btn.dataset.remove, 10);
      state.items = state.items.filter(it=> it.rang !== rang);
      markDirty();
      render();
    });
  });
  document.querySelectorAll('[data-cancel]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.editingRang = null;
      render();
    });
  });
  document.querySelectorAll('[data-tab]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.editTab = btn.dataset.tab;
      render();
    });
  });
  document.querySelectorAll('[data-save-new]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const rang = parseInt(btn.dataset.saveNew, 10);
      const prenom = document.getElementById('rrNewPrenom').value.trim();
      const nom = document.getElementById('rrNewNom').value.trim();
      const telephone = document.getElementById('rrNewTelephone').value.trim();
      const email = document.getElementById('rrNewEmail').value.trim();
      const errEl = document.getElementById('rrNewError');
      if(!nom || !prenom || !telephone){
        errEl.textContent = 'Prénom, nom et téléphone sont obligatoires.';
        return;
      }
      if(isDuplicateName(nom, prenom, rang)){
        errEl.textContent = `${prenom} ${nom} existe déjà — choisis-la/le dans l'onglet « Dans le répertoire » plutôt que de le/la recréer.`;
        return;
      }
      state.items = state.items.filter(it=> it.rang !== rang);
      state.items.push({ rang, source:'new', prenom, nom, telephone, email });
      state.editingRang = null;
      markDirty();
      render();
    });
  });

  document.querySelectorAll('[data-monter]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(deplacerDe(parseInt(btn.dataset.monter, 10), -1)){ markDirty(); render(); }
    });
  });
  document.querySelectorAll('[data-descendre]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(deplacerDe(parseInt(btn.dataset.descendre, 10), 1)){ markDirty(); render(); }
    });
  });

  const searchInput = document.getElementById('rrSearchInput');
  if(searchInput){
    searchInput.addEventListener('input', ()=> renderRosterSearchResults(searchInput.value));
    searchInput.focus();
  }

  brancherContacts();
  activerGlisser();
}

/* GLISSER POUR RÉORDONNER, AU DOIGT.
   ---------------------------------------------------------------------------
   Le glisser-déposer natif (draggable="true") ne répond pas au toucher : sur
   téléphone, il ne se passe rien du tout. On passe donc par les événements de
   pointeur, qui couvrent souris, doigt et stylet avec le même code.

   La pastille du rang sert de poignée : c'est elle qui affiche la position,
   c'est donc elle qu'on attrape. Les flèches font la même chose au clic — un
   glisser précis n'est pas toujours possible (écran étroit, main occupée,
   lecteur d'écran) et le classement ne doit pas en dépendre. */
const SEUIL_GLISSER = 6;   // px avant de considérer que c'est un glisser et pas un appui
const ECART_LIGNES = 8;    // le « gap » de .rr-list, à compenser dans les décalages
let glisse = null;

function activerGlisser(){
  const liste = document.getElementById('rrList');
  if(!liste) return;
  liste.querySelectorAll('[data-poignee]').forEach(poignee=>{
    poignee.addEventListener('pointerdown', e=> commencerGlisser(e, poignee, liste));
  });
}

function commencerGlisser(e, poignee, liste){
  if(glisse) return;
  if(e.button != null && e.button > 0) return;
  const lignes = Array.from(liste.querySelectorAll('.rr-row.filled'));
  if(lignes.length < 2) return;
  const ligne = poignee.closest('.rr-row');
  const depuis = lignes.indexOf(ligne);
  if(depuis < 0) return;
  const rects = lignes.map(l=> l.getBoundingClientRect());
  glisse = {
    poignee, ligne, lignes, rects, depuis, cible: depuis,
    y0: e.clientY, pointerId: e.pointerId, actif: false,
    hauteur: rects[depuis].height + ECART_LIGNES
  };
  try{ poignee.setPointerCapture(e.pointerId); }catch(err){}
  // Sur la fenêtre : l'écoute reste valable même si la capture du pointeur
  // échoue ou si le doigt sort de la poignée.
  window.addEventListener('pointermove', suivreGlisser, { passive:false });
  window.addEventListener('pointerup', finirGlisser);
  window.addEventListener('pointercancel', annulerGlisser);
}

function suivreGlisser(e){
  if(!glisse || e.pointerId !== glisse.pointerId) return;
  const dy = e.clientY - glisse.y0;
  if(!glisse.actif){
    if(Math.abs(dy) < SEUIL_GLISSER) return;
    glisse.actif = true;
    glisse.ligne.classList.add('rr-drag');
    document.body.classList.add('rr-glisse');
  }
  if(e.cancelable) e.preventDefault();

  const { rects, depuis } = glisse;
  const centre = rects[depuis].top + rects[depuis].height / 2 + dy;
  let cible = depuis;
  rects.forEach((r, i)=>{
    if(i === depuis) return;
    const milieu = r.top + r.height / 2;
    if(i < depuis && centre < milieu) cible = Math.min(cible, i);
    if(i > depuis && centre > milieu) cible = Math.max(cible, i);
  });
  glisse.cible = cible;

  glisse.ligne.style.transform = `translateY(${dy}px)`;
  glisse.lignes.forEach((l, i)=>{
    if(i === depuis) return;
    l.classList.add('rr-decale');
    let d = 0;
    if(cible > depuis && i > depuis && i <= cible) d = -glisse.hauteur;
    if(cible < depuis && i >= cible && i < depuis) d = glisse.hauteur;
    l.style.transform = d ? `translateY(${d}px)` : '';
  });
}

function rangerGlisser(){
  if(!glisse) return null;
  const g = glisse;
  glisse = null;
  window.removeEventListener('pointermove', suivreGlisser, { passive:false });
  window.removeEventListener('pointerup', finirGlisser);
  window.removeEventListener('pointercancel', annulerGlisser);
  try{ g.poignee.releasePointerCapture(g.pointerId); }catch(err){}
  g.lignes.forEach(l=>{ l.style.transform = ''; l.classList.remove('rr-decale', 'rr-drag'); });
  document.body.classList.remove('rr-glisse');
  return g;
}

function annulerGlisser(){ rangerGlisser(); }

function finirGlisser(){
  const g = rangerGlisser();
  if(!g || !g.actif || g.cible === g.depuis) return;
  if(deplacer(Number(g.ligne.dataset.rang), g.cible + 1)){ markDirty(); render(); }
}

/* ALLER CHERCHER QUELQU'UN DANS LE RÉPERTOIRE DU TÉLÉPHONE.
   ---------------------------------------------------------------------------
   Ce qu'on veut : « je choisis la personne dans mes contacts, l'outil remplit
   la fiche ». C'est exactement ce que fait navigator.contacts.select() — mais
   cette interface n'existe que sur Chrome et Samsung Internet sous Android.
   Ni Safari iOS, ni aucun navigateur d'ordinateur ne l'implémentent : une page
   web n'a pas le droit d'y lire le carnet d'adresses. Ce n'est pas un réglage
   à changer, c'est une limite du système.

   D'où trois chemins, du plus direct au plus laborieux :
   1. le sélecteur natif quand il existe (Android) — un geste, tout est rempli ;
   2. le collage : on colle un numéro ou une ligne « Camille Roussel 06 … »
      recopiée depuis Contacts, un message ou un mail, et l'outil répartit
      nom / téléphone / e-mail dans les bons champs. Marche partout ;
   3. la fiche .vcf, pour qui connaît déjà « Partager le contact ».

   Dans tous les cas on ne fait que REMPLIR le formulaire : la personne relit
   et valide. On n'ajoute jamais un contact sans qu'il soit passé sous les yeux
   de quelqu'un. */
const PIOCHE_CONTACTS = !!(window.isSecureContext && navigator.contacts && navigator.contacts.select);
const LIBELLE_CONTACTS = PIOCHE_CONTACTS ? 'Chercher dans mes contacts' : 'Ajouter quelqu\'un hors répertoire';

function blocContactsHtml(rang){
  return `
    <div class="rr-import">
      ${PIOCHE_CONTACTS ? `
        <button type="button" class="rr-btn-import" data-contacts="${rang}">Chercher dans mes contacts</button>
        <div class="rr-import-note">Ton téléphone ouvre ton répertoire : tu choisis la personne, les champs se remplissent tout seuls. Rien n'est ajouté tant que tu n'as pas validé.</div>
        <div class="rr-ou">ou</div>
      ` : `
        <div class="rr-import-note">Sur iPhone et sur ordinateur, le navigateur n'a pas le droit d'ouvrir ton répertoire : c'est une limite du système. Le plus rapide : dans Contacts, maintiens le numéro appuyé pour le copier, puis colle-le ici.</div>
      `}
      <div class="field">
        <label for="rrColler">Coller un contact</label>
        <textarea id="rrColler" class="rr-coller" rows="2" placeholder="Camille Roussel 06 12 34 56 78" autocomplete="off"></textarea>
      </div>
      <div class="rr-import-note">Nom, numéro, e-mail : ce qui est reconnu se range tout seul dans les champs ci-dessous.</div>
      <button type="button" class="rr-lien" data-vcf="${rang}">Ou importer une fiche contact (.vcf)</button>
      <input type="file" id="rrVcf" accept=".vcf,text/vcard,text/x-vcard,text/directory" hidden>
      <div id="rrImportMsg" class="rr-import-msg"></div>
    </div>
  `;
}

/* Un numéro reste lisible tel que la personne l'a noté : on se contente
   d'unifier les séparateurs et de retirer le « (0) » de « +33 (0)6 … », qui
   fait doublon avec l'indicatif et casse les appels directs. */
function normaliserTel(v){
  return String(v || '')
    .replace(/\(\s*0\s*\)/g, '')
    .replace(/[^\d+]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function lireFichier(f){
  if(f.text) return f.text();
  return new Promise((ok, ko)=>{
    const r = new FileReader();
    r.onload = ()=> ok(r.result);
    r.onerror = ()=> ko(r.error || new Error('lecture impossible'));
    r.readAsText(f);
  });
}

// Une ligne de vCard peut être repliée : la suite commence par une espace.
function deplierVcf(texte){
  const lignes = [];
  String(texte || '').replace(/\r\n?/g, '\n').split('\n').forEach(l=>{
    if(/^[ \t]/.test(l) && lignes.length) lignes[lignes.length - 1] += l.slice(1);
    else lignes.push(l);
  });
  return lignes;
}

// Découpe sur les « ; » non échappés, sans lookbehind : les iPhone d'avant
// iOS 16.4 ne la connaissent pas et le script entier tomberait.
function couperVcf(valeur){
  const bouts = [''];
  let echap = false;
  for(const c of String(valeur || '')){
    if(echap){ bouts[bouts.length - 1] += '\\' + c; echap = false; continue; }
    if(c === '\\'){ echap = true; continue; }
    if(c === ';'){ bouts.push(''); continue; }
    bouts[bouts.length - 1] += c;
  }
  return bouts;
}

function nettoyerVcf(v){
  return String(v || '').replace(/\\n/gi, ' ').replace(/\\([,;\\])/g, '$1').replace(/\s+/g, ' ').trim();
}

function lireVcf(texte){
  const fiche = { prenom:'', nom:'', telephone:'', email:'' };
  let dedans = false, nomAffiche = '', nomVu = false;
  for(const brute of deplierVcf(texte)){
    const ligne = brute.trim();
    if(/^BEGIN:VCARD$/i.test(ligne)){ if(dedans) break; dedans = true; continue; }
    if(/^END:VCARD$/i.test(ligne)){ if(dedans) break; continue; }
    if(!dedans) continue;
    const sep = ligne.indexOf(':');
    if(sep < 0) continue;
    // « item1.TEL;TYPE=CELL » : on ne garde que le nom de la propriété.
    const prop = ligne.slice(0, sep).split(';')[0].split('.').pop().toUpperCase();
    const valeur = ligne.slice(sep + 1);
    if(prop === 'N' && !nomVu){
      const parts = couperVcf(valeur);
      fiche.nom = nettoyerVcf(parts[0]);
      fiche.prenom = nettoyerVcf(parts[1]);
      nomVu = true;
    } else if(prop === 'FN' && !nomAffiche){ nomAffiche = nettoyerVcf(valeur); }
    else if(prop === 'TEL' && !fiche.telephone){ fiche.telephone = normaliserTel(nettoyerVcf(valeur)); }
    else if(prop === 'EMAIL' && !fiche.email){ fiche.email = nettoyerVcf(valeur); }
  }
  // Certaines fiches n'ont qu'un nom affiché (« FN:Camille Roussel ») : on le
  // coupe au premier blanc, prénom d'abord, comme dans le reste de l'outil.
  if(!fiche.prenom && !fiche.nom && nomAffiche){
    const bouts = nomAffiche.split(' ');
    fiche.prenom = bouts.shift() || '';
    fiche.nom = bouts.join(' ');
  }
  return fiche;
}

/* Les mots que les répertoires collent devant un numéro quand on le copie
   (« Mobile », « Tél. », « Domicile »...) : ce ne sont pas des noms. */
const MOTS_ETIQUETTE = /^(t[ée]l|t[ée]l[ée]phone|mobile|portable|dom|domicile|maison|bureau|travail|perso|principal|fax|mail|e-?mail|courriel|contact|num[ée]ro|num)$/i;

/* LIRE CE QU'ON A COLLÉ.
   ---------------------------------------------------------------------------
   On accepte tout ce qui sort d'un téléphone : une fiche vCard entière, un
   numéro seul, « Camille Roussel 06 12 34 56 78 », une signature de mail. On
   repère d'abord l'e-mail, puis le numéro, et ce qui reste fait le nom. */
function lireColle(texte){
  const brut = String(texte || '').replace(/\s+/g, ' ').trim();
  if(!brut) return null;
  if(/BEGIN:VCARD/i.test(brut)) return lireVcf(texte);

  const fiche = { prenom:'', nom:'', telephone:'', email:'' };
  let reste = brut;

  const mail = reste.match(/[^\s<>(),;:"]+@[^\s<>(),;:"]+\.[A-Za-z]{2,}/);
  if(mail){ fiche.email = mail[0]; reste = reste.replace(mail[0], ' '); }

  // Un vrai numéro, c'est au moins huit chiffres : en dessous on tomberait sur
  // un numéro de pupitre ou une année.
  const tel = reste.match(/\+?\d[\d\s.\-\/()]{6,}\d/);
  if(tel && tel[0].replace(/\D/g, '').length >= 8){
    fiche.telephone = normaliserTel(tel[0]);
    reste = reste.replace(tel[0], ' ');
  }

  const mots = reste.split(/[^A-Za-zÀ-ÖØ-öø-ÿ'’\-]+/)
    .filter(m=> /[A-Za-zÀ-ÖØ-öø-ÿ]/.test(m) && !MOTS_ETIQUETTE.test(m));

  // « ROUSSEL Camille » : beaucoup de répertoires rangent le nom en capitales
  // et le mettent devant. On ne s'y fie que si le reste ne l'est pas.
  const capitale = m=> m.length > 1 && m === m.toUpperCase() && m !== m.toLowerCase();
  if(mots.length > 1 && capitale(mots[0]) && !capitale(mots[mots.length - 1])){
    fiche.nom = mots.shift();
    fiche.prenom = mots.join(' ');
  } else {
    fiche.prenom = mots.shift() || '';
    fiche.nom = mots.join(' ');
  }
  return fiche;
}

function ficheDepuisContact(c){
  const nom = lireColle(String((c.name && c.name[0]) || '')) || { prenom:'', nom:'' };
  return {
    prenom: nom.prenom,
    nom: nom.nom,
    telephone: normaliserTel((c.tel && c.tel[0]) || ''),
    email: (c.email && c.email[0]) || ''
  };
}

/* Le sélecteur exige un geste de l'utilisateur encore « frais » : on l'appelle
   donc en tout premier dans le gestionnaire de clic. L'ancienne version
   interrogeait d'abord getProperties(), et quand cet appel échouait on
   retombait sur le sélecteur de fichiers — après deux attentes, le navigateur
   refusait aussi de l'ouvrir : le bouton ne faisait plus rien du tout. */
async function lancerSelecteur(rang){
  try{
    const choix = await navigator.contacts.select(['name', 'tel', 'email'], { multiple:false });
    if(!choix || !choix.length) return;   // annulé : rien à signaler
    remplirDepuisFiche(ficheDepuisContact(choix[0]), rang, false);
  }catch(err){
    poserMessage("Ton téléphone n'a pas ouvert le répertoire. Copie le numéro depuis Contacts et colle-le ci-dessous.", 'ko');
    const zone = document.getElementById('rrColler');
    if(zone) zone.focus();
  }
}

function poserMessage(texte, ton){
  const el = document.getElementById('rrImportMsg');
  if(!el) return;
  el.textContent = texte || '';
  el.className = 'rr-import-msg' + (ton ? ' ' + ton : '');
}

function resumeFiche(f){
  return [`${f.prenom || ''} ${f.nom || ''}`.trim(), f.telephone, f.email].filter(Boolean).join(' · ');
}

/* fusion = true : on ne touche qu'aux champs que le collage a reconnus, pour
   ne pas effacer ce que la personne vient de taper à côté.
   fusion = false : la fiche est complète (sélecteur, .vcf), elle remplace tout
   — y compris les blancs, sinon l'e-mail du contact précédent resterait collé
   au nom du suivant, et on écrirait à la mauvaise personne. */
function remplirDepuisFiche(fiche, rang, fusion){
  const poser = (id, val)=>{
    const el = document.getElementById(id);
    if(!el) return;
    if(!fusion || val) el.value = val || '';
  };
  poser('rrNewPrenom', fiche.prenom);
  poser('rrNewNom', fiche.nom);
  poser('rrNewTelephone', fiche.telephone);
  poser('rrNewEmail', fiche.email);

  const complet = `${fiche.prenom || ''} ${fiche.nom || ''}`.trim();
  const resume = resumeFiche(fiche) || 'rien de reconnaissable';
  const telChamp = document.getElementById('rrNewTelephone');
  const telPose = telChamp ? telChamp.value.trim() : fiche.telephone;

  if(fiche.nom && fiche.prenom && isDuplicateName(fiche.nom, fiche.prenom, rang)){
    poserMessage(`${complet} est déjà au répertoire — prends-la/le dans l'onglet « Dans le répertoire ».`, 'ko');
  } else if(!telPose){
    poserMessage(`Repéré : ${resume}. Il manque le téléphone : complète-le ci-dessous.`, 'ko');
  } else {
    poserMessage(`Repéré : ${resume}. Vérifie, puis ajoute au rang ${rang}.`, 'ok');
  }
  const errEl = document.getElementById('rrNewError');
  if(errEl) errEl.textContent = '';
}

function brancherContacts(){
  /* Le bouton existe dans les deux onglets : depuis « Dans le répertoire », il
     bascule d'abord sur « Quelqu'un d'autre ». Ce basculement est synchrone, le
     geste de l'utilisateur reste donc valable pour ouvrir le sélecteur dans la
     foulée — c'était tout l'objet de la manœuvre : une seule tape pour arriver
     dans son carnet d'adresses. */
  document.querySelectorAll('[data-contacts]').forEach(bouton=>{
    bouton.addEventListener('click', ()=>{
      const rang = parseInt(bouton.dataset.contacts, 10);
      if(state.editTab !== 'new'){ state.editTab = 'new'; render(); }
      if(PIOCHE_CONTACTS){ lancerSelecteur(rang); return; }
      const zone = document.getElementById('rrColler');
      if(zone) zone.focus();
    });
  });

  const zone = document.getElementById('rrColler');
  const bloc = document.querySelector('[data-vcf]');
  const rang = bloc ? parseInt(bloc.dataset.vcf, 10) : null;
  if(zone && rang){
    const traiter = ()=>{
      const fiche = lireColle(zone.value);
      if(!fiche) return;
      if(!fiche.prenom && !fiche.nom && !fiche.telephone && !fiche.email){
        poserMessage("Rien de reconnu là-dedans — saisis les champs à la main.", 'ko');
        return;
      }
      remplirDepuisFiche(fiche, rang, true);
    };
    // Le contenu n'est pas encore dans le champ au moment de l'événement paste.
    zone.addEventListener('paste', ()=> setTimeout(traiter, 0));
    zone.addEventListener('change', traiter);
  }

  const champ = document.getElementById('rrVcf');
  if(!bloc || !champ || !rang) return;
  bloc.addEventListener('click', ()=> champ.click());

  champ.addEventListener('change', async ()=>{
    const f = champ.files && champ.files[0];
    if(!f) return;
    try{
      const fiche = lireVcf(await lireFichier(f));
      if(!fiche.prenom && !fiche.nom && !fiche.telephone){
        poserMessage("Cette fiche ne contient pas de nom lisible — saisis la personne à la main.", 'ko');
      } else {
        remplirDepuisFiche(fiche, rang, false);
      }
    }catch(err){
      poserMessage("Fiche illisible — saisis la personne à la main.", 'ko');
    }
    champ.value = '';
  });
}

function renderRosterSearchResults(query){
  const holder = document.getElementById('rrSearchResults');
  if(!holder) return;
  const q = (query || '').toLowerCase().trim();
  if(!q){ holder.innerHTML = ''; return; }

  const usedRosterKeys = new Set(
    state.items.filter(it=> it.source === 'roster' && it.rang !== state.editingRang).map(it=> `${it.personType}:${it.personId}`)
  );
  const results = state.roster.filter(p=>{
    if(p.id === state.person.id && p.personType === state.personType) return false;
    if(usedRosterKeys.has(`${p.personType}:${p.id}`)) return false;
    const haystack = [p.prenom, p.nom, p.roleLabel].filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  }).slice(0, 8);

  if(!results.length){
    holder.innerHTML = `<div class="rr-empty-hint">Aucun résultat au répertoire de l'orchestre${PIOCHE_CONTACTS ? ' — va la chercher dans tes contacts, juste en dessous.' : ' — ajoute-la juste en dessous.'}</div>`;
    return;
  }
  holder.innerHTML = results.map(p=> `
    <div class="rr-result" data-person-id="${escapeAttr(p.id)}" data-person-type="${escapeAttr(p.personType)}">
      <div class="rr-result-name">${escapeHtml(fullName(p))}</div>
      <div class="rr-result-role">${escapeHtml(p.roleLabel)}</div>
    </div>
  `).join('');
  holder.querySelectorAll('.rr-result').forEach(el=>{
    el.addEventListener('click', ()=>{
      const rang = state.editingRang;
      state.items = state.items.filter(it=> it.rang !== rang);
      state.items.push({ rang, source:'roster', personId: el.dataset.personId, personType: el.dataset.personType });
      state.editingRang = null;
      markDirty();
      render();
    });
  });
}

applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);
init();
</script>
</body>
