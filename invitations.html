<link rel="stylesheet" href="assets/base.css">
<style>
  .wrap{max-width:min(1320px, 97vw); margin:0 auto;}

  /* --- La barre du haut : projet, date, et les deux vues ------------------ */
  .inv-barre{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; margin-bottom:14px;}
  .inv-barre .co-select{min-width:200px;}
  .inv-spacer{flex:1 1 auto;}

  /* La date, en grand. C'est le premier geste de chaque session de saisie et
     le seul qu'on refait entre deux séries de noms : un menu déroulant de la
     taille des autres champs se cherchait à la souris. Deux flèches encadrent
     le menu — sur une tournée de vingt-deux concerts, on avance d'une date au
     lieu de rouvrir la liste et d'y retrouver sa place. */
  .inv-date-nav{display:flex; align-items:stretch; gap:0;}
  .inv-date-nav button{
    flex:0 0 auto; width:38px; cursor:pointer; font-family:inherit;
    border:1px solid var(--border); background:var(--card); color:var(--text);
    font-size:19px; line-height:1; padding:0;
  }
  .inv-date-nav button:first-child{border-radius:10px 0 0 10px; border-right:none;}
  .inv-date-nav button:last-child{border-radius:0 10px 10px 0; border-left:none;}
  .inv-date-nav button:hover:not([disabled]){background:var(--accent-tint); color:var(--tint-ink);}
  .inv-date-nav button[disabled]{opacity:.35; cursor:default;}
  .inv-date-select{
    flex:1 1 auto; min-width:min(430px, 60vw); box-sizing:border-box;
    padding:11px 13px; border:1px solid var(--border); border-radius:0;
    font-family:inherit; font-size:15px; font-weight:800;
    background:var(--card); color:var(--text); cursor:pointer; outline:none;
  }
  .inv-date-select:focus{border-color:var(--accent);}
  .inv-onglets{display:inline-flex; background:var(--card); border:1px solid var(--border); border-radius:999px; padding:3px;}
  .inv-onglets button{
    border:none; background:transparent; cursor:pointer; font-family:inherit;
    font-size:12.5px; font-weight:800; color:var(--muted); padding:7px 16px; border-radius:999px;
  }
  .inv-onglets button[aria-current]{background:var(--prune); color:var(--blanc);}

  /* --- Le bandeau de contingent ------------------------------------------ */
  /* Toujours au même endroit, toujours visible : c'est le seul chiffre qu'on
     consulte à chaque ligne saisie. Il ne défile pas avec la liste. */
  .inv-jauges{
    position:sticky; top:104px; z-index:18;
    display:flex; flex-wrap:wrap; gap:9px; align-items:stretch;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:10px 11px; margin-bottom:14px;
  }
  .inv-jauge{
    flex:1 1 150px; min-width:142px; max-width:230px;
    background:var(--bg); border:1px solid var(--border); border-radius:9px;
    padding:7px 10px 8px;
  }
  .inv-jauge-tete{display:flex; align-items:baseline; gap:6px;}
  .inv-jauge-nom{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}
  .inv-jauge-chiffre{margin-left:auto; font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  .inv-jauge-chiffre.plein{color:var(--maybe);}
  .inv-jauge-chiffre.trop{color:var(--ko);}
  .inv-jauge .co-progress{margin-top:5px;}
  /* Atteindre la limite doit se voir sans lire un chiffre : la carte entière
     change de couleur, pas seulement la barre. C'est ce qui arrête la main
     avant la douzième invitation. */
  .inv-jauge.plein{background:var(--maybe-tint); border-color:var(--maybe);}
  .inv-jauge.trop{background:var(--ko-tint); border-color:var(--ko);}
  .inv-jauge.afixer{opacity:.62;}
  .inv-jauge-etat{
    display:inline-block; margin-top:6px; font-size:9.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:999px;
  }
  .inv-jauge-etat.plein{background:var(--maybe); color:#fff;}
  .inv-jauge-etat.trop{background:var(--ko); color:#fff;}
  .inv-jauge-etat.afixer{background:transparent; color:var(--muted); padding-left:0;}
  .inv-jauge-pied{display:flex; align-items:center; gap:5px; margin-top:5px; font-size:10.5px; color:var(--muted);}
  .inv-jauge-pied input{
    width:44px; padding:2px 5px; font-size:11.5px; text-align:right; font-weight:800;
    border:1px solid var(--border); border-radius:6px; background:var(--bg);
    color:var(--text); font-family:inherit; font-variant-numeric:tabular-nums;
  }
  .inv-jauge-pied input:focus{border-color:var(--accent); outline:none;}
  .inv-jauge.after{background:var(--accent-tint); border-color:transparent; flex:1 1 190px; max-width:250px;}
  .inv-jauge.after .inv-jauge-nom, .inv-jauge.after .inv-jauge-pied{color:var(--tint-ink); opacity:.9;}
  .inv-jauge.after .inv-jauge-chiffre{color:var(--tint-ink);}

  /* --- La ligne de saisie ------------------------------------------------- */
  /* Elle est en haut, elle est colorée, elle ne bouge jamais : on tape, on
     valide à Entrée, le curseur revient dans « Nom ». C'est le geste qu'on
     répète quarante fois. */
  .inv-saisie{
    background:var(--rose); border-radius:12px; padding:11px 12px 12px; margin-bottom:6px;
  }
  :root[data-theme="dark"] .inv-saisie{background:var(--secondary-tint);}
  .inv-saisie-titre{
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    color:var(--prune); margin-bottom:7px;
  }
  :root[data-theme="dark"] .inv-saisie-titre{color:var(--blanc);}
  .inv-saisie input, .inv-saisie select{
    width:100%; box-sizing:border-box; padding:8px 9px; font-size:13px;
    border:1px solid transparent; border-radius:8px; background:var(--card);
    color:var(--text); font-family:inherit; outline:none;
  }
  .inv-saisie input:focus, .inv-saisie select:focus{border-color:var(--prune);}
  .inv-saisie .num{text-align:right; font-weight:800; font-variant-numeric:tabular-nums;}
  .inv-saisie button{white-space:nowrap;}
  .inv-mot{font-size:11.5px; font-weight:700; color:var(--ko); margin-top:6px; min-height:14px;}
  /* Une case, pas un nombre : on est à l'aftershow ou on n'y est pas.
     Elle est dessinée à la main plutôt que laissée au navigateur : une case
     native est blanche sur fond blanc, et elle disparaissait purement et
     simplement dans le rose de la ligne de saisie. */
  .inv-case{
    display:flex; align-items:center; justify-content:center;
    border-radius:8px; padding:7px 0; cursor:pointer;
  }
  .inv-case input{
    appearance:none; -webkit-appearance:none; margin:0; cursor:pointer;
    width:20px; height:20px; border-radius:6px;
    border:1.5px solid var(--prune); background:var(--card);
    display:grid; place-content:center;
  }
  .inv-case input::before{
    content:'✓'; font-size:13px; font-weight:800; line-height:1;
    color:transparent; transition:color .1s;
  }
  .inv-case input:checked{background:var(--prune); border-color:var(--prune);}
  .inv-case input:checked::before{color:var(--blanc);}
  .inv-case input:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  /* Une catégorie épuisée ou sans contingent reste visible mais inchoisissable :
     la masquer laisserait croire qu'elle n'existe pas sur cette salle. */
  .inv-saisie select option[disabled], .inv-ligne select option[disabled]{color:var(--muted);}
  .inv-bandeau-plein{margin-bottom:12px;}

  /* --- La liste ----------------------------------------------------------- */
  /* Neuf colonnes, la dernière pour l'action : « + Ajouter » sur la ligne de
     saisie, la croix de suppression sur les lignes. Une dixième portait l'état
     de l'invitation (accordée / transmise / annulée) : elle a été retirée —
     rien n'en dépendait, et c'était une case de plus à remplir. */
  .inv-cells{
    display:grid;
    grid-template-columns:
      minmax(118px,1.1fr) minmax(104px,1fr) minmax(168px,1.5fr)
      58px 146px 62px 148px minmax(100px,.9fr) 100px;
    gap:6px; align-items:center;
  }
  .inv-table{overflow-x:auto;}
  .inv-tete, .inv-corps, .inv-saisie > .inv-cells{min-width:1020px;}
  .inv-tete{
    font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); padding:10px 0 5px;
  }
  .inv-tete .num{text-align:right;}
  .inv-ligne{border-top:1px solid var(--border); padding:4px 0;}
  .inv-ligne input:not([type="checkbox"]), .inv-ligne select{
    width:100%; box-sizing:border-box; padding:6px 7px;
    border:1px solid transparent; border-radius:7px; font-size:12.5px;
    background:var(--bg); color:var(--text); font-family:inherit; outline:none;
  }
  .inv-ligne input:not([type="checkbox"]):hover, .inv-ligne select:hover{border-color:var(--border);}
  .inv-ligne input:not([type="checkbox"]):focus, .inv-ligne select:focus{border-color:var(--accent); background:var(--card);}
  .inv-ligne .num{text-align:right; font-weight:800; font-variant-numeric:tabular-nums;}
  .inv-ligne input[data-champ="nom"]{font-weight:700;}
  .inv-ligne select{cursor:pointer; font-weight:700;}
  .inv-sup{
    border:none; background:transparent; color:var(--muted); cursor:pointer;
    font-size:15px; line-height:1; padding:4px; border-radius:6px;
  }
  .inv-sup:hover{color:var(--ko); background:var(--ko-tint);}
  .inv-alerte{font-size:11px; color:var(--maybe); font-weight:700; padding:0 0 3px 4px;}
  .inv-alerte:empty{display:none;}
  .inv-pied{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px; font-size:12px; color:var(--muted);}

  /* --- Le récapitulatif ---------------------------------------------------- */
  .inv-recap-table{width:100%; border-collapse:collapse; font-size:13px;}
  .inv-recap-table th{
    text-align:left; font-size:9.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:.05em; color:var(--muted); padding:0 8px 7px; white-space:nowrap;
  }
  .inv-recap-table th.num, .inv-recap-table td.num{text-align:right; font-variant-numeric:tabular-nums;}
  .inv-recap-table td{padding:9px 8px; border-top:1px solid var(--border);}
  .inv-recap-table tbody tr:hover{background:var(--row-alt);}
  .inv-recap-table .quand{font-weight:800; white-space:nowrap;}
  .inv-recap-table .ou{color:var(--muted); font-size:12px;}
  .inv-recap-table .trop{color:var(--ko); font-weight:800;}
  .inv-recap-table .plein{color:var(--maybe); font-weight:800;}
  .inv-recap-table tfoot td{
    border-top:2px solid var(--prune); font-weight:800; padding-top:10px;
  }
  .inv-recap-actions{display:flex; gap:5px; justify-content:flex-end;}
  .inv-types{display:flex; flex-wrap:wrap; gap:7px; margin-top:6px;}
  .inv-type-part{
    display:inline-flex; align-items:baseline; gap:7px; border-radius:999px;
    padding:5px 13px; font-size:12.5px; font-weight:700;
  }
  .inv-type-part b{font-size:14px; font-weight:800;}

  @media (max-width:820px){
    .inv-jauges{position:static;}
    .inv-barre .inv-date-select{min-width:0; width:100%;}
  }
</style>

<body>
<div class="wrap">
  <div class="co-page-head co-fade">
    <div>
      <h1>Invitations</h1>
      <p class="subtitle">Écran interne. Les musicien·nes n'y ont pas accès.</p>
    </div>
  </div>

  <div class="inv-barre" id="barre"></div>
  <div id="holder"><div class="empty-hint">Chargement…</div></div>
</div>

<script>
/* ============================================================================
   Les invitations
   ============================================================================
   C'EST UN OUTIL DE SAISIE, pas un tableau de bord. Le geste qu'on répète
   quarante fois, c'est « ajouter un nom sur une date » — tout le reste vient
   après. D'où deux écrans plutôt qu'un :

     SAISIE — une date à la fois. Le contingent en haut, collant ; la ligne de
              saisie juste dessous, qui se valide à Entrée et rend la main dans
              « Nom » ; la liste de la date en dessous, modifiable sur place.
              Rien d'autre à l'écran : pas de projet voisin, pas de date
              suivante, rien à faire défiler pour retrouver son champ.

     RÉCAP  — toutes les dates d'un coup, une ligne chacune, avec ce qui est
              consommé, ce qui reste, ce qui n'est pas encore parti à la salle,
              et où sont allées les places par type. C'est l'écran qu'on
              regarde une fois par semaine, pas toutes les deux minutes.

   QUELLES DATES. Seules les dates VALIDÉES ont une liste : une option n'est
   pas tenue, une date à l'étude n'existe pas encore, et promettre des places
   sur l'une ou l'autre revient à les reprendre. Une date qui perd sa
   validation après coup garde sa liste — on ne fait pas disparaître des noms
   déjà donnés — et le dit en clair.

   LE CONTINGENT est propre à CHAQUE TOURNÉE, et non aux Soudaines : un
   producteur nous donne dix Carré Or, le suivant quatre CAT 1. Il se saisit
   une fois dans le panneau Invitations du projet, se pose d'un clic sur ses
   dates, et se corrige ici date par date.
============================================================================ */

let tourneesCache = [];
let invitationsCache = [];

/* On arrive sur le RÉCAPITULATIF. C'est la vue qui répond à la question qu'on
   se pose en ouvrant la page — où en est ce projet, quelle date reste à
   remplir, qu'est-ce qui déborde — alors que la saisie suppose qu'on sache
   déjà sur quelle date on va travailler. Un clic mène à la saisie, et le
   bouton « Saisir » de chaque ligne y mène directement sur la bonne date. */
let vue = 'recap';
let projetChoisi = '';
let dateChoisie = '';
let toutesJournees = false;
// Le demandeur pré-rempli : le prénom du compte connecté, s'il est de la
// liste (voir DEMANDEURS dans assets/invitations.js). Sinon rien — le champ
// est obligatoire, on préfère le faire choisir qu'attribuer à tort.
let MOI = '';

/* Les lignes écrites avant la liste fermée portent un texte libre — « Alois
   Darles », « alois ». On le rapproche du prénom de la liste quand c'est
   manifestement la même personne, en mémoire seulement : la correction part en
   base à la première modification de la ligne, sans réécrire d'autorité ce
   qu'on n'a pas relu. Ce qui ne se rapproche de rien est laissé tel quel et
   s'affiche « hors liste » — à corriger à la main, en connaissance de cause. */
function rapprocherDemandeur(inv){
  const v = String((inv && inv.demandePar) || '').trim();
  if(!v || DEMANDEURS.includes(v)) return;
  const nu = (s)=> String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const premier = nu(v.split(/\s+/)[0]);
  const trouve = DEMANDEURS.find(d=> nu(d) === premier);
  if(trouve) inv.demandePar = trouve;
}

// --- Lectures ---------------------------------------------------------------

function projetsInvitables(){
  return tourneesCache.filter(t=> t.type !== 'recording' && t.invitationsActives);
}
function projetCourant(){ return tourneesCache.find(t=> t.id === projetChoisi) || null; }
function invitationsDe(dateId){ return invitationsCache.filter(i=> i.dateId === dateId); }
function dateDe(t, dateId){ return (t.dates || []).find(d=> d.id === dateId) || null; }

/* Les dates qui ont une liste. Un concert validé, point. Les exceptions ne
   sont pas des réglages mais des faits : une date qui porte déjà des noms
   reste là quoi qu'il arrive (on ne perd pas une promesse faite), et la case
   « toutes les journées » ouvre le reste pour qui prépare en avance. */
function datesInvitables(t){
  return (t.dates || []).filter(d=>{
    if(invitationsDe(d.id).length) return true;
    if(toutesJournees) return !estAnnulee(d);
    return typeDateValide(t, d.type) === 'concert' && estValidee(d);
  }).sort((a, b)=> String(a.date || '').localeCompare(String(b.date || '')));
}
function dateCourante(){
  const t = projetCourant();
  return t ? dateDe(t, dateChoisie) : null;
}

function fmtDateFR(iso){
  if(!iso) return '';
  const [y, m, d] = String(iso).split('-');
  const mois = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `${parseInt(d, 10)} ${mois[parseInt(m, 10) - 1]} ${y}`;
}
function jourSemaine(iso){
  const [a, m, j] = String(iso || '').split('-').map(n=> parseInt(n, 10));
  if(!j) return '';
  const jours = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
  return jours[(new Date(Date.UTC(a, m - 1, j)).getUTCDay() + 6) % 7];
}
// « 28052026 » : le nom que portaient les feuilles du tableur. Les fichiers
// exportés le gardent — c'est ainsi que la salle les reconnaît.
function clefFichier(iso){
  const [y, m, d] = String(iso || '').split('-');
  return `${d || ''}${m || ''}${y || ''}`;
}
/* Le libellé d'une date dans le menu. Il porte aussi où en est sa liste — sur
   une tournée de vingt-deux concerts, c'est ce qui dit d'un coup d'œil laquelle
   reste à remplir, sans avoir à ouvrir chacune. */
function libelleDate(t, d){
  const lieu = [d.ville, d.lieu].filter(Boolean).join(' · ');
  const alerte = estValidee(d) ? '' : `  ⚠ ${courtStatut(d).toLowerCase()}`;
  const conso = consommeSurDate(invitationsCache, d.id);
  const n = Object.values(conso.places).reduce((s, x)=> s + x, 0);
  const etat = n ? `  ·  ${n} place${n > 1 ? 's' : ''}` : (conso.lignes ? '  ·  aftershow seul' : '');
  return `${jourSemaine(d.date)} ${fmtDateFR(d.date)}${lieu ? '  —  ' + lieu : ''}${alerte}${etat}`;
}

// --- Écritures --------------------------------------------------------------

const timersInvit = {};
function sauverInvitation(id){
  clearTimeout(timersInvit[id]);
  timersInvit[id] = setTimeout(()=>{
    const inv = invitationsCache.find(i=> i.id === id);
    if(inv) CurieuxDB.upsertOne('invitations', inv);
  }, 500);
}
let timerTournees = null;
function sauverTournees(){
  clearTimeout(timerTournees);
  timerTournees = setTimeout(()=> CurieuxDB.syncCollection('tournees', tourneesCache), 600);
}

// --- La barre du haut -------------------------------------------------------

function renderBarre(){
  const barre = document.getElementById('barre');
  const projets = projetsInvitables();
  if(!projets.length){ barre.innerHTML = ''; return; }
  const t = projetCourant();
  const dates = t ? datesInvitables(t) : [];
  barre.innerHTML = `
    <div class="co-field">
      <label class="co-label" for="selProjet">Projet</label>
      <select class="co-select" id="selProjet">
        ${projets.map(p=> `<option value="${escapeAttr(p.id)}" ${p.id === projetChoisi ? 'selected' : ''}>${escapeHtml(p.nom || 'Tournée sans nom')}</option>`).join('')}
      </select>
    </div>
    ${vue === 'saisie' ? (()=>{
      const i = dates.findIndex(d=> d.id === dateChoisie);
      return `
    <div class="co-field">
      <label class="co-label" for="selDate">Date</label>
      <div class="inv-date-nav">
        <button type="button" data-date-pas="-1" aria-label="Date précédente" title="Date précédente"
          ${i > 0 ? '' : 'disabled'}>‹</button>
        <select class="inv-date-select" id="selDate" ${dates.length ? '' : 'disabled'}>
          ${dates.length
            ? dates.map(d=> `<option value="${escapeAttr(d.id)}" ${d.id === dateChoisie ? 'selected' : ''}>${escapeHtml(libelleDate(t, d))}</option>`).join('')
            : '<option>Aucune date validée</option>'}
        </select>
        <button type="button" data-date-pas="1" aria-label="Date suivante" title="Date suivante"
          ${i >= 0 && i < dates.length - 1 ? '' : 'disabled'}>›</button>
      </div>
    </div>`; })() : ''}
    <div class="inv-spacer"></div>
    <label class="co-check" style="padding-bottom:8px;" title="Par défaut, seuls les concerts validés ont une liste d'invitations.">
      <input type="checkbox" id="chkToutes" ${toutesJournees ? 'checked' : ''}>
      <span>Options et répétitions</span>
    </label>
    <div class="inv-onglets" style="margin-bottom:1px;">
      <button type="button" data-vue="saisie" ${vue === 'saisie' ? 'aria-current="page"' : ''}>Saisie</button>
      <button type="button" data-vue="recap" ${vue === 'recap' ? 'aria-current="page"' : ''}>Récapitulatif</button>
    </div>`;
}

function render(){ renderBarre(); renderCorps(); }

function renderCorps(){
  const holder = document.getElementById('holder');
  if(!projetsInvitables().length){
    holder.innerHTML = `<div class="empty-hint">
      Aucun projet ne gère d'invitations pour l'instant.<br>
      Ouvre <a href="tournees.html">Tournées</a>, déplie le projet, et coche « Gérer les invitations » dans le panneau Invitations.
    </div>`;
    return;
  }
  const t = projetCourant();
  if(!t){ holder.innerHTML = `<div class="empty-hint">Choisis un projet.</div>`; return; }
  holder.innerHTML = vue === 'saisie' ? htmlSaisie(t) : htmlRecap(t);
  if(vue === 'saisie'){
    const champ = document.querySelector('#saisieNom');
    if(champ && !document.querySelector('[data-garder-focus]')) champ.focus();
  }
}

// --- Écran de saisie --------------------------------------------------------

function htmlSaisie(t){
  const dates = datesInvitables(t);
  if(!dates.length){
    return `<div class="empty-hint">
      Aucune date validée sur ce projet.<br>
      Une option ou une date à l'étude n'a pas de liste d'invitations : rien n'est tenu tant que la date n'est pas signée.<br>
      <span style="font-size:12.5px;">Coche « Options et répétitions » si tu prépares en avance.</span>
    </div>`;
  }
  const d = dateCourante() || dates[0];
  const cats = placesDuProjet(t);
  const conso = consommeSurDate(invitationsCache, d.id);
  const lignes = invitationsDe(d.id);

  /* Ce qu'on peut encore donner, toutes catégories confondues. Trois cas, trois
     messages : il reste de la place, tout est épuisé, ou la salle ne nous a
     rien dit. Le troisième n'est pas un refus mais un réglage qui manque, et
     il se corrige dans le champ Contingent juste en dessous. */
  const ouvertes = cats.filter(c=> (restantPlaces(d, invitationsCache, c.cle) || 0) > 0);
  const contingentees = cats.filter(c=> quotaDate(d, c.cle) != null);

  return `
    ${estValidee(d) ? '' : `<div class="co-note" style="margin-bottom:12px;">
      Cette date est <b>${escapeHtml(courtStatut(d).toLowerCase())}</b>, pas validée. ${lignes.length
        ? 'Les noms déjà saisis restent, mais rien ne doit partir à la salle tant que la date n\'est pas signée.'
        : 'Rien n\'est tenu : évite de promettre des places dessus.'}
    </div>`}

    <div class="inv-jauges" data-jauges="${escapeAttr(d.id)}">
      ${cats.map(c=> htmlJauge(d, c, conso)).join('')}
      <div class="inv-jauge after">
        <div class="inv-jauge-tete">
          <span class="inv-jauge-nom">Aftershow</span>
          <span class="inv-jauge-chiffre" data-after-total>${conso.aftershow}</span>
        </div>
        <div class="inv-jauge-pied">Sans quota — c'est un nombre de noms, pour le traiteur et la sécurité.</div>
      </div>
    </div>

    <div data-alerte-plein>${htmlAlertePlein(contingentees, ouvertes)}</div>

    <div class="inv-table">
      <form class="inv-saisie" id="formSaisie" autocomplete="off">
        <div class="inv-saisie-titre">Ajouter une invitation — Entrée pour valider</div>
        <div class="inv-cells">
          <input id="saisieNom" data-neuf="nom" placeholder="Nom">
          <input data-neuf="prenom" placeholder="Prénom">
          <input data-neuf="email" type="email" placeholder="E-mail">
          <input class="num" data-neuf="places" inputmode="numeric" placeholder="Pl.">
          <select data-neuf="categorie">${optionsSaisieCategorie(t, d, 1, categorieProposee(t, d, 1))}</select>
          <label class="inv-case" title="À l'aftershow, ou pas. C'est une liste de noms : qui vient accompagné prend sa propre ligne.">
            <input type="checkbox" data-neuf="aftershow">
          </label>
          <select data-neuf="type">
            <option value="">— type —</option>
            ${INVITATION_TYPES.map(x=> `<option value="${x.cle}">${escapeHtml(x.libelle)}</option>`).join('')}
          </select>
          <select data-neuf="demandePar">${optionsDemandeurs(MOI)}</select>
          <button type="submit" class="co-btn primary sm">+ Ajouter</button>
        </div>
        <div class="inv-mot" id="motSaisie"></div>
      </form>

      <div class="inv-tete">
        <div class="inv-cells">
          <span>Nom</span><span>Prénom</span><span>E-mail</span>
          <span class="num">Pl.</span><span>Catégorie</span><span style="text-align:center;">After</span>
          <span>Type</span><span>Qui invite</span><span></span>
        </div>
      </div>
      <div class="inv-corps" data-lignes="${escapeAttr(d.id)}">
        ${lignes.length ? lignes.map(i=> htmlLigne(t, i)).join('')
          : `<div class="empty-hint" style="padding:22px 4px;">Aucune invitation sur cette date. La première se tape juste au-dessus.</div>`}
      </div>
    </div>

    <div class="inv-pied">
      <span data-compte="${escapeAttr(d.id)}">${phraseCompte(conso)}</span>
      <div class="inv-spacer"></div>
      <button type="button" class="co-btn tint sm" data-pdf-date="${escapeAttr(d.id)}">PDF de la date</button>
      <button type="button" class="co-btn ghost sm" data-export-salle="${escapeAttr(d.id)}">CSV salle</button>
      <button type="button" class="co-btn ghost sm" data-export-after="${escapeAttr(d.id)}">CSV aftershow</button>
    </div>`;
}

/* La catégorie que la ligne de saisie propose : la première qui peut ACCUEILLIR
   CE QU'ON DEMANDE. Sur une tournée à dix Carré Or et dix CAT 1, on remplit les
   Carré Or puis on bascule — le champ le fait tout seul. Demander onze places
   quand il en reste neuf le fait basculer aussi, au lieu de laisser choisir une
   catégorie qui refusera ensuite.
   Aucune ne convient : on ne présélectionne rien plutôt que de proposer une
   catégorie qu'il faudrait refuser. */
function categorieProposee(t, d, besoin){
  const veut = Math.max(1, besoin || 1);
  const libre = placesDuProjet(t).find(c=>{
    const r = restantPlaces(d, invitationsCache, c.cle);
    return r != null && r >= veut;
  });
  return libre ? libre.cle : '';
}

/* Le menu Catégorie de la ligne de saisie, entièrement reconstruit.
   ---------------------------------------------------------------------------
   Il dépend de deux choses qui bougent sans cesse : ce qui reste sur la date
   (chaque invitation ajoutée le réduit) et le nombre de places qu'on est en
   train de taper. Il se recalcule donc à la frappe, et l'intitulé du choix vide
   dit pourquoi il n'y a rien à choisir quand c'est le cas — un menu vide sans
   explication laisse croire à une panne. */
function optionsSaisieCategorie(t, d, besoin, selection){
  const veut = Math.max(1, besoin || 1);
  const options = optionsCategories(t, d, null, selection, true, veut);
  const possible = /<option (?![^>]*disabled)[^>]*value="[^"]+"/.test(options);
  const vide = possible
    ? '— cat. —'
    : (veut > 1 ? `aucune n'a ${veut} places libres` : 'aucune place disponible');
  return `<option value="">${escapeHtml(vide)}</option>` + options;
}

function majMenuSaisie(){
  const menu = document.querySelector('[data-neuf="categorie"]');
  if(!menu || menu === document.activeElement) return;
  const t = projetCourant();
  const d = dateCourante();
  if(!t || !d) return;
  const champ = document.querySelector('[data-neuf="places"]');
  const besoin = champ ? nombreInvit(champ.value) : 0;
  const garde = menu.value;
  menu.innerHTML = optionsSaisieCategorie(t, d, besoin, garde);
  /* La catégorie retenue a pu se fermer entre-temps — c'est le cas normal : la
     douzième invitation vient de finir le Carré Or, ou on vient de passer de
     deux places à onze. On bascule sur la première qui convient. Un menu peut
     rester posé sur une option désactivée : on regarde l'option, pas la valeur. */
  const choisie = menu.selectedOptions[0];
  if(!garde || !choisie || choisie.disabled) menu.value = categorieProposee(t, d, besoin);
}

/* Les options du menu Catégorie.
   ---------------------------------------------------------------------------
   Une catégorie SANS CONTINGENT n'apparaît pas : il n'y en a pas dans cette
   salle, ce n'est pas un réglage oublié. Une catégorie ÉPUISÉE, ou TROP PETITE
   pour ce qu'on demande, reste affichée mais grisée et motivée — la masquer
   laisserait croire qu'elle n'existe pas, et on la chercherait.

   `besoin` est le nombre de places qu'on veut placer : c'est lui qui rend le
   menu dynamique. Demander onze places ferme une catégorie qui n'en a que
   neuf, alors qu'en demander une la laisse ouverte.

   Exception : la catégorie que la ligne porte DÉJÀ reste choisissable, sans
   quoi une ligne saisie avant que le contingent ne change deviendrait
   impossible à rouvrir — on ne pourrait plus ni la corriger ni la relire. */
function optionsCategories(t, d, inv, selection, avecReste, besoin){
  const veut = Math.max(1, besoin || 1);
  return placesDuProjet(t).map(c=>{
    const q = quotaDate(d, c.cle);
    const sienne = inv && inv.categorie === c.cle;
    if(q == null && !sienne) return '';
    const reste = restantPlaces(d, invitationsCache, c.cle, inv);
    const bloque = !sienne && (reste == null || reste < veut);
    /* Dans la ligne de SAISIE, le menu annonce ce qu'il reste : c'est là qu'on
       décide combien on donne. Sur une ligne déjà écrite, ce serait du bruit —
       on n'y garde que la raison d'un blocage, en court. */
    const suffixe = avecReste
      ? (reste == null ? ' — aucune' : reste <= 0 ? ' — complet' : ` — ${reste} libre${reste > 1 ? 's' : ''}`)
      : (bloque ? (reste == null ? ' (aucune)' : reste <= 0 ? ' (complet)' : ` (${reste} libre${reste > 1 ? 's' : ''})`) : '');
    return `<option value="${escapeAttr(c.cle)}" ${bloque ? 'disabled' : ''} ${selection === c.cle ? 'selected' : ''}>${escapeHtml(c.libelle + suffixe)}</option>`;
  }).join('');
}

/* Les options du menu « Qui invite ». Une valeur arrivée d'ailleurs n'est
   jamais effacée en silence : elle s'ajoute, marquée hors liste. */
function optionsDemandeurs(valeur){
  const v = String(valeur || '').trim();
  const liste = DEMANDEURS.includes(v) || !v ? DEMANDEURS : DEMANDEURS.concat([v]);
  // Sans ce choix vide, le menu se poserait tout seul sur le premier prénom de
  // la liste, et toutes les invitations d'un compte inconnu seraient attribuées
  // à Aloïs sans que personne ne l'ait dit.
  return (v ? '' : '<option value="">— qui invite —</option>') + liste.map(n=>
    `<option value="${escapeAttr(n)}" ${n === v ? 'selected' : ''}>${escapeHtml(n + (DEMANDEURS.includes(n) ? '' : ' (hors liste)'))}</option>`
  ).join('');
}

/* Le bandeau qui arrête la main. Il ne remplace pas les jauges : elles disent
   le détail, il dit la conclusion — « il n'y a plus rien à donner ici ». Sans
   lui, on tape un nom, on choisit une catégorie, et c'est seulement au moment
   de valider qu'on apprend qu'il n'y avait plus de place. */
function htmlAlertePlein(contingentees, ouvertes){
  if(ouvertes.length) return '';
  if(!contingentees.length){
    return `<div class="co-note inv-bandeau-plein">
      <b>Aucune place allouée sur cette date.</b> Aucune invitation avec place n'est possible —
      seul l'aftershow l'est. Si la salle nous a donné un contingent, indique-le
      dans les champs ci-dessus.
    </div>`;
  }
  return `<div class="co-note inv-bandeau-plein" style="background:var(--ko-tint); color:var(--ko);">
    <b>Contingent épuisé sur cette date.</b> Toutes les catégories sont complètes :
    plus aucune place ne peut être accordée. L'aftershow, lui, reste ouvert.
    Pour donner une place de plus, il faut d'abord obtenir un contingent plus large de la salle.
  </div>`;
}

// L'état d'une catégorie sur une date : rien de fixé, complet, dépassé, ou
// ouvert. Un seul endroit le décide — l'écran, les couleurs et le blocage de
// la saisie doivent dire la même chose.
function etatJauge(d, cle, n){
  const q = quotaDate(d, cle);
  if(q == null) return 'afixer';
  if(n > q) return 'trop';
  if(n === q) return 'plein';
  return '';
}
/* « afixer » ne dit pas un oubli mais une absence : toutes les salles n'ont pas
   de CAT 2. La carte reste donc discrète — pas d'ambre, pas d'alarme — et la
   catégorie disparaît simplement du menu de saisie. */
const MOT_ETAT = { afixer:'pas de contingent', plein:'complet', trop:'dépassé' };

function htmlJauge(d, c, conso){
  const q = quotaDate(d, c.cle);
  const n = conso.places[c.cle] || 0;
  const etat = etatJauge(d, c.cle, n);
  const couleur = etat === 'trop' ? 'var(--ko)' : etat === 'plein' ? 'var(--maybe)' : 'var(--ok)';
  return `
    <div class="inv-jauge ${etat}" data-jauge="${escapeAttr(c.cle)}">
      <div class="inv-jauge-tete">
        <span class="inv-jauge-nom">${escapeHtml(c.libelle)}</span>
        <span class="inv-jauge-chiffre ${etat}" data-chiffre>${n} / ${q == null ? '—' : q}</span>
      </div>
      <div class="co-progress co-progress-thin"><i data-barre style="width:${q ? Math.min(100, Math.round(n / q * 100)) : 0}%; background:${couleur};"></i></div>
      <div class="inv-jauge-pied">
        <span>Contingent</span>
        <input type="text" inputmode="numeric" data-quota="${escapeAttr(c.cle)}"
          value="${q == null ? '' : q}" placeholder="—"
          title="Ce que la salle alloue sur cette date. Vide : pas encore fixé — ce n'est pas zéro.">
      </div>
      <span class="inv-jauge-etat ${etat}" data-jauge-etat ${etat ? '' : 'hidden'}>${MOT_ETAT[etat] || ''}</span>
    </div>`;
}

function htmlLigne(t, inv){
  const d = dateDe(t, inv.dateId);
  const ty = INVITATION_TYPE[inv.type];
  return `
  <div class="inv-ligne" data-ligne="${escapeAttr(inv.id)}">
    <div class="inv-cells">
      <input data-champ="nom" value="${escapeAttr(inv.nom || '')}" placeholder="Nom">
      <input data-champ="prenom" value="${escapeAttr(inv.prenom || '')}" placeholder="Prénom">
      <input data-champ="email" type="email" value="${escapeAttr(inv.email || '')}" placeholder="E-mail">
      <input class="num" data-champ="places" inputmode="numeric" value="${nombreInvit(inv.places) || ''}" placeholder="0">
      <select data-champ="categorie">
        <option value="">—</option>
        ${d ? optionsCategories(t, d, inv, inv.categorie, false, nombreInvit(inv.places)) : ''}
      </select>
      <label class="inv-case" title="À l'aftershow, ou pas.">
        <input type="checkbox" data-champ="aftershow" ${aAftershow(inv) ? 'checked' : ''}>
      </label>
      <select data-champ="type" style="${ty ? `background:${ty.fond}; color:${ty.encre};` : ''}">
        <option value="">— type —</option>
        ${INVITATION_TYPES.map(x=> `<option value="${x.cle}" ${inv.type === x.cle ? 'selected' : ''}>${escapeHtml(x.libelle)}</option>`).join('')}
      </select>
      <select data-champ="demandePar">${optionsDemandeurs(inv.demandePar)}</select>
      <button type="button" class="inv-sup" data-supprimer="${escapeAttr(inv.id)}" title="Retirer cette invitation" aria-label="Retirer cette invitation">×</button>
    </div>
    <div class="inv-alerte" data-alerte>${escapeHtml(alerteDe(inv))}</div>
  </div>`;
}

/* Ce qui cloche sur la ligne, dit sous la ligne même. Deux natures mêlées, et
   c'est voulu : ce qui manque pour qu'elle parte à la salle (un nom, un type),
   et ce qui la met en faute (un dépassement de contingent). Les deux se
   corrigent au même endroit, il n'y a donc pas lieu de les séparer. */
function alerteDe(inv){
  const n = nombreInvit(inv.places);
  const manques = [];
  if(n === 0 && !aAftershow(inv)) manques.push('ni place ni aftershow');
  if(n > 0 && !inv.categorie) manques.push('catégorie de place à choisir');
  if(n > 0 && inv.categorie){
    // Le dépassement se dit ligne par ligne, et pas seulement sur la jauge :
    // sur quinze lignes, la jauge rouge ne désigne pas celle qui déborde.
    const t = projetCourant();
    const d = t && dateDe(t, inv.dateId);
    const reste = d ? restantPlaces(d, invitationsCache, inv.categorie, inv) : null;
    if(d && reste == null) manques.push(`${libellePlace(t, inv.categorie)} sans contingent`);
    else if(reste != null && n > reste) manques.push(`${n} places demandées, ${Math.max(0, reste)} disponible${reste > 1 ? 's' : ''} en ${libellePlace(t, inv.categorie)}`);
  }
  if(!String(inv.nom || '').trim()) manques.push('nom manquant');
  if(!String(inv.prenom || '').trim()) manques.push('prénom manquant');
  if(!String(inv.demandePar || '').trim()) manques.push('qui invite ?');
  if(!inv.type) manques.push('type à préciser');
  return manques.length ? '⚠ ' + manques.join(' · ') : '';
}

function phraseCompte(conso){
  const total = Object.values(conso.places).reduce((s, n)=> s + n, 0);
  if(!conso.lignes) return 'Aucune ligne sur cette date.';
  return `${conso.lignes} ligne${conso.lignes > 1 ? 's' : ''} · ${total} place${total > 1 ? 's' : ''} · ${conso.aftershow} à l'aftershow`;
}

// --- Écran récapitulatif ----------------------------------------------------

function htmlRecap(t){
  const dates = datesInvitables(t);
  if(!dates.length) return `<div class="empty-hint">Aucune date validée sur ce projet.</div>`;
  const cats = placesDuProjet(t);
  const par = dates.map(d=> ({ d, conso: consommeSurDate(invitationsCache, d.id) }));

  const totalCat = {};
  let totalAfter = 0, totalLignes = 0, totalACompleter = 0, totalQuota = {};
  par.forEach(({ d, conso })=>{
    cats.forEach(c=>{
      totalCat[c.cle] = (totalCat[c.cle] || 0) + (conso.places[c.cle] || 0);
      const q = quotaDate(d, c.cle);
      if(q != null) totalQuota[c.cle] = (totalQuota[c.cle] || 0) + q;
    });
    totalAfter += conso.aftershow;
    totalLignes += conso.lignes;
    totalACompleter += invitationsDe(d.id).filter(i=> alerteDe(i)).length;
  });

  const cellule = (d, c, conso)=>{
    const q = quotaDate(d, c.cle);
    const n = conso.places[c.cle] || 0;
    const etat = q == null ? '' : (n > q ? 'trop' : (n === q ? 'plein' : ''));
    return `<td class="num ${etat}">${n}${q == null ? '' : ` <span style="color:var(--muted); font-weight:600;">/ ${q}</span>`}</td>`;
  };

  /* Où sont parties les places. C'est la question à laquelle le tableur ne
     répondait jamais : la colonne « TYPE INVITATIONS » y était remplie douze
     fois sur quarante-neuf. Ici elle est un champ du formulaire, donc elle est
     là, donc le bilan existe. */
  const idsDates = new Set(dates.map(d=> d.id));
  const vivantes = invitationsCache.filter(i=> idsDates.has(i.dateId));
  const parType = INVITATION_TYPES.map(ty=> ({
    ty, places: vivantes.filter(i=> i.type === ty.cle).reduce((s, i)=> s + nombreInvit(i.places), 0),
  })).filter(x=> x.places > 0);
  const sansType = vivantes.filter(i=> !INVITATION_TYPE[i.type]).reduce((s, i)=> s + nombreInvit(i.places), 0);

  return `
    <div class="co-mini-stats" style="margin-bottom:16px;">
      ${miniStat(Object.values(totalCat).reduce((s, n)=> s + n, 0), 'places accordées', 'var(--accent-tint)', 'var(--tint-ink)')}
      ${(()=>{
        const aFixer = dates.filter(d=> !cats.some(c=> quotaDate(d, c.cle) != null)).length;
        // « Sans contingent », et non « à fixer » : il se peut qu'il n'y en ait
        // simplement pas. Le chiffre reste utile — sur ces dates, aucune place
        // ne peut être donnée —, mais il ne se présente plus comme un oubli.
        if(aFixer) return miniStat(aFixer, `date${aFixer > 1 ? 's' : ''} sans contingent`, 'var(--border)', 'var(--muted)');
        const reste = Object.values(totalQuota).reduce((s, n)=> s + n, 0) - Object.values(totalCat).reduce((s, n)=> s + n, 0);
        return miniStat(reste, reste < 0 ? 'places en trop' : 'places restantes',
          reste < 0 ? 'var(--ko-tint)' : 'var(--ok-tint)', reste < 0 ? 'var(--ko)' : 'var(--ok)');
      })()}
      ${miniStat(totalAfter, "à l'aftershow", 'var(--accent-tint)', 'var(--tint-ink)')}
      ${miniStat(totalACompleter, 'ligne' + (totalACompleter > 1 ? 's' : '') + ' à compléter',
        totalACompleter ? 'var(--maybe-tint)' : 'var(--border)', totalACompleter ? 'var(--maybe)' : 'var(--muted)')}
    </div>

    <div class="co-card" style="padding:14px 16px 16px; overflow-x:auto;">
      <div class="co-legend">Date par date</div>
      <table class="inv-recap-table">
        <thead><tr>
          <th>Date</th><th>Lieu</th>
          ${cats.map(c=> `<th class="num">${escapeHtml(c.libelle)}</th>`).join('')}
          <th class="num">After</th><th class="num">Lignes</th><th class="num">À compléter</th><th></th>
        </tr></thead>
        <tbody>
          ${par.map(({ d, conso })=>{
            const aTr = invitationsDe(d.id).filter(i=> alerteDe(i)).length;
            return `<tr>
              <td class="quand">${escapeHtml(fmtDateFR(d.date))}${estValidee(d) ? '' : ` <span class="co-pill ${pillStatut(d)}">${escapeHtml(courtStatut(d))}</span>`}</td>
              <td class="ou">${escapeHtml([d.ville, d.lieu].filter(Boolean).join(' · ') || '—')}</td>
              ${cats.map(c=> cellule(d, c, conso)).join('')}
              <td class="num">${conso.aftershow || ''}</td>
              <td class="num">${conso.lignes || ''}</td>
              <td class="num">${aTr ? `<span class="co-pill att">${aTr}</span>` : ''}</td>
              <td><div class="inv-recap-actions">
                <button type="button" class="co-btn ghost sm" data-aller="${escapeAttr(d.id)}">Saisir</button>
                <button type="button" class="co-btn tint sm" data-pdf-date="${escapeAttr(d.id)}">PDF</button>
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
        <tfoot><tr>
          <td>Total</td><td></td>
          ${cats.map(c=> `<td class="num">${totalCat[c.cle] || 0}${totalQuota[c.cle] ? ` <span style="color:var(--muted); font-weight:600;">/ ${totalQuota[c.cle]}</span>` : ''}</td>`).join('')}
          <td class="num">${totalAfter}</td><td class="num">${totalLignes}</td><td class="num">${totalACompleter || ''}</td><td></td>
        </tr></tfoot>
      </table>
    </div>

    <div class="co-card" style="padding:14px 16px 16px; margin-top:14px;">
      <div class="co-legend">Où sont parties les places</div>
      ${parType.length || sansType ? `<div class="inv-types">
        ${parType.map(x=> `<span class="inv-type-part" style="background:${x.ty.fond}; color:${x.ty.encre};"><b>${x.places}</b> ${escapeHtml(x.ty.libelle)}</span>`).join('')}
        ${sansType ? `<span class="inv-type-part" style="background:var(--maybe-tint); color:var(--maybe);"><b>${sansType}</b> sans type — à qualifier</span>` : ''}
      </div>` : `<p class="co-legend-hint" style="margin:0;">Aucune place accordée pour l'instant.</p>`}
    </div>

    <div class="co-actions" style="margin-top:16px;">
      <button type="button" class="co-btn secondary md" id="btnPdfProjet">PDF — toutes les dates</button>
      <button type="button" class="co-btn ghost md" id="btnExportProjet">CSV — tout le projet</button>
    </div>`;
}

function miniStat(valeur, libelle, fond, encre){
  return `<div class="co-mini-stat" style="background:${fond}; color:${encre};"><b>${valeur}</b><span>${libelle}</span></div>`;
}

// --- Mises à jour chirurgicales --------------------------------------------
// Appelées à chaque frappe : elles ne touchent qu'aux chiffres, jamais au
// champ qu'on est en train de remplir.

function majDate(dateId){
  const t = projetCourant();
  const d = t && dateDe(t, dateId);
  if(!d) return;
  const cats = placesDuProjet(t);
  const conso = consommeSurDate(invitationsCache, dateId);
  const bloc = document.querySelector(`[data-jauges="${CSS.escape(dateId)}"]`);
  if(bloc){
    cats.forEach(c=>{
      const el = bloc.querySelector(`[data-jauge="${CSS.escape(c.cle)}"]`);
      if(!el) return;
      const q = quotaDate(d, c.cle);
      const n = conso.places[c.cle] || 0;
      const etat = etatJauge(d, c.cle, n);
      el.className = 'inv-jauge ' + etat;
      const chiffre = el.querySelector('[data-chiffre]');
      if(chiffre){ chiffre.textContent = `${n} / ${q == null ? '—' : q}`; chiffre.className = 'inv-jauge-chiffre ' + etat; }
      const barre = el.querySelector('[data-barre]');
      if(barre){
        barre.style.width = (q ? Math.min(100, Math.round(n / q * 100)) : 0) + '%';
        barre.style.background = etat === 'trop' ? 'var(--ko)' : etat === 'plein' ? 'var(--maybe)' : 'var(--ok)';
      }
      const badge = el.querySelector('[data-jauge-etat]');
      if(badge){
        badge.className = 'inv-jauge-etat ' + etat;
        badge.textContent = MOT_ETAT[etat] || '';
        badge.hidden = !etat;
      }
    });
    const after = bloc.querySelector('[data-after-total]');
    if(after) after.textContent = conso.aftershow;
  }
  const compte = document.querySelector(`[data-compte="${CSS.escape(dateId)}"]`);
  if(compte) compte.textContent = phraseCompte(conso);

  /* Les menus Catégorie se rouvrent : une place donnée vient peut-être de
     fermer une catégorie, une place reprise d'en rouvrir une. Sans cela, on
     pourrait encore choisir une catégorie devenue complète à la ligne
     d'après. On ne touche pas au menu qui a le curseur — on ne change pas la
     liste sous la main de quelqu'un qui est en train d'y choisir. */
  const ouvertes = cats.filter(c=> (restantPlaces(d, invitationsCache, c.cle) || 0) > 0);
  const contingentees = cats.filter(c=> quotaDate(d, c.cle) != null);
  const bandeau = document.querySelector('[data-alerte-plein]');
  if(bandeau) bandeau.innerHTML = htmlAlertePlein(contingentees, ouvertes);

  document.querySelectorAll('[data-lignes] [data-champ="categorie"]').forEach(sel=>{
    if(sel === document.activeElement) return;
    const inv = invitationDe(sel);
    if(!inv) return;
    sel.innerHTML = '<option value="">—</option>' + optionsCategories(t, d, inv, inv.categorie, false, nombreInvit(inv.places));
  });
  majMenuSaisie();
}

function majLigne(invId){
  const inv = invitationsCache.find(i=> i.id === invId);
  const el = document.querySelector(`[data-ligne="${CSS.escape(invId)}"]`);
  if(!inv || !el) return;
  const alerte = el.querySelector('[data-alerte]');
  if(alerte) alerte.textContent = alerteDe(inv);
}

// --- Saisie -----------------------------------------------------------------

function invitationDe(el){
  const ligne = el.closest('[data-ligne]');
  if(!ligne) return null;
  return invitationsCache.find(i=> i.id === ligne.dataset.ligne) || null;
}

document.addEventListener('input', (e)=>{
  // Le contingent d'une date, corrigé ici parce qu'on voit en même temps ce
  // qui est déjà consommé. Vidé, il redevient « pas encore fixé » — et non
  // zéro, ce qui ferait refuser des demandes à tort.
  const q = e.target.closest('[data-quota]');
  if(q){
    const t = projetCourant();
    const bloc = q.closest('[data-jauges]');
    const d = t && bloc && dateDe(t, bloc.dataset.jauges);
    if(!d) return;
    const brut = String(q.value || '').trim();
    d.quotas = Object.assign({}, d.quotas || {});
    if(brut === '') delete d.quotas[q.dataset.quota];
    else {
      const n = parseInt(brut, 10);
      if(isNaN(n) || n < 0) return;
      d.quotas[q.dataset.quota] = n;
    }
    sauverTournees();
    majDate(d.id);
    return;
  }

  // Le nombre de places qu'on tape décide de ce que le menu Catégorie propose.
  if(e.target.matches('[data-neuf="places"]')){ majMenuSaisie(); return; }

  const champ = e.target.closest('input[data-champ]');
  if(!champ || champ.type === 'checkbox') return;
  const inv = invitationDe(champ);
  if(!inv) return;
  const nom = champ.dataset.champ;
  inv[nom] = nom === 'places' ? nombreInvit(champ.value) : champ.value;
  sauverInvitation(inv.id);
  majLigne(inv.id);
  if(nom === 'places') majDate(inv.dateId);
});

document.addEventListener('change', (e)=>{
  /* Le nombre de places d'une ligne existante, ramené au contingent — au
     CHANGEMENT, pas à la frappe : plafonner pendant qu'on tape transformerait
     « 12 » en « 1 » puis « 10 » sous les doigts. On corrige quand le champ est
     quitté, et on dit pourquoi. */
  const nb = e.target.closest('input[data-champ="places"]');
  if(nb){
    const inv = invitationDe(nb);
    const t = projetCourant();
    const d = inv && t && dateDe(t, inv.dateId);
    if(!inv || !d) return;
    const demande = nombreInvit(nb.value);
    const reste = inv.categorie ? restantPlaces(d, invitationsCache, inv.categorie, inv) : null;
    if(inv.categorie && reste != null && demande > reste){
      inv.places = Math.max(0, reste);
      nb.value = inv.places || '';
      signaler(`${libellePlace(t, inv.categorie)} : ${demande} places demandées, ${Math.max(0, reste)} disponible${reste > 1 ? 's' : ''}. Ramené au contingent.`);
      sauverInvitation(inv.id);
      majLigne(inv.id);
      majDate(inv.dateId);
    }
    return;
  }

  // L'aftershow : une case, pas un nombre. 1 ou 0 en base.
  const caseAfter = e.target.closest('input[type="checkbox"][data-champ="aftershow"]');
  if(caseAfter){
    const inv = invitationDe(caseAfter);
    if(!inv) return;
    inv.aftershow = caseAfter.checked ? 1 : 0;
    sauverInvitation(inv.id);
    majLigne(inv.id);
    majDate(inv.dateId);
    return;
  }

  const champ = e.target.closest('select[data-champ]');
  if(champ){
    const inv = invitationDe(champ);
    if(!inv) return;
    const nom = champ.dataset.champ;
    inv[nom] = champ.value;
    /* Changer de catégorie peut faire déborder : quatre places qui tenaient en
       Carré Or ne tiennent pas forcément dans les deux CAT 1 restantes. On
       ramène, et on le dit — plutôt que d'accepter en silence un dépassement
       qui se découvrirait à l'entrée. */
    if(nom === 'categorie' && champ.value){
      const t = projetCourant();
      const d = t && dateDe(t, inv.dateId);
      const reste = d ? restantPlaces(d, invitationsCache, champ.value, inv) : null;
      if(reste != null && nombreInvit(inv.places) > reste){
        const demande = nombreInvit(inv.places);
        inv.places = Math.max(0, reste);
        const champPlaces = champ.closest('[data-ligne]').querySelector('[data-champ="places"]');
        if(champPlaces) champPlaces.value = inv.places || '';
        signaler(`${libellePlace(t, champ.value)} : ${demande} places demandées, ${Math.max(0, reste)} disponible${reste > 1 ? 's' : ''}. Ramené au contingent.`);
      }
    }
    sauverInvitation(inv.id);
    // La couleur suit le choix : sur une liste de quarante lignes, le type et
    // l'état se relisent d'un coup d'œil, ce qu'un libellé seul ne permet pas.
    if(nom === 'type'){
      const ty = INVITATION_TYPE[champ.value];
      champ.style.background = ty ? ty.fond : '';
      champ.style.color = ty ? ty.encre : '';
    }
    majLigne(inv.id);
    if(nom === 'categorie') majDate(inv.dateId);
    return;
  }
  // La couleur de la catégorie proposée dans la ligne de saisie ne change pas,
  // mais le type, si : même règle, pour que la ligne qu'on tape ressemble à
  // celles qu'on relit.
  const neuf = e.target.closest('select[data-neuf="type"]');
  if(neuf){
    const ty = INVITATION_TYPE[neuf.value];
    neuf.style.background = ty ? ty.fond : '';
    neuf.style.color = ty ? ty.encre : '';
    return;
  }

  if(e.target.id === 'selProjet'){
    projetChoisi = e.target.value;
    dateChoisie = '';
    poserDateParDefaut();
    majUrl();
    render();
    return;
  }
  if(e.target.id === 'selDate'){ dateChoisie = e.target.value; majUrl(); render(); return; }
  if(e.target.id === 'chkToutes'){
    toutesJournees = e.target.checked;
    if(!toutesJournees) poserDateParDefaut();
    render();
    return;
  }
});

/* La ligne de saisie. Entrée valide — dans n'importe quel champ, parce qu'on
   ne tape pas toujours l'e-mail, et qu'aller chercher le bouton à la souris
   casse le rythme. Après quoi le formulaire se vide, garde le type et le
   demandeur (on enchaîne souvent la même famille d'invitations), et rend la
   main dans « Nom ». */
document.addEventListener('submit', async (e)=>{
  const form = e.target.closest('#formSaisie');
  if(!form) return;
  e.preventDefault();
  const t = projetCourant();
  const d = dateCourante() || (t && datesInvitables(t)[0]);
  if(!t || !d) return;

  const lire = (nom)=>{ const el = form.querySelector(`[data-neuf="${nom}"]`); return el ? el.value : ''; };
  const places = nombreInvit(lire('places'));
  const categorie = lire('categorie');
  const caseAfter = form.querySelector('[data-neuf="aftershow"]');
  const aftershow = caseAfter && caseAfter.checked ? 1 : 0;
  const nom = lire('nom').trim(), prenom = lire('prenom').trim();

  /* Nom, prénom et demandeur : les trois sont exigés. Le nom et le prénom
     parce que c'est ce que la salle lit à l'entrée, et qu'une liste de « M.
     Durand » sans prénom se fait refuser quand deux Durand se présentent. Le
     demandeur parce que c'est la colonne que le tableur n'a jamais réussi à
     faire remplir, et sans elle le bilan de tournée ne dit rien. */
  if(!nom){
    signaler('Le nom est obligatoire : c\'est ce que la salle lira à l\'entrée.');
    form.querySelector('[data-neuf="nom"]').focus();
    return;
  }
  if(!prenom){
    signaler('Le prénom est obligatoire : deux homonymes se présentent, et la salle ne sait plus qui entre.');
    form.querySelector('[data-neuf="prenom"]').focus();
    return;
  }
  if(!lire('demandePar').trim()){
    signaler('Indique qui invite — c\'est ce qui permet de savoir, en fin de tournée, où sont parties les places.');
    form.querySelector('[data-neuf="demandePar"]').focus();
    return;
  }
  if(!places && !aftershow){
    signaler('Ni place ni aftershow : indique au moins l\'un des deux.');
    form.querySelector('[data-neuf="places"]').focus();
    return;
  }
  /* Le contingent, vérifié avant d'écrire. Le menu empêche déjà de CHOISIR une
     catégorie fermée ; il reste à refuser d'y mettre plus de places qu'il n'en
     reste — six demandées quand il en reste deux. On refuse plutôt que de
     ramener en silence : c'est une place promise à quelqu'un, la personne qui
     saisit doit savoir qu'elle ne l'a pas. */
  if(places){
    if(!categorie){
      signaler('Choisis une catégorie de place — c\'est elle que la salle nous alloue.');
      form.querySelector('[data-neuf="categorie"]').focus();
      return;
    }
    const reste = restantPlaces(d, invitationsCache, categorie);
    if(reste == null){
      signaler(`${libellePlace(t, categorie)} n'a pas encore de contingent sur cette date : pose-le d'abord dans le champ Contingent ci-dessus.`);
      const champQuota = document.querySelector(`[data-quota="${CSS.escape(categorie)}"]`);
      if(champQuota) champQuota.focus();
      return;
    }
    if(places > reste){
      signaler(`${libellePlace(t, categorie)} : ${places} places demandées, ${Math.max(0, reste)} disponible${reste > 1 ? 's' : ''}. Le contingent ne le permet pas.`);
      form.querySelector('[data-neuf="places"]').focus();
      return;
    }
  }
  signaler('');

  const inv = {
    id: genId('invit'), tourneeId: t.id, dateId: d.id,
    nom, prenom, email: lire('email').trim(),
    places, categorie: places ? categorie : '',
    aftershow, type: lire('type'),
    demandePar: lire('demandePar').trim(), etat:'accordee', note:'',
  };
  invitationsCache.push(inv);
  CurieuxDB.upsertOne('invitations', inv);

  const corps = document.querySelector(`[data-lignes="${CSS.escape(d.id)}"]`);
  if(corps){
    const vide = corps.querySelector('.empty-hint');
    if(vide) vide.remove();
    corps.insertAdjacentHTML('beforeend', htmlLigne(t, inv));
  }
  majDate(d.id);

  ['nom','prenom','email','places'].forEach(k=>{
    const el = form.querySelector(`[data-neuf="${k}"]`);
    if(el) el.value = '';
  });
  if(caseAfter) caseAfter.checked = false;
  // La catégorie proposée est rouverte par majDate ci-dessus : le basculement
  // Carré Or → CAT 1 se fait tout seul quand la première est pleine, sans
  // qu'on ait à y penser à la douzième ligne.
  form.querySelector('[data-neuf="nom"]').focus();
});

/* Un mot sous la ligne de saisie : pourquoi une invitation n'a pas été prise,
   ou ce qui vient d'être ramené au contingent. Il s'efface tout seul — un
   message d'erreur qui reste après correction fait douter. */
let timerMot = null;
function signaler(texte){
  const mot = document.getElementById('motSaisie');
  if(!mot) return;
  mot.textContent = texte;
  clearTimeout(timerMot);
  if(texte) timerMot = setTimeout(()=>{ if(mot.textContent === texte) mot.textContent = ''; }, 9000);
}

// Entrée valide depuis n'importe quel champ de la ligne de saisie, y compris
// les listes déroulantes — où la touche ne soumet pas d'elle-même.
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  const form = e.target.closest('#formSaisie');
  if(!form) return;
  e.preventDefault();
  form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable:true }));
});

document.addEventListener('click', async (e)=>{
  const onglet = e.target.closest('[data-vue]');
  if(onglet){ vue = onglet.dataset.vue; majUrl(); render(); return; }

  const aller = e.target.closest('[data-aller]');
  if(aller){ dateChoisie = aller.dataset.aller; vue = 'saisie'; majUrl(); render(); return; }

  // Une date en avant, une date en arrière. Sur une tournée de vingt-deux
  // concerts, c'est le geste qui remplace « rouvrir la liste et s'y retrouver ».
  const pas = e.target.closest('[data-date-pas]');
  if(pas){
    const t = projetCourant();
    const dates = t ? datesInvitables(t) : [];
    const i = dates.findIndex(d=> d.id === dateChoisie);
    const cible = dates[i + Number(pas.dataset.datePas)];
    if(!cible) return;
    dateChoisie = cible.id;
    majUrl();
    render();
    return;
  }

  const sup = e.target.closest('[data-supprimer]');
  if(sup){
    const inv = invitationsCache.find(i=> i.id === sup.dataset.supprimer);
    if(!inv) return;
    /* Une confirmation, parce que c'est irréversible et que la ligne rend ses
       places au contingent : on ne saura plus qu'elle a existé. */
    if(!confirm(`Retirer l'invitation de « ${nomInvite(inv)} » ?\n\nSes places reviennent au contingent. C'est définitif.`)) return;
    invitationsCache = invitationsCache.filter(i=> i.id !== inv.id);
    await CurieuxDB.removeOne('invitations', inv.id);
    const el = document.querySelector(`[data-ligne="${CSS.escape(inv.id)}"]`);
    if(el) el.remove();
    majDate(inv.dateId);
    return;
  }

  const pdfD = e.target.closest('[data-pdf-date]');
  if(pdfD){ pdfDate(pdfD.dataset.pdfDate); return; }
  const expS = e.target.closest('[data-export-salle]');
  if(expS){ exporterSalle(expS.dataset.exportSalle); return; }
  const expA = e.target.closest('[data-export-after]');
  if(expA){ exporterAftershow(expA.dataset.exportAfter); return; }
  if(e.target.closest('#btnPdfProjet')){ pdfProjet(); return; }
  if(e.target.closest('#btnExportProjet')){ exporterProjet(); return; }
});

function majUrl(){
  try{
    const p = new URLSearchParams();
    if(projetChoisi) p.set('projet', projetChoisi);
    if(vue !== 'recap') p.set('vue', vue);
    if(dateChoisie && vue === 'saisie') p.set('date', dateChoisie);
    history.replaceState(null, '', 'invitations.html' + (p.toString() ? '?' + p : ''));
  }catch(e){}
}

// La date de travail par défaut : la prochaine à venir. C'est celle qu'on
// remplit — les places d'un concert se donnent dans les semaines qui précèdent.
function poserDateParDefaut(){
  const t = projetCourant();
  const dates = t ? datesInvitables(t) : [];
  if(dates.some(d=> d.id === dateChoisie)) return;
  const aujourdhui = new Date().toISOString().slice(0, 10);
  const prochaine = dates.find(d=> d.date && d.date >= aujourdhui);
  dateChoisie = (prochaine || dates[dates.length - 1] || {}).id || '';
}

// --- Exports CSV ------------------------------------------------------------
/* Le point-virgule et le BOM : c'est ce qu'Excel en français ouvre sans
   question. Une virgule lui fait tout mettre dans une seule colonne, et sans
   BOM les accents partent en mojibake — deux ennuis qu'on ne veut pas faire
   subir à la personne de la billetterie. */

function csvEscape(v){
  const s = v == null ? '' : String(v);
  return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function telecharger(nomFichier, lignes){
  const blob = new Blob(['﻿' + lignes.join('\r\n')], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomFichier;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function slug(s){
  return String(s || 'projet').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'projet';
}

// Les lignes prêtes à partir : ni annulées, ni vides. Triées par catégorie puis
// par nom — l'ordre dans lequel la billetterie prépare ses enveloppes.
function pourLaSalle(t, dateId){
  const ordre = placesDuProjet(t).map(c=> c.cle);
  return invitationsDe(dateId)
    .filter(i=> nombreInvit(i.places) > 0)
    .sort((a, b)=>{
      const ca = ordre.indexOf(a.categorie), cb = ordre.indexOf(b.categorie);
      if(ca !== cb) return (ca < 0 ? 99 : ca) - (cb < 0 ? 99 : cb);
      return nomInvite(a).localeCompare(nomInvite(b), 'fr');
    });
}
function pourAftershow(dateId){
  return invitationsDe(dateId)
    .filter(i=> aAftershow(i))
    .sort((a, b)=> nomInvite(a).localeCompare(nomInvite(b), 'fr'));
}

function exporterSalle(dateId){
  const t = projetCourant();
  const d = t && dateDe(t, dateId);
  if(!d) return;
  const lignes = pourLaSalle(t, dateId);
  if(!lignes.length){ alert('Aucune place à transmettre sur cette date.'); return; }
  const sansCat = lignes.filter(i=> !i.categorie).length;
  if(sansCat && !confirm(`${sansCat} ligne${sansCat > 1 ? 's' : ''} n'${sansCat > 1 ? 'ont' : 'a'} pas de catégorie de place : la colonne CAT partira vide.\n\nExporter quand même ?`)) return;
  const out = ['NOM;PRÉNOM;EMAIL;NBR PLACE;CAT'];
  lignes.forEach(i=> out.push([
    String(i.nom || '').toUpperCase(), i.prenom || '', i.email || '',
    nombreInvit(i.places), libellePlace(t, i.categorie),
  ].map(csvEscape).join(';')));
  telecharger(`invitations-${slug(t.nom)}-${clefFichier(d.date)}.csv`, out);
}

function exporterAftershow(dateId){
  const t = projetCourant();
  const d = t && dateDe(t, dateId);
  if(!d) return;
  const lignes = pourAftershow(dateId);
  if(!lignes.length){ alert('Personne à l\'aftershow sur cette date.'); return; }
  // Une liste de NOMS : c'est ce que lisent la sécurité à la porte et le
  // traiteur pour son compte. Pas de colonne « nombre » — un nom passe une fois.
  const out = ['NOM;PRÉNOM;EMAIL;TYPE;QUI INVITE'];
  lignes.forEach(i=> out.push([
    String(i.nom || '').toUpperCase(), i.prenom || '', i.email || '',
    (INVITATION_TYPE[i.type] || {}).libelle || '', i.demandePar || '',
  ].map(csvEscape).join(';')));
  telecharger(`aftershow-${slug(t.nom)}-${clefFichier(d.date)}.csv`, out);
  alert(`${lignes.length} personne${lignes.length > 1 ? 's' : ''} à l'aftershow — pense à passer le chiffre au traiteur et à la sécurité.`);
}

// Tout le projet en un fichier : l'archive de fin de tournée, celle qui répond
// à « qui avait invité qui ? » quand on refait la même salle l'an suivant.
function exporterProjet(){
  const t = projetCourant();
  if(!t) return;
  const out = ['DATE;VILLE;SALLE;NOM;PRÉNOM;EMAIL;NBR PLACE;CAT;AFTERSHOW;TYPE;QUI INVITE'];
  let n = 0;
  datesInvitables(t).forEach(d=>{
    invitationsDe(d.id)
      .sort((a, b)=> nomInvite(a).localeCompare(nomInvite(b), 'fr'))
      .forEach(i=>{
        n++;
        out.push([
          d.date || '', d.ville || '', d.lieu || '',
          String(i.nom || '').toUpperCase(), i.prenom || '', i.email || '',
          nombreInvit(i.places), libellePlace(t, i.categorie), aAftershow(i) ? 'oui' : '',
          (INVITATION_TYPE[i.type] || {}).libelle || '', i.demandePar || '',
        ].map(csvEscape).join(';'));
      });
  });
  if(!n){ alert('Aucune invitation sur ce projet.'); return; }
  telecharger(`invitations-${slug(t.nom)}-${new Date().toISOString().slice(0, 10)}.csv`, out);
}

/* ---------------------------------------------------------------------------
   Le PDF — le document qu'on envoie
   ---------------------------------------------------------------------------
   Le CSV sert à une billetterie qui importe un fichier ; le PDF sert à une
   personne qui doit lire, vérifier et poser des enveloppes sur une table. Ce
   n'est pas le même objet, et le second est celui qu'on envoie à la prod.

   Une page par date, jamais deux dates sur une même feuille : la liste circule
   ensuite date par date, elle est imprimée et posée à l'entrée. Un document
   qui mélange le 12 et le 13 mars se fait relire de travers un soir de
   concert.

   Les groupes suivent la CATÉGORIE DE PLACE, pas le type : c'est ainsi que la
   salle travaille — un tas Carré Or, un tas CAT 1. Le type reste en colonne,
   pour nous.
--------------------------------------------------------------------------- */
function pdfInvitations(t, dates, nomFichier){
  if(!window.jspdf){ alert("La librairie PDF n'a pas pu être chargée. Vérifie la connexion, puis réessaie."); return null; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  registerHostFont(doc);
  const L = doc.internal.pageSize.getWidth();
  const H = doc.internal.pageSize.getHeight();
  const cats = placesDuProjet(t);
  const edite = new Date().toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });

  const retenues = [];
  let premiere = true;

  dates.forEach(d=>{
    const salle = pourLaSalle(t, d.id);
    const after = pourAftershow(d.id);
    if(!salle.length && !after.length) return;
    retenues.push(d);

    if(!premiere) doc.addPage();
    premiere = false;
    drawCurieuxPdfHeader(doc, L, 'INVITATIONS');

    let y = 30;
    doc.setFont('Host', 'bold'); doc.setFontSize(15); doc.setTextColor(121, 22, 73);
    doc.text(String(t.nom || 'Tournée'), 12, y);
    y += 6.5;
    const lieu = [d.ville, d.lieu].filter(Boolean).join(' · ');
    doc.setFont('Host', 'normal'); doc.setFontSize(11); doc.setTextColor(20, 22, 23);
    doc.text(`${jourSemaine(d.date)} ${fmtDateFR(d.date)}${lieu ? '  ·  ' + lieu : ''}`, 12, y);
    y += 5.5;

    // Le décompte en clair : ce qui est donné sur ce qui est alloué. La salle
    // vérifie ce chiffre avant de regarder un seul nom.
    const conso = consommeSurDate(invitationsCache, d.id);
    const bouts = cats
      .filter(c=> (conso.places[c.cle] || 0) > 0 || quotaDate(d, c.cle) != null)
      .map(c=>{
        const q = quotaDate(d, c.cle);
        return `${c.libelle} ${conso.places[c.cle] || 0}${q == null ? '' : ' / ' + q}`;
      });
    if(after.length) bouts.push(`Aftershow ${after.length} personne${after.length > 1 ? 's' : ''}`);
    doc.setFontSize(9.5); doc.setTextColor(122, 102, 118);
    doc.text(bouts.join('   ·   ') || 'Aucun contingent fixé', 12, y);
    y += 7;

    const bandeau = (titre)=>{
      if(y > H - 40){ doc.addPage(); y = 16; }
      doc.setFillColor(253, 227, 238);
      doc.rect(12, y, L - 24, 7.5, 'F');
      doc.setFont('Host', 'bold'); doc.setFontSize(10); doc.setTextColor(121, 22, 73);
      doc.text(titre, 15, y + 5.3);
      y += 10.5;
    };
    // 186 mm utiles entre les marges, dans les deux mises en page.
    const COLS = { 0:{cellWidth:36, fontStyle:'bold'}, 1:{cellWidth:30}, 2:{cellWidth:54},
                   3:{cellWidth:12, halign:'right', fontStyle:'bold'}, 4:{cellWidth:30}, 5:{cellWidth:24} };
    const COLS_AFTER = { 0:{cellWidth:40, fontStyle:'bold'}, 1:{cellWidth:34}, 2:{cellWidth:58},
                         4:{cellWidth:28}, 3:{cellWidth:26} };
    const tableau = (entetes, corps, cols)=>{
      doc.autoTable({
        startY: y, margin:{ left:12, right:12 },
        head: [entetes], body: corps,
        styles:{ font:'Host', fontSize:9, cellPadding:2.4, textColor:[20, 22, 23] },
        columnStyles: cols || COLS,
        headStyles:{ fillColor:[121, 22, 73], textColor:255, fontStyle:'bold' },
        alternateRowStyles:{ fillColor:[253, 248, 246] },
      });
      y = doc.lastAutoTable.finalY + 8;
    };

    // Un groupe par catégorie, dans l'ordre du projet ; les lignes sans
    // catégorie ferment la marche plutôt que de disparaître — c'est à la prod
    // de trancher, pas à l'export de les perdre.
    const groupes = cats.map(c=> ({ titre:c.libelle, quota:quotaDate(d, c.cle),
                                    lignes: salle.filter(i=> i.categorie === c.cle) }))
      .filter(g=> g.lignes.length);
    const orphelines = salle.filter(i=> !cats.some(c=> c.cle === i.categorie));
    if(orphelines.length) groupes.push({ titre:'Catégorie à préciser', quota:null, lignes:orphelines });

    groupes.forEach(g=>{
      const n = g.lignes.reduce((s, i)=> s + nombreInvit(i.places), 0);
      bandeau(`${g.titre.toUpperCase()} — ${n} place${n > 1 ? 's' : ''}${g.quota != null ? ` sur ${g.quota} allouée${g.quota > 1 ? 's' : ''}` : ''}`);
      tableau(['Nom', 'Prénom', 'E-mail', 'Pl.', 'Type', 'Qui invite'],
        g.lignes.map(i=> [
          String(i.nom || '').toUpperCase(), i.prenom || '', i.email || '',
          nombreInvit(i.places), (INVITATION_TYPE[i.type] || {}).libelle || '', i.demandePar || '',
        ]));
    });

    if(after.length){
      // Une liste de noms : la sécurité coche, elle ne compte pas.
      bandeau(`AFTERSHOW — ${after.length} personne${after.length > 1 ? 's' : ''}`);
      tableau(['Nom', 'Prénom', 'E-mail', 'Type', 'Qui invite'],
        after.map(i=> [
          String(i.nom || '').toUpperCase(), i.prenom || '', i.email || '',
          (INVITATION_TYPE[i.type] || {}).libelle || '', i.demandePar || '',
        ]), COLS_AFTER);
    }

    if(!salle.length){
      doc.setFont('Host', 'normal'); doc.setFontSize(9.5); doc.setTextColor(122, 102, 118);
      doc.text("Aucune place sur cette date — seul l'aftershow est concerné.", 12, y);
    }
  });

  if(!retenues.length){ alert('Rien à exporter : aucune invitation sur ces dates.'); return null; }

  /* Le pied de page, sur toutes les feuilles. Une liste d'invitations circule
     par mail, s'imprime, se photocopie : sans la date d'édition, personne ne
     sait si la feuille posée à l'entrée est la dernière version. */
  const total = doc.internal.getNumberOfPages();
  for(let p = 1; p <= total; p++){
    doc.setPage(p);
    doc.setFont('Host', 'normal'); doc.setFontSize(8); doc.setTextColor(122, 102, 118);
    doc.text(`Curieux orchestre · liste éditée le ${edite}`, 12, H - 8);
    doc.text(`${p} / ${total}`, L - 12, H - 8, { align:'right' });
  }

  doc.save(nomFichier);
  return retenues;
}

function pdfDate(dateId){
  const t = projetCourant();
  const d = t && dateDe(t, dateId);
  if(!d) return;
  pdfInvitations(t, [d], `invitations-${slug(t.nom)}-${clefFichier(d.date)}.pdf`);
}
function pdfProjet(){
  const t = projetCourant();
  if(!t) return;
  pdfInvitations(t, datesInvitables(t), `invitations-${slug(t.nom)}-${new Date().toISOString().slice(0, 10)}.pdf`);
}

// --- Démarrage --------------------------------------------------------------

applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);

async function initData(){
  try{
    const s = await CurieuxDB.getSession();
    MOI = demandeurDuCompte(s && s.user && s.user.email);
  }catch(e){}

  [tourneesCache, invitationsCache] = await Promise.all([
    CurieuxDB.fetchAll('tournees'),
    CurieuxDB.fetchAll('invitations'),
  ]);
  invitationsCache.forEach(rapprocherDemandeur);

  // ?projet=… &date=… &vue=… : c'est ainsi qu'on arrive depuis le panneau
  // Invitations d'une tournée, et qu'un rechargement retombe sur ses pieds.
  let p = new URLSearchParams();
  try{ p = new URLSearchParams(location.search); }catch(e){}
  const invitables = projetsInvitables();
  const voulu = p.get('projet') || '';
  projetChoisi = invitables.some(t=> t.id === voulu) ? voulu : ((invitables[0] || {}).id || '');
  if(p.get('vue') === 'saisie') vue = 'saisie';
  // Un lien qui désigne une date précise vise la saisie : c'est là qu'on la
  // remplit, et non le tableau de toutes les dates.
  if(p.get('date')) vue = 'saisie';
  dateChoisie = p.get('date') || '';
  poserDateParDefaut();

  render();
}

CurieuxDB.subscribe('invitations', ()=>{
  CurieuxDB.fetchAll('invitations').then(list=>{
    list.forEach(rapprocherDemandeur);
    invitationsCache = list;
    curieuxRafraichir(renderCorps);
  });
});
CurieuxDB.subscribe('tournees', ()=>{
  CurieuxDB.fetchAll('tournees').then(list=>{ tourneesCache = list; curieuxRafraichir(render); });
});
initData();
</script>
