<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Fiche technique</title>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/db.js"></script>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<!-- Page volontairement PUBLIQUE : envoyée aux salles, pas de compte requis.
     Le jeton dans l'URL (fiches_techniques.token) résout le lien Drive
     actuel — toujours à jour, sans synchronisation à faire. -->
<script>try{ injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); injectBugReportWidget(); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* ==========================================================================
     Fiche technique — page publique envoyée aux salles.

     Hors maquette, et sans nav.js : elle s'ouvre sans compte, chez un
     interlocuteur extérieur à la production. Le bandeau prune y afficherait
     l'organisation interne de l'orchestre à quelqu'un qui n'a rien à y faire.

     L'encart et le bouton viennent de base.css (.co-card, .co-btn) — ils y
     étaient redéfinis à l'identique.
     ========================================================================== */
  .wrap{max-width:520px; margin:0 auto; text-align:center; padding-top:60px;}
  .brand-logo-img{height:32px; width:auto; display:block; margin:0 auto 32px;}
  .state-box{padding:32px 24px; color:var(--muted); font-size:14px;}
  .fiche-card{padding:32px 26px;}
  .fiche-card .version{color:var(--muted); font-size:13px; margin-bottom:22px;}
</style>
</head>
<body>
<div class="wrap">
  <img class="brand-logo-img" alt="Curieux orchestre">
  <div id="content"><div class="co-card state-box">Chargement…</div></div>
</div>
<script>
async function init(){
  const token = new URLSearchParams(location.search).get('jeton');
  const box = document.getElementById('content');
  if(!token){ box.innerHTML = `<div class="co-card state-box">Lien incomplet — il manque le jeton.</div>`; return; }

  const fiche = await CurieuxDB.getFicheTechniqueByToken(token);
  if(!fiche || !fiche.driveUrl){
    box.innerHTML = `<div class="co-card state-box">Ce lien n'a pas encore de fichier associé, ou n'est plus actif.</div>`;
    return;
  }
  box.innerHTML = `
    <div class="co-card fiche-card">
      <h1 class="co-h1">${escapeHtml(fiche.nom || 'Fiche technique')}</h1>
      <p class="version">${fiche.versionActuelle ? 'Version ' + escapeHtml(fiche.versionActuelle) : 'Version courante'}${fiche.versionLe ? ' · mise à jour le ' + new Date(fiche.versionLe).toLocaleDateString('fr-FR') : ''}</p>
      <a class="co-btn primary" href="${fiche.driveUrl}" target="_blank" rel="noopener">Ouvrir la fiche technique</a>
    </div>
  `;
}
applyBrandLogo();
init();
</script>
</body>
</html>
