<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Mon accès</title>
<!-- Page volontairement PUBLIQUE : c'est l'adresse de retour du lien magique.
     La session s'établit ici, puis la liaison est demandée au serveur, qui
     vérifie lui-même le jeton et l'adresse email. -->
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/db.js"></script>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<script>try{ injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  .wrap{max-width:520px; margin:0 auto; padding:0 22px 80px;}
  .carte{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:28px 26px; margin-top:8vh;
  }
  .carte img.brand-logo-img{height:34px; margin-bottom:20px;}
  h1{font-size:21px; margin:0 0 12px; color:var(--text);}
  p{color:var(--muted); font-size:14.5px; line-height:1.6; margin:0 0 14px;}
  p.fort{color:var(--text);}
  .etat{
    border-radius:8px; padding:13px 15px; font-size:13.5px; line-height:1.55; margin-bottom:16px;
  }
  .etat.ok{background:var(--ok-tint); color:var(--ok);}
  .etat.ko{background:var(--danger-tint); color:var(--danger);}
  .etat.attente{background:var(--bg); color:var(--muted); border:1px solid var(--border);}
  a.bouton{
    display:block; text-align:center; text-decoration:none; margin-top:8px;
    border-radius:8px; font-size:14.5px; font-weight:700; padding:12px;
    background:var(--accent-solid); color:#fff;
  }
  a.bouton:hover{background:var(--accent-dark);}
  a.lien{display:block; margin-top:16px; font-size:12.5px; color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <div class="carte">
    <img class="brand-logo-img" alt="Curieux orchestre">
    <h1 id="titre">Finalisation…</h1>
    <div class="etat attente" id="etat">Vérification de ton lien de connexion…</div>
    <div id="suite"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
// Le jeton voyage dans l'adresse de retour ; le stockage local sert de second
// recours quand le lien a été ouvert sur le même appareil.
let TOKEN = params.get('token') || '';
if(!TOKEN){
  try{ TOKEN = localStorage.getItem('curieux-jeton-liaison') || ''; }catch(e){}
}

const titreEl = document.getElementById('titre');
const etatEl = document.getElementById('etat');
const suiteEl = document.getElementById('suite');

function etat(texte, genre){
  etatEl.textContent = texte;
  etatEl.className = 'etat ' + genre;
}

const MOTIFS = {
  non_connecte:        "La connexion n'a pas abouti. Le lien a peut-être expiré — il est valable une heure.",
  jeton_invalide:      "Ce lien personnel n'est plus valable. Demande-nous de t'en renvoyer un.",
  compte_sans_email:   "Ton compte n'a pas d'adresse email associée. Contacte-nous.",
  personne_deja_prise: "Un accès existe déjà pour cette fiche, avec une autre adresse email. Si c'est bien toi, contacte-nous.",
  compte_deja_lie:     "Cette adresse email est déjà rattachée à une autre fiche.",
  email_different:     "L'adresse que tu as utilisée ne correspond pas à celle que nous avons dans ton dossier. Utilise celle-là, ou préviens-nous si elle a changé.",
  erreur:              "Quelque chose s'est mal passé. Réessaie dans un instant.",
  indisponible:        "Service indisponible pour le moment.",
};

async function finaliser(){
  // Le SDK Supabase lit le lien magique et pose la session au chargement.
  let session = await CurieuxDB.getSession();
  // Petit délai de grâce : selon le navigateur, la session s'établit juste après.
  for(let i = 0; i < 10 && !session; i++){
    await new Promise(r => setTimeout(r, 200));
    session = await CurieuxDB.getSession();
  }

  if(!session){
    titreEl.textContent = 'Connexion non aboutie';
    etat(MOTIFS.non_connecte, 'ko');
    suiteEl.innerHTML = TOKEN
      ? `<a class="bouton" href="creer-acces.html?token=${encodeURIComponent(TOKEN)}">Redemander un lien</a>`
      : '';
    return;
  }

  if(!TOKEN){
    titreEl.textContent = 'Lien personnel manquant';
    etat("Ta connexion a réussi, mais nous ne savons pas à quelle fiche te rattacher. Rouvre ton lien personnel puis relance la création d'accès.", 'ko');
    return;
  }

  const r = await CurieuxDB.lierCompteAPersonne(TOKEN);

  if(r && r.ok){
    try{ localStorage.removeItem('curieux-jeton-liaison'); }catch(e){}
    const qui = [r.prenom, r.nom].filter(Boolean).join(' ');
    titreEl.textContent = r.motif === 'deja_lie' ? 'Tu es déjà connecté·e' : 'Ton accès est créé';
    etat(qui ? `Bienvenue ${qui} — ton compte est bien rattaché à ta fiche.` : 'Ton compte est bien rattaché à ta fiche.', 'ok');
    suiteEl.innerHTML = `
      <p class="fort">Tes informations personnelles ne sont désormais accessibles qu'en passant par ta boîte mail.</p>
      <p>Ton ancien lien continue de fonctionner pour l'instant, le temps que tout le monde ait créé son accès.</p>
      <a class="bouton" href="mes-infos.html?token=${encodeURIComponent(TOKEN)}">Voir mes informations</a>`;
    return;
  }

  titreEl.textContent = "Accès non créé";
  etat((r && MOTIFS[r.motif]) || MOTIFS.erreur, 'ko');
  if(r && r.motif === 'email_different'){
    suiteEl.innerHTML = `<a class="bouton" href="creer-acces.html?token=${encodeURIComponent(TOKEN)}">Essayer une autre adresse</a>`;
  }
}

finaliser();
applyBrandLogo();
setInterval(applyAutoTheme, 5 * 60 * 1000);
</script>
</body>
</html>
