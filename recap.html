<link rel="stylesheet" href="assets/base.css">
<style>
  .wrap{max-width:1240px; margin:0 auto;}
  h2.section-title{
    font-size:15.5px; margin:36px 0 4px; display:flex; align-items:center; gap:9px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--accent-dark);
  }
  h2.section-title::before{content:''; width:5px; height:16px; border-radius:3px; background:var(--accent); display:inline-block;}
  .section-sub{color:var(--muted); font-size:12.5px; margin:0 0 14px;}

  .grid-table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--card);}
  table.recap-table{width:100%; min-width:760px; border-collapse:collapse;}
  table.recap-table th{font-size:10.5px; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
  table.recap-table td{padding:9px 10px; vertical-align:top; border-bottom:1px solid var(--border); font-size:13px;}
  table.recap-table tr:last-child td{border-bottom:none;}
  table.recap-table tr:hover td{background:var(--accent-tint);}
  .tournee-tag{
    display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;
    background:var(--champagne); color:#7a1f52; white-space:nowrap; text-decoration:none;
  }
  :root[data-theme="dark"] .tournee-tag{color:#f8d9e8;}
  .chips{display:flex; flex-wrap:wrap; gap:4px;}
  .chip{
    display:inline-flex; align-items:center; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:20px; background:var(--accent-tint); color:var(--accent-dark); white-space:nowrap;
  }

  /* Le gabarit de la matrice vient maintenant de base.css (.co-matrix et
     compagnie). Ne restent ici que les quatre états de case, qui sont propres
     à cet écran : affecté·e, disponible, indisponible, à confirmer. */
  .m-cell.assigned{background:var(--ok); border-color:var(--ok); color:#fff;}
  .m-cell.dispo{background:var(--accent-tint); border-color:var(--accent-dark); color:var(--accent-dark); font-weight:900;}
  .m-cell.indispo{background:var(--ko); border-color:var(--ko); color:#fff;}
  .m-cell.incertain{background:var(--maybe); border-color:var(--maybe); color:#fff;}
  .dashboard-strip{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin-bottom:22px;}
  /* Les sept règles .kpi-* qui vivaient ici sont parties : les chiffres clés
     sont désormais des étiquettes .co-stat de la charte, elles ne
     s'appliquaient plus à rien. */
  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:10px 0 4px;}
  /* Le sélecteur de tournée et l'export tenaient dans un span en display:flex
     sans flex-wrap : à eux deux ils réclamaient 470 px et faisaient déborder la
     page sur téléphone. Ils se replient maintenant, et le sélecteur accepte de
     rétrécir — sans min-width:0 un select en flex refuse de passer sous sa
     largeur de contenu, quelle que soit la place disponible. */
  .legend-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-left:auto;}
  .legend-actions .co-select{width:auto; min-width:0; flex:1 1 150px;}
  @media (max-width:600px){ .legend-actions{margin-left:0; width:100%;} }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:14px; height:14px; border-radius:4px; display:inline-block; border:1px solid var(--border);}
  .swatch.assigned{background:var(--ok); border-color:var(--ok);}
  .swatch.dispo{background:var(--accent-tint); border-color:var(--accent-dark);}
  .swatch.indispo{background:var(--ko); border-color:var(--ko);}
  .swatch.incertain{background:var(--maybe); border-color:var(--maybe);}
  .remplacant-tag{
    font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    padding:1px 6px; border-radius:20px; background:var(--accent-tint); color:var(--accent-dark); margin-left:6px; vertical-align:middle;
  }
  .dispo-filter-row{display:flex; gap:8px; align-items:center; margin:-2px 0 10px; flex-wrap:wrap;}
  .dispo-filter-row label{font-size:12px; color:var(--muted); font-weight:600;}
  .dispo-filter-row select{
    padding:7px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px;
    background:var(--card); color:var(--text); font-family:inherit;
  }
  
</style>
</head>
<body>
<div class="wrap">
  <div class="co-page-head co-fade">
    <div>
      <h1>Vue d'ensemble</h1>
      <p class="subtitle">Qui joue où, toutes tournées confondues — case pleine = affecté·e, le contour indique la disponibilité renseignée.</p>
    </div>
  </div>

  <div class="dashboard-strip co-stats-charte" id="dashboardStrip"></div>

  <div class="legend">
    <span><span class="swatch assigned"></span> Affecté·e</span>
    <span><span class="swatch dispo"></span> Dispo (non affecté·e)</span>
    <span><span class="swatch indispo"></span> Indispo</span>
    <span><span class="swatch incertain"></span> À confirmer</span>
    <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-weight:600; color:var(--muted);">
      <input type="checkbox" id="showPastDates"> Afficher aussi les dates passées
    </label>
    <span class="legend-actions">
      <select class="co-select" id="pdfTourneeSelect">
        <option value="">Toutes les tournées</option>
      </select>
      <button type="button" class="co-btn primary md" id="exportPdfBtn"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:2px;"><path d="M6 2.5h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-17a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M14 2.5v4h4" fill="none" stroke="currentColor" stroke-width="1.6"></path><line x1="12" y1="12" x2="12" y2="18.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line><polyline points="9,16 12,19 15,16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></polyline></svg> Exporter en PDF</button>
    </span>
  </div>

  <h2 class="section-title">Musicien·nes</h2>
  <div class="dispo-filter-row">
    <label for="musicienStatutFilter">Afficher :</label>
    <select id="musicienStatutFilter">
      <option value="titulaire" selected>Titulaires uniquement</option>
      <option value="">Tou·tes (titulaires en premier)</option>
      <option value="remplacant">Remplaçant·es uniquement</option>
    </select>
  </div>
  <div id="matrixHolderMusiciens"><div class="empty-hint">Chargement…</div></div>

  <h2 class="section-title">Technicien·nes</h2>
  <div id="matrixHolderTechniciens"></div>
</div>

<script>
// Caches mémoire synchronisés avec Supabase (voir annuaire.html pour le pattern).
// Cette page est en lecture seule (recap), les 3 caches ne sont jamais écrits ici.
let tourneesCache = [];
let musiciansCache = [];
let techniciansCache = [];
let dispoDemandesCache = [];

function loadTournees(){ return tourneesCache; }
function loadMusicians(){ return musiciansCache; }
function loadTechnicians(){ return techniciansCache; }
function fmtDateFR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const months = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `${parseInt(d,10)} ${months[parseInt(m,10)-1]} ${y}`;
}
function fmtDateFRShort(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const months = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `${parseInt(d,10)} ${months[parseInt(m,10)-1]}`;
}

let showPastDates = false;

function allDateEntries(assignField, tourneeId){
  const tournees = tourneeId ? loadTournees().filter(t=>t.id === tourneeId) : loadTournees();
  const entries = [];
  tournees.forEach(t=>{
    (t.dates||[]).forEach(d=>{
      if(!d.date) return;
      entries.push({ tourneeId: t.id, tourneeNom: t.nom, date: d.date, ville: d.ville, lieu: d.lieu, commentaire: d.commentaire, statut: d.statut, assignes: d[assignField] || [] });
    });
  });
  entries.sort((a,b)=> a.date.localeCompare(b.date));
  if(!showPastDates){
    const today = new Date().toISOString().slice(0, 10);
    return entries.filter(e=> e.date >= today);
  }
  return entries;
}

// Titulaires en priorité (avant les remplaçant·es), alphabétique au sein de chaque
// groupe. Sans effet sur les technicien·nes (pas de statutPoste).
function compareByStatutThenName(a, b){
  const rank = m => (m.statutPoste === 'remplacant' ? 1 : 0);
  const ra = rank(a), rb = rank(b);
  if(ra !== rb) return ra - rb;
  return fullName(a).localeCompare(fullName(b));
}

function renderPeopleMatrix(people, assignField, holderId, emptyLinkHref, emptyLinkLabel, nameLabel){
  const entries = allDateEntries(assignField);
  const sorted = people.slice().sort(compareByStatutThenName);
  const holder = document.getElementById(holderId);

  if(sorted.length === 0){
    holder.innerHTML = `<div class="empty-hint">Ajoute d'abord dans l'<a href="${emptyLinkHref}">${emptyLinkLabel}</a>.</div>`;
    return;
  }
  if(entries.length === 0){
    holder.innerHTML = !showPastDates && loadTournees().some(t=> (t.dates||[]).some(d=> d.date))
      ? `<div class="empty-hint">Aucune date à venir — coche « Afficher aussi les dates passées » ci-dessus pour voir l'historique.</div>`
      : `<div class="empty-hint">Aucune date pour l'instant.</div>`;
    return;
  }

  const tourneeIds = loadTournees().map(t=>t.id);
  const colorByTournee = new Map(tourneeIds.map((id, i)=> [id, `var(--tour-${i % 8})`]));
  const colorFor = e => colorByTournee.get(e.tourneeId) || 'transparent';

  // La matrice quitte le <table> pour la grille .co-matrix de base.css, livrée
  // avec la charte et jusqu'ici inutilisée. Le gain n'est pas que cosmétique :
  // .co-matrix-name est collante à gauche, donc le nom reste visible quand on
  // fait défiler vingt dates — ce qu'un <th> de tableau ne faisait pas.
  const head = `
    <div class="co-matrix-row co-matrix-head">
      <div class="co-matrix-name">${nameLabel}</div>
      ${entries.map(e=>`
        <div class="co-matrix-date" style="background:${colorFor(e)};" title="${escapeHtml(e.tourneeNom || '')} — ${escapeHtml([e.ville, e.lieu].filter(Boolean).join(' · '))}">
          ${escapeHtml(fmtDateFRShort(e.date))}
          <small>${escapeHtml((e.ville || '').split(' (')[0] || '—')}</small>
        </div>
      `).join('')}
    </div>
  `;

  const rows = sorted.map(m=>{
    const dispo = m.disponibilites || {};
    return `
      <div class="co-matrix-row">
        <div class="co-matrix-name"><b>${escapeHtml(fullName(m))}</b>${m.statutPoste === 'remplacant' ? '<small>Remplaçant·e</small>' : `<small>${escapeHtml(m.instrument || m.poste || '')}</small>`}</div>
        ${entries.map(e=>{
          const assigned = (e.assignes||[]).includes(m.id);
          const state = dispo[e.date] || '';
          let cls = '', symbol = '—', title = 'Non renseigné';
          if(assigned){ cls = 'assigned'; symbol = '✓'; title = `Affecté·e — ${escapeHtml(e.tourneeNom || '')}`; }
          else if(state === 'dispo'){ cls = 'dispo'; symbol = '✓'; title = 'Disponible'; }
          else if(state === 'indispo'){ cls = 'indispo'; symbol = '✕'; title = 'Indisponible'; }
          else if(state === 'incertain'){ cls = 'incertain'; symbol = '?'; title = 'À confirmer'; }
          // data-jour : voir disponibilites.html — sert uniquement à la mise en
          // liste sur petit écran, sans rien changer au tableau sur ordinateur.
          return `<div class="co-matrix-cell" data-jour="${escapeAttr(fmtDateFRShort(e.date) + (e.ville ? ' · ' + e.ville : ''))}" style="background:${colorFor(e)};"><span class="co-matrix-btn m-cell ${cls}" title="${title}">${symbol}</span></div>`;
        }).join('')}
      </div>
    `;
  }).join('');

  const tourneeLegend = loadTournees().map(t=>`
    <span><span class="swatch" style="background:${colorByTournee.get(t.id)}; border-color:transparent;"></span> ${escapeHtml(t.nom || 'Tournée')}</span>
  `).join('');

  holder.innerHTML = `
    <div class="legend" style="margin-bottom:10px;">${tourneeLegend}</div>
    <div class="co-matrix">
      <div class="co-matrix-in">${head}${rows}</div>
    </div>
  `;
}

function renderAll(){
  const statutFilter = document.getElementById('musicienStatutFilter').value;
  const filteredMusicians = loadMusicians().filter(m=> !statutFilter || (m.statutPoste || 'titulaire') === statutFilter);
  renderPeopleMatrix(filteredMusicians, 'musiciensAssignes', 'matrixHolderMusiciens', 'annuaire.html', 'annuaire musicien·nes', "Musicien·ne");
  renderPeopleMatrix(loadTechnicians(), 'techniciensAssignes', 'matrixHolderTechniciens', 'techniciens.html', 'annuaire technicien·nes', "Technicien·ne");
  populateTourneeSelect();
  renderDashboard();
}

// --- Bande d'indicateurs : lecture rapide de ce qui mérite attention, sans avoir à
// dépouiller le tableau croisé date par date. Calculée à partir des mêmes caches que
// le reste de la page (+ dispo_demandes pour le suivi des réponses titulaires).
function renderDashboard(){
  const holder = document.getElementById('dashboardStrip');
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = allDateEntries('musiciensAssignes').filter(e=> e.date >= today && e.statut !== 'annulee');

  // Prochaine date à venir, toutes tournées confondues.
  const next = upcoming[0];

  // Dates à venir sans un·e seul·e musicien·ne affecté·e.
  const sansAffectation = upcoming.filter(e=> (e.assignes||[]).length === 0);

  // Dates à venir sans ville ni salle renseignées.
  const infosManquantes = upcoming.filter(e=> !e.ville && !e.lieu);

  // Dates à venir encore en option (pas encore validées) — à relancer/confirmer.
  const enOption = upcoming.filter(e=> e.statut === 'option');

  // Tournées ayant au moins une date à venir.
  const tourneesActives = new Set(upcoming.map(e=> e.tourneeId)).size;

  // Effectif de l'annuaire musicien·nes (titulaires vs remplaçant·es).
  const musiciensTitulaires = loadMusicians().filter(m=> (m.statutPoste||'titulaire') === 'titulaire').length;
  const musiciensRemplacants = loadMusicians().length - musiciensTitulaires;

  // Titulaires ayant un lien de dispo généré mais n'ayant pas répondu à toutes les
  // dates à venir de leur tournée (même logique que le badge "En attente" / "Nouvelles
  // dates" de la modale Demandes titulaires dans Tournées).
  const tourneesById = new Map(loadTournees().map(t=> [t.id, t]));
  const peopleById = new Map([...loadMusicians(), ...loadTechnicians()].map(p=> [p.id, p]));
  let reponsesEnAttente = 0;
  dispoDemandesCache.forEach(d=>{
    const tournee = tourneesById.get(d.tourneeId);
    const person = peopleById.get(d.personId);
    if(!tournee || !person) return;
    const answerableDates = (tournee.dates||[]).filter(dt=> dt.date && dt.date >= today && dt.statut !== 'annulee');
    if(answerableDates.length === 0) return;
    const dispo = person.disponibilites || {};
    const allAnswered = answerableDates.every(dt=> dispo[dt.date]);
    if(!allAnswered) reponsesEnAttente++;
  });

  const ICONS = {
    calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><line x1="3.5" y1="9.5" x2="20.5" y2="9.5" stroke="currentColor" stroke-width="1.4"></line><line x1="8" y1="3" x2="8" y2="6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><line x1="16" y1="3" x2="16" y2="6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><circle cx="8" cy="13.6" r="1.1" fill="currentColor"></circle><circle cx="12" cy="13.6" r="1.1" fill="currentColor"></circle><circle cx="16" cy="13.6" r="1.1" fill="currentColor"></circle>',
    warning: '<path d="M12 3.5 22 20.5H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><line x1="12" y1="9.5" x2="12" y2="14.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><circle cx="12" cy="17.2" r="1" fill="currentColor"></circle>',
    pin: '<path d="M12 21.5S5 14.8 5 9.8a7 7 0 1 1 14 0c0 5-7 11.7-7 11.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><circle cx="12" cy="9.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"></circle>',
    ticket: '<path d="M3.5 9.5a2 2 0 0 0 0 4v3.5a1 1 0 0 0 1 1h15a1 1 0 0 0 1-1V13.5a2 2 0 0 1 0-4V6a1 1 0 0 0-1-1h-15a1 1 0 0 0-1 1v3.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><line x1="14.5" y1="5.5" x2="14.5" y2="18" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 2"></line>',
    clock: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"></circle><polyline points="12,7 12,12 15.5,14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline>',
    bus: '<rect x="3.5" y="5" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><line x1="3.5" y1="10.3" x2="20.5" y2="10.3" stroke="currentColor" stroke-width="1.4"></line><circle cx="7.5" cy="19.3" r="1.4" fill="currentColor"></circle><circle cx="16.5" cy="19.3" r="1.4" fill="currentColor"></circle>',
    music: '<circle cx="7" cy="18" r="2.6" fill="currentColor"></circle><circle cx="16" cy="16" r="2.6" fill="currentColor"></circle><path d="M9.6 18V5.5L18.6 4v12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>',
  };
  const kpiIcon = name => `<svg width="19" height="19" viewBox="0 0 24 24">${ICONS[name]}</svg>`;

  const cards = [
    {
      icon: kpiIcon('calendar'), href:'tournees.html',
      value: next ? `${fmtDateFRShort(next.date)}` : '—',
      label: next ? `Prochaine date — ${escapeHtml(next.tourneeNom || '')}${next.ville ? ' · ' + escapeHtml(next.ville) : ''}` : 'Aucune date à venir'
    },
    {
      icon: kpiIcon('warning'), href:'tournees.html',
      value: String(sansAffectation.length), valueClass: sansAffectation.length > 0 ? 'warn' : 'ok',
      label:'Date' + (sansAffectation.length>1?'s':'') + ' à venir sans musicien·ne affecté·e'
    },
    {
      icon: kpiIcon('pin'), href:'tournees.html',
      value: String(infosManquantes.length), valueClass: infosManquantes.length > 0 ? 'warn' : 'ok',
      label:'Date' + (infosManquantes.length>1?'s':'') + ' à venir sans ville ni salle'
    },
    {
      icon: kpiIcon('ticket'), href:'tournees.html',
      value: String(enOption.length), valueClass: enOption.length > 0 ? 'warn' : 'ok',
      label:'Date' + (enOption.length>1?'s':'') + ' à venir encore en option'
    },
    {
      icon: kpiIcon('clock'), href:'suivi-dispo.html',
      value: String(reponsesEnAttente), valueClass: reponsesEnAttente > 0 ? 'warn' : 'ok',
      label:'Réponse' + (reponsesEnAttente>1?'s':'') + ' de dispo en attente (titulaires)'
    },
    {
      icon: kpiIcon('bus'), href:'tournees.html',
      value: String(tourneesActives),
      label:'Tournée' + (tourneesActives>1?'s':'') + ' avec des dates à venir'
    },
    {
      icon: kpiIcon('music'), href:'annuaire.html',
      value: `${musiciensTitulaires} + ${musiciensRemplacants}`,
      label:`Musicien·nes titulaires + remplaçant·es`
    }
  ];

  // Les chiffres clés en étiquettes de charte, comme la maquette : un aplat
  // plein par tuile, le nombre en police d'affichage, le libellé dessous, et
  // une légère inclinaison alternée qui donne l'effet « collé à la main ».
  // Pas d'icône : dans la maquette c'est le chiffre qui porte la tuile.
  //
  // Les six couleurs tournent dans l'ordre de la charte. L'encre est portée par
  // la tuile et non par le chiffre — sur un aplat prune ou orange, un chiffre
  // en vert d'alerte devenait illisible, c'est pourquoi valueClass ne sert plus
  // à colorer mais seulement à choisir entre aplat calme et aplat d'alerte.
  //
  // Les aplats sont posés par .co-stats-charte (voir base.css) — via nth-child,
  // comme sur l'accueil — et NON en inline : les couleurs charte figées posées
  // en dur ne s'assombrissaient pas en mode sombre, laissant une bande criarde
  // sur fond noir. On ne garde en inline que l'inclinaison.
  const TILTS = ['-1.4deg', '.9deg', '-.5deg', '1.2deg', '-1deg', '.6deg'];
  holder.innerHTML = cards.map((c, i)=> `
    <a class="co-stat" href="${c.href}" style="--co-tilt:${TILTS[i % TILTS.length]};">
      <div class="co-stat-num">${c.value}</div>
      <div class="co-stat-label">${c.label}</div>
    </a>
  `).join('');
}
document.getElementById('musicienStatutFilter').addEventListener('change', renderAll);
document.getElementById('showPastDates').addEventListener('change', e=>{ showPastDates = e.target.checked; renderAll(); });

injectCurieuxFonts();

applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);

async function initData(){
  [tourneesCache, musiciansCache, techniciansCache, dispoDemandesCache] = await Promise.all([
    CurieuxDB.fetchAll('tournees'),
    CurieuxDB.fetchAll('musiciens'),
    CurieuxDB.fetchAll('techniciens'),
    CurieuxDB.fetchAll('dispo_demandes'),
  ]);
  renderAll();
}
CurieuxDB.subscribe('tournees', ()=>{ CurieuxDB.fetchAll('tournees').then(list=>{ tourneesCache = list; curieuxRafraichir(renderAll); }); });
CurieuxDB.subscribe('musiciens', ()=>{ CurieuxDB.fetchAll('musiciens').then(list=>{ musiciansCache = list; curieuxRafraichir(renderAll); }); });
CurieuxDB.subscribe('techniciens', ()=>{ CurieuxDB.fetchAll('techniciens').then(list=>{ techniciansCache = list; curieuxRafraichir(renderAll); }); });
CurieuxDB.subscribe('dispo_demandes', ()=>{ CurieuxDB.fetchAll('dispo_demandes').then(list=>{ dispoDemandesCache = list; curieuxRafraichir(renderAll); }); });
initData();

function buildMatrixTable(doc, startY, people, assignField, title, pageWidth, tourneeId){
  const entries = allDateEntries(assignField, tourneeId);
  const sorted = people.slice().sort(compareByStatutThenName);
  if(sorted.length === 0 || entries.length === 0) return startY;

  doc.setFont('Host', 'bold');
  doc.setFontSize(11);
  doc.setTextColor(121, 22, 73);
  doc.text(title, 10, startY);

  doc.autoTable({
    startY: startY + 3,
    margin: { left: 10, right: 10 },
    head: [[ '', ...entries.map(e=> fmtDateFRShort(e.date)) ]],
    body: sorted.map(m=>{
      const dispo = m.disponibilites || {};
      return [ fullName(m), ...entries.map(e=>{
        const assigned = (e.assignes||[]).includes(m.id);
        const state = dispo[e.date] || '';
        if(assigned) return 'X';
        if(state === 'dispo') return 'd';
        if(state === 'indispo') return 'x';
        if(state === 'incertain') return '?';
        return '';
      })];
    }),
    styles: { font:'Host', fontSize:8, cellPadding:2, textColor:[20,22,23], halign:'center' },
    columnStyles: { 0: { halign:'left', fontStyle:'bold', fontSize:7, cellWidth:38 } },
    headStyles: { fillColor:[121,22,73], textColor:255, fontStyle:'bold', fontSize:6.5 },
    alternateRowStyles: { fillColor:[253,242,240] },
    didParseCell: (data)=>{
      if(data.section === 'body' && data.column.index > 0){
        const v = data.cell.raw;
        // Fond + symbole plutôt qu'une lettre brute — même code couleur que la grille à l'écran.
        if(v === 'X'){ data.cell.styles.fillColor = [47,143,91]; data.cell.styles.textColor = 255; data.cell.text = ['✓']; }
        else if(v === 'd'){ data.cell.styles.fillColor = [206,225,244]; data.cell.styles.textColor = [90,16,55]; data.cell.text = ['✓']; }
        else if(v === 'x'){ data.cell.styles.fillColor = [178,59,46]; data.cell.styles.textColor = 255; data.cell.text = ['✕']; }
        else if(v === '?'){ data.cell.styles.fillColor = [184,121,42]; data.cell.styles.textColor = 255; data.cell.text = ['?']; }
        else { data.cell.styles.textColor = [180,170,175]; data.cell.text = ['—']; }
      }
    }
  });
  return doc.lastAutoTable.finalY + 14;
}

function exportRecapPdf(){
  if(!window.jspdf){ alert("La librairie PDF n'a pas pu être chargée."); return; }
  const tourneeId = document.getElementById('pdfTourneeSelect').value || null;
  const tournee = tourneeId ? loadTournees().find(t=>t.id === tourneeId) : null;
  const headerTitle = tournee ? `VUE D'ENSEMBLE — ${(tournee.nom || 'TOURNÉE').toUpperCase()}` : 'VUE D\'ENSEMBLE';

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'landscape' });
  registerHostFont(doc);
  const pageWidth = doc.internal.pageSize.getWidth();
  drawCurieuxPdfHeader(doc, pageWidth, headerTitle);

  const statutFilter = document.getElementById('musicienStatutFilter').value;
  const filteredMusicians = loadMusicians().filter(m=> !statutFilter || (m.statutPoste || 'titulaire') === statutFilter);
  let y = buildMatrixTable(doc, 30, filteredMusicians, 'musiciensAssignes', 'MUSICIEN·NES (✓ vert = affecté·e, ✓ bleu = dispo, ✕ = indispo, ? = à confirmer)', pageWidth, tourneeId);
  if(y > 180){ doc.addPage(); drawCurieuxPdfHeader(doc, pageWidth, headerTitle); y = 30; }
  buildMatrixTable(doc, y, loadTechnicians(), 'techniciensAssignes', 'TECHNICIEN·NES (✓ vert = affecté·e, ✓ bleu = dispo, ✕ = indispo, ? = à confirmer)', pageWidth, tourneeId);

  const fileSuffix = tournee ? (tournee.nom||'tournee').trim().replace(/[^a-z0-9]+/gi,'_') : 'toutes_tournees';
  doc.save(`Vue_ensemble_Curieux_orchestre_${fileSuffix}.pdf`);
}
document.getElementById('exportPdfBtn').addEventListener('click', exportRecapPdf);

function populateTourneeSelect(){
  const sel = document.getElementById('pdfTourneeSelect');
  const current = sel.value;
  sel.innerHTML = `<option value="">Toutes les tournées</option>` +
    loadTournees().map(t=>`<option value="${escapeHtml(t.id)}">${escapeHtml(t.nom || 'Tournée')}</option>`).join('');
  if(loadTournees().some(t=>t.id === current)) sel.value = current;
}
