<link rel="stylesheet" href="assets/base.css">
<style>
  .wrap{max-width:min(1720px, 97vw); margin:0 auto;}

  /* Colonnes de recording : la même teinte de projet, assombrie d'un voile.
     Tournées et recordings partagent la palette --tour-0..7, et deux projets
     voisins peuvent tomber sur des teintes proches : le voile dit d'un coup
     d'œil lesquelles sont des séances de studio, sans consommer une couleur
     de plus ni ajouter un symbole dans chaque case.

     En sombre, les teintes de projet sont déjà foncées : les assombrir encore
     les ramènerait au fond de page et effacerait la distinction. Le voile
     s'inverse donc — même écart perçu, dans l'autre sens. */
  .co-matrix-date.colonne-reco, .co-matrix-cell.colonne-reco{
    box-shadow:inset 0 0 0 999px rgba(20, 22, 23, .14);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .co-matrix-date.colonne-reco,
    :root:not([data-theme="light"]) .co-matrix-cell.colonne-reco{
      box-shadow:inset 0 0 0 999px rgba(252, 242, 240, .11);
    }
  }
  :root[data-theme="dark"] .co-matrix-date.colonne-reco,
  :root[data-theme="dark"] .co-matrix-cell.colonne-reco{
    box-shadow:inset 0 0 0 999px rgba(252, 242, 240, .11);
  }
  h2.section-title{
    font-size:15.5px; margin:36px 0 4px; display:flex; align-items:center; gap:9px;
    text-transform:uppercase; letter-spacing:.04em; color:var(--accent-dark);
  }
  h2.section-title::before{content:''; width:5px; height:16px; border-radius:3px; background:var(--accent); display:inline-block;}
  .section-sub{color:var(--muted); font-size:12.5px; margin:0 0 14px;}

  .grid-table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--card);}
  table.recap-table{width:100%; min-width:760px; border-collapse:collapse;}
  table.recap-table th{font-size:10.5px; text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
  table.recap-table td{padding:9px 10px; vertical-align:top; border-bottom:1px solid var(--border); font-size:13px;}
  table.recap-table tr:last-child td{border-bottom:none;}
  table.recap-table tr:hover td{background:var(--accent-tint);}
  .tournee-tag{
    display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:20px;
    background:var(--champagne); color:#7a1f52; white-space:nowrap; text-decoration:none;
  }
  :root[data-theme="dark"] .tournee-tag{color:#f8d9e8;}
  .chips{display:flex; flex-wrap:wrap; gap:4px;}
  .chip{
    display:inline-flex; align-items:center; font-size:11px; font-weight:700;
    padding:3px 8px; border-radius:20px; background:var(--accent-tint); color:var(--accent-dark); white-space:nowrap;
  }

  /* Le gabarit de la matrice vient maintenant de base.css (.co-matrix et
     compagnie). Ne restent ici que les quatre états de case, qui sont propres
     à cet écran : affecté·e, disponible, indisponible, à confirmer. */
  /* La barre de modes : le clic sur une case fait UNE chose à la fois, et le
     mode armé se voit — pilule pleine, liseré de couleur sur les matrices. */
  /* La barre flotte en bas, et non plus collée sous le menu.
     Là-haut, elle se disputait la même bande de pixels que l'en-tête du
     tableau — lui aussi collant, et dessiné après elle : il la recouvrait à
     moitié dès qu'on faisait défiler la page. En bas, plus de conflit, et
     elle reste sous la main où qu'on en soit dans la saison. */
  .mode-bar{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:2px solid var(--border); border-radius:14px;
    padding:10px 16px; z-index:40;
    position:fixed; bottom:16px; left:0; right:0; margin-inline:auto;
    width:max-content; max-width:calc(100vw - 32px);
    box-shadow:0 10px 30px rgba(20,22,23,.20);
  }
  /* De la place sous le pied de page : sinon la barre flottante recouvre les
     mentions légales. Sur body et non sur .wrap — le pied de page est posé
     après lui (voir nav.js) — et en nommant aussi .co-has-topbar, qui fixe
     déjà ce rembourrage dans base.css et l'emporterait sinon. */
  body, body.co-has-topbar{padding-bottom:120px;}
  @media (max-width:1180px){ .mode-hint{display:none;} }
  @media (max-width:900px){
    /* Sur téléphone, l'essentiel tient sur une rangée : les deux modes et
       Oups. Le rappel « un clic sur une case » disparaît — il prend deux
       lignes pour dire ce que les pilules montrent déjà. */
    .mode-bar{
      left:10px; right:10px; width:auto; max-width:none;
      justify-content:center; gap:8px; bottom:10px; padding:8px 10px;
    }
    .mode-libelle, .mode-mot{display:none;}
    .mode-pilules button{padding:9px 13px; font-size:12.5px; white-space:nowrap;}
    #oupsBtn{padding:9px 14px; font-size:12.5px;}
  }
  .mode-libelle{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);}
  .mode-pilules{display:flex; gap:0; border:2px solid var(--border); border-radius:999px; overflow:hidden;}
  .mode-pilules button{
    cursor:pointer; border:none; background:transparent; color:var(--muted);
    padding:11px 22px; font-size:14px; font-weight:800; font-family:inherit;
  }
  .mode-pilules button + button{border-left:2px solid var(--border);}
  body.mode-marquer .mode-pilules [data-mode="marquer"]{background:var(--accent-solid); color:#fff;}
  body.mode-affecter .mode-pilules [data-mode="affecter"]{background:var(--secondary); color:#fff;}
  .mode-hint{flex:1; min-width:220px; font-size:12.5px; color:var(--muted); font-weight:600;}
  /* Oups : gros, jaune quand il a quelque chose à défaire, avec un sursaut à
     chaque action pour qu'on sache qu'il vient de s'armer. */
  #oupsBtn{
    border:2px solid var(--border); border-radius:999px; padding:11px 20px;
    font-size:13.5px; font-weight:800; font-family:inherit; cursor:pointer;
    background:transparent; color:var(--muted); max-width:420px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  #oupsBtn:not(:disabled){background:var(--maybe); border-color:var(--maybe); color:#fff;}
  #oupsBtn:disabled{cursor:default; opacity:.6;}
  @keyframes oupsPop{ 0%{transform:scale(1);} 45%{transform:scale(1.12);} 100%{transform:scale(1);} }
  #oupsBtn.frais{animation:oupsPop .35s ease;}
  body.mode-marquer .co-matrix{border-color:var(--accent);}
  body.mode-affecter .co-matrix{border-color:var(--secondary); border-width:2px;}
  [data-cellule]{cursor:pointer;}
  [data-cellule]:hover .m-cell{outline:2px solid currentColor; outline-offset:1px;}

  /* Hors demande : on n'a rien demandé à cette personne sur cette date. La
     case garde la couleur de son projet mais se raye en diagonale, et son
     symbole s'efface — elle reste cliquable, c'est une information, pas un
     verrou. */
  .co-matrix-cell.hors-demande{
    background-image:repeating-linear-gradient(135deg,
      transparent 0 5px, rgba(122,102,118,.14) 5px 7px);
  }
  .m-cell.hors-demande{opacity:.22; border-style:dashed;}
  .co-matrix-cell.hors-demande:hover .m-cell{opacity:.6;}
  .swatch.hors{
    background-image:repeating-linear-gradient(135deg,
      transparent 0 3px, var(--muted) 3px 4px);
    border-color:var(--border);
  }

  /* Une précision laissée par la personne (« ok mais je pars à 22h ») : point
     orange au coin de la case, texte complet au survol. */
  .m-cell{position:relative;}
  /* Le point n'est plus un ::after décoratif mais un vrai bouton : c'est lui
     qu'on clique pour répondre. Sa boîte fait 24 px (cible au doigt), son
     rembourrage transparent ; seul le disque de 10 px se voit. Il déborde la
     case de quelques pixels — d'où le z-index, pour passer devant la case
     voisine. */
  .co-matrix-cell{position:relative;}
  /* Poser le disque sur le coin haut-droit de la PASTILLE, pas sur celui de la
     case. On ne peut se caler ni sur le bord droit ni sur le bord haut de la
     case : elle est en flex:1 0 76px (donc plus large que 76 dès qu'il reste de
     la place) et sa hauteur suit la ligne, que la colonne des noms fixe. Seul
     le centre est stable — la pastille y est centrée par place-items:center.
     Elle fait 38 × 30 : son coin est à +19 px et -15 px du centre. */
  .point-note{
    position:absolute; left:calc(50% + 19px); top:calc(50% - 15px);
    transform:translate(-50%, -50%);
    width:24px; height:24px; z-index:3;
    display:grid; place-items:center; padding:0; border:none; background:none;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .point-note::before{
    content:''; width:10px; height:10px; border-radius:50%;
    background:var(--secondary); border:2px solid var(--card);
    transition:transform .1s ease;
  }
  .point-note:hover::before, .point-note:focus-visible::before{transform:scale(1.45);}
  .point-note:focus-visible{outline:2px solid var(--secondary); outline-offset:-3px; border-radius:50%;}
  .point-note.repondue::before{background:var(--prune);}
  /* Sur ordinateur, la précision s'affiche dans une bulle au survol : le
     title du navigateur arrive après une seconde, se coupe, et ne sait rien
     dire de qui parle ni de quand. Sur téléphone, où le survol n'existe pas,
     elle se lit à même la carte de la date. */
  .note-repliee{display:none;}
  #noteBulle{
    position:fixed; z-index:60; max-width:270px; pointer-events:none; opacity:0;
    transform:translateY(3px); transition:opacity .12s ease, transform .12s ease;
    background:var(--card); color:var(--text); border:1.5px solid var(--secondary);
    border-radius:12px; padding:9px 12px; box-shadow:0 10px 26px rgba(20,15,10,.20);
    font-size:12.5px; line-height:1.45;
  }
  #noteBulle.visible{opacity:1; transform:translateY(0);}
  #noteBulle b{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--secondary); font-weight:800; margin-bottom:3px;}
  #noteBulle i{font-style:italic; color:var(--text);}
  /* La réponse de la production, sous la précision, dans la même bulle. */
  #noteBulle u{display:block; text-decoration:none; margin-top:6px; padding-top:5px;
    border-top:1px dashed var(--border); color:var(--prune); font-weight:600;}
  #noteBulle u small{display:block; font-weight:400; font-size:10.5px; color:var(--muted); margin-top:2px;}
  @media (max-width:760px){
    /* Sur téléphone il n'y a pas de survol et le point de 24 px est une cible
       étroite au pouce : c'est la ligne de la précision, écrite en clair sur la
       carte de la date, qui ouvre la réponse. Elle est donc un bouton — mais
       elle doit continuer à ressembler à du texte. */
    .note-repliee{
      display:block; flex:1 1 100%; order:3; margin-top:4px;
      font-size:12px; font-style:italic; color:var(--secondary); line-height:1.4;
      white-space:normal; text-align:left; width:100%;
      background:none; border:none; padding:4px 0; font-family:inherit; cursor:pointer;
    }
    /* En liste, la case devient une ligne pleine largeur et la pastille se cale
       à droite : le centre ne dit plus rien, on repart du bord droit. */
    .point-note{left:auto; right:6px; top:4px; transform:none;}
    .reponse-repliee{display:block; margin-top:2px; color:var(--prune); font-weight:600;}
    .co-matrix-cell.porte-note{flex-wrap:wrap;}
  }

  /* ------------------------------------------------------------------------
     Répondre à une précision, sans quitter le tableau.

     La liste des précisions occupait, sous les deux matrices, une carte par
     précision : 566 px pour quatre remarques, un quart de la page, et sans
     plafond. Pour un geste qu'on fait trois fois par mois, sur une page dont
     le sujet est le tableau. Elle a disparu. On répond là où la remarque vit :
     le point du coin de la case est devenu un bouton, et il ouvre un petit
     panneau ancré à la case. Zéro pixel de page au repos.
  ------------------------------------------------------------------------ */
  .reponse-panneau{
    position:fixed; z-index:70; width:290px; max-width:calc(100vw - 24px);
    background:var(--card); border:1px solid var(--border); border-left:3px solid var(--secondary);
    border-radius:12px; box-shadow:0 14px 34px rgba(20,15,10,.24); padding:11px 13px;
  }
  .reponse-panneau.est-repondue{border-left-color:var(--prune);}
  .reponse-panneau b{display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--secondary); font-weight:800; margin-bottom:3px;}
  .reponse-panneau i{display:block; font-style:italic; line-height:1.45; font-size:12.5px;}
  .reponse-panneau textarea{
    width:100%; margin-top:9px; min-height:54px; resize:vertical; padding:7px 9px;
    border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text);
    font:inherit; font-size:12.5px; line-height:1.4;
  }
  .reponse-panneau textarea:focus{outline:none; border-color:var(--prune); box-shadow:inset 0 0 0 1px var(--prune);}
  .reponse-actions{display:flex; align-items:center; gap:7px; margin-top:8px; flex-wrap:wrap;}
  .reponse-actions .co-btn{padding:5px 11px; font-size:12px;}
  .reponse-signature{font-size:11px; color:var(--muted); margin-left:auto;}
  .lien-nu{background:none; border:none; padding:0; font:inherit; color:var(--secondary);
    text-decoration:underline; cursor:pointer;}

  /* La pastille qui dit ce qui attend encore un mot, glissée dans la bande de
     filtres qui existe déjà. Elle DISPARAÎT dès que tout a reçu une réponse :
     un compteur permanent qui ne tombe jamais à zéro serait une alarme de
     plus sur une page qui n'en manque pas. */
  .chip-precisions{
    display:inline-flex; align-items:center; gap:6px; border:1px solid var(--secondary);
    background:transparent; color:var(--secondary); border-radius:999px;
    padding:5px 11px; font:inherit; font-size:12px; font-weight:700; cursor:pointer;
  }
  .chip-precisions:hover{background:var(--accent-tint);}
  .chip-precisions::before{content:''; width:7px; height:7px; border-radius:50%; background:var(--secondary);}
  .chip-precisions[hidden]{display:none;}

  /* La case visée par « précision suivante » : deux battements, le temps de
     la retrouver des yeux dans un tableau de quatre-vingts colonnes. */
  @keyframes viseBat{
    0%,100%{box-shadow:0 0 0 0 rgba(236,75,21,0);}
    35%{box-shadow:0 0 0 4px rgba(236,75,21,.55);}
  }
  .co-matrix-cell.visee .m-cell{animation:viseBat .7s ease 2;}

  .m-cell.assigned{background:var(--ok); border-color:var(--ok); color:#fff;}
  .m-cell.dispo{background:var(--accent-tint); border-color:var(--accent-dark); color:var(--accent-dark); font-weight:900;}
  .m-cell.indispo{background:var(--ko); border-color:var(--ko); color:#fff;}
  .m-cell.incertain{background:var(--maybe); border-color:var(--maybe); color:#fff;}
  .dashboard-strip{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin-bottom:22px;}
  /* Les sept règles .kpi-* qui vivaient ici sont parties : les chiffres clés
     sont désormais des étiquettes .co-stat de la charte, elles ne
     s'appliquaient plus à rien. */
  .legend{display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:10px 0 4px;}
  /* Le sélecteur de tournée et l'export tenaient dans un span en display:flex
     sans flex-wrap : à eux deux ils réclamaient 470 px et faisaient déborder la
     page sur téléphone. Ils se replient maintenant, et le sélecteur accepte de
     rétrécir — sans min-width:0 un select en flex refuse de passer sous sa
     largeur de contenu, quelle que soit la place disponible. */
  .legend-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-left:auto;}
  .legend-actions .co-select{width:auto; min-width:0; flex:1 1 150px;}
  @media (max-width:600px){ .legend-actions{margin-left:0; width:100%;} }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:14px; height:14px; border-radius:4px; display:inline-block; border:1px solid var(--border);}
  .swatch.assigned{background:var(--ok); border-color:var(--ok);}
  .swatch.dispo{background:var(--accent-tint); border-color:var(--accent-dark);}
  .swatch.indispo{background:var(--ko); border-color:var(--ko);}
  .swatch.incertain{background:var(--maybe); border-color:var(--maybe);}
  /* Quand on lui a demandé ses dispos pour la dernière fois. Sur la même ligne
     que l'instrument : une ligne de plus par personne, sur quarante personnes,
     coûterait un écran entier. */
  .demande-le{
    cursor:pointer; border:none; background:transparent; font:inherit; font-size:11px;
    padding:0 2px; border-radius:5px; color:var(--muted); white-space:nowrap;
  }
  .demande-le:hover{background:var(--accent-tint); color:var(--accent-dark);}
  .demande-le.jamais{color:var(--secondary); font-weight:800;}

  /* Un·e remplaçant·e rangé·e sous son ou sa titulaire : la ligne se décale et
     porte une flèche, pour qu'on voie d'un coup à qui elle se rattache. */
  .co-matrix-row.sous-remplacant .co-matrix-name{padding-left:26px; background:var(--row-alt);}
  .co-matrix-row.sous-remplacant .co-matrix-name b{font-weight:600;}
  .fleche-sous{
    position:absolute; left:11px; top:calc(var(--row-pad) + 1px);
    color:var(--secondary); font-size:13px; font-weight:800;
  }

  .remplacant-tag{
    font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    padding:1px 6px; border-radius:20px; background:var(--accent-tint); color:var(--accent-dark); margin-left:6px; vertical-align:middle;
  }
  /* Choisir les projets à l'affiche. Un recording dont on a demandé les dispos
     largement pose douze colonnes pour un seul événement : sans ce filtre, il
     écrase à lui seul le reste de la saison. */
  .projets-filtre{display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin:10px 0 16px;}
  .projets-filtre-label{font-size:12px; color:var(--muted); font-weight:600;}
  .chip-projet{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-family:inherit;
    padding:5px 11px; border-radius:999px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:12.5px; font-weight:700;
  }
  .chip-projet .pastille{width:11px; height:11px; border-radius:50%; border:1px solid rgba(0,0,0,.14); flex-shrink:0;}
  .chip-projet small{font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;}
  .chip-projet em{font-style:normal; font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  .chip-projet:hover{border-color:var(--accent); color:var(--accent);}
  .chip-projet.off{opacity:.45; border-style:dashed; text-decoration:line-through; text-decoration-thickness:1px;}

  /* Bandeau de projets, au-dessus des dates : la couleur seule ne dit pas de
     quelle tournée il s'agit, le nom écrit en toutes lettres si. Les deux
     rangées collent ensemble en haut du tableau, d'où l'enveloppe. */
  /* Le tableau s'arrête au-dessus de la barre flottante. En contrepartie il
     démarre plus haut : la bande de 72 px qu'occupait la barre de modes sous
     le menu est rendue au tableau. */
  .co-matrix{max-height:max(340px, calc(100dvh - 210px));}
  /* Une ligne = une personne, et on la suit sur quarante colonnes. Le filet
     du socle, prévu pour des tableaux courts, se perdait entre deux colonnes
     colorées : on l'assombrit ici, et ici seulement. */
  #matrixHolderMusiciens .co-matrix-row,
  #matrixHolderTechniciens .co-matrix-row{border-bottom:1px solid var(--old-champagne);}
  #matrixHolderMusiciens .co-matrix-row:last-child,
  #matrixHolderTechniciens .co-matrix-row:last-child{border-bottom:none;}

  .co-matrix-tete{position:sticky; top:0; z-index:5; background:var(--card);}
  .co-matrix-tete .co-matrix-head{position:static;}
  .co-matrix-tete .co-matrix-head{border-bottom:1px solid var(--border);}
  .co-matrix-groupes .co-matrix-name{
    z-index:5; padding:6px 14px; font-size:10.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
  }
  /* min-width:0 : sans lui, un flex-item refuse de descendre sous la largeur
     de son texte, et une bande de deux colonnes au nom long décalerait tout
     l'alignement avec les dates du dessous. */
  .groupe-projet{
    min-width:0; padding:6px; text-align:center; font-size:11px; font-weight:800;
    color:var(--text); border-right:1px solid var(--border); cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .groupe-projet:hover{filter:brightness(.95); text-decoration:line-through;}
  @media (max-width:760px){ .co-matrix-tete{display:none;} }

  /* Chercher quelqu'un et ne garder que sa ligne. La recherche passe outre le
     filtre de statut : chercher un nom et ne pas le trouver parce qu'un menu
     déroulant l'excluait serait la pire des réponses. */
  .champ-recherche{position:relative; display:inline-flex; align-items:center;}
  .champ-recherche input{
    padding:7px 26px 7px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px;
    background:var(--card); color:var(--text); font-family:inherit; min-width:210px;
  }

  .dispo-filter-row{display:flex; gap:8px; align-items:center; margin:-2px 0 10px; flex-wrap:wrap;}

<body>
<div class="wrap">

      </label>
      <button type="button" class="co-btn primary md" id="exportPdfBtn"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:2px;"><path d="M6 2.5h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-17a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M14 2.5v4h4" fill="none" stroke="currentColor" stroke-width="1.6"></path><line x1="12" y1="12" x2="12" y2="18.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line><polyline points="9,16 12,19 15,16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></polyline></svg> Exporter en PDF</button>
    </span>
  </div>

  <div class="mode-bar">

      <button type="button" data-mode="affecter">★ Affecter</button>

  </div>

      <option value="sollicites" selected>Titulaires + sollicité·es</option>
      <option value="titulaire">Titulaires uniquement</option>
      <option value="">Tou·tes (titulaires en premier)</option>

    <label for="rechercheP" style="margin-left:8px;">Chercher :</label>
    <span class="champ-recherche">

             autocomplete="off" aria-describedby="rechercheEtat">
      <button type="button" id="rechercheVider" title="Effacer la recherche" hidden>✕</button>

            title="Aller à la prochaine précision qui attend une réponse"></button>

  <div class="projets-filtre co-fade" id="projetsFiltre"></div>

  <h2 class="section-title">Musicien·nes</h2>
  <div id="matrixHolderMusiciens"><div class="empty-hint">Chargement…</div></div>

  <h2 class="section-title">Technicien·nes</h2>
  <div id="matrixHolderTechniciens"></div>

<script>
// Caches mémoire synchronisés avec Supabase (voir annuaire.html pour le pattern).
// Longtemps en lecture seule, cette page est devenue LA page d'affectation :
// elle écrit les dispos (fiche par fiche) et les affectations (tournée par
// tournée), toujours par les mêmes chemins que les pages d'origine.
let tourneesCache = [];
let musiciansCache = [];
let techniciansCache = [];
let dispoDemandesCache = [];
// Les listes de remplaçant·es que chacun·e tient (mes-remplacants.html) :
// lecture seule ici, pour ranger chaque remplaçant·e sous son ou sa titulaire.
let remplacantPrefsCache = [];

function loadTournees(){ return tourneesCache; }
function loadMusicians(){ return musiciansCache; }
function loadTechnicians(){ return techniciansCache; }
function fmtDateFR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const months = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `${parseInt(d,10)} ${months[parseInt(m,10)-1]} ${y}`;
}
function fmtDateFRShort(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const months = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `${parseInt(d,10)} ${months[parseInt(m,10)-1]}`;
}

let showPastDates = false;

// Projets masqués (par id). Rangé dans le navigateur : on ne change pas d'avis
// à chaque rechargement, et ce n'est pas une donnée d'équipe — chacun regarde
// la saison sous l'angle qui l'occupe.
const CLE_PROJETS_MASQUES = 'curieuxRecapProjetsMasques';
let projetsMasques = new Set();
try{ projetsMasques = new Set(JSON.parse(localStorage.getItem(CLE_PROJETS_MASQUES) || '[]')); }catch(e){}
function memoriserMasques(){
  try{ localStorage.setItem(CLE_PROJETS_MASQUES, JSON.stringify([...projetsMasques])); }catch(e){}
}
// Une couleur par projet, tirée du rang dans la liste complète : elle ne doit
// pas bouger quand on en masque un, sinon le tableau change de sens à chaque
// clic sur une puce.
function couleursProjets(){
  return new Map(loadTournees().map((t, i)=> [t.id, `var(--tour-${i % 8})`]));
}

function allDateEntries(assignField, tourneeId){
  const tournees = tourneeId ? loadTournees().filter(t=>t.id === tourneeId) : loadTournees();
  const entries = [];
  tournees.forEach(t=>{
    (t.dates||[]).forEach(d=>{
      if(!d.date) return;
      entries.push({ tourneeId: t.id, dateId: d.id, tourneeNom: t.nom, estRecording: t.type === 'recording', date: d.date, ville: d.ville, lieu: d.lieu, commentaire: d.commentaire, statut: d.statut, assignes: d[assignField] || [] });
    });
  });
  entries.sort((a,b)=> a.date.localeCompare(b.date));
  if(!showPastDates){
    const today = new Date().toISOString().slice(0, 10);
    return entries.filter(e=> e.date >= today);
  }
  return entries;
}

// Titulaires en priorité (avant les remplaçant·es), alphabétique au sein de chaque
// groupe. Sans effet sur les technicien·nes (pas de statutPoste).
/* Cette personne est-elle sollicitée SUR CETTE DATE-LÀ ?
 *
 * Deux sources, dans cet ordre :
 *  — la demande enregistrée pour ce projet. Ses « dates » vides signifient
 *    « tout le projet » ; sinon elle ne porte que sur les dates nommées ;
 *  — à défaut, la règle d'office (voir titulairesPourProjet dans
 *    suivi-dispo.html) : sur une tournée, tout le noyau ; sur un recording,
 *    les musicien·nes seulement — une séance de studio ne mobilise pas la
 *    régie. Sans ce repli, une tournée dont les liens n'ont pas encore été
 *    posés griserait tout le noyau, ce qui serait faux et alarmant.
 *
 * D'où les deux cas qui grisent vraiment : un·e remplaçant·e appelé·e sur un
 * projet n'a rien à dire sur les autres, et un·e titulaire n'est pas de
 * toutes les sessions.
 */
function estSollicite(personne, ptype, e){
  const dem = dispoDemandesCache.find(d=> d.tourneeId === e.tourneeId
    && d.personType === ptype && d.personId === personne.id);
  if(dem) return !(dem.dates && dem.dates.length) || dem.dates.includes(e.dateId);
  // Retiré·e à la main du projet (Demandes titulaires) : le raisonnement
  // d'office ne s'applique plus, sinon la case redeviendrait blanche et l'on
  // croirait la personne sollicitée.
  const projet = loadTournees().find(x=> x.id === e.tourneeId);
  if(projet && (projet.sollicitationExclus || []).includes(`${ptype}:${personne.id}`)) return false;
  const titulaire = (personne.statutPoste || 'titulaire') !== 'remplacant';
  return titulaire && (!e.estRecording || ptype === 'musicien');
}

/* Quand lui a-t-on demandé ses dispos pour la dernière fois ?
 *
 * L'information existait déjà, éparpillée : chaque demande porte la date de sa
 * création (le lien a été posé) et celle du dernier message parti (le bouton
 * « Relancer » de Demandes titulaires l'inscrit, quel que soit le canal). Ce
 * qui manquait, c'était de la lire d'un coup d'œil en face du nom.
 *
 * On ne retient que le message RÉELLEMENT envoyé : un lien posé d'office par
 * la page ne veut pas dire qu'on a écrit à qui que ce soit, et afficher cette
 * date-là ferait croire à une relance qui n'a jamais eu lieu.
 *
 * Les projets terminés ne comptent pas : une relance de l'an dernier ne dit
 * rien de la saison en cours.
 */
function demandesVivantes(personne, ptype){
  const aVenir = new Date().toISOString().slice(0, 10);
  return dispoDemandesCache.filter(d=>{
    if(d.personType !== ptype || d.personId !== personne.id) return false;
    const t = loadTournees().find(x=> x.id === d.tourneeId);
    return !!t && (t.dates || []).some(dt=> dt.date && dt.date >= aVenir && dt.statut !== 'annulee');
  });
}

function derniereDemande(personne, ptype){
  const liste = demandesVivantes(personne, ptype);
  const envoyees = liste.filter(d=> d.lastReminderAt);
  const detail = envoyees
    .map(d=>{
      const t = loadTournees().find(x=> x.id === d.tourneeId);
      return { nom: (t && t.nom) || 'projet', quand: d.lastReminderAt };
    })
    .sort((a, b)=> b.quand.localeCompare(a.quand));
  return {
    aDesDemandes: liste.length > 0,
    quand: detail.length ? detail[0].quand : '',
    detail,
  };
}

// Une date ISO complète (avec l'heure) → « 12 mars ».
function jourDe(horodatage){
  return horodatage ? fmtDateFRShort(horodatage.slice(0, 10)) : '';
}

function demandeLeHtml(personne, ptype){
  const info = derniereDemande(personne, ptype);
  if(!info.aDesDemandes) return '';
  if(!info.quand){
    return `<button type="button" class="demande-le jamais" data-demande-le="${escapeAttr(ptype + ':' + personne.id)}"
      title="Aucun message de demande de dispo ne lui a encore été envoyé depuis l'outil.&#10;Cliquer pour noter qu'on vient de le faire.">✉ jamais</button>`;
  }
  const titre = info.detail.map(x=> `${x.nom} — ${jourDe(x.quand)}`).join('&#10;');
  return `<button type="button" class="demande-le" data-demande-le="${escapeAttr(ptype + ':' + personne.id)}"
    title="Dernière demande de dispo envoyée :&#10;${escapeAttr(titre)}&#10;&#10;Cliquer pour noter qu'on vient de lui redemander.">✉ ${escapeHtml(jourDe(info.quand))}</button>`;
}

// Noter à la main qu'on vient de lui demander ses dispos — pour les messages
// partis d'ailleurs (téléphone, conversation de groupe), que l'outil n'a aucun
// moyen de voir passer.
async function noterDemandeEnvoyee(ptype, pid){
  const personne = personneDe(ptype, pid);
  if(!personne) return;
  const liste = demandesVivantes(personne, ptype);
  if(!liste.length) return;
  const projets = [...new Set(liste.map(d=>{
    const t = loadTournees().find(x=> x.id === d.tourneeId);
    return (t && t.nom) || 'projet';
  }))];
  if(!confirm(`Noter qu'on vient de demander ses dispos à ${fullName(personne)} ?\n\n${projets.join('\n')}`)) return;
  const quand = new Date().toISOString();
  const avant = liste.map(d=> d.lastReminderAt);
  liste.forEach(d=> d.lastReminderAt = quand);
  for(const d of liste){
    const { error } = await CurieuxDB.upsertOne('dispo_demandes', d);
    if(error){
      liste.forEach((x, i)=> x.lastReminderAt = avant[i]);
      alert("Écriture impossible — rien n'a été changé :\n\n" + error.message);
      rendreEnGardantLeScroll();
      return;
    }
  }
  rendreEnGardantLeScroll();
}

// Les projets réellement à l'écran : dates à venir — ou tout l'historique si
// la case est cochée — et projets non masqués. C'est ce périmètre qui décide
// qui compte comme « sollicité·e » : être attendu sur une tournée qu'on ne
// regarde pas ne justifie pas une ligne vide de plus.
function projetsAffiches(){
  return new Set(allDateEntries('musiciensAssignes')
    .filter(e=> !projetsMasques.has(e.tourneeId))
    .map(e=> e.tourneeId));
}

// Qui a reçu une demande de dispo sur ce qu'on regarde. La vue par défaut
// s'appuie dessus : le noyau d'abord, puis les gens qu'on a effectivement
// sollicités — inutile de faire défiler tout le répertoire pour les trouver.
function idsSollicites(ptype){
  const projets = projetsAffiches();
  return new Set(dispoDemandesCache
    .filter(d=> d.personType === ptype && projets.has(d.tourneeId))
    .map(d=> d.personId));
}

// Le noyau d'abord, les sollicité·es ensuite, alphabétique dans chaque groupe.
function compareNoyauPuisSollicites(a, b){
  const rang = m => (m.statutPoste === 'remplacant' ? 1 : 0);
  const ra = rang(a), rb = rang(b);
  if(ra !== rb) return ra - rb;
  return fullName(a).localeCompare(fullName(b));
}

function compareByStatutThenName(a, b){
  const rank = m => (m.statutPoste === 'remplacant' ? 1 : 0);
  const ra = rank(a), rb = rank(b);
  if(ra !== rb) return ra - rb;
  return fullName(a).localeCompare(fullName(b));
}

// Les puces de projets. Comptent les dates de la fenêtre en cours (à venir, ou
// tout l'historique si la case est cochée) : c'est le nombre de colonnes que le
// projet coûte, donc la seule information qui aide à décider de le masquer.
function renderProjetsFiltre(){
  const holder = document.getElementById('projetsFiltre');
  const today = new Date().toISOString().slice(0, 10);
  const couleurs = couleursProjets();
  const avecDates = loadTournees().map(t=> ({
    t, n: (t.dates || []).filter(d=> d.date && (showPastDates || d.date >= today)).length,
  })).filter(x=> x.n > 0);
  if(avecDates.length < 2){ holder.innerHTML = ''; return; }
  const nbMasques = avecDates.filter(x=> projetsMasques.has(x.t.id)).length;
  holder.innerHTML = `
    <span class="projets-filtre-label">Colonnes affichées :</span>
    ${avecDates.map(({ t, n })=>{
      const off = projetsMasques.has(t.id);
      return `<button type="button" class="chip-projet${off ? ' off' : ''}" data-projet="${escapeAttr(t.id)}"
        aria-pressed="${!off}" title="${off ? 'Afficher' : 'Masquer'} les ${n} date${n > 1 ? 's' : ''} de « ${escapeHtml(t.nom || 'Sans nom')} »">
        <span class="pastille" style="background:${couleurs.get(t.id)};"></span>
        ${escapeHtml(t.nom || 'Sans nom')}${estRecording(t) ? ' <em>Rec</em>' : ''}
        <small>${n}</small>
      </button>`;
    }).join('')}
    ${nbMasques ? `<button type="button" class="co-btn ghost sm" id="projetsTout">Tout afficher</button>` : ''}`;
  holder.querySelectorAll('[data-projet]').forEach(b=> b.addEventListener('click', ()=>{
    const id = b.dataset.projet;
    if(projetsMasques.has(id)) projetsMasques.delete(id); else projetsMasques.add(id);
    memoriserMasques();
    renderAll();
  }));
  const tout = holder.querySelector('#projetsTout');
  if(tout) tout.addEventListener('click', ()=>{ projetsMasques.clear(); memoriserMasques(); renderAll(); });
}

function renderPeopleMatrix(people, assignField, holderId, emptyLinkHref, emptyLinkLabel, nameLabel){
  const entries = allDateEntries(assignField).filter(e=> !projetsMasques.has(e.tourneeId));
  // L'ordre vient de garderSelonFiltre : lui seul sait si l'on empile des
  // remplaçant·es sous leur titulaire ou si l'on trie alphabétiquement.
  const sorted = people;
  const holder = document.getElementById(holderId);

  if(sorted.length === 0){
    const terme = termeRecherche();
    const filtre = document.getElementById('musicienStatutFilter').value;
    holder.innerHTML = terme
      ? `<div class="empty-hint">Personne de ce nom dans l'<a href="${emptyLinkHref}">${emptyLinkLabel}</a>.</div>`
      : (filtre === 'remplacant'
        ? `<div class="empty-hint">Aucun·e remplaçant·e n'est sollicité·e sur les projets affichés. Ajoute-les depuis <a href="suivi-dispo.html">Demandes titulaires</a> ou en cliquant une case hachurée.</div>`
        : `<div class="empty-hint">Ajoute d'abord dans l'<a href="${emptyLinkHref}">${emptyLinkLabel}</a>.</div>`);
    return;
  }
  if(entries.length === 0 && projetsMasques.size){
    holder.innerHTML = `<div class="empty-hint">Tous les projets sont masqués — rouvre-en un ci-dessus.</div>`;
    return;
  }
  if(entries.length === 0){
    holder.innerHTML = !showPastDates && loadTournees().some(t=> (t.dates||[]).some(d=> d.date))
      ? `<div class="empty-hint">Aucune date à venir — coche « Afficher aussi les dates passées » ci-dessus pour voir l'historique.</div>`
      : `<div class="empty-hint">Aucune date pour l'instant.</div>`;
    return;
  }

  const colorByTournee = couleursProjets();
  const colorFor = e => colorByTournee.get(e.tourneeId) || 'transparent';

  // Une bande par suite de colonnes consécutives du même projet. Deux projets
  // qui s'entrelacent dans le calendrier donnent donc plusieurs bandes — c'est
  // précisément ce qu'il faut voir : la couleur seule ne disait pas laquelle
  // des trois tournées on regardait.
  const bandes = [];
  entries.forEach(e=>{
    const derniere = bandes[bandes.length - 1];
    if(derniere && derniere.tourneeId === e.tourneeId) derniere.n++;
    else bandes.push({ tourneeId: e.tourneeId, nom: e.tourneeNom, reco: e.estRecording, n: 1 });
  });

  // La matrice quitte le <table> pour la grille .co-matrix de base.css, livrée
  // avec la charte et jusqu'ici inutilisée. Le gain n'est pas que cosmétique :
  // .co-matrix-name est collante à gauche, donc le nom reste visible quand on
  // fait défiler vingt dates — ce qu'un <th> de tableau ne faisait pas.
  // flex:n 0 (n × 76px) — la largeur exacte de n colonnes, et la même part de
  // l'espace restant qu'elles : les deux rangées restent alignées, que le
  // tableau tienne dans la page ou qu'il déborde.
  const bandeau = `
    <div class="co-matrix-row co-matrix-groupes">
      <div class="co-matrix-name">Projet</div>
      ${bandes.map(b=> `
        <div class="groupe-projet" data-bande="${escapeAttr(b.tourneeId)}" style="flex:${b.n} 0 ${b.n * 76}px; background:${colorByTournee.get(b.tourneeId) || 'transparent'};"
          title="${escapeHtml(b.nom || 'Sans nom')}${b.reco ? ' — recording' : ''} · ${b.n} date${b.n > 1 ? 's' : ''} — cliquer pour masquer ce projet">
          ${escapeHtml(b.nom || 'Sans nom')}${b.reco ? ' · Rec' : ''}
        </div>`).join('')}
    </div>
  `;

  const head = `
    <div class="co-matrix-row co-matrix-head">
      <div class="co-matrix-name">${nameLabel}</div>
      ${entries.map(e=>`
        <div class="co-matrix-date${e.estRecording ? ' colonne-reco' : ''}" style="background:${colorFor(e)};" title="${escapeHtml(e.tourneeNom || '')}${e.estRecording ? ' (recording)' : ''} — ${escapeHtml([e.ville, e.lieu].filter(Boolean).join(' · '))}">
          ${escapeHtml(fmtDateFRShort(e.date))}
          <small>${escapeHtml((e.ville || '').split(' (')[0] || '—')}</small>
        </div>
      `).join('')}
    </div>
  `;

  const ptypeMatrice = assignField === 'musiciensAssignes' ? 'musicien' : 'technicien';

  const rows = sorted.map(m=>{
    const dispo = m.disponibilites || {};
    const metier = m.statutPoste === 'remplacant' ? 'Remplaçant·e' : (m.instrument || m.poste || '');
    const demandeLe = demandeLeHtml(m, ptypeMatrice);
    const sous = sousRemplacants[ptypeMatrice].has(m.id);
    return `
      <div class="co-matrix-row${sous ? ' sous-remplacant' : ''}">
        <div class="co-matrix-name">${sous ? '<span class="fleche-sous" aria-hidden="true">↳</span>' : ''}<b>${escapeHtml(fullName(m))}</b><small>${escapeHtml(metier)}${
          demandeLe ? (metier ? ' · ' : '') + demandeLe : ''}</small></div>
        ${entries.map(e=>{
          const assigned = (e.assignes||[]).includes(m.id);
          const state = dispo[e.date] || '';
          const note = ((m.disponibilitesCommentaires || {})[e.date] || '').trim();
          const rep = note ? reponseDe(m, e.date) : null;
          // Une affectation prime : on ne grise jamais quelqu'un qui joue.
          const hors = !assigned && !estSollicite(m, ptypeMatrice, e);
          let cls = '', symbol = '—', title = 'Non renseigné';
          if(assigned){ cls = 'assigned'; symbol = '✓'; title = `Affecté·e — ${escapeHtml(e.tourneeNom || '')}`; }
          else if(state === 'dispo'){ cls = 'dispo'; symbol = '✓'; title = 'Disponible'; }
          else if(state === 'indispo'){ cls = 'indispo'; symbol = '✕'; title = 'Indisponible'; }
          else if(state === 'incertain'){ cls = 'incertain'; symbol = '?'; title = 'À confirmer'; }
          // data-jour : voir disponibilites.html — sert uniquement à la mise en
          // liste sur petit écran, sans rien changer au tableau sur ordinateur.
          return `<div class="co-matrix-cell${e.estRecording ? ' colonne-reco' : ''}${hors ? ' hors-demande' : ''}${note ? ' porte-note' : ''}" data-jour="${escapeAttr(fmtDateFRShort(e.date) + (e.ville ? ' · ' + e.ville : ''))}"
            ${note ? `data-note="${escapeAttr(note)}" data-note-qui="${escapeAttr(fullName(m))}" data-note-quand="${escapeAttr(fmtDateFRShort(e.date) + (e.ville ? ' · ' + e.ville : ''))}"` : ''}
            ${rep ? `data-note-reponse="${escapeAttr(rep.texte)}" data-note-reponse-qui="${escapeAttr(rep.auteur || '')}"` : ''}
            data-cellule data-tid="${escapeAttr(e.tourneeId)}" data-did="${escapeAttr(e.dateId)}" data-pid="${escapeAttr(m.id)}"
            data-ptype="${ptypeMatrice}" data-date="${escapeAttr(e.date)}" data-reco="${e.estRecording ? '1' : ''}"
            style="background-color:${colorFor(e)};"><span class="co-matrix-btn m-cell ${cls}${hors ? ' hors-demande' : ''}" title="${hors ? 'Pas sollicité·e sur cette date — cliquer pour lui demander ses dispos' : title}">${symbol}</span>${
            note ? `<button type="button" class="point-note${rep ? ' repondue' : ''}" data-repondre aria-label="${
              rep ? 'Précision — déjà répondu' : 'Précision — répondre'}" title="${
              rep ? 'On y a répondu — cliquer pour relire ou changer' : 'Une précision — cliquer pour y répondre'}"></button>
            <button type="button" class="note-repliee" data-repondre>${escapeHtml(note)}${
              rep ? `<em class="reponse-repliee">↳ ${escapeHtml(rep.texte)}</em>` : ''}</button>` : ''}</div>`;
        }).join('')}
      </div>
    `;
  }).join('');

  // La bande de couleurs qui listait ici les projets a disparu : le bandeau
  // écrit leur nom à même les colonnes, à quarante pixels de là. Deux fois la
  // même chose, dont une en devinettes.
  holder.innerHTML = `
    <div class="co-matrix">
      <div class="co-matrix-in"><div class="co-matrix-tete">${bandeau}${head}</div>${rows}</div>
    </div>
  `;
}

/* ---------------------------------------------------------------------------
   Répondre à une précision, sans quitter le tableau
   ---------------------------------------------------------------------------
   Il y avait ici une liste des précisions, en pleine largeur sous les deux
   matrices : une carte par remarque, 566 px pour quatre remarques, un quart de
   la page — et sans plafond. Sur une page dont le sujet est le tableau, pour un
   geste qu'on fait trois fois par mois, c'était l'exact inverse de la bonne
   hiérarchie.

   Elle a disparu. On répond là où la remarque vit : le point du coin de la case
   est un bouton, il ouvre un petit panneau ancré à cette case, et la page ne
   grandit pas d'un pixel. Reste le problème que la liste résolvait — savoir
   lesquelles attendent un mot sans survoler trente cases : c'est la pastille de
   la bande de filtres, qui mène à la suivante et s'efface quand il n'y en a
   plus.
--------------------------------------------------------------------------- */

let panneauReponse = null;

function fermerReponse(){
  if(panneauReponse){ panneauReponse.remove(); panneauReponse = null; }
  document.querySelectorAll('.co-matrix-cell.visee').forEach(c=> c.classList.remove('visee'));
}

// Sous la case, ou au-dessus s'il n'y a pas la place ; jamais hors de l'écran.
function placerReponse(cel){
  if(!panneauReponse || !cel || !cel.isConnected) return;
  const r = cel.getBoundingClientRect();
  const b = panneauReponse.getBoundingClientRect();
  const x = Math.max(8, Math.min(r.left + r.width / 2 - b.width / 2, window.innerWidth - b.width - 8));
  const y = (r.bottom + b.height + 8 > window.innerHeight) ? Math.max(8, r.top - b.height - 6) : r.bottom + 6;
  panneauReponse.style.left = Math.round(x) + 'px';
  panneauReponse.style.top = Math.round(y) + 'px';
}

function ouvrirReponse(cel){
  fermerReponse();
  cacherNote();
  const { ptype, pid, date } = cel.dataset;
  const personne = personneDe(ptype, pid);
  if(!personne) return;
  const rep = reponseDe(personne, date);

  const p = document.createElement('div');
  p.className = 'reponse-panneau' + (rep ? ' est-repondue' : '');
  // Le verrou qui empêche un rafraîchissement temps réel d'effacer la phrase
  // en cours de frappe (voir _curieuxOccupe dans ui-helpers.js). Il part avec
  // le panneau : fermerReponse() le retire du DOM, il n'y a pas d'autre état
  // à remettre à zéro, donc pas de verrou qui fuit.
  p.setAttribute('data-panneau-ouvert', '');
  // Le panneau porte lui-même de quoi écrire : si un re-rendu détruit la case
  // pendant qu'on tape (recherche, filtre), il continue de fonctionner.
  p.dataset.ptype = ptype; p.dataset.pid = pid; p.dataset.date = date;
  p.innerHTML = `
    <b>${escapeHtml(cel.dataset.noteQui || '')} · ${escapeHtml(cel.dataset.noteQuand || '')}</b>
    <i>« ${escapeHtml(cel.dataset.note || '')} »</i>
    <textarea placeholder="Ta réponse, en une phrase — Entrée pour enregistrer">${escapeHtml(rep ? rep.texte : '')}</textarea>
    <div class="reponse-actions">
      <button type="button" class="co-btn small" data-rep-ok>Enregistrer</button>
      <button type="button" class="co-btn small secondary" data-rep-non>Annuler</button>
      ${rep ? `<span class="reponse-signature" title="${escapeAttr(rep.auteur || '')}">${
        escapeHtml(quandCourt(rep.le))}</span>` : ''}
    </div>`;
  document.body.appendChild(p);
  panneauReponse = p;
  placerReponse(cel);

  const champ = p.querySelector('textarea');
  champ.focus();
  champ.setSelectionRange(champ.value.length, champ.value.length);

  const enregistrer = async ()=>{
    const texte = champ.value;
    const avait = !!rep;
    // Vider le champ retire la réponse — mais jamais par mégarde.
    if(avait && !texte.trim() && !confirm('Retirer la réponse ?')) return;
    fermerReponse();
    if(await ecrireReponse(ptype, personne, date, texte)) rendreEnGardantLeScroll();
  };
  p.addEventListener('click', (e)=>{
    if(e.target.closest('[data-rep-ok]')) enregistrer();
    else if(e.target.closest('[data-rep-non]')) fermerReponse();
  });
  // Entrée enregistre, Maj+Entrée va à la ligne : une réponse tient en une
  // phrase, on ne va pas demander d'attraper un bouton pour ça.
  champ.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enregistrer(); }
    if(e.key === 'Escape'){ e.preventDefault(); fermerReponse(); }
  });
  // Le panneau suit sa case tant qu'elle existe — le tableau défile beaucoup.
  const suivre = ()=> placerReponse(cel);
  document.addEventListener('scroll', suivre, true);
  window.addEventListener('resize', suivre);
  const nettoyer = new MutationObserver(()=>{
    if(!p.isConnected){
      document.removeEventListener('scroll', suivre, true);
      window.removeEventListener('resize', suivre);
      nettoyer.disconnect();
    }
  });
  nettoyer.observe(document.body, { childList: true });
}

// Un clic ailleurs referme — sauf dans le panneau, et sauf sur un point qui
// en rouvrirait un autre (ouvrirReponse referme déjà le précédent).
document.addEventListener('mousedown', (e)=>{
  if(!panneauReponse) return;
  if(e.target.closest('.reponse-panneau') || e.target.closest('[data-repondre]')) return;
  fermerReponse();
}, true);

/* La pastille « n précisions sans réponse ».
 *
 * Elle lit le tableau tel qu'il est à l'écran — mêmes personnes, mêmes projets,
 * même période — plutôt que de refaire le calcul de son côté : deux comptages
 * du même fait finissent toujours par diverger. Et elle DISPARAÎT dès que tout
 * a reçu une réponse : un compteur permanent, qui ne tombe jamais à zéro, ne
 * serait qu'une alarme de plus sur une page qui n'en manque pas.
 */
function casesEnAttente(){
  return [...document.querySelectorAll('.co-matrix-cell[data-note]')]
    .filter(c=> !c.dataset.noteReponse);
}
function majChipPrecisions(){
  const chip = document.getElementById('chipPrecisions');
  if(!chip) return;
  const n = casesEnAttente().length;
  chip.hidden = n === 0;
  chip.textContent = `${n} précision${n > 1 ? 's' : ''} sans réponse`;
}

// « La suivante » : toujours la première du tableau qui attend encore un mot.
// Y répondre la retire de la file, alors des clics répétés les parcourent
// toutes sans qu'on ait à retenir où l'on en était.
function allerPrecisionSuivante(){
  const cel = casesEnAttente()[0];
  if(!cel) return;
  cel.scrollIntoView({ block: 'center', inline: 'center' });
  cel.classList.add('visee');
  ouvrirReponse(cel);
}

// « 12 mars » quand c'est cette année, « 12 mars 2025 » sinon — une réponse
// vieille d'un an ne se lit pas comme celle d'hier.
function quandCourt(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const jour = d.toISOString().slice(0, 10);
  return d.getFullYear() === new Date().getFullYear() ? fmtDateFRShort(jour) : fmtDateFR(jour);
}

/* Le filtre de personnes, à un seul endroit.
 *
 * « Titulaires + sollicité·es » : le noyau, plus toute personne à qui une
 * demande a été envoyée sur un projet quelconque. Les autres restent hors de
 * vue tant qu'on ne les a pas appelées.
 *
 * L'export PDF refaisait ce tri de son côté, avec les seules valeurs qu'il
 * connaissait — et depuis l'arrivée de « sollicites », aucune personne ne
 * répondait plus à son test : le document sortait sans un seul musicien.
 * Une seule fonction, deux appelants.
 */
function termeRecherche(){
  const el = document.getElementById('rechercheP');
  return el ? el.value.trim().toLowerCase() : '';
}

// Nom, prénom, instrument, poste, pupitre, pôle : on cherche dans tout ce qui
// désigne quelqu'un, comme dans les annuaires — on ne se souvient pas toujours
// d'un nom, mais on sait qu'on cherche « la clarinette ».
function correspondRecherche(p, terme){
  return [p.prenom, p.nom, p.instrument, p.poste, p.pupitre, p.pole]
    .filter(Boolean).join(' ').toLowerCase().includes(terme);
}

/* Qui s'affiche sous quel·le titulaire.
 *
 * Rempli par garderSelonFiltre dans le mode « Titulaires + leurs
 * remplaçant·es », et lu par le rendu pour décaler la ligne. Une clé par
 * répertoire : la fonction est appelée deux fois de suite, une par matrice.
 */
const sousRemplacants = { musicien: new Set(), technicien: new Set() };

function prefsDe(personId, ptype){
  const r = remplacantPrefsCache.find(x=> x.id === personId && (x.personType || 'musicien') === ptype);
  return (r && r.items) || [];
}

/* Chaque titulaire, puis les remplaçant·es de SA liste que l'on a sollicité·es.
 *
 * L'ordre de la liste personnelle est respecté — c'est celui dans lequel on
 * appelle. Une même personne peut figurer sur deux listes : elle s'affiche
 * sous la première, une ligne par personne et non par lien. Celles qu'on a
 * sollicitées sans qu'elles soient sur aucune liste ferment la marche : on ne
 * les fait pas disparaître sous prétexte que personne ne les a nommées.
 */
function ordreNoyauEtRemplacants(liste, ptype){
  const vus = idsSollicites(ptype);
  const parId = new Map(liste.map(p=> [p.id, p]));
  const sous = sousRemplacants[ptype];
  sous.clear();
  const ordre = [];
  const place = new Set();
  liste.filter(p=> (p.statutPoste || 'titulaire') !== 'remplacant')
    .sort((a, b)=> fullName(a).localeCompare(fullName(b)))
    .forEach(t=>{
      ordre.push(t); place.add(t.id);
      prefsDe(t.id, ptype)
        .slice()
        .sort((a, b)=> (a.rang || 99) - (b.rang || 99))
        .forEach(item=>{
          if(item.source !== 'roster' || !item.personId) return;   // un nom libre n'a pas de fiche
          const r = parId.get(item.personId);
          if(!r || place.has(r.id) || !vus.has(r.id)) return;
          ordre.push(r); place.add(r.id); sous.add(r.id);
        });
    });
  liste.filter(p=> (p.statutPoste || 'titulaire') === 'remplacant' && vus.has(p.id) && !place.has(p.id))
    .sort((a, b)=> fullName(a).localeCompare(fullName(b)))
    .forEach(p=>{ ordre.push(p); place.add(p.id); });
  return ordre;
}

function garderSelonFiltre(liste, ptype){
  sousRemplacants[ptype].clear();
  const terme = termeRecherche();
  // La recherche l'emporte sur le filtre de statut : sinon on chercherait un
  // remplaçant, il existerait, et la page dirait qu'il n'existe pas.
  if(terme) return liste.filter(p=> correspondRecherche(p, terme)).sort(compareByStatutThenName);
  const statutFilter = document.getElementById('musicienStatutFilter').value;
  if(statutFilter === 'noyau_rempl') return ordreNoyauEtRemplacants(liste, ptype);
  if(statutFilter === 'sollicites'){
    const vus = idsSollicites(ptype);
    return liste.filter(p=> (p.statutPoste || 'titulaire') !== 'remplacant' || vus.has(p.id))
      .sort(compareByStatutThenName);
  }
  // Les remplaçant·es du répertoire se comptent par dizaines et ne sont
  // appelé·es qu'au cas par cas : les afficher toutes et tous donnait un mur
  // de lignes vides. On ne garde que celles et ceux à qui l'on a demandé
  // quelque chose sur les projets affichés.
  if(statutFilter === 'remplacant'){
    const vus = idsSollicites(ptype);
    return liste.filter(p=> (p.statutPoste || 'titulaire') === 'remplacant' && vus.has(p.id))
      .sort(compareByStatutThenName);
  }
  return liste.filter(p=> !statutFilter || (p.statutPoste || 'titulaire') === statutFilter)
    .sort(compareByStatutThenName);
}

function renderAll(){
  // La mémoire du défilement vit ICI, dans le rendu lui-même : un clic, un
  // Oups, mais aussi le rafraîchissement temps réel qui suit chaque écriture
  // (subscribe → re-fetch → renderAll) remplacent les matrices entières —
  // tout chemin qui oublierait la position ramènerait le tableau en haut à
  // gauche. Indexée par conteneur : une matrice remplacée par un état vide
  // n'hérite pas de la position de l'autre.
  const positions = {};
  document.querySelectorAll('#matrixHolderMusiciens .co-matrix, #matrixHolderTechniciens .co-matrix').forEach(m=>{
    positions[m.closest('[id]').id] = [m.scrollTop, m.scrollLeft];
  });
  renderPeopleMatrix(garderSelonFiltre(loadMusicians(), 'musicien'), 'musiciensAssignes', 'matrixHolderMusiciens', 'annuaire.html', 'annuaire musicien·nes', "Musicien·ne");
  renderPeopleMatrix(garderSelonFiltre(loadTechnicians(), 'technicien'), 'techniciensAssignes', 'matrixHolderTechniciens', 'techniciens.html', 'annuaire technicien·nes', "Technicien·ne");
  renderProjetsFiltre();
  majChipPrecisions();
  try{ majEtatRecherche(); }catch(e){}
  populateTourneeSelect();
  renderDashboard();
  document.querySelectorAll('#matrixHolderMusiciens .co-matrix, #matrixHolderTechniciens .co-matrix').forEach(m=>{
    const pos = positions[m.closest('[id]').id];
    if(pos){ m.scrollTop = pos[0]; m.scrollLeft = pos[1]; }
  });
}

// --- Bande d'indicateurs : lecture rapide de ce qui mérite attention, sans avoir à
// dépouiller le tableau croisé date par date. Calculée à partir des mêmes caches que
// le reste de la page (+ dispo_demandes pour le suivi des réponses titulaires).
function renderDashboard(){
  const holder = document.getElementById('dashboardStrip');
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = allDateEntries('musiciensAssignes').filter(e=> e.date >= today && e.statut !== 'annulee');

  // Prochaine date à venir, toutes tournées confondues.
  const next = upcoming[0];

  // Dates à venir sans un·e seul·e musicien·ne affecté·e.
  const sansAffectation = upcoming.filter(e=> (e.assignes||[]).length === 0);

  // Dates à venir sans ville ni salle renseignées.
  const infosManquantes = upcoming.filter(e=> !e.ville && !e.lieu);

  // Dates à venir encore en option (pas encore validées) — à relancer/confirmer.
  const enOption = upcoming.filter(e=> e.statut === 'option');

  // Tournées ayant au moins une date à venir.
  const tourneesActives = new Set(upcoming.map(e=> e.tourneeId)).size;

  // Effectif de l'annuaire musicien·nes (titulaires vs remplaçant·es).
  const musiciensTitulaires = loadMusicians().filter(m=> (m.statutPoste||'titulaire') === 'titulaire').length;
  const musiciensRemplacants = loadMusicians().length - musiciensTitulaires;

  // Titulaires ayant un lien de dispo généré mais n'ayant pas répondu à toutes les
  // dates à venir de leur tournée (même logique que le badge "En attente" / "Nouvelles
  // dates" de la modale Demandes titulaires dans Tournées).
  const tourneesById = new Map(loadTournees().map(t=> [t.id, t]));
  const peopleById = new Map([...loadMusicians(), ...loadTechnicians()].map(p=> [p.id, p]));
  let reponsesEnAttente = 0;
  dispoDemandesCache.forEach(d=>{
    const tournee = tourneesById.get(d.tourneeId);
    const person = peopleById.get(d.personId);
    if(!tournee || !person) return;
    const answerableDates = (tournee.dates||[]).filter(dt=> dt.date && dt.date >= today && dt.statut !== 'annulee');
    if(answerableDates.length === 0) return;
    const dispo = person.disponibilites || {};
    const allAnswered = answerableDates.every(dt=> dispo[dt.date]);
    if(!allAnswered) reponsesEnAttente++;
  });

  const ICONS = {
    calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><line x1="3.5" y1="9.5" x2="20.5" y2="9.5" stroke="currentColor" stroke-width="1.4"></line><line x1="8" y1="3" x2="8" y2="6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><line x1="16" y1="3" x2="16" y2="6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><circle cx="8" cy="13.6" r="1.1" fill="currentColor"></circle><circle cx="12" cy="13.6" r="1.1" fill="currentColor"></circle><circle cx="16" cy="13.6" r="1.1" fill="currentColor"></circle>',
    warning: '<path d="M12 3.5 22 20.5H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><line x1="12" y1="9.5" x2="12" y2="14.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><circle cx="12" cy="17.2" r="1" fill="currentColor"></circle>',
    pin: '<path d="M12 21.5S5 14.8 5 9.8a7 7 0 1 1 14 0c0 5-7 11.7-7 11.7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><circle cx="12" cy="9.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"></circle>',
    ticket: '<path d="M3.5 9.5a2 2 0 0 0 0 4v3.5a1 1 0 0 0 1 1h15a1 1 0 0 0 1-1V13.5a2 2 0 0 1 0-4V6a1 1 0 0 0-1-1h-15a1 1 0 0 0-1 1v3.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path><line x1="14.5" y1="5.5" x2="14.5" y2="18" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 2"></line>',
    clock: '<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"></circle><polyline points="12,7 12,12 15.5,14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline>',
    bus: '<rect x="3.5" y="5" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><line x1="3.5" y1="10.3" x2="20.5" y2="10.3" stroke="currentColor" stroke-width="1.4"></line><circle cx="7.5" cy="19.3" r="1.4" fill="currentColor"></circle><circle cx="16.5" cy="19.3" r="1.4" fill="currentColor"></circle>',
    music: '<circle cx="7" cy="18" r="2.6" fill="currentColor"></circle><circle cx="16" cy="16" r="2.6" fill="currentColor"></circle><path d="M9.6 18V5.5L18.6 4v12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>',
  };
  const kpiIcon = name => `<svg width="19" height="19" viewBox="0 0 24 24">${ICONS[name]}</svg>`;

  const cards = [
    {
      icon: kpiIcon('calendar'), href:'tournees.html',
      value: next ? `${fmtDateFRShort(next.date)}` : '—',
      label: next ? `Prochaine date — ${escapeHtml(next.tourneeNom || '')}${next.ville ? ' · ' + escapeHtml(next.ville) : ''}` : 'Aucune date à venir'
    },
    {
      icon: kpiIcon('warning'), href:'tournees.html',
      value: String(sansAffectation.length), valueClass: sansAffectation.length > 0 ? 'warn' : 'ok',
      label:'Date' + (sansAffectation.length>1?'s':'') + ' à venir sans musicien·ne affecté·e'
    },
    {
      icon: kpiIcon('pin'), href:'tournees.html',
      value: String(infosManquantes.length), valueClass: infosManquantes.length > 0 ? 'warn' : 'ok',
      label:'Date' + (infosManquantes.length>1?'s':'') + ' à venir sans ville ni salle'
    },
    {
      icon: kpiIcon('ticket'), href:'tournees.html',
      value: String(enOption.length), valueClass: enOption.length > 0 ? 'warn' : 'ok',
      label:'Date' + (enOption.length>1?'s':'') + ' à venir encore en option'
    },
    {
      icon: kpiIcon('clock'), href:'suivi-dispo.html',
      value: String(reponsesEnAttente), valueClass: reponsesEnAttente > 0 ? 'warn' : 'ok',
      label:'Réponse' + (reponsesEnAttente>1?'s':'') + ' de dispo en attente (titulaires)'
    },
    {
      icon: kpiIcon('bus'), href:'tournees.html',
      value: String(tourneesActives),
      label:'Projet' + (tourneesActives>1?'s':'') + ' avec des dates à venir'
    },
    {
      icon: kpiIcon('music'), href:'annuaire.html',
      value: `${musiciensTitulaires} + ${musiciensRemplacants}`,
      label:`Musicien·nes titulaires + remplaçant·es`
    }
  ];

  // Les chiffres clés en étiquettes de charte, comme la maquette : un aplat
  // plein par tuile, le nombre en police d'affichage, le libellé dessous, et
  // une légère inclinaison alternée qui donne l'effet « collé à la main ».
  // Pas d'icône : dans la maquette c'est le chiffre qui porte la tuile.
  //
  // Les six couleurs tournent dans l'ordre de la charte. L'encre est portée par
  // la tuile et non par le chiffre — sur un aplat prune ou orange, un chiffre
  // en vert d'alerte devenait illisible, c'est pourquoi valueClass ne sert plus
  // à colorer mais seulement à choisir entre aplat calme et aplat d'alerte.
  //
  // Les aplats sont posés par .co-stats-charte (voir base.css) — via nth-child,
  // comme sur l'accueil — et NON en inline : les couleurs charte figées posées
  // en dur ne s'assombrissaient pas en mode sombre, laissant une bande criarde
  // sur fond noir. On ne garde en inline que l'inclinaison.
  const TILTS = ['-1.4deg', '.9deg', '-.5deg', '1.2deg', '-1deg', '.6deg'];
  holder.innerHTML = cards.map((c, i)=> `
    <a class="co-stat" href="${c.href}" style="--co-tilt:${TILTS[i % TILTS.length]};">
      <div class="co-stat-num">${c.value}</div>
      <div class="co-stat-label">${c.label}</div>
    </a>
  `).join('');
}

 *
 * Le title du navigateur arrivait après une seconde, se coupait, et ne disait

 * l'autre : trente précisions ne font pas trente éléments qui traînent.

let bulleNote = null;
function bulleDeNote(){
  if(bulleNote) return bulleNote;
  bulleNote = document.createElement('div');
  bulleNote.id = 'noteBulle';
  bulleNote.setAttribute('role', 'tooltip');
  document.body.appendChild(bulleNote);
  return bulleNote;
}
function montrerNote(cel){
  const b = bulleDeNote();
  const rep = cel.dataset.noteReponse || '';
  b.innerHTML = `<b>${escapeHtml(cel.dataset.noteQui || '')} · ${escapeHtml(cel.dataset.noteQuand || '')}</b>`
    + `<i>« ${escapeHtml(cel.dataset.note || '')} »</i>`
    + (rep ? `<u>↳ ${escapeHtml(rep)}${
        cel.dataset.noteReponseQui ? `<small>${escapeHtml(cel.dataset.noteReponseQui)}</small>` : ''}</u>` : '');
  b.classList.add('visible');
  const r = cel.getBoundingClientRect();
  const bb = b.getBoundingClientRect();
  const x = Math.max(8, Math.min(r.left + r.width / 2 - bb.width / 2, window.innerWidth - bb.width - 8));
  // Au-dessus de la case, sauf s'il n'y a pas la place — auquel cas dessous.
  const y = (r.top - bb.height - 8) < 8 ? r.bottom + 8 : r.top - bb.height - 8;
  b.style.left = Math.round(x) + 'px';
  b.style.top = Math.round(y) + 'px';
}
function cacherNote(){ celluleNote = null; if(bulleNote) bulleNote.classList.remove('visible'); }

/* ---------------------------------------------------------------------------
   Les deux gestes de la page, et le filet.
   ---------------------------------------------------------------------------
   MARQUER : le clic fait tourner la dispo comme sur la Grille interne
   (— → dispo → indispo → à confirmer → —), écrite fiche par fiche.
   AFFECTER : un clic affecte une personne DISPONIBLE, un re-clic la retire
   (confirmé) ; indispo, à confirmer ou sans réponse → pas d'affectation en un
   clic, direction le panneau de la page tournées, avec toutes ses règles.
   OUPS : chaque action s'empile (10 au plus) et s'annule dans l'ordre inverse,
   par le même chemin d'écriture qu'à l'aller.
--------------------------------------------------------------------------- */

const CYCLE_DISPO = ['', 'dispo', 'indispo', 'incertain'];
const LIBELLE_DISPO = { '': 'non renseigné', dispo: 'disponible', indispo: 'indisponible', incertain: 'à confirmer' };
let mode = (()=>{ try{ return localStorage.getItem('curieuxRecapMode') || 'marquer'; }catch(e){ return 'marquer'; } })();
let pileOups = [];

function poserMode(nouveau){
  mode = nouveau;
  try{ localStorage.setItem('curieuxRecapMode', mode); }catch(e){}
  document.body.classList.toggle('mode-marquer', mode === 'marquer');
  document.body.classList.toggle('mode-affecter', mode === 'affecter');
  document.querySelectorAll('.mode-pilules button').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.mode === mode ? 'true' : 'false'));
  document.getElementById('modeHint').textContent = mode === 'marquer'
    ? 'Un clic sur une case fait tourner : — → dispo → indispo → à confirmer.'
    : 'Un clic affecte une personne disponible ; re-clic pour retirer ; sinon, direction le panneau de la tournée.';
}

function majOups(){
  const btn = document.getElementById('oupsBtn');
  const dernier = pileOups[pileOups.length - 1];
  btn.disabled = !dernier;
  btn.textContent = dernier ? `↶ Oups — annuler : ${dernier.texte}` : '↶ Oups';
}
function pousserOups(action){
  pileOups.push(action);
  if(pileOups.length > 10) pileOups.shift();
  majOups();
  const btn = document.getElementById('oupsBtn');
  btn.classList.remove('frais');
  void btn.offsetWidth;                     // relance l'animation à chaque coup
  btn.classList.add('frais');
}

function personneDe(ptype, pid){
  return (ptype === 'musicien' ? loadMusicians() : loadTechnicians()).find(p=> p.id === pid);
}

/* ---------------------------------------------------------------------------
   Répondre à une précision
   ---------------------------------------------------------------------------
   Quelqu'un écrit « ok mais je dois être à Nantes le lendemain » : jusqu'ici
   la production le lisait et personne ne savait quoi en penser. Une réponse,
   une seule, par personne et par date — « c'est bon, tu pars après le
   filage » — et elle s'affiche à la personne sur sa page de dispos. Pas un
   fil de discussion : une réponse qui se réécrit tant qu'on veut, et qui
   s'efface si l'on vide le champ.
--------------------------------------------------------------------------- */
function reponseDe(personne, date){
  const r = (personne.reponsesProd || {})[date];
  const texte = r && (r.texte || '').trim();
  return texte ? { texte, auteur: (r.auteur || '').trim(), le: r.le || '' } : null;
}

// Qui répond : l'e-mail de la session admin. La page n'est ouverte qu'à
// l'équipe, mais rien n'oblige à ce qu'une seule personne y travaille.
let auteurReponse = '';
try{
  Promise.resolve(CurieuxDB.getSession()).then(s=>{
    auteurReponse = (s && s.user && s.user.email) || '';
  }).catch(()=>{});
}catch(e){}

async function ecrireReponse(ptype, personne, date, texte){
  const avant = JSON.parse(JSON.stringify(personne.reponsesProd || {}));
  if(!personne.reponsesProd) personne.reponsesProd = {};
  const propre = (texte || '').trim();
  if(propre) personne.reponsesProd[date] = { texte: propre, auteur: auteurReponse, le: new Date().toISOString() };
  else delete personne.reponsesProd[date];
  const { error } = await CurieuxDB.upsertOne(ptype === 'musicien' ? 'musiciens' : 'techniciens', personne);
  if(error){
    personne.reponsesProd = avant;
    alert('Écriture impossible — rien n\'a été changé :\n\n' + error.message);
    return false;
  }
  curieuxFlash(propre ? 'Réponse enregistrée' : 'Réponse retirée');
  return true;
}

async function ecrireDispo(ptype, personne, date, valeur, texteOups){
  const avant = (personne.disponibilites || {})[date] || '';
  if(!personne.disponibilites) personne.disponibilites = {};
  if(valeur) personne.disponibilites[date] = valeur; else delete personne.disponibilites[date];
  const { error } = await CurieuxDB.upsertOne(ptype === 'musicien' ? 'musiciens' : 'techniciens', personne);
  if(error){
    if(avant) personne.disponibilites[date] = avant; else delete personne.disponibilites[date];
    alert('Écriture impossible — rien n\'a été changé :\n\n' + error.message);
    return false;
  }
  if(texteOups) pousserOups({ genre:'dispo', ptype, pid: personne.id, date, avant, texte: texteOups });
  return true;
}

async function ecrireAffectation(t, d, champ, pid, ajouter){
  const avant = (d[champ] || []).slice();
  d[champ] = ajouter ? avant.concat([pid]) : avant.filter(x=> x !== pid);
  const { error } = await CurieuxDB.upsertOne('tournees', t);
  if(error){
    d[champ] = avant;
    alert('Écriture impossible — rien n\'a été changé :\n\n' + error.message);
    return false;
  }
  return true;
}

async function surClicCellule(cel){
  const { tid, did, pid, ptype, date } = cel.dataset;
  const today = new Date().toISOString().slice(0, 10);
  if(date < today) return;                      // le passé se regarde, ne se corrige pas ici
  const personne = personneDe(ptype, pid);
  const t = loadTournees().find(x=> x.id === tid);
  const d = t && (t.dates || []).find(x=> x.id === did);
  if(!personne || !d) return;
  const champ = ptype === 'musicien' ? 'musiciensAssignes' : 'techniciensAssignes';
  const nom = fullName(personne);
  const jour = `${fmtDateFRShort(date)}${d.ville ? ' · ' + d.ville : ''}`;

  // Case grisée : la personne n'a rien à répondre sur cette date, alors la
  // marquer ou l'affecter serait décider à sa place. Le premier geste, c'est
  // de la solliciter — la fenêtre s'ouvre sur ce projet, cette date cochée,
  // et laisse en ajouter d'autres tant qu'on y est.
  if(cel.classList.contains('hors-demande')){
    curieuxDemanderDispos({
      personne, personType: ptype, projets: loadTournees(), demandes: dispoDemandesCache,
      projetId: tid, datesCochees: [did],
      apres: ()=> rendreEnGardantLeScroll(),
    });
    return;
  }

  if(mode === 'marquer'){
    const avant = (personne.disponibilites || {})[date] || '';
    const apres = CYCLE_DISPO[(CYCLE_DISPO.indexOf(avant) + 1) % CYCLE_DISPO.length];
    if(await ecrireDispo(ptype, personne, date, apres,
      `dispo de ${nom} le ${fmtDateFRShort(date)} (retour à « ${LIBELLE_DISPO[avant]} »)`)){
      rendreEnGardantLeScroll();
    }
    return;
  }

  // --- mode affecter ---
  const dejaAffecte = (d[champ] || []).includes(pid);
  if(dejaAffecte){
    if(!confirm(`Retirer ${nom} du ${jour} ?`)) return;
    if(await ecrireAffectation(t, d, champ, pid, false)){
      pousserOups({ genre:'retrait', tid, did, pid, ptype, champ, texte:`retrait de ${nom} le ${fmtDateFRShort(date)}` });
      rendreEnGardantLeScroll();
    }
    return;
  }
  const etat = (personne.disponibilites || {})[date] || '';
  if(etat !== 'dispo'){
    // Pas d'affectation en un clic sans un « oui » : le panneau de la tournée
    // garde la main, avec ses remplaçants proposés et ses règles.
    if(!confirm(`${nom} est ${LIBELLE_DISPO[etat]} ce jour-là — pas d'affectation en un clic.\n\nOuvrir le panneau d'affectation de « ${t.nom || 'la tournée'} » ?`)) return;
    location.href = 'tournees.html?' + (cel.dataset.reco ? 'type=recording&' : '') + 'affecter=' + encodeURIComponent(tid + ':' + did);
    return;
  }
  const doublon = loadTournees().find(x=> x.id !== tid
    && (x.dates || []).some(dd=> dd.date === date && ((dd[champ] || []).includes(pid))));
  if(doublon && !confirm(`${nom} est déjà affecté·e le ${fmtDateFRShort(date)} sur « ${doublon.nom || 'un autre projet'} ». Affecter quand même ?`)) return;
  if(await ecrireAffectation(t, d, champ, pid, true)){
    pousserOups({ genre:'ajout', tid, did, pid, ptype, champ, texte:`affectation de ${nom} le ${fmtDateFRShort(date)}` });
    rendreEnGardantLeScroll();
  }
}

async function annulerDerniereAction(){
  const a = pileOups[pileOups.length - 1];
  if(!a) return;
  let ok = false;
  if(a.genre === 'dispo'){
    const personne = personneDe(a.ptype, a.pid);
    if(personne) ok = await ecrireDispo(a.ptype, personne, a.date, a.avant, null);
  } else {
    const t = loadTournees().find(x=> x.id === a.tid);
    const d = t && (t.dates || []).find(x=> x.id === a.did);
    if(t && d) ok = await ecrireAffectation(t, d, a.champ, a.pid, a.genre === 'retrait');
  }
  if(ok){
    pileOups.pop();
    majOups();
    rendreEnGardantLeScroll();
  }
}
