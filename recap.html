/* ============================================================================
   L'export PDF de la Vue d'ensemble
   ============================================================================
   Il tenait tout le calendrier sur une seule page en largeur. À quatre-vingts
   dates, chaque colonne faisait quatre millimètres : « 28 sept. » s'y écrivait
   une lettre par ligne, à la verticale, et personne ne pouvait lire une date.
   Le document se découpe donc en tranches de dates, une page par tranche, avec
   la colonne des noms répétée — comme on plie un tableur pour l'imprimer.

   Trois autres choses s'y jouaient :
     · les musicien·nes disparaissaient du document dès que le filtre d'écran
       valait « Titulaires + sollicité·es » — l'export ne connaissait que les
       anciennes valeurs et ne gardait alors personne ;
     · la police embarquée n'a ni ✓ ni ✕ : les cases affectées et indisponibles
       sortaient vides, et la légende annonçait un symbole invisible. Les
       marques sont maintenant tracées au trait, pas écrites ;
     · rien ne disait de quel projet venait une date. Un bandeau les coiffe,
       comme à l'écran.
============================================================================ */

// A3 paysage plutôt qu'A4 : 420 mm de large au lieu de 297, soit une
// cinquantaine de colonnes de plus par document pour la même lisibilité. Une
// feuille A3 s'imprime chez tous les imprimeurs, et se lit très bien réduite
// à l'écran ou sur un A4 en « ajuster à la page ».
const PDF_FORMAT = 'a3';
const PDF_LARGEUR_PAGE = 420;
const PDF_MARGE = 10;
const PDF_LARGEUR_NOM = 44;
const PDF_DATES_PAR_PAGE = 38;

// Les quatre états, tracés au trait : deux segments pour la coche, deux pour
// la croix. Rien qui dépende des caractères présents dans la police.
function pdfMarque(doc, etat, x, y, taille){
  const c = taille * 0.30;
  if(etat === 'affecte' || etat === 'dispo'){
    doc.setDrawColor(...(etat === 'affecte' ? [255, 255, 255] : [90, 16, 55]));
    doc.setLineWidth(taille * 0.11);
    doc.setLineCap('round'); doc.setLineJoin('round');
    doc.lines([[c * 0.75, c * 0.85], [c * 1.5, -c * 1.7]], x - c * 0.8, y);
  } else if(etat === 'indispo'){
    doc.setDrawColor(255, 255, 255);
    doc.setLineWidth(taille * 0.11);
    doc.setLineCap('round');
    doc.line(x - c, y - c, x + c, y + c);
    doc.line(x + c, y - c, x - c, y + c);
  } else if(etat === 'incertain'){
    // La ligne de base est sous la lettre : sans ce décalage, le point
    // d'interrogation se posait au bas de la case au lieu d'y être centré.
    doc.setFont('Host', 'bold'); doc.setFontSize(taille * 2.1);
    doc.setTextColor(255, 255, 255);
    doc.text('?', x, y + taille * 0.26, { align: 'center' });
  } else {
    doc.setDrawColor(196, 186, 191);
    doc.setLineWidth(taille * 0.09);
    doc.line(x - c * 0.9, y, x + c * 0.9, y);
  }
  doc.setLineCap('butt');
}

// Les hachures des cases « pas sollicité·e » — les mêmes diagonales qu'à
// l'écran. Tracées segment par segment : c'est le seul motif qu'un PDF
// comprenne sans image.
function pdfHachures(doc, x, y, w, h){
  doc.setDrawColor(128, 110, 120);
  doc.setLineWidth(0.16);
  for(let d = -h; d < w; d += 1.1){
    const x1 = x + Math.max(d, 0), y1 = y + Math.max(-d, 0);
    const t = Math.min(h - Math.max(-d, 0), w - Math.max(d, 0));
    if(t > 0) doc.line(x1, y1, x1 + t, y1 + t);
  }
}

const PDF_FONDS = {
  affecte: [47, 143, 91],
  dispo: [206, 225, 244],
  indispo: [178, 59, 46],
  incertain: [184, 121, 42],
};

// La légende, dessinée avec les mêmes marques que les cases — sinon elle
// promet des symboles que le document ne contient pas.
function pdfLegende(doc, x, y){
  const items = [['affecte', 'affecté·e'], ['dispo', 'disponible'], ['indispo', 'indisponible'],
                 ['incertain', 'à confirmer'], ['', 'sans réponse'], ['hors', 'pas sollicité·e']];
  const h = 4.2;
  items.forEach(([etat, libelle])=>{
    if(etat === 'hors'){
      doc.setFillColor(233, 229, 231);
      doc.rect(x, y - h + 1, 5.4, h, 'F');
      pdfHachures(doc, x, y - h + 1, 5.4, h);
      doc.setDrawColor(148, 132, 142); doc.setLineWidth(0.12);
      doc.roundedRect(x, y - h + 1, 5.4, h, 0.8, 0.8, 'S');
    } else {
      if(etat){ doc.setFillColor(...PDF_FONDS[etat]); doc.roundedRect(x, y - h + 1, 5.4, h, 0.8, 0.8, 'F'); }
      pdfMarque(doc, etat, x + 2.7, y - h / 2 + 1, 2.4);
    }
    doc.setFont('Host', 'normal'); doc.setFontSize(7); doc.setTextColor(90, 80, 86);
    doc.text(libelle, x + 6.6, y - 0.4);
    x += 7.4 + doc.getTextWidth(libelle) + 4;
  });
}

// Une bande par suite de dates consécutives du même projet — le même
// raisonnement qu'à l'écran, pour la rangée de tête du tableau.
function pdfBandesProjets(entries){
  const bandes = [];
  entries.forEach(e=>{
    const derniere = bandes[bandes.length - 1];
    if(derniere && derniere.tourneeId === e.tourneeId) derniere.n++;
    else bandes.push({ tourneeId: e.tourneeId, nom: e.tourneeNom || 'Projet', reco: e.estRecording, n: 1 });
  });
  return bandes;
}

// Couper au bon endroit plutôt que de laisser la mise en page couper au
// milieu d'un mot : « L'Atelie r de Joe His aishi » ne se lit pas.
function pdfTronquer(doc, texte, largeurMax, taille){
  doc.setFont('Host', 'bold'); doc.setFontSize(taille);
  if(doc.getTextWidth(texte) <= largeurMax) return texte;
  let court = texte;
  while(court.length > 1 && doc.getTextWidth(court + '…') > largeurMax) court = court.slice(0, -1);
  return court.trimEnd() + '…';
}

// Les projets de la page, en toutes lettres. Les bandes étroites ne peuvent
// porter qu'un nom coupé ; celle-ci rend l'entier, une fois, sous le titre.
function pdfLegendeProjets(doc, x, y, bandes, couleurs){
  const vus = [];
  bandes.forEach(b=>{ if(!vus.some(v=> v.tourneeId === b.tourneeId)) vus.push(b); });
  let ligne = y;
  vus.forEach(b=>{
    const nom = (b.nom || 'Projet') + (b.reco ? ' · Rec' : '');
    doc.setFont('Host', 'normal'); doc.setFontSize(6.8);
    const largeur = 4.4 + doc.getTextWidth(nom) + 5;
    if(x + largeur > PDF_LARGEUR_PAGE - PDF_MARGE){ x = PDF_MARGE; ligne += 4; }
    doc.setFillColor(...pdfCouleurRgb(couleurs.get(b.tourneeId)));
    doc.roundedRect(x, ligne - 2.6, 3.2, 3.2, 0.6, 0.6, 'F');
    doc.setTextColor(90, 80, 86);
    doc.text(nom, x + 4.4, ligne);
    x += largeur;
  });
  return ligne;
}

/* Une case, telle qu'elle est à l'écran : le fond porte la couleur du projet,
 * une pastille arrondie porte l'état, un point orange signale une précision
 * laissée par la personne, et les dates où elle n'est pas sollicitée sont
 * hachurées en diagonale.
 */
function pdfCase(doc, cell, personne, entry, ptype, etat, numero){
  const affecte = etat === 'affecte';
  const hors = !affecte && !estSollicite(personne, ptype, entry);
  if(hors){
    // « Grisé », comme à l'écran : un voile qui éteint la couleur du projet,
    // les hachures par-dessus, et la pastille en creux — la case existe, elle
    // n'attend simplement rien de cette personne.
    const x0 = cell.x + 0.12, y0 = cell.y + 0.12;
    const w0 = cell.width - 0.24, h0 = cell.height - 0.24;
    try{
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({ opacity: 0.62 }));
      doc.setFillColor(228, 224, 226);
      doc.rect(x0, y0, w0, h0, 'F');
      doc.restoreGraphicsState();
    }catch(err){
      doc.setFillColor(233, 229, 231);
      doc.rect(x0, y0, w0, h0, 'F');
    }
    pdfHachures(doc, x0, y0, w0, h0);
    const wc = Math.min(cell.width * 0.66, 6.6), hc = Math.min(cell.height * 0.62, 4.6);
    doc.setDrawColor(148, 132, 142);
    doc.setLineWidth(0.12);
    doc.roundedRect(cell.x + (cell.width - wc) / 2, cell.y + (cell.height - hc) / 2, wc, hc, 1, 1, 'S');
    return;
  }
  const w = Math.min(cell.width * 0.66, 6.6);
  const h = Math.min(cell.height * 0.62, 4.6);
  const x = cell.x + (cell.width - w) / 2;
  const y = cell.y + (cell.height - h) / 2;
  if(PDF_FONDS[etat]){
    doc.setFillColor(...PDF_FONDS[etat]);
    doc.roundedRect(x, y, w, h, 1, 1, 'F');
  } else {
    // « Sans réponse » : la pastille blanche de l'écran, cerclée, pour qu'on
    // voie qu'il y a bien une case et non un trou dans le tableau.
    doc.setFillColor(255, 255, 255);
    doc.setDrawColor(224, 208, 216);
    doc.setLineWidth(0.12);
    doc.roundedRect(x, y, w, h, 1, 1, 'FD');
  }
  pdfMarque(doc, etat, cell.x + cell.width / 2, cell.y + cell.height / 2, Math.min(w, h) * 0.62);
  if(numero){
    // Un numéro plutôt qu'un point : le texte de la précision ne tient pas
    // dans neuf millimètres, il se lit sous le tableau, à ce numéro-là. Prune
    // quand la production y a déjà répondu, orange quand elle doit encore.
    const repondu = !!reponseDe(personne, entry.date);
    doc.setFillColor(repondu ? 121 : 236, repondu ? 22 : 75, repondu ? 73 : 21);
    doc.circle(x + w - 0.1, y + 0.1, 1.35, 'F');
    doc.setFont('Host', 'bold'); doc.setFontSize(4.6); doc.setTextColor(255, 255, 255);
    doc.text(String(numero), x + w - 0.1, y + 0.68, { align: 'center' });
  }
}

/* Les précisions, sous le tableau.
 *
 * « ok mais je pars à 22h » n'entre pas dans une case de neuf millimètres, et
 * la reléguer dans une infobulle ne sert à rien sur du papier. Chaque case
 * annotée porte donc un numéro, et le numéro se lit ici, en toutes lettres,
 * avec le nom et la date — comme les notes de bas de page d'un programme.
 */
function pdfPrecisions(doc, y, notes, dessinerEntete){
  if(!notes.length) return y;
  const hauteurPage = doc.internal.pageSize.getHeight();
  const largeur = PDF_LARGEUR_PAGE - 2 * PDF_MARGE - 6;
  const placer = (besoin)=>{
    if(y + besoin <= hauteurPage - 12) return;
    doc.addPage(); dessinerEntete(); y = 30;
  };
  placer(10);
  doc.setFont('Host', 'bold'); doc.setFontSize(8); doc.setTextColor(236, 75, 21);
  doc.setCharSpace(0.08);
  doc.text('PRÉCISIONS LAISSÉES SUR LES DATES', PDF_MARGE, y);
  doc.setCharSpace(0);
  // Le numéro d'une précision à laquelle on a répondu est prune, pas orange :
  // sans un mot, personne ne devinerait ce que veut dire la couleur.
  if(notes.some(n=> n.reponse)){
    doc.setFont('Host', 'normal'); doc.setFontSize(6.4); doc.setTextColor(140, 125, 133);
    doc.text('numéro prune = réponse de la production', PDF_MARGE + 62, y);
  }
  y += 4.8;
  notes.forEach(n=>{
    doc.setFont('Host', 'normal'); doc.setFontSize(7.4);
    const lignes = doc.splitTextToSize(`${n.qui} · ${n.quand} — « ${n.texte} »`, largeur);
    // La réponse de la production juste dessous, en prune : sur papier comme à
    // l'écran, on lit la question et ce qu'on y a répondu d'un seul tenant.
    const reponse = n.reponse ? doc.splitTextToSize('> ' + n.reponse, largeur - 3) : [];
    placer((lignes.length + reponse.length) * 3.2 + 2);
    doc.setFillColor(n.reponse ? 121 : 236, n.reponse ? 22 : 75, n.reponse ? 73 : 21);
    doc.circle(PDF_MARGE + 1.9, y - 1.05, 1.9, 'F');
    doc.setFont('Host', 'bold'); doc.setFontSize(5.4); doc.setTextColor(255, 255, 255);
    doc.text(String(n.num), PDF_MARGE + 1.9, y - 0.25, { align: 'center' });
    doc.setFont('Host', 'normal'); doc.setFontSize(7.4); doc.setTextColor(58, 50, 55);
    doc.text(lignes, PDF_MARGE + 5.6, y);
    y += lignes.length * 3.2;
    if(reponse.length){
      doc.setFont('Host', 'bold'); doc.setFontSize(7.2); doc.setTextColor(121, 22, 73);
      doc.text(reponse, PDF_MARGE + 8.6, y);
      y += reponse.length * 3.2;
    }
    y += 1.4;
  });
  return y + 3;
}

// Le nom en gras, l'instrument ou le poste dessous — la colonne de gauche de
// l'écran, à l'identique.
function pdfNomPersonne(doc, cell, personne, sous){
  const metier = personne.statutPoste === 'remplacant'
    ? 'Remplaçant·e' : (personne.instrument || personne.poste || '');
  const x = cell.x + (sous ? 6.5 : 2);
  if(sous){
    doc.setFont('Host', 'bold'); doc.setFontSize(7); doc.setTextColor(236, 75, 21);
    doc.text('>', cell.x + 2.4, cell.y + cell.height / 2, { baseline: 'middle' });
  }
  doc.setFont('Host', 'bold'); doc.setFontSize(7.2); doc.setTextColor(20, 22, 23);
  doc.text(pdfTronquer(doc, fullName(personne), cell.width - 4, 7.2),
    x, cell.y + cell.height / 2 - (metier ? 0.6 : -0.9), { baseline: 'middle' });
  if(!metier) return;
  doc.setFont('Host', 'normal'); doc.setFontSize(6); doc.setTextColor(140, 125, 133);
  doc.text(pdfTronquer(doc, metier, cell.width - 4, 6), x, cell.y + cell.height / 2 + 2.2, { baseline: 'middle' });
}

function colonnesLargeurs(nbDates){
  const utile = PDF_LARGEUR_PAGE - 2 * PDF_MARGE;
  const largeur = (utile - PDF_LARGEUR_NOM) / PDF_DATES_PAR_PAGE;
  const styles = { 0: { halign:'left', cellWidth: PDF_LARGEUR_NOM, minCellHeight: 7.6 } };
  for(let i = 1; i <= nbDates; i++) styles[i] = { cellWidth: largeur };
  return styles;
}

function buildMatrixTable(doc, startY, people, assignField, titre, entries, dessinerEntete){
  const sorted = people;   // déjà dans l'ordre voulu, voir garderSelonFiltre
  if(sorted.length === 0 || entries.length === 0) return startY;

  const couleurs = couleursProjets();
  doc.setFont('Host', 'bold');
  doc.setFontSize(10);
  doc.setTextColor(121, 22, 73);
  doc.text(titre, PDF_MARGE, startY);
  pdfLegende(doc, PDF_MARGE + doc.getTextWidth(titre) + 6, startY);

  const bandes = pdfBandesProjets(entries);
  const largeurCol = (PDF_LARGEUR_PAGE - 2 * PDF_MARGE - PDF_LARGEUR_NOM) / PDF_DATES_PAR_PAGE;
  const ptypeMatrice = assignField === 'musiciensAssignes' ? 'musicien' : 'technicien';

  // Les précisions de cette tranche, numérotées dans l'ordre de lecture —
  // personne par personne, date par date. Le numéro va dans la case, le texte
  // sous le tableau. La case à cocher de l'écran peut les mettre de côté.
  const avecNotes = (document.getElementById('pdfAvecNotes') || {}).checked !== false;
  const notes = [];
  const numeroNote = new Map();
  if(avecNotes) sorted.forEach(m=> entries.forEach(e=>{
    const texte = ((m.disponibilitesCommentaires || {})[e.date] || '').trim();
    if(!texte) return;
    // Deux projets le même jour montrent la même phrase sur deux cases : un
    // seul numéro, une seule ligne sous le tableau.
    const cle = m.id + '|' + e.date;
    if(numeroNote.has(cle)) return;
    numeroNote.set(cle, notes.length + 1);
    const rep = reponseDe(m, e.date);
    notes.push({ num: notes.length + 1, qui: fullName(m),
      quand: fmtDateFRShort(e.date) + (e.ville ? ' · ' + e.ville : ''), texte,
      reponse: rep ? rep.texte : '' });
  }));
  const fondsProjets = new Map();
  entries.forEach(e=>{
    if(!fondsProjets.has(e.tourneeId)) fondsProjets.set(e.tourneeId, pdfCouleurRgb(couleurs.get(e.tourneeId)));
  });
  const teteProjets = [{ content: '', colSpan: 1 }].concat(bandes.map(b=> ({
    content: pdfTronquer(doc, (b.nom || 'Projet') + (b.reco ? ' · Rec' : ''), b.n * largeurCol - 3, 6.5),
    colSpan: b.n,
    styles: { fillColor: pdfCouleurRgb(couleurs.get(b.tourneeId)), textColor: [20, 22, 23], fontSize: 6.5 },
  })));
  const basLegende = pdfLegendeProjets(doc, PDF_MARGE, startY + 5.4, bandes, couleurs);
  // Date puis ville, sur deux lignes : exactement ce que porte l'en-tête à
  // l'écran. La ville est tronquée à la largeur de la colonne plutôt que
  // renvoyée à la ligne — « Épernay » ne se coupe pas en « Éper / nay ».
  // Jour, mois, ville : trois lignes courtes plutôt qu'un « 10 févr. » que la
  // colonne renverrait de toute façon à la ligne. La ville est tronquée à la
  // largeur utile, mesurée dans la police de l'en-tête.
  const utileTete = largeurCol - 1.8;
  const teteDates = [''].concat(entries.map(e=>{
    const [j, mois] = fmtDateFRShort(e.date).split(' ');
    const ville = (e.ville || '').split(' (')[0];
    return j + '\n' + (mois || '') + (ville ? '\n' + pdfTronquer(doc, ville, utileTete, 6.5) : '');
  }));

  doc.autoTable({
    startY: basLegende + 2.6,
    margin: { left: PDF_MARGE, right: PDF_MARGE, top: 26 },
    head: [teteProjets, teteDates],
    body: sorted.map(m=>{
      const dispo = m.disponibilites || {};
      return [fullName(m)].concat(entries.map(e=>{
        if((e.assignes || []).includes(m.id)) return 'affecte';
        return dispo[e.date] || '';
      }));
    }),
    styles: { font:'Host', fontSize:7, cellPadding:1.4, textColor:[20,22,23], halign:'center', valign:'middle', lineWidth:0.1, lineColor:[214,180,196] },
    // Largeur de colonne fixe, la même d'une page à l'autre : sinon la
    // dernière tranche, qui n'a parfois que deux dates, les étirait sur toute
    // la feuille et ne ressemblait plus aux précédentes.
    columnStyles: colonnesLargeurs(entries.length),
    headStyles: { fillColor:[121,22,73], textColor:255, fontStyle:'bold', fontSize:6.5, halign:'center', valign:'middle', cellPadding:0.9 },
    didParseCell: (data)=>{
      if(data.section !== 'body') return;
      // Rien n'est écrit par le tableau : le fond porte la couleur du projet,
      // et tout le reste — pastille, marque, hachures, nom et instrument — est
      // tracé dans didDrawCell, à l'image de l'écran.
      data.cell.text = [''];
      if(data.column.index === 0) return;
      const e = entries[data.column.index - 1];
      data.cell.styles.fillColor = fondsProjets.get(e.tourneeId) || [255, 255, 255];
    },
    didDrawCell: (data)=>{
      if(data.section !== 'body') return;
      const m = sorted[data.row.index];
      if(!m) return;
      if(data.column.index === 0){ pdfNomPersonne(doc, data.cell, m, sousRemplacants[ptypeMatrice].has(m.id)); return; }
      const e = entries[data.column.index - 1];
      pdfCase(doc, data.cell, m, e, ptypeMatrice, data.cell.raw, numeroNote.get(m.id + '|' + e.date));
    },
    didDrawPage: dessinerEntete,
  });
  return pdfPrecisions(doc, doc.lastAutoTable.finalY + 6, notes, dessinerEntete) + 8;
}

// « var(--tour-3) » → le triplet RGB correspondant, lu sur la page elle-même :
// les couleurs de projet du PDF sont exactement celles de l'écran.
function pdfCouleurRgb(variable){
  if(!variable) return [245, 238, 241];
  const nom = String(variable).replace(/^var\(|\)$/g, '').trim();
  const val = getComputedStyle(document.documentElement).getPropertyValue(nom).trim();
  const m = /^#?([0-9a-f]{6})$/i.exec(val);
  if(!m) return [245, 238, 241];
  const n = parseInt(m[1], 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function exportRecapPdf(){
  if(!window.jspdf){ alert("La librairie PDF n'a pas pu être chargée."); return; }
  const tourneeId = document.getElementById('pdfTourneeSelect').value || null;
  const tournee = tourneeId ? loadTournees().find(t=>t.id === tourneeId) : null;
  const titreEntete = tournee ? `VUE D'ENSEMBLE — ${(tournee.nom || 'TOURNÉE').toUpperCase()}` : "VUE D'ENSEMBLE";

  // Ce qui s'imprime est ce qui s'affiche : mêmes personnes, mêmes projets.
  // Le sélecteur du PDF ne fait que restreindre davantage, à un seul projet.
  const musiciens = garderSelonFiltre(loadMusicians(), 'musicien');
  const techniciens = garderSelonFiltre(loadTechnicians(), 'technicien');
  const datesMus = allDateEntries('musiciensAssignes', tourneeId).filter(e=> !projetsMasques.has(e.tourneeId));
  const datesTech = allDateEntries('techniciensAssignes', tourneeId).filter(e=> !projetsMasques.has(e.tourneeId));

  if(!datesMus.length && !datesTech.length){
    alert("Aucune date à exporter — vérifie les projets affichés et « Afficher aussi les dates passées ».");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format: PDF_FORMAT, orientation:'landscape' });
  registerHostFont(doc);
  const pageWidth = doc.internal.pageSize.getWidth();
  const dessinerEntete = ()=> drawCurieuxPdfHeader(doc, pageWidth, titreEntete);

  const nbPages = Math.max(1, Math.ceil(Math.max(datesMus.length, datesTech.length) / PDF_DATES_PAR_PAGE));
  for(let i = 0; i < nbPages; i++){
    if(i > 0) doc.addPage();
    dessinerEntete();
    const debut = i * PDF_DATES_PAR_PAGE, fin = debut + PDF_DATES_PAR_PAGE;
    const trancheMus = datesMus.slice(debut, fin);
    const trancheTech = datesTech.slice(debut, fin);
    // Le repère de tranche : sans lui, deux pages se ressemblent trop.
    if(nbPages > 1){
      doc.setFont('Host', 'normal'); doc.setFontSize(7.5); doc.setTextColor(140, 125, 133);
      const bornes = (trancheMus.length ? trancheMus : trancheTech);
      doc.text(`Dates ${debut + 1} à ${debut + bornes.length} sur ${Math.max(datesMus.length, datesTech.length)}`
        + `  ·  du ${fmtDateFR(bornes[0].date)} au ${fmtDateFR(bornes[bornes.length - 1].date)}`,
        pageWidth - 12, 26, { align: 'right' });
    }
    let y = buildMatrixTable(doc, 30, musiciens, 'musiciensAssignes', 'MUSICIEN·NES', trancheMus, dessinerEntete);
    buildMatrixTable(doc, y, techniciens, 'techniciensAssignes', 'TECHNICIEN·NES', trancheTech, dessinerEntete);
  }

  const fileSuffix = tournee ? (tournee.nom||'tournee').trim().replace(/[^a-z0-9]+/gi,'_') : 'toutes_tournees';
  doc.save(`Vue_ensemble_Curieux_orchestre_${fileSuffix}.pdf`);
}
document.getElementById('exportPdfBtn').addEventListener('click', exportRecapPdf);
document.getElementById('chipPrecisions').addEventListener('click', allerPrecisionSuivante);

function populateTourneeSelect(){
  const sel = document.getElementById('pdfTourneeSelect');
  const current = sel.value;
  sel.innerHTML = `<option value="">Tous les projets</option>` +
    loadTournees().map(t=>`<option value="${escapeHtml(t.id)}">${escapeHtml((t.nom || 'Tournée') + suffixeProjetTexte(t))}</option>`).join('');
  if(loadTournees().some(t=>t.id === current)) sel.value = current;
}
