<style>
  .wrap{max-width:720px; margin:0 auto; font-variant-numeric:tabular-nums;}
  .brand-logo-img{height:30px; width:auto; display:block; margin:0 0 18px;}
  .state-box{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:26px 20px; text-align:center; color:var(--muted); font-size:14px;}

  input[type=text], input[type=number]{ padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13.5px; background:var(--card); color:var(--text); font-family:inherit; }
  button{ cursor:pointer; border:none; border-radius:8px; font-size:12.5px; font-weight:700; padding:8px 13px; font-family:inherit; background:var(--accent-tint); color:var(--accent-dark); }

  .entete{margin-bottom:22px;}
  .entete .qui{color:var(--muted); font-size:13px; margin-top:2px;}

  .fiche-date{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:16px; overflow:hidden;}
  .fiche-date-head{padding:14px 16px; background:var(--bg); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .fiche-date-head h2{margin:0; font-size:16px; font-weight:800;}
  .fiche-date-head .quand{font-size:12px; color:var(--muted);}
  .fiche-date-body{padding:14px 16px; display:flex; flex-direction:column; gap:12px;}

  /* Les filets entre blocs viennent de l'ombre portée de chaque bloc, et non
     d'un fond de grille apparaissant dans les gouttières : une dernière rangée
     incomplète laissait sinon un aplat de couleur là où il manquait un bloc. */
  /* Deux colonnes fixes, et non un auto-fit : « Accès » et « Faits techniques »
     ouvrent toujours une rangée pleine, et les blocs pleine largeur (tableaux)
     qui suivent ne laissent plus une 3ᵉ colonne vide en fin de première rangée.
     Repasse à une colonne en petit écran, comme les tableaux ci-dessous. */
  .fiche-grille{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:1px; background:var(--card); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .bloc{background:var(--card); box-shadow:0 0 0 .5px var(--border); padding:11px 13px 13px; display:flex; flex-direction:column; gap:6px;}
  /* Un tableau prend toute la largeur de la grille : quatre colonnes ne tiennent
     pas dans une carte partagée avec ses voisines. */
  .bloc-large{grid-column:1 / -1;}
  .tableau{display:grid; grid-template-columns:repeat(var(--cols), minmax(0, 1fr)); gap:0 14px;}
  .tableau .th{
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    color:var(--muted); padding-bottom:6px; border-bottom:1.5px solid var(--accent); margin-bottom:6px;
  }
  .tableau .td{font-size:13.5px; padding:6px 0; border-bottom:1px solid var(--border); line-height:1.35;}
  .tableau .td.repere{font-weight:800;}
  .tableau-note{margin:9px 0 0; font-size:12px; color:var(--muted); line-height:1.45;}
  @media (max-width:560px){
    .fiche-grille{grid-template-columns:minmax(0,1fr);}
    .tableau{grid-template-columns:minmax(0,1fr); gap:0;}
    .tableau .th{display:none;}
    .tableau .td{border-bottom:none; padding:2px 0;}
    .tableau .td.repere{margin-top:10px; border-top:1px solid var(--border); padding-top:8px;}
  }

  .bloc .titre{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700;}
  .champ{display:flex; justify-content:space-between; gap:10px; font-size:13px; align-items:baseline;}
  /* L'intitulé ne se coupe jamais : « Semi 1 » sur deux lignes ne se lit pas. */
  .champ .k{color:var(--muted); white-space:nowrap;}
  .champ .v{font-weight:700; text-align:right;}
  .vide-champ{color:var(--old-champagne); font-size:12.5px;}

  .vacation-pub{background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px; font-size:13px;}
  .vacation-pub .h{font-weight:700; margin-bottom:6px;}
  .vacation-pub .demande{color:var(--muted); font-size:12px; margin-bottom:8px;}
  .reponse-form{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .reponse-form input[type=number]{width:70px;}
  .reponse-form input[type=text]{flex:1; min-width:120px;}
  .reponse-ok{font-size:12px; color:var(--ok); font-weight:700;}

  .section-registre{margin-top:26px;}
  .section-registre h2{font-size:15px; margin:0 0 10px;}
  .registre-item{background:var(--card); border:1px solid var(--border); border-radius:8px; padding:10px 13px; margin-bottom:8px; font-size:13px;}
  .registre-item .nom{font-weight:700;}
  .registre-item .sub{color:var(--muted); font-size:12px; margin-top:2px;}

  .plan-zone{position:relative; display:inline-block; max-width:100%; border-radius:8px; overflow:hidden; border:1px solid var(--border); margin-top:8px;}
  .plan-zone img{max-width:100%; display:block;}
  .pin{position:absolute; transform:translate(-50%,-100%); touch-action:none; display:flex; flex-direction:column; align-items:center; gap:2px;}
  .pin-tete{background:var(--accent-solid); color:#fff; font-size:13px; font-weight:800; padding:6px 12px; border-radius:20px; white-space:nowrap; box-shadow:0 2px 8px rgba(0,0,0,.3);}
  .pin-pointe{width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:9px solid var(--accent-solid);}
  .pin.dragging{cursor:grabbing; opacity:.85;}
  .pin.note .pin-tete{background:#F5C518; color:#2b2200; max-width:220px; white-space:normal; text-align:center; font-weight:700;}
  .pin.note .pin-pointe{border-top-color:#F5C518;}
  .plan-outils{display:flex; gap:8px; margin:8px 0;}
  .plan-statut{font-size:12px; color:var(--muted); margin-top:6px;}
  .equipe-chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px 3px 6px; border-radius:20px; background:var(--bg); border:1px solid var(--border); margin:2px 4px 2px 0;}
  .equipe-chip .pastille{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .horaires-liste{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .horaire-chip{font-size:12px; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:4px 10px;}

  /* ==========================================================================
     Sommaire des dates.

     Une tournée de vingt-huit dates se lisait d'un seul tenant : pour trouver
     la dernière, il fallait faire défiler les vingt-sept autres. La page
     n'affiche donc plus qu'une date à la fois, choisie dans un sommaire qui
     reste sous la main. Sur téléphone, le sommaire devient une bande de
     pastilles au-dessus de la fiche — chaque fiche étant courte, il n'a pas
     besoin de coller au défilement.
     ========================================================================== */
  body.avec-sommaire .wrap{max-width:1120px;}
  .mise-en-page{display:grid; grid-template-columns:236px minmax(0,1fr); gap:22px; align-items:start;}
  .sommaire{
    position:sticky; top:16px; max-height:calc(100vh - 32px); overflow-y:auto;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:10px; display:flex; flex-direction:column; gap:2px;
  }
  .sommaire-titre{font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:800; padding:6px 8px 8px;}
  .sommaire-date{
    display:block; width:100%; text-align:left; background:transparent; color:var(--text);
    border-radius:10px; padding:8px 10px; line-height:1.3; min-width:0;
  }
  .sommaire-date:hover{background:var(--bg);}
  .sommaire-date[aria-current="true"]{background:var(--accent-solid); color:#FCF2F0;}
  .sommaire-quand{display:block; font-size:12.5px; font-weight:800;}
  .sommaire-ou{display:block; font-size:11.5px; color:var(--muted); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sommaire-date[aria-current="true"] .sommaire-ou{color:rgba(252,242,240,.82);}
  @media (max-width:860px){
    .mise-en-page{grid-template-columns:minmax(0,1fr); gap:14px;}
    .sommaire{position:static; max-height:none; flex-direction:row; overflow-x:auto; padding:8px; gap:6px;}
    .sommaire-titre{display:none;}
    .sommaire-date{width:auto; flex:0 0 auto;}
    .sommaire-ou{max-width:160px;}
  }

  /* Mouvements de matériel du jour — la même information que la page Matériel,
     du côté de ceux qui la reçoivent : ce qui sort, ce qui rentre, à quelle
     heure, pour le dire au chauffeur concerné. */
  .mvt-jour{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; line-height:1.35;}
  .mvt-jour .h{font-weight:800; font-size:12.5px; flex:0 0 46px;}
  .mvt-jour .h.vide{color:var(--muted); font-weight:600;}
  .mvt-jour .sens{
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 9px; border-radius:999px; white-space:nowrap; flex:0 0 auto;
  }
  .mvt-jour .sens.sortie{background:var(--secondary); color:#FCF2F0;}
  .mvt-jour .sens.entree{background:var(--accent-tint); color:var(--tint-ink);}
  .mvt-jour .sens.retour{background:var(--accent); color:#FCF2F0;}
  .mvt-jour .lot{font-weight:700;}
  .mvt-jour .quoi{color:var(--muted);}
</style>

document.addEventListener('click', async (e)=>{
  const btnRemarque = e.target.closest('[data-envoyer-remarque]');
  if(btnRemarque){
    const zone = btnRemarque.closest('[data-remarque]');
    const sujet = zone.querySelector('[data-champ="sujet"]').value.trim();
    const message = zone.querySelector('[data-champ="message"]').value.trim();
    if(!message){ zone.querySelector('[data-champ="message"]').focus(); return; }
    btnRemarque.disabled = true;
    const res = await CurieuxDB.ajouterRemarqueParJeton(TOKEN, zone.dataset.remarque, sujet, message);
    btnRemarque.disabled = false;
    if(res.error || !res.ok){ alert("La remarque n'a pas pu être envoyée — réessaie."); return; }
    zone.querySelector('[data-ok]').style.display = 'inline';
    remarquesEnvoyees = await CurieuxDB.getRemarquesParJeton(TOKEN);
    renderContenu();
    return;
  }

  const btn = e.target.closest('[data-repondre]');
  if(!btn) return;
  const form = btn.closest('.reponse-form');
  const reponse = {};
  form.querySelectorAll('[data-champ]').forEach(inp=>{
    if(inp.type === 'checkbox'){ reponse[inp.dataset.champ] = inp.checked; return; }
    if(inp.value === '') return;
    reponse[inp.dataset.champ] = inp.type === 'number' ? Number(inp.value) : inp.value;
  });
  btn.disabled = true;
  const res = await CurieuxDB.repondreVacationSalle(TOKEN, form.dataset.date, form.dataset.type, Number(form.dataset.index), reponse);
  btn.disabled = false;
  if(res.error || !res.ok){ alert("Échec de l'envoi — réessaie."); return; }
  form.querySelector('[data-ok]').style.display = 'inline';
});

// ============================================================================
// Dépôt du plan par le stage manager. Le fichier part vers api/deposer-plan-salle.js,
// qui vérifie le jeton avec la clé de service : le bucket n'accepte pas la clé
// anonyme, et l'ouvrir aurait offert un dépôt de fichiers sans authentification.
function choisirEtDeposerPlan(dateId){
  const champ = document.createElement('input');
  champ.type = 'file';
  champ.accept = 'image/jpeg,image/png,image/webp';
  champ.addEventListener('change', async ()=>{
    const fichier = champ.files[0];
    if(!fichier) return;
    const statut = document.querySelector(`[data-plan-statut="${CSS.escape(dateId)}"]`);
    const dire = (texte)=>{ if(statut) statut.textContent = texte; };
    if(fichier.size > 8 * 1024 * 1024){
      dire(`Trop lourd (${(fichier.size/1024/1024).toFixed(1)} Mo) — 8 Mo maximum.`);
      return;
    }
    dire(t('plan_depot_encours'));
    try{
      const base64 = await new Promise((resolve, reject)=>{
        const lecteur = new FileReader();
        lecteur.onload = ()=> resolve(String(lecteur.result).split(',')[1] || '');
        lecteur.onerror = ()=> reject(new Error('Fichier illisible.'));
        lecteur.readAsDataURL(fichier);
      });
      const rep = await fetch('/api/deposer-plan-salle', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jeton: TOKEN, dateId, typeMime: fichier.type, fichier: base64 }),
      });
      const data = await rep.json().catch(()=> ({}));
      if(!rep.ok || !data.ok){ dire(data.erreur || `Le dépôt a échoué (${rep.status}).`); return; }
      dire(t('plan_depot_ok'));
      // On recharge le récap : la page redessine alors la zone de plan avec
      // l'image, prête à recevoir les pastilles de semis.
      RECAP = await CurieuxDB.getRecapLogistique(TOKEN);
      renderContenu();
    }catch(e){
      dire("Le dépôt a échoué : " + (e && e.message ? e.message : 'raison inconnue'));
    }
  });
  champ.click();
}

const modesPlanParZone = {};
function initPlanZone(containerId, imgUrl, m, editable){
  const wrap = document.getElementById(containerId);
  if(!wrap) return;
  modesPlanParZone[containerId] = modesPlanParZone[containerId] || 'semi';
  wrap.innerHTML = `<div class="plan-zone" id="${containerId}Zone"><img src="${imgUrl}" alt="Plan de salle" draggable="false"></div>`;
  const zone = document.getElementById(containerId + 'Zone');
  const img = zone.querySelector('img');
  let positions = m.semis_positions || [];

  async function sauvegarder(){
    await CurieuxDB.enregistrerPositionsSemis(TOKEN, m.date_id, positions);
  }
  function placerPin(pos){
    const pin = document.createElement('div');
    pin.className = 'pin' + (pos.type === 'note' ? ' note' : '');
    pin.style.left = pos.xPct + '%'; pin.style.top = pos.yPct + '%';
    pin.innerHTML = `<span class="pin-tete">${escapeHtml(pos.label || (pos.type==='note'?'Note':'Semi'))}</span><span class="pin-pointe"></span>`;
    if(editable){
      let dragging = false;
      pin.addEventListener('pointerdown', (e)=>{ dragging = true; pin.classList.add('dragging'); pin.setPointerCapture(e.pointerId); });
      pin.addEventListener('pointermove', (e)=>{
        if(!dragging) return;
        const rect = zone.getBoundingClientRect();
        pos.xPct = Math.min(100, Math.max(0, ((e.clientX - rect.left) / rect.width) * 100));
        pos.yPct = Math.min(100, Math.max(0, ((e.clientY - rect.top) / rect.height) * 100));
        pin.style.left = pos.xPct + '%'; pin.style.top = pos.yPct + '%';
      });
      pin.addEventListener('pointerup', ()=>{ dragging = false; pin.classList.remove('dragging'); sauvegarder(); });
      pin.addEventListener('dblclick', (e)=>{ e.stopPropagation(); positions = positions.filter(p=>p!==pos); pin.remove(); sauvegarder(); });
    }
    zone.appendChild(pin);
  }
  positions.forEach(placerPin);
  if(editable){
    img.style.cursor = 'crosshair';
    document.querySelectorAll(`[data-plan="${containerId}"]`).forEach(btn=> btn.addEventListener('click', ()=>{
      modesPlanParZone[containerId] = btn.dataset.mode;
    }));
    img.addEventListener('click', (e)=>{
      const rect = zone.getBoundingClientRect();
      const xPct = ((e.clientX - rect.left) / rect.width) * 100;
      const yPct = ((e.clientY - rect.top) / rect.height) * 100;
      let pos;
      if(modesPlanParZone[containerId] === 'note'){
        const texte = prompt('Note à afficher sur le plan :', '');
        if(!texte) return;
        pos = { type:'note', label: texte, xPct, yPct };
      } else {
        const label = prompt('Nom de la semi :', 'Semi') || 'Semi';
        pos = { type:'semi', vehiculeId:'', label, xPct, yPct };
      }
      positions.push(pos);
      placerPin(pos);
      sauvegarder();
    });
  }
}

const MVT_SENS = { sortie:['sortie','mvt_sortie'], entree:['entree','mvt_entree'], retour:['retour','mvt_retour'] };
function mouvementsDuJour(dateIso){
  if(!dateIso) return [];
  const evts = [];
  (RECAP.lots||[]).forEach(l=>{
    const nom = l.nom || 'Sans nom';
    (l.mouvements||[]).forEach(mv=>{
      if(mv.date !== dateIso) return;
      evts.push({ heure: mv.heure||'', sens: mv.type==='sortie' ? 'sortie' : 'entree', lot: nom, quoi: mv.description||'' });
    });
    if(l.retour_prestataire_date === dateIso){
      const pickup = l.retour_prestataire_heure || '';
      const livraison = l.retour_prestataire_heure_livraison || '';
      evts.push({
        heure: pickup || livraison, sens:'retour', lot: nom,
        quoi: [pickup ? 'pick up ' + pickup : '', livraison ? 'livraison ' + livraison : ''].filter(Boolean).join(' · '),
      });
    }
  });
  return evts.sort((a,b)=> (a.heure || '99:99').localeCompare(b.heure || '99:99'));
}
function blocMouvementsMateriel(d){
  const evts = mouvementsDuJour(d.date);
  if(evts.length === 0) return '';
  return `<div class="bloc" style="grid-column:1/-1;"><span class="titre">${t('bloc_mouvements')}</span>
    ${evts.map(e=>{
      const [classe, cle] = MVT_SENS[e.sens];
      return `<div class="mvt-jour">
        <span class="h${e.heure ? '' : ' vide'}">${e.heure ? escapeHtml(e.heure) : '—'}</span>
        <span class="sens ${classe}">${t(cle)}</span>
        <span class="lot">${escapeHtml(e.lot)}</span>
        ${e.quoi ? `<span class="quoi">${escapeHtml(e.quoi)}</span>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

// Un bureau d'étude est prévu sur place par défaut : la fiche ne signale donc
// que son absence, et détaille sinon qui joindre, à quelle heure, et où lire
// le dossier.
function blocBureauEtude(titre, surPlace, nom, tel, horaire, dossierUrl){
  return `<div class="bloc"><span class="titre">${titre}</span>
    ${surPlace === false ? champ(t('champ_sur_place'), t('non')) : `
      ${champ(t('champ_nom'), nom)}
      ${champ(t('champ_tel'), tel)}
      ${champ(t('champ_horaire'), horaire)}
      ${dossierUrl ? `<div class="champ"><span class="k">${t('champ_dossier')}</span><span class="v"><a href="${escapeHtml(dossierUrl)}" target="_blank" rel="noopener">${t('ouvrir')}</a></span></div>` : ''}
    `}
  </div>`;
}

// ----------------------------------------------------------------------------
// Exigences de la tournée — identiques d'une date à l'autre, mais répétées sur
// chaque fiche : chaque date est sa propre page et son propre PDF, et la salle
// ne voit que la sienne. Les renvoyer ailleurs, c'est les rendre introuvables.
// ----------------------------------------------------------------------------
function exigencesTournee(){
  const brut = (RECAP.tournee && RECAP.tournee.techniqueTournee) || {};
  return {
    pointsJus: Array.isArray(brut.pointsJus) ? brut.pointsJus : [],
    accesScene: Array.isArray(brut.accesScene) ? brut.accesScene : [],
    multis: brut.multis && typeof brut.multis === 'object' ? brut.multis : {},
  };
}
// Un tableau légendé plutôt qu'un couple clé/valeur : « 400 · P17 · 300 » ne
// dit pas à une salle laquelle des trois valeurs est la puissance, laquelle la
// prise, laquelle le différentiel. L'en-tête de colonne fait tout le travail.
function blocTableauPartage(titre, colonnes, lignes, note){
  const utiles = (lignes || []).filter(l=> l && l.some(v=> v != null && v !== ''));
  if(!utiles.length) return '';
  return `<div class="bloc bloc-large"><span class="titre">${escapeHtml(titre)}</span>
    <div class="tableau" style="--cols:${colonnes.length};">
      ${colonnes.map(c=> `<span class="th">${escapeHtml(c)}</span>`).join('')}
      ${utiles.map(l=> colonnes.map((_, i)=>
        `<span class="td${i === 0 ? ' repere' : ''}">${l[i] ? escapeHtml(String(l[i])) : '<span class="vide-champ">—</span>'}</span>`).join('')).join('')}
    </div>
    ${note ? `<p class="tableau-note">${escapeHtml(note)}</p>` : ''}
  </div>`;
}

function blocPointsJus(){
  return blocTableauPartage(t('bloc_points_jus'),
    [t('col_position'), t('col_puissance'), t('col_prise'), t('col_diff')],
    exigencesTournee().pointsJus.map((p, i)=>
      [p.position || `${t('champ_point')} ${i + 1}`, p.puissance, p.typePrise, p.differentiel]),
    t('note_jus'));
}
function blocAccesScene(){
  const liste = exigencesTournee().accesScene;
  return blocTableauPartage(`${t('bloc_acces_scene')} (${liste.length})`,
    [t('col_position'), t('champ_precisions')],
    liste.map((a, i)=> [a.position || `${t('champ_acces')} ${i + 1}`, a.notes]));
}
function blocMultis(){
  const s = exigencesTournee().multis;
  if(s.nombre == null && !s.depart && !s.notes) return '';
  return `<div class="bloc"><span class="titre">${t('bloc_multis')}</span>
    ${champ(t('champ_nombre'), s.nombre)}
    ${champ(t('champ_depart'), s.depart)}
    ${s.notes ? champ(t('champ_precisions'), s.notes) : ''}
  </div>`;
}
function blocDistribution(m){
  return blocTableauPartage(t('bloc_distribution'),
    [t('col_position'), t('champ_precisions')],
    (m.points_distribution || []).map((p, i)=> [p.position || `${t('champ_point')} ${i + 1}`, p.notes]),
    t('note_distrib'));
}

function ficheDateComplete(d, m, editableSalle, editableStageManager, serie){
  if(!m) m = { date_id: d.id };
  // Plusieurs soirs au même endroit : on les nomme tous en tête, et le « quand »
  // devient la série. Sans cela, la salle croirait qu'on lui parle d'un seul
  // soir et se demanderait où sont passés les autres.
  const plusieurs = serie && serie.dates.length > 1;
  const jour = plusieurs
    ? serie.dates.filter(x=> x.date).map(x=> jourCourt(x.date)).join(' · ')
    : jourLong(d.date);
  return `
    <div class="fiche-date">
      <div class="fiche-date-head">
        <h2>${escapeHtml(d.ville || d.lieu || 'Date')}${d.lieu && d.ville ? ` — ${escapeHtml(d.lieu)}` : ''}</h2>
        <span class="quand">${escapeHtml(jour)}${plusieurs ? ` · ${serie.dates.length} ${t('dates_suffixe')(serie.dates.length)}` : ''}</span>
      </div>
      <div class="fiche-date-body">
        <div class="fiche-grille">
          <div class="bloc"><span class="titre">${t('bloc_acces')}</span>
            ${champ(t('champ_semis_simultanes'), m.nombre_semis_simultanees)}
            ${/* Emplacement et niveau se règlent par semi : une semi peut
                 décharger de plain-pied côté cour pendant qu'une autre monte
                 sur scène. Une ligne par semi, donc, et non deux résumés. */''}
            ${(m.emplacements_dechargement||[]).map((e,i)=> champ(
              `${t('champ_semi')} ${i+1}`,
              [
                t(EMPLACEMENT_LABEL[e.emplacement]) || e.emplacement,
                e.niveau && e.niveau !== 'inconnu' ? t(NIVEAU_LABEL[e.niveau]) : '',
              ].filter(Boolean).join(' · ')
            )).join('')}
          </div>
          <div class="bloc"><span class="titre">${t('bloc_faits_techniques')}</span>
            ${champ(t('champ_hauteur_grill'), m.hauteur_grill)}
            ${champ(t('champ_ouverture_scene'), m.ouverture_scene)}
            ${champ(t('champ_puissance'), m.puissance)}
          </div>
          ${blocPointsJus()}
          ${blocDistribution(m)}
          ${blocAccesScene()}
          ${blocMultis()}
          ${blocBureauEtude(t('bloc_bureau_elec'), m.bureau_electrique_sur_place, m.bureau_electrique_nom, m.bureau_electrique_tel, m.bureau_electrique_horaire, m.bureau_electrique_dossier_url)}
          ${blocBureauEtude(t('bloc_bureau_accroche'), m.bureau_accroche_sur_place, m.bureau_accroche_nom, m.bureau_accroche_tel, m.bureau_accroche_horaire, m.bureau_accroche_dossier_url)}
          ${(m.contacts_salle||[]).length ? `<div class="bloc"><span class="titre">${t('bloc_contacts_salle')}</span>
            ${m.contacts_salle.map(c=>champ(c.role || t('champ_contact'), [c.nom, c.tel].filter(Boolean).join(' · '))).join('')}
          </div>` : ''}
          ${m.plan_url ? `<div class="bloc"><span class="titre">${t('bloc_documents')}</span>
            <div class="champ"><span class="k">${t('champ_plan_scene')}</span><span class="v"><a href="${escapeHtml(m.plan_url)}" target="_blank" rel="noopener">${t('ouvrir')}</a></span></div>
          </div>` : ''}
          ${blocHorairesJournee(m, editableStageManager)}
          ${RECAP.type === 'salle' ? '' : blocMouvementsMateriel(d)}
          ${blocVacationsRoadies(m, editableSalle)}
          ${blocVacationsChariots(m, editableSalle)}
          ${blocVacationsRigg(m, editableSalle)}
          ${blocRemarques(d)}
        </div>
        ${/* Le plan de salle est un outil de placement des semis, à l'usage du
              stage manager. Une salle n'a rien à y faire : elle connaît son
              plateau, et notre disposition de camions ne la regarde pas. */''}
        ${editableStageManager ? blocPlanSalle(m, true)
          : (RECAP.type !== 'salle' && m.plan_image_path ? blocPlanSalle(m, false) : '')}
        ${m.acces_notes ? `<p style="font-size:13px; color:var(--muted); margin:0;">${escapeHtml(m.acces_notes)}</p>` : ''}
      </div>
    </div>
  `;
}

const LANGUES = { fr:'FR', en:'EN', de:'DE', es:'ES', nl:'NL' };
function switcherLangue(){
  return `<div style="display:flex; gap:6px; margin:-6px 0 16px;">
    ${Object.entries(LANGUES).map(([code,label])=>`<button type="button" data-lang="${code}" style="padding:5px 11px; font-size:12px; ${LANG===code?'background:var(--accent-solid); color:#fff;':'background:var(--card); color:var(--muted); border:1px solid var(--border);'}">${label}</button>`).join('')}
  </div>`;
}

async function init(){
  TOKEN = new URLSearchParams(location.search).get('jeton');
  const box = document.getElementById('content');
  if(!TOKEN){ box.innerHTML = `<div class="state-box">${t('lien_incomplet')}</div>`; return; }
  LANG = localStorage.getItem('curieux_lang_' + TOKEN) || 'fr';

  RECAP = await CurieuxDB.getRecapLogistique(TOKEN);
  remarquesEnvoyees = await CurieuxDB.getRemarquesParJeton(TOKEN);
  if(!RECAP || !RECAP.tournee){ box.innerHTML = `<div class="state-box">${t('lien_inactif')}</div>`; return; }

  renderContenu();
}

function renderContenu(){
  const box = document.getElementById('content');
  const today = new Date().toISOString().slice(0,10);
  let dates = (RECAP.tournee.dates || []).filter(d=> !d.date || d.date >= today);
  if(RECAP.type === 'salle' && (RECAP.datesIds||[]).length){
    dates = dates.filter(d=> RECAP.datesIds.includes(d.id));
  }
  dates.sort((a,b)=> (a.date||'').localeCompare(b.date||''));

  const moyensParDate = {};
  (RECAP.moyens||[]).forEach(m=> moyensParDate[m.date_id] = m);

  // Une salle qui nous accueille quatre soirs de suite ne doit pas répondre
  // quatre fois au même questionnaire : les dates qui se suivent au même
  // endroit forment une seule fiche, celle du montage.
  const groupes = groupesFicheTechnique(dates, (id)=> !!moyensParDate[id]);

  let html = `<div class="entete">
    <h1 style="font-size:21px; margin:0 0 4px; font-weight:900;">${escapeHtml(RECAP.tournee.nom || 'Tournée')}</h1>
    <p class="qui">${escapeHtml(RECAP.libelle || 'Accès')} — ${dates.length} ${t('dates_suffixe')(dates.length)}.</p>
  </div>`;
  if(RECAP.type === 'salle') html += switcherLangue();

  const editableSalle = RECAP.type === 'salle';
  const editableSM = RECAP.type === 'stage_manager';

  // Une date à la fois, choisie dans le sommaire : sur une tournée longue,
  // atteindre la dernière ne demande plus de traverser toutes les autres.
  if(groupes.length && !groupes.some(g=> g.id === dateActive)) dateActive = groupes[0].id;
  document.body.classList.toggle('avec-sommaire', groupes.length > 1);

  if(groupes.length === 0){
    html += `<div class="state-box">${t('aucune_date')}</div>`;
  } else {
    const g = groupes.find(x=> x.id === dateActive) || groupes[0];
    const d = g.reference;
    const fiche = ficheDateComplete(d, moyensParDate[d.id], editableSalle, editableSM, g)
      + (editableSM ? `<div style="margin-bottom:16px;"><button type="button" data-pdf="${escapeAttr(d.id)}">Export PDF — ${escapeHtml(d.ville||d.lieu||'Date')}</button></div>` : '');
    html += groupes.length > 1
      ? `<div class="mise-en-page">${sommaireDates(groupes)}<div>${fiche}</div></div>`
      : fiche;
  }

  if((RECAP.fichesTechniques||[]).length){
    html += `<div class="section-registre"><h2>${t('fiche_technique_title')}</h2>
      ${RECAP.fichesTechniques.map(f=> f.drive_url ? `
        <div class="registre-item">
          <div class="nom">${escapeHtml(f.nom||'Fiche technique')}</div>
          <div class="sub"><a href="${escapeHtml(f.drive_url)}" target="_blank" rel="noopener">${t('ouvrir')}</a>${f.version_actuelle ? ' · ' + escapeHtml(f.version_actuelle) : ''}</div>
        </div>` : '').join('')}
    </div>`;
  }

  if(RECAP.type === 'stage_manager'){
    if((RECAP.lots||[]).length){
      html += `<div class="section-registre"><h2>Matériel apporté</h2>
        ${RECAP.lots.filter(l=>!l.parent_id).map(l=>{
          // Le détail des mouvements se lit désormais sur la journée concernée,
          // dans le bloc « Mouvements de matériel » : ici, juste le renvoi.
          const nb = (l.mouvements||[]).filter(mv=>mv.date).length;
          const sub = [
            l.description || '',
            nb ? `${nb} mouvement${nb>1?'s':''} — voir la journée concernée` : '',
          ].filter(Boolean).map(escapeHtml).join(' · ');
          return `
          <div class="registre-item"><div class="nom">${escapeHtml(l.nom||'Sans nom')}</div>
          ${sub ? `<div class="sub">${sub}</div>` : ''}</div>
        `;}).join('')}
      </div>`;
    }
    if((RECAP.vehicules||[]).length || (RECAP.chauffeurs||[]).length){
      html += `<div class="section-registre"><h2>Véhicules &amp; chauffeurs</h2>
        ${RECAP.vehicules.map(v=>`<div class="registre-item"><div class="nom">${escapeHtml(v.nom||'Sans nom')}${v.type==='semi'?(v.hayon?' · avec hayon':' · sans hayon'):''}</div></div>`).join('')}
        ${RECAP.chauffeurs.map(c=>`<div class="registre-item"><div class="nom">${escapeHtml([c.prenom,c.nom].filter(Boolean).join(' ')||'Sans nom')}</div><div class="sub">${[c.telephone,c.email].filter(Boolean).map(escapeHtml).join(' · ')}</div></div>`).join('')}
      </div>`;
    }
  }

  document.getElementById('content').innerHTML = html;
  // Le sommaire défile lui aussi quand la tournée est longue : après rendu, on
  // ramène la date choisie dans son champ de vision, sans bouger la page.
  const actif = document.querySelector('.sommaire-date[aria-current="true"]');
  if(actif) actif.scrollIntoView({ block:'nearest', inline:'nearest' });
}

document.addEventListener('click', (e)=>{
  const langBtn = e.target.closest('[data-lang]');
  if(langBtn){
    LANG = langBtn.dataset.lang;
    localStorage.setItem('curieux_lang_' + TOKEN, LANG);
    renderContenu();
    return;
  }
  const allerBtn = e.target.closest('[data-aller]');
  if(allerBtn){
    dateActive = allerBtn.dataset.aller;
    renderContenu();
    // Sur téléphone, le sommaire est au-dessus de la fiche : sans ce retour en
    // haut, on change de date et on reste au milieu de la précédente.
    if(matchMedia('(max-width:860px)').matches) document.querySelector('.mise-en-page').scrollIntoView({ block:'start' });
    return;
  }
  const depotBtn = e.target.closest('[data-deposer-plan]');
  if(depotBtn){ choisirEtDeposerPlan(depotBtn.dataset.deposerPlan); return; }

  const pdfBtn = e.target.closest('[data-pdf]');
  if(pdfBtn){ exporterJourneePdf(pdfBtn.dataset.pdf); }
});

// ============================================================================
// Export PDF (stage manager) — horaires, véhicules/chauffeurs du jour et
// mouvements de matériel du jour, à transmettre au responsable des chauffeurs.
// ============================================================================
function chauffeurDuJour(vehiculeId, dateId){
  const exception = (RECAP.affectationsTransport||[]).find(a=> a.vehicule_id === vehiculeId && a.date_id === dateId && a.chauffeur_id);
  const vehicule = RECAP.vehicules.find(v=>v.id===vehiculeId);
  const chauffeurId = exception ? exception.chauffeur_id : (vehicule && vehicule.chauffeur_defaut_id);
  return RECAP.chauffeurs.find(c=>c.id===chauffeurId) || null;
}
// Couleur de pastille selon le sens du mouvement — le même code qu'à l'écran.
const MVT_COULEUR = {
  sortie: { fond: PDF_CHARTE.orange, encre: PDF_CHARTE.pruneEncre },
  entree: { fond: PDF_CHARTE.bleu,   encre: PDF_CHARTE.bleuEncre },
  retour: { fond: PDF_CHARTE.prune,  encre: PDF_CHARTE.pruneEncre },
};

// Une vacation, mise en carte comme à l'écran : le créneau, la demande, et les
// équipes en pastilles de leur couleur.
function carteVacation(v, libelleDemande, complement){
  const registre = (RECAP.tournee && RECAP.tournee.equipesRoad) || [];
  return {
    titre: `${v.horaireDebut || '?'} – ${v.horaireFin || '?'}`,
    etat: v.confirme ? t('confirmee') : '',
    sous: [libelleDemande, complement, v.notes].filter(Boolean).join(' — '),
    puces: (v.equipes || []).filter(e=> e.nombre > 0).map(e=>{
      const def = registre.find(r=> r.id === e.equipeId);
      return { texte: `${(def && def.label) || 'Équipe'} · ${e.nombre}`,
               fond: PDF_CHARTE.bleu, encre: PDF_CHARTE.bleuEncre };
    }),
  };
}

// L'export d'une journée : la même composition qu'à l'écran, sur une feuille.
// C'est le document qu'on tend au responsable des chauffeurs ou qu'on punaise
// en régie — d'où la contrainte de la page unique, tenue par le composeur.
function exporterJourneePdf(dateId){
  if(!window.jspdf){ alert("La librairie PDF n'a pas pu être chargée."); return; }
  const d = RECAP.tournee.dates.find(x=>x.id===dateId);
  const m = (RECAP.moyens||[]).find(x=>x.date_id===dateId) || {};
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });
  registerHostFont(doc);

  const lieu = [d.ville, d.lieu].filter(Boolean).join(' — ') || 'Date';
  const page = creerComposeurPdf(doc).entete({
    titre: lieu,
    sousTitre: [RECAP.tournee.nom, jourLong(d.date)].filter(Boolean).join(' · '),
    mention: RECAP.libelle || '',
  });

  const champ = (cle, val)=> (val === null || val === undefined || val === '') ? null : [cle, String(val)];
  const bloc = (titre, lignes)=> ({ titre, lignes: lignes.filter(Boolean) });

  const bureau = (surPlace, nom, tel, horaire)=> surPlace === false
    ? [champ(t('champ_sur_place'), t('non'))]
    : [champ(t('champ_nom'), nom), champ(t('champ_tel'), tel), champ(t('champ_horaire'), horaire)];

  page.grille([
    bloc(t('bloc_acces'), [
      champ(t('champ_semis_simultanes'), m.nombre_semis_simultanees),
      ...(m.emplacements_dechargement || []).map((e, i)=> champ(`${t('champ_semi')} ${i + 1}`, [
        t(EMPLACEMENT_LABEL[e.emplacement]) || e.emplacement,
        e.niveau && e.niveau !== 'inconnu' ? t(NIVEAU_LABEL[e.niveau]) : '',
      ].filter(Boolean).join(' · '))),
    ]),
    bloc(t('bloc_faits_techniques'), [
      champ(t('champ_hauteur_grill'), m.hauteur_grill),
      champ(t('champ_ouverture_scene'), m.ouverture_scene),
      champ(t('champ_puissance'), m.puissance),
    ]),
    bloc(t('bloc_bureau_elec'), bureau(m.bureau_electrique_sur_place, m.bureau_electrique_nom, m.bureau_electrique_tel, m.bureau_electrique_horaire)),
    bloc(t('bloc_bureau_accroche'), bureau(m.bureau_accroche_sur_place, m.bureau_accroche_nom, m.bureau_accroche_tel, m.bureau_accroche_horaire)),
    bloc(t('bloc_contacts_salle'), (m.contacts_salle || []).map(c=>
      champ(c.role || t('champ_contact'), [c.nom, c.tel].filter(Boolean).join(' · ')))),
    bloc('Véhicules & chauffeurs', (RECAP.vehicules || []).map(v=>{
      const c = chauffeurDuJour(v.id, dateId);
      return champ(v.nom || 'Sans nom', c ? [[c.prenom, c.nom].filter(Boolean).join(' '), c.telephone].filter(Boolean).join(' · ') : '—');
    })),
  ]);

  // Les exigences de la tournée voyagent avec la feuille — un plateau se prépare
  // sur le papier punaisé en régie, pas sur l'onglet resté ouvert — et en
  // tableaux légendés, pour la même raison qu'à l'écran.
  const exi = exigencesTournee();
  page.tableau(t('bloc_points_jus'),
    [{ titre:t('col_position'), largeur:1.3 }, { titre:t('col_puissance') }, { titre:t('col_prise'), largeur:1.2 }, { titre:t('col_diff') }],
    exi.pointsJus.map((p, i)=> [p.position || `${t('champ_point')} ${i + 1}`, p.puissance, p.typePrise, p.differentiel]),
    t('note_jus'));
  page.tableau(t('bloc_distribution'),
    [{ titre:t('col_position'), largeur:1.3 }, { titre:t('champ_precisions'), largeur:2 }],
    (m.points_distribution || []).map((p, i)=> [p.position || `${t('champ_point')} ${i + 1}`, p.notes]),
    t('note_distrib'));
  page.tableau(t('bloc_acces_scene'),
    [{ titre:t('col_position'), largeur:1.3 }, { titre:t('champ_precisions'), largeur:2 }],
    exi.accesScene.map((a, i)=> [a.position || `${t('champ_acces')} ${i + 1}`, a.notes]));
  page.tableau(t('bloc_multis'),
    [{ titre:t('champ_nombre') }, { titre:t('champ_depart'), largeur:1.4 }, { titre:t('champ_precisions'), largeur:2 }],
    (exi.multis.nombre != null || exi.multis.depart || exi.multis.notes)
      ? [[exi.multis.nombre != null ? String(exi.multis.nombre) : '', exi.multis.depart, exi.multis.notes]] : []);

  page.pastilles(t('bloc_horaires'),
    (m.horaires_journee || []).slice()
      .sort((a, b)=> (a.heure || '').localeCompare(b.heure || ''))
      .map(h=> [h.heure || '—', h.label].filter(Boolean).join(' — ')));

  // Même source que le bloc affiché à l'écran, retour prestataire compris :
  // l'export dit exactement ce que la page dit.
  page.cartes(t('bloc_mouvements'), mouvementsDuJour(d.date).map(e=>{
    const couleur = MVT_COULEUR[e.sens] || MVT_COULEUR.sortie;
    return {
      // Sans heure, pas de tiret cabalistique : le nom du lot suffit.
      titre: [e.heure, e.lot].filter(Boolean).join(' — '),
      sous: e.quoi || '',
      puces: [{ texte: t(MVT_SENS[e.sens][1]).toUpperCase(), fond: couleur.fond, encre: couleur.encre }],
    };
  }), { pucesEnTete: true });

  page.cartes(t('bloc_roadies'), (m.roadies_vacations || []).map(v=>
    carteVacation(v, `${t('demande_label')} : ${v.nombreDemande != null ? v.nombreDemande : '—'}`)));
  page.cartes(t('bloc_chariots'), (m.chariots_vacations || []).map(v=>
    carteVacation(v, `${t('chariots_demandes')} : ${v.nombreChariotsDemande != null ? v.nombreChariotsDemande : '—'}`,
      `${t('caristes_demandes')} : ${v.nombreCaristesDemande != null ? v.nombreCaristesDemande : '—'}`)));
  page.cartes(t('bloc_rigg'), (m.rigg_vacations || []).map(v=>
    carteVacation(v, `${t('demande_label')} : ${v.nombreDemande != null ? v.nombreDemande : '—'}`,
      [v.nombreSol ? `${v.nombreSol} × ${t('rigg_sol')}` : '', v.nombreGrill ? `${v.nombreGrill} × ${t('rigg_grill')}` : ''].filter(Boolean).join(', '))));

  page.paragraphe(m.acces_notes || '');

  const suffixe = (d.ville||d.lieu||'date').trim().replace(/[^a-z0-9]+/gi,'_');
  page.rendre(`Journee_${suffixe}.pdf`);
}

applyBrandLogo();
init();
</script>
</body>
</html>
