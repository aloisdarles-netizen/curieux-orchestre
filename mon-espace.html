<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Mon espace</title>
<!-- Page volontairement PUBLIQUE : c'est le lien personnel unique envoyé aux
     musicien·nes. Elle accepte le jeton permanent comme un ancien jeton de
     demande de dispo, pour que les liens déjà envoyés continuent de marcher. -->
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/db.js"></script>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<script src="assets/app-musicien.js"></script>
<script src="assets/mes-dates-vue.js"></script>
<script>try{ injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); injectBugReportWidget(); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* ==========================================================================
     Mon espace — page d'accueil du lien personnel des musicien·nes.

     Hors maquette, et sans nav.js : c'est une page publique ouverte par un lien
     unique, pas un écran de production. Le bandeau prune y proposerait six
     sections auxquelles la personne n'a pas accès.

     Le reste emprunte à base.css : .co-card pour les encarts, .co-card-btn pour
     les tuiles du menu, .co-btn pour les actions, .co-h1 pour le titre. Ces
     quatre-là existaient ici en double, redéfinis à la main.
     ========================================================================== */
  /* Une colonne unique, à la largeur d'un écran de téléphone même sur grand
     écran : depuis que les dates ont leur propre onglet, plus rien ici ne
     réclame de la largeur, et une pile de tuiles étirée sur 1 100 px se lit
     moins bien qu'une colonne. */
  .wrap{max-width:600px; margin:0 auto; padding:0 18px 34px;}
  .entete{padding:18px 0 16px;}
  .entete img.brand-logo-img{height:30px; margin-bottom:18px; display:block;}
  .sous{color:var(--muted); font-size:14px; margin:4px 0 0; line-height:1.5;}

  .etat-boite{
    padding:24px 22px; text-align:center; color:var(--muted); font-size:14.5px; line-height:1.6;
  }

  .menu{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
  /* La pile étant en flex, la marge du dernier menu ne fusionne plus avec
     celle du titre qui suit dans le bloc d'après : sans ceci, vingt-deux
     pixels de plus entre « Mon dossier » et « Sur mon téléphone ». */
  #contenu > .menu:last-child{margin-bottom:0;}
  a.tuile{display:flex; align-items:center; gap:14px;}
  a.tuile:active{transform:scale(.995);}
  .tuile-icone{
    flex:0 0 auto; width:42px; height:42px; border-radius:11px; display:grid; place-items:center;
    background:var(--accent-tint); color:var(--accent-dark);
  }
  .tuile-texte{flex:1; min-width:0;}
  .tuile-titre{display:block; font-weight:700; font-size:15px;}
  .tuile-sous{display:block; font-size:12.5px; color:var(--muted); margin-top:2px;}
  .tuile-fleche{flex:0 0 auto; color:var(--muted);}
  .pastille{
    display:inline-block; font-size:10.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; padding:2px 7px; border-radius:999px; margin-left:7px;
    background:var(--maybe-tint); color:var(--maybe); vertical-align:1px;
  }
  .pastille.faite{background:var(--ok-tint); color:var(--ok);}
  /* Des dates ajoutées depuis sa réponse : ni « à faire » (elle a déjà joué le
     jeu), ni « répondu » (il manque quelque chose). Sa propre couleur. */
  .pastille.neuf{background:var(--secondary); color:#fff;}

  .section-titre{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:800; margin:24px 0 9px;
  }
  .sans-date{font-size:12px; color:var(--muted); line-height:1.5; margin:-14px 0 22px;}
  .mesdates-quand{text-transform:none; letter-spacing:0; font-weight:600; color:var(--muted); margin-left:8px;}
  #mesDates{margin-bottom:26px;}

  /* ------------------------------------------------------------------------
     Les prochaines dates, en carte.

     Cette page portait la vue complète des dates — calendrier ou colonnes —
     dépliée en tête. Elle y prenait, sur téléphone, un écran et demi avant le
     dossier et les demandes de dispo, alors que c'est précisément pour
     RÉPONDRE à une demande qu'on arrive ici. On l'avait repliée sous un
     en-tête ; depuis que « Mes dates » est un onglet à part entière, elle n'a
     plus rien à faire sur l'accueil.

     Reste ce qu'on vient vraiment y chercher : les quatre prochaines dates, et
     un chemin d'un doigt vers le reste. La carte entière est le lien — une
     zone de 300 px de large se vise sans regarder.
     ------------------------------------------------------------------------ */
  .bloc-dates{
    display:block; text-decoration:none; color:inherit; margin-bottom:22px;
    -webkit-tap-highlight-color:transparent;
  }
  .bloc-dates:active{transform:scale(.995);}
  .bloc-dates-tete{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  .bloc-dates-tete .section-titre{margin:0;}
  .bloc-dates-nb{font-size:12px; font-weight:700; color:var(--accent-dark); white-space:nowrap;}
  .bloc-dates .mdv-apercu{margin-top:11px;}
  .bloc-dates-plus{
    display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:13px; padding-top:11px;
    border-top:1px solid var(--border); font-size:13px; font-weight:700; color:var(--accent-dark);
  }
  /* La date de fraîcheur passe à la ligne plutôt que d'écraser le lien : elle
     dit quand la page a été arrêtée, ce qui est utile mais jamais urgent. */
  .bloc-dates-quand{
    flex-basis:100%; font-size:11.5px; color:var(--muted); font-weight:600; margin-top:3px;
  }

  /* ------------------------------------------------------------------------
     L'état du dossier, en arrivant.

     Deux choses se découvraient bien trop tard : une fiche sociale incomplète
     au moment de faire un contrat, et une liste de remplaçant·es vide le jour
     où l'on cherche quelqu'un en urgence. Elles se disent donc dès l'accueil,
     à chaque visite — et tant qu'aucun·e remplaçant·e n'est nommé·e, c'est par
     là qu'on passe avant les disponibilités. Sur téléphone, c'est aussi ce
     qu'on voit en premier, avant les dates : le bloc Mes dates y passe
     derrière, replié (voir plus bas). Sur écran large, les dates gardent la
     tête et le dossier vient juste dessous — la place ne manque pas.
     ------------------------------------------------------------------------ */
  .dossier{
    border-radius:14px; padding:15px 17px; margin-bottom:20px;
    font-size:13.5px; line-height:1.55;
  }
  .dossier.ok{ background:var(--ok-tint); color:var(--ok); }
  .dossier.manque{ background:var(--card); border:1px solid var(--border); }
  .dossier-titre{ display:block; font-weight:800; font-size:14px; margin-bottom:8px; }
  .dossier.manque .dossier-titre{ color:var(--maybe); }
  .dossier-item{
    display:flex; align-items:flex-start; gap:9px; padding:7px 0;
    border-top:1px solid var(--border);
  }
  .dossier-item:first-of-type{ border-top:none; padding-top:2px; }
  .dossier-puce{ flex:0 0 auto; font-size:13px; line-height:1.5; }
  .dossier-puce.ko{ color:var(--maybe); }
  .dossier-puce.oui{ color:var(--ok); }
  .dossier-texte{ flex:1; min-width:0; color:var(--text); }
  .dossier-texte a{ color:var(--accent); font-weight:700; }
  .dossier-detail{ display:block; color:var(--muted); font-size:12.5px; margin-top:1px; }

  /* L'étape des remplaçant·es, quand la liste est vide : elle prend la place
     des tuiles de dispo plutôt que de s'ajouter au-dessus. Une porte, pas une
     alerte de plus. */
  .porte{
    background:var(--card); border:1px solid var(--accent); border-radius:14px;
    padding:19px 18px; margin-bottom:22px;
  }
  .porte-titre{ font-family:var(--font-display); font-size:17px; font-weight:500; margin:0 0 8px; }
  .porte p{ color:var(--muted); font-size:13.5px; line-height:1.6; margin:0 0 14px; }
  .porte-btn{
    display:block; width:100%; text-align:center; text-decoration:none;
    background:var(--accent-solid); color:#fff; border:none; border-radius:999px;
    font-size:15px; font-weight:700; padding:13px; font-family:inherit; cursor:pointer;
  }
  .porte-btn:hover{ background:var(--accent-dark); }
  .porte-plus-tard{
    display:block; width:100%; margin-top:10px; background:none; border:none;
    color:var(--muted); font-size:13px; font-family:inherit; cursor:pointer;
    text-decoration:underline; padding:6px;
  }
  .porte-plus-tard:hover{ color:var(--text); }

  /* Mode d'emploi d'installation (injecté par ui-helpers.js) */
  .app-install{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:16px 18px;
  }
  .app-install-titre{display:block; font-size:14.5px; color:var(--text); margin-bottom:5px;}
  .app-install-intro{color:var(--muted); font-size:13.5px; line-height:1.55; margin:0 0 12px;}
  .app-install-etapes{margin:0; padding-left:20px; color:var(--muted); font-size:13.5px; line-height:1.9;}
  .app-install-etapes b{color:var(--text);}
  .app-install-note{color:var(--muted); font-size:13.5px; line-height:1.55; margin:0;}
  .app-install-note b{color:var(--text);}
  .app-install-btn{
    width:100%; margin-top:12px; cursor:pointer; border:none; border-radius:999px;
    font-size:14px; font-weight:700; padding:11px; font-family:inherit;
    background:var(--accent-solid); color:#fff;
  }
  .app-install-btn:hover{background:var(--accent-dark);}
  .app-install-ok{
    background:var(--ok-tint); color:var(--ok); border-radius:14px;
    padding:14px 16px; font-size:13.5px;
  }

  /* Le mode d'emploi d'installation se replie. C'est une chose qu'on lit une
     fois, et qui occupait un tiers de l'accueil à chaque visite ensuite. */
  #installation details{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    overflow:hidden;
  }
  #installation summary{
    list-style:none; cursor:pointer; padding:13px 16px; font-size:13.5px; font-weight:700;
    display:flex; align-items:center; gap:9px; -webkit-tap-highlight-color:transparent;
  }
  #installation summary::-webkit-details-marker{display:none;}
  #installation summary::after{
    content:'▾'; margin-left:auto; color:var(--muted); font-size:12px; transition:transform .18s;
  }
  #installation details[open] summary::after{transform:rotate(180deg);}
  #installation details[open] summary{border-bottom:1px solid var(--border);}
  #installation .app-install{border:none; border-radius:0;}
  #installation .app-install-ok{border-radius:0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="entete">
    <img class="brand-logo-img" alt="Curieux orchestre">
    <h1 class="co-h1" id="titre">Mon espace</h1>
    <p class="sous" id="sousTitre">Chargement…</p>
  </div>

  <!-- L'ordre est le même sur toutes les largeurs : ce qui reste à faire, puis
       les prochaines dates, puis l'installation. Quand il n'y a plus rien à
       faire, le premier bloc tient en une ligne verte et les dates remontent
       d'elles-mêmes en tête — sans qu'aucune règle n'ait à les y pousser. -->
  <div id="contenu"></div>
  <div id="mesDates"></div>
  <div id="installation"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';

const FLECHE = `<svg class="tuile-fleche" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
  <polyline points="9,5 16,12 9,19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>`;

const ICONES = {
  dispos: `<svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"></rect><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path><polyline points="8.5,14 11,16.3 15.5,12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>`,
  infos: `<svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11" fill="none" stroke="currentColor" stroke-width="1.7"></path><circle cx="12" cy="15.6" r="1.35" fill="currentColor"></circle></svg>`,
  remplacants: `<svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5h11a4 4 0 0 1 4 4v1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path><polyline points="12,4.3 15.2,7.5 12,10.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></polyline><path d="M20 16.5H9a4 4 0 0 1-4-4v-1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path><polyline points="12,13.3 8.8,16.5 12,19.7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>`,
  // Un disque, pas un calendrier : quand une même personne a en attente une
  // demande de tournée et une demande de studio, les deux tuiles doivent se
  // distinguer avant même d'avoir lu le nom du projet.
  recording: `<svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="1.7"></circle><circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.7"></circle><circle cx="12" cy="12" r="1" fill="currentColor"></circle></svg>`,
  // Un calendrier dont une case est pleine : celle des dates tenues. La tuile
  // des dispos porte déjà un calendrier coché — celui-ci dit « ce qui est
  // acquis », l'autre « ce que tu dois remplir ».
  dates: `<svg width="21" height="21" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"></rect><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path><rect x="7" y="12.2" width="4.2" height="4.2" rx="1" fill="currentColor"></rect><rect x="13.2" y="12.2" width="4" height="4.2" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"></rect></svg>`,
};

function etat(html){
  document.getElementById('contenu').innerHTML = `<div class="co-card co-pad etat-boite">${html}</div>`;
}

/* Le report de l'étape « remplaçant·es ».
 *
 * On peut passer outre — mais pour cette visite seulement. La question revient
 * à la connexion suivante : c'est le seul moyen qu'elle finisse par être
 * traitée, sans jamais enfermer qui que ce soit hors de ses dispos. */
const REPORT_CLE = 'curieuxRemplaReporte';
function reportRemplacants(personId){
  try{ return sessionStorage.getItem(REPORT_CLE) === personId; }catch(e){ return false; }
}
function reporterRemplacants(personId){
  try{ sessionStorage.setItem(REPORT_CLE, personId); }catch(e){}
}

function tuile(href, icone, titre, sous, pastille){
  return `<a class="co-card-btn tuile" href="${href}">
    <span class="tuile-icone">${icone}</span>
    <span class="tuile-texte">
      <span class="tuile-titre">${escapeHtml(titre)}${pastille || ''}</span>
      <span class="tuile-sous">${escapeHtml(sous)}</span>
    </span>
    ${FLECHE}
  </a>`;
}

// Ce qu'il reste à dire sur une demande.
//
// « Répondu » a longtemps voulu dire « a validé une fois », si bien qu'une date
// ajoutée à la tournée après coup ne se voyait nulle part : l'espace annonçait
// « Tu as déjà répondu » et la date restait vide. La fonction SQL rend
// maintenant le compte réel des dates sans réponse ; tant que la migration
// n'est pas passée, on retombe sur l'ancien drapeau — la page ne dit alors
// rien de plus faux qu'avant.
function etatDemande(d){
  if(!Number.isFinite(d.nbManquantes)){
    return { connu: false, manquantes: d.repondu ? 0 : null, total: null, neuf: false };
  }
  return {
    connu: true,
    manquantes: d.nbManquantes,
    total: d.nbDates,
    // Répondu une fois, et il reste des dates : ce sont des dates arrivées
    // depuis. C'est le cas qu'il fallait rendre visible.
    neuf: !!d.repondu && d.nbManquantes > 0,
    prochaine: d.prochaineManquante || '',
  };
}
function resteAFaire(d){
  const e = etatDemande(d);
  return e.manquantes === null ? !d.repondu : e.manquantes > 0;
}
function jourCourt(iso){
  if(!iso) return '';
  const dt = new Date(iso + 'T00:00:00');
  if(isNaN(dt)) return '';
  return dt.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });
}

async function init(){
  if(!window.supabase){ etat("La page n'a pas pu se charger. Réessaie dans un instant."); return; }
  if(!TOKEN){
    document.getElementById('sousTitre').textContent = '';
    etat("Ce lien est incomplet. Reprends celui qu'on t'a envoyé, ou demande-nous de te le renvoyer.");
    return;
  }

  /* Deux lectures, une seule attente : l'identite et les demandes d'un cote,
     les dates de l'autre. Les enchainer aurait double le temps d'ouverture de
     la page pour rien — elles ne se doivent rien. */
  const [moi, mesDates] = await Promise.all([
    CurieuxDB.mesDemandesDispo(TOKEN),
    CurieuxDB.mesDates(TOKEN),
  ]);
  if(!moi){
    document.getElementById('sousTitre').textContent = '';
    etat("Ce lien n'est plus valide. Contacte la production pour en obtenir un nouveau.");
    return;
  }

  const prenom = (moi.prenom || '').trim();
  document.getElementById('titre').textContent = prenom ? `Bonjour ${prenom}` : 'Mon espace';
  document.getElementById('sousTitre').textContent = 'Ton espace personnel — reviens-y quand tu veux.';

  const jeton = encodeURIComponent(TOKEN);

  /* Les prochaines dates, en carte, et rien de plus.

     Cette page a longtemps porté la vue complète — calendrier ou colonnes —
     dépliée en tête. Elle repoussait le dossier et les demandes de dispo à un
     écran et demi sur téléphone, alors que c'est pour RÉPONDRE à une demande
     qu'on arrive ici. On l'avait repliée sous un en-tête cliquable ; depuis que
     « Mes dates » est un onglet de la barre du bas, la question ne se pose
     plus : quatre lignes suffisent ici, le reste est à un doigt.

     L'aperçu ne retient ni les dates annulées, ni celles à l'étude : rien
     n'y est réservé, et une carte qui annoncerait « ta prochaine date » sur
     une journée qu'on regarde à peine ferait bloquer un jour pour rien. Le
     compte peut donc tomber à zéro alors que la personne a des dates — la
     carte disparaît, l'onglet Mes dates les montre toutes. */
  if(mesDates && !mesDates.migrationAbsente && (mesDates.dates || []).length){
    const stamp = CurieuxMesDates.fraicheur(mesDates.genereLe);
    const resume = CurieuxMesDates.apercu(mesDates, 4);
    const reste = Math.max(0, resume.nb - 4);
    if(resume.nb) document.getElementById('mesDates').innerHTML =
      `<a class="co-card co-pad bloc-dates" href="mes-dates.html?token=${jeton}">
         <span class="bloc-dates-tete">
           <span class="section-titre">Mes prochaines dates</span>
           <span class="bloc-dates-nb">${resume.nb} à venir</span>
         </span>
         ${resume.html}
         <span class="bloc-dates-plus">
           ${reste > 1 ? `Voir les ${reste} autres`
             : reste === 1 ? 'Voir la dernière'
             : 'Voir le détail et le calendrier'}
           <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
           ${stamp ? `<span class="bloc-dates-quand">${escapeHtml(stamp)}</span>` : ''}
         </span>
       </a>`;
  }
  const demandes = moi.demandes || [];
  const enAttente = demandes.filter(resteAFaire);

  /* Une tournée dont il ne reste aucune date à renseigner n'a rien à faire dans
     la liste des demandes. Le cas arrive dès qu'un projet est annulé, ou
     simplement passé : la fonction SQL ne compte que les dates à venir et non
     annulées, si bien que la tuile annonçait « Tu as répondu à tout » sur un
     projet qui n'existe plus. On la retire, et on dit en une ligne combien de
     projets sont dans ce cas — les faire disparaître sans un mot laisserait
     croire qu'on a perdu leur réponse.

     La condition porte sur un nombre FINI : quand la migration n'est pas
     encore jouée, nbDates est absent, et il ne faut alors rien cacher. */
  const sansDate = demandes.filter(d=> Number.isFinite(d.nbDates) && d.nbDates === 0);
  const aRepondre = demandes.filter(d=> !sansDate.includes(d));

  // Disponibilités : une entrée par demande en cours, pour que le lien unique
  // couvre plusieurs tournées sans que la personne ait à jongler entre liens.
  let blocDispos = '';
  if(aRepondre.length === 0){
    blocDispos = `<div class="co-card co-pad etat-boite" style="text-align:left; padding:15px 17px;">
      Aucune demande de disponibilité en cours. Tu recevras un message quand un projet se prépare.
    </div>`;
  } else {
    blocDispos = aRepondre.map(d => {
      const e = etatDemande(d);
      const pluriel = e.manquantes > 1 ? 's' : '';
      let sous, pastille;
      if(e.manquantes === 0){
        sous = e.total === 0
          ? "Aucune date à venir sur ce projet"
          : 'Tu as répondu à tout — modifiable';
        pastille = '<span class="pastille faite">Répondu</span>';
      } else if(e.neuf){
        // On nomme la date : « 1 nouvelle date » sans dire laquelle oblige à
        // ouvrir pour savoir de quoi on parle.
        const quand = jourCourt(e.prochaine);
        sous = `${e.manquantes} date${pluriel} ajoutée${pluriel} depuis ta réponse`
          + (quand ? ` — à partir du ${quand}` : '');
        pastille = '<span class="pastille neuf">Nouvelles dates</span>';
      } else {
        sous = e.manquantes == null ? 'À compléter'
          : `${e.manquantes} date${pluriel} à remplir`;
        pastille = '<span class="pastille">À faire</span>';
      }
      return tuile(
        `dispo-titulaire.html?token=${encodeURIComponent(d.token)}`,
        d.tourneeType === 'recording' ? ICONES.recording : ICONES.dispos,
        d.tourneeNom || (d.tourneeType === 'recording' ? 'Recording' : 'Tournée'),
        sous, pastille
      );
    }).join('');
  }

  const estTitulaire = (moi.statutPoste || 'titulaire') === 'titulaire';

  // ---- L'état du dossier, dit en arrivant -----------------------------------
  const manquantes = infosRequisesManquantes(moi.infosRemplies);
  const nbRemplacants = Number(moi.nbRemplacants) || 0;
  const remplaAFaire = estTitulaire && nbRemplacants === 0;

  const lienInfos = `mes-infos.html?token=${jeton}`;
  const lienRempla = `mes-remplacants.html?token=${jeton}`;

  /* Ce que la coque a besoin de savoir pour peindre ses onglets — le prénom
     dans la barre, l'onglet des remplaçant·es, celui des partitions, les
     pastilles. C'est ici, et nulle part ailleurs, qu'on le sait : les autres
     écrans le liront dans l'état de session plutôt que de refaire la requête.

     `musicien` décide de l'onglet des partitions, et il est posé ICI plutôt
     qu'au retour de la requête des partitions : mes_demandes_dispo rend déjà
     le type de la personne, et il est déjà attendu. L'onglet est donc peint au
     premier rendu, sans apparaître après coup sous le pouce. */
  if(window.CurieuxAppMusicien) CurieuxAppMusicien.etat({
    prenom, titulaire: estTitulaire,
    musicien: (moi.personType || '') === 'musicien',
    disposAFaire: enAttente.length,
    infosIncompletes: manquantes.length > 0,
    remplaVides: remplaAFaire,
  });

  const ligneDossier = (fait, texte, detail)=> `
    <div class="dossier-item">
      <span class="dossier-puce ${fait ? 'oui' : 'ko'}" aria-hidden="true">${fait ? '✓' : '•'}</span>
      <span class="dossier-texte">${texte}${detail ? `<span class="dossier-detail">${detail}</span>` : ''}</span>
    </div>`;

  let blocDossier;
  if(!manquantes.length && !remplaAFaire){
    blocDossier = `<div class="dossier ok">✓ Ton dossier est complet${estTitulaire ? `, et tes remplaçant·es sont noté·es` : ''} — merci.</div>`;
  } else {
    blocDossier = `<div class="dossier manque">
      <span class="dossier-titre">Il reste ${manquantes.length && remplaAFaire ? 'deux choses' : 'quelque chose'} à faire</span>
      ${manquantes.length
        ? ligneDossier(false,
            `<a href="${lienInfos}">Compléter mes informations</a>`,
            `Il manque : ${manquantes.map(escapeHtml).join(', ')}.`)
        : ligneDossier(true, 'Tes informations sont complètes')}
      ${estTitulaire ? (remplaAFaire
        ? ligneDossier(false,
            `<a href="${lienRempla}">Choisir mes remplaçant·es</a>`,
            `Personne n'est encore noté·e.`)
        : ligneDossier(true, `Tes remplaçant·es sont noté·es`,
            `${nbRemplacants} personne${nbRemplacants > 1 ? 's' : ''}, par ordre de préférence.`)) : ''}
    </div>`;
  }

  // ---- Les dispos, derrière l'étape des remplaçant·es ------------------------
  //
  // Tant qu'aucun·e remplaçant·e n'est nommé·e, on passe par là. Ce n'est pas
  // une coquetterie : le jour où quelqu'un décline une date, c'est SA liste
  // qu'on appelle, dans SON ordre. Sans elle, la production choisit à sa place.
  // La sortie « je le ferai juste après » reste ouverte — la question revient
  // simplement à la prochaine connexion.
  //
  // « On passe par là » avait cessé d'être vrai sur téléphone : la porte
  // tombait à 1 200 px, sous six cents pixels de colonnes de dates. Elle est
  // de nouveau la première chose sous le dossier — le bloc Mes dates vient
  // après, replié.
  const barree = remplaAFaire && !reportRemplacants(moi.personId);
  const blocDisposOuPorte = !barree ? `
    <div class="section-titre">Mes disponibilités${enAttente.length ? ` — ${enAttente.length} à compléter` : ''}</div>
    <div class="menu">${blocDispos}</div>${sansDate.length ? `<p class="sans-date">${
      sansDate.length === 1
        ? `Un projet n'a plus aucune date à renseigner : ${escapeHtml(sansDate[0].tourneeNom || 'sans nom')}.`
        : `${sansDate.length} projets n'ont plus aucune date à renseigner.`
    } Tes réponses sont conservées.</p>` : ''}` : `
    <div class="section-titre">Avant tes disponibilités</div>
    <div class="porte">
      <h2 class="porte-titre">Qui te remplace ?</h2>
      <p>Quand tu n'es pas disponible sur une date, c'est <b>ta</b> liste qu'on appelle, dans <b>ton</b> ordre de préférence. Sans elle, on choisit à ta place.
        ${enAttente.length ? `Tu as ${enAttente.length} demande${enAttente.length > 1 ? 's' : ''} de dispo qui t'attend${enAttente.length > 1 ? 'ent' : ''} juste derrière.` : ''}</p>
      <a class="porte-btn" href="${lienRempla}">Choisir mes remplaçant·es</a>
      <button type="button" class="porte-plus-tard" id="plusTardBtn">Je le ferai juste après</button>
    </div>`;

  /* Il y avait ici une tuile « Mes dates » qui menait à la page dédiée. Elle
     faisait doublon depuis que les dates s'affichent sur cette page-ci : une
     tuile qui mène à ce qu'on vient de lire est une invitation à douter
     d'avoir bien lu. Sur téléphone, l'en-tête replié du bloc Mes dates joue
     ce rôle d'entrée — mais il s'ouvre sur place, avec ses trois prochaines
     dates déjà lisibles. La page dédiée existe toujours — c'est elle qu'on
     envoie par message — mais on n'y renvoie plus d'ici. */
  document.getElementById('contenu').innerHTML = `
    ${blocDossier}
    ${blocDisposOuPorte}

    <div class="section-titre">Mon dossier</div>
    <div class="menu">
      ${tuile(lienInfos, ICONES.infos, 'Mes informations', 'Identité, RIB, numéro de sécurité sociale…',
        manquantes.length ? '<span class="pastille">À compléter</span>' : '<span class="pastille faite">Complet</span>')}
      ${estTitulaire ? tuile(lienRempla, ICONES.remplacants, 'Mes remplaçant·es', 'Par ordre de préférence',
        nbRemplacants ? `<span class="pastille faite">${nbRemplacants}</span>` : '<span class="pastille">À faire</span>') : ''}
    </div>
  `;
  /* Le mode d'emploi d'installation, replié. C'est une chose qu'on lit une
     fois : le laisser ouvert lui donnait, à chaque visite ensuite, la place
     d'une section entière au bas de l'accueil. */
  document.getElementById('installation').innerHTML = `
    <details>
      <summary>Garder Curieux sur mon téléphone</summary>
      <div id="blocInstallation"></div>
    </details>
  `;

  const plusTard = document.getElementById('plusTardBtn');
  if(plusTard) plusTard.addEventListener('click', ()=>{
    reporterRemplacants(moi.personId);
    init();
  });

  injecterModeEmploiApp('blocInstallation', { nom: 'Mon espace' });

  /* La PASTILLE des partitions, comptée depuis l'accueil.
     -----------------------------------------------------------------------
     Rien ne s'en affiche sur cette page : les partitions ont leur écran
     (mes-partitions.html), et une tuile qui mène à ce qu'un onglet ouvre déjà
     est un doublon de plus. L'onglet, lui, est déjà décidé plus haut par le
     métier ; ce qu'on lit ici n'est que le nombre de parties qui restent à
     prendre, et la ceinture du cas où quelqu'un qui n'est pas musicien·ne
     aurait malgré tout du matériel affecté.

     Hors du Promise.all volontairement. Ajoutée aux deux lectures de tête,
     cette requête aurait retardé l'ouverture de l'accueil — la page la plus
     ouverte de l'espace — pour une pastille en bas de l'écran. Elle part
     après le rendu, et la barre se repeint quand elle revient. */
  CurieuxDB.mesPartitions(TOKEN).then(charge => {
    if(!charge || charge.migrationAbsente || !window.CurieuxAppMusicien) return;
    const compte = CurieuxMesDates.compterPartitions(charge);
    CurieuxAppMusicien.etat({
      partitions: compte.operations,
      partitionsNeuves: compte.neuves,
    });
  }).catch(()=>{});
}

init();
applyBrandLogo();
setInterval(applyAutoTheme, 5 * 60 * 1000);
</script>
</body>
</html>
