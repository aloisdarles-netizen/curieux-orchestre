<title>Curieux orchestre — Mes dates</title>

     ici, contrairement aux pages de production — ce lien est envoyé à des musicien·nes et
     des technicien·nes qui n'ont pas de compte. L'identification se fait par le token
     imprévisible dans l'URL, pas par un compte. -->

<link rel="stylesheet" href="assets/base.css">
<style>
  .wrap{max-width:1100px; margin:0 auto; padding-bottom:40px;}
  .entete{margin-bottom:12px;}
  .sous{color:var(--muted); font-size:13.5px; margin:4px 0 0;}
  .etat-boite{text-align:center; color:var(--muted); font-size:13.5px; line-height:1.6;}

  /* La fraîcheur de la page, dite une fois. Une page qui ne dit pas de quand
     elle date n'est pas une source : on la lit, on doute, et on redemande par
     message — c'est-à-dire qu'on retombe dans ce que cette page remplace. */
  .fraicheur{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);
    background:var(--bg); border:1px solid var(--border); border-radius:999px;
    padding:4px 11px; margin-top:8px;
  }
  .fraicheur::before{content:''; width:6px; height:6px; border-radius:50%; background:var(--ok);}

  .barre{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:16px 0 4px;}
  .bascule{display:inline-flex; gap:3px; background:var(--bg); border:1px solid var(--border);
    border-radius:999px; padding:3px;}
  .bascule button{
    border:none; background:none; color:var(--muted); font:inherit; font-size:12.5px; font-weight:700;
    padding:6px 15px; border-radius:999px; cursor:pointer;
  }
  .bascule button.on{background:var(--accent); color:#fff;}

  /* -----------------------------------------------------------------------
     Les trois colonnes.
     -----------------------------------------------------------------------
     Les statuts sont exclusifs : une date est validée OU en option OU en
     recherche. Côte à côte, on les compare d'un coup d'œil au lieu de faire
     défiler une liste où il faut retenir où finit un groupe et où commence le
     suivant. Sur téléphone, la même structure glisse latéralement, une colonne
     à la fois — avec des flèches et des points, parce qu'un glissement qu'on
     ne devine pas n'existe pas. */
  .colonnes{
    display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:12px;
    margin-top:10px;
    /* Chaque colonne à sa propre hauteur : étirées à la plus haute, celle qui
       ne porte qu'une date affichait quinze centimètres de blanc. */
    align-items:start;
  }
  /* Un panneau large occupe la largeur qu'il mérite — voir empan() — et son
     contenu y coule en autant de colonnes que la place en tient. C'est
     column-width qui décide, pas un nombre écrit à la main : le même panneau
     rend une colonne à 300 px et quatre à 1100 px, sans que rien ne le sache. */
  .col-corps{column-width:230px; column-gap:18px;}
  .col-corps .mois{break-after:avoid;}
  .col-corps .ligne{break-inside:avoid;}
  .colonne.empan-2{grid-column:span 2;}
  .colonne.empan-3{grid-column:span 3;}

  /* Les statuts sans aucune date ne prennent pas un tiers de la page pour
     annoncer qu'ils sont vides : une ligne grise sous les panneaux suffit. */
  .rien{font-size:12.5px; color:var(--muted); margin:10px 2px 0; line-height:1.5;}

  /* Ce qui dépasse du cadre doit se voir. Un panneau trop haut est plafonné,
     son bas s'estompe — le dégradé dit qu'on a coupé, ce qu'une coupe nette ne
     dit pas — et un bouton ouvre le reste. On ne met PAS de défilement dans le
     défilement : une barre imbriquée cache le contenu au lieu de l'annoncer,
     et sur un téléphone elle se déclenche à la place de la page. */
  .col-corps.tronque{overflow:hidden; position:relative;}
  .col-corps.tronque::after{
    content:''; position:absolute; left:0; right:0; bottom:0; height:64px; pointer-events:none;
    background:linear-gradient(to bottom, transparent, var(--card));
  }
  .voir-suite{
    display:block; width:calc(100% - 20px); margin:0 10px 10px;
    border:1px solid var(--border); background:var(--bg); color:var(--accent-dark);
    font:inherit; font-size:12.5px; font-weight:700; border-radius:999px; padding:7px 12px; cursor:pointer;
  }
  .voir-suite:hover{border-color:var(--accent); color:var(--accent);}
  .colonne{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:0 0 10px; min-width:0; display:flex; flex-direction:column;
  }
  /* L'en-tête reste au-dessus pendant qu'on descend la colonne : le mot
     « OPTION » doit être sous les yeux à la vingtième ligne comme à la
     première. C'est tout l'objet de la page. */
  .col-tete{
    position:sticky; top:0; z-index:2; border-radius:var(--radius) var(--radius) 0 0;
    padding:10px 13px 9px; border-bottom:1px solid var(--border); background:var(--card);
  }
  .col-mot{
    display:inline-block; font-size:10.5px; font-weight:800; text-transform:uppercase;
    letter-spacing:.07em; padding:4px 10px; border-radius:999px;
  }
  .col-validee .col-mot{background:var(--ok); color:var(--sur-statut);}
  .col-option .col-mot{background:var(--maybe); color:var(--sur-statut);}
  .col-recherche .col-mot{background:var(--border); color:var(--muted);}
  .col-annulee .col-mot{background:var(--ko); color:var(--sur-statut);}
  .col-sans-toi .col-mot{background:var(--accent-tint); color:var(--accent-dark);}
  .col-nb{font-size:12px; font-weight:800; color:var(--muted); margin-left:7px;}
  .col-projet{font-size:12.5px; font-weight:700; color:var(--text); margin-left:9px;}
  .col-dit{display:block; font-size:12px; color:var(--muted); line-height:1.45; margin-top:6px;}
  .col-corps{padding:8px 10px 4px; min-width:0;}

  .mois{
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    color:var(--accent-dark); margin:10px 0 5px;
  }
  .col-corps .mois:first-child{margin-top:2px;}

  /* Une date = une ligne : le jour à gauche, toujours à la même place, ce qui
     permet de balayer une colonne au lieu de lire des paragraphes. La première
     version posait une carte de quatre lignes par date — juste sur une date,
     intenable sur vingt. */
  .ligne{
    display:flex; align-items:baseline; gap:9px;
    padding:6px 4px; border-bottom:1px solid var(--border);
  }
  .ligne:last-child{border-bottom:none;}
  .ligne.barree{opacity:.6;}
  .ligne.barree .l-jour, .ligne.barree .l-ou b{text-decoration:line-through;}
  .l-jour{flex:0 0 42px; font-weight:800; font-size:13.5px; font-variant-numeric:tabular-nums; line-height:1.2;}
  .l-jour small{display:block; font-weight:600; font-size:10px; color:var(--muted); text-transform:uppercase;}
  .l-ou{flex:1; min-width:0; font-size:12px; line-height:1.35;}
  .l-ou b{display:block; font-weight:700; font-size:12.5px; color:var(--text);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .l-ou span{color:var(--muted); display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .l-note{display:block; font-size:11px; font-weight:700; margin-top:2px;}
  .l-note.butoir{color:var(--maybe);}
  .l-note.manque{color:var(--accent-dark);}
  .l-note.indispo{color:var(--ko);}
  .l-note.moi{color:var(--ok);}

  /* Le glissement, sur téléphone seulement. scroll-snap tient la colonne
     alignée sur le bord ; les flèches et les points disent qu'il y a autre
     chose à côté, ce qu'un débordement muet ne dit jamais. */
  .nav-cols{display:none;}
  @media (max-width:760px){
    .colonnes{
      display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory;
      scrollbar-width:none; -webkit-overflow-scrolling:touch; padding-bottom:4px;
    }
    .colonnes::-webkit-scrollbar{display:none;}
    .colonne{flex:0 0 88%; scroll-snap-align:start;}
    /* Sur téléphone un panneau fait toute la largeur du volet : une seule
       colonne, quelle que soit la largeur que le bureau lui accordait. */
    .col-corps{column-width:auto; columns:1;}
    .nav-cols{
      display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px;
    }
    .nav-cols button{
      border:1px solid var(--border); background:var(--card); color:var(--accent-dark);
      width:34px; height:34px; border-radius:50%; font-size:16px; line-height:1; cursor:pointer;
    }
    .nav-cols button:disabled{opacity:.35;}
    .nav-points{display:flex; gap:6px;}
    .nav-points i{width:7px; height:7px; border-radius:50%; background:var(--border); display:block;}
    .nav-points i.on{background:var(--accent);}
  }

  .section-titre{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:800; margin:26px 0 8px;
  }

  /* Le calendrier : la seconde vue. La liste répond à « sur quoi puis-je
     compter ? », le calendrier à « suis-je pris le 14 ? » — deux questions, et
     aucune ne se répond bien dans la forme de l'autre. */
  .cal{display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:14px; margin-top:10px;}
  .cal-grille{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:3px;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:8px;
  }
  .cal-nom{font-size:10px; font-weight:800; color:var(--muted); text-align:center; padding-bottom:2px;}
  .cal-case{
    aspect-ratio:1; display:grid; place-items:center; border-radius:8px;
    font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .cal-case.vide{visibility:hidden;}
  /* La couleur dit le statut, le point sous le chiffre dit qu'on y joue. Deux
     informations, deux signes — les confondre ferait croire qu'une date
     validée est forcément la sienne. */
  .cal-case.pleine{font-weight:800; position:relative;}
  .cal-case.pleine.validee{background:var(--ok); color:var(--sur-statut);}
  .cal-case.pleine.option{background:var(--maybe); color:var(--sur-statut);}
  .cal-case.pleine.recherche{background:var(--border); color:var(--text);}
  .cal-case.pleine.annulee{background:var(--ko-tint); color:var(--ko); text-decoration:line-through;}
  .cal-case.moi::after{
    content:''; position:absolute; bottom:3px; width:4px; height:4px; border-radius:50%;
    background:currentColor;
  }
  .cal-legende{display:flex; gap:13px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin:10px 0 0;}
  .cal-legende span{display:inline-flex; align-items:center; gap:5px;}
  .cal-puce{width:11px; height:11px; border-radius:4px; display:inline-block;}
  .cal-puce.validee{background:var(--ok);} .cal-puce.option{background:var(--maybe);}
  .cal-puce.recherche{background:var(--border);} .cal-puce.annulee{background:var(--ko-tint);}
  .cal-puce.moi{background:var(--text); border-radius:50%; width:7px; height:7px;}

  .pied{
    margin-top:28px; padding-top:16px; border-top:1px solid var(--border);
    font-size:12px; color:var(--muted); line-height:1.6;
  }
  .pied strong{color:var(--text);}
</style>

<body>
<div class="wrap">
  <img class="brand-logo-img" alt="Curieux orchestre">
  <div class="entete">
    <h1 class="co-h1" id="titre">Mes dates</h1>
    <p class="sous" id="sousTitre">Chargement…</p>
  </div>
  <div id="contenu"></div>
</div>

<script>
/* ---------------------------------------------------------------------------
   Mes dates — ce qui est confirmé, ce qui est encore en option.
   ---------------------------------------------------------------------------
   L'espace personnel disait où en était le dossier et ce qu'il restait à
   répondre. Il ne disait rien de ce qu'on attend pourtant le plus quand on
   joue : est-ce que je joue, et quand.

   Trois règles gouvernent tout ce fichier.

   1. Un statut de date est un mot de production. Adressé à quelqu'un qui joue,
      il doit dire ce qu'il faut FAIRE :
        validée   → c'est signé, tu peux compter dessus ;
        option    → la salle nous tient la date, rien n'est signé : garde-la
                    sans t'engager ailleurs ;
        recherche → rien n'est posé, ne bloque rien ;
        annulée   → libère ta journée.
      Le mot est porté par l'en-tête de sa colonne, qui reste collé en haut
      pendant qu'on descend : à la vingtième ligne comme à la première, on sait
      ce qu'on lit. Une première version répétait la phrase sur chaque carte —
      vingt fois la même phrase, et la page devenait illisible à force de se
      répéter.

   2. Le statut de la DATE et la présence de la PERSONNE sur cette date sont
      deux choses différentes. Une date validée où l'on n'est pas distribué
      n'est pas « ta date » ; une option où l'on est distribué n'est pas un
      engagement. C'est ce croisement, et non le seul statut, qui décide de la
      colonne où tombe une date — voir groupeDe(). Une date validée où l'on ne
      joue pas a d'ailleurs sa colonne à elle : « Sans toi », qui dit de libérer
      la journée là où « Validée » dirait de compter dessus.

      Toutes les dates que la base renvoie entrent dans les colonnes, y compris
      celles où l'on nous a seulement demandé notre dispo : on nous a demandé de
      les tenir, nous devons apprendre ici qu'elles sont posées ou tombées, pas
      par un collègue. Une version précédente les rangeait dans un repli — ce
      qui revenait à cacher l'annulation d'une date qu'on gardait.

   3. Deux formes, deux questions. Les colonnes répondent à « sur quoi puis-je
      compter ? », le calendrier à « suis-je pris le 14 ? ». Aucune des deux ne
      se répond bien dans la forme de l'autre, et le choix se retient.
--------------------------------------------------------------------------- */

const params = new URLSearchParams(location.search);
const TOKEN = params.get('token') || '';

const MOIS_FR = ['janvier','février','mars','avril','mai','juin',
                 'juillet','août','septembre','octobre','novembre','décembre'];
const JOURS_FR = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];

/* Découpage de la chaîne ISO plutôt que new Date() : selon le fuseau, minuit
   décale la date d'un jour, et une date de concert fausse d'un jour est pire
   que pas de date du tout. Pour le jour de la semaine, on passe par Date.UTC,
   qui ne connaît pas de fuseau. */
function partsDe(iso){
  const [a, m, j] = String(iso || '').split('-').map(n=> parseInt(n, 10));
  return { a, m, j };
}
function jourNumero(iso){ const p = partsDe(iso); return p.j || 0; }
function jourSemaine(iso){
  const p = partsDe(iso);
  if(!p.j) return '';
  return JOURS_FR[(new Date(Date.UTC(p.a, p.m - 1, p.j)).getUTCDay() + 6) % 7];
}
function jourLong(iso){
  const p = partsDe(iso);
  return p.j ? `${p.j} ${MOIS_FR[p.m - 1] || ''}` : '';
}
function moisAnnee(cle){
  const [a, m] = String(cle || '').split('-');
  return `${MOIS_FR[parseInt(m, 10) - 1] || ''} ${a}`;
}
function moisDe(iso){ return String(iso || '').slice(0, 7); }

function fraicheur(isoUtc){
  const d = new Date(isoUtc);
  if(isNaN(d)) return '';
  const jour = d.toLocaleDateString('fr-FR', { day:'numeric', month:'long' });
  const heure = d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' }).replace(':', ' h ');
  return `Mis à jour le ${jour} à ${heure}`;
}

function etat(html){
  document.getElementById('contenu').innerHTML = `<div class="co-card co-pad etat-boite">${html}</div>`;
}

const STATUT_MOT = { validee:'Validée', option:'Option', recherche:'Recherche', annulee:'Annulée' };
const RANG_STATUT = { validee:0, option:1, recherche:2, annulee:3 };
const LIBELLE_DISPO = { indispo:'tu t’es dit indispo', incertain:'tu as répondu « à confirmer »' };

function statutDe(d){ return STATUT_MOT[d.statut] ? d.statut : 'option'; }

/* Les colonnes, dans l'ordre où elles comptent : ce sur quoi on peut s'appuyer
   d'abord, ce qui n'aura pas lieu en dernier. La quatrième n'apparaît que si
   quelque chose a été annulé — une colonne vide en permanence est un rappel
   inutile qu'une date peut tomber. */
const COLONNES = [
  { cle:'validee',   titre:'Validée',   dit:"C'est signé, et tu es dessus. Tu peux compter sur ces dates.",
    vide:"Rien de signé pour l'instant." },
  { cle:'option',    titre:'Option',    dit:"La salle nous tient la date, rien n'est signé. Garde-la sans t'engager ailleurs.",
    vide:'Aucune option en cours.' },
  { cle:'recherche', titre:'Recherche', dit:"Rien n'est posé : on regarde qui serait là. Ne bloque rien.",
    vide:'Aucune recherche en cours.' },
  { cle:'annulee',   titre:'Annulée',   dit:'Ces dates ne se feront pas. Tu peux libérer ces journées.',
    vide:'', siVide:'masquer' },
  // Le cinquième cas, qui n'existait pas et qu'il fallait bien nommer : la date
  // est confirmée, on t'avait demandé ta dispo, et tu n'es pas dessus. La ranger
  // sous « Validée » aurait été un contresens — « tu peux compter dessus » sur
  // une date où l'on ne joue pas. La taire aurait été pire : la personne garde
  // sa soirée pour rien.
  { cle:'sans-toi',  titre:'Sans toi',  dit:"Ces dates sont confirmées, mais tu n'y es pas distribué·e. Tu peux libérer ces journées.",
    vide:'', siVide:'masquer' },
];

/* Dans quel groupe tombe une date ?
   ---------------------------------------------------------------------------
   Le statut ne suffit pas : il faut le croiser avec la présence de la personne.
   Une date validée où l'on joue et une date validée où l'on ne joue pas
   n'appellent pas la même conduite — l'une se garde, l'autre se libère.

   Pour les trois autres statuts la conduite est en revanche la même, qu'on soit
   distribué ou seulement sollicité : une option se garde, une recherche ne se
   bloque pas, une annulation se libère. Elles ne se dédoublent donc pas — et
   c'est pourquoi une date sur laquelle on nous a seulement demandé notre dispo
   a toute sa place ici. On nous a demandé de la tenir : nous devons apprendre
   ici qu'elle est tombée, pas par un collègue. */
function groupeDe(d){
  const st = statutDe(d);
  if(st === 'validee') return d.affecte ? 'validee' : 'sans-toi';
  return st;
}

// --- Une date, une ligne ---------------------------------------------------
function ligne(d, sansProjet){
  const st = statutDe(d);
  const lieu = [d.ville, d.lieu].filter(Boolean).join(' · ');
  const notes = [];

  if(st === 'option' && d.optionExpire){
    notes.push(`<span class="l-note butoir">option jusqu'au ${escapeHtml(jourLong(d.optionExpire))}</span>`);
  }
  /* Trois colonnes mélangent les dates où l'on est distribué et celles où l'on
     nous a seulement demandé notre dispo : il faut donc dire lesquelles. Pas
     « tu joues » sur une option — rien n'est signé, et le mot vaudrait
     promesse ; « pressenti·e », qui est exactement ce que c'est. */
  if(d.affecte && st !== 'validee'){
    notes.push(`<span class="l-note moi">${st === 'annulee' ? 'tu étais dessus' : 'tu es pressenti·e'}</span>`);
  }

  // Sa propre réponse, rappelée seulement quand elle manque ou qu'elle
  // contredit l'affectation : le reste du temps, c'est du bruit.
  if(st !== 'annulee'){
    const rep = d.maDispo || '';
    if(!rep) notes.push('<span class="l-note manque">ta dispo reste à donner</span>');
    else if(rep !== 'dispo') notes.push(`<span class="l-note indispo">${escapeHtml(LIBELLE_DISPO[rep] || rep)}</span>`);
  }

  /* Quand toutes les dates d'un panneau viennent du même projet, son nom est
     écrit dans l'en-tête et disparaît des lignes. « EXPEDITION 33 – 2027 »
     répété vingt-quatre fois n'apprend rien à personne et vole la place de la
     seule chose qui change d'une ligne à l'autre : la ville. */
  const titre = sansProjet
    ? escapeHtml(lieu || 'lieu à venir')
    : escapeHtml(d.tourneeNom || (d.tourneeType === 'recording' ? 'Recording' : 'Projet'));
  const dessous = sansProjet ? '' : `<span>${escapeHtml(lieu || 'lieu à venir')}</span>`;

  return `<div class="ligne${st === 'annulee' ? ' barree' : ''}">
    <span class="l-jour">${escapeHtml(String(jourNumero(d.date)))}<small>${escapeHtml(jourSemaine(d.date))}</small></span>
    <span class="l-ou"><b>${titre}</b>${dessous}${notes.join('')}</span>
  </div>`;
}

function unSeulProjet(dates){
  const noms = new Set(dates.map(d=> d.tourneeNom || ''));
  return noms.size === 1 ? [...noms][0] : '';
}

function parMois(dates, sansProjet){
  let courant = '';
  return dates.map(d=>{
    let tete = '';
    if(moisDe(d.date) !== courant){
      courant = moisDe(d.date);
      tete = `<div class="mois">${escapeHtml(moisAnnee(courant))}</div>`;
    }
    return tete + ligne(d, sansProjet);
  }).join('');
}

// --- La grille d'un mois ---------------------------------------------------
function grilleMois(cle, dates){
  const [a, m] = cle.split('-').map(Number);
  const decalage = (new Date(Date.UTC(a, m - 1, 1)).getUTCDay() + 6) % 7;
  const nbJours = new Date(Date.UTC(a, m, 0)).getUTCDate();

  const parJour = new Map();
  dates.forEach(d=>{
    const j = jourNumero(d.date);
    if(!parJour.has(j)) parJour.set(j, []);
    parJour.get(j).push(d);
  });

  const cases = ['L','M','M','J','V','S','D'].map(n=> `<span class="cal-nom">${n}</span>`);
  for(let i = 0; i < decalage; i++) cases.push('<span class="cal-case vide"></span>');
  for(let j = 1; j <= nbJours; j++){
    const dus = parJour.get(j) || [];
    if(!dus.length){ cases.push(`<span class="cal-case">${j}</span>`); continue; }
    // Deux projets le même jour : c'est le statut le plus engageant qui donne
    // sa couleur. Le détail se lit au survol, et dans les colonnes.
    const st = dus.map(statutDe).sort((x, y)=> RANG_STATUT[x] - RANG_STATUT[y])[0];
    const moi = dus.some(x=> x.affecte);
    const titre = dus.map(x=> `${x.tourneeNom || 'Projet'} — ${STATUT_MOT[statutDe(x)]}${x.ville ? ' · ' + x.ville : ''}`).join(' / ');
    cases.push(`<span class="cal-case pleine ${escapeAttr(st)}${moi ? ' moi' : ''}" title="${escapeAttr(titre)}">${j}</span>`);
  }
  return `<div class="cal-grille">${cases.join('')}</div>`;
}

function vueCalendrier(dates){
  const mois = [...new Set(dates.map(d=> moisDe(d.date)))].sort();
  if(!mois.length) return '';
  // Les mois sans aucune date ne sont pas dessinés : une saison de trois mois
  // actifs étalée sur huit ne doit pas faire défiler cinq grilles vides.
  const corps = mois.map(cle=>`
    <div>
      <div class="mois">${escapeHtml(moisAnnee(cle))}</div>
      ${grilleMois(cle, dates.filter(d=> moisDe(d.date) === cle))}
    </div>`).join('');
  return `<div class="cal">${corps}</div>
    <div class="cal-legende">
      <span><i class="cal-puce validee"></i> validée</span>
      <span><i class="cal-puce option"></i> option</span>
      <span><i class="cal-puce recherche"></i> recherche</span>
      <span><i class="cal-puce annulee"></i> annulée</span>
      <span><i class="cal-puce moi"></i> le point : tu joues</span>
    </div>`;
}

// --- État de la page -------------------------------------------------------
const CLE_VUE = 'curieuxMesDatesVue';
// Toutes les dates qui concernent la personne : distribuée, ou sollicitée.
let MIENNES = [];
let AUTRES = [];
let VUE = 'colonnes';
try{ if(localStorage.getItem(CLE_VUE) === 'calendrier') VUE = 'calendrier'; }catch(e){}

/* Quelle largeur pour un panneau ?
   ---------------------------------------------------------------------------
   Trois colonnes d'un tiers chacune supposent que les trois statuts se
   remplissent à peu près également. La réalité ne s'y prête pas : une tournée
   signée donne 24 validées, 0 option, 0 recherche — et deux tiers de la page
   servaient alors à écrire « aucune option en cours », pendant que les 24
   dates s'empilaient dans un tiers de largeur sur trois écrans de haut.

   La réponse n'est pas de plafonner la hauteur d'une colonne : un défilement
   dans un défilement cache le contenu au lieu de l'organiser. C'est la LARGEUR
   qui doit suivre le contenu. Un panneau prend d'autant plus de colonnes de la
   grille qu'il porte de dates, et son corps y coule en autant de sous-colonnes
   que la place en tient (voir column-width dans la feuille de style).

   24 dates occupent ainsi toute la largeur en quatre sous-colonnes — six
   lignes de haut au lieu de vingt-quatre. */
function empan(nb, nbPanneaux){
  if(nbPanneaux <= 1) return 3;
  if(nbPanneaux === 2) return nb >= 10 ? 2 : 1;
  return nb >= 16 ? 2 : 1;   // à trois panneaux, un seul peut s'élargir
}

function vueColonnes(){
  const remplis = COLONNES.map(c=> ({ c, dates: MIENNES.filter(d=> groupeDe(d) === c.cle) }))
                          .filter(x=> x.dates.length);
  // Les statuts vides ne prennent pas un panneau pour dire qu'ils sont vides.
  const vides = COLONNES.filter(c=> c.siVide !== 'masquer' && !MIENNES.some(d=> groupeDe(d) === c.cle));

  const cols = remplis.map(({ c, dates })=> {
    const e = empan(dates.length, remplis.length);
    const projet = unSeulProjet(dates);
    return `<section class="colonne col-${c.cle}${e > 1 ? ' empan-' + e : ''}">
      <div class="col-tete">
        <span class="col-mot">${escapeHtml(c.titre)}</span><span class="col-nb">${dates.length}</span>
        ${projet ? `<span class="col-projet">${escapeHtml(projet)}</span>` : ''}
        <span class="col-dit">${escapeHtml(c.dit)}</span>
      </div>
      <div class="col-corps">${parMois(dates, !!projet)}</div>
    </section>`;
  });

  const rien = vides.length
    ? `<p class="rien">${escapeHtml(vides.map(c=> c.vide).join(' '))}</p>`
    : '';

  // Un seul panneau : rien à faire glisser, et des flèches qui ne mènent nulle
  // part valent moins que pas de flèches du tout.
  const nav = cols.length > 1 ? `<div class="nav-cols">
      <button type="button" id="colPrec" aria-label="Colonne précédente">‹</button>
      <span class="nav-points" id="colPoints">${cols.map((_, i)=> `<i class="${i ? '' : 'on'}"></i>`).join('')}</span>
      <button type="button" id="colSuiv" aria-label="Colonne suivante">›</button>
    </div>` : '';

  return `<div class="colonnes" id="colonnes">${cols.join('')}</div>${nav}${rien}`;
}

/* Ce qui dépasse du cadre, et comment on le dit.
   ---------------------------------------------------------------------------
   Un panneau n'a pas de hauteur imposée : il prend celle de son contenu, et
   c'est très bien tant que ce contenu tient dans un écran. Au-delà, la page
   devient un rouleau où l'on ne sait plus ce qui reste. On plafonne donc à
   deux tiers de la hauteur visible, on estompe le bas — un dégradé dit qu'on a
   coupé, une coupe nette ne dit rien — et un bouton ouvre le reste.

   La mesure se fait au navigateur, jamais sur un nombre de lignes deviné : le
   corps coule en une à quatre sous-colonnes selon la largeur, et vingt dates
   tiennent parfois entièrement là où douze débordaient. */
function poserTroncatures(){
  const plafond = Math.max(320, Math.round(window.innerHeight * 0.66));
  document.querySelectorAll('.colonne').forEach(panneau=>{
    const corps = panneau.querySelector('.col-corps');
    const ancien = panneau.querySelector('.voir-suite');
    if(ancien) ancien.remove();
    if(!corps) return;
    corps.classList.remove('tronque');
    corps.style.maxHeight = '';
    // scrollHeight sur un conteneur non plafonné rend sa hauteur naturelle :
    // c'est elle qu'on compare, avant toute troncature.
    if(corps.scrollHeight <= plafond + 48) return;

    const n = corps.querySelectorAll('.ligne').length;
    corps.classList.add('tronque');
    corps.style.maxHeight = plafond + 'px';
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'voir-suite';
    b.textContent = `Tout voir — ${n} date${n > 1 ? 's' : ''}`;
    b.addEventListener('click', ()=>{
      const ferme = corps.classList.contains('tronque');
      corps.classList.toggle('tronque', !ferme);
      corps.style.maxHeight = ferme ? '' : plafond + 'px';
      b.textContent = ferme ? 'Replier' : `Tout voir — ${n} date${n > 1 ? 's' : ''}`;
    });
    panneau.appendChild(b);
  });
}

/* Les flèches et les points du glissement. Ils ne servent que sur téléphone,
   mais on les branche toujours : leur affichage est affaire de CSS, et une
   logique qui dépendrait de la largeur se tromperait à la rotation. */
function brancherGlissement(){
  const piste = document.getElementById('colonnes');
  const points = document.getElementById('colPoints');
  const prec = document.getElementById('colPrec');
  const suiv = document.getElementById('colSuiv');
  if(!piste || !points || !prec || !suiv) return;

  const colonnes = [...piste.children];
  const majEtat = ()=>{
    const i = Math.round(piste.scrollLeft / Math.max(1, (colonnes[0] || {}).offsetWidth || 1));
    [...points.children].forEach((p, k)=> p.classList.toggle('on', k === i));
    prec.disabled = piste.scrollLeft <= 2;
    suiv.disabled = piste.scrollLeft + piste.clientWidth >= piste.scrollWidth - 2;
  };
  const glisser = (sens)=>{
    const large = ((colonnes[0] || {}).offsetWidth || piste.clientWidth) + 10;
    piste.scrollBy({ left: sens * large, behavior: 'smooth' });
  };
  prec.addEventListener('click', ()=> glisser(-1));
  suiv.addEventListener('click', ()=> glisser(1));
  piste.addEventListener('scroll', majEtat, { passive: true });
  majEtat();
}

function rendre(){
  const bascule = `<div class="barre">
      <div class="bascule" role="group" aria-label="Forme d'affichage">
        <button type="button" data-vue="colonnes" class="${VUE === 'colonnes' ? 'on' : ''}">Par statut</button>
        <button type="button" data-vue="calendrier" class="${VUE === 'calendrier' ? 'on' : ''}">Calendrier</button>
      </div>
    </div>`;

  let corps;
  if(!MIENNES.length){
    corps = `<div class="co-card co-pad etat-boite" style="text-align:left;">
      Tu n'es sur aucune date pour l'instant. Dès qu'on te distribue, elles apparaissent ici.
    </div>`;
  } else {
    corps = VUE === 'calendrier' ? vueCalendrier(MIENNES) : vueColonnes();
  }

  document.getElementById('contenu').innerHTML = bascule + corps + `
    <div class="pied">
      <p>Ces dates sont <strong>strictement confidentielles</strong> — merci de ne pas les diffuser en dehors de l'équipe.</p>
      <p>Cette page est informative et suit le projet au jour le jour. <strong>Seul le contrat d'engagement vaut engagement.</strong></p>
      <p>Une erreur, une question ? Écris à la personne qui t'a envoyé ce lien.</p>
    </div>`;

  document.querySelectorAll('[data-vue]').forEach(b=> b.addEventListener('click', ()=>{
    VUE = b.dataset.vue;
    try{ localStorage.setItem(CLE_VUE, VUE); }catch(e){}
    rendre();
  }));
  if(VUE === 'colonnes' && MIENNES.length){ brancherGlissement(); poserTroncatures(); }
}

/* La troncature dépend de la hauteur de la fenêtre et de la largeur, qui
   décide du nombre de sous-colonnes : une rotation de téléphone change les
   deux. On recalcule, sans reconstruire la page. */
let minuteurTaille = null;
window.addEventListener('resize', ()=>{
  clearTimeout(minuteurTaille);
  minuteurTaille = setTimeout(()=>{ if(VUE === 'colonnes' && MIENNES.length) poserTroncatures(); }, 200);
});

async function init(){
  if(!window.supabase){ etat("La page n'a pas pu se charger. Réessaie dans un instant."); return; }
  if(!TOKEN){
    document.getElementById('sousTitre').textContent = '';
    etat("Ce lien est incomplet. Reprends celui qu'on t'a envoyé, ou demande-nous de te le renvoyer.");
    return;
  }

  const moi = await CurieuxDB.mesDates(TOKEN);

  // La migration n'est pas jouée sur cette base. Sans ce cas dit en toutes
  // lettres, la page afficherait « aucune date », qui se lit « on ne t'a rien
  // donné » — un mensonge, et le plus décourageant de tous.
  if(moi && moi.migrationAbsente){
    document.getElementById('sousTitre').textContent = '';
    etat("Cette page n'est pas encore active sur ce serveur.<br>Préviens la production — il lui reste une mise à jour à appliquer.");
    return;
  }
  if(!moi){
    document.getElementById('sousTitre').textContent = '';
    etat("Ce lien n'est plus valide. Contacte la production pour en obtenir un nouveau.");
    return;
  }

  const prenom = (moi.prenom || '').trim();
  document.getElementById('titre').textContent = prenom ? `Les dates de ${prenom}` : 'Mes dates';
  const stamp = fraicheur(moi.genereLe);
  document.getElementById('sousTitre').innerHTML =
    `Ce qui est confirmé, ce qui est encore en option.${stamp ? `<br><span class="fraicheur">${escapeHtml(stamp)}</span>` : ''}`;

  // Le tri est refait ici plutôt que d'être supposé : la fonction SQL trie
  // déjà, mais un affichage qui dépend en silence de l'ordre d'une source
  // devient faux le jour où la source change d'avis — et « du 12 mars au
  // 20 avril » sur des dates qui vont jusqu'en juin est un mensonge discret.
  const dates = (Array.isArray(moi.dates) ? moi.dates : [])
    .slice().sort((a, b)=> String(a.date).localeCompare(String(b.date)));
  /* Toutes les dates que la fonction SQL renvoie concernent la personne : elle
     y est distribuée, ou on lui a demandé sa dispo dessus. Une première version
     mettait les secondes dans un repli, ce qui revenait à cacher qu'une date
     qu'on avait demandé de tenir venait d'être annulée. Elles entrent donc
     toutes dans les colonnes ; c'est groupeDe() qui distingue les conduites. */
  MIENNES = dates;
  AUTRES = [];

  if(!MIENNES.length){
    etat("Aucune date à venir pour l'instant.<br>Tu recevras un message dès qu'un projet se prépare.");
    return;
  }
  rendre();
}

init();
applyBrandLogo();
setInterval(applyAutoTheme, 5 * 60 * 1000);
</script>
