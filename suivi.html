<link rel="stylesheet" href="assets/base.css">
<style>
  /* ==========================================================================
     LA CHARTE DE LA PAGE BUDGET, et pas une autre.
     Un tableau à bandes colorées et en-tête collant se lit moins bien qu'une
     suite de cartes blanches à lignes fines — c'est le constat fait sur la page
     Budget, et il n'y a aucune raison que le suivi s'en écarte. Une section du
     devis = une carte, son titre en petites capitales, ses postes en lignes
     séparées d'un filet. Les classes reprennent celles de budget.html pour que
     les deux pages bougent ensemble le jour où la charte bouge.
     ========================================================================== */
  .wrap{max-width:min(1200px, 97vw); margin:0 auto;}

  .chiffres{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:12px; margin-bottom:22px;}
  .chiffre{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px;}
  .chiffre b{
    display:block; font-family:var(--font-display); font-size:30px; font-weight:500; color:var(--accent);
    line-height:1.1; font-variant-numeric:tabular-nums;
  }
  .chiffre span{font-size:12.5px; color:var(--muted); font-weight:600;}
  .chiffre small{display:block; font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.4;}
  .chiffre.alerte b{color:var(--ko);}

  .bloc{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px 6px;}
  .bloc + .bloc{margin-top:14px;}
  .bloc h2{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:800; margin:0 0 4px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  }
  .bloc h2 .h2-total{margin-left:auto; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:0;}
  .bloc h2 .h2-total em{font-style:normal; color:var(--muted); font-weight:600;}

  /* La grille des colonnes, identique de la barre d'en-tête à la dernière
     ligne du pied : c'est elle qui fait que les montants s'alignent d'une carte
     à l'autre alors que ce sont des cartes séparées. */
  .su-tete, .ligne{
    display:grid; grid-template-columns:minmax(0,1fr) 116px 116px 116px 40px;
    gap:10px; align-items:center;
  }
  .su-tete{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:800;
    padding:0 18px 7px;
  }
  .su-tete span:not(:first-child){text-align:right;}
  .ligne{padding:9px 0; border-bottom:1px solid var(--border);}
  .ligne:last-child{border-bottom:none;}

  .l-nom{min-width:0; position:relative;}
  .l-titre{font-weight:700; font-size:13.5px; display:block;}
  .l-sous{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:1px; line-height:1.4;}
  .ligne.niv-groupe .l-titre{font-weight:800;}
  .ligne.niv-ligne > .l-nom{padding-left:18px;}
  .ligne.niv-ligne .l-titre{font-weight:500;}
  .ligne.pliable > .l-nom{cursor:pointer;}

  .l-chev{
    position:absolute; left:0; top:1px; width:16px; height:16px; min-height:0; line-height:16px;
    background:none; border:none; padding:0; margin:0; cursor:pointer; color:var(--muted);
    font-size:10px; font-family:inherit; text-align:left;
  }
  .ligne.niv-groupe > .l-nom{padding-left:20px;}

  .l-num{text-align:right; font-variant-numeric:tabular-nums; font-size:13px; font-weight:800; white-space:nowrap;}
  .l-num small{display:block; font-size:10.5px; font-weight:600; color:var(--muted); margin-top:1px;}
  .l-num.vide{color:var(--muted); font-weight:500;}
  .l-reel.cliquable{cursor:pointer; text-decoration:underline; text-decoration-style:dotted; text-underline-offset:3px;}
  .l-ecart.alerte{color:var(--ko);}
  /* Le vert est réservé à la MARGE. Un écart de poste n'a pas à être célébré —
     une économie peut cacher une prestation qui n'a pas eu lieu. Le résultat du
     projet, lui, n'a qu'un sens : positif, on gagne de l'argent. */
  .l-num.gain, .chiffre.gain b{color:var(--ok);}
  .ligne.resultat .l-titre{font-weight:800;}
  .ligne.resultat.total{border-top:2px solid var(--border); border-bottom:none; margin-top:2px; padding-top:11px;}
  .ligne.resultat.total .l-titre{font-size:15px;}
  .ligne.resultat.total .l-num{font-size:15px;}

  /* La part d'un poste dans le coût, en une barre. Un pourcentage se lit, une
     barre se compare — et c'est la comparaison qu'on cherche. */
  .barre-part{
    display:inline-block; width:64px; height:6px; border-radius:3px; background:var(--border);
    vertical-align:middle; margin-right:5px; position:relative; overflow:hidden;
  }
  .barre-part::after{content:''; position:absolute; inset:0 auto 0 0; width:var(--p); background:var(--t);}

  .compteurs{display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; padding:4px 0 12px;}
  .compteur{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .compteur b{display:block; font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.2;}
  .compteur span{font-size:11.5px; color:var(--muted); font-weight:600;}

  .su-plus{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg);
    color:var(--accent-dark); font-size:17px; font-weight:700; cursor:pointer; font-family:inherit; line-height:1;
  }
  .su-plus:hover{border-color:var(--accent); background:var(--champagne);}

  .statut-badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:10px; font-weight:800;
    text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; margin-left:6px; vertical-align:middle;
  }
  .badge-option{background:var(--maybe-tint); color:#8a5a18;}
  .badge-ajout{background:var(--secondary-tint); color:#8c2c07;}
  .badge-calc{background:var(--accent-tint); color:#2f4a68;}
  .badge-solde{background:#dcf2e5; color:#2f8f5b;}
  :root[data-theme="dark"] .badge-solde{background:#1d3a2a; color:#7fd6a4;}

  .bloc.pied .ligne{border-bottom:1px dashed var(--border);}
  .bloc.pied .l-titre{font-weight:800;}
  .avert{font-size:12.5px; color:var(--muted); line-height:1.55; margin:12px 0 10px;}
  .avert b{color:var(--text);}
  .avert + .avert{margin-top:-4px;}

  .barre{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px;}
  .filtre{
    background:var(--card); border:1px solid var(--border); border-radius:999px; padding:7px 13px;
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit;
  }
  .filtre[aria-pressed="true"]{background:var(--accent-solid); color:#fff; border-color:var(--accent-solid);}
  .recherche{flex:1 1 200px; min-width:150px; padding:8px 11px; border:1px solid var(--border);
    border-radius:8px; font-size:13px; background:var(--card); color:var(--text); font-family:inherit;}

  /* La fiche de saisie : ancrée en bas sur téléphone, centrée sur écran. */
  .voile{position:fixed; inset:0; background:rgba(20,22,23,.42); z-index:60; display:flex;
    align-items:flex-end; justify-content:center;}
  @media (min-width:761px){ .voile{align-items:center; padding:20px;} }
  .fiche{
    background:var(--card); border-radius:var(--radius) var(--radius) 0 0; width:min(580px, 100%);
    max-height:92vh; overflow-y:auto; padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  @media (min-width:761px){ .fiche{border-radius:var(--radius);} }
  .fiche h3{margin:0 0 3px; font-size:15px;}
  .fiche .cible{font-size:12px; color:var(--muted); margin:0 0 13px; line-height:1.4;}
  .champs{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .champs .large{grid-column:1 / -1;}
  .champ label{display:block; font-size:11px; font-weight:700; color:var(--muted); margin-bottom:3px;}
  .champ input, .champ select{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:14px;
    background:var(--card); color:var(--text); font-family:inherit;
  }
  .champ input:disabled{background:var(--bg); color:var(--muted);}
  .champ input:focus, .champ select:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .bascule{display:flex; gap:6px; margin-bottom:10px;}
  .bascule button{
    flex:1; padding:8px; border:1px solid var(--border); border-radius:8px; background:var(--bg);
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; font-family:inherit;
  }
  .bascule button[aria-pressed="true"]{background:var(--accent-solid); color:#fff; border-color:var(--accent-solid);}
  .garde{
    font-size:12px; line-height:1.45; background:var(--maybe-tint); color:#7a4e12; border-radius:8px;
    padding:9px 11px; margin-top:10px;
  }
  .coche{
    display:flex; gap:9px; align-items:flex-start; margin-top:12px; font-size:12.5px; line-height:1.45;
    background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; cursor:pointer;
  }
  .coche input{width:18px; height:18px; flex:none; margin-top:1px; accent-color:var(--accent-solid);}
  .coche b{display:block;}
  .coche span{color:var(--muted);}
  .fiche-actions{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center;}

  /* Le journal, et la liste des dépenses d'un poste : même forme. */
  .jl{
    display:grid; grid-template-columns:84px minmax(0,1fr) auto auto; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--border); font-size:13px;
  }
  .jl:last-child{border-bottom:none;}
  .jdate{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .jnom b{font-weight:700;}
  .jnom small{display:block; font-size:11.5px; color:var(--muted);}
  .jact{display:flex; gap:5px;}
  .mini{
    background:none; border:1px solid var(--border); border-radius:7px; padding:5px 9px; font-size:11.5px;
    font-weight:600; color:var(--text); cursor:pointer; font-family:inherit; text-decoration:none;
  }
  .mini:hover{border-color:var(--accent);}
  .mini.danger{color:var(--danger); border-color:var(--danger-tint);}

  .vide{font-size:13px; color:var(--muted); padding:10px 0; line-height:1.6;}
  .drive{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12.5px; margin-bottom:6px;}
  .drive input{flex:1 1 240px; min-width:180px; padding:8px 11px; border:1px solid var(--border);
    border-radius:8px; font-size:13px; background:var(--card); color:var(--text); font-family:inherit;}
  .note-drive{font-size:11.5px; color:var(--muted); line-height:1.45; margin:0 0 12px;}

  /* SUR TÉLÉPHONE, trois colonnes deviennent deux lignes. */
  @media (max-width:760px){
    .su-tete{display:none;}
    .bloc{padding:13px 14px 4px;}
    .ligne{
      grid-template-columns:minmax(0,1fr) auto 44px;
      grid-template-areas:"nom ecart plus" "prevu reel plus";
      gap:3px 10px;
    }
    .l-nom{grid-area:nom;}
    .l-num{text-align:left; font-size:12.5px; font-weight:700;}
    .l-num small{display:inline; margin-left:4px;}
    .l-prevu{grid-area:prevu;}
    .l-reel{grid-area:reel; text-align:right;}
    .l-prevu::after{content:' prévu'; font-weight:500; color:var(--muted); font-size:11px;}
    .l-reel::after{content:' réel'; font-weight:500; color:var(--muted); font-size:11px;}
    .l-ecart{
      grid-area:ecart; align-self:start; font-size:13px; font-weight:800; text-align:right;
      padding:2px 8px; border-radius:999px; background:var(--bg);
    }
    .l-ecart.alerte{background:var(--ko-tint);}
    .ligne > span:last-child{grid-area:plus; align-self:center; justify-self:end;}
    .su-plus{width:44px; height:44px; font-size:20px;}
    .ligne.niv-ligne > .l-nom{padding-left:10px;}
    .champs{grid-template-columns:1fr;}
    input, select{font-size:16px !important;}
    .jl{grid-template-columns:1fr auto;}
    .jdate{grid-column:1; grid-row:2;}
  }
</style>

<body>
<div class="wrap" data-annuler-ancre>
  <div id="page"><div class="co-card co-pad su-vide">Chargement…</div></div>
</div>

<script>
/* ============================================================================
   Suivi des dépenses — la page.
   ============================================================================
   Tout le calcul vit dans assets/suivi-commun.js : ici, on dessine et on
   saisit. La règle de partage est simple — si une ligne de ce fichier fait une
   addition d'euros, elle est au mauvais endroit.

   DEUX ÉCRANS DANS UNE PAGE. Sans paramètre, la liste des suivis et des
   chiffrages qui attendent le leur. Avec ?id=, le suivi lui-même.

   LA FORME SUIT CELLE DE LA PAGE BUDGET : une carte par section, des lignes
   séparées d'un filet, les montants alignés d'une carte à l'autre. Un tableau
   à bandes colorées et en-tête collant se lisait moins bien.

   CE QUE CETTE PAGE NE FAIT PAS, et qui est un bon refus :
   — aucune ventilation d'un poste vers un autre. L'écart est le seul signal de
     diagnostic du suivi ; le lisser le détruit ;
   — aucun réel sur la rangée « Imprévus » : une provision n'a pas de facture.
     Ce qui la consomme, ce sont les dépenses sans prévisionnel, comptées à
     part et déduites de la provision restante ;
   — aucune trace de la remise : c'est une réduction de PRODUIT ;
   — aucun pré-remplissage automatique des montants.
============================================================================ */

const AUJOURDHUI = new Date().toISOString().slice(0, 10);

let state = {
  suivis: [], depenses: [], devis: [], tournees: [],
  suivi: null,
  ouverts: null,           // null = pas encore décidé ; sinon un Set d'ids de groupes dépliés
  filtre: 'tout',
  recherche: '',
  vue: 'tableau',          // 'tableau' | 'journal' | 'bilan'
  saisieTtc: true,
  detail: null,            // l'id du nœud dont on liste les dépenses
};

function euros(n){ return fmtEurosDevis(n); }
function signe(n){ return (n >= 0 ? '+' : '−') + fmtEurosDevis(Math.abs(n)); }
function nb(v){ return devisNombre(v, 0); }
function vide(){ return { reel: 0, engage: 0, nb: 0, nbJustif: 0, tva: 0 }; }

/* Le seuil à partir duquel un écart se colore : en pourcentage OU en valeur
   absolue, le plus permissif des deux. 5 % de 200 € ne mérite pas de rouge,
   200 € sur 100 000 € non plus. */
function ecartAlerte(ecart, prevu){
  if(ecart <= 0) return false;
  return ecart > 200 && (!prevu || ecart / prevu > 0.05);
}

function projetDe(id){ return state.tournees.find(t=> t.id === id) || null; }
function depensesDuSuivi(){
  if(!state.suivi) return [];
  return state.depenses.filter(d=> d.suiviId === state.suivi.id);
}
function depensesDuNoeud(id){
  return depensesDuSuivi().filter(d=> (d.noeudId || '') === (id || ''));
}

// ---------------------------------------------------------------- chargement
async function charger(){
  const [suivis, depenses, devis, tournees, reglages] = await Promise.all([
    CurieuxDB.fetchAll('suivis_budget').catch(()=> []),
    CurieuxDB.fetchAll('depenses').catch(()=> []),
    CurieuxDB.fetchAll('devis').catch(()=> []),
    CurieuxDB.fetchAll('tournees').catch(()=> []),
    CurieuxDB.fetchDevisReglages().catch(()=> ({})),
  ]);
  state.suivis = suivis; state.depenses = depenses;
  state.devis = devis; state.tournees = tournees; state.reglages = reglages;

  const id = new URLSearchParams(location.search).get('id');
  state.suivi = id ? suivis.find(s=> s.id === id) || null : null;
  if(id && !state.suivi){
    document.getElementById('page').innerHTML =
      `<div class="bloc"><p class="vide">Ce suivi n'existe plus. <a href="suivi.html">Revenir à la liste</a>.</p></div>`;
    return;
  }
  // TOUT DÉPLIÉ D'EMBLÉE : on ouvre un suivi pour voir où va l'argent, pas pour
  // cliquer quinze chevrons. Le bouton « Tout replier » est là pour qui veut la
  // vue d'ensemble.
  if(state.suivi && state.ouverts === null){
    state.ouverts = new Set();
    noeudsPlats(state.suivi.data || {}).forEach(n=> { if(n.niveau === 'groupe') state.ouverts.add(n.id); });
  }
  rendre();
}

async function enregistrerSuivi(){
  const { error } = await CurieuxDB.upsertOne('suivis_budget', state.suivi);
  if(error) alert("Le suivi n'a pas pu être enregistré :\n\n" + error.message);
  return !error;
}

// ---------------------------------------------------------------- la liste
/* Quels documents peuvent ouvrir un suivi.
   Le déclencheur n'est PAS « un devis client accepté » : un enregistrement
   autoproduit n'a ni client ni devis, et le budget interne est le seul
   document qui décrive ce que le projet coûte. On propose donc, par projet, le
   document retenu — celui qu'on a soi-même marqué d'une étoile —, à défaut le
   devis accepté, à défaut le premier budget. */
function chiffragesOuvrables(){
  const parProjet = new Map();
  state.devis.forEach(d=>{
    const cle = d.projetId || d.id;
    if(!parProjet.has(cle)) parProjet.set(cle, []);
    parProjet.get(cle).push(d);
  });
  const dejaSuivis = new Set(state.suivis.map(s=> s.projetId));
  const out = [];
  parProjet.forEach((docs, cle)=>{
    if(dejaSuivis.has(cle)) return;
    const choisi = docs.find(d=> d.retenue)
      || docs.find(d=> d.statut === 'accepte')
      || docs.find(d=> typeDocDe(d) === 'budget')
      || docs[0];
    if(choisi) out.push({ projetId: cle, doc: choisi, variantes: docs.length });
  });
  return out;
}

function rendreListe(){
  const ouvrables = chiffragesOuvrables();
  const lignes = state.suivis.map(s=>{
    const d = s.data || {};
    const a = agregerSuivi(d, state.depenses.filter(x=> x.suiviId === s.id));
    const projet = projetDe((state.devis.find(x=> x.id === s.budgetId) || {}).tourneeId);
    return `<a class="ligne" href="suivi.html?id=${encodeURIComponent(s.id)}" style="text-decoration:none; color:inherit;">
      <span class="l-nom"><span class="l-titre">${escapeHtml(d.titre || 'Sans titre')}</span>
        <span class="l-sous">${escapeHtml([projet ? projet.nom : '', d.sourceNumero,
          d.figeLe ? 'arrêté le ' + d.figeLe : '',
          `${a.nbDepenses} dépense${a.nbDepenses > 1 ? 's' : ''}`].filter(Boolean).join(' · '))}</span></span>
      <span class="l-num l-prevu">${a.recette ? euros(a.recette) : euros(a.totalPrevu)}</span>
      <span class="l-num l-reel">${euros(a.atterrissage)}</span>
      <span class="l-num l-ecart ${a.margeAtterrissage == null ? '' : (a.margeAtterrissage < 0 ? 'alerte' : 'gain')}">${
        a.margeAtterrissage == null ? '<span class="vide">—</span>' : signe(a.margeAtterrissage)}</span>
      <span></span>
    </a>`;
  }).join('');

  document.getElementById('page').innerHTML = `
    <div class="co-page-head">
      <div>
        <h1 class="co-h1">Suivi des dépenses</h1>
        <p class="co-sub">Ce qui était prévu, ce qui est dépensé, et l'écart — projet par projet.</p>
      </div>
      <div class="co-page-actions"><a class="co-btn secondary md" href="devis.html">Devis et budgets</a></div>
    </div>

    ${state.suivis.length ? `<div class="su-tete"><span>Projet</span><span>Recette</span><span>Coût attendu</span><span>Marge</span><span></span></div>
    <section class="bloc">${lignes}</section>` : ''}

    <section class="bloc" style="margin-top:14px;">
      <h2>Ouvrir un suivi</h2>
      ${ouvrables.length ? ouvrables.map(o=> `
        <div class="jl">
          <span class="jdate"></span>
          <span class="jnom"><b>${escapeHtml(o.doc.titre || 'Sans titre')}</b>
            <small>${escapeHtml([o.doc.variante, o.doc.numero,
              typeDocDe(o.doc) === 'budget' ? 'budget interne' : (DEVIS_STATUTS[o.doc.statut] || ''),
              o.variantes > 1 ? `${o.variantes} variantes` : ''].filter(Boolean).join(' · '))}</small></span>
          <span class="l-num">${euros(calculerDevis(o.doc).totalHT)}</span>
          <span class="jact"><button type="button" class="co-btn primary sm" data-ouvrir="${escapeAttr(o.doc.id)}">Suivre les dépenses</button></span>
        </div>`).join('')
        : `<p class="vide">Tous les chiffrages ont leur suivi. Un nouveau projet chiffré apparaîtra ici.</p>`}
      <p class="note-drive" style="margin-top:10px;">Le suivi copie l'arbre du document choisi et le fige : le prévisionnel ne bougera plus, même si le devis est retouché ensuite.</p>
    </section>
  `;
  document.querySelectorAll('[data-ouvrir]').forEach(b=> b.addEventListener('click', ()=> ouvrirSuivi(b.dataset.ouvrir, b)));
}

async function ouvrirSuivi(devisId, bouton){
  const doc = state.devis.find(d=> d.id === devisId);
  if(!doc) return;
  bouton.disabled = true; bouton.textContent = 'Ouverture…';
  // Le devis client accepté donne la recette : c'est ce que le client doit, et
  // c'est lui qui fait du suivi un compte de résultat plutôt qu'un relevé de
  // dépenses. Quand le document figé EST ce devis accepté, il est sa propre
  // recette — la marge part de zéro et grandit de tout ce qu'on économise.
  const accepte = state.devis.find(d=> d.projetId === doc.projetId && d.statut === 'accepte');
  const data = figerSuivi(doc, {
    aujourdHui: AUJOURDHUI,
    recette: accepte ? Math.round(calculerDevis(accepte).totalHT * 100) / 100 : 0,
    recetteSource: accepte ? (accepte.numero || 'accepté') : '',
  });
  const suivi = {
    id: genId('suivi'), projetId: doc.projetId || doc.id, budgetId: doc.id,
    devisId: accepte ? accepte.id : '', data,
  };
  const { error } = await CurieuxDB.upsertOne('suivis_budget', suivi);
  if(error){ alert("Le suivi n'a pas pu être créé :\n\n" + error.message); bouton.disabled = false; bouton.textContent = 'Suivre les dépenses'; return; }
  location.href = 'suivi.html?id=' + encodeURIComponent(suivi.id);
}

        <a class="co-btn ghost md" href="suivi.html">Tous les suivis</a>
      </div>
    </div>

    <div class="chiffres">
      <div class="chiffre"><b>${a.recette ? euros(a.recette) : '—'}</b><span>recette contractuelle</span>
        <small>${a.recette
          ? escapeHtml(((d.recette || {}).source ? 'devis ' + d.recette.source : 'saisie à la main') + ' — HT')
          : 'à renseigner en bas de page'}</small></div>
      <div class="chiffre"><b>${euros(a.totalReel)}</b><span>dépensé à ce jour</span>
        <small>${a.nbDepenses} dépense${a.nbDepenses > 1 ? 's' : ''} saisie${a.nbDepenses > 1 ? 's' : ''}</small></div>
      <div class="chiffre ${alAtter ? 'alerte' : ''}"><b>${euros(a.atterrissage)}</b><span>coût à l'atterrissage</span>
        <small>où l'on finira si rien d'autre ne bouge</small></div>
      <div class="chiffre ${a.margeAtterrissage == null ? '' : (a.margeAtterrissage < 0 ? 'alerte' : 'gain')}">
        <b>${a.margeAtterrissage == null ? '—' : signe(a.margeAtterrissage)}</b><span>marge attendue</span>
        <small>${a.margeAtterrissage == null
          ? 'sans recette, pas de marge'
          : `recette − coût à l'atterrissage${a.recette ? ' · ' + fmtQteDevis(Math.round(a.margeAtterrissage / a.recette * 1000) / 10) + ' %' : ''}`}</small></div>

    ${state.vue === 'journal' ? rendreJournal(deps, idx)

    <section class="bloc" style="margin-top:14px;">

        ${suggestion ? `<button type="button" class="co-btn secondary sm" id="reprendreRecette">Reprendre ${euros(suggestion.total)} du devis ${escapeHtml(suggestion.numero || 'accepté')}</button>` : ''}
      </div>

/* Une rangée. Le même gabarit sert aux sections, aux groupes, aux lignes et
   aux postes calculés : un nœud, trois montants, un bouton. */
function rangHtml(n, a, d){
  const c = a.cumul.get(n.id) || vide();
  const soldes = new Set(d.soldes || []);
  const ecart = c.reel - n.prevu;
  const al = ecartAlerte(ecart, n.prevu);
  const estCharge = n.niveau === 'calcule' && String(n.id).indexOf('calc-charges-') === 0;
  const estImprevus = n.id === 'calc-imprevus';
  const estFg = n.id === 'calc-fg';
  const estFp = n.id === 'calc-fp';
  const ouvrable = n.niveau === 'groupe' && n.nbLignes > 0;
  const solde = soldes.has(n.id);
  // Un nœud soldé, ou qui porte une dépense, a un réel — même à zéro.
  const aUnReel = c.nb > 0 || estCharge || solde;

  const badges = [];
  if(n.etat === 'optionnelle') badges.push('<span class="statut-badge badge-option">Option</span>');
  if(n.etat === 'hors_devis') badges.push('<span class="statut-badge badge-option">Hors devis</span>');
  if(n.calcule) badges.push('<span class="statut-badge badge-calc">Calculé</span>');
  if(solde) badges.push(`<span class="statut-badge badge-solde">${c.reel === 0 && n.prevu > 0 ? 'Internalisé' : 'Soldé'}</span>`);

  let sous = '';
  if(n.niveau === 'ligne') sous = [n.formule, n.noms].filter(Boolean).join(' · ');
  else if(n.niveau === 'groupe') sous = `${n.nbLignes} ligne${n.nbLignes > 1 ? 's' : ''}${c.nb ? ` · ${c.nb} dépense${c.nb > 1 ? 's' : ''}` : ''}`;
  else if(estCharge){
    const ch = a.chargesLignes.find(x=> x.cle === n.cle);
    sous = ch && ch.assiette
      ? `recalculées sur les bruts réels — ${euros(ch.assiette)} × ${fmtQteDevis(ch.taux)} %`
      : `${fmtQteDevis((d.taux || {})[n.cle] || 0)} % du brut réel — aucun brut saisi`;
  }
  else if(estImprevus) sous = `provision — ${euros(a.provisionRestante)} encore disponible, ${euros(a.orphelines.reel)} consommé par ${a.orphelines.nb} dépense${a.orphelines.nb > 1 ? 's' : ''} sans prévisionnel`;
  else if(estFg) sous = 'quote-part de structure — sans facture, donc sans réel';
  else if(estFp){
    const fp = d.fichesPaie || {};
    sous = fp.nb ? `${fmtQteDevis(fp.nb)} fiche${fp.nb > 1 ? 's' : ''} × ${euros(fp.prix)} au devis` : '';
  }
  else if(n.niveau === 'section' && c.nb) sous = `${c.nb} dépense${c.nb > 1 ? 's' : ''} posée${c.nb > 1 ? 's' : ''} sur la section`;

  const saisissable = !n.calcule || n.saisissable;

  return `<div class="ligne niv-${n.niveau}${ouvrable ? ' pliable' : ''}" data-noeud="${escapeAttr(n.id)}">
    <span class="l-nom">
      ${ouvrable ? `<button type="button" class="l-chev" data-plier="${escapeAttr(n.id)}" aria-label="Déplier">${state.ouverts && state.ouverts.has(n.id) ? '▾' : '▸'}</button>` : ''}
      <span class="l-titre">${escapeHtml(n.titre)}${badges.join('')}</span>
      ${sous ? `<span class="l-sous">${escapeHtml(sous)}</span>` : ''}
    </span>
    <span class="l-num l-prevu">${n.prevu ? euros(n.prevu) : '<span class="vide">—</span>'}${
      n.memo ? `<small>${escapeHtml(euros(n.memo))} non retenu</small>` : ''}</span>
    <span class="l-num l-reel ${aUnReel ? '' : 'vide'} ${c.nb ? 'cliquable' : ''}"
      ${c.nb ? `data-detail="${escapeAttr(n.id)}" title="Voir les ${c.nb} dépense${c.nb > 1 ? 's' : ''}"` : ''}>${
      aUnReel ? euros(c.reel) : '—'}${
      c.engage ? `<small>dont ${euros(c.engage)} engagé</small>` : ''}${
      c.nbJustif ? `<small>${c.nbJustif} justificatif${c.nbJustif > 1 ? 's' : ''}</small>` : ''}</span>
    <span class="l-num l-ecart ${al ? 'alerte' : ''} ${aUnReel ? '' : 'vide'}">${
      estImprevus || estFg ? '—' : (aUnReel ? signe(ecart) : '—')}${
      aUnReel && n.prevu && !estImprevus && !estFg
        ? `<small>${fmtQteDevis(Math.round(ecart / n.prevu * 1000) / 10)} %</small>` : ''}</span>
    <span>${saisissable ? `<button type="button" class="su-plus" data-ajout="${escapeAttr(n.id)}" title="Ajouter une dépense ici">+</button>` : ''}</span>
  </div>`;
}

function rendreTableau(d, a, idx){
  const q = state.recherche.trim().toLowerCase();
  const garde = n=>{
    if(n.niveau === 'ligne' && !q && !(state.ouverts && state.ouverts.has(n.groupeId))) return false;
    if(q){
      const foin = [n.titre, n.formule, n.noms].filter(Boolean).join(' ').toLowerCase();
      if(foin.indexOf(q) < 0) return false;
    }
    const c = a.cumul.get(n.id) || vide();
    if(state.filtre === 'sansreel' && c.nb !== 0) return false;
    if(state.filtre === 'ecart' && !(c.reel - n.prevu > 0)) return false;
    if(state.filtre === 'engage' && !c.engage) return false;
    return true;
  };

  const plats = noeudsPlats(d);
  const cartes = [];

  // Une carte par section : titre en petites capitales, total à droite.
  (d.arbre || []).forEach(sec=>{
    const dedans = plats.filter(n=> n.sectionId === sec.id && n.niveau !== 'section').filter(garde);
    const tete = plats.find(n=> n.niveau === 'section' && n.id === sec.id);
    if(!dedans.length && !garde(tete)) return;
    const c = a.cumul.get(sec.id) || vide();
    const ecart = c.reel - sec.prevu;
    cartes.push(`<section class="bloc">
      <h2>${escapeHtml(sec.titre)}
        <span class="h2-total">${euros(sec.prevu)} <em>prévu</em>${c.nb || c.reel ? ` · ${euros(c.reel)} <em>réel</em> · ${signe(ecart)}` : ''}</span></h2>
      ${dedans.map(n=> rangHtml(n, a, d)).join('') || '<p class="vide">Rien ne correspond au filtre dans cette section.</p>'}
    </section>`);
  });

  // Les postes calculés, à part : ils ne se saisissent pas comme les autres.
  const calcules = plats.filter(n=> n.niveau === 'calcule').filter(garde);
  if(calcules.length) cartes.push(`<section class="bloc">
    <h2>Charges et coûts de production</h2>
    ${calcules.map(n=> rangHtml(n, a, d)).join('')}
  </section>`);

  // Les dépenses sans poste. Elles obéissent au filtre et à la recherche comme
  // les autres : chercher « studio » ne doit pas les laisser seules en bas.
  const orph = a.orphelines;
  const orphVisible = orph.nb
    && (!q || 'dépenses sans prévisionnel'.indexOf(q) >= 0)
    && (state.filtre === 'tout' || state.filtre === 'ecart' || (state.filtre === 'engage' && orph.engage));
  if(orphVisible) cartes.push(`<section class="bloc">
    <h2>Hors prévisionnel</h2>
    <div class="ligne" data-noeud="">
      <span class="l-nom"><span class="l-titre">Dépenses sans poste<span class="statut-badge badge-ajout">Ajoutées</span></span>
        <span class="l-sous">${orph.nb} dépense${orph.nb > 1 ? 's' : ''} rattachée${orph.nb > 1 ? 's' : ''} à aucun poste — c'est ce qui consomme la provision d'imprévus</span></span>
      <span class="l-num l-prevu"><span class="vide">—</span></span>
      <span class="l-num l-reel cliquable" data-detail="">${euros(orph.reel)}${orph.engage ? `<small>dont ${euros(orph.engage)} engagé</small>` : ''}</span>
      <span class="l-num l-ecart alerte">${signe(orph.reel)}</span>
      <span><button type="button" class="su-plus" data-ajout="" title="Ajouter une dépense sans poste">+</button></span>
    </div>
  </section>`);

  const alertes = [];
  if(a.horsAssiette.length){
    const somme = a.horsAssiette.reduce((s, x)=> s + x.montant, 0);
    alertes.push(`<b>${a.horsAssiette.length} dépense${a.horsAssiette.length > 1 ? 's' : ''} au régime chargeable (${euros(somme)}) est posée hors d'une section « rémunération »</b> : elle n'engendre aucune charge patronale, exactement comme au devis. Si c'est un salaire, rattache-la à une ligne de rémunération ; sinon, mets son régime à « sans charges ».`);
  }
  if((d.optionsNonLevees || {}).nb){
    alertes.push(`${d.optionsNonLevees.nb} ligne${d.optionsNonLevees.nb > 1 ? 's' : ''} optionnelle${d.optionsNonLevees.nb > 1 ? 's' : ''} (${euros(d.optionsNonLevees.montant)}) ${d.optionsNonLevees.nb > 1 ? 'sont' : 'est'} chiffrée${d.optionsNonLevees.nb > 1 ? 's' : ''} hors total. Une option levée coûte son montant <b>plus</b> ses charges et ses frais généraux.`);
  }
  if(d.remiseEcartee) alertes.push(`Une remise de ${euros(d.remiseEcartee)} figure au devis : c'est une réduction de prix consentie au client, elle n'entre pas dans un suivi de dépenses.`);

  return `
    <div class="barre">
      <button type="button" class="filtre" data-filtre="tout" aria-pressed="${state.filtre === 'tout'}">Tout</button>
      <button type="button" class="filtre" data-filtre="sansreel" aria-pressed="${state.filtre === 'sansreel'}">Sans réel</button>
      <button type="button" class="filtre" data-filtre="ecart" aria-pressed="${state.filtre === 'ecart'}">Dépassé</button>
      <button type="button" class="filtre" data-filtre="engage" aria-pressed="${state.filtre === 'engage'}">Engagé</button>
      <input type="search" class="recherche" id="rech" placeholder="Chercher un poste…" value="${escapeAttr(state.recherche)}">
      <button type="button" class="filtre" id="btnTout">${state.ouverts && state.ouverts.size ? 'Tout replier' : 'Tout déplier'}</button>
    </div>

    <div class="su-tete"><span>Poste</span><span>Prévu</span><span>Réel</span><span>Différence</span><span></span></div>
    ${cartes.join('') || `<section class="bloc"><p class="vide">Aucun poste ne correspond à ce filtre.</p></section>`}

    <section class="bloc pied">
      <h2>Où en est le projet</h2>
      <div class="ligne">
        <span class="l-nom"><span class="l-titre">Total</span>
          <span class="l-sous">hors frais généraux et imprévus, remise exclue</span></span>
        <span class="l-num l-prevu">${euros(a.totalPrevu)}</span>
        <span class="l-num l-reel">${euros(a.totalReel)}</span>
        <span class="l-num l-ecart ${ecartAlerte(a.ecart, a.totalPrevu) ? 'alerte' : ''}">${signe(a.ecart)}</span>
        <span></span>
      </div>
      <div class="ligne">
        <span class="l-nom"><span class="l-titre">Atterrissage</span>
          <span class="l-sous">pour chaque poste, le plus élevé du prévu et du dépensé — un poste soldé n'annonce que son réel — plus les charges, les frais généraux, ce qui a été dépensé sans prévisionnel et ce qui reste de la provision</span></span>
        <span class="l-num l-prevu">${euros(d.totalPrevu)}</span>
        <span class="l-num l-reel">${euros(a.atterrissage)}</span>
        <span class="l-num l-ecart ${a.atterrissage > d.totalPrevu + 200 ? 'alerte' : ''}">${signe(a.atterrissage - d.totalPrevu)}</span>
        <span></span>
      </div>
      <div class="ligne">
        <span class="l-nom"><span class="l-titre">TVA payée</span>
          <span class="l-sous">elle ne se compare pas au devis, qui calcule une TVA collectée sur une cession</span></span>
        <span class="l-num l-prevu"><span class="vide">—</span></span>
        <span class="l-num l-reel">${euros(a.tvaTotale)}</span>
        <span class="l-num l-ecart"><span class="vide">—</span></span>
        <span></span>
      </div>
      ${a.recette ? `
      <div class="ligne resultat">
        <span class="l-nom"><span class="l-titre">Recette contractuelle</span>
          <span class="l-sous">${escapeHtml((d.recette || {}).source ? 'devis ' + d.recette.source + ' — le client doit ce montant quoi qu\'il arrive' : 'saisie à la main')}</span></span>
        <span class="l-num l-prevu">${euros(a.recette)}</span>
        <span class="l-num l-reel"></span>
        <span class="l-num l-ecart"></span>
        <span></span>
      </div>
      <div class="ligne resultat">
        <span class="l-nom"><span class="l-titre">Coût du projet</span>
          <span class="l-sous">tout compris — dépenses, charges patronales, frais généraux, imprévus</span></span>
        <span class="l-num l-prevu">${euros(a.coutPrevuComplet)}</span>
        <span class="l-num l-reel">${euros(a.atterrissage)}</span>
        <span class="l-num l-ecart ${a.atterrissage > a.coutPrevuComplet + 200 ? 'alerte' : ''}">${signe(a.atterrissage - a.coutPrevuComplet)}</span>
        <span></span>
      </div>
      <div class="ligne resultat total">
        <span class="l-nom"><span class="l-titre">Marge</span>
          <span class="l-sous">recette moins coût. Chaque euro non dépensé en est un de gagné</span></span>
        <span class="l-num l-prevu">${signe(a.margePrevue)}</span>
        <span class="l-num l-reel ${a.margeAtterrissage < 0 ? 'alerte' : 'gain'}">${signe(a.margeAtterrissage)}</span>
        <span class="l-num l-ecart ${a.margeAtterrissage - a.margePrevue < 0 ? 'alerte' : 'gain'}">${signe(a.margeAtterrissage - a.margePrevue)}</span>
        <span></span>
      </div>` : ''}
      <p class="avert">${a.recette
        ? `<b>La marge ne compte que la cession.</b> Subventions, coproductions, aides à l'emploi et billetterie ne sont pas encore suivies : si le projet en porte, le résultat réel est plus élevé que celui-ci.`
        : `<b>Aucune recette renseignée.</b> Tant qu'elle manque, la colonne « différence » dit si le budget tient, mais rien ne dit si le projet gagne de l'argent — renseigne la cession en bas de page.`}</p>
      ${alertes.map(x=> `<p class="avert">${x}</p>`).join('')}
    </section>`;
}

// ---------------------------------------------------------------- le journal
function nomNoeud(idx, id){
  const c = idx.get(id);
  if(!c) return 'sans poste';
  if(c.niveau === 'ligne') return c.ligne.intitule || 'ligne sans intitulé';
  if(c.niveau === 'groupe') return c.groupe.titre || 'groupe sans titre';
  if(c.niveau === 'calcule') return c.calcule.titre;
  return c.section.titre;
}

function ligneJournal(dep, idx){
  const detail = dep.quantite != null && dep.prixUnitaire != null
    ? `${fmtQteDevis(dep.quantite)} × ${euros(dep.prixUnitaire)}` : '';
  return `<div class="jl">
    <span class="jdate">${escapeHtml(dep.dateDepense || '—')}</span>
    <span class="jnom"><b>${escapeHtml(dep.libelle || 'Sans libellé')}</b>
      <small>${escapeHtml([dep.fournisseur, nomNoeud(idx, dep.noeudId), detail,
        dep.statut === 'engage' ? 'engagé' : ''].filter(Boolean).join(' · '))}</small></span>
    <span class="l-num">${euros(dep.montantHt)}${dep.montantTva ? `<small>+ ${euros(dep.montantTva)} TVA</small>` : ''}</span>
    <span class="jact">
      ${dep.justificatifUrl ? `<a class="mini" href="${escapeAttr(dep.justificatifUrl)}" target="_blank" rel="noopener" title="Justificatif">Pièce</a>` : ''}
      <button type="button" class="mini" data-modif="${escapeAttr(dep.id)}">Modifier</button>
      <button type="button" class="mini danger" data-suppr="${escapeAttr(dep.id)}">Retirer</button>
    </span>
  </div>`;
}

function rendreJournal(deps, idx){
  const q = state.recherche.trim().toLowerCase();
  const tri = deps.slice().sort((a, b)=> String(b.dateDepense || '').localeCompare(String(a.dateDepense || ''))
    || String(b.id).localeCompare(String(a.id)));
  const gardes = tri.filter(dep=> !q
    || [dep.libelle, dep.fournisseur, dep.note, nomNoeud(idx, dep.noeudId)].filter(Boolean).join(' ').toLowerCase().indexOf(q) >= 0);
  return `<section class="bloc">
    <h2>Journal des dépenses<span class="h2-total">${gardes.length} ligne${gardes.length > 1 ? 's' : ''}</span></h2>
    <input type="search" class="recherche" id="rechJ" placeholder="Chercher une dépense…" value="${escapeAttr(state.recherche)}" style="width:100%; margin-bottom:8px;">
    ${gardes.map(dep=> ligneJournal(dep, idx)).join('') || `<p class="vide">Aucune dépense saisie.</p>`}
  </section>`;
}

/* LE BILAN À L'ÉCRAN. Les mêmes chiffres que le PDF, au même endroit dans
   l'ordre de lecture : le résultat, où est parti l'argent, ce qui explique
   l'écart, ce qui reste en suspens. Rien n'est calculé ici — bilanDuSuivi() a
   déjà tout fait, et c'est ce qui garantit que l'écran et le papier disent la
   même chose. */
function barre(part, teinte){
  return `<span class="barre-part" style="--p:${Math.round(part * 1000) / 10}%; --t:${teinte};"></span>`;
}

function rendreBilan(d, deps, idx){
  const b = bilanDuSuivi(d, deps);
  const r = b.resultat;
  const pc = x=> fmtQteDevis(Math.round(x * 1000) / 10) + ' %';
  const cinq = (liste, teinte)=> liste.slice(0, 5).map(x=> `<div class="ligne">
      <span class="l-nom"><span class="l-titre">${escapeHtml(x.titre)}</span>

      <span class="l-num l-reel">${euros(x.reel)}</span>
      <span class="l-num l-ecart ${teinte}">${signe(x.ecart)}</span>
      <span></span>
    </div>`).join('');

  return `
    <div class="barre" style="justify-content:flex-end;">
      <button type="button" class="co-btn primary md" id="btnBilanPdf">PDF du bilan</button>
    </div>

    <section class="bloc">
      <h2>Résultat${r.clos ? '' : ' — situation en cours'}</h2>
      ${r.recette ? `
      <div class="ligne resultat">
        <span class="l-nom"><span class="l-titre">Recette contractuelle</span>
          <span class="l-sous">${escapeHtml((d.recette || {}).source ? 'devis ' + d.recette.source : 'saisie à la main')}</span></span>
        <span class="l-num l-prevu">${euros(r.recette)}</span>
        <span class="l-num l-reel">${euros(r.recette)}</span>
        <span class="l-num l-ecart"><span class="vide">—</span></span><span></span>
      </div>
      <div class="ligne resultat">
        <span class="l-nom"><span class="l-titre">Coût du projet</span>
          <span class="l-sous">charges patronales, frais généraux et imprévus compris</span></span>
        <span class="l-num l-prevu">${euros(r.coutPrevu)}</span>
        <span class="l-num l-reel">${euros(r.coutAtterrissage)}</span>
        <span class="l-num l-ecart ${r.coutAtterrissage > r.coutPrevu ? 'alerte' : ''}">${signe(r.coutAtterrissage - r.coutPrevu)}</span><span></span>
      </div>
      <div class="ligne resultat total">
        <span class="l-nom"><span class="l-titre">Marge</span>
          <span class="l-sous">${r.gagneSurPlan >= 0 ? 'gagné' : 'perdu'} ${escapeHtml(euros(Math.abs(r.gagneSurPlan)))} par rapport au devis</span></span>
        <span class="l-num l-prevu">${signe(r.margePrevue)}</span>
        <span class="l-num l-reel ${r.margeAtterrissage < 0 ? 'alerte' : 'gain'}">${signe(r.margeAtterrissage)}</span>
        <span class="l-num l-ecart ${r.margeAtterrissage < 0 ? 'alerte' : 'gain'}">${r.recette ? pc(r.margeAtterrissage / r.recette) : ''}</span><span></span>
      </div>`
      : `<p class="vide">Aucune recette renseignée : ce bilan dit ce que le projet a coûté, pas ce qu'il a rapporté.
         Renseigne la cession en bas de page.</p>`}
    </section>

    <section class="bloc">
      <h2>Où est parti l'argent<span class="h2-total">${euros(b.coutTotal)} <em>au total</em></span></h2>
      ${b.parSection.map(x=> `<div class="ligne">
        <span class="l-nom"><span class="l-titre">${escapeHtml(x.titre)}${x.quotePart ? '<span class="statut-badge badge-calc">Quote-part</span>' : ''}</span>
          <span class="l-sous">${barre(x.part, x.calcule ? 'var(--muted)' : 'var(--accent)')} ${pc(x.part)}${x.nb ? ` · ${x.nb} dépense${x.nb > 1 ? 's' : ''}` : ''}</span></span>
        <span class="l-num l-prevu">${euros(x.prevu)}</span>
        <span class="l-num l-reel">${euros(x.reel)}</span>
        <span class="l-num l-ecart ${x.prevu && x.reel > x.prevu ? 'alerte' : ''}">${x.prevu ? signe(x.reel - x.prevu) : '—'}</span>
        <span></span>
      </div>`).join('')}
      <p class="avert">Masse salariale — bruts et charges patronales — <b>${euros(b.masseSalariale)}</b>,
        soit ${pc(b.partMasseSalariale)} du coût réel. TVA payée ${euros(b.tva)}, hors de ces montants.</p>
    </section>

    ${b.derapages.length ? `<section class="bloc">
      <h2>Ce qui a dérapé<span class="h2-total">${b.derapages.length} poste${b.derapages.length > 1 ? 's' : ''}</span></h2>

    ${b.economies.length ? `<section class="bloc">
      <h2>Ce qu'on a économisé<span class="h2-total">${b.economies.length} poste${b.economies.length > 1 ? 's' : ''}</span></h2>

      ${b.internalises.map(x=> `<div class="ligne">
        <span class="l-nom"><span class="l-titre">${escapeHtml(x.titre)}</span>
          <span class="l-sous">facturé au client, assuré en interne${x.taux ? ` — et ${fmtQteDevis(x.taux)} % de charges patronales évitées` : ''}</span></span>
        <span class="l-num l-prevu">${euros(x.prevu)}</span>
        <span class="l-num l-reel">${euros(0)}</span>
        <span class="l-num l-ecart gain">${signe(x.economie)}</span><span></span>
      </div>`).join('')}
    </section>` : ''}

    <section class="bloc">
      <h2>Compteurs</h2>
      <div class="compteurs">
        ${[
          ['Dépenses enregistrées', b.compteurs.depenses],
          ['Fournisseurs distincts', b.compteurs.fournisseurs],
          ['Dépense moyenne', euros(b.compteurs.montantMoyen)],
          ['Postes renseignés', `${b.compteurs.postesTouches} / ${b.compteurs.postesPrevus}`],
          ['Reste à engager', euros(b.resteAEngager)],
          ['Engagé non payé', euros(b.compteurs.montantEngage)],
          ['Provision d\'imprévus restante', euros(b.provisionRestante)],
          ['Période couverte', b.compteurs.premiere ? `${b.compteurs.premiere} → ${b.compteurs.derniere}` : '—'],
        ].map(([k, v])=> `<div class="compteur"><b>${escapeHtml(String(v))}</b><span>${escapeHtml(k)}</span></div>`).join('')}
      </div>

    <section class="bloc pied">

      ${reservesBilan(b).map(x=> `<p class="avert">${escapeHtml(x)}</p>`).join('')}

}

/* Les dépenses d'un poste, dépliées sous la ligne : c'est là qu'on corrige une
   erreur de frappe ou qu'on retire une facture saisie deux fois. On y arrive
   en cliquant le montant réel, qui est justement ce qu'on trouve suspect. */
function ouvrirDetail(noeudId){
  fermerDetail();
  state.detail = noeudId;
  const idx = indexerNoeuds(state.suivi.data || {});
  const liste = depensesDuNoeud(noeudId);
  const rang = document.querySelector(`.ligne[data-noeud="${CSS.escape(noeudId || '')}"]`);
  if(!rang) return;
  const boite = document.createElement('div');
  boite.className = 'bloc';
  boite.id = 'detailNoeud';
  boite.style.cssText = 'margin:2px 0 10px; background:var(--bg);';
  boite.innerHTML = `<h2>${escapeHtml(nomNoeud(idx, noeudId))}
      <span class="h2-total">${liste.length} dépense${liste.length > 1 ? 's' : ''}</span></h2>
    ${liste.map(dep=> ligneJournal(dep, idx)).join('')}
    <div style="padding:8px 0 10px;"><button type="button" class="mini" id="fermerDetail">Fermer</button></div>`;
  rang.insertAdjacentElement('afterend', boite);
  boite.querySelectorAll('[data-modif]').forEach(b=> b.addEventListener('click', ()=>{
    const dep = state.depenses.find(x=> x.id === b.dataset.modif);
    if(dep) ouvrirFiche(Object.assign({}, dep));
  }));
  boite.querySelectorAll('[data-suppr]').forEach(b=> b.addEventListener('click', ()=> retirer(b.dataset.suppr)));
  document.getElementById('fermerDetail').addEventListener('click', ()=>{ fermerDetail(); state.detail = null; });
}
function fermerDetail(){
  const b = document.getElementById('detailNoeud');
  if(b) b.remove();
}

// ---------------------------------------------------------------- la saisie
/* La fiche. Deux façons de chiffrer une dépense, et il faut les deux :
   — UNE FACTURE GLOBALE : un montant, point. C'est le cas le plus courant.
   — UNE QUANTITÉ × UN PRIX UNITAIRE : 330 repas à 20 €, 85 fiches de paie à
     28 €, 12 nuitées à 95 €. Le montant en découle et ne se tape pas.
   Le mode se choisit d'un bouton, et la dépense garde le détail : le journal et
   l'export le restituent, la compta le lit sans se demander d'où sort le total.

   ZÉRO EURO EST UNE RÉPONSE VALABLE. Un poste facturé au client mais assuré en
   interne coûte 0 € : il faut pouvoir l'écrire, avec un libellé qui le dit. La
   case « rien de plus à dépenser ici » fait alors tomber l'atterrissage du
   poste à son réel — sans elle, il continuerait d'annoncer son prévisionnel
   jusqu'à la clôture. */
function contexteNoeud(idx, noeudId){
  const cible = noeudId ? idx.get(noeudId) : null;
  const nom = !cible ? 'Aucun poste — comptée dans les dépenses sans prévisionnel'
    : cible.niveau === 'ligne' ? `${cible.section.titre} › ${cible.groupe.titre || 'Autres lignes'} › ${cible.ligne.intitule}`
    : cible.niveau === 'groupe' ? `${cible.section.titre} › ${cible.groupe.titre || 'Autres lignes'}`
    : cible.niveau === 'calcule' ? cible.calcule.titre
    : cible.section.titre;
  const prevu = !cible ? 0
    : cible.niveau === 'ligne' ? cible.ligne.prevu
    : cible.niveau === 'groupe' ? cible.groupe.prevu
    : cible.niveau === 'calcule' ? cible.calcule.prevu
    : cible.section.prevu;
  return { cible, nom, prevu };
}

function ficheHtml(dep, idx, data){
  const { cible, nom, prevu } = contexteNoeud(idx, dep.noeudId);
  const reg = regimeEffectif(dep, cible);
  const chargeable = DEVIS_REGIMES_CHARGES.indexOf(reg) >= 0;
  const herite = !dep.regime && cible && cible.niveau === 'ligne';
  const detaille = dep._mode === 'quantite' || (dep._mode == null && dep.quantite != null && dep.prixUnitaire != null);
  const solde = new Set(data.soldes || []).has(dep.noeudId || '');
  const ttc = state.saisieTtc !== false;
  const valMontant = dep.montantHt || dep.montantTva
    ? String(Math.round((ttc ? dep.montantHt + dep.montantTva : dep.montantHt) * 100) / 100).replace('.', ',') : '';

  return `<div class="voile" id="voile">
    <div class="fiche" role="dialog" aria-label="Saisir une dépense">
      <h3>${dep._neuve ? 'Nouvelle dépense' : 'Modifier la dépense'}</h3>
      <p class="cible">${escapeHtml(nom)}${prevu ? ` — prévu ${euros(prevu)}` : ''}</p>

      <div class="bascule">
        <button type="button" data-mode="global" aria-pressed="${!detaille}">Facture globale</button>
        <button type="button" data-mode="quantite" aria-pressed="${detaille}">Quantité × prix</button>
      </div>

      ${detaille ? `
        <div class="champs">
          <div class="champ"><label for="fQte">Nombre</label>
            <input type="text" inputmode="decimal" id="fQte" value="${dep.quantite != null ? escapeAttr(String(dep.quantite).replace('.', ',')) : ''}" placeholder="85"></div>
          <div class="champ"><label for="fPu">Prix unitaire HT</label>
            <input type="text" inputmode="decimal" id="fPu" value="${dep.prixUnitaire != null ? escapeAttr(String(dep.prixUnitaire).replace('.', ',')) : ''}" placeholder="28,00"></div>
          <div class="champ"><label for="fMontant">Montant HT</label>
            <input type="text" id="fMontant" value="${dep.montantHt ? escapeAttr(String(dep.montantHt).replace('.', ',')) : ''}" disabled></div>
          <div class="champ"><label for="fTva">TVA (${fmtQteDevis(data.tvaDefaut)} % par défaut)</label>
            <input type="text" inputmode="decimal" id="fTva" value="${dep.montantTva ? escapeAttr(String(dep.montantTva).replace('.', ',')) : ''}" placeholder="0,00"></div>
        </div>` : `
        <div class="bascule">
          <button type="button" data-saisie="ttc" aria-pressed="${ttc}">Je tape le TTC</button>
          <button type="button" data-saisie="ht" aria-pressed="${!ttc}">Je tape le HT</button>
        </div>
        <div class="champs">
          <div class="champ"><label for="fMontant">${ttc ? 'Montant TTC' : 'Montant HT'}</label>
            <input type="text" inputmode="decimal" id="fMontant" value="${valMontant}" placeholder="0,00"></div>
          <div class="champ"><label for="fTva">TVA (${fmtQteDevis(data.tvaDefaut)} % par défaut)</label>
            <input type="text" inputmode="decimal" id="fTva" value="${dep.montantTva ? escapeAttr(String(dep.montantTva).replace('.', ',')) : ''}" placeholder="0,00"></div>
        </div>`}

      <div class="champs" style="margin-top:10px;">
        <div class="champ large"><label for="fLibelle">Libellé</label>
          <input type="text" id="fLibelle" value="${escapeAttr(dep.libelle || '')}" list="listeLibelles" placeholder="Tourbus, hôtel, cachets J1, poste internalisé…"></div>
        <div class="champ"><label for="fFournisseur">Fournisseur</label>
          <input type="text" id="fFournisseur" value="${escapeAttr(dep.fournisseur || '')}" list="listeFournisseurs"></div>
        <div class="champ"><label for="fDate">Date</label>
          <input type="date" id="fDate" value="${escapeAttr(dep.dateDepense || '')}"></div>
        <div class="champ"><label for="fStatut">État</label>
          <select id="fStatut">
            <option value="paye" ${dep.statut === 'paye' ? 'selected' : ''}>Payé</option>
            <option value="engage" ${dep.statut === 'engage' ? 'selected' : ''}>Engagé — contrat signé, pas encore payé</option>
          </select></div>
        <div class="champ"><label for="fRegime">Régime de charges</label>
          <select id="fRegime">
            <option value="">${herite ? `Celui de la ligne — ${escapeHtml((DEVIS_REGIMES.find(r=> r[0] === reg) || [,'sans charges'])[1])}` : 'Sans charges'}</option>
            ${DEVIS_REGIMES.map(r=> `<option value="${r[0]}" ${dep.regime === r[0] ? 'selected' : ''}>${escapeHtml(r[1])}</option>`).join('')}
          </select></div>
        <div class="champ large"><label for="fJustif">Lien du justificatif sur le Drive</label>
          <input type="url" id="fJustif" value="${escapeAttr(dep.justificatifUrl || '')}" placeholder="https://drive.google.com/file/…"></div>
        <div class="champ large"><label for="fNote">Note</label>
          <input type="text" id="fNote" value="${escapeAttr(dep.note || '')}"></div>
      </div>

      ${chargeable ? `<div class="garde">Ce poste porte des charges patronales (${fmtQteDevis((data.taux || {})[reg] || 0)} %).
        Saisis le <b>brut employeur</b> : les charges sont recalculées toutes seules et s'affichent sur leur propre rangée.</div>` : ''}
      <div id="fGarde"></div>

      ${dep.noeudId ? `<label class="coche">
        <input type="checkbox" id="fSolde" ${solde ? 'checked' : ''}>
        <span><b>Rien de plus à dépenser sur ce poste</b>
        Son atterrissage tombe à ce qui a été réellement dépensé. À cocher pour un poste terminé,
        ou facturé au client et assuré en interne — il coûte alors 0 €, et l'écart est une marge.</span>
      </label>` : ''}

      <div class="fiche-actions">
        <button type="button" class="co-btn primary md" id="fValider">${dep._neuve ? 'Ajouter' : 'Enregistrer'}</button>
        <button type="button" class="co-btn ghost md" id="fAnnuler">Annuler</button>
        ${!dep._neuve ? `<button type="button" class="mini" id="fNomFichier">Copier le nom de fichier</button>
          <button type="button" class="mini danger" id="fRetirer" style="margin-left:auto;">Retirer cette dépense</button>` : ''}
      </div>
    </div>
    <datalist id="listeLibelles">${[...new Set(state.depenses.map(x=> x.libelle).filter(Boolean))].map(x=> `<option value="${escapeAttr(x)}">`).join('')}</datalist>
    <datalist id="listeFournisseurs">${[...new Set(state.depenses.map(x=> x.fournisseur).filter(Boolean))].map(x=> `<option value="${escapeAttr(x)}">`).join('')}</datalist>
  </div>`;
}

function ouvrirFiche(dep){
  fermerFiche();
  const d = state.suivi.data || {};
  const idx = indexerNoeuds(d);
  // Les fiches de paie se comptent : la fiche s'ouvre déjà en « quantité ×
  // prix », avec le prix unitaire du devis.
  if(dep.noeudId === 'calc-fp' && dep._neuve && dep.quantite == null){
    dep._mode = 'quantite';
    dep.prixUnitaire = (d.fichesPaie || {}).prix || null;
  }
  const hote = document.createElement('div');
  hote.innerHTML = ficheHtml(dep, idx, d);
  document.body.appendChild(hote.firstElementChild);
  brancherFiche(dep, idx, d);
}

function fermerFiche(){
  const v = document.getElementById('voile');
  if(v) v.remove();
}

function brancherFiche(dep, idx, data){
  const { cible, prevu } = contexteNoeud(idx, dep.noeudId);
  const detaille = !!document.getElementById('fQte');
  const champMontant = document.getElementById('fMontant');
  const champTva = document.getElementById('fTva');
  const champQte = document.getElementById('fQte');
  const champPu = document.getElementById('fPu');
  const garde = document.getElementById('fGarde');

  let tvaTouchee = !!dep.montantTva;
  champTva.addEventListener('input', ()=> { tvaTouchee = true; });

  function ht(){
    if(detaille) return Math.round(nb(champQte.value) * nb(champPu.value) * 100) / 100;
    const saisi = nb(champMontant.value);
    return state.saisieTtc === false ? saisi : saisi - nb(champTva.value);
  }
  function majTva(){
    if(tvaTouchee) return;
    const base = detaille ? ht() : nb(champMontant.value);
    if(!base){ champTva.value = ''; return; }
    const taux = devisNombre(data.tvaDefaut, 20);
    const tva = (detaille || state.saisieTtc === false) ? base * taux / 100 : base - base / (1 + taux / 100);
    champTva.value = String(Math.round(tva * 100) / 100).replace('.', ',');
  }
  function majGarde(){
    const reg = document.getElementById('fRegime').value || regimeEffectif({ regime: '' }, cible);
    const msg = alerteBrutCharge(ht(), prevu, reg, data.taux);
    garde.innerHTML = msg ? `<div class="garde">${escapeHtml(msg)}</div>` : '';
  }
  function majCalcul(){
    if(detaille) champMontant.value = String(ht()).replace('.', ',');
    majTva(); majGarde();
  }
  [champMontant, champQte, champPu].forEach(c=> c && c.addEventListener('input', majCalcul));
  document.getElementById('fRegime').addEventListener('change', majGarde);
  majGarde();

  function lire(base){
    return Object.assign({}, base, {
      libelle: document.getElementById('fLibelle').value.trim(),
      fournisseur: document.getElementById('fFournisseur').value.trim(),
      dateDepense: document.getElementById('fDate').value || '',
      montantHt: Math.round(ht() * 100) / 100,
      montantTva: Math.round(nb(champTva.value) * 100) / 100,
      quantite: detaille && champQte.value.trim() !== '' ? nb(champQte.value) : null,
      prixUnitaire: detaille && champPu.value.trim() !== '' ? nb(champPu.value) : null,
      regime: document.getElementById('fRegime').value,
      statut: document.getElementById('fStatut').value,
      justificatifUrl: document.getElementById('fJustif').value.trim(),
      note: document.getElementById('fNote').value.trim(),
    });
  }

  // Changer de mode ne doit pas perdre ce qui est déjà tapé.
  document.querySelectorAll('[data-mode]').forEach(b=> b.addEventListener('click', ()=>{
    const courant = lire(dep);
    courant._mode = b.dataset.mode;
    courant._neuve = dep._neuve;
    ouvrirFiche(courant);
  }));
  document.querySelectorAll('[data-saisie]').forEach(b=> b.addEventListener('click', ()=>{
    state.saisieTtc = b.dataset.saisie === 'ttc';
    try{ localStorage.setItem('curieux-suivi-ttc', state.saisieTtc ? '1' : '0'); }catch(e){}
    const courant = lire(dep);
    courant._neuve = dep._neuve;
    ouvrirFiche(courant);
  }));

  async function majSolde(){
    const coche = document.getElementById('fSolde');
    if(!coche || !dep.noeudId) return false;
    const soldes = new Set(state.suivi.data.soldes || []);
    const avant = soldes.has(dep.noeudId);
    if(coche.checked === avant) return false;
    if(coche.checked) soldes.add(dep.noeudId); else soldes.delete(dep.noeudId);
    state.suivi.data.soldes = [...soldes];
    await enregistrerSuivi();
    return true;
  }

  async function valider(rouvrir){
    const neuve = lire(dep);
    delete neuve._neuve; delete neuve._mode;
    // ZÉRO EST UNE RÉPONSE, à condition de dire laquelle : un montant nul sans
    // libellé est une fiche ouverte par mégarde, pas un poste internalisé.
    if(!neuve.montantHt && !neuve.montantTva && !neuve.libelle){
      document.getElementById('fLibelle').focus();
      garde.innerHTML = `<div class="garde">Un montant de 0 € demande un libellé — « poste internalisé », « pris en charge par le client »… — sans quoi on ne saura pas, dans six mois, si c'est une décision ou un oubli.</div>`;
      return;
    }
    const { error } = await CurieuxDB.upsertOne('depenses', neuve);
    if(error){ alert("La dépense n'a pas pu être enregistrée :\n\n" + error.message); return; }
    const i = state.depenses.findIndex(x=> x.id === neuve.id);
    if(i >= 0) state.depenses[i] = neuve; else state.depenses.push(neuve);
    await majSolde();
    fermerFiche();
    rendre();
    if(rouvrir) ouvrirFiche(Object.assign(nouvelleDepense(state.suivi.id, dep.noeudId, AUJOURDHUI), { _neuve: true }));
  }

  document.getElementById('fValider').addEventListener('click', ()=> valider(false));
  document.getElementById('fAnnuler').addEventListener('click', async ()=>{
    // La case « soldé » décrit le POSTE, pas la dépense : elle vaut même si
    // l'on renonce à saisir quoi que ce soit.
    if(await majSolde()){ fermerFiche(); rendre(); return; }
    fermerFiche();
  });
  document.getElementById('voile').addEventListener('click', e=>{ if(e.target.id === 'voile') fermerFiche(); });
  document.querySelectorAll('.fiche input:not([type="checkbox"])').forEach(i=> i.addEventListener('keydown', e=>{
    if(e.key === 'Enter'){ e.preventDefault(); valider(dep._neuve); }
  }));
  const nomBtn = document.getElementById('fNomFichier');
  if(nomBtn) nomBtn.addEventListener('click', async ()=>{
    const nom = nomFichierJustificatif(lire(dep));
    try{ await navigator.clipboard.writeText(nom); nomBtn.textContent = 'Copié : ' + nom; }
    catch(e){ nomBtn.textContent = nom; }
  });
  const retirerBtn = document.getElementById('fRetirer');
  if(retirerBtn) retirerBtn.addEventListener('click', ()=>{ fermerFiche(); retirer(dep.id); });
  document.getElementById(detaille ? 'fQte' : 'fMontant').focus();
}

// ---------------------------------------------------------------- branchements
function brancher(d, a, idx, deps){
  const plier = id=>{
    if(!state.ouverts) state.ouverts = new Set();
    if(state.ouverts.has(id)) state.ouverts.delete(id); else state.ouverts.add(id);
    rendre();
  };
  document.querySelectorAll('[data-plier]').forEach(b=> b.addEventListener('click', e=>{
    e.stopPropagation(); plier(b.dataset.plier);
  }));
  document.querySelectorAll('.ligne.pliable > .l-nom').forEach(el=>
    el.addEventListener('click', ()=> plier(el.parentElement.dataset.noeud)));

  document.querySelectorAll('[data-filtre]').forEach(b=> b.addEventListener('click', ()=>{
    state.filtre = b.dataset.filtre; rendre();
  }));
  const btnTout = document.getElementById('btnTout');
  if(btnTout) btnTout.addEventListener('click', ()=>{
    if(state.ouverts && state.ouverts.size) state.ouverts = new Set();
    else {
      state.ouverts = new Set();
      noeudsPlats(d).forEach(n=> { if(n.niveau === 'groupe') state.ouverts.add(n.id); });
    }
    rendre();
  });
  ['rech', 'rechJ'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('input', ()=>{
      state.recherche = el.value;
      const pos = el.selectionStart;
      rendre();
      const neuf = document.getElementById(id);
      if(neuf){ neuf.focus(); try{ neuf.setSelectionRange(pos, pos); }catch(e){} }
    });
  });
  document.querySelectorAll('[data-ajout]').forEach(b=> b.addEventListener('click', ()=>{
    ouvrirFiche(Object.assign(nouvelleDepense(state.suivi.id, b.dataset.ajout, AUJOURDHUI), { _neuve: true }));
  }));
  document.querySelectorAll('[data-detail]').forEach(b=> b.addEventListener('click', ()=>{
    const id = b.dataset.detail;
    if(state.detail === id){ fermerDetail(); state.detail = null; }
    else ouvrirDetail(id);
  }));
  document.querySelectorAll('[data-modif]').forEach(b=> b.addEventListener('click', ()=>{
    const dep = state.depenses.find(x=> x.id === b.dataset.modif);
    if(dep) ouvrirFiche(Object.assign({}, dep));
  }));
  document.querySelectorAll('[data-suppr]').forEach(b=> b.addEventListener('click', ()=> retirer(b.dataset.suppr)));

  document.querySelectorAll('[data-vue]').forEach(b=> b.addEventListener('click', ()=>{
    state.vue = b.dataset.vue; state.recherche = ''; state.detail = null; rendre();
  }));
  const btnPdf = document.getElementById('btnBilanPdf');
  if(btnPdf) btnPdf.addEventListener('click', ()=>{
    try{ genererBilanPdf(Object.assign({}, state.suivi, { _depenses: deps }), projetDe((state.devis.find(x=> x.id === state.suivi.budgetId) || {}).tourneeId), state.reglages); }
    catch(e){ alert("Le PDF n'a pas pu être généré :\n\n" + e.message); }
  });
  const btnCsv = document.getElementById('btnCsv');
  if(btnCsv) btnCsv.addEventListener('click', ()=> exporterCsv(d, idx, deps));

  const majRecette = async ()=>{
    state.suivi.data.recette = {
      montantHt: Math.round(devisNombre(document.getElementById('recetteHt').value, 0) * 100) / 100,
      source: document.getElementById('recetteSource').value.trim(),
    };
    if(await enregistrerSuivi()) rendre();
  };
  ['recetteHt', 'recetteSource'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', majRecette);
  });
  const reprendre = document.getElementById('reprendreRecette');
  if(reprendre) reprendre.addEventListener('click', async ()=>{
    const x = state.devis.find(y=> y.projetId === state.suivi.projetId && y.statut === 'accepte');
    if(!x) return;
    state.suivi.data.recette = { montantHt: Math.round(calculerDevis(x).totalHT * 100) / 100, source: x.numero || 'accepté' };
    if(await enregistrerSuivi()) rendre();
  });

  const drive = document.getElementById('driveUrl');
  if(drive) drive.addEventListener('change', async ()=>{
    state.suivi.data.driveUrl = drive.value.trim();
    if(await enregistrerSuivi()) rendre();
  });

  // Le détail rouvert après un rendu : on ne perd pas la liste qu'on consultait.
  if(state.detail !== null && state.vue === 'tableau') ouvrirDetail(state.detail);
}

/* Retirer une dépense. Quinze secondes pour se raviser : la suppression n'est
   envoyée qu'à la fermeture du ruban, sans quoi « Annuler » recréerait une
   ligne d'un autre identifiant et l'historique raconterait deux gestes. */
function retirer(id){
  const dep = state.depenses.find(x=> x.id === id);
  if(!dep) return;
  state.depenses = state.depenses.filter(x=> x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `« ${dep.libelle || 'Dépense'} » retirée`,
    retablir: ()=>{ state.depenses.push(dep); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('depenses', id); },
  });
}

/* L'export. Une ligne par dépense, avec son poste en clair : c'est ce fichier
   que reçoit la compta, et elle ne connaît pas nos identifiants. Point-virgule
   et BOM, pour qu'Excel français l'ouvre sans rien demander. */
function exporterCsv(d, idx, deps){
  const chemin = id=>{
    const c = idx.get(id);
    if(!c) return '(sans poste)';
    if(c.niveau === 'ligne') return `${c.section.titre} > ${c.groupe.titre || 'Autres lignes'} > ${c.ligne.intitule}`;
    if(c.niveau === 'groupe') return `${c.section.titre} > ${c.groupe.titre || 'Autres lignes'}`;
    if(c.niveau === 'calcule') return c.calcule.titre;
    return c.section.titre;
  };
  const q = v=> `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
  const n2 = v=> v == null ? '' : String(Math.round(devisNombre(v, 0) * 100) / 100).replace('.', ',');
  const entetes = ['DATE', 'LIBELLE', 'FOURNISSEUR', 'POSTE', 'QUANTITE', 'PRIX UNITAIRE',
                   'MONTANT HT', 'TVA', 'MONTANT TTC', 'REGIME', 'ETAT', 'JUSTIFICATIF', 'NOTE'];
  const lignes = deps.slice()
    .sort((a, b)=> String(a.dateDepense || '').localeCompare(String(b.dateDepense || '')))
    .map(x=> [x.dateDepense || '', x.libelle || '', x.fournisseur || '', chemin(x.noeudId),
              n2(x.quantite), n2(x.prixUnitaire),
              n2(x.montantHt), n2(x.montantTva), n2(x.montantHt + x.montantTva),
              (DEVIS_REGIMES.find(r=> r[0] === regimeEffectif(x, idx.get(x.noeudId))) || [,''])[1],
              SUIVI_STATUTS[x.statut] || x.statut, x.justificatifUrl || '', x.note || ''].map(q).join(';'));
  const csv = '﻿' + [entetes.map(q).join(';'), ...lignes].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = `Depenses_${(d.titre || 'suivi').replace(/[^\w\-]+/g, '_')}_${AUJOURDHUI}.csv`;
  a.click();
  setTimeout(()=> URL.revokeObjectURL(a.href), 2000);
}

try{ state.saisieTtc = localStorage.getItem('curieux-suivi-ttc') !== '0'; }catch(e){ state.saisieTtc = true; }
applyAutoTheme();
charger();
