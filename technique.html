<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Direction technique</title>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/db.js"></script>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<script src="assets/global-search.js"></script>
<script>try{ hideCurieuxPageUntilAuth(); injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); injectBugReportWidget(); document.addEventListener('DOMContentLoaded', requireDirectionTechniqueAuth); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  .wrap{max-width:900px; margin:0 auto; font-variant-numeric:tabular-nums;}
  .tournee-select{padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; background:var(--card); color:var(--text); font-family:inherit; margin-bottom:18px;}

  .banniere-alerte{display:flex; gap:11px; align-items:flex-start; background:var(--danger-tint); border-radius:var(--radius); padding:13px 15px; margin-bottom:16px;}
  .banniere-alerte .sig{color:var(--danger); font-weight:900; font-size:15px; line-height:1.4; flex:0 0 auto;}
  .banniere-alerte p{margin:0; font-size:13.5px; line-height:1.5;}

  .date-card{
    display:block; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px; transition:border-color .15s, transform .1s;
  }
  .date-card:hover{border-color:var(--accent); transform:translateY(-1px);}
  .date-card-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:9px;}
  .date-card-nom{font-weight:800; font-size:15px;}
  .date-card-quand{font-size:12px; color:var(--muted);}
  .puces{display:flex; flex-wrap:wrap; gap:6px;}
  .puce{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .p-ok{background:var(--ok-tint); color:var(--ok);}
  .p-att{background:var(--maybe-tint); color:var(--maybe);}
  .p-non{background:var(--danger-tint); color:var(--danger);}
  .p-neutre{background:var(--border); color:var(--muted);}

  .empty-hint{color:var(--muted); font-size:13.5px; padding:40px 4px; text-align:center;}
  @media (max-width:600px){ input, select{ font-size:16px !important; } }
</style>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="wrap">
  <div class="brand-header">
    <a href="accueil.html"><img class="brand-logo-img" alt="Curieux orchestre"></a>
    <nav class="page-nav" data-curieux-nav></nav>
  </div>
  <h1>Direction technique</h1>
  <p class="subtitle">L'avancement, date par date.</p>

  <div class="banniere-alerte" id="migrationBanner" style="display:none;">
    <span class="sig">!</span>
    <p>Les tables de cet espace ne sont pas à jour dans Supabase. Colle la dernière section « Direction technique » de <code>migrations.sql</code> dans l'éditeur SQL, puis recharge cette page.</p>
  </div>

  <select class="tournee-select" id="tourneeSelect"></select>

  <div id="dates"></div>
  <div class="empty-hint" id="datesEmpty" style="display:none;">Aucune date à venir pour cette tournée.</div>
</div>

<script>
let tourneesCache = [];
let moyensCache = [];
let carnetsCache = [];
let vehiculesCache = [];
let fichesCache = [];

function activeTourneeId(){ return document.getElementById('tourneeSelect').value; }
function activeTournee(){ return tourneesCache.find(t=>t.id === activeTourneeId()); }
function idMoyens(tourneeId, dateId){ return `${tourneeId}::${dateId}`; }
function moyensFor(dateId){ return moyensCache.find(m=>m.id === idMoyens(activeTourneeId(), dateId)) || null; }
function todayIso(){ return new Date().toISOString().slice(0,10); }
function datesFutures(){
  const t = activeTournee();
  if(!t) return [];
  const today = todayIso();
  return (t.dates||[]).filter(d=> !d.date || d.date >= today).sort((a,b)=> (a.date||'').localeCompare(b.date||''));
}

function puce(sev, texte){ return `<span class="puce p-${sev}">${escapeHtml(texte)}</span>`; }

function puceStatutGeneral(m){
  if(!m || m.statut === 'non_demande') return puce('non', 'pas demandé');
  if(m.statut === 'demande') return puce('att', 'demandé');
  if(m.statut === 'recu') return puce('ok', 'reçu');
  return puce('ok', 'validé');
}
function puceDechargement(m){
  if(!m || m.nombreSemisSimultanees == null) return puce('neutre', 'déchargement —');
  return puce('ok', `${m.nombreSemisSimultanees} semi${m.nombreSemisSimultanees>1?'s':''} en simultané`);
}
function puceVacations(vacs, prefixe){
  const liste = vacs || [];
  if(!liste.length) return puce('neutre', `${prefixe} —`);
  const confirmees = liste.filter(v=>v.confirme).length;
  return puce(confirmees >= liste.length ? 'ok' : 'att', `${prefixe} ${confirmees}/${liste.length} confirmées`);
}
function puceRoadies(m){ return puceVacations(m && m.roadiesVacations, 'roadies'); }
function puceChariots(m){ return puceVacations(m && m.chariotsVacations, 'chariots'); }
function puceRigg(m){ return puceVacations(m && m.riggVacations, 'rigg'); }
function puceBureauControle(m){
  if(!m || m.planChargeStatut === 'non_envoye') return puce('non', 'plan de charge —');
  if(m.planChargeStatut === 'envoye') return puce('att', 'plan de charge envoyé');
  return puce('ok', 'plan de charge validé');
}
function pucePlan(m){
  if(!m || m.planStatut === 'non_demande') return puce('non', 'plan —');
  if(m.planStatut === 'demande') return puce('att', 'plan demandé');
  return puce(m.planValide ? 'ok' : 'att', m.planValide ? 'plan validé' : 'plan reçu, pas validé');
}

function render(){
  const dates = datesFutures();
  const box = document.getElementById('dates');
  const empty = document.getElementById('datesEmpty');
  if(dates.length === 0){ box.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display = 'none';
  const t = activeTournee();
  box.innerHTML = dates.map(d=>{
    const m = moyensFor(d.id);
    const jour = d.date ? new Date(d.date+'T00:00:00').toLocaleDateString('fr-FR', { weekday:'short', day:'2-digit', month:'2-digit' }) : '—';
    return `
      <a class="date-card" href="technique-date.html?t=${encodeURIComponent(t.id)}&d=${encodeURIComponent(d.id)}">
        <div class="date-card-top">
          <span class="date-card-nom">${escapeHtml(d.ville || d.lieu || 'Date')}${d.lieu && d.ville ? ' — ' + escapeHtml(d.lieu) : ''}</span>
          <span class="date-card-quand">${jour}</span>
        </div>
        <div class="puces">
          ${puceStatutGeneral(m)}
          ${pucePlan(m)}
          ${puceBureauControle(m)}
          ${puceDechargement(m)}
          ${puceRoadies(m)}
          ${puceChariots(m)}
          ${puceRigg(m)}
        </div>
      </a>
    `;
  }).join('');
}

async function verifierMigrationPresente(){
  try{
    const res = await supabaseClient.from('affectations_transport').select('id').limit(1);
    if(res.error && /schema cache|does not exist|PGRST205/i.test(res.error.message || '')){
      document.getElementById('migrationBanner').style.display = 'flex';
    }
  }catch(e){}
}

async function initData(){
  verifierMigrationPresente();
  [tourneesCache, moyensCache] = await Promise.all([
    CurieuxDB.fetchAll('tournees'),
    CurieuxDB.fetchAll('moyens_salle'),
  ]);
  const sel = document.getElementById('tourneeSelect');
  if(tourneesCache.length === 0){
    sel.innerHTML = '<option value="">Aucune tournée</option>';
  } else {
    sel.innerHTML = tourneesCache.map(t=>`<option value="${t.id}">${escapeHtml(t.nom || 'Tournée sans nom')}</option>`).join('');
  }
  sel.addEventListener('change', render);
  render();
}

CurieuxDB.subscribe('moyens_salle', ()=> CurieuxDB.fetchAll('moyens_salle').then(l=>{ moyensCache=l; curieuxRafraichir(render); }));

injectCurieuxFonts();
initNavDropdowns();
initGlobalSearch(document.querySelector('.page-nav'));
applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);
initData();
</script>
</body>
</html>
