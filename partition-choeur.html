<style>
  /* Une colonne, même sur grand écran : une liste de quatre voix étirée sur
     1 100 px met la tonalité à vingt centimètres du nom qu'elle qualifie. */
  .wrap{max-width:720px; margin:0 auto; padding-bottom:40px;}
  .entete{margin-bottom:16px;}
  .sous{color:var(--muted); font-size:13.5px; margin:4px 0 0; line-height:1.55;}

  .langues{display:flex; gap:6px; justify-content:flex-end; margin-bottom:10px;}
  .langues button{
    border:1px solid var(--border); background:var(--card); color:var(--muted);
    border-radius:999px; padding:3px 12px; font-size:11.5px; font-weight:800;
    cursor:pointer; letter-spacing:.04em; min-height:0;
  }
  .langues button.actif{background:var(--accent); border-color:var(--accent); color:#fff;}

  .bandeau{
    display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
    font-size:12.5px; color:var(--muted); margin-top:10px;
  }
  .etiq{
    display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
  }
  .etiq.ok{background:var(--ok-tint); color:var(--ok);}
  .etiq.ko{background:var(--ko-tint); color:var(--ko);}
  .etiq.att{background:var(--maybe-tint); color:var(--maybe);}

  .bloc{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px;}
  .bloc + .bloc{margin-top:14px;}
  .bloc h2{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:800; margin:0 0 8px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  }
  .bloc h2 .total{margin-left:auto; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:0;}

  /* ---------------------------------------------------------------------
     LA VOIX ET SA TONALITÉ.

     La tonalité n'est pas un détail rangé en fin de ligne : c'est la première
     chose qu'un chef de chœur vérifie en ouvrant le lien, avant même de
     compter les pages. Elle est donc posée contre le nom de la voix, en
     pastille, et non noyée dans la ligne de détail avec le poids du fichier.
     Une voix sans tonalité n'affiche RIEN plutôt qu'un tiret : un tiret se
     lit « pas de transposition », l'absence se lit « on ne nous l'a pas dit »
     — et ce n'est pas la même chose à faire ensuite.
     --------------------------------------------------------------------- */
  .voix{margin:14px 0 6px; padding-top:10px; border-top:1px solid var(--border);}
  .voix:first-of-type{border-top:none; padding-top:0; margin-top:4px;}
  .voix-tete{display:flex; gap:9px; align-items:center; flex-wrap:wrap;}
  .voix-tete .nom{font-weight:800; font-size:14.5px;}
  /* La glose, en retrait : c'est un appoint, pas le nom. Le nom reste celui
     qui est imprimé sur la partition et sur le fichier téléchargé — afficher
     « Alt » pour un fichier « Alto.pdf » ferait chercher une voix qui ne
     manque pas. */
  .voix-trad{font-size:12.5px; color:var(--muted); font-weight:600;}
  .ton{
    display:inline-block; font-size:11.5px; font-weight:800; padding:2px 9px; border-radius:999px;
    background:var(--pup-choeur); color:var(--pup-choeur-ink); white-space:nowrap;
  }

  /* Les dates. Une ligne par journée, le jour en gras à gauche : c'est la
     seule chose que le chef de chœur lit avant de répondre, et il la lit en
     diagonale. */
  .dat{display:flex; gap:10px; align-items:baseline; padding:7px 0; border-bottom:1px solid var(--border); font-size:13.5px;}
  .dat:last-child{border-bottom:none;}
  .dat b{min-width:215px; font-weight:800;}
  .dat span{color:var(--muted); font-size:12.5px;}

  .fic{
    display:flex; gap:10px; align-items:center; text-decoration:none; color:inherit;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .fic:last-child{border-bottom:none;}
  .fic-nom{flex:1; min-width:0; font-weight:700; font-size:13.5px;}
  .fic-det{font-size:12px; color:var(--muted); font-weight:400; display:block; margin-top:1px;}
  .fic-fleche{color:var(--accent); font-weight:800; font-size:16px;}
  .fic.inerte{opacity:.5; pointer-events:none;}

  .rien{font-size:13px; color:var(--muted); padding:10px 0; line-height:1.6;}

  .forme{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 4px;}
  .aide{font-size:12px; color:var(--muted); line-height:1.55; margin:4px 0 0;}
  .erreur{font-size:12.5px; color:var(--ko); font-weight:700; line-height:1.55; margin:6px 0 0;}
  .erreur:empty{display:none;}

  .progres{height:6px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:10px;}
  .progres i{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .2s;}

  .pied{
    margin-top:26px; padding-top:16px; border-top:1px solid var(--border);
    font-size:12px; color:var(--muted); line-height:1.6;
  }
  .pied p{margin:0 0 9px;}
  .pied p:last-child{margin-bottom:0;}
  .pied strong{color:var(--text);}

  @media (max-width:760px){
    .bloc{padding:13px 14px;}
    input, select{font-size:16px !important;}
  }

<script>
/* ============================================================================
   Les partitions du chœur — la page du chef de chœur.
   ============================================================================
   Un chœur invité — une maîtrise, un chœur régional, une chorale associée à la
   production — n'a pas ses choristes dans notre annuaire, et il n'est pas
   question d'écrire à quarante personnes. On remet le lot à la MAISON,
   représentée par la personne qui en répond, et c'est elle qui distribue en
   interne : c'est déjà ce qu'elle fait pour son propre répertoire.

   CE QUI DISTINGUE CETTE PAGE DE CELLE DES ENSEMBLES TIERS
   -------------------------------------------------------
   Rien du dispositif : le bucket reste privé, le fichier propre ne sort
   jamais, chaque exemplaire est filigrané à la volée par /api/partition et
   journalisé un par un. Ce qui change, c'est CE QU'ON MONTRE.

   1. LES VOIX SONT RANGÉES PAR TESSITURE, et non dans l'ordre du conducteur.
      Soprano, alto, ténor, basse : c'est l'ordre que tout choriste connaît par
      cœur. L'ordre du conducteur range « Alto » avec les cordes et donnait
      « Soprano, Ténor, Basse, Alto » — un chef de chœur qui lit ça croit qu'il
      manque une voix.
   2. LA TONALITÉ EST EN TÊTE DE VOIX. C'est la première chose qu'il vérifie,
      et la seule que le matériel d'orchestre n'a jamais besoin de porter.
   3. LE LOT NE PORTE QUE LE CHŒUR. La base y veille (voir envoi_partitions) :
      un lot de chœur « tout le spectacle » ne donne que les parties de chœur.
      Ce n'est pas une politesse, c'est la règle — le matériel d'orchestre n'a
      rien à faire chez une chorale, et une partie de location encore moins.

   POURQUOI ELLE EST BILINGUE
   --------------------------
   Pour la même raison que la page des ensembles tiers : une coproduction
   amène des chœurs qui ne lisent pas le français, et une page en français
   devant un Chorleiter de Leipzig, c'est un appel téléphonique et deux jours
   perdus. La langue se devine du navigateur, se change d'un bouton, se retient.

   L'ARCHIVE EST ASSEMBLÉE ICI, dans ce navigateur (voir assets/zip.js) : les
   voix sont récupérées une par une, filigranées chacune côté serveur, puis
   rangées localement. Aucun plafond de fonction serverless n'est approché, et
   une coupure en cours de route laisse tout le reste téléchargeable à l'unité.
============================================================================ */

const params = new URLSearchParams(location.search);
const JETON = params.get('c') || params.get('choeur') || params.get('e') || '';

/* Les langues servies, côte à côte — les mêmes que la page du matériel confié,
   et pour la même raison : une coproduction amène des chœurs qui ne lisent pas
   le français, et une page en français devant un Chorleiter de Leipzig, c'est
   un appel téléphonique et deux jours perdus. Pas de fichier de traduction ni
   de mécanique : une quarantaine de chaînes par langue, lues et corrigées d'un
   coup d'œil. Une chaîne manquante retombe sur le français plutôt que
   d'afficher sa clé.

   EN AJOUTER UNE : une entrée dans LANGUES (code, étiquette, nom, locale) et un
   bloc dans TEXTES, recopié sur l'anglais. Rien d'autre — la barre de langues,
   la date, le poids, les voix et les tonalités suivent tout seuls. */
const LANGUES = [
  { code: 'fr', etiquette: 'FR', nom: 'Français',   locale: 'fr-FR' },
  { code: 'en', etiquette: 'EN', nom: 'English',    locale: 'en-GB' },
  { code: 'de', etiquette: 'DE', nom: 'Deutsch',    locale: 'de-DE' },
  { code: 'es', etiquette: 'ES', nom: 'Español',    locale: 'es-ES' },
  { code: 'it', etiquette: 'IT', nom: 'Italiano',   locale: 'it-IT' },
  { code: 'nl', etiquette: 'NL', nom: 'Nederlands', locale: 'nl-NL' },
  { code: 'ja', etiquette: 'JA', nom: '日本語',      locale: 'ja-JP' },
];

/* Le poids se lit dans les conventions du lecteur : « 18,4 Mo » devant un chef
   de chœur de Leipzig se lit comme une coquille — l'unité ET la virgule
   décimale sont françaises. Une seule mécanique, deux réglages. Les seuils sont
   ceux de partitionsPoids. */
function poidsFormate(octets, unites, virgule){
  const n = Number(octets) || 0;
  const dec = (x, d)=> x.toFixed(d).replace('.', virgule);
  if(n < 1024) return n + ' ' + unites[0];
  if(n < 1048576) return dec(n / 1024, 0) + ' ' + unites[1];
  const mo = n / 1048576;
  if(mo < 10) return dec(mo, 1) + ' ' + unites[2];
  if(mo < 1024) return dec(mo, 0) + ' ' + unites[2];
  return dec(mo / 1024, 2) + ' ' + unites[3];
}

const CLE_LANGUE = 'curieuxEnvoiLangue';       // la même clé que l'autre page : une maison, une langue choisie
const CLE_CODE = 'curieuxChoeurCode:' + JETON;
/* PAS DE CLÉ POUR LE NOM, et c'est délibéré. Le code, lui, se retient quatorze
   jours : il désigne le LOT, il ne change pas d'un exemplaire à l'autre. Le nom
   désigne UNE personne, et un nom retenu d'une session sur l'autre est un
   exemplaire qui repart au nom du précédent — le registre désigne alors
   quelqu'un qui n'a jamais reçu cette partition, ce qui est pire que pas de
   registre du tout. Il vit le temps de la page, et se retape. */

/* La langue du chef de chœur, dans cet ordre : son choix retenu, le `lang` du
   lien — c'est lui qu'on met dans le courriel d'envoi quand on SAIT à qui on
   écrit —, puis ses préférences de navigateur, dans l'ordre où il les a
   déclarées. L'anglais en dernier recours : devant un lecteur dont on ne sert
   pas la langue, c'est lui qui a le plus de chances d'être lu. */
function langueInitiale(){
  const connue = (v)=> LANGUES.some(l => l.code === String(v || '').slice(0, 2).toLowerCase())
    ? String(v).slice(0, 2).toLowerCase() : '';
  try{
    const retenu = connue(localStorage.getItem(CLE_LANGUE));
    if(retenu) return retenu;
  }catch(e){}
  const demande = connue(params.get('lang'));
  if(demande) return demande;
  const preferees = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || ''];
  for(let i = 0; i < preferees.length; i++){
    const c = connue(preferees[i]);
    if(c) return c;
  }
  return 'en';
}
let LANGUE = langueInitiale();
function T(cle){ return TEXTES[LANGUE][cle] !== undefined ? TEXTES[LANGUE][cle] : TEXTES.fr[cle]; }

/* Tout est enveloppé — le stockage lève en navigation privée, et une commodité
   ne doit jamais casser la page. */
function lireRetenu(cle){
  try{
    const j = JSON.parse(localStorage.getItem(cle) || 'null');
    if(!j || !j.quand || Date.now() - j.quand > 14 * 86400000) return '';
    return j.valeur || '';
  }catch(e){ return ''; }
}
function ecrireRetenu(cle, valeur){
  try{ localStorage.setItem(cle, JSON.stringify({ quand: Date.now(), valeur })); }catch(e){}
}

/* Le jour de la semaine compte ICI et nulle part ailleurs sur cette page : un
   chef de chœur convoque quarante bénévoles, et « samedi » ou « mardi » décide
   de la moitié des réponses. Sur une date d'expiration, ce serait du bruit. */
const _locale = ()=> (LANGUES.find(x => x.code === LANGUE) || {}).locale || 'en-GB';

function jourAvecSemaine(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(_locale(),
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

function jourLisible(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(_locale(), { day: 'numeric', month: 'long', year: 'numeric' });
}

let CHARGE = null;
/* L'archive en cours n'est PAS un état du DOM. Basculer la langue ou oublier le
   code reconstruit l'écran pendant la préparation : le nouveau bouton naissait
   actif, un second clic relançait les quatre voix, et le registre comptait
   chaque exemplaire deux fois — au nom du même chœur, ce qui est exactement ce
   qu'un registre de traçabilité ne doit pas faire. */
let ARCHIVE_EN_COURS = false;
/* Un refus survenu avant le chargement doit lui aussi suivre la langue : la
   page bilingue restait en français devant le seul public qui ne la lit pas. */
let REFUS = null;
let CODE = lireRetenu(CLE_CODE);
let NOM = '';

function etat(html){
  document.getElementById('sousTitre').textContent = '';
  document.getElementById('contenu').innerHTML = `<div class="co-card co-pad rien" style="text-align:center">${html}</div>`;
  document.getElementById('pied').innerHTML = '';
}

function rendreLangues(){
  document.getElementById('langues').innerHTML = LANGUES.map(l =>
    `<button type="button" data-langue="${l.code}" lang="${l.code}"
       class="${l.code === LANGUE ? 'actif' : ''}"${l.code === LANGUE ? ' aria-current="true"' : ''}
       title="${escapeAttr(l.nom)}" aria-label="${escapeAttr(l.nom)}">${escapeHtml(l.etiquette)}</button>`).join('');
  document.querySelectorAll('[data-langue]').forEach(b => b.onclick = ()=>{
    LANGUE = b.dataset.langue;
    try{ localStorage.setItem(CLE_LANGUE, LANGUE); }catch(e){}
    document.documentElement.lang = LANGUE;
    rendre();
  });
}

/* L'URL d'un exemplaire. Le paramètre reste `envoi` : les deux espaces
   partagent la même table, la même autorisation et le même journal — deux
   écrans, un seul dispositif. Le code et le nom y passent en clair : c'est une
   requête vers notre propre serveur, en HTTPS, et c'est là que la base les
   vérifie. Un lien recopié sans le code ne donne rien. */
function urlFichier(fichierId){
  let u = `/api/partition?envoi=${encodeURIComponent(JETON)}&fichier=${encodeURIComponent(fichierId)}`;
  if(CODE) u += `&code=${encodeURIComponent(CODE)}`;
  if(NOM) u += `&pour=${encodeURIComponent(NOM)}`;
  return u;
}

/* Le nom d'un fichier dans l'archive. « Soprano.pdf » et non l'identifiant de
   stockage : c'est ce que le chef de chœur va voir dans son dossier, puis dans
   ce qu'il distribue. Le titre n'est ajouté que s'il apporte quelque chose —
   une voix qui ne porte qu'un fichier nommé comme elle donnerait
   « Soprano — Soprano ». */
function nomArchive(partie, fichier){
  const titre = (fichier.titre || '').trim();
  const ajout = titre && (partie.fichiers || []).length > 1
    && titre.toLowerCase() !== (partie.nom || '').trim().toLowerCase()
    ? ' - ' + titre : '';
  return `${partie.nom || 'Voix'}${ajout}.pdf`;
}

const ton = (valeur)=> partitionsTonaliteLangue(valeur, LANGUE);

function rendre(){
  rendreLangues();
  if(REFUS){ document.getElementById('titre').textContent = T('titre'); etat(escapeHtml(T(REFUS))); return; }
  const c = CHARGE;
  document.getElementById('titre').textContent = c && c.destinataire
    ? T('pourEnsemble')(c.destinataire) : T('titre');
  // Le bouton de langue appelle rendre() : il peut être cliqué avant que le
  // lot soit revenu de la base. Sans ce garde-fou, la page se vide.
  if(!c) return;

  /* UN LIEN DE TRANSMISSION OUVERT ICI. Ce n'est pas une erreur du
     destinataire : c'est une adresse recopiée de travers. On l'emmène au bon
     endroit plutôt que de lui faire rappeler la production — et on ne montre
     RIEN du lot ici, parce que ce n'est pas la page qui le décrit. */
  if(c.type && c.type !== 'choeur'){
    etat(escapeHtml(T('mauvaisePage'))
      + `<br><br><a class="co-btn sm primary" href="partition-envoi.html?e=${escapeAttr(encodeURIComponent(JETON))}">${escapeHtml(T('mauvaisePageLien'))}</a>`);
    return;
  }

  /* Les trois refus, dits en toutes lettres. LE MOTIF VIENT DE LA BASE, jamais
     d'un calcul refait ici : la page compare avec l'horloge du navigateur, la
     base avec la sienne, et un chef de chœur à Montréal le 1er décembre au soir
     est déjà le 2 pour nous. Un seul juge, et il dit son motif. `etat` n'existe
     pas sur une base dont la migration est plus ancienne : on retombe alors sur
     ce qu'on sait. */
  const etatLot = c.etat || (!c.actif ? 'revoque' : c.ouvert ? 'ouvert' : c.ouvertLe ? 'attente' : 'expire');
  if(etatLot === 'revoque'){ etat(escapeHtml(T('revoque'))); return; }
  if(etatLot === 'expire'){
    etat(escapeHtml(c.expireLe ? T('expire')(jourLisible(c.expireLe)) : T('revoque'))); return;
  }
  if(etatLot !== 'ouvert'){
    etat(escapeHtml(c.ouvertLe ? T('pasOuvert')(jourLisible(c.ouvertLe)) : T('revoque')));
    return;
  }

  /* L'ORDRE DES TESSITURES, et non celui du conducteur : voir l'en-tête. La
     base renvoie les voix dans l'ordre du matériel ; c'est ici qu'on les remet
     dans celui que le chœur connaît. */
  const voix = partitionsTrierVoix(c.parties || []);
  const fichiers = voix.reduce((s, p)=> s + (p.fichiers || []).length, 0);
  const poids = voix.reduce((s, p)=> s + (p.fichiers || []).reduce((t, f)=> t + (f.octets || 0), 0), 0);

  const contexte = [c.spectacle, c.compositeur, c.operation].filter(Boolean).join(' · ');
  document.getElementById('sousTitre').innerHTML =
    escapeHtml(T('sousTitre'))
    + (contexte ? `<br><strong style="color:var(--text)">${escapeHtml(contexte)}</strong>` : '')
    + `<span class="bandeau">
        <span class="etiq ok">${escapeHtml(T('voixN')(voix.length))}</span>
        <span>${escapeHtml(T('fichiersN')(fichiers))} · ${escapeHtml(T('poids')(poids))}</span>
        ${c.expireLe ? `<span class="etiq att">${escapeHtml(T('expireLe')(jourLisible(c.expireLe)))}</span>` : ''}
      </span>`;

  let html = '';

  /* LES DATES AVANT TOUT LE RESTE, code compris. Un chef de chœur qui ouvre ce
     lien commence par vérifier qu'il est libre : c'est sa première question, et
     elle ne demande pas de code. Les dates annulées ne sont jamais montrées —
     une date annulée n'est pas une date, et l'afficher barrée ferait appeler la
     production pour demander si elle tient encore. */
  const dates = (c.dates || []).filter(d => d && d.date && !estAnnulee(d));
  if(dates.length){
    html += `<section class="bloc">
      <h2>${escapeHtml(T('datesTitre'))} <span class="total">${dates.length}</span></h2>
      ${dates.map(d => {
        const lieu = [d.ville, d.lieu].filter(Boolean)
          .filter((v, i, a) => a.findIndex(x => String(x).toLowerCase() === String(v).toLowerCase()) === i)
          .join(' · ');
        const nature = (T('natures') || {})[d.type] || '';
        return `<div class="dat">
          <b>${escapeHtml(jourAvecSemaine(d.date))}</b>
          <span>${escapeHtml([lieu, nature].filter(Boolean).join(' · '))}</span>
        </div>`;
      }).join('')}
      <p class="aide">${escapeHtml(T('datesAide'))}</p>
    </section>`;
  }

  // Le code ensuite : sans lui, la liste s'affiche mais rien ne se télécharge.
  // On le demande APRÈS avoir dit ce que contient le lot — un champ nu, sans
  // savoir ce qu'il ouvre, ne se remplit pas.
  if(c.codeRequis && !CODE){
    html += `<section class="bloc">
      <h2>${escapeHtml(T('codeTitre'))}</h2>
      <form class="forme" id="formCode">
        <input class="co-input" id="inpCode" style="width:150px;font-weight:800;letter-spacing:.08em;text-transform:uppercase"
               maxlength="32" inputmode="latin" autocapitalize="characters"
               placeholder="${escapeAttr(T('codeChamp'))}" aria-label="${escapeAttr(T('codeTitre'))}">
        <button type="submit" class="co-btn primary sm">${escapeHtml(T('ouvrir'))}</button>
      </form>
      <p class="erreur" id="errCode"></p>
      <p class="aide">${escapeHtml(T('codeAide'))}</p>
    </section>`;
  }

  // Le nom par exemplaire, quand le lot est distribué nominativement. La base
  // refuse le téléchargement s'il manque : le champ n'est pas une politesse.
  if(c.nominatif){
    html += `<section class="bloc">
      <h2>${escapeHtml(T('nomTitre'))}</h2>
      <form class="forme" id="formNom">
        <input class="co-input" id="inpNom" style="width:min(300px,100%)" maxlength="60"
               placeholder="${escapeAttr(T('nomChamp'))}" aria-label="${escapeAttr(T('nomTitre'))}"
               value="${escapeAttr(NOM)}">
        <button type="submit" class="co-btn sm">${escapeHtml(T('valider'))}</button>
      </form>
      <p class="erreur" id="errNom"></p>
      <p class="aide">${escapeHtml(T('nomAide'))}</p>
    </section>`;
  }

  const pret = (!c.codeRequis || CODE) && (!c.nominatif || NOM);

  html += `<section class="bloc">
    <h2>${escapeHtml(T('lot'))}
      <span class="total">
        ${fichiers && pret && !c.nominatif ? `<button type="button" class="co-btn sm primary" id="btnTout"${ARCHIVE_EN_COURS ? ' disabled' : ''}>${escapeHtml(ARCHIVE_EN_COURS ? T('enCours')('…', fichiers) : T('toutPrendre'))}</button>` : ''}
        ${c.codeRequis && CODE ? `<button type="button" class="co-btn ghost sm" id="btnOublier" style="margin-left:8px">${escapeHtml(T('oublier'))}</button>` : ''}
      </span>
    </h2>
    <div id="progres"></div>
    ${c.nominatif && fichiers ? `<p class="aide">${escapeHtml(T('pasDArchive'))}</p>` : ''}`;

  if(!fichiers){
    html += `<p class="rien">${escapeHtml(T('rien'))}</p>`;
  } else {
    voix.forEach(p => {
      const tonVoix = ton(p.tonalite);
      /* LE NOM DE LA VOIX NE CHANGE PAS, la glose s'ajoute à côté. Un jeu
         français annonce « Alto » ; devant un Chorleiter, c'est « Alt », et
         surtout pas « Bratsche » — le glossaire des VOIX est distinct de celui
         des instruments, voir partitions-commun.js. La glose n'est écrite que
         si elle apprend quelque chose : « Soprano » ne gagne rien à être
         doublé de « Soprano ». */
      const glose = partitionsVoixTraduite(p.nom, LANGUE);
      const utile = partitionsNormaliser(glose) !== partitionsNormaliser(p.nom);
      html += `<div class="voix"><div class="voix-tete">
        <span class="nom">${escapeHtml(p.nom)}</span>
        ${utile ? `<span class="voix-trad" lang="${escapeAttr(LANGUE)}">${escapeHtml(glose)}</span>` : ''}
        ${tonVoix ? `<span class="ton">${escapeHtml(tonVoix)}</span>` : ''}
      </div>`;
      (p.fichiers || []).forEach(f => {
        /* La tonalité du numéro ne se répète PAS quand elle est celle de la
           voix : une colonne où « Ré♭ majeur » revient huit fois ne se lit
           plus, et c'est précisément la neuvième — celle qui diffère — qu'on
           cherche. Elle ne s'écrit donc que là où elle apporte quelque chose. */
        const tonFic = ton(f.tonalite);
        const detail = [
          tonFic && tonFic !== tonVoix ? tonFic : '',
          T('poids')(f.octets),
          f.pages ? T('pages')(f.pages) : '',
        ].filter(Boolean).join(' · ');
        const nom = nomArchive(p, f).replace(/\.pdf$/, '');
        html += `<a class="fic${pret ? '' : ' inerte'}" ${pret ? `href="${escapeAttr(urlFichier(f.id))}" download` : 'href="#" aria-disabled="true"'}>
          <span class="fic-nom">${escapeHtml(nom)}<span class="fic-det">${escapeHtml(detail)}</span></span>
          <span class="fic-fleche">↓</span>
        </a>`;
      });
      html += '</div>';
    });
  }
  html += '</section>';

  const aUneTonalite = voix.some(p => ton(p.tonalite) || (p.fichiers || []).some(f => ton(f.tonalite)));
  document.getElementById('contenu').innerHTML = html;
  document.getElementById('pied').innerHTML = `<div class="pied">
    ${aUneTonalite ? `<p>${escapeHtml(T('piedTonalite'))}</p>` : ''}
    <p>${escapeHtml(T('piedFiligrane'))}</p>
    <p><strong>${escapeHtml(T('piedUsage')(!!c.expireLe))}</strong></p>
    ${c.note ? `<p>${escapeHtml(c.note)}</p>` : ''}
    <p>${escapeHtml(T('piedContact'))}</p>
  </div>`;

  cabler();
}

function cabler(){
  /* Un formulaire qui ne fait RIEN quand on valide se lit comme une panne.
     C'était le cas des deux : saisie refusée, champ repris, aucun mot. Un chef
     de chœur devant un écran qui ne réagit pas appelle la production — ou
     renonce, et fait travailler son chœur sur une photocopie. */
  const dire = (id, message)=>{
    const zone = document.getElementById(id);
    if(zone) zone.textContent = message;
  };

  const formCode = document.getElementById('formCode');
  if(formCode) formCode.onsubmit = (e)=>{
    e.preventDefault();
    const champ = document.getElementById('inpCode');
    const v = (champ.value || '').trim().toUpperCase();
    if(!/^[A-Za-z0-9-]{1,32}$/.test(v)){
      dire('errCode', T('codeInvalide'));
      champ.focus();
      return;
    }
    CODE = v; ecrireRetenu(CLE_CODE, v); rendre();
  };

  const formNom = document.getElementById('formNom');
  if(formNom) formNom.onsubmit = (e)=>{
    e.preventDefault();
    const champ = document.getElementById('inpNom');
    const v = (champ.value || '').trim().replace(/\s+/g, ' ');
    /* Le même jeu de caractères que celui qu'accepte /api/partition : refuser
       ici évite un 400 incompréhensible après trente secondes d'attente. La
       VIRGULE en fait partie — « Müller, Anna » est la forme courante des
       listes de chœur allemandes, et la refuser sans un mot était le plus sûr
       moyen de bloquer quelqu'un. */
    if(!/^[\p{L}\p{M}\s'’.·,-]{2,60}$/u.test(v)){
      dire('errNom', T('nomInvalide'));
      champ.focus();
      return;
    }
    NOM = v; rendre();
  };

  const btnOublier = document.getElementById('btnOublier');
  if(btnOublier) btnOublier.onclick = ()=>{
    try{ localStorage.removeItem(CLE_CODE); }catch(e){}
    CODE = ''; rendre();
  };

  const btnTout = document.getElementById('btnTout');
  if(btnTout) btnTout.onclick = toutTelecharger;
}

/* Tout prendre d'un coup. Chaque voix est récupérée séparément — donc
   filigranée et journalisée séparément, comme si le chef de chœur les avait
   prises une par une — puis rangée dans une archive assemblée ici. On ne
   parallélise PAS : /api/partition pose un filigrane par appel, et huit appels
   simultanés feraient tomber la fonction plutôt que d'aller plus vite. */
async function toutTelecharger(){
  const c = CHARGE;
  if(ARCHIVE_EN_COURS) return;
  if(c.nominatif && !NOM){ alert(T('nomManque')); return; }
  const btn = document.getElementById('btnTout');
  const progres = document.getElementById('progres');
  const aPrendre = [];
  partitionsTrierVoix(c.parties || []).forEach(p => (p.fichiers || []).forEach(f => aPrendre.push({ partie: p, fichier: f })));
  if(!aPrendre.length) return;

  ARCHIVE_EN_COURS = true;
  btn.disabled = true;
  const entrees = [];
  const echecs = [];
  for(let i = 0; i < aPrendre.length; i++){
    const { partie, fichier } = aPrendre[i];
    btn.textContent = T('enCours')(i + 1, aPrendre.length);
    progres.innerHTML = `<div class="progres"><i style="width:${Math.round(i / aPrendre.length * 100)}%"></i></div>`;
    try{
      const rep = await fetch(urlFichier(fichier.id), { credentials: 'omit' });
      if(!rep.ok) throw new Error('HTTP ' + rep.status);
      entrees.push({ nom: nomArchive(partie, fichier), octets: await rep.arrayBuffer() });
    }catch(e){
      console.warn('[choeur] ', fichier.id, e && e.message);
      echecs.push(fichier.id);
    }
  }

  ARCHIVE_EN_COURS = false;
  progres.innerHTML = '';
  btn.disabled = false;
  btn.textContent = T('toutPrendre');

  if(!entrees.length){ alert(T('echecTotal')); return; }
  /* L'assemblage peut échouer là où rien d'autre n'échoue : un matériel
     d'oratorio dépasse ce qu'un navigateur accepte d'allouer d'un bloc. Sans ce
     filet, toutes les voix avaient été filigranées ET inscrites au registre, et
     l'écran revenait au repos sans un mot — le chef de chœur croit avoir
     téléchargé, nous croyons qu'il l'a fait. */
  try {
    const nomLot = [c.spectacle || 'Partitions', c.destinataire].filter(Boolean).join(' - ') + '.zip';
    CurieuxZip.enregistrer(CurieuxZip.creer(entrees), nomLot);
  } catch(e) {
    console.error('[choeur] archive', e && e.message);
    alert(T('archiveImpossible'));
    return;
  }
  if(echecs.length) alert(T('echecPartiel')(echecs.length));
}

async function init(){
  document.documentElement.lang = LANGUE;
  rendreLangues();
  const refuser = (cle)=>{ REFUS = cle; etat(escapeHtml(T(cle))); };
  if(!window.supabase || !JETON){ refuser('lienInvalide'); return; }

  const charge = await CurieuxDB.envoiPartitions(JETON);
  if(charge && charge.migrationAbsente){ refuser('pasActive'); return; }
  if(!charge){ refuser('lienInvalide'); return; }

  CHARGE = charge;
  rendre();
}

init();
applyBrandLogo();
setInterval(applyAutoTheme, 5 * 60 * 1000);
</script>
</body>
</html>
