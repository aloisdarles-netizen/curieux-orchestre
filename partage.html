<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Partage</title>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/db.js"></script>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<script src="assets/global-search.js"></script>
<script>try{ hideCurieuxPageUntilAuth(); injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); injectBugReportWidget(); document.addEventListener('DOMContentLoaded', requireDirectionTechniqueAuth); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  .wrap{max-width:760px; margin:0 auto; font-variant-numeric:tabular-nums;}
  button{ cursor:pointer; border:none; border-radius:8px; font-size:13px; font-weight:700; padding:9px 15px; font-family:inherit; }
  .btn-secondary{background:var(--accent-tint); color:var(--accent-dark);}
  .btn-ghost{background:transparent; color:var(--muted); padding:6px 10px;}
  .btn-danger{background:transparent; color:var(--danger); padding:6px 10px;}
  .btn-sm{padding:7px 11px; font-size:12px;}
  input[type=text], select{ padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px; width:100%; background:var(--card); color:var(--text); font-family:inherit; }
  label{font-size:12px; color:var(--muted); font-weight:600;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
  label.chk{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text); font-weight:400; cursor:pointer; padding:4px 0;}
  label.chk input{width:18px; height:18px; accent-color:var(--accent);}

  .tournee-select{margin-bottom:16px;}
  .toolbar{display:flex; justify-content:flex-end; margin-bottom:16px;}
  .acces-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px;}
  .acces-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .acces-nom{font-weight:800; font-size:14.5px;}
  .badge{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .badge-accent{background:var(--accent-tint); color:var(--accent-dark);}
  .badge-hayon{background:var(--ok-tint); color:var(--ok);}
  .badge-sans-hayon{background:var(--border); color:var(--muted);}
  .lien-copie{display:flex; gap:8px; align-items:center; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:12px; font-family:ui-monospace,monospace; overflow-x:auto; margin:8px 0;}
  .lien-copie code{flex:1; white-space:nowrap; color:var(--muted);}
  .acces-actions{display:flex; gap:6px; margin-top:8px;}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(20,15,10,.5); align-items:center; justify-content:center; padding:20px; z-index:50; overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card); border-radius:14px; padding:24px; max-width:480px; width:100%; max-height:88vh; overflow-y:auto; margin:auto;}
  .modal h2{font-size:17px; margin:0 0 16px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:18px;}
  @media (max-width:600px){ input, select{ font-size:16px !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-header">
    <a href="technique.html">← Direction technique</a>
    <nav class="page-nav" data-curieux-nav></nav>
  </div>
  <h1>Partage</h1>
  <p class="subtitle">Un lien par destinataire, sans compte, révocable — chacun ne voit que ce qui le concerne.</p>

  <select class="tournee-select" id="tourneeSelect"></select>
  <div class="toolbar"><button type="button" class="btn-secondary" id="addAccesBtn">+ Nouvel accès</button></div>
  <div id="accesListe"></div>
  <div class="empty-hint" id="accesEmpty" style="display:none;">Aucun accès créé pour cette tournée.</div>
</div>

<div class="modal-overlay" id="accesModalOverlay">
  <div class="modal">
    <h2 id="accesModalTitle">Nouvel accès</h2>
    <input type="hidden" id="aEditId">
    <div class="field"><label for="aLibelle">Destinataire</label><input type="text" id="aLibelle" placeholder="Ex: Karim (stage manager), Zénith Strasbourg…"></div>
    <div class="field"><label for="aType">Ce que ce lien montre</label>
      <select id="aType">
        <option value="stage_manager">Stage manager — tout, avec positionnement des semis</option>
        <option value="technicien">Technicien·ne — récap doc de salle et particularités</option>
        <option value="salle">Salle — notre demande technique/personnel + fiche technique</option>
      </select>
    </div>
    <div class="field" id="datesChoixField" style="display:none;">
      <label>Dates concernées (une salle ne voit que les siennes)</label>
      <div id="datesChoixListe" style="max-height:180px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:6px 10px;"></div>
    </div>
    <div id="accesLienBloc" style="display:none;">
      <label>Lien — à envoyer, révocable</label>
      <div class="lien-copie"><code id="accesLienTexte"></code><button type="button" class="btn-ghost btn-sm" id="accesCopierBtn">Copier</button></div>
    </div>
    <div class="field"><label class="chk"><input type="checkbox" id="aActif" checked> Accès actif</label></div>
    <div class="modal-actions">
      <button type="button" class="btn-ghost" id="accesModalCancel">Annuler</button>
      <button type="button" class="btn-secondary" id="accesModalSave">Enregistrer</button>
    </div>
  </div>
</div>

<script>
let tourneesCache = [], accesCache = [];
const TYPE_LABEL = { stage_manager:'Stage manager', technicien:'Technicien·ne', salle:'Salle' };

function activeTourneeId(){ return document.getElementById('tourneeSelect').value; }
function datesDeLaTournee(){
  const t = tourneesCache.find(x=>x.id===activeTourneeId());
  return t ? (t.dates||[]).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')) : [];
}
function libelleDate(d){
  const jour = d.date ? new Date(d.date+'T00:00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
  return `${jour} · ${d.ville || d.lieu || '—'}`;
}

function render(){
  const box = document.getElementById('accesListe');
  const empty = document.getElementById('accesEmpty');
  const liste = accesCache.filter(a=> a.tourneeId === activeTourneeId());
  if(liste.length===0){ box.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  const lien = (a)=> location.origin + location.pathname.replace('partage.html','technique-partage.html') + '?jeton=' + a.id;
  box.innerHTML = liste.map(a=>`
    <div class="acces-card">
      <div class="acces-top">
        <span class="acces-nom">${escapeHtml(a.libelle || 'Sans nom')}</span>
        <span class="badge ${a.actif ? 'badge-hayon' : 'badge-sans-hayon'}">${a.actif ? 'actif' : 'révoqué'}</span>
      </div>
      <span class="badge badge-accent" style="margin-top:6px; display:inline-block;">${TYPE_LABEL[a.type]||a.type}</span>
      ${a.type==='salle' ? `<div style="font-size:12px; color:var(--muted); margin-top:6px;">${(a.datesIds||[]).length} date${(a.datesIds||[]).length>1?'s':''} concernée${(a.datesIds||[]).length>1?'s':''}</div>` : ''}
      <div class="lien-copie"><code>${escapeHtml(lien(a))}</code><button type="button" class="btn-ghost btn-sm btn-copier" data-url="${escapeAttr(lien(a))}">Copier</button></div>
      <div class="acces-actions">
        <button type="button" class="btn-ghost btn-sm" data-edit="${a.id}">Modifier</button>
        <button type="button" class="btn-danger btn-sm" data-del="${a.id}">Supprimer</button>
      </div>
    </div>
  `).join('');
  box.querySelectorAll('[data-edit]').forEach(b=> b.addEventListener('click', ()=> openAccesModal(b.dataset.edit)));
  box.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=>{
    const a = accesCache.find(x=>x.id===b.dataset.del);
    if(a && confirm(`Supprimer l'accès « ${a.libelle || 'sans nom'} » ? Le lien cessera de fonctionner.`)){
      accesCache = accesCache.filter(x=>x.id!==b.dataset.del);
      CurieuxDB.removeOne('acces_logistique', b.dataset.del);
      render();
    }
  }));
}
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('.btn-copier');
  if(!btn) return;
  navigator.clipboard.writeText(btn.dataset.url);
  const orig = btn.textContent; btn.textContent = 'Copié !';
  setTimeout(()=> btn.textContent = orig, 1500);
});

function renderDatesChoix(datesIdsSelectionnees){
  const box = document.getElementById('datesChoixListe');
  const dates = datesDeLaTournee();
  if(dates.length===0){ box.innerHTML = `<p class="empty-hint" style="padding:6px 0;">Aucune date sur cette tournée.</p>`; return; }
  box.innerHTML = dates.map(d=>`
    <label class="chk"><input type="checkbox" data-date="${d.id}" ${datesIdsSelectionnees.includes(d.id)?'checked':''}> ${escapeHtml(libelleDate(d))}</label>
  `).join('');
}
document.getElementById('aType').addEventListener('change', (e)=>{
  document.getElementById('datesChoixField').style.display = e.target.value === 'salle' ? 'block' : 'none';
});

function openAccesModal(id){
  document.getElementById('aEditId').value = id || '';
  if(id){
    const a = accesCache.find(x=>x.id===id);
    if(!a) return;
    document.getElementById('accesModalTitle').textContent = 'Modifier cet accès';
    document.getElementById('aLibelle').value = a.libelle || '';
    document.getElementById('aType').value = a.type || 'stage_manager';
    document.getElementById('aActif').checked = a.actif !== false;
    document.getElementById('datesChoixField').style.display = a.type === 'salle' ? 'block' : 'none';
    renderDatesChoix(a.datesIds || []);
    document.getElementById('accesLienBloc').style.display = 'block';
    document.getElementById('accesLienTexte').textContent = location.origin + location.pathname.replace('partage.html','technique-partage.html') + '?jeton=' + a.id;
  } else {
    document.getElementById('accesModalTitle').textContent = 'Nouvel accès';
    document.getElementById('aLibelle').value = '';
    document.getElementById('aType').value = 'stage_manager';
    document.getElementById('aActif').checked = true;
    document.getElementById('datesChoixField').style.display = 'none';
    renderDatesChoix([]);
    document.getElementById('accesLienBloc').style.display = 'none';
  }
  document.getElementById('accesModalOverlay').classList.add('open');
}
document.getElementById('addAccesBtn').addEventListener('click', ()=> openAccesModal(null));
document.getElementById('accesModalCancel').addEventListener('click', ()=> document.getElementById('accesModalOverlay').classList.remove('open'));
document.getElementById('accesModalOverlay').addEventListener('click', (e)=>{ if(e.target.id==='accesModalOverlay') document.getElementById('accesModalOverlay').classList.remove('open'); });
document.getElementById('accesCopierBtn').addEventListener('click', ()=>{
  navigator.clipboard.writeText(document.getElementById('accesLienTexte').textContent);
  const btn = document.getElementById('accesCopierBtn');
  const orig = btn.textContent; btn.textContent = 'Copié !';
  setTimeout(()=> btn.textContent = orig, 1500);
});
document.getElementById('accesModalSave').addEventListener('click', async ()=>{
  const id = document.getElementById('aEditId').value || genId('acces');
  const libelle = document.getElementById('aLibelle').value.trim();
  if(!libelle){ alert('Précise le destinataire de ce lien.'); return; }
  const type = document.getElementById('aType').value;
  const datesIds = type === 'salle'
    ? Array.from(document.querySelectorAll('#datesChoixListe [data-date]:checked')).map(cb=>cb.dataset.date)
    : [];
  const obj = { id, libelle, tourneeId: activeTourneeId(), type, datesIds, actif: document.getElementById('aActif').checked };
  const idx = accesCache.findIndex(x=>x.id===id);
  const estNouveau = idx < 0;
  if(idx>=0) accesCache[idx]=obj; else accesCache.push(obj);
  await CurieuxDB.upsertOne('acces_logistique', obj);
  if(estNouveau) openAccesModal(id);
  else document.getElementById('accesModalOverlay').classList.remove('open');
  render();
});

async function initData(){
  [tourneesCache, accesCache] = await Promise.all([CurieuxDB.fetchAll('tournees'), CurieuxDB.fetchAll('acces_logistique')]);
  const sel = document.getElementById('tourneeSelect');
  sel.innerHTML = tourneesCache.length
    ? tourneesCache.map(t=>`<option value="${t.id}">${escapeHtml(t.nom || 'Tournée sans nom')}</option>`).join('')
    : '<option value="">Aucune tournée</option>';
  sel.addEventListener('change', render);
  render();
}
CurieuxDB.subscribe('acces_logistique', ()=> CurieuxDB.fetchAll('acces_logistique').then(l=>{ accesCache=l; curieuxRafraichir(render); }));

injectCurieuxFonts();
initNavDropdowns();
initGlobalSearch(document.querySelector('.page-nav'));
applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);
initData();
</script>
</body>
</html>
