   jour de dépôt. Personne ne va redéposer trente PDF pour ça. */
function ecartsDePupitre(parties){
  return (parties || []).map(p => {
    const devine = partitionsPupitreNormalise(partitionsPupitreDe(p.nom));
    const range = partitionsPupitreNormalise(p.pupitre);
    return (devine !== range && devine !== 'Autre') ? { partie: p, de: range, vers: devine } : null;
  }).filter(Boolean);
}

/* Bloc 3 — LA DISTRIBUTION. Qui lit quoi, opération par opération.
   C'est ici que se règle le geste que l'ancienne page envoyait sur un second
   écran : on est déjà dans le spectacle, l'opération se choisit d'un onglet,
   et l'effectif proposé est celui de cette opération — pas l'annuaire entier. */
function blocDistribution(s){
  const opes = operationsDe(s.id);
  if(!opes.length){
    return `
      <section class="bloc">
        <h2>Qui lit quoi</h2>
        <p class="vide">Rattache d'abord ce spectacle à une opération, plus haut. C'est elle qui dit qui est à l'affiche — et donc à qui proposer ses parties.</p>
      </section>`;
  }

  const onglets = opes.map(o => {
    const aff = affectationsDeSpectacle(s.id, o.tourneeId);
    return `<button type="button" class="onglet${o.tourneeId === state.tourneeId ? ' actif' : ''}${aff.length ? '' : ' alerte'}" data-onglet="${escapeAttr(o.tourneeId)}">
        ${escapeHtml(o.nom)}
        <small>${escapeHtml(o.periode || 'sans date')} · ${aff.length} affectation${aff.length > 1 ? 's' : ''}</small>
      </button>`;
  }).join('');

  if(!state.tourneeId || !estProgramme(s.id, state.tourneeId)){
    return `<section class="bloc"><h2>Qui lit quoi</h2><div class="onglets">${onglets}</div>
      <p class="vide">Choisis l'opération à distribuer.</p></section>`;
  }

  // Le journal n'est lu que si la matrice le demande — voir chargerRetraits.
  if(state.matriceMode === 'retrait') chargerRetraits();

  const effectif = effectifAffichable(state.tourneeId, s.id);
  const aff = affectationsDeSpectacle(s.id, state.tourneeId);
  const parties = partiesDe(s.id);

  // Les deux compteurs qui sauvent. Le second se lit à l'envers — il part de
  // l'effectif réel de l'opération, pas du matériel — et c'est celui qu'on
  // oublie : quelqu'un qui arrive à la première sans rien à jouer. Il compte
  // TOUTES les affectations de l'opération, pas seulement celles de ce
  // spectacle : sur une soirée à deux œuvres, quelqu'un peut n'être attendu
  // que sur la seconde.
  const partiesLues = new Set(aff.map(a => a.partieId));
  const sansLecteur = parties.filter(p => !partiesLues.has(p.id));
  const servisSurOpe = new Set(affectationsDe(state.tourneeId).map(a => a.personType + '|' + a.personId));
  const sansPartie = effectif.filter(p => !p.horsEffectif && !servisSurOpe.has(p.personType + '|' + p.personId));

  // Reprendre l'affectation d'une AUTRE opération DE CE SPECTACLE : c'est le
  // seul report qui ait un sens, puisque les parties doivent exister des deux
  // côtés.
  const autres = operationsDe(s.id)
    .filter(o => o.tourneeId !== state.tourneeId && affectationsDeSpectacle(s.id, o.tourneeId).length);

  const enListe = state.affVue === 'liste' || mediaPetitEcran();
  const corps = !parties.length
    ? '<p class="vide">Ce spectacle n\'a aucune partie. Range d\'abord son matériel, juste au-dessus.</p>'
    : !effectif.length
      ? '<p class="vide">Personne n\'est affecté aux dates de cette opération. L\'effectif se lit dans les dates — commence par les renseigner.</p>'
      : enListe ? listeAffectation(parties, effectif, aff)
                : matriceAffectation(parties, effectif, aff, retraitsParPersonne(state.tourneeId));

  return `
    <section class="bloc">
      <h2>Qui lit quoi
        <span class="h2-total bascule-matrice">
          <button type="button" class="co-btn sm${state.affVue === 'matrice' ? ' primary' : ' ghost'}" data-aff-vue="matrice">Matrice</button>
          <button type="button" class="co-btn sm${state.affVue === 'liste' ? ' primary' : ' ghost'}" data-aff-vue="liste">Liste</button>
        </span>
      </h2>
      <div class="onglets">${onglets}</div>
      <div class="chiffres" style="margin-bottom:12px">
        <div class="chiffre"><b>${effectif.length}</b><span>personnes sur l'opé</span>
          <small>lues dans les dates, pas dans la nomenclature</small></div>
        <div class="chiffre${sansLecteur.length ? ' alerte' : ''}"><b>${sansLecteur.length}</b><span>parties sans lecteur</span>
          <small>${sansLecteur.length ? escapeHtml(sansLecteur.slice(0, 4).map(p => p.nom).join(', ')) + (sansLecteur.length > 4 ? '…' : '') : 'Tout le matériel est distribué'}</small></div>
        <div class="chiffre${sansPartie.length ? ' alerte' : ''}"><b>${sansPartie.length}</b><span>personnes sans partie</span>
          <small>${sansPartie.length ? escapeHtml(sansPartie.slice(0, 4).map(p => p.nom).join(', ')) + (sansPartie.length > 4 ? '…' : '') : 'Tout le monde a de quoi jouer'}</small></div>
      </div>
      ${parties.length && effectif.length ? `<div class="barre">
        <button type="button" class="co-btn sm ghost" id="btnProposer"
          title="Lit l'instrument de chacun et propose sa partie. Rien n'est enregistré avant relecture.">Proposer d'après les instruments…</button>
        ${autres.length ? `<select class="co-select" id="selReprendre" style="width:280px">
          <option value="">Reprendre l'affectation d'une autre opération…</option>
          ${autres.map(o => `<option value="${escapeAttr(o.tourneeId)}">${escapeHtml(o.nom)} (${affectationsDeSpectacle(s.id, o.tourneeId).length})</option>`).join('')}
        </select>` : ''}
      </div>` : ''}
      ${corps}
    </section>

    ${blocCode(state.tourneeId)}

    ${sansPartie.length ? `
    <section class="bloc">
      <h2>Personnes sans aucune partie sur ${escapeHtml(nomOperation(state.tourneeId))} <span class="h2-total">${sansPartie.length}</span></h2>
      <p class="vide">Elles sont affectées à au moins une date de l'opération et n'ont rien à jouer, tous spectacles confondus. Soit il manque une partie, soit elles n'en ont pas besoin — la page ne tranche pas.</p>
      ${sansPartie.map(p => `<div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="l-nom"><span class="l-titre">${escapeHtml(p.nom)}</span>
          <span class="l-sous">${escapeHtml([p.pupitre, p.instrument].filter(Boolean).join(' · '))} — ${p.nbDates} date${p.nbDates > 1 ? 's' : ''}</span></span>
        ${partitionsPupitreHtml(p.pupitre)}
      </div>`).join('')}
    </section>` : ''}`;
}

/* ---------------------------------------------------------------------------
   LA MATRICE — personnes en lignes, parties en colonnes.

   C'est le cœur du changement. « Qui lit quoi » est une question à deux
   entrées : on la lisait par partie, jamais par personne, et l'oubli se
   découvrait à la première répétition. La matrice les donne ensemble, avec
   la colonne des noms collée à gauche et la ligne des parties collée en haut.

   RIEN NE S'AFFECTE SEUL, ici non plus. musiciens.instrument est du texte
   libre et se trompe ; ce que la page en tire, c'est une PROPOSITION relue
   (ficheProposition), jamais une écriture. Ce qu'on accélère ensuite, c'est
   le GESTE — on coche les huit violons dans la colonne des noms, on clique
   l'en-tête « Violon 1 », et les huit sont affectés d'un coup. La décision
   reste humaine, la saisie ne l'est plus.
   --------------------------------------------------------------------------- */
function matriceAffectation(parties, effectif, aff, retraits){
  const mode = state.matriceMode;
  const cle = (a) => a.partieId + '|' + a.personType + '|' + a.personId;
  const affParCle = new Map(aff.map(a => [cle(a), a]));
  const selection = state.selection || new Set();

  // L'en-tête : une colonne par partie, teintée de son pupitre, avec le nombre
  // de lecteurs dessous. Une colonne à zéro passe en rouge — c'est une partie
  // que personne n'a.
  const colonnes = parties.map(p => {
    const n = aff.filter(a => a.partieId === p.id).length;
    const nbF = fichiersDe(p.id).length;
    return `<div class="mat-col${n ? '' : ' orpheline'}${nbF ? '' : ' sans-fichier'}">
      <span class="teinte" style="background:${partitionsPupitreVar(p.pupitre)}"></span>
      <button type="button" data-col="${escapeAttr(p.id)}"
              title="${escapeAttr(p.nom + ' — ' + (p.pupitre || 'pupitre inconnu') + ' · '
                + (nbF ? nbF + ' fichier' + (nbF > 1 ? 's' : '') : 'aucun fichier déposé')
                + '. Cliquer pour affecter les personnes cochées.')}">${escapeHtml(p.nom)}</button>
      <span class="lecteurs-n">${n}</span>
    </div>`;
  }).join('');

  // Les lignes, groupées par pupitre de personne. Le groupe est un bandeau
  // dont l'étiquette est collée à gauche : en défilant vers la droite, on sait
  // toujours dans quel pupitre on est.
  const groupes = [];
  effectif.forEach(e => {
    const pup = partitionsPupitreNormalise(e.pupitre);
    const dernier = groupes[groupes.length - 1];
    if(dernier && dernier.pupitre === pup) dernier.gens.push(e);
    else groupes.push({ pupitre: pup, gens: [e] });
  });

  const lignes = groupes.map(g => {
    const teinte = partitionsPupitreVar(g.pupitre);
    const encre = partitionsPupitreVar(g.pupitre, true);
    const entete = `<div class="co-matrix-row">
      <div class="mat-pup" style="background:${teinte}; color:${encre}"><span class="etiq">${escapeHtml(g.pupitre)} — ${g.gens.length}</span></div>
    </div>`;
    const corps = g.gens.map(e => {
      const cleP = e.personType + '|' + e.personId;
      const pris = retraits.get(cleP) || new Set();
      const dus = mode === 'retrait' ? fichiersDus(state.tourneeId, e.personType, e.personId) : [];
      const nPris = dus.filter(id => pris.has(id)).length;
      const mesAff = aff.filter(a => a.personType === e.personType && a.personId === e.personId);
      const cases = parties.map(p => {
        const estAff = affParCle.has(p.id + '|' + cleP);
        let classe = '', glyphe = '';
        if(estAff){
          if(mode === 'retrait'){
            const fs = fichiersDe(p.id);
            const tout = fs.length && fs.every(f => pris.has(f.id));
            classe = tout ? ' on' : ' attente';
            glyphe = tout ? '✓' : '↓';
          } else { classe = ' on'; glyphe = '✓'; }
        }
        return `<div class="co-matrix-cell">
          <button type="button" class="m-case${classe}" data-case="${escapeAttr(p.id + '§' + e.personType + '§' + e.personId)}"
            aria-pressed="${estAff}"
            title="${escapeAttr(e.nom + ' — ' + p.nom + (estAff ? ' : affecté' + (mode === 'retrait' && glyphe === '↓' ? ', pas encore récupéré' : '') : ' : non affecté'))}">${glyphe || '+'}</button>
        </div>`;
      }).join('');
      return `<div class="co-matrix-row${mesAff.length ? '' : ' orphelin'}${e.horsEffectif ? ' hors-effectif' : ''}">
        <div class="co-matrix-name mat-personne">
          <label class="co-check" style="gap:7px;align-items:flex-start">
            <input type="checkbox" data-sel="${escapeAttr(cleP)}"${selection.has(cleP) ? ' checked' : ''}
                   aria-label="Sélectionner ${escapeAttr(e.nom)}">
            <span style="min-width:0">
              <b>${escapeHtml(e.nom)}</b>
              <small>${e.horsEffectif ? 'aucune date sur cette opé' : e.nbDates + ' date' + (e.nbDates > 1 ? 's' : '')}${e.instrument ? ' · ' + escapeHtml(e.instrument) : ''}</small>
              ${dus.length ? `<span class="co-seg fin" role="img" aria-label="${escapeAttr(nPris + ' fichier(s) récupéré(s) sur ' + dus.length)}" title="${escapeAttr(nPris + ' / ' + dus.length + ' fichier(s) récupéré(s)')}">
                ${dus.map(id => `<i class="${pris.has(id) ? '' : 'vide'}"></i>`).join('')}</span>` : ''}
            </span>
          </label>
        </div>
        ${cases}
      </div>`;
    }).join('');
    return entete + corps;
  }).join('');

  const nSel = selection.size;
  const journalEnRoute = mode === 'retrait' && state.retraits === null;
  return `
    <div class="barre" style="margin-bottom:10px">
      <button type="button" class="co-btn sm${mode === 'affectation' ? ' primary' : ' ghost'}" data-mat-mode="affectation">Affectation</button>
      <button type="button" class="co-btn sm${mode === 'retrait' ? ' primary' : ' ghost'}" data-mat-mode="retrait">Retraits</button>
      <span class="pousse" id="selInfo" style="display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)">
        ${nSel ? `<b style="color:var(--text)">${nSel} sélectionné${nSel > 1 ? 'es' : 'e'}</b> — clique un en-tête de partie pour les y affecter
          <button type="button" class="co-btn sm ghost" id="btnSelVider">Vider</button>`
        : 'Coche des personnes, puis clique un en-tête de partie pour les affecter d\'un coup.'}
      </span>
    </div>
    ${journalEnRoute ? '<p class="vide">Lecture du journal des retraits…</p>' : ''}
    <div class="co-matrix">
      <div class="co-matrix-in">
        <div class="co-matrix-row co-matrix-head">
          <div class="co-matrix-name">
            <button type="button" class="co-btn sm ghost" id="btnSelTout" style="padding:3px 9px">
              ${nSel && nSel === effectif.length ? 'Tout décocher' : 'Tout cocher'}</button>
          </div>
          ${colonnes}
        </div>
        ${lignes}
      </div>
    </div>
    <div class="mat-legende">
      <span><i class="mat-puce on"></i> ${mode === 'retrait' ? 'récupéré' : 'affecté'}</span>
      ${mode === 'retrait' ? '<span><i class="mat-puce attente"></i> affecté, pas encore récupéré</span>' : ''}
      <span><i class="mat-puce"></i> non affecté</span>
      <span style="color:var(--ko)">Une ligne soulignée de rouge : personne sans aucune partie de ce spectacle. Une colonne en rouge : partie que personne ne lit.</span>
    </div>`;
}

/* La lecture par partie : celle qu'on garde pour relire une partie à la fois,
   et la seule qui tienne sur un téléphone. */
function listeAffectation(parties, effectif, aff){
  const mus = parId(state.musiciens), tech = parId(state.techniciens);
  return partitionsGrouperParPupitre(parties).map(g => {
    const encre = partitionsPupitreVar(g.pupitre, true);
    const teinte = partitionsPupitreVar(g.pupitre);
    const lignes = g.parties.map(p => {
      const lecteurs = aff.filter(a => a.partieId === p.id).map(a => {
        const personne = (a.personType === 'musicien' ? mus : tech).get(a.personId);
        const nom = personne ? [personne.prenom, personne.nom].filter(Boolean).join(' ') : 'Personne supprimée';
        const dansEffectif = effectif.some(e => e.personType === a.personType && e.personId === a.personId && !e.horsEffectif);
        return `<span class="lecteur${dansEffectif ? '' : ' absent'}" title="${dansEffectif ? '' : 'Cette personne n\'est affectée à aucune date de l\'opération'}">${escapeHtml(nom)}<button type="button" data-desaffecter="${escapeAttr(a.id)}" aria-label="Retirer">×</button></span>`;
      }).join('');
      const libres = effectif.filter(e => !aff.some(a => a.partieId === p.id && a.personId === e.personId && a.personType === e.personType));
      /* Une partie sans fichier à laquelle on affecte quelqu'un est un piège :
         la personne verra une ligne dans son espace et n'aura rien à
         télécharger. Elle se signale donc ici aussi, et pas seulement dans le
         matériel — c'est ici qu'on est au moment de se tromper. */
      const nbF = fichiersDe(p.id).length;
      const mentionF = nbF
        ? `<em style="font-weight:400;color:var(--muted);font-size:12px">${nbF} fichier${nbF > 1 ? 's' : ''}</em>`
        : '<em style="font-weight:700;color:var(--ko);font-size:12px;font-style:normal">aucun fichier</em>';
      return `
        <div class="ligne" style="grid-template-columns:minmax(0,1fr) 200px">
          <span class="l-nom">
            <span class="l-titre">${escapeHtml(p.nom)} ${mentionF}</span>
            ${lecteurs ? `<span class="lecteurs">${lecteurs}</span>` : '<span class="l-sous sans-lecteur">Personne ne lit cette partie</span>'}
          </span>
          <select class="co-select" data-affecter="${escapeAttr(p.id)}">
            <option value="">+ ajouter…</option>
            ${libres.map(e => `<option value="${escapeAttr(e.personType + '|' + e.personId)}">${escapeHtml(e.nom)} — ${escapeHtml(e.pupitre)}</option>`).join('')}
          </select>
        </div>`;
    }).join('');
    return `<div class="pup-bandeau" style="color:${encre}">${escapeHtml(g.pupitre)}
      <span class="trait" style="background:${teinte}"></span></div>${lignes}`;
  }).join('');
}

/* Le code d'accès d'une opération. Une opération, un code — quel que soit le
   nombre de spectacles qu'elle porte : le musicien en saisit un, pas trois.

   IL SE LIT EN GRAND, ET EN POLICE DE TEXTE. Ce code est dicté à voix haute en
   répétition puis retapé sur un téléphone : le « 3 » de la police d'affichage
   s'y lit « Ɛ », et un caractère mal recopié donne un refus que personne ne
   sait expliquer. Chasse fixe, de l'air entre les caractères, et un bouton qui
   le copie — parce que la moitié du temps il part par message.
   La saisie manuelle reste : un code déjà communiqué ne se retire pas d'une
   équipe parce que l'écran a changé. */
function blocCode(tourneeId){
  const acces = accesDe(tourneeId);
  return `
    <section class="bloc">
      <h2>Code d'accès — ${escapeHtml(nomOperation(tourneeId))}</h2>
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="l-nom">
          <span class="l-titre">Le code que les musiciens saisissent une fois</span>
          <span class="l-sous">Leur lien personnel dit qui ils sont ; ce code dit qu'ils sont bien censés jouer ça maintenant. Un lien transféré ne donne rien sans lui. Communique-le en répétition ou par message groupé — pas dans le même message que le lien. Il vaut pour toute l'opération, tous spectacles confondus.</span>
        </span>
        <span class="code-boite">
          <span class="code-valeur${acces.code ? '' : ' absent'}">${acces.code ? escapeHtml(acces.code) : 'aucun code'}</span>
          <span style="display:flex;flex-direction:column;gap:5px">
            <button type="button" class="co-btn sm ghost" id="btnCopierCode"${acces.code ? '' : ' disabled'}>Copier</button>
            <button type="button" class="co-btn sm ghost" id="btnNouveauCode">Tirer un code</button>
          </span>
          <span class="code-saisie">
            <label for="inpCode">ou à la main</label>
            <input class="co-input" id="inpCode" style="width:130px;font-weight:800;letter-spacing:.06em;text-transform:uppercase" maxlength="32" value="${escapeAttr(acces.code)}" placeholder="aucun">
          </span>
        </span>
      </div>
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="l-nom">
          <span class="l-titre">Ouvrir le matériel à partir du</span>
          <span class="l-sous">Laisse vide pour qu'il soit disponible tout de suite. Le matériel d'une création se range des mois avant d'avoir à être lu.</span>
        </span>
        <input class="co-input" type="date" id="inpOuvertLe" style="width:170px" value="${escapeAttr(acces.ouvertLe || '')}">
      </div>
    </section>`;
}

/* Bloc 4 — LES RÉGLAGES DU SPECTACLE. */
function blocReglages(s){
  return `
    <section class="bloc">
      <h2>Réglages de ce spectacle</h2>
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">Chiffrer les partitions au téléchargement</span>
          <span class="l-sous">AES-256, le code de l'opération sert de mot de passe. forScore sait l'ouvrir ; MobileSheets et Newzik ne le documentent pas — à vérifier sur les tablettes du pupitre avant d'activer.</span>
        </span>
        <span></span>
        <label class="co-check"><input type="checkbox" id="chkChiffrer" ${s.chiffrer ? 'checked' : ''}> <span>${s.chiffrer ? 'Activé' : 'Désactivé'}</span></label>
      </div>
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">Sauvegarde sur le Drive</span>
          <span class="l-sous">Le lien du dossier qui garde le matériel hors de ce site. Si l'application disparaît, le matériel ne disparaît pas avec elle.</span>
        </span>
        <span></span>
        <input class="co-input" id="inpDrive" style="width:260px" placeholder="https://drive.google.com/…" value="${escapeAttr(s.lienDrive || '')}">
      </div>
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">Archiver ce spectacle</span>
          <span class="l-sous">Il passe en bas de la liste et cesse d'être proposé. Rien n'est supprimé : les affectations passées, leur journal de téléchargement et les fichiers restent en place.</span>
        </span>
        <span></span>
        <label class="co-check"><input type="checkbox" id="chkArchive" ${s.archive ? 'checked' : ''}> <span>${s.archive ? 'Archivé' : 'Actif'}</span></label>
      </div>
      ${blocSuppression(s)}
    </section>`;
}

/* La suppression définitive, et les deux raisons de la traiter à part.

   ELLE EST RÉSERVÉE AUX COMPTES ADMIN. Toute l'équipe entre sur cette page
   pour déposer et distribuer ; effacer d'un clic le matériel d'un spectacle —
   les PDF avec — n'est pas du même ordre, et c'est la garde que le projet pose
   déjà sur le budget et les devis. Le bouton n'est pas caché aux autres : il
   est remplacé par la raison, sinon on cherche ce qui a disparu de son écran.

   ELLE N'EST PAS LE GESTE COURANT. Un spectacle qui ne se joue plus
   s'ARCHIVE : il sort des listes et rien ne se perd. La suppression sert à
   autre chose — un doublon créé par erreur, un essai, un matériel déposé sous
   le mauvais nom. Le texte le dit, parce que personne ne lit une page d'aide
   mais tout le monde lit la ligne qu'il a sous les yeux. */
function blocSuppression(s){
  if(!state.admin){
    return `
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">Supprimer ce spectacle</span>
          <span class="l-sous">Réservé aux comptes admin — la suppression emporte les fichiers déposés, et le stockage ne les rend pas. Archive-le, ou demande à un compte admin.</span>
        </span>
        <span></span>
        <span class="l-num">—</span>
      </div>`;
  }
  const inv = inventaireSpectacle(s);
  return `
    <div class="ligne">
      <span class="l-nom">
        <span class="l-titre sans-lecteur">Supprimer définitivement ce spectacle</span>
        <span class="l-sous">Emporte ${inv.parties.length} partie${inv.parties.length > 1 ? 's' : ''}, ${inv.fichiers.length} fichier${inv.fichiers.length > 1 ? 's' : ''}${inv.poids ? ' (' + partitionsPoids(inv.poids) + ')' : ''}, ${inv.affectations.length} affectation${inv.affectations.length > 1 ? 's' : ''} et ${inv.envois.length} remise${inv.envois.length > 1 ? 's' : ''} à l'extérieur. Pour un spectacle qui ne se joue plus, archive-le : rien n'est perdu et il sort des listes.</span>
      </span>
      <span></span>
      <button type="button" class="co-btn sm" id="btnSupprimerSpectacle">Supprimer…</button>
    </div>`;
}

/* --- VUE 3 : LE DÉPÔT ------------------------------------------------------ */

/* Ce qui n'a pas été reconnu est SÉPARÉ, et non plus seulement remonté en tête.
   Deux blocs : ce qui demande une décision, et ce qui n'en demande pas. On ne
   relit pas trente lignes, on règle les quatre qui posent question — et le
   bloc vert se replie d'un clic quand il est long. */
function vueDepot(){
  const spectacle = spectacleCourant();
  if(!spectacle) return '<div class="co-card co-pad vide">Choisis d\'abord un spectacle.</div>';
  const parties = partiesDe(spectacle.id);

  const ligneDepot = (d) => {
    const idx = state.depot.indexOf(d);
    const options = [
      `<option value="">— nouvelle partie « ${escapeHtml(d.propose)} » —</option>`,
      ...parties.map(p => `<option value="${escapeAttr(p.id)}"${d.partieId === p.id ? ' selected' : ''}>${escapeHtml(p.nom)}</option>`),
    ].join('');
    const indice = d.candidats && d.candidats.length
      ? `Plusieurs parties possibles : ${escapeHtml(d.candidats.map(c => c.nom).join(', '))} — à trancher.`
      : d.sûrete === 'aucune' ? `Aucune partie ne correspond : une nouvelle sera créée, pupitre ${escapeHtml(partitionsPupitreDe(d.propose))}.`
      : '';
    const aRegler = d.sûrete === 'aucune' || d.sûrete === 'incertaine';
    // La bordure gauche dit la sûreté avant qu'on ait lu la pastille : vert ce
    // qui est sûr, ambre ce qui est probable, rouge ce qui demande une décision.
    return `
      <div class="dep-ligne ${aRegler ? 'aRegler' : escapeAttr(d.sûrete)}">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(d.nomOrigine)}</span>
          <span class="l-sous">${partitionsPoids(d.octets)} ${indice ? '· ' + indice : ''}</span>
        </span>
        <select class="co-select" data-depot-partie="${idx}">${options}</select>
        <span style="display:flex;gap:8px;align-items:center">
          <span class="sur ${escapeAttr(d.sûrete)}">${escapeHtml(d.sûrete)}</span>
          <button type="button" class="co-btn ghost sm" data-depot-retirer="${idx}" style="padding:2px 9px;min-height:0" aria-label="Retirer ${escapeAttr(d.nomOrigine)} du dépôt">×</button>
        </span>
      </div>`;
  };

  const aRegler = state.depot.filter(d => d.sûrete === 'aucune' || d.sûrete === 'incertaine');
  const prets = state.depot.filter(d => !(d.sûrete === 'aucune' || d.sûrete === 'incertaine'));
  const poids = state.depot.reduce((acc, d) => acc + d.octets, 0);
  const enCours = state.depotEnCours > 0;

  return `
    <section class="bloc">
      <h2>Déposer dans — ${escapeHtml(spectacle.nom)}
        <span class="h2-total"><button type="button" class="co-btn ghost sm" id="btnRetourSpectacle">Retour au spectacle</button></span>
      </h2>
      <div class="depot-zone" id="zoneDepot">
        <b>Glisse les PDF ici, ou clique pour les choisir</b>
        La page lit le nom de chaque fichier et propose sa partie. Tu ne corriges que ce qu'elle a raté.
        <input type="file" id="inpFichiers" accept="application/pdf,.pdf" multiple hidden>
      </div>
    </section>
    ${state.depot.length ? `
    <section class="bloc">
      <h2>${state.depot.length} fichier${state.depot.length > 1 ? 's' : ''} à déposer
        <span class="h2-total">${partitionsPoids(poids)}
          <button type="button" class="co-btn sm primary" id="btnConfirmerDepot"${enCours ? ' disabled' : ''}>Déposer</button>
        </span>
      </h2>
      ${enCours ? `<div class="depot-barre"><i style="width:${(state.depotEnCours / state.depot.length * 100).toFixed(0)}%"></i></div>
        <p class="vide">Dépôt ${state.depotEnCours} / ${state.depot.length}…</p>` : ''}
      ${aRegler.length ? `
        <p class="vide sans-lecteur">${aRegler.length} fichier${aRegler.length > 1 ? 's demandent' : ' demande'} une décision.</p>
        ${aRegler.map(ligneDepot).join('')}` : ''}
      ${prets.length ? `
        <details${aRegler.length ? '' : ' open'} style="margin-top:${aRegler.length ? '12px' : '0'}">
          <summary style="cursor:pointer;font-size:12px;font-weight:800;color:var(--ok);padding:6px 0">
            ${prets.length} fichier${prets.length > 1 ? 's' : ''} reconnu${prets.length > 1 ? 's' : ''} — vérifier d'un coup d'œil
          </summary>
          ${prets.map(ligneDepot).join('')}
        </details>` : ''}
    </section>` : ''}`;
}

/* --- VUE 4 : PAR OPÉRATION (la relecture) ---------------------------------- */

function vueOperations(){
  const selecteur = `
    <div class="barre">
      <select class="co-select" id="selOperation" style="min-width:280px">
        <option value="">— choisir une opération —</option>
        ${optionsOperations(state.tourneeId)}
      </select>
    </div>`;

  if(!state.tourneeId || !operationDe(state.tourneeId)){
    return selecteur + `<div class="co-card co-pad vide">
      Cet écran sert à la relecture d'avant première répétition : sur une opération donnée, ce qui est programmé et qui n'a rien à jouer.
      Pour préparer du matériel, passe par <b>Spectacles</b>.</div>`;
  }

  const effectif = effectifDe(state.tourneeId);
  const aff = affectationsDe(state.tourneeId);
  const servis = new Set(aff.map(a => a.personType + '|' + a.personId));
  const sansPartie = effectif.filter(p => !servis.has(p.personType + '|' + p.personId));
  const programmes = spectaclesDe(state.tourneeId);

  const lignes = programmes.map(s => {
    const affS = affectationsDeSpectacle(s.id, state.tourneeId);
    const parties = partiesDe(s.id);
    const lues = new Set(affS.map(a => a.partieId));
    const sansLecteur = parties.filter(p => !lues.has(p.id)).length;
    const sansFichier = parties.filter(p => !fichiersDe(p.id).length).length;
    const alertes = [
      !parties.length ? 'aucune partie rangée' : '',
      sansFichier ? `${sansFichier} partie(s) sans fichier` : '',
      sansLecteur ? `${sansLecteur} partie(s) sans lecteur` : '',
    ].filter(Boolean);
    // La jauge et les pastilles de pupitre plutôt qu'une ligne de plus : cet
    // écran se lit la veille d'une première, et un trou doit s'y voir sans
    // qu'on ouvre le spectacle.
    const pastilles = partitionsGrouperParPupitre(parties).map(g =>
      partitionsPupitreHtml(g.pupitre, { texte: g.pupitre + ' ' + g.parties.length,
                                         titre: g.parties.map(x => x.nom).join(', ') })).join('');
    return `
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(s.nom || 'Sans nom')}</span>
          <span class="l-sous${alertes.length ? ' sans-lecteur' : ''}">${escapeHtml(alertes.length ? alertes.join(' · ') : 'Tout est rangé et distribué')}</span>
          ${parties.length ? `<span style="display:block;margin-top:6px;max-width:320px">${partitionsJaugeHtml(parties, aUnFichier, { fin: true })}</span>` : ''}
          ${pastilles ? `<span class="spec-pups" style="margin-top:6px">${pastilles}</span>` : ''}
        </span>
        <span class="l-num">${affS.length} affectation${affS.length > 1 ? 's' : ''}<br><em style="font-weight:400">${parties.length} partie${parties.length > 1 ? 's' : ''}</em></span>
        <button type="button" class="co-btn ghost sm" data-ouvrir="${escapeAttr(s.id)}">Ouvrir</button>
      </div>`;
  }).join('');

  const restants = state.spectacles.filter(s => !s.archive && !estProgramme(s.id, state.tourneeId));

  return `
    ${selecteur}
    <div class="chiffres">
      <div class="chiffre"><b>${effectif.length}</b><span>personnes sur l'opé</span>
        <small>lues dans les dates, pas dans la nomenclature</small></div>
      <div class="chiffre${programmes.length ? '' : ' alerte'}"><b>${programmes.length}</b><span>spectacle${programmes.length > 1 ? 's programmés' : ' programmé'}</span>
        <small>${programmes.length ? escapeHtml(programmes.slice(0, 3).map(s => s.nom).join(', ')) + (programmes.length > 3 ? '…' : '') : 'Aucun matériel rattaché à cette opération'}</small></div>
      <div class="chiffre${sansPartie.length ? ' alerte' : ''}"><b>${sansPartie.length}</b><span>personnes sans partie</span>
        <small>${sansPartie.length ? escapeHtml(sansPartie.slice(0, 4).map(p => p.nom).join(', ')) + (sansPartie.length > 4 ? '…' : '') : 'Tout le monde a de quoi jouer'}</small></div>
    </div>

    <section class="bloc">
      <h2>Spectacles programmés sur ${escapeHtml(nomOperation(state.tourneeId))}</h2>
      ${lignes || '<p class="vide sans-lecteur">Aucun spectacle programmé sur cette opération : personne n\'y recevra de partition.</p>'}
      ${restants.length ? `
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) 280px">
        <span class="l-nom">
          <span class="l-titre">Programmer un spectacle sur cette opération</span>
          <span class="l-sous">Le matériel déjà rangé se reprend tel quel — il n'y a rien à redéposer.</span>
        </span>
        <select class="co-select" id="selProgrammerIci">
          <option value="">— choisir un spectacle —</option>
          ${restants.map(s => `<option value="${escapeAttr(s.id)}">${escapeHtml(s.nom || 'Sans nom')}</option>`).join('')}
        </select>
      </div>` : ''}
    </section>

    ${programmes.length ? blocCode(state.tourneeId) : ''}

    ${sansPartie.length ? `
    <section class="bloc">
      <h2>Personnes sans aucune partie</h2>
      <p class="vide">Elles sont affectées à au moins une date de l'opération et n'ont rien à jouer, tous spectacles confondus.</p>
      ${sansPartie.map(p => `<div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="l-nom"><span class="l-titre">${escapeHtml(p.nom)}</span>
          <span class="l-sous">${escapeHtml([p.pupitre, p.instrument].filter(Boolean).join(' · '))} — ${p.nbDates} date${p.nbDates > 1 ? 's' : ''}</span></span>
        ${partitionsPupitreHtml(p.pupitre)}
      </div>`).join('')}
    </section>` : ''}`;
}

/* --- VUE 5 : LES RETRAITS --------------------------------------------------
   Le journal existait en base et n'apparaissait sur aucun écran de production.
   Il répond à la seule question qu'on se pose la veille d'une première : qui
   n'a pas encore sa musique ? On commence donc par ceux-là, et le journal
   détaillé vient après — c'est une preuve, pas un tableau de bord.

   LECTURE SEULE. C'est /api/partition qui écrit, au moment où il pose le jeton
   invisible sur le PDF ; rien ne se corrige ici, et c'est ce qui en fait une
   preuve.
   --------------------------------------------------------------------------- */

function vueRetraits(){
  chargerRetraits();

  const selecteur = `
    <div class="barre">
      <select class="co-select" id="selOperationRet" style="min-width:280px">
        <option value="">— choisir une opération —</option>
        ${optionsOperations(state.tourneeId)}
      </select>
    </div>`;
  if(!state.tourneeId || !operationDe(state.tourneeId)){
    return selecteur + `<div class="co-card co-pad vide">
      Choisis une opération pour voir qui a récupéré sa musique — et qui reste à relancer.</div>`;
  }
  if(state.retraits === null){
    return selecteur + '<div class="co-card co-pad vide">Lecture du journal des retraits…</div>';
  }

  const effectif = effectifAffichable(state.tourneeId);
  const retraits = retraitsParPersonne(state.tourneeId);
  const journal = retraitsDe(state.tourneeId).slice()
    .sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));

  const etats = effectif.map(e => {
    const dus = fichiersDus(state.tourneeId, e.personType, e.personId);
    const pris = retraits.get(e.personType + '|' + e.personId) || new Set();
    return Object.assign({}, e, { dus: dus.length, pris: dus.filter(id => pris.has(id)).length });
  }).filter(e => e.dus > 0);

  const rien = etats.filter(e => e.pris === 0);
  const partiel = etats.filter(e => e.pris > 0 && e.pris < e.dus);
  const complet = etats.filter(e => e.pris === e.dus);

  const ligneEtat = (e) => `
    <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto auto">
      <span class="l-nom">
        <span class="l-titre">${escapeHtml(e.nom)}</span>
        <span class="l-sous">${escapeHtml([e.pupitre, e.instrument].filter(Boolean).join(' · ')) || 'Pupitre non renseigné'}</span>
      </span>
      <span class="l-num">${e.pris} / ${e.dus}</span>
      ${partitionsPupitreHtml(e.pupitre)}
    </div>`;

  return `
    ${selecteur}
    <div class="chiffres">
      <div class="chiffre"><b>${complet.length}</b><span>ont tout récupéré</span>
        <small>sur ${etats.length} personne${etats.length > 1 ? 's' : ''} à qui du matériel est affecté</small></div>
      <div class="chiffre${partiel.length ? ' alerte' : ''}"><b>${partiel.length}</b><span>retrait partiel</span>
        <small>il leur manque au moins un fichier — souvent un ajout tardif</small></div>
      <div class="chiffre${rien.length ? ' alerte' : ''}"><b>${rien.length}</b><span>n'ont rien récupéré</span>
        <small>${rien.length ? 'À relancer avant la première répétition' : 'Personne ne manque à l\'appel'}</small></div>
      <div class="chiffre"><b>${journal.length}</b><span>exemplaires sortis</span>
        <small>${journal.length ? 'Dernier : ' + escapeHtml(quandCourt(journal[0].createdAt)) : 'Aucun téléchargement à ce jour'}</small></div>
    </div>

    ${rien.length || partiel.length ? `
    <section class="bloc">
      <h2>À relancer <span class="h2-total">${rien.length + partiel.length}
        <button type="button" class="co-btn sm ghost" id="btnCopierRelance">Copier les noms</button></span></h2>
      <p class="vide">Le lien personnel de chacun est déjà valide : il n'y a rien à renvoyer, seulement à rappeler le code de l'opération et l'existence du bloc « Mes partitions » dans leur espace.</p>
      ${rien.map(ligneEtat).join('')}
      ${partiel.map(ligneEtat).join('')}
    </section>` : `
    <section class="bloc">
      <h2>À relancer</h2>
      <p class="vide">${etats.length ? 'Tout le monde a récupéré l\'intégralité de sa musique.' : 'Aucun matériel n\'est encore affecté sur cette opération.'}</p>
    </section>`}

    ${complet.length ? `
    <section class="bloc">
      <h2>Ont tout récupéré <span class="h2-total">${complet.length}</span></h2>
      ${complet.map(ligneEtat).join('')}
    </section>` : ''}

    <section class="bloc">
      <h2>Journal des retraits <span class="h2-total">${journal.length} ligne${journal.length > 1 ? 's' : ''}</span></h2>
      <p class="vide">Chaque exemplaire téléchargé porte un jeton invisible, rappelé ici. Une partition qui ressort ailleurs se rattache donc à la ligne qui l'a produite. Les libellés sont figés au moment du retrait : un renommage ultérieur ne les réécrit pas, c'est ce qui fait d'un journal une preuve.</p>
      ${journal.length
        ? journal.slice(0, 200).map(r => `
          <div class="ret-ligne">
            <span class="l-nom">
              <span class="l-titre">${escapeHtml(r.personne || 'Personne inconnue')}</span>
              <span class="l-sous">${escapeHtml(r.partie)}${r.spectacle ? ' · ' + escapeHtml(r.spectacle) : ''} — ${partitionsPoids(r.octets)}</span>
            </span>
            <span class="ret-jeton" title="Jeton de filigrane">${escapeHtml(r.jetonFiligrane || '')}</span>
            <span class="ret-quand">${escapeHtml(quandCourt(r.createdAt))}</span>
          </div>`).join('')
          + (journal.length > 200 ? `<p class="vide">Les 200 derniers retraits sont affichés ; ${journal.length - 200} plus anciens ne le sont pas.</p>` : '')
        : '<p class="vide">Aucun téléchargement pour cette opération.</p>'}
    </section>`;
}

/* --- VUE 6 : LES TRANSMISSIONS À UN TIERS ----------------------------------
   Un orchestre étranger reprend le programme et doit travailler dessus. Ses
   cinquante musiciens ne sont pas les nôtres : ils n'ont ni fiche dans
   l'annuaire, ni lien personnel, et leur en créer cinquante pour une
   coproduction serait faux (ils apparaîtraient ensuite dans les plannings et
   les budgets) autant qu'ingérable. On confie donc le lot à la MAISON,
   représentée par la personne qui en répond — bibliothécaire, régisseur
   d'orchestre —, avec un lien, un code et une date de fin. C'est elle qui
   distribue en interne, comme elle le fait déjà pour son propre matériel.

   RIEN N'EST ASSOUPLI POUR AUTANT. Le bucket reste privé, le fichier propre ne
   sort jamais, chaque exemplaire est filigrané à la volée et journalisé un par
   un — au nom de l'ensemble, qui est le bon niveau de responsabilité pour une
   transmission entre maisons.

   CE QUE CET ÉCRAN NE VÉRIFIE PAS, ET QUI EST LE RISQUE PRINCIPAL : les
   DROITS. Retransmettre du matériel de LOCATION (Durand, Boosey, Schott…) à un
   autre ensemble est interdit par la quasi-totalité des contrats de location —
   c'est l'éditeur qui loue au second ensemble, pas nous qui lui prêtons. Aucun
   logiciel ne peut le savoir. La case à cocher n'autorise rien : elle
   enregistre que quelqu'un l'a affirmé, avec la date et l'auteur, dans le
   journal d'audit.
   --------------------------------------------------------------------------- */

const ENVOI_DUREE_PROPOSEE = 90;   // jours — le temps d'une préparation d'orchestre

/* Le lien d'un lot. DEUX PAGES ET NON UNE, et ce n'est pas cosmétique : un chef
   de chœur et un bibliothécaire d'orchestre ne cherchent pas la même chose en
   ouvrant leur lien. Le premier veut ses quatre voix, leurs tonalités et de quoi
   faire travailler quarante choristes ; le second veut trente parties et une
   archive. Une page unique qui aurait dit les deux aurait mal dit les deux. */
function lienEnvoi(e){
  const page = estChoeur(e) ? 'partition-choeur.html?c=' : 'partition-envoi.html?e=';
  return `${location.origin}/${page}${encodeURIComponent(e.jeton)}`;
}

const estChoeur = (e) => (e || {}).type === 'choeur';

/* ---------------------------------------------------------------------------
   LES DATES D'UN LOT — et pourquoi un chœur en a besoin quand un orchestre
   invité n'en a pas.

   Un orchestre invité reprend LE PROGRAMME : il joue ses propres dates, chez
   lui, et nos dates ne le regardent pas. Un chœur, lui, chante AVEC NOUS, et il
   change d'une date à l'autre — une maîtrise à Rennes, un chœur régional à
   Nantes, une chorale locale pour la dernière. C'est la règle plus que
   l'exception : un chœur amateur ne part pas en tournée.

   Plusieurs chœurs sur un même spectacle étaient déjà possibles — un lot
   chacun, un lien chacun, un code chacun. Ce qui manquait, c'est QUI CHANTE
   QUAND, et c'est cette question qui commande les loges, le transport, les
   repas et la jauge de plateau. Sans elle, l'effectif s'additionnait à
   l'échelle de la série et ne correspondait à aucune journée réelle.
   --------------------------------------------------------------------------- */

function datesOperation(tourneeId){
  const t = operationDe(tourneeId);
  return ((t || {}).dates || [])
    .filter(d => d && d.id && d.date)
    .slice()
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
}

/* Les dates d'un lot, résolues. Une date supprimée de l'opération depuis laisse
   un identifiant orphelin : on ne l'invente pas, on le compte (voir
   datesOrphelines) — et l'écran le dit, plutôt que d'afficher un lot qui
   semble porter trois dates alors qu'il n'en porte plus que deux. */
function datesDuLot(e){
  const ids = new Set((e || {}).dates || []);
  if(!ids.size) return [];
  return datesOperation(e.tourneeId).filter(d => ids.has(d.id));
}
const datesOrphelines = (e) => ((e || {}).dates || []).length - datesDuLot(e).length;

function jourDate(iso, options){
  const d = new Date(String(iso || '') + 'T12:00:00');
  if(isNaN(d)) return String(iso || '');
  return d.toLocaleDateString('fr-FR', options || { day: 'numeric', month: 'short' });
}

/* La nature d'une date dans le vocabulaire du projet : une tournée a des
   concerts et des répétitions, un recording a des prises et des overdubs. On
   ne redéfinit pas la liste ici — elle est dans ui-helpers.js, et le jour où
   elle bouge, elle bouge partout. */
function natureDate(tourneeId, d){
  const voc = vocabulaireProjet(operationDe(tourneeId));
  const ligne = (voc.typesDate || []).find(([cle]) => cle === (d || {}).type);
  return ligne ? ligne[1] : '';
}

function libelleDate(tourneeId, d){
  const lieu = [d.ville, d.lieu].filter(Boolean)
    .filter((v, i, a) => a.findIndex(x => String(x).toLowerCase() === String(v).toLowerCase()) === i)
    .join(' · ');
  const nature = natureDate(tourneeId, d);
  return [jourDate(d.date), lieu, nature].filter(Boolean).join(' · ');
}

/* Le résumé des dates d'un lot, tel qu'il se lit dans une ligne. Une date :
   on la nomme. Plusieurs : on donne les bornes — « 12 → 14 mars », ce qu'un
   œil lit sans compter. Aucune : on le DIT, parce qu'un lot de chœur sans date
   est presque toujours un oubli, et qu'il ne se verra nulle part ailleurs. */
function resumeDatesLot(e){
  const dates = datesDuLot(e);
  const orphelines = datesOrphelines(e);
  const annulees = dates.filter(d => estAnnulee(d)).length;
  if(!dates.length && !orphelines) return { texte: 'aucune date précisée', alerte: true };
  const vives = dates.filter(d => !estAnnulee(d));
  const base = !vives.length ? 'toutes les dates annulées'
    : vives.length === 1 ? jourDate(vives[0].date, { day: 'numeric', month: 'long' })
    : `${vives.length} dates · ${jourDate(vives[0].date)} → ${jourDate(vives[vives.length - 1].date)}`;
  const bouts = [base];
  if(annulees) bouts.push(annulees + (annulees > 1 ? ' annulées' : ' annulée'));
  if(orphelines) bouts.push(orphelines + (orphelines > 1 ? ' dates supprimées' : ' date supprimée'));
  return { texte: bouts.join(' · '), alerte: !vives.length || !!orphelines };
}

/* La liste à cocher des dates d'une opération. Elle se REDESSINE SEULE quand on
   change d'opération dans le formulaire, sans rendu complet : un rendu
   effacerait le nom du chœur qu'on vient de taper. */
function htmlChoixDates(tourneeId, coches){
  const dates = datesOperation(tourneeId);
  if(!tourneeId){
    return `<span class="l-sous">Choisis d'abord une opération : les dates en viennent.</span>`;
  }
  if(!dates.length){
    return `<span class="l-sous sans-lecteur">Cette opération n'a aucune date. Elles se posent dans l'écran des tournées.</span>`;
  }
  const dejaCoche = new Set(coches || []);
  return `<span class="lecteurs">
      ${dates.map(d => {
        const off = estAnnulee(d);
        return `<label class="lecteur" style="padding:3px 10px${off ? ';opacity:.55;text-decoration:line-through' : ''}"
          ${off ? 'title="Date annulée — elle ne sera pas montrée au chœur."' : ''}><input type="checkbox" data-cho-date="${escapeAttr(d.id)}"${dejaCoche.has(d.id) ? ' checked' : ''} style="margin-right:6px"> ${escapeHtml(libelleDate(tourneeId, d))}</label>`;
      }).join('')}
    </span>
    <span class="l-sous">Le chef de chœur voit ces dates sur sa page, avant les partitions : c'est ce qu'il regarde d'abord. Une date annulée ne lui est jamais montrée.</span>`;
}

/* Les parties de chœur d'un spectacle, dans l'ordre des tessitures — soprano,
   alto, ténor, basse — et non dans celui du conducteur : voir
   partitionsTrierVoix dans partitions-commun.js. */
function partiesChoeur(spectacleId){
  return partitionsTrierVoix(
    partiesDe(spectacleId).filter(p => partitionsPupitreNormalise(p.pupitre) === 'Chœur'));
}


/* Une date d'écran et de courrier, jamais la forme ISO. « 2026-12-01 » se lit
   dans une base de données ; dans un mail à un bibliothécaire, il se lit comme
   une négligence — et à l'étranger, « 01/12/2026 » se lit parfois janvier. D'où
   la forme longue pour l'anglais, qui ne peut pas se confondre. */
function jourEnvoi(iso, langue){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return iso;
  return langue === 'en'
    ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
    : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

/* L'état d'un lot, en un mot. L'ordre des tests compte : un lot révoqué reste
   révoqué même s'il a par ailleurs expiré — c'est la décision qu'on a prise
   qui doit se lire, pas le calendrier. */
function etatEnvoi(e){
  const jour = new Date().toISOString().slice(0, 10);
  if(!e.actif) return { cle: 'revoque', libelle: 'révoqué', classe: 'ko' };
  if(e.expireLe && e.expireLe < jour) return { cle: 'expire', libelle: 'expiré', classe: 'ko' };
  if(e.ouvertLe && e.ouvertLe > jour) return { cle: 'attente', libelle: 'ouvre le ' + jourEnvoi(e.ouvertLe), classe: 'maybe' };
  return { cle: 'ouvert', libelle: 'ouvert', classe: 'ok' };
}

/* Ce qu'un lot porte RÉELLEMENT. La règle du chœur est la même ici qu'en base
   (voir envoi_partitions) : « tout le spectacle » pour un chœur ne veut pas dire
   le matériel d'orchestre. L'écran doit compter ce que le destinataire recevra,
   sinon il annonce « 34 parties » pour un lot qui en porte quatre, et la
   production croit avoir diffusé ce qu'elle n'a pas diffusé — ou l'inverse. */
function partiesDuLot(e){
  const parties = partiesDe(e.spectacleId);
  if(!e.toutesParties) return parties.filter(p => (e.parties || []).includes(p.id));
  // Trié par tessiture pour un chœur : cette liste sert aussi à écrire le mail
  // au chef de chœur, et « Soprano, Ténor, Basse, Alto » s'y lit comme une
  // erreur de saisie — « Alto » est rangé avec les cordes dans l'ordre du
  // conducteur, qui est celui du matériel.
  return estChoeur(e)
    ? partitionsTrierVoix(parties.filter(p => partitionsPupitreNormalise(p.pupitre) === 'Chœur'))
    : parties;
}

/* Ce qu'un lot a donné : le nombre d'exemplaires pris et la date du dernier.
   null tant que la base n'a pas répondu — et un lot sans aucune prise n'a
   simplement pas de ligne, d'où le zéro par défaut. */
function prisesDe(envoiId){
  if(!state.prisesTiers) return null;
  return state.prisesTiers.parEnvoi[envoiId] || { nb: 0, derniere: '' };
}

/* Le message à envoyer, prêt à coller dans un mail. C'est LE geste qui fait
   gagner du temps : le lien et le code ne suffisent pas, il faut dire ce qu'on
   confie, jusqu'à quand, et à quelles conditions — et le dire dans une langue
   que le destinataire lit. Une transmission à un orchestre étranger
   accompagnée d'un mot en français, c'est un appel téléphonique et deux jours
   perdus. */
function messageEnvoi(e, langue){
  return estChoeur(e) ? messageChoeur(e, langue) : messageTiers(e, langue);
}

/* Le mot au chef de chœur. Il ne dit PAS la même chose qu'au bibliothécaire
   d'un orchestre invité, et ce n'est pas une question de ton : ce qu'un chef de
   chœur doit lire avant de répondre, c'est QUELLES VOIX et DANS QUEL TON. Ces
   deux lignes lui évitent d'ouvrir le lien pour savoir s'il a de quoi
   commencer — et nous évitent l'appel du lendemain. */
function messageChoeur(e, langue){
  const spectacle = (state.spectacles.find(x => x.id === e.spectacleId) || {}).nom || '';
  const operation = (state.tournees.find(t => t.id === e.tourneeId) || {}).nom || '';
  const voix = partitionsTrierVoix(partiesDuLot(e));
  const lien = lienEnvoi(e);
  // « Soprano (Ré♭ majeur), Alto, Ténor, Basse » — la tonalité seulement
  // là où elle est renseignée : une parenthèse vide se lit comme un oubli.
  const liste = voix.map(p => {
    const t = partitionsTonalite(p.tonalite);
    return p.nom + (t ? ` (${langue === 'en' ? partitionsTonaliteLangue(p.tonalite, 'en') : t})` : '');
  }).join(', ');
  const de = /^[aeiouœ]/.test(String(spectacle).normalize('NFD').replace(/[\u0300-\u036F]/g, '').toLowerCase())
    ? "d'" : 'de ';
  /* LES DATES AVANT LES PARTITIONS. Un chef de chœur qui reçoit ce mail
     commence par regarder s'il est libre : lui faire ouvrir le lien pour le
     savoir, c'est une réponse en deux jours au lieu de deux heures. Les dates
     annulées ne sont jamais écrites — une date annulée n'est pas une date. */
  const quand = datesDuLot(e).filter(d => !estAnnulee(d));
  const listeDates = quand.map(d => {
    const lieu = [d.ville, d.lieu].filter(Boolean)
      .filter((v, i, a) => a.findIndex(x => String(x).toLowerCase() === String(v).toLowerCase()) === i)
      .join(', ');
    const jour = langue === 'en'
      ? new Date(d.date + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long' })
      : jourDate(d.date, { day: 'numeric', month: 'long' });
    return '  · ' + jour + (lieu ? ' — ' + lieu : '');
  }).join('\n');

  if(langue === 'en'){
    return [
      `Dear ${e.contactNom || 'colleague'},`,
      '',
      `Please find below the choral material for ${spectacle}${operation ? ` (${operation})` : ''}, for your choir to work from.`,
      '',
      listeDates ? `Your choir is expected on:` : null,
      listeDates || null,
      listeDates ? '' : null,
      `Link:  ${lien}`,
      '',
      liste ? `Voice parts: ${liste}.` : 'The voice parts are listed on the page.',
      e.nominatif
        ? 'Parts are downloaded one at a time, each under the name of the singer receiving it: the page asks for that name before every download.'
        : 'You can download everything as a single archive, or voice by voice.',
      e.ouvertLe ? `The link opens on ${jourEnvoi(e.ouvertLe, 'en')}.` : null,
      e.expireLe ? `The link stays open until ${jourEnvoi(e.expireLe, 'en')}.` : null,
      '',
      e.code ? 'I am sending you the access code separately — it is needed to download.' : null,
      e.code ? '' : null,
      'Every copy downloaded carries your choir\u2019s name and an invisible mark identifying the origin of any copy found in circulation. Please do not pass the material on beyond your singers.',
      '',
      'Could you confirm the number of singers, so we can plan dressing rooms, transport and catering?',
      '',
      'With best regards,',
    ].filter(l => l !== null).join('\n');
  }
  return [
    e.contactNom ? `Bonjour ${e.contactNom},` : 'Bonjour,',
    '',
    `Vous trouverez ci-dessous le matériel choral ${de}${spectacle}${operation ? ` (${operation})` : ''}, pour le travail de votre chœur.`,
    '',
    listeDates ? `Votre chœur est attendu :` : null,
    listeDates || null,
    listeDates ? '' : null,
    `Lien : ${lien}`,
    '',
    liste ? `Voix transmises : ${liste}.` : 'Les voix sont détaillées sur la page.',
    e.nominatif
      ? 'Les parties se prennent une par une, chacune au nom du ou de la choriste à qui vous la remettez : la page vous demande ce nom avant chaque téléchargement.'
      : "Tout se télécharge d'un bloc, ou voix par voix.",
    e.ouvertLe ? `Le lien s'ouvre le ${jourEnvoi(e.ouvertLe)}.` : null,
    e.expireLe ? `Le lien reste ouvert jusqu'au ${jourEnvoi(e.expireLe)}.` : null,
    '',
    e.code ? "Je vous communique le code d'accès par un autre canal — il est nécessaire pour télécharger." : null,
    e.code ? '' : null,
    "Chaque exemplaire téléchargé porte le nom de votre chœur, ainsi qu'une marque invisible permettant d'identifier l'origine d'un exemplaire qui circulerait. Merci de ne pas le diffuser au-delà de vos choristes.",
    '',
    'Pourriez-vous nous confirmer votre effectif ? Il conditionne les loges, le transport et la restauration.',
    '',
    'Bien cordialement,',
  ].filter(l => l !== null).join('\n');
}

function messageTiers(e, langue){
  const spectacle = (state.spectacles.find(x => x.id === e.spectacleId) || {}).nom || '';
  const operation = (state.tournees.find(t => t.id === e.tourneeId) || {}).nom || '';
  const nb = partiesDuLot(e).length;
  const lien = lienEnvoi(e);
  // « le matériel de EXPEDITION 33 » se corrige tout seul : un titre qui
  // commence par une voyelle prend l'élision. Un détail, mais il se voit dans
  // la première ligne d'un mail à une maison qu'on ne connaît pas encore.
  const de = /^[aeiouœ]/.test(String(spectacle).normalize('NFD').replace(/[\u0300-\u036F]/g, '').toLowerCase())
    ? "d'" : 'de ';
  /* Les lignes à null sont celles qui n'ont pas lieu d'être (pas de code, pas
     de date de fin) ; les chaînes vides sont des SAUTS DE PARAGRAPHE et
     doivent survivre au filtre. Les confondre donne un pavé de huit lignes
     collées, qu'on relit deux fois avant de trouver le code. */
  /* Les lignes à null sont celles qui n'ont pas lieu d'être ; les chaînes
     vides sont des SAUTS DE PARAGRAPHE et doivent survivre au filtre.

     LE CODE N'EST PAS DANS CE MESSAGE, et c'est le point le plus important de
     cette fonction. L'application affirme deux fois, des deux côtés, qu'il est
     communiqué séparément du lien — c'est ce qui en fait un second facteur.
     Le mettre dans le même mail rendait cette phrase fausse et le dispositif
     décoratif : un mail transféré donnait alors tout. Le bouton « Copier le
     code » reste là pour l'autre canal.

     La fenêtre d'accès se dit EN ENTIER. Annoncer une date de fin sans dire
     que le lot n'ouvre qu'en mars se lit « c'est ouvert maintenant », et le
     destinataire appelle en trouvant porte close. */
  if(langue === 'en'){
    return [
      `Dear ${e.contactNom || 'colleague'},`,
      '',
      `Please find below the orchestral material for ${spectacle}${operation ? ` (${operation})` : ''}, entrusted to ${e.destinataire} for your work.`,
      '',
      `Link:  ${lien}`,
      '',
      e.nominatif
        ? `The set contains ${nb} part${nb > 1 ? 's' : ''}. Parts are downloaded one at a time, each under the name of the player receiving it: the page asks for that name before every download.`
        : `The set contains ${nb} part${nb > 1 ? 's' : ''}. You can download everything as a single archive, or part by part.`,
      e.ouvertLe ? `The link opens on ${jourEnvoi(e.ouvertLe, 'en')}.` : null,
      e.expireLe ? `The link stays open until ${jourEnvoi(e.expireLe, 'en')}.` : null,
      '',
      e.code ? 'I am sending you the access code separately — it is needed to download.' : null,
      e.code ? '' : null,
      'Every copy downloaded carries your ensemble\u2019s name and an invisible mark identifying the origin of any copy found in circulation. Please do not pass the material on beyond your ensemble.',
      '',
      'With best regards,',
    ].filter(l => l !== null).join('\n');
  }
  return [
    e.contactNom ? `Bonjour ${e.contactNom},` : 'Bonjour,',
    '',
    `Vous trouverez ci-dessous le matériel d'orchestre ${de}${spectacle}${operation ? ` (${operation})` : ''}, que nous confions à ${e.destinataire} pour votre travail.`,
    '',
    `Lien : ${lien}`,
    '',
    e.nominatif
      ? `Le lot contient ${nb} partie${nb > 1 ? 's' : ''}. Elles se prennent une par une, chacune au nom du musicien à qui vous la remettez : la page vous demande ce nom avant chaque téléchargement.`
      : `Le lot contient ${nb} partie${nb > 1 ? 's' : ''}. Tout se télécharge d'un bloc, ou partie par partie.`,
    e.ouvertLe ? `Le lien s'ouvre le ${jourEnvoi(e.ouvertLe)}.` : null,
    e.expireLe ? `Le lien reste ouvert jusqu'au ${jourEnvoi(e.expireLe)}.` : null,
    '',
    e.code ? "Je vous communique le code d'accès par un autre canal — il est nécessaire pour télécharger." : null,
    e.code ? '' : null,
    "Chaque exemplaire téléchargé porte le nom de votre ensemble, ainsi qu'une marque invisible permettant d'identifier l'origine d'un exemplaire qui circulerait. Merci de ne pas rediffuser ce matériel au-delà de votre orchestre.",
    '',
    'Bien cordialement,',
  ].filter(l => l !== null).join('\n');
}

/* Le journal des téléchargements n'est lu qu'au premier écran qui en a besoin,
   et une seule fois. C'est une table qui grossit d'une ligne par partition
   remise : la charger à chaque ouverture de la page ferait payer une saison de
   téléchargements à qui vient déposer trois PDF.

   Le rendu qui suit son arrivée est retenu tant qu'une saisie est en cours :
   le journal met deux cents millisecondes à revenir, et un rendu tombé au
   milieu du nom d'un ensemble effacerait le formulaire sous les doigts. */
function chargerJournalTiers(){
  if(state.prisesTiers !== null || state.prisesTiersEnCours) return;
  // Rien de confié, rien à compter. Sans ce refus, ouvrir n'importe quelle
  // fiche de spectacle — le geste le plus courant de la page — lancerait une
  // requête sur le journal des téléchargements pour afficher trois zéros.
  if(!state.envois.length){ state.prisesTiers = { parEnvoi: {} }; return; }
  state.prisesTiersEnCours = true;
  CurieuxDB.prisesTiersParEnvoi()
    .catch(()=> [])
    .then(lignes => {
      const parEnvoi = {};
      (lignes || []).forEach(l => { parEnvoi[l.envoiId] = l; });
      state.prisesTiers = { parEnvoi };
      state.prisesTiersEnCours = false;
      /* On ne re-rend QUE les écrans qui affichent ces nombres. Le journal met
         parfois plusieurs secondes à revenir : un rendu tombé pendant un dépôt
         de trente PDF reconstruirait l'écran sous les pieds de la production —
         le bouton « Déposer » redeviendrait cliquable au milieu de l'envoi, et
         un second clic relancerait tout. Même prudence pour une saisie en
         cours, qu'un rendu effacerait. */
      rendreQuandLaSaisieEstFinie();
    });
}

/* Rendre, mais pas au milieu d'une frappe. Un rendu reconstruit l'écran :
   tombé pendant qu'on tape le nom d'un ensemble, il l'efface ; tombé pendant
   un dépôt de trente PDF, il rend le bouton « Déposer » cliquable au milieu de
   l'envoi. On attend donc que le clavier ait quitté les champs — et on ATTEND
   vraiment, au lieu d'abandonner : un rendu jeté, ce sont des compteurs qui
   n'apparaissent jamais. La vérification est refaite après le focusout parce
   que passer d'un champ au suivant en déclenche un sans que la saisie soit
   finie. */
/* Le formulaire « Confier à un ensemble tiers » porte-t-il déjà quelque chose
   qu'un rendu ferait perdre ? On ne regarde que ce qui vient de la main : les
   dates portent une valeur par défaut, et les comparer ferait croire à une
   saisie sur un formulaire intact. */
function formulaireEnvoiEntame(){
  const texte = ['envDestinataire', 'envContact', 'envEmail', 'envNote',
                 'choDestinataire', 'choContact', 'choEmail', 'choEffectif', 'choNote']
    .some(id => ((document.getElementById(id) || {}).value || '').trim() !== '');
  const coches = ['envNominatif', 'envDroits', 'choNominatif', 'choDroits']
    .some(id => !!(document.getElementById(id) || {}).checked);
  const portee = ((document.getElementById('envPortee') || {}).value || 'tout') !== 'tout'
    || ((document.getElementById('choPortee') || {}).value || 'tout') !== 'tout';
  const parties = Array.from(document.querySelectorAll('[data-env-partie]')).some(c => c.checked);
  const datesCochees = Array.from(document.querySelectorAll('[data-cho-date]')).some(c => c.checked);
  /* UNE TONALITÉ EN COURS DE FRAPPE EST UNE SAISIE COMME UNE AUTRE. Le champ
     n'a pas encore été quitté, donc rien n'est enregistré : un rendu tombé là
     (le journal des retraits qui revient, par exemple) l'effacerait sans un
     mot, et on croirait l'avoir notée. */
  const actif = document.activeElement;
  const tonEnCours = !!(actif && actif.matches && actif.matches('[data-ton-partie], [data-ton-fichier]'));
  return texte || coches || portee || parties || datesCochees || tonEnCours;
}

function rendreQuandLaSaisieEstFinie(){
  /* Tous les écrans sauf le dépôt. Celui-là se refuse en toutes circonstances :
     un rendu tombé au milieu d'un envoi de trente PDF rendrait le bouton
     « Déposer » cliquable, et un second clic relancerait tout. */
  if(state.vue === 'depot') return;
  const enSaisie = ()=>{
    const a = document.activeElement;
    return !!a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
  };
  /* Un formulaire de transmission commencé vaut plus que des compteurs à
     jour : un rendu le vide, et la production retape tout. On renonce alors
     au rendu — les nombres apparaîtront au prochain, qui vient de toute
     façon dès qu'on crée le lot, qu'on change d'écran ou qu'on agit sur un
     lot existant. */
  if(formulaireEnvoiEntame()) return;
  if(!enSaisie()){ rendre(); return; }
  document.addEventListener('focusout', function suite(){
    setTimeout(()=>{
      if(enSaisie()){ document.addEventListener('focusout', suite, { once: true }); return; }
      if(state.vue !== 'depot') rendre();
    }, 0);
  }, { once: true });
}

/* Une ligne de lot confié, la même dans la fiche du spectacle et dans l'écran
   de supervision, pour un ensemble tiers comme pour un chœur. Seuls changent le
   rappel du spectacle — dans sa propre fiche, le répéter à chaque ligne est du
   bruit — et le VOCABULAIRE : un chœur a des voix et un effectif, un orchestre
   invité a des parties. Écrire « 4 parties » à un chef de chœur, c'est lui
   demander de traduire à chaque lecture. */
function ligneEnvoi(e, options){
  const o = options || {};
  const et = etatEnvoi(e);
  const choeur = estChoeur(e);
  const sp = (state.spectacles.find(x => x.id === e.spectacleId) || {}).nom || 'Spectacle supprimé';
  const op = e.tourneeId ? nomOperation(e.tourneeId) : '';
  const nb = partiesDuLot(e).length;
  const prises = prisesDe(e.id);
  const derniere = prises && prises.derniere ? String(prises.derniere).slice(0, 10) : '';
  const contexte = [o.avecSpectacle ? sp : '', op, e.contactNom, e.contactEmail,
                    choeur && e.effectif ? e.effectif + ' choristes' : ''].filter(Boolean).join(' · ');
  // Les dates ne se lisent que sur un lot de chœur, et seulement s'il porte une
  // opération : un orchestre invité joue chez lui, notre calendrier ne le
  // concerne pas.
  const quand = choeur && e.tourneeId ? resumeDatesLot(e) : null;
  const unite = choeur ? (nb > 1 ? 'voix' : 'voix') : (nb > 1 ? 'parties' : 'partie');
  const portee = e.toutesParties
    ? (choeur ? ' (tout le chœur)' : ' (tout le spectacle)')
    : ' (sélection)';
  return `
    <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
      <span class="l-nom">
        <span class="l-titre">${escapeHtml(e.destinataire || (choeur ? 'Chœur sans nom' : 'Sans destinataire'))}
          <span class="sur ${et.classe === 'ok' ? 'exacte' : et.classe === 'maybe' ? 'probable' : 'aucune'}">${escapeHtml(et.libelle)}</span>
          ${e.nominatif ? '<span class="sur probable">nominatif</span>' : ''}
        </span>
        ${contexte ? `<span class="l-sous">${escapeHtml(contexte)}</span>` : ''}
        ${quand ? `<span class="l-sous${quand.alerte ? ' sans-lecteur' : ''}">${escapeHtml(quand.texte)}</span>` : ''}
        <span class="l-sous">${nb} ${unite}${portee}
          ${e.expireLe ? ' · jusqu\'au ' + escapeHtml(jourEnvoi(e.expireLe)) : ' · sans date de fin'}
          ${prises ? ' · ' + prises.nb + ' exemplaire' + (prises.nb > 1 ? 's' : '') + ' pris' + (derniere ? ', dernier le ' + escapeHtml(jourEnvoi(derniere)) : '') : ''}
          ${e.droitsConfirmes ? '' : ' · <b class="sans-lecteur">droits non confirmés</b>'}</span>
        <span class="lecteurs">
          <button type="button" class="co-btn ghost sm" data-copier-lien="${escapeAttr(e.id)}">Copier le lien</button>
          ${e.code ? `<button type="button" class="co-btn ghost sm" data-copier-code="${escapeAttr(e.id)}">Copier le code (${escapeHtml(e.code)})</button>` : ''}
          <button type="button" class="co-btn ghost sm" data-message-fr="${escapeAttr(e.id)}">Message FR</button>
          <button type="button" class="co-btn ghost sm" data-message-en="${escapeAttr(e.id)}">Message EN</button>
        </span>
      </span>
      <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        ${et.cle !== 'revoque' && e.expireLe ? `<button type="button" class="co-btn sm" data-prolonger="${escapeAttr(e.id)}">Prolonger</button>` : ''}
        <button type="button" class="co-btn sm" data-basculer="${escapeAttr(e.id)}">${e.actif ? 'Révoquer' : 'Réactiver'}</button>
        <button type="button" class="co-btn ghost sm" data-retirer-envoi="${escapeAttr(e.id)}">Retirer</button>
      </span>
    </div>`;
}

/* L'ordre de lecture d'une liste de lots : ce qui est ouvert d'abord — c'est
   ce dont on répond aujourd'hui —, le reste ensuite, du plus récent au plus
   ancien. */
function trierEnvois(liste){
  const rang = { ouvert: 0, attente: 1, expire: 2, revoque: 3 };
  return liste.slice().sort((a, b) =>
    (rang[etatEnvoi(a).cle] - rang[etatEnvoi(b).cle])
    || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}

/* L'ÉCRAN DE SUPERVISION. La question qu'on se pose en arrivant ici est
   « qu'est-ce qui est dehors, en ce moment, et chez qui ? » — elle ne se pose
   jamais spectacle par spectacle, d'où un onglet à part. On n'y CRÉE rien :
   confier un lot suppose de choisir des parties et une opération, donc d'être
   dans la fiche du spectacle. Un formulaire ici aurait redemandé le spectacle
   dans un sélecteur, c'est-à-dire exactement le recroisement à la main que la
   page vient de supprimer partout ailleurs. */
function vueTransmissions(){
  chargerJournalTiers();

  // Les lots de chœur ont leur propre écran : les mêler ici ferait lire
  // « 6 lots ouverts » là où il y en a deux qui relèvent de cette page.
  const tous = state.envois.filter(e => !estChoeur(e));
  const lots = trierEnvois(tous);
  const ouverts = lots.filter(e => etatEnvoi(e).cle === 'ouvert');
  const sansDroits = tous.filter(e => !e.droitsConfirmes).length;
  const prises = state.prisesTiers
    ? tous.reduce((n, e) => n + ((state.prisesTiers.parEnvoi[e.id] || {}).nb || 0), 0)
    : null;

  return `
    <div class="chiffres">
      <div class="chiffre"><b>${ouverts.length}</b><span>lot${ouverts.length > 1 ? 's' : ''} ouvert${ouverts.length > 1 ? 's' : ''}</span>
        <small>${ouverts.length ? escapeHtml(ouverts.slice(0, 3).map(e => e.destinataire).join(', ')) + (ouverts.length > 3 ? '…' : '') : 'Aucun matériel confié à l\'extérieur en ce moment'}</small></div>
      <div class="chiffre"><b>${prises === null ? '…' : prises}</b><span>exemplaire${(prises || 0) > 1 ? 's' : ''} pris par des tiers</span>
        <small>sur ${tous.length} transmission${tous.length > 1 ? 's' : ''} au total, révoquées et expirées comprises — le journal, lui, ne s'efface pas</small></div>
      <div class="chiffre${sansDroits ? ' alerte' : ''}"><b>${sansDroits}</b><span>lot${sansDroits > 1 ? 's' : ''} sans vérification des droits</span>
        <small>${sansDroits ? 'Le matériel de location ne se retransmet pas : c\'est l\'éditeur qui loue au second ensemble.' : 'Droits vérifiés sur tous les lots confiés'}</small></div>
    </div>

    <section class="bloc">
      <h2>Ce qui est confié <span class="h2-total">${lots.length} transmission${lots.length > 1 ? 's' : ''}</span></h2>
      ${lots.map(e => ligneEnvoi(e, { avecSpectacle: true })).join('')
        || '<p class="vide">Aucune transmission. Un lot confié remplace l\'envoi individuel à cinquante musiciens qui ne sont pas les nôtres : un lien, un code, une personne qui en répond.<br>Ça se prépare depuis la fiche du spectacle — c\'est là que se choisissent les parties et l\'opération.</p>'}
    </section>`;
}

/* ---------------------------------------------------------------------------
   Bloc 5 — LE CHŒUR.

   POURQUOI UN BLOC À PART, ET PAS UNE LIGNE DE PLUS DANS LE MATÉRIEL
   -----------------------------------------------------------------
   Parce qu'un chœur pose trois questions que l'orchestre ne pose jamais, et
   qu'elles se posent ENSEMBLE : quelles voix, dans quel ton, et à qui on les
   envoie. Éparpillées — les voix dans le matériel, le ton nulle part, l'envoi
   dans les transmissions —, elles obligent à traverser l'écran trois fois et
   à recroiser de tête ; réunies, elles se répondent d'un coup d'œil.

   LA TONALITÉ SE SAISIT ICI ET NULLE PART AILLEURS. C'est le seul endroit de
   l'application où elle a un sens, et c'est le moment où l'on y pense : on la
   note en sortant de la réunion où le chef l'a annoncée, pas trois semaines
   plus tard en cherchant dans quel écran elle se range.

   SUR UN SPECTACLE SANS CHŒUR, LE BLOC SE TAIT — deux lignes et deux gestes,
   pas un formulaire. Le masquer complètement aurait été pire : un chœur qui
   s'ajoute en cours de production ne se cherche pas dans un menu, et la
   question « où range-t-on les voix ? » se pose une fois par spectacle.
   --------------------------------------------------------------------------- */

const CHOEUR_DUREE_PROPOSEE = 120;   // jours — un chœur apprend par cœur, ça prend plus longtemps qu'un orchestre ne déchiffre

function blocChoeur(s){
  chargerJournalTiers();

  const voix = partiesChoeur(s.id);
  const lots = trierEnvois(state.envois.filter(e => e.spectacleId === s.id && estChoeur(e)));
  const autres = partiesDe(s.id).filter(p => partitionsPupitreNormalise(p.pupitre) !== 'Chœur');
  const opes = operationsDe(s.id);
  const aujourdHui = new Date().toISOString().slice(0, 10);

  /* Rien, nulle part : on propose, on n'impose pas. Une ligne, un sélecteur,
     et le bloc se déplie de lui-même dès qu'une voix y entre. */
  if(!voix.length && !lots.length){
    return `
      <section class="bloc" id="blocChoeur">
        <h2>Le chœur</h2>
        <p class="vide">Ce spectacle n'a aucune partie de chœur. S'il en porte un, range ses voix ici : elles se
          transmettent alors séparément du matériel d'orchestre, avec leurs tonalités, à un lien qui n'ouvre
          que sur elles.</p>
        ${autres.length ? `
        <div class="ligne" style="grid-template-columns:minmax(0,1fr) 280px">
          <span class="l-nom">
            <span class="l-titre">Rattacher une partie existante au chœur</span>
            <span class="l-sous">Les voix déjà rangées sous « Chant » y sont souvent : ce pupitre désigne les solistes, le chœur est à part.</span>
          </span>
          <select class="co-select" id="selVersChoeur">
            <option value="">— choisir une partie —</option>
            ${autres.map(p => `<option value="${escapeAttr(p.id)}">${escapeHtml(p.nom)}${p.pupitre ? ' · ' + escapeHtml(p.pupitre) : ''}</option>`).join('')}
          </select>
        </div>` : ''}
        <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
          <span class="l-nom">
            <span class="l-titre">Ou créer les voix</span>
            <span class="l-sous">Soprano, Alto, Ténor, Basse — et leurs divisi. Le dépôt des PDF suit, comme pour le reste du matériel.</span>
          </span>
          <button type="button" class="co-btn sm" id="btnVoixSATB">Créer les quatre voix</button>
        </div>
      </section>`;
  }

  /* Le tableau des voix. Une ligne par voix, sa tonalité à saisir, ses
     fichiers dessous avec la leur quand elle diffère. La tonalité d'un fichier
     vide n'est PAS laissée vide à l'écran : elle affiche celle de sa partie,
     en gris, parce que c'est ce que le chef de chœur recevra — la base
     applique la même règle (voir envoi_partitions). */
  const lignesVoix = voix.map(p => {
    const fs = fichiersDe(p.id);
    const poids = fs.reduce((t, f) => t + (f.octets || 0), 0);
    const tonPartie = partitionsTonalite(p.tonalite);
    const fichiers = fs.length
      ? fs.map(f => {
          const propre = partitionsTonalite(f.tonalite);
          return `<span class="voix-fic">
            <span class="nom">${escapeHtml(f.titre || f.nomOrigine)}</span>
            <span class="det">${partitionsPoids(f.octets)}${f.pages ? ' · ' + f.pages + ' p.' : ''}</span>
            <input class="co-input ton" data-ton-fichier="${escapeAttr(f.id)}" maxlength="40"
                   value="${escapeAttr(propre)}"
                   placeholder="${escapeAttr(tonPartie || 'ton')}"
                   title="${escapeAttr(propre ? 'Tonalité de ce numéro'
                     : tonPartie ? 'Vide : ce numéro prend la tonalité de la voix — ' + tonPartie
                     : 'Tonalité de ce numéro')}">
          </span>`;
        }).join('')
