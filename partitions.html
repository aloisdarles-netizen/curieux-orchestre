<style>
  /* ==========================================================================
     LA CHARTE DE LA PAGE BUDGET, et pas une autre.
     Une carte blanche par section, son titre en petites capitales, ses lignes
     séparées d'un filet. Les classes reprennent celles de budget.html et
     suivi.html pour que les trois pages bougent ensemble le jour où la charte
     bouge.
     ========================================================================== */
  .wrap{max-width:min(1180px, 97vw); margin:0 auto;}

  .chiffres{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:18px;}
  .chiffre{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
  .chiffre b{
    display:block; font-family:var(--font-display); font-size:28px; font-weight:500; color:var(--accent);
    line-height:1.1; font-variant-numeric:tabular-nums;
  }
  .chiffre span{font-size:12.5px; color:var(--muted); font-weight:600;}
  .chiffre small{display:block; font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.4;}
  .chiffre.alerte b{color:var(--ko);}

  .bloc{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px;}
  .bloc + .bloc{margin-top:14px;}
  .bloc h2{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:800; margin:0 0 8px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  }
  .bloc h2 .h2-total{margin-left:auto; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:0;}

  .ligne{
    display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .ligne:last-child{border-bottom:none;}
  .l-nom{min-width:0;}
  .l-titre{font-weight:700; font-size:13.5px; display:block;}
  .l-sous{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:1px; line-height:1.4;}
  .l-num{text-align:right; font-variant-numeric:tabular-nums; font-size:13px; font-weight:800; white-space:nowrap; color:var(--muted);}

  .vide{font-size:13px; color:var(--muted); padding:10px 0; line-height:1.6;}

  /* La jauge de stockage. Le plan Supabase est à 1 Go : à 1,7 Mo la partie
     fusionnée, c'est une vingtaine de programmes. On ne la cache pas dans un
     écran d'administration — elle se lit là où on dépose. */
  .jauge{height:6px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:8px;}
  .jauge i{display:block; height:100%; background:var(--accent); border-radius:999px;}
  .jauge.alerte i{background:var(--ko);}

  /* Les pastilles de sûreté d'appariement. Trois états, trois lectures : ce qui
     est sûr se survole, ce qui ne l'est pas se lit. */
  .sur{
    display:inline-block; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
  }
  .sur.exacte{background:var(--ok-tint); color:var(--ok);}
  .sur.probable{background:var(--maybe-tint); color:var(--maybe);}
  .sur.incertaine, .sur.aucune{background:var(--ko-tint); color:var(--ko);}

  .depot-zone{
    border:2px dashed var(--border); border-radius:var(--radius); padding:26px 18px; text-align:center;
    color:var(--muted); font-size:13.5px; line-height:1.6; cursor:pointer; transition:border-color .12s, background .12s;
  }
  .depot-zone:hover, .depot-zone.survol{border-color:var(--accent); background:var(--champagne);}
  .depot-zone b{display:block; color:var(--text); font-size:15px; margin-bottom:4px;}

  .dep-ligne{
    display:grid; grid-template-columns:minmax(0,1fr) 210px auto; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .dep-ligne:last-child{border-bottom:none;}
  .dep-ligne.aRegler{background:var(--ko-tint); margin:0 -18px; padding:9px 18px;}

  /* Les lecteurs d'une partie : des jetons qu'on retire d'un clic. C'est la
     seule forme qui tienne quand une partie est lue par huit personnes et la
     suivante par une seule. */
  .lecteurs{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .lecteur{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:3px 6px 3px 10px;
  }
  .lecteur button{
    border:none; background:none; cursor:pointer; color:var(--muted); font-size:15px; line-height:1;
    padding:0 2px; min-height:0;
  }
  .lecteur button:hover{color:var(--ko);}
  .lecteur.absent{border-color:var(--ko); color:var(--ko);}

  .sans-lecteur{color:var(--ko); font-weight:700;}

  .barre{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .barre select, .barre input{max-width:100%;}

  /* Les opérations d'un spectacle, en pastilles. Une programmation se lit d'un
     coup d'œil dans la liste des spectacles : c'est elle qui dit à quoi sert ce
     matériel, et son absence est une alerte, pas un détail. */
  .opes{display:flex; flex-wrap:wrap; gap:6px; margin-top:5px;}
  .ope{
    display:inline-block; font-size:11.5px; font-weight:700; white-space:nowrap;
    background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:2px 9px;
  }
  .ope.vide{color:var(--ko); border-color:var(--ko); padding:2px 9px;}

  /* Les onglets d'opération dans l'atelier d'un spectacle : on distribue une
     opération à la fois, et on voit sans chercher combien il y en a d'autres. */
  .onglets{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .onglet{
    border:1px solid var(--border); background:var(--card); border-radius:999px;
    padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text);
    font-family:inherit; line-height:1.3; text-align:left;
  }
  .onglet small{display:block; font-weight:500; font-size:11px; color:var(--muted);}
  .onglet.actif{background:var(--accent); border-color:var(--accent); color:#fff;}
  .onglet.actif small{color:rgba(255,255,255,.82);}
  .onglet.alerte{border-color:var(--ko);}

  /* Le fil d'Ariane de l'atelier. Sans lui, on ne sait plus dans quel spectacle
     on dépose — et on dépose dans le mauvais. */
  .fil{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px;
    font-size:12.5px; color:var(--muted);
  }
  .fil b{font-family:var(--font-display); font-size:22px; font-weight:500; color:var(--text); line-height:1.15;}

  /* La fiche modale — création et modification d'un spectacle, d'une partie.
     On abandonne prompt() : il ne prend qu'un champ, il ne valide rien, et il
     ne permettait pas de demander l'opération au moment où elle se décide. */
  .fiche-ov{position:fixed; inset:0; background:rgba(20,22,23,.55); display:grid; place-items:center; z-index:200; padding:20px;}
  .fiche-bo{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg, 22px);
    padding:22px 24px; max-width:540px; width:100%; max-height:86vh; overflow:auto;
  }
  .fiche-bo h2{font-family:var(--font-display); font-size:21px; font-weight:500; color:var(--accent); margin:0 0 4px; text-transform:none; letter-spacing:0;}
  .fiche-bo p.sous{font-size:12.5px; color:var(--muted); margin:0 0 16px; line-height:1.5;}
  .fiche-bo label.co-label{margin-top:12px;}
  .fiche-bo label.co-label:first-of-type{margin-top:0;}
  .fiche-err{font-size:12.5px; color:var(--ko); font-weight:700; margin-top:10px; min-height:1px;}
  .fiche-pied{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
  .fiche-pied .co-btn.ghost{margin-left:auto;}

  /* La bannière de migration. Une table absente se lit « aucune opération » —
     et ce n'est pas la même chose à faire ensuite. */
  .banniere-alerte{display:flex; gap:11px; align-items:flex-start; background:var(--danger-tint); border-radius:var(--radius); padding:13px 15px; margin-bottom:16px;}
  .banniere-alerte .sig{color:var(--danger); font-weight:900; font-size:15px; line-height:1.4; flex:0 0 auto;}
  .banniere-alerte p{margin:0; font-size:13.5px; line-height:1.5;}
  /* Deux migrations peuvent manquer à la fois : sans cet écart, les deux
     textes se touchent et se lisent comme une seule phrase. */
  .banniere-alerte p + p{margin-top:7px;}
  .banniere-alerte[hidden]{display:none;}

  @media (max-width:760px){
    .bloc{padding:13px 14px;}
    .ligne{grid-template-columns:minmax(0,1fr) auto;}
    .dep-ligne{grid-template-columns:minmax(0,1fr); gap:6px;}
    .dep-ligne.aRegler{margin:0 -14px; padding:9px 14px;}
    input, select{font-size:16px !important;}
  }
</style>

<script>
/* ============================================================================
   Partitions — la page.
   ============================================================================
   Les partitions circulaient par message et par Drive : un lien par pupitre,
   renvoyé à chaque ajout, et personne ne savait qui avait réellement récupéré
   sa partie. Le jour où une partition ressortait ailleurs, rien ne disait d'où
   elle venait. Cette page range le matériel une fois, le distribue nominativement
   à chaque opération, et pose sur chaque exemplaire téléchargé le nom de qui
   l'a pris.

   L'ORDRE DES GESTES, et c'est lui qu'on a corrigé
   -----------------------------------------------
   La première version partait des fichiers : on déposait dans une bibliothèque
   hors sol, puis on ouvrait un SECOND écran où il fallait recroiser à la main
   une opération et un spectacle — sans que rien ne dise lesquels vont ensemble.
   On travaille maintenant dans l'ordre où la production décide :

     1. je crée le SPECTACLE et je dis sur quelle OPÉRATION il se joue ;
     2. j'ouvre ce spectacle et j'y range ses PARTIES et leurs fichiers ;
     3. dans ce même écran, j'y lie les MUSICIENS, opération par opération.

   Tout tient dans une seule page par spectacle. L'écran « Par opération » ne
   sert qu'à la relecture d'avant première répétition : sur cette opé, qu'a-t-on
   programmé, et qui n'a rien à jouer.

   TROIS NIVEAUX, ET C'EST CELUI DU MILIEU QUI TRAVAILLE :
     le SPECTACLE  — EXPEDITION 33. On y dépose le matériel UNE FOIS.
     la PARTIE     — Violon 1, Alto, Piano. C'est l'unité qu'on affecte.
     l'OPÉRATION   — une tournée ou un enregistrement, une ligne de tournees.

   LES RÈGLES QUI TIENNENT TOUT, et qu'il ne faut défaire sous aucun prétexte :

   1. UN SEUL EXEMPLAIRE PROPRE PAR PARTIE, jamais un fichier par musicien·ne.
      C'est ce qui maintient le stockage plat : cinquante musiciens sur une
      partie, c'est un fichier, pas cinquante.
   2. LE MATÉRIEL APPARTIENT AU SPECTACLE, PAS À L'OPÉRATION. EXPEDITION 33
      porte quatre opérations et ne se dépose qu'une fois. C'est pourquoi la
      programmation est une LIGNE DE LIAISON (partitions_programmations) et non
      une colonne sur le spectacle : rattacher une cinquième opération ne coûte
      pas un octet de plus.
   3. LE FILIGRANE SE POSE À LA VOLÉE, dans /api/partition, au moment du
      téléchargement. Le fichier propre ne sort jamais du bucket privé.
   4. L'AFFECTATION PORTE SUR LA PARTIE, pas sur le fichier. Un fichier ajouté
      à trois semaines du concert se propage seul à tous ceux qui la lisent.
   5. LES LIENS PERSONNELS DÉJÀ ENVOYÉS RESTENT VALIDES. Le musicien voit ses
      partitions dans son espace existant ; on ne réémet aucun lien.

   CE QUE CETTE PAGE NE FAIT PAS, et qui est un bon refus :

   — Elle n'apparie PAS automatiquement une partie à une personne d'après son
     instrument. musiciens.instrument est du texte libre : 25 valeurs sur 114
     fiches, avec « Flutes » et « Flûtes », « Alto » et « Altos », et un
     « Violoncelles » à espace final. Un appariement automatique se tromperait,
     et l'erreur ne se découvrirait qu'à la première répétition. L'affectation
     est donc nominative, et la page se contente de la rendre rapide.
   — Elle ne lit PAS la nomenclature de l'opération pour savoir qui joue.
     tournees.nomenclature est un prévisionnel de devis : EXP33-REC-ORCHESTRE
     SYMPHONIQUE y annonce 49 postes et n'a que 16 musiciens affectés. L'effectif
     réel se lit dans dates[].musiciensAssignes, et nulle part ailleurs.
   — Elle n'affiche PAS les partitions dans le navigateur. La CSP interdit
     <object> et <embed> (object-src 'none'), mais pas une <iframe> vers
     /api/partition, qui est same-origin : c'est donc un choix, pas une
     contrainte. Prévisualiser obligerait à poser le filigrane pour un simple
     coup d'œil, donc à écrire une ligne de journal et à brûler un jeton pour
     rien. On télécharge, et le journal ne dit que la vérité.
============================================================================ */

const PLAFOND_STOCKAGE = 1024 * 1024 * 1024;   // le plan Supabase gratuit

let state = {
  vue: 'spectacles',   // 'spectacles' | 'spectacle' | 'depot' | 'operations' | 'transmissions'
  spectacles: [], programmations: [], parties: [], fichiers: [], affectations: [], acces: [], envois: [],
  tournees: [], musiciens: [], techniciens: [],
  spectacleId: '',
  tourneeId: '',      // l'opération en cours de distribution
  depot: [],          // les fichiers choisis, pas encore déposés
  // Les prises d'exemplaires par des ensembles tiers — et elles seules, pas
  // le journal entier : les remises nominatives en représentent l'écrasante
  // majorité et ne s'affichent nulle part ici. Lu au premier écran qui en a
  // besoin ET qui a quelque chose à en dire, une seule fois ensuite.
  // Voir chargerJournalTiers.
  prisesTiers: null,          // { parEnvoi: { <envoiId>: {nb, derniere} }, total }
  prisesTiersEnCours: false,
  chargement: true,
};

/* ---------------------------------------------------------------------------
   LECTURES DÉRIVÉES
   --------------------------------------------------------------------------- */

const parId = (liste) => { const m = new Map(); (liste || []).forEach(x => m.set(x.id, x)); return m; };

function partiesDe(spectacleId){
  return state.parties.filter(p => p.spectacleId === spectacleId)
    .sort((a, b) => (a.ordre - b.ordre) || a.nom.localeCompare(b.nom, 'fr'));
}
function fichiersDe(partieId){
  return state.fichiers.filter(f => f.partieId === partieId)
    .sort((a, b) => (a.ordre - b.ordre) || a.titre.localeCompare(b.titre, 'fr'));
}
function poidsSpectacle(spectacleId){
  const ids = new Set(partiesDe(spectacleId).map(p => p.id));
  return state.fichiers.filter(f => ids.has(f.partieId)).reduce((s, f) => s + (f.octets || 0), 0);
}
const poidsTotal = () => state.fichiers.reduce((s, f) => s + (f.octets || 0), 0);

const spectacleCourant = () => state.spectacles.find(s => s.id === state.spectacleId) || null;
const nomSpectacle = (id) => (state.spectacles.find(s => s.id === id) || {}).nom || 'Spectacle supprimé';
const operationDe = (id) => state.tournees.find(t => t.id === id) || null;
const nomOperation = (id) => (operationDe(id) || {}).nom || 'Opération supprimée';

/* Les bornes d'une opération, lues dans ses dates. Elles servent à deux
   choses : dater une programmation dans une liste, et faire remonter ce qui
   n'est pas encore passé — une production travaille sur ce qui arrive. */
function bornesOperation(t){
  const dates = ((t || {}).dates || []).map(d => d.date).filter(Boolean).sort();
  return { debut: dates[0] || '', fin: dates[dates.length - 1] || '' };
}
function periodeOperation(t){ return libelleSerieDates((t || {}).dates || []); }

function trierOperations(liste){
  const auj = new Date().toISOString().slice(0, 10);
  const fin = (t) => bornesOperation(t).fin;
  const debut = (t) => bornesOperation(t).debut;
  const aVenir = liste.filter(t => fin(t) && fin(t) >= auj).sort((a, b) => debut(a).localeCompare(debut(b)));
  const sansDate = liste.filter(t => !fin(t)).sort((a, b) => (a.nom || '').localeCompare(b.nom || '', 'fr'));
  const passees = liste.filter(t => fin(t) && fin(t) < auj).sort((a, b) => fin(b).localeCompare(fin(a)));
  return [...aVenir, ...sansDate, ...passees];
}

/* LA PROGRAMMATION : « ce spectacle se joue sur cette opération ». C'est elle
   qui ouvre tout le reste — sans elle, le matériel se range et ne se distribue
   pas. On rend toujours les opérations RÉSOLUES, y compris celles dont la
   tournée a été supprimée depuis : une programmation orpheline doit se voir
   pour se retirer, pas disparaître en silence. */
function programmationsDe(spectacleId){
  const liste = state.programmations.filter(p => p.spectacleId === spectacleId);
  const rang = new Map(trierOperations(state.tournees).map((t, i) => [t.id, i]));
  return liste.sort((a, b) => (rang.has(a.tourneeId) ? rang.get(a.tourneeId) : 9e9)
                            - (rang.has(b.tourneeId) ? rang.get(b.tourneeId) : 9e9));
}
function operationsDe(spectacleId){
  return programmationsDe(spectacleId).map(p => {
    const t = operationDe(p.tourneeId);
    return {
      progId: p.id, tourneeId: p.tourneeId, tournee: t, supprimee: !t,
      nom: t ? t.nom : 'Opération supprimée',
      periode: t ? periodeOperation(t) : '',
      recording: estRecording(t),
    };
  });
}
function spectaclesDe(tourneeId){
  const ids = new Set(state.programmations.filter(p => p.tourneeId === tourneeId).map(p => p.spectacleId));
  return state.spectacles.filter(s => ids.has(s.id))
    .sort((a, b) => Number(a.archive) - Number(b.archive) || a.nom.localeCompare(b.nom, 'fr'));
}
const estProgramme = (spectacleId, tourneeId) =>
  state.programmations.some(p => p.spectacleId === spectacleId && p.tourneeId === tourneeId);

/* L'effectif RÉEL d'une opération : l'union des personnes affectées sur ses
   dates. C'est la seule source juste — voir la bannière de tête. Une personne
   qui ne joue qu'une date sur trois en fait partie : elle a besoin de sa
   partie autant que les autres. */
function effectifDe(tourneeId){
  const t = operationDe(tourneeId);
  if(!t) return [];
  const compte = new Map();
  (t.dates || []).forEach(d => {
    (d.musiciensAssignes || []).forEach(id => compte.set('musicien|' + id, (compte.get('musicien|' + id) || 0) + 1));
    (d.techniciensAssignes || []).forEach(id => compte.set('technicien|' + id, (compte.get('technicien|' + id) || 0) + 1));
  });
  const mus = parId(state.musiciens), tech = parId(state.techniciens);
  const out = [];
  compte.forEach((nbDates, cle) => {
    const [personType, personId] = cle.split('|');
    const p = (personType === 'musicien' ? mus : tech).get(personId);
    if(!p) return;   // une personne supprimée de l'annuaire depuis
    out.push({
      personType, personId, nbDates,
      nom: [p.prenom, p.nom].filter(Boolean).join(' ') || 'Sans nom',
      pupitre: p.pupitre || p.pole || '',
      instrument: p.instrument || p.poste || '',
    });
  });
  const rangPupitre = (x) => {
    const i = CURIEUX_PUPITRES.indexOf(x.pupitre);
    return i < 0 ? 99 : i;
  };
  return out.sort((a, b) => rangPupitre(a) - rangPupitre(b) || a.nom.localeCompare(b.nom, 'fr'));
}

function affectationsDe(tourneeId){
  return state.affectations.filter(a => a.tourneeId === tourneeId);
}
/* Les affectations d'UN spectacle sur UNE opération. Deux spectacles peuvent
   partager une opération — un concert narratif et son lever de rideau — et
   « qui lit quoi » ne se lit correctement que spectacle par spectacle. */
function affectationsDeSpectacle(spectacleId, tourneeId){
  const ids = new Set(partiesDe(spectacleId).map(p => p.id));
  return state.affectations.filter(a => a.tourneeId === tourneeId && ids.has(a.partieId));
}
const accesDe = (tourneeId) =>
  state.acces.find(a => a.id === tourneeId) || { id: tourneeId, code: '', actif: true, ouvertLe: '' };

/* ---------------------------------------------------------------------------
   CHARGEMENT
   --------------------------------------------------------------------------- */

async function charger(){
  const [spectacles, programmations, parties, fichiers, affectations, acces, envois,
         tournees, musiciens, techniciens, migrationAbsente, envoisAbsents] = await Promise.all([
    CurieuxDB.fetchAll('partitions_spectacles').catch(()=> []),
    CurieuxDB.fetchAll('partitions_programmations').catch(()=> []),
    CurieuxDB.fetchAll('partitions_parties').catch(()=> []),
    CurieuxDB.fetchAll('partitions_fichiers').catch(()=> []),
    CurieuxDB.fetchAll('partitions_affectations').catch(()=> []),
    CurieuxDB.fetchAll('partitions_acces').catch(()=> []),
    CurieuxDB.fetchAll('partitions_envois').catch(()=> []),
    CurieuxDB.fetchAll('tournees').catch(()=> []),
    CurieuxDB.fetchAll('musiciens').catch(()=> []),
    CurieuxDB.fetchAll('techniciens').catch(()=> []),
    CurieuxDB.tableManquante('partitions_programmations').catch(()=> false),
    CurieuxDB.tableManquante('partitions_envois').catch(()=> false),
  ]);
  Object.assign(state, { spectacles, programmations, parties, fichiers, affectations, acces, envois,
                         tournees, musiciens, techniciens, chargement: false });
  // Une liste vide se lit « rien n'est programmé » ; la vérité peut être « la
  // migration n'est pas jouée ». Ce n'est pas la même chose à faire ensuite —
  // et deux migrations peuvent manquer, sans les mêmes conséquences : on nomme
  // celle qui manque plutôt que d'afficher le texte de l'autre.
  poserBandeauMigration(migrationAbsente, envoisAbsents);

  const url = new URLSearchParams(location.search);
  const spectacle = url.get('spectacle') || '';
  const operation = url.get('operation') || '';
  if(operation) state.tourneeId = operation;
  // Les anciens noms de vue restent valides : des liens et des signets les
  // portent, et ils ne doivent pas atterrir sur un écran au hasard.
  const LEGACY = { bibliotheque: 'spectacles', affectation: 'operations' };
  const vue = url.get('vue');
  if(vue) state.vue = LEGACY[vue] || vue;
  if(spectacle && state.spectacles.some(s => s.id === spectacle)){ ouvrirSpectacle(spectacle, operation); return; }
  /* Une vue demandée gagne toujours ; une opération SANS vue ouvre son écran.
     L'ancienne règle forçait « Par opération » dès qu'une opération
     accompagnait une vue, si bien qu'un lien ?vue=transmissions&operation=…
     atterrissait ailleurs sans rien dire — et qu'un ?operation=… seul restait
     sur la liste des spectacles, avec l'opération retenue mais invisible,
     c'est-à-dire nulle part. */
  if(!vue && operation) state.vue = 'operations';
  rendre();
}

/* Une liste vide se lit « il n'y a rien » ; la vérité peut être « la migration
   n'est pas jouée ». Deux tables peuvent manquer, et pas avec les mêmes
   conséquences : le bandeau nomme celle qui manque et ce qu'elle empêche.
   Afficher le texte de l'une pendant que l'autre manque enverrait jouer le
   mauvais bloc de migrations.sql. */
function poserBandeauMigration(programmationsAbsentes, envoisAbsents){
  const manques = [];
  if(programmationsAbsentes) manques.push(`La table <code>partitions_programmations</code> n'existe pas encore dans Supabase :
    aucun spectacle ne peut être rattaché à une opération, et le matériel déjà rangé s'affiche donc comme non distribué.
    Colle le bloc <b>LA PROGRAMMATION D'UN SPECTACLE SUR UNE OPÉRATION</b> de <code>migrations.sql</code> dans l'éditeur SQL.`);
  if(envoisAbsents) manques.push(`La table <code>partitions_envois</code> n'existe pas encore dans Supabase :
    aucun lot ne peut être confié à un ensemble tiers, et un lien créé ici ne serait enregistré nulle part.
    Colle le bloc <b>LA TRANSMISSION À UN TIERS</b> de <code>migrations.sql</code> dans l'éditeur SQL.`);
  const banniere = document.getElementById('migrationBanner');
  banniere.hidden = !manques.length;
  if(manques.length){
    // Un paragraphe par migration manquante, plus la marche à suivre. Le
    // conteneur est un <div> et non un <p> : un <p> imbriqué dans un <p> est
    // refermé d'office par l'analyseur du navigateur, qui rendait un
    // paragraphe vide et collait les deux textes l'un contre l'autre.
    document.getElementById('migrationTexte').innerHTML =
      manques.map(m => `<p>${m}</p>`).join('') + '<p>Puis recharge cette page.</p>';
  }
}

/* ---------------------------------------------------------------------------
   RENDU
   --------------------------------------------------------------------------- */

function rendre(){
  const onglet = state.vue === 'operations' ? 'operations'
               : state.vue === 'transmissions' ? 'transmissions' : 'spectacles';
  document.querySelectorAll('[data-vue]').forEach(b => b.classList.toggle('primary', b.dataset.vue === onglet));
  const el = document.getElementById('page');
  if(state.chargement){ el.innerHTML = '<div class="co-card co-pad vide">Chargement…</div>'; return; }
  el.innerHTML = state.vue === 'operations' ? vueOperations()
               : state.vue === 'depot' ? vueDepot()
               : state.vue === 'transmissions' ? vueTransmissions()
               : state.vue === 'spectacle' ? vueSpectacle()
               : vueSpectacles();
  cablerVue();
}

function optionsOperations(selectionne, exclure){
  const exclus = new Set(exclure || []);
  return trierOperations(state.tournees.filter(t => !exclus.has(t.id))).map(t => {
    const p = periodeOperation(t);
    return `<option value="${escapeAttr(t.id)}"${t.id === selectionne ? ' selected' : ''}>`
      + `${escapeHtml(t.nom || 'Sans nom')}${estRecording(t) ? ' · Recording' : ''}${p ? ' · ' + escapeHtml(p) : ''}</option>`;
  }).join('');
}

/* --- VUE 1 : LA LISTE DES SPECTACLES -------------------------------------- */

function vueSpectacles(){
  const total = poidsTotal();
  const part = Math.min(1, total / PLAFOND_STOCKAGE);
  const chaud = part > 0.8;
  const servies = new Set(state.affectations.map(a => a.personType + '|' + a.personId)).size;
  const orphelins = state.spectacles.filter(s => !s.archive && !programmationsDe(s.id).length);

  const liste = state.spectacles.slice()
    .sort((a, b) => Number(a.archive) - Number(b.archive) || a.nom.localeCompare(b.nom, 'fr'));

  const lignes = liste.map(s => {
    const parties = partiesDe(s.id);
    const ids = new Set(parties.map(p => p.id));
    const nbFichiers = state.fichiers.filter(f => ids.has(f.partieId)).length;
    const opes = operationsDe(s.id);
    const pastilles = opes.length
      ? opes.map(o => `<span class="ope"${o.supprimee ? ' style="border-color:var(--ko);color:var(--ko)"' : ''}>${escapeHtml(o.nom)}${o.periode ? ' · ' + escapeHtml(o.periode) : ''}</span>`).join('')
      : '<span class="ope vide">Aucune opération — ce matériel ne se distribue pas</span>';
    return `
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(s.nom || 'Sans nom')}${s.archive ? ' <em style="font-weight:400;color:var(--muted)">— archivé</em>' : ''}</span>
          <span class="l-sous">${escapeHtml([s.compositeur, s.arrangeur && 'arr. ' + s.arrangeur].filter(Boolean).join(' · ')) || 'Aucun auteur renseigné'}</span>
          <span class="opes">${pastilles}</span>
        </span>
        <span class="l-num">${parties.length} partie${parties.length > 1 ? 's' : ''}<br><em style="font-weight:400">${nbFichiers} fichier${nbFichiers > 1 ? 's' : ''} · ${partitionsPoids(poidsSpectacle(s.id))}</em></span>
        <button type="button" class="co-btn sm primary" data-ouvrir="${escapeAttr(s.id)}">Ouvrir</button>
      </div>`;
  }).join('');

  return `
    <div class="chiffres">
      <div class="chiffre">
        <b>${state.spectacles.length}</b><span>spectacle${state.spectacles.length > 1 ? 's' : ''}</span>
        <small>${state.parties.length} partie${state.parties.length > 1 ? 's' : ''}, ${state.fichiers.length} fichier${state.fichiers.length > 1 ? 's' : ''}</small>
      </div>
      <div class="chiffre${chaud ? ' alerte' : ''}">
        <b>${partitionsPoids(total)}</b><span>de matériel rangé</span>
        <div class="jauge${chaud ? ' alerte' : ''}"><i style="width:${(part * 100).toFixed(1)}%"></i></div>
        <small>sur 1 Go — soit une vingtaine de programmes à parties fusionnées</small>
      </div>
      <div class="chiffre">
        <b>${servies}</b><span>personnes servies</span>
        <small>${state.affectations.length} affectation(s) sur ${new Set(state.programmations.map(p => p.tourneeId)).size} opération(s)</small>
      </div>
    </div>
    <section class="bloc">
      <h2>Spectacles <span class="h2-total"><button type="button" class="co-btn sm primary" id="btnNouveauSpectacle">Nouveau spectacle</button></span></h2>
      ${orphelins.length ? `<p class="vide sans-lecteur">${orphelins.length} spectacle${orphelins.length > 1 ? 's ne sont rattachés' : ' n\'est rattaché'} à aucune opération : ${escapeHtml(orphelins.slice(0, 4).map(s => s.nom).join(', '))}${orphelins.length > 4 ? '…' : ''}. Tant qu'ils n'en ont pas, personne ne peut recevoir leurs parties.</p>` : ''}
      ${lignes || '<p class="vide">Aucun spectacle. Commence par en créer un : on lui donne son nom, l\'opération sur laquelle il se joue, et on y range ensuite ses parties et ses musiciens.</p>'}
    </section>`;
}

/* --- VUE 2 : L'ATELIER D'UN SPECTACLE ------------------------------------- */

function vueSpectacle(){
  const s = spectacleCourant();
  if(!s) return '<div class="co-card co-pad vide">Ce spectacle n\'existe plus. <button type="button" class="co-btn sm" id="btnRetourListe">Revenir à la liste</button></div>';
  return blocFil(s) + blocOperations(s) + blocMateriel(s) + blocDistribution(s) + blocTransmissions(s) + blocReglages(s);
}

function blocFil(s){
  return `
    <div class="fil">
      <button type="button" class="co-btn ghost sm" id="btnRetourListe">← Tous les spectacles</button>
      <b>${escapeHtml(s.nom || 'Sans nom')}</b>
      <span>${escapeHtml([s.compositeur, s.arrangeur && 'arr. ' + s.arrangeur].filter(Boolean).join(' · '))}</span>
      ${s.archive ? '<span class="ope">archivé</span>' : ''}
      <span style="margin-left:auto"><button type="button" class="co-btn ghost sm" id="btnModifierSpectacle">Modifier la fiche</button></span>
    </div>`;
}

/* Bloc 1 — LES OPÉRATIONS. C'est le premier bloc parce que c'est la première
   décision : ce matériel, pour quoi ? Tant qu'il n'y en a aucune, la
   distribution plus bas n'a rien à montrer, et on le dit plutôt que d'afficher
   un écran vide. */
function blocOperations(s){
  const opes = operationsDe(s.id);
  const lignes = opes.map(o => {
    const aff = affectationsDeSpectacle(s.id, o.tourneeId);
    const effectif = effectifDe(o.tourneeId);
    const servies = new Set(aff.map(a => a.personType + '|' + a.personId)).size;
    const acces = accesDe(o.tourneeId);
    const etat = o.supprimee ? 'Cette opération a été supprimée — à retirer'
      : !aff.length ? 'Rien de distribué sur cette opération'
      : `${servies} personne${servies > 1 ? 's servies' : ' servie'} sur ${effectif.length} à l'affiche`;
    return `
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(o.nom)}${o.recording ? ' <em style="font-weight:400;color:var(--muted)">· Recording</em>' : ''}</span>
          <span class="l-sous${o.supprimee || !aff.length ? ' sans-lecteur' : ''}">${escapeHtml(o.periode || 'Aucune date')} — ${escapeHtml(etat)}</span>
          <span class="l-sous">Code d'accès : <b>${escapeHtml(acces.code || 'aucun')}</b>${acces.ouvertLe ? ' · ouvert à partir du ' + escapeHtml(acces.ouvertLe) : ''}</span>
        </span>
        <button type="button" class="co-btn sm${o.tourneeId === state.tourneeId ? ' primary' : ''}" data-distribuer="${escapeAttr(o.tourneeId)}">Distribuer</button>
        <button type="button" class="co-btn ghost sm" data-deprogrammer="${escapeAttr(o.progId)}">Retirer</button>
      </div>`;
  }).join('');

  const restantes = state.tournees.filter(t => !estProgramme(s.id, t.id));

  return `
    <section class="bloc">
      <h2>Opérations sur lesquelles ce spectacle se joue</h2>
      ${lignes || '<p class="vide sans-lecteur">Ce spectacle n\'est rattaché à aucune opération. Son matériel se range, mais personne ne peut le recevoir : une partition ne se distribue qu\'au titre d\'une opération.</p>'}
      ${restantes.length ? `
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) 280px">
        <span class="l-nom">
          <span class="l-titre">Programmer sur une autre opération</span>
          <span class="l-sous">Le matériel ne se redépose pas : une reprise coûte un clic, pas un octet.</span>
        </span>
        <select class="co-select" id="selProgrammer">
          <option value="">— choisir une opération —</option>
          ${optionsOperations('', state.programmations.filter(p => p.spectacleId === s.id).map(p => p.tourneeId))}
        </select>
      </div>` : ''}
    </section>`;
}

/* Bloc 2 — LE MATÉRIEL. Les parties du spectacle et leurs fichiers. */
function blocMateriel(s){
  const parties = partiesDe(s.id);
  const lignes = parties.map(p => {
    const fs = fichiersDe(p.id);
    const poids = fs.reduce((acc, f) => acc + (f.octets || 0), 0);
    const detail = fs.length
      ? fs.map(f => `<span class="l-sous">— ${escapeHtml(f.titre || f.nomOrigine)} · ${partitionsPoids(f.octets)}${f.pages ? ' · ' + f.pages + ' p.' : ''}
           <button type="button" class="co-btn ghost sm" data-retirer-fichier="${escapeAttr(f.id)}" style="padding:1px 8px;min-height:0;font-size:11px">retirer</button></span>`).join('')
      : '<span class="l-sous sans-lecteur">Aucun fichier — cette partie est annoncée mais rien n\'est déposé</span>';
    return `
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(p.nom)}</span>
          ${detail}
        </span>
        <span class="l-num">${escapeHtml(p.pupitre || '—')}${poids ? '<br><em style="font-weight:400">' + partitionsPoids(poids) + '</em>' : ''}</span>
        <button type="button" class="co-btn ghost sm" data-retirer-partie="${escapeAttr(p.id)}">Retirer</button>
      </div>`;
  }).join('');

  const manquantes = parties.filter(p => !fichiersDe(p.id).length).length;

  return `
    <section class="bloc">
      <h2>Matériel
        <span class="h2-total">
          <button type="button" class="co-btn sm primary" id="btnDeposer">Déposer des fichiers</button>
          <button type="button" class="co-btn sm" id="btnNouvellePartie">Ajouter une partie</button>
        </span>
      </h2>
      ${manquantes ? `<p class="vide sans-lecteur">${manquantes} partie${manquantes > 1 ? 's sont annoncées' : ' est annoncée'} sans aucun fichier déposé.</p>` : ''}
      ${lignes || '<p class="vide">Rien de rangé. Dépose les PDF : la page lit leur nom et propose la partie de chacun.</p>'}
    </section>`;
}

/* Bloc 3 — LA DISTRIBUTION. Qui lit quoi, opération par opération.
   C'est ici que se règle le geste que l'ancienne page envoyait sur un second
   écran : on est déjà dans le spectacle, l'opération se choisit d'un onglet,
   et l'effectif proposé est celui de cette opération — pas l'annuaire entier. */
function blocDistribution(s){
  const opes = operationsDe(s.id);
  if(!opes.length){
    return `
      <section class="bloc">
        <h2>Qui lit quoi</h2>
        <p class="vide">Rattache d'abord ce spectacle à une opération, plus haut. C'est elle qui dit qui est à l'affiche — et donc à qui proposer ses parties.</p>
      </section>`;
  }

  const onglets = opes.map(o => {
    const aff = affectationsDeSpectacle(s.id, o.tourneeId);
    return `<button type="button" class="onglet${o.tourneeId === state.tourneeId ? ' actif' : ''}${aff.length ? '' : ' alerte'}" data-onglet="${escapeAttr(o.tourneeId)}">
        ${escapeHtml(o.nom)}
        <small>${escapeHtml(o.periode || 'sans date')} · ${aff.length} affectation${aff.length > 1 ? 's' : ''}</small>
      </button>`;
  }).join('');

  if(!state.tourneeId || !estProgramme(s.id, state.tourneeId)){
    return `<section class="bloc"><h2>Qui lit quoi</h2><div class="onglets">${onglets}</div>
      <p class="vide">Choisis l'opération à distribuer.</p></section>`;
  }

  const effectif = effectifDe(state.tourneeId);
  const aff = affectationsDeSpectacle(s.id, state.tourneeId);
  const parties = partiesDe(s.id);
  const mus = parId(state.musiciens), tech = parId(state.techniciens);

  // Les deux compteurs qui sauvent. Le second se lit à l'envers — il part de
  // l'effectif réel de l'opération, pas du matériel — et c'est celui qu'on
  // oublie : quelqu'un qui arrive à la première sans rien à jouer. Il compte
  // TOUTES les affectations de l'opération, pas seulement celles de ce
  // spectacle : sur une soirée à deux œuvres, quelqu'un peut n'être attendu
  // que sur la seconde.
  const partiesLues = new Set(aff.map(a => a.partieId));
  const sansLecteur = parties.filter(p => !partiesLues.has(p.id));
  const servisSurOpe = new Set(affectationsDe(state.tourneeId).map(a => a.personType + '|' + a.personId));
  const sansPartie = effectif.filter(p => !servisSurOpe.has(p.personType + '|' + p.personId));

  const lignesParties = parties.map(p => {
    const lecteurs = aff.filter(a => a.partieId === p.id).map(a => {
      const personne = (a.personType === 'musicien' ? mus : tech).get(a.personId);
      const nom = personne ? [personne.prenom, personne.nom].filter(Boolean).join(' ') : 'Personne supprimée';
      const dansEffectif = effectif.some(e => e.personType === a.personType && e.personId === a.personId);
      return `<span class="lecteur${dansEffectif ? '' : ' absent'}" title="${dansEffectif ? '' : 'Cette personne n\'est affectée à aucune date de l\'opération'}">${escapeHtml(nom)}<button type="button" data-desaffecter="${escapeAttr(a.id)}" aria-label="Retirer">×</button></span>`;
    }).join('');
    const libres = effectif.filter(e => !aff.some(a => a.partieId === p.id && a.personId === e.personId && a.personType === e.personType));
    return `
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) 200px">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(p.nom)} <em style="font-weight:400;color:var(--muted);font-size:12px">${escapeHtml(p.pupitre || '')} · ${fichiersDe(p.id).length} fichier(s)</em></span>
          ${lecteurs ? `<span class="lecteurs">${lecteurs}</span>` : '<span class="l-sous sans-lecteur">Personne ne lit cette partie</span>'}
        </span>
        <select class="co-select" data-affecter="${escapeAttr(p.id)}">
          <option value="">+ ajouter…</option>
          ${libres.map(e => `<option value="${escapeAttr(e.personType + '|' + e.personId)}">${escapeHtml(e.nom)} — ${escapeHtml(e.pupitre)}</option>`).join('')}
        </select>
      </div>`;
  }).join('');

  // Reprendre l'affectation d'une AUTRE opération DE CE SPECTACLE : c'est le
  // seul report qui ait un sens, puisque les parties doivent exister des deux
  // côtés.
  const autres = operationsDe(s.id)
    .filter(o => o.tourneeId !== state.tourneeId && affectationsDeSpectacle(s.id, o.tourneeId).length);

  return `
    <section class="bloc">
      <h2>Qui lit quoi</h2>
      <div class="onglets">${onglets}</div>
      <div class="chiffres" style="margin-bottom:12px">
        <div class="chiffre"><b>${effectif.length}</b><span>personnes sur l'opé</span>
          <small>lues dans les dates, pas dans la nomenclature</small></div>
        <div class="chiffre${sansLecteur.length ? ' alerte' : ''}"><b>${sansLecteur.length}</b><span>parties sans lecteur</span>
          <small>${sansLecteur.length ? escapeHtml(sansLecteur.slice(0, 4).map(p => p.nom).join(', ')) + (sansLecteur.length > 4 ? '…' : '') : 'Tout le matériel est distribué'}</small></div>
        <div class="chiffre${sansPartie.length ? ' alerte' : ''}"><b>${sansPartie.length}</b><span>personnes sans partie</span>
          <small>${sansPartie.length ? escapeHtml(sansPartie.slice(0, 4).map(p => p.nom).join(', ')) + (sansPartie.length > 4 ? '…' : '') : 'Tout le monde a de quoi jouer'}</small></div>
      </div>
      ${autres.length ? `<div class="barre">
        <select class="co-select" id="selReprendre" style="width:280px">
          <option value="">Reprendre l'affectation d'une autre opération…</option>
          ${autres.map(o => `<option value="${escapeAttr(o.tourneeId)}">${escapeHtml(o.nom)} (${affectationsDeSpectacle(s.id, o.tourneeId).length})</option>`).join('')}
        </select>
      </div>` : ''}
      ${lignesParties || '<p class="vide">Ce spectacle n\'a aucune partie. Range d\'abord son matériel, juste au-dessus.</p>'}
    </section>

    ${blocCode(state.tourneeId)}

    ${sansPartie.length ? `
    <section class="bloc">
      <h2>Personnes sans aucune partie sur ${escapeHtml(nomOperation(state.tourneeId))}</h2>
      <p class="vide">Elles sont affectées à au moins une date de l'opération et n'ont rien à jouer, tous spectacles confondus. Soit il manque une partie, soit elles n'en ont pas besoin — la page ne tranche pas.</p>
      ${sansPartie.map(p => `<div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="l-nom"><span class="l-titre">${escapeHtml(p.nom)}</span>
          <span class="l-sous">${escapeHtml([p.pupitre, p.instrument].filter(Boolean).join(' · '))} — ${p.nbDates} date${p.nbDates > 1 ? 's' : ''}</span></span>
        <span class="l-num">—</span>
      </div>`).join('')}
    </section>` : ''}`;
}

/* Le code d'accès d'une opération. Une opération, un code — quel que soit le
   nombre de spectacles qu'elle porte : le musicien en saisit un, pas trois. */
function blocCode(tourneeId){
  const acces = accesDe(tourneeId);
  return `
    <section class="bloc">
      <h2>Code d'accès — ${escapeHtml(nomOperation(tourneeId))}</h2>
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto auto">
        <span class="l-nom">
          <span class="l-titre">Le code que les musiciens saisissent une fois</span>
          <span class="l-sous">Leur lien personnel dit qui ils sont ; ce code dit qu'ils sont bien censés jouer ça maintenant. Un lien transféré ne donne rien sans lui. Communique-le en répétition ou par message groupé — pas dans le même message que le lien. Il vaut pour toute l'opération, tous spectacles confondus.</span>
        </span>
        <input class="co-input" id="inpCode" style="width:130px;font-weight:800;letter-spacing:.08em;text-transform:uppercase" maxlength="32" value="${escapeAttr(acces.code)}" placeholder="aucun">
        <button type="button" class="co-btn sm" id="btnNouveauCode">Tirer un code</button>
      </div>
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="l-nom">
          <span class="l-titre">Ouvrir le matériel à partir du</span>
          <span class="l-sous">Laisse vide pour qu'il soit disponible tout de suite. Le matériel d'une création se range des mois avant d'avoir à être lu.</span>
        </span>
        <input class="co-input" type="date" id="inpOuvertLe" value="${escapeAttr(acces.ouvertLe || '')}">
      </div>
    </section>`;
}

/* Bloc 4 — LES RÉGLAGES DU SPECTACLE. */
function blocReglages(s){
  return `
    <section class="bloc">

/* --- VUE 3 : LE DÉPÔT ------------------------------------------------------ */

function vueDepot(){
  const spectacle = spectacleCourant();
  if(!spectacle) return '<div class="co-card co-pad vide">Choisis d\'abord un spectacle.</div>';
  const parties = partiesDe(spectacle.id);

  /* Ce qui n'a pas été reconnu remonte en tête. C'est tout l'intérêt de l'écran :
     on ne relit pas trente lignes, on règle les quatre qui posent question. */
  const rang = { aucune: 0, incertaine: 1, probable: 2, exacte: 3 };
  const liste = state.depot.slice().sort((a, b) => (rang[a.sûrete] - rang[b.sûrete]) || a.nomOrigine.localeCompare(b.nomOrigine, 'fr'));

  const lignes = liste.map((d) => {
    const idx = state.depot.indexOf(d);
    const options = [
      `<option value="">— nouvelle partie « ${escapeHtml(d.propose)} » —</option>`,
      ...parties.map(p => `<option value="${escapeAttr(p.id)}"${d.partieId === p.id ? ' selected' : ''}>${escapeHtml(p.nom)}</option>`),
    ].join('');
    const aRegler = d.sûrete === 'aucune' || d.sûrete === 'incertaine';
    const indice = d.candidats && d.candidats.length
      ? `Plusieurs parties possibles : ${escapeHtml(d.candidats.map(c => c.nom).join(', '))} — à trancher.`
      : d.sûrete === 'aucune' ? `Aucune partie ne correspond : une nouvelle sera créée, pupitre ${escapeHtml(partitionsPupitreDe(d.propose))}.`
      : '';
    return `
      <div class="dep-ligne${aRegler ? ' aRegler' : ''}">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(d.nomOrigine)}</span>
          <span class="l-sous">${partitionsPoids(d.octets)} ${indice ? '· ' + indice : ''}</span>
        </span>
        <select class="co-select" data-depot-partie="${idx}">${options}</select>
        <span style="display:flex;gap:8px;align-items:center">
          <span class="sur ${d.sûrete}">${d.sûrete}</span>
          <button type="button" class="co-btn ghost sm" data-depot-retirer="${idx}" style="padding:2px 9px;min-height:0">×</button>
        </span>
      </div>`;
  }).join('');

  const poids = state.depot.reduce((s, d) => s + d.octets, 0);
  const aRegler = state.depot.filter(d => d.sûrete === 'aucune' || d.sûrete === 'incertaine').length;

  return `
    <section class="bloc">
      <h2>Déposer dans — ${escapeHtml(spectacle.nom)}
        <span class="h2-total"><button type="button" class="co-btn ghost sm" id="btnRetourSpectacle">Retour au spectacle</button></span>
      </h2>
      <div class="depot-zone" id="zoneDepot">
        <b>Glisse les PDF ici, ou clique pour les choisir</b>
        La page lit le nom de chaque fichier et propose sa partie. Tu ne corriges que ce qu'elle a raté.
        <input type="file" id="inpFichiers" accept="application/pdf,.pdf" multiple hidden>
      </div>
    </section>
    ${state.depot.length ? `
    <section class="bloc">
      <h2>${state.depot.length} fichier${state.depot.length > 1 ? 's' : ''} à déposer
        <span class="h2-total">${partitionsPoids(poids)}
          <button type="button" class="co-btn sm primary" id="btnConfirmerDepot" style="margin-left:10px">Déposer</button>
        </span>
      </h2>
      ${aRegler ? `<p class="vide sans-lecteur">${aRegler} fichier${aRegler > 1 ? 's demandent' : ' demande'} une décision — ${aRegler > 1 ? 'ils sont' : 'il est'} en tête de liste.</p>` : '<p class="vide">Tout est reconnu. Vérifie d\'un coup d\'œil et dépose.</p>'}
      ${lignes}

}

/* --- VUE 4 : LES TRANSMISSIONS À UN TIERS ----------------------------------
   Un orchestre étranger reprend le programme et doit travailler dessus. Ses
   cinquante musiciens ne sont pas les nôtres : ils n'ont ni fiche dans
   l'annuaire, ni lien personnel, et leur en créer cinquante pour une
   coproduction serait faux (ils apparaîtraient ensuite dans les plannings et
   les budgets) autant qu'ingérable. On confie donc le lot à la MAISON,
   représentée par la personne qui en répond — bibliothécaire, régisseur
   d'orchestre —, avec un lien, un code et une date de fin. C'est elle qui
   distribue en interne, comme elle le fait déjà pour son propre matériel.

   RIEN N'EST ASSOUPLI POUR AUTANT. Le bucket reste privé, le fichier propre ne
   sort jamais, chaque exemplaire est filigrané à la volée et journalisé un par
   un — au nom de l'ensemble, qui est le bon niveau de responsabilité pour une
   transmission entre maisons.

   CE QUE CET ÉCRAN NE VÉRIFIE PAS, ET QUI EST LE RISQUE PRINCIPAL : les
   DROITS. Retransmettre du matériel de LOCATION (Durand, Boosey, Schott…) à un
   autre ensemble est interdit par la quasi-totalité des contrats de location —
   c'est l'éditeur qui loue au second ensemble, pas nous qui lui prêtons. Aucun
   logiciel ne peut le savoir. La case à cocher n'autorise rien : elle
   enregistre que quelqu'un l'a affirmé, avec la date et l'auteur, dans le
   journal d'audit.
   --------------------------------------------------------------------------- */

const ENVOI_DUREE_PROPOSEE = 90;   // jours — le temps d'une préparation d'orchestre

function lienEnvoi(e){
  return `${location.origin}/partition-envoi.html?e=${encodeURIComponent(e.jeton)}`;
}

/* Une date d'écran et de courrier, jamais la forme ISO. « 2026-12-01 » se lit
   dans une base de données ; dans un mail à un bibliothécaire, il se lit comme
   une négligence — et à l'étranger, « 01/12/2026 » se lit parfois janvier. D'où
   la forme longue pour l'anglais, qui ne peut pas se confondre. */
function jourEnvoi(iso, langue){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return iso;
  return langue === 'en'
    ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
    : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

/* L'état d'un lot, en un mot. L'ordre des tests compte : un lot révoqué reste
   révoqué même s'il a par ailleurs expiré — c'est la décision qu'on a prise
   qui doit se lire, pas le calendrier. */
function etatEnvoi(e){
  const jour = new Date().toISOString().slice(0, 10);
  if(!e.actif) return { cle: 'revoque', libelle: 'révoqué', classe: 'ko' };
  if(e.expireLe && e.expireLe < jour) return { cle: 'expire', libelle: 'expiré', classe: 'ko' };
  if(e.ouvertLe && e.ouvertLe > jour) return { cle: 'attente', libelle: 'ouvre le ' + jourEnvoi(e.ouvertLe), classe: 'maybe' };
  return { cle: 'ouvert', libelle: 'ouvert', classe: 'ok' };
}

function partiesDuLot(e){
  const parties = partiesDe(e.spectacleId);
  return e.toutesParties ? parties : parties.filter(p => (e.parties || []).includes(p.id));
}

/* Ce qu'un lot a donné : le nombre d'exemplaires pris et la date du dernier.
   null tant que la base n'a pas répondu — et un lot sans aucune prise n'a
   simplement pas de ligne, d'où le zéro par défaut. */
function prisesDe(envoiId){
  if(!state.prisesTiers) return null;
  return state.prisesTiers.parEnvoi[envoiId] || { nb: 0, derniere: '' };
}

/* Le message à envoyer, prêt à coller dans un mail. C'est LE geste qui fait
   gagner du temps : le lien et le code ne suffisent pas, il faut dire ce qu'on
   confie, jusqu'à quand, et à quelles conditions — et le dire dans une langue
   que le destinataire lit. Une transmission à un orchestre étranger
   accompagnée d'un mot en français, c'est un appel téléphonique et deux jours
   perdus. */
function messageEnvoi(e, langue){
  const spectacle = (state.spectacles.find(x => x.id === e.spectacleId) || {}).nom || '';
  const operation = (state.tournees.find(t => t.id === e.tourneeId) || {}).nom || '';
  const nb = partiesDuLot(e).length;
  const lien = lienEnvoi(e);
  // « le matériel de EXPEDITION 33 » se corrige tout seul : un titre qui
  // commence par une voyelle prend l'élision. Un détail, mais il se voit dans
  // la première ligne d'un mail à une maison qu'on ne connaît pas encore.
  const de = /^[AEIOUYÀÂÉÈÊÎÔÛaeiouyàâéèêîôûh]/.test(spectacle) ? "d'" : 'de ';
  /* Les lignes à null sont celles qui n'ont pas lieu d'être (pas de code, pas
     de date de fin) ; les chaînes vides sont des SAUTS DE PARAGRAPHE et
     doivent survivre au filtre. Les confondre donne un pavé de huit lignes
     collées, qu'on relit deux fois avant de trouver le code. */
  if(langue === 'en'){
    return [
      `Dear ${e.contactNom || 'colleague'},`,
      '',
      `Please find below the orchestral material for ${spectacle}${operation ? ` (${operation})` : ''}, entrusted to ${e.destinataire} for your work.`,
      '',
      `Link:  ${lien}`,
      e.code ? `Code:  ${e.code}` : null,
      '',
      `The set contains ${nb} part${nb > 1 ? 's' : ''}. You can download everything as a single archive, or part by part.`,
      e.expireLe ? `The link stays open until ${jourEnvoi(e.expireLe, 'en')}.` : null,
      '',
      'Every copy downloaded carries your ensemble’s name and an invisible mark identifying the origin of any copy found in circulation. Please do not pass the material on beyond your ensemble.',
      '',
      'With best regards,',
    ].filter(l => l !== null).join('\n');
  }
  return [
    e.contactNom ? `Bonjour ${e.contactNom},` : 'Bonjour,',
    '',
    `Vous trouverez ci-dessous le matériel d'orchestre ${de}${spectacle}${operation ? ` (${operation})` : ''}, que nous confions à ${e.destinataire} pour votre travail.`,
    '',
    `Lien : ${lien}`,
    e.code ? `Code : ${e.code}` : null,
    '',
    `Le lot contient ${nb} partie${nb > 1 ? 's' : ''}. Tout se télécharge d'un bloc, ou partie par partie.`,
    e.expireLe ? `Le lien reste ouvert jusqu'au ${jourEnvoi(e.expireLe)}.` : null,
    '',
    "Chaque exemplaire téléchargé porte le nom de votre ensemble, ainsi qu'une marque invisible permettant d'identifier l'origine d'un exemplaire qui circulerait. Merci de ne pas rediffuser ce matériel au-delà de votre orchestre.",
    '',
    'Bien cordialement,',
  ].filter(l => l !== null).join('\n');
}

/* Le journal des téléchargements n'est lu qu'au premier écran qui en a besoin,
   et une seule fois. C'est une table qui grossit d'une ligne par partition
   remise : la charger à chaque ouverture de la page ferait payer une saison de
   téléchargements à qui vient déposer trois PDF.

   Le rendu qui suit son arrivée est retenu tant qu'une saisie est en cours :
   le journal met deux cents millisecondes à revenir, et un rendu tombé au
   milieu du nom d'un ensemble effacerait le formulaire sous les doigts. */
function chargerJournalTiers(){
  if(state.prisesTiers !== null || state.prisesTiersEnCours) return;
  // Rien de confié, rien à compter. Sans ce refus, ouvrir n'importe quelle
  // fiche de spectacle — le geste le plus courant de la page — lancerait une
  // requête sur le journal des téléchargements pour afficher trois zéros.
  if(!state.envois.length){ state.prisesTiers = { parEnvoi: {}, total: 0 }; return; }
  state.prisesTiersEnCours = true;
  CurieuxDB.prisesTiersParEnvoi()
    .catch(()=> [])
    .then(lignes => {
      const parEnvoi = {};
      let total = 0;
      (lignes || []).forEach(l => { parEnvoi[l.envoiId] = l; total += l.nb; });
      state.prisesTiers = { parEnvoi, total };
      state.prisesTiersEnCours = false;
      /* On ne re-rend QUE les écrans qui affichent ces nombres. Le journal met
         parfois plusieurs secondes à revenir : un rendu tombé pendant un dépôt
         de trente PDF reconstruirait l'écran sous les pieds de la production —
         le bouton « Déposer » redeviendrait cliquable au milieu de l'envoi, et
         un second clic relancerait tout. Même prudence pour une saisie en
         cours, qu'un rendu effacerait. */
      rendreQuandLaSaisieEstFinie();
    });
}

/* Rendre, mais pas au milieu d'une frappe. Un rendu reconstruit l'écran :
   tombé pendant qu'on tape le nom d'un ensemble, il l'efface ; tombé pendant
   un dépôt de trente PDF, il rend le bouton « Déposer » cliquable au milieu de
   l'envoi. On attend donc que le clavier ait quitté les champs — et on ATTEND
   vraiment, au lieu d'abandonner : un rendu jeté, ce sont des compteurs qui
   n'apparaissent jamais. La vérification est refaite après le focusout parce
   que passer d'un champ au suivant en déclenche un sans que la saisie soit
   finie. */
/* Le formulaire « Confier à un ensemble tiers » porte-t-il déjà quelque chose
   qu'un rendu ferait perdre ? On ne regarde que ce qui vient de la main : les
   dates portent une valeur par défaut, et les comparer ferait croire à une
   saisie sur un formulaire intact. */
function formulaireEnvoiEntame(){
  const texte = ['envDestinataire', 'envContact', 'envEmail', 'envNote']
    .some(id => ((document.getElementById(id) || {}).value || '').trim() !== '');
  const coches = ['envNominatif', 'envDroits']
    .some(id => !!(document.getElementById(id) || {}).checked);
  const portee = ((document.getElementById('envPortee') || {}).value || 'tout') !== 'tout';
  const parties = Array.from(document.querySelectorAll('[data-env-partie]')).some(c => c.checked);
  return texte || coches || portee || parties;
}

function rendreQuandLaSaisieEstFinie(){
  if(state.vue !== 'transmissions' && state.vue !== 'spectacle') return;
  const enSaisie = ()=>{
    const a = document.activeElement;
    return !!a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
  };
  /* Un formulaire de transmission commencé vaut plus que des compteurs à
     jour : un rendu le vide, et la production retape tout. On renonce alors
     au rendu — les nombres apparaîtront au prochain, qui vient de toute
     façon dès qu'on crée le lot, qu'on change d'écran ou qu'on agit sur un
     lot existant. */
  if(formulaireEnvoiEntame()) return;
  if(!enSaisie()){ rendre(); return; }
  document.addEventListener('focusout', function suite(){
    setTimeout(()=>{
      if(enSaisie()){ document.addEventListener('focusout', suite, { once: true }); return; }
      if(state.vue === 'transmissions' || state.vue === 'spectacle') rendre();
    }, 0);
  }, { once: true });
}

/* Une ligne de lot confié, la même dans la fiche du spectacle et dans l'écran
   de supervision. Seul le rappel du spectacle change : dans sa propre fiche,
   le répéter à chaque ligne est du bruit. */
function ligneEnvoi(e, options){
  const o = options || {};
  const et = etatEnvoi(e);
  const sp = (state.spectacles.find(x => x.id === e.spectacleId) || {}).nom || 'Spectacle supprimé';
  const op = e.tourneeId ? nomOperation(e.tourneeId) : '';
  const nb = partiesDuLot(e).length;
  const prises = prisesDe(e.id);
  const derniere = prises && prises.derniere ? String(prises.derniere).slice(0, 10) : '';
  const contexte = [o.avecSpectacle ? sp : '', op, e.contactNom, e.contactEmail].filter(Boolean).join(' · ');
  return `
    <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
      <span class="l-nom">
        <span class="l-titre">${escapeHtml(e.destinataire || 'Sans destinataire')}
          <span class="sur ${et.classe === 'ok' ? 'exacte' : et.classe === 'maybe' ? 'probable' : 'aucune'}">${escapeHtml(et.libelle)}</span>
          ${e.nominatif ? '<span class="sur probable">nominatif</span>' : ''}
        </span>
        ${contexte ? `<span class="l-sous">${escapeHtml(contexte)}</span>` : ''}
        <span class="l-sous">${nb} partie${nb > 1 ? 's' : ''}${e.toutesParties ? ' (tout le spectacle)' : ' (sélection)'}
          ${e.expireLe ? ' · jusqu\'au ' + escapeHtml(jourEnvoi(e.expireLe)) : ' · sans date de fin'}
          ${prises ? ' · ' + prises.nb + ' exemplaire' + (prises.nb > 1 ? 's' : '') + ' pris' + (derniere ? ', dernier le ' + escapeHtml(jourEnvoi(derniere)) : '') : ''}
          ${e.droitsConfirmes ? '' : ' · <b class="sans-lecteur">droits non confirmés</b>'}</span>
        <span class="lecteurs">
          <button type="button" class="co-btn ghost sm" data-copier-lien="${escapeAttr(e.id)}">Copier le lien</button>
          ${e.code ? `<button type="button" class="co-btn ghost sm" data-copier-code="${escapeAttr(e.id)}">Copier le code (${escapeHtml(e.code)})</button>` : ''}
          <button type="button" class="co-btn ghost sm" data-message-fr="${escapeAttr(e.id)}">Message FR</button>
          <button type="button" class="co-btn ghost sm" data-message-en="${escapeAttr(e.id)}">Message EN</button>
        </span>
      </span>
      <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        ${et.cle === 'expire' ? `<button type="button" class="co-btn sm" data-prolonger="${escapeAttr(e.id)}">Prolonger</button>` : ''}
        <button type="button" class="co-btn sm" data-basculer="${escapeAttr(e.id)}">${e.actif ? 'Révoquer' : 'Réactiver'}</button>
        <button type="button" class="co-btn ghost sm" data-retirer-envoi="${escapeAttr(e.id)}">Retirer</button>
      </span>
    </div>`;
}

/* L'ordre de lecture d'une liste de lots : ce qui est ouvert d'abord — c'est
   ce dont on répond aujourd'hui —, le reste ensuite, du plus récent au plus
   ancien. */
function trierEnvois(liste){
  const rang = { ouvert: 0, attente: 1, expire: 2, revoque: 3 };
  return liste.slice().sort((a, b) =>
    (rang[etatEnvoi(a).cle] - rang[etatEnvoi(b).cle])
    || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}

/* L'ÉCRAN DE SUPERVISION. La question qu'on se pose en arrivant ici est
   « qu'est-ce qui est dehors, en ce moment, et chez qui ? » — elle ne se pose
   jamais spectacle par spectacle, d'où un onglet à part. On n'y CRÉE rien :
   confier un lot suppose de choisir des parties et une opération, donc d'être
   dans la fiche du spectacle. Un formulaire ici aurait redemandé le spectacle
   dans un sélecteur, c'est-à-dire exactement le recroisement à la main que la
   page vient de supprimer partout ailleurs. */
function vueTransmissions(){
  chargerJournalTiers();

  const lots = trierEnvois(state.envois);
  const ouverts = lots.filter(e => etatEnvoi(e).cle === 'ouvert');
  const sansDroits = state.envois.filter(e => !e.droitsConfirmes).length;
  const prises = state.prisesTiers ? state.prisesTiers.total : null;

  return `
    <div class="chiffres">
      <div class="chiffre"><b>${ouverts.length}</b><span>lot${ouverts.length > 1 ? 's' : ''} ouvert${ouverts.length > 1 ? 's' : ''}</span>
        <small>${ouverts.length ? escapeHtml(ouverts.slice(0, 3).map(e => e.destinataire).join(', ')) + (ouverts.length > 3 ? '…' : '') : 'Aucun matériel confié à l\'extérieur en ce moment'}</small></div>
      <div class="chiffre"><b>${prises === null ? '…' : prises}</b><span>exemplaires pris par des tiers</span>
        <small>sur ${state.envois.length} transmission${state.envois.length > 1 ? 's' : ''} au total, révoquées et expirées comprises — le journal, lui, ne s'efface pas</small></div>
      <div class="chiffre${sansDroits ? ' alerte' : ''}"><b>${sansDroits}</b><span>lot${sansDroits > 1 ? 's' : ''} sans vérification des droits</span>
        <small>${sansDroits ? 'Le matériel de location ne se retransmet pas : c\'est l\'éditeur qui loue au second ensemble.' : 'Droits vérifiés sur tous les lots confiés'}</small></div>
    </div>

    <section class="bloc">
      <h2>Ce qui est confié <span class="h2-total">${lots.length} transmission${lots.length > 1 ? 's' : ''}</span></h2>
      ${lots.map(e => ligneEnvoi(e, { avecSpectacle: true })).join('')
        || '<p class="vide">Aucune transmission. Un lot confié remplace l\'envoi individuel à cinquante musiciens qui ne sont pas les nôtres : un lien, un code, une personne qui en répond.<br>Ça se prépare depuis la fiche du spectacle — c\'est là que se choisissent les parties et l\'opération.</p>'}
    </section>`;
}

/* ---------------------------------------------------------------------------
   LA FICHE MODALE
   ---------------------------------------------------------------------------
   prompt() ne prend qu'un champ, ne valide rien et ne sait pas poser deux
   questions à la fois. Or la création d'un spectacle en pose deux, et c'est la
   seconde qui compte : sur quelle opération se joue-t-il ? La poser plus tard,
   c'est ne jamais la poser.
   --------------------------------------------------------------------------- */

function ouvrirFiche({ titre, sous, corps, valider, libelleOk }){
  const ancien = document.getElementById('ficheOv');
  if(ancien) ancien.remove();
  const ov = document.createElement('div');
  ov.id = 'ficheOv';
  ov.className = 'fiche-ov';
  ov.innerHTML = `
    <div class="fiche-bo" role="dialog" aria-modal="true" aria-label="${escapeAttr(titre)}">
      <h2>${escapeHtml(titre)}</h2>
      ${sous ? `<p class="sous">${sous}</p>` : ''}
      ${corps}
      <div class="fiche-err" id="ficheErr" role="alert"></div>
      <div class="fiche-pied">
        <button type="button" class="co-btn ghost md" id="ficheAnnuler">Annuler</button>
        <button type="button" class="co-btn primary md" id="ficheOk">${escapeHtml(libelleOk || 'Enregistrer')}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const surTouche = (e)=>{ if(e.key === 'Escape') fermer(); };
  function fermer(){ ov.remove(); document.removeEventListener('keydown', surTouche); }
  document.addEventListener('keydown', surTouche);
  ov.addEventListener('click', (e)=>{ if(e.target === ov) fermer(); });
  ov.querySelector('#ficheAnnuler').onclick = fermer;

  const ok = ov.querySelector('#ficheOk');
  ok.onclick = async ()=>{
    const err = ov.querySelector('#ficheErr');
    err.textContent = '';
    ok.disabled = true;
    try{
      const refus = await valider(ov);
      if(refus){ err.textContent = refus; ok.disabled = false; return; }
      fermer();
    }catch(e){
      err.textContent = (e && e.message) || "L'enregistrement a échoué.";
      ok.disabled = false;
    }
  };
  // Entrée valide — sauf dans une zone de texte, où elle sert à aller à la ligne.
  ov.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); ok.click(); }
  });
  const premier = ov.querySelector('input, select, textarea');
  if(premier) premier.focus();
  return ov;
}
