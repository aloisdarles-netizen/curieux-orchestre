    return `<div class="pup-bandeau" style="color:${encre}">${escapeHtml(g.pupitre)}
      <span class="trait" style="background:${teinte}"></span></div>${lignes}`;
  }).join('');
}

/* Le code d'accès d'une opération. Une opération, un code — quel que soit le
   nombre de spectacles qu'elle porte : le musicien en saisit un, pas trois.

   IL SE LIT EN GRAND, ET EN POLICE DE TEXTE. Ce code est dicté à voix haute en
   répétition puis retapé sur un téléphone : le « 3 » de la police d'affichage
   s'y lit « Ɛ », et un caractère mal recopié donne un refus que personne ne
   sait expliquer. Chasse fixe, de l'air entre les caractères, et un bouton qui
   le copie — parce que la moitié du temps il part par message.
   La saisie manuelle reste : un code déjà communiqué ne se retire pas d'une
   équipe parce que l'écran a changé. */
function blocCode(tourneeId){
  const acces = accesDe(tourneeId);
  return `
    <section class="bloc">
      <h2>Code d'accès — ${escapeHtml(nomOperation(tourneeId))}</h2>
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="l-nom">
          <span class="l-titre">Le code que les musiciens saisissent une fois</span>
          <span class="l-sous">Leur lien personnel dit qui ils sont ; ce code dit qu'ils sont bien censés jouer ça maintenant. Un lien transféré ne donne rien sans lui. Communique-le en répétition ou par message groupé — pas dans le même message que le lien. Il vaut pour toute l'opération, tous spectacles confondus.</span>
        </span>
        <span class="code-boite">
          <span class="code-valeur${acces.code ? '' : ' absent'}">${acces.code ? escapeHtml(acces.code) : 'aucun code'}</span>
          <span style="display:flex;flex-direction:column;gap:5px">
            <button type="button" class="co-btn sm ghost" id="btnCopierCode"${acces.code ? '' : ' disabled'}>Copier</button>
            <button type="button" class="co-btn sm ghost" id="btnNouveauCode">Tirer un code</button>
          </span>
          <span class="code-saisie">
            <label for="inpCode">ou à la main</label>
            <input class="co-input" id="inpCode" style="width:130px;font-weight:800;letter-spacing:.06em;text-transform:uppercase" maxlength="32" value="${escapeAttr(acces.code)}" placeholder="aucun">
          </span>
        </span>
      </div>
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="l-nom">
          <span class="l-titre">Ouvrir le matériel à partir du</span>
          <span class="l-sous">Laisse vide pour qu'il soit disponible tout de suite. Le matériel d'une création se range des mois avant d'avoir à être lu.</span>
        </span>
        <input class="co-input" type="date" id="inpOuvertLe" style="width:170px" value="${escapeAttr(acces.ouvertLe || '')}">
      </div>
    </section>`;
}

/* Bloc 4 — LES RÉGLAGES DU SPECTACLE. */
function blocReglages(s){
  return `
    <section class="bloc">
      <h2>Réglages de ce spectacle</h2>
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">Chiffrer les partitions au téléchargement</span>
          <span class="l-sous">AES-256, le code de l'opération sert de mot de passe. forScore sait l'ouvrir ; MobileSheets et Newzik ne le documentent pas — à vérifier sur les tablettes du pupitre avant d'activer.</span>
        </span>
        <span></span>
        <label class="co-check"><input type="checkbox" id="chkChiffrer" ${s.chiffrer ? 'checked' : ''}> <span>${s.chiffrer ? 'Activé' : 'Désactivé'}</span></label>
      </div>
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">Sauvegarde sur le Drive</span>
          <span class="l-sous">Le lien du dossier qui garde le matériel hors de ce site. Si l'application disparaît, le matériel ne disparaît pas avec elle.</span>
        </span>
        <span></span>
        <input class="co-input" id="inpDrive" style="width:260px" placeholder="https://drive.google.com/…" value="${escapeAttr(s.lienDrive || '')}">
      </div>
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">Archiver ce spectacle</span>
          <span class="l-sous">Il passe en bas de la liste et cesse d'être proposé. Rien n'est supprimé : les affectations passées, leur journal de téléchargement et les fichiers restent en place.</span>
        </span>
        <span></span>
        <label class="co-check"><input type="checkbox" id="chkArchive" ${s.archive ? 'checked' : ''}> <span>${s.archive ? 'Archivé' : 'Actif'}</span></label>
      </div>
    </section>`;
}

/* --- VUE 3 : LE DÉPÔT ------------------------------------------------------ */

/* Ce qui n'a pas été reconnu est SÉPARÉ, et non plus seulement remonté en tête.
   Deux blocs : ce qui demande une décision, et ce qui n'en demande pas. On ne
   relit pas trente lignes, on règle les quatre qui posent question — et le
   bloc vert se replie d'un clic quand il est long. */
function vueDepot(){
  const spectacle = spectacleCourant();
  if(!spectacle) return '<div class="co-card co-pad vide">Choisis d\'abord un spectacle.</div>';
  const parties = partiesDe(spectacle.id);

  const ligneDepot = (d) => {
    const idx = state.depot.indexOf(d);
    const options = [
      `<option value="">— nouvelle partie « ${escapeHtml(d.propose)} » —</option>`,
      ...parties.map(p => `<option value="${escapeAttr(p.id)}"${d.partieId === p.id ? ' selected' : ''}>${escapeHtml(p.nom)}</option>`),
    ].join('');
    const indice = d.candidats && d.candidats.length
      ? `Plusieurs parties possibles : ${escapeHtml(d.candidats.map(c => c.nom).join(', '))} — à trancher.`
      : d.sûrete === 'aucune' ? `Aucune partie ne correspond : une nouvelle sera créée, pupitre ${escapeHtml(partitionsPupitreDe(d.propose))}.`
      : '';
    const aRegler = d.sûrete === 'aucune' || d.sûrete === 'incertaine';
    // La bordure gauche dit la sûreté avant qu'on ait lu la pastille : vert ce
    // qui est sûr, ambre ce qui est probable, rouge ce qui demande une décision.
    return `
      <div class="dep-ligne ${aRegler ? 'aRegler' : escapeAttr(d.sûrete)}">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(d.nomOrigine)}</span>
          <span class="l-sous">${partitionsPoids(d.octets)} ${indice ? '· ' + indice : ''}</span>
        </span>
        <select class="co-select" data-depot-partie="${idx}">${options}</select>
        <span style="display:flex;gap:8px;align-items:center">
          <span class="sur ${escapeAttr(d.sûrete)}">${escapeHtml(d.sûrete)}</span>
          <button type="button" class="co-btn ghost sm" data-depot-retirer="${idx}" style="padding:2px 9px;min-height:0" aria-label="Retirer ${escapeAttr(d.nomOrigine)} du dépôt">×</button>
        </span>
      </div>`;
  };

  const aRegler = state.depot.filter(d => d.sûrete === 'aucune' || d.sûrete === 'incertaine');
  const prets = state.depot.filter(d => !(d.sûrete === 'aucune' || d.sûrete === 'incertaine'));
  const poids = state.depot.reduce((acc, d) => acc + d.octets, 0);
  const enCours = state.depotEnCours > 0;

  return `
    <section class="bloc">
      <h2>Déposer dans — ${escapeHtml(spectacle.nom)}
        <span class="h2-total"><button type="button" class="co-btn ghost sm" id="btnRetourSpectacle">Retour au spectacle</button></span>
      </h2>
      <div class="depot-zone" id="zoneDepot">
        <b>Glisse les PDF ici, ou clique pour les choisir</b>
        La page lit le nom de chaque fichier et propose sa partie. Tu ne corriges que ce qu'elle a raté.
        <input type="file" id="inpFichiers" accept="application/pdf,.pdf" multiple hidden>
      </div>
    </section>
    ${state.depot.length ? `
    <section class="bloc">
      <h2>${state.depot.length} fichier${state.depot.length > 1 ? 's' : ''} à déposer
        <span class="h2-total">${partitionsPoids(poids)}
          <button type="button" class="co-btn sm primary" id="btnConfirmerDepot"${enCours ? ' disabled' : ''}>Déposer</button>
        </span>
      </h2>
      ${enCours ? `<div class="depot-barre"><i style="width:${(state.depotEnCours / state.depot.length * 100).toFixed(0)}%"></i></div>
        <p class="vide">Dépôt ${state.depotEnCours} / ${state.depot.length}…</p>` : ''}
      ${aRegler.length ? `
        <p class="vide sans-lecteur">${aRegler.length} fichier${aRegler.length > 1 ? 's demandent' : ' demande'} une décision.</p>
        ${aRegler.map(ligneDepot).join('')}` : ''}
      ${prets.length ? `
        <details${aRegler.length ? '' : ' open'} style="margin-top:${aRegler.length ? '12px' : '0'}">
          <summary style="cursor:pointer;font-size:12px;font-weight:800;color:var(--ok);padding:6px 0">

}

      <div class="chiffre${rien.length ? ' alerte' : ''}"><b>${rien.length}</b><span>n'ont rien récupéré</span>

      <div class="chiffre"><b>${journal.length}</b><span>exemplaires sortis</span>

    </div>

    ${rien.length || partiel.length ? `
    <section class="bloc">
      <h2>À relancer <span class="h2-total">${rien.length + partiel.length}

      <p class="vide">Le lien personnel de chacun est déjà valide : il n'y a rien à renvoyer, seulement à rappeler le code de l'opération et l'existence du bloc « Mes partitions » dans leur espace.</p>

    <section class="bloc">

      <p class="vide">Chaque exemplaire téléchargé porte un jeton invisible, rappelé ici. Une partition qui ressort ailleurs se rattache donc à la ligne qui l'a produite. Les libellés sont figés au moment du retrait : un renommage ultérieur ne les réécrit pas, c'est ce qui fait d'un journal une preuve.</p>

/* --- VUE 6 : LES TRANSMISSIONS À UN TIERS ----------------------------------
   Un orchestre étranger reprend le programme et doit travailler dessus. Ses
   cinquante musiciens ne sont pas les nôtres : ils n'ont ni fiche dans
   l'annuaire, ni lien personnel, et leur en créer cinquante pour une
   coproduction serait faux (ils apparaîtraient ensuite dans les plannings et
   les budgets) autant qu'ingérable. On confie donc le lot à la MAISON,
   représentée par la personne qui en répond — bibliothécaire, régisseur
   d'orchestre —, avec un lien, un code et une date de fin. C'est elle qui
   distribue en interne, comme elle le fait déjà pour son propre matériel.

   RIEN N'EST ASSOUPLI POUR AUTANT. Le bucket reste privé, le fichier propre ne
   sort jamais, chaque exemplaire est filigrané à la volée et journalisé un par
   un — au nom de l'ensemble, qui est le bon niveau de responsabilité pour une
   transmission entre maisons.

   CE QUE CET ÉCRAN NE VÉRIFIE PAS, ET QUI EST LE RISQUE PRINCIPAL : les
   DROITS. Retransmettre du matériel de LOCATION (Durand, Boosey, Schott…) à un
   autre ensemble est interdit par la quasi-totalité des contrats de location —
   c'est l'éditeur qui loue au second ensemble, pas nous qui lui prêtons. Aucun
   logiciel ne peut le savoir. La case à cocher n'autorise rien : elle
   enregistre que quelqu'un l'a affirmé, avec la date et l'auteur, dans le
   journal d'audit.
   --------------------------------------------------------------------------- */

const ENVOI_DUREE_PROPOSEE = 90;   // jours — le temps d'une préparation d'orchestre

function lienEnvoi(e){
  return `${location.origin}/partition-envoi.html?e=${encodeURIComponent(e.jeton)}`;
}

/* Une date d'écran et de courrier, jamais la forme ISO. « 2026-12-01 » se lit
   dans une base de données ; dans un mail à un bibliothécaire, il se lit comme
   une négligence — et à l'étranger, « 01/12/2026 » se lit parfois janvier. D'où
   la forme longue pour l'anglais, qui ne peut pas se confondre. */
function jourEnvoi(iso, langue){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return iso;
  return langue === 'en'
    ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
    : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

/* L'état d'un lot, en un mot. L'ordre des tests compte : un lot révoqué reste
   révoqué même s'il a par ailleurs expiré — c'est la décision qu'on a prise
   qui doit se lire, pas le calendrier. */
function etatEnvoi(e){
  const jour = new Date().toISOString().slice(0, 10);
  if(!e.actif) return { cle: 'revoque', libelle: 'révoqué', classe: 'ko' };
  if(e.expireLe && e.expireLe < jour) return { cle: 'expire', libelle: 'expiré', classe: 'ko' };
  if(e.ouvertLe && e.ouvertLe > jour) return { cle: 'attente', libelle: 'ouvre le ' + jourEnvoi(e.ouvertLe), classe: 'maybe' };
  return { cle: 'ouvert', libelle: 'ouvert', classe: 'ok' };
}

function partiesDuLot(e){
  const parties = partiesDe(e.spectacleId);
  return e.toutesParties ? parties : parties.filter(p => (e.parties || []).includes(p.id));
}

/* Ce qu'un lot a donné : le nombre d'exemplaires pris et la date du dernier.
   null tant que la base n'a pas répondu — et un lot sans aucune prise n'a
   simplement pas de ligne, d'où le zéro par défaut. */
function prisesDe(envoiId){
  if(!state.prisesTiers) return null;
  return state.prisesTiers.parEnvoi[envoiId] || { nb: 0, derniere: '' };
}

/* Le message à envoyer, prêt à coller dans un mail. C'est LE geste qui fait
   gagner du temps : le lien et le code ne suffisent pas, il faut dire ce qu'on
   confie, jusqu'à quand, et à quelles conditions — et le dire dans une langue
   que le destinataire lit. Une transmission à un orchestre étranger
   accompagnée d'un mot en français, c'est un appel téléphonique et deux jours
   perdus. */
function messageEnvoi(e, langue){
  const spectacle = (state.spectacles.find(x => x.id === e.spectacleId) || {}).nom || '';
  const operation = (state.tournees.find(t => t.id === e.tourneeId) || {}).nom || '';
  const nb = partiesDuLot(e).length;
  const lien = lienEnvoi(e);
  // « le matériel de EXPEDITION 33 » se corrige tout seul : un titre qui
  // commence par une voyelle prend l'élision. Un détail, mais il se voit dans
  // la première ligne d'un mail à une maison qu'on ne connaît pas encore.
  const de = /^[aeiouœ]/.test(String(spectacle).normalize('NFD').replace(/[\u0300-\u036F]/g, '').toLowerCase())
    ? "d'" : 'de ';
  /* Les lignes à null sont celles qui n'ont pas lieu d'être (pas de code, pas
     de date de fin) ; les chaînes vides sont des SAUTS DE PARAGRAPHE et
     doivent survivre au filtre. Les confondre donne un pavé de huit lignes
     collées, qu'on relit deux fois avant de trouver le code. */
  /* Les lignes à null sont celles qui n'ont pas lieu d'être ; les chaînes
     vides sont des SAUTS DE PARAGRAPHE et doivent survivre au filtre.

     LE CODE N'EST PAS DANS CE MESSAGE, et c'est le point le plus important de
     cette fonction. L'application affirme deux fois, des deux côtés, qu'il est
     communiqué séparément du lien — c'est ce qui en fait un second facteur.
     Le mettre dans le même mail rendait cette phrase fausse et le dispositif
     décoratif : un mail transféré donnait alors tout. Le bouton « Copier le
     code » reste là pour l'autre canal.

     La fenêtre d'accès se dit EN ENTIER. Annoncer une date de fin sans dire
     que le lot n'ouvre qu'en mars se lit « c'est ouvert maintenant », et le
     destinataire appelle en trouvant porte close. */
  if(langue === 'en'){
    return [
      `Dear ${e.contactNom || 'colleague'},`,
      '',
      `Please find below the orchestral material for ${spectacle}${operation ? ` (${operation})` : ''}, entrusted to ${e.destinataire} for your work.`,
      '',
      `Link:  ${lien}`,
      '',
      e.nominatif
        ? `The set contains ${nb} part${nb > 1 ? 's' : ''}. Parts are downloaded one at a time, each under the name of the player receiving it: the page asks for that name before every download.`
        : `The set contains ${nb} part${nb > 1 ? 's' : ''}. You can download everything as a single archive, or part by part.`,
      e.ouvertLe ? `The link opens on ${jourEnvoi(e.ouvertLe, 'en')}.` : null,
      e.expireLe ? `The link stays open until ${jourEnvoi(e.expireLe, 'en')}.` : null,
      '',
      e.code ? 'I am sending you the access code separately — it is needed to download.' : null,
      e.code ? '' : null,
      'Every copy downloaded carries your ensemble\u2019s name and an invisible mark identifying the origin of any copy found in circulation. Please do not pass the material on beyond your ensemble.',
      '',
      'With best regards,',
    ].filter(l => l !== null).join('\n');
  }
  return [
    e.contactNom ? `Bonjour ${e.contactNom},` : 'Bonjour,',
    '',
    `Vous trouverez ci-dessous le matériel d'orchestre ${de}${spectacle}${operation ? ` (${operation})` : ''}, que nous confions à ${e.destinataire} pour votre travail.`,
    '',
    `Lien : ${lien}`,
    '',
    e.nominatif
      ? `Le lot contient ${nb} partie${nb > 1 ? 's' : ''}. Elles se prennent une par une, chacune au nom du musicien à qui vous la remettez : la page vous demande ce nom avant chaque téléchargement.`
      : `Le lot contient ${nb} partie${nb > 1 ? 's' : ''}. Tout se télécharge d'un bloc, ou partie par partie.`,
    e.ouvertLe ? `Le lien s'ouvre le ${jourEnvoi(e.ouvertLe)}.` : null,
    e.expireLe ? `Le lien reste ouvert jusqu'au ${jourEnvoi(e.expireLe)}.` : null,
    '',
    e.code ? "Je vous communique le code d'accès par un autre canal — il est nécessaire pour télécharger." : null,
    e.code ? '' : null,
    "Chaque exemplaire téléchargé porte le nom de votre ensemble, ainsi qu'une marque invisible permettant d'identifier l'origine d'un exemplaire qui circulerait. Merci de ne pas rediffuser ce matériel au-delà de votre orchestre.",
    '',
    'Bien cordialement,',
  ].filter(l => l !== null).join('\n');
}

/* Le journal des téléchargements n'est lu qu'au premier écran qui en a besoin,
   et une seule fois. C'est une table qui grossit d'une ligne par partition
   remise : la charger à chaque ouverture de la page ferait payer une saison de
   téléchargements à qui vient déposer trois PDF.

   Le rendu qui suit son arrivée est retenu tant qu'une saisie est en cours :
   le journal met deux cents millisecondes à revenir, et un rendu tombé au
   milieu du nom d'un ensemble effacerait le formulaire sous les doigts. */
function chargerJournalTiers(){
  if(state.prisesTiers !== null || state.prisesTiersEnCours) return;
  // Rien de confié, rien à compter. Sans ce refus, ouvrir n'importe quelle
  // fiche de spectacle — le geste le plus courant de la page — lancerait une
  // requête sur le journal des téléchargements pour afficher trois zéros.
  if(!state.envois.length){ state.prisesTiers = { parEnvoi: {}, total: 0 }; return; }
  state.prisesTiersEnCours = true;
  CurieuxDB.prisesTiersParEnvoi()
    .catch(()=> [])
    .then(lignes => {
      const parEnvoi = {};
      let total = 0;
      (lignes || []).forEach(l => { parEnvoi[l.envoiId] = l; total += l.nb; });
      state.prisesTiers = { parEnvoi, total };
      state.prisesTiersEnCours = false;
      /* On ne re-rend QUE les écrans qui affichent ces nombres. Le journal met
         parfois plusieurs secondes à revenir : un rendu tombé pendant un dépôt
         de trente PDF reconstruirait l'écran sous les pieds de la production —
         le bouton « Déposer » redeviendrait cliquable au milieu de l'envoi, et
         un second clic relancerait tout. Même prudence pour une saisie en
         cours, qu'un rendu effacerait. */
      rendreQuandLaSaisieEstFinie();
    });
}

/* Rendre, mais pas au milieu d'une frappe. Un rendu reconstruit l'écran :
   tombé pendant qu'on tape le nom d'un ensemble, il l'efface ; tombé pendant
   un dépôt de trente PDF, il rend le bouton « Déposer » cliquable au milieu de
   l'envoi. On attend donc que le clavier ait quitté les champs — et on ATTEND
   vraiment, au lieu d'abandonner : un rendu jeté, ce sont des compteurs qui
   n'apparaissent jamais. La vérification est refaite après le focusout parce
   que passer d'un champ au suivant en déclenche un sans que la saisie soit
   finie. */
/* Le formulaire « Confier à un ensemble tiers » porte-t-il déjà quelque chose
   qu'un rendu ferait perdre ? On ne regarde que ce qui vient de la main : les
   dates portent une valeur par défaut, et les comparer ferait croire à une
   saisie sur un formulaire intact. */
function formulaireEnvoiEntame(){
  const texte = ['envDestinataire', 'envContact', 'envEmail', 'envNote']
    .some(id => ((document.getElementById(id) || {}).value || '').trim() !== '');
  const coches = ['envNominatif', 'envDroits']
    .some(id => !!(document.getElementById(id) || {}).checked);
  const portee = ((document.getElementById('envPortee') || {}).value || 'tout') !== 'tout';
  const parties = Array.from(document.querySelectorAll('[data-env-partie]')).some(c => c.checked);
  return texte || coches || portee || parties;
}

function rendreQuandLaSaisieEstFinie(){
  /* Tous les écrans sauf le dépôt. Celui-là se refuse en toutes circonstances :
     un rendu tombé au milieu d'un envoi de trente PDF rendrait le bouton
     « Déposer » cliquable, et un second clic relancerait tout. */
  if(state.vue === 'depot') return;
  const enSaisie = ()=>{
    const a = document.activeElement;
    return !!a && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);
  };
  /* Un formulaire de transmission commencé vaut plus que des compteurs à
     jour : un rendu le vide, et la production retape tout. On renonce alors
     au rendu — les nombres apparaîtront au prochain, qui vient de toute
     façon dès qu'on crée le lot, qu'on change d'écran ou qu'on agit sur un
     lot existant. */
  if(formulaireEnvoiEntame()) return;
  if(!enSaisie()){ rendre(); return; }
  document.addEventListener('focusout', function suite(){
    setTimeout(()=>{
      if(enSaisie()){ document.addEventListener('focusout', suite, { once: true }); return; }
      if(state.vue !== 'depot') rendre();
    }, 0);
  }, { once: true });
}

/* Une ligne de lot confié, la même dans la fiche du spectacle et dans l'écran
   de supervision. Seul le rappel du spectacle change : dans sa propre fiche,
   le répéter à chaque ligne est du bruit. */
function ligneEnvoi(e, options){
  const o = options || {};
  const et = etatEnvoi(e);
  const sp = (state.spectacles.find(x => x.id === e.spectacleId) || {}).nom || 'Spectacle supprimé';
  const op = e.tourneeId ? nomOperation(e.tourneeId) : '';
  const nb = partiesDuLot(e).length;
  const prises = prisesDe(e.id);
  const derniere = prises && prises.derniere ? String(prises.derniere).slice(0, 10) : '';
  const contexte = [o.avecSpectacle ? sp : '', op, e.contactNom, e.contactEmail].filter(Boolean).join(' · ');
  return `
    <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
      <span class="l-nom">
        <span class="l-titre">${escapeHtml(e.destinataire || 'Sans destinataire')}
          <span class="sur ${et.classe === 'ok' ? 'exacte' : et.classe === 'maybe' ? 'probable' : 'aucune'}">${escapeHtml(et.libelle)}</span>
          ${e.nominatif ? '<span class="sur probable">nominatif</span>' : ''}
        </span>
        ${contexte ? `<span class="l-sous">${escapeHtml(contexte)}</span>` : ''}
        <span class="l-sous">${nb} partie${nb > 1 ? 's' : ''}${e.toutesParties ? ' (tout le spectacle)' : ' (sélection)'}
          ${e.expireLe ? ' · jusqu\'au ' + escapeHtml(jourEnvoi(e.expireLe)) : ' · sans date de fin'}
          ${prises ? ' · ' + prises.nb + ' exemplaire' + (prises.nb > 1 ? 's' : '') + ' pris' + (derniere ? ', dernier le ' + escapeHtml(jourEnvoi(derniere)) : '') : ''}
          ${e.droitsConfirmes ? '' : ' · <b class="sans-lecteur">droits non confirmés</b>'}</span>
        <span class="lecteurs">
          <button type="button" class="co-btn ghost sm" data-copier-lien="${escapeAttr(e.id)}">Copier le lien</button>
          ${e.code ? `<button type="button" class="co-btn ghost sm" data-copier-code="${escapeAttr(e.id)}">Copier le code (${escapeHtml(e.code)})</button>` : ''}
          <button type="button" class="co-btn ghost sm" data-message-fr="${escapeAttr(e.id)}">Message FR</button>
          <button type="button" class="co-btn ghost sm" data-message-en="${escapeAttr(e.id)}">Message EN</button>
        </span>
      </span>
      <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
        ${et.cle !== 'revoque' && e.expireLe ? `<button type="button" class="co-btn sm" data-prolonger="${escapeAttr(e.id)}">Prolonger</button>` : ''}
        <button type="button" class="co-btn sm" data-basculer="${escapeAttr(e.id)}">${e.actif ? 'Révoquer' : 'Réactiver'}</button>
        <button type="button" class="co-btn ghost sm" data-retirer-envoi="${escapeAttr(e.id)}">Retirer</button>
      </span>
    </div>`;
}

/* L'ordre de lecture d'une liste de lots : ce qui est ouvert d'abord — c'est
   ce dont on répond aujourd'hui —, le reste ensuite, du plus récent au plus
   ancien. */
function trierEnvois(liste){
  const rang = { ouvert: 0, attente: 1, expire: 2, revoque: 3 };
  return liste.slice().sort((a, b) =>
    (rang[etatEnvoi(a).cle] - rang[etatEnvoi(b).cle])
    || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}

/* L'ÉCRAN DE SUPERVISION. La question qu'on se pose en arrivant ici est
   « qu'est-ce qui est dehors, en ce moment, et chez qui ? » — elle ne se pose
   jamais spectacle par spectacle, d'où un onglet à part. On n'y CRÉE rien :
   confier un lot suppose de choisir des parties et une opération, donc d'être
   dans la fiche du spectacle. Un formulaire ici aurait redemandé le spectacle
   dans un sélecteur, c'est-à-dire exactement le recroisement à la main que la
   page vient de supprimer partout ailleurs. */
function vueTransmissions(){
  chargerJournalTiers();

  const lots = trierEnvois(state.envois);
  const ouverts = lots.filter(e => etatEnvoi(e).cle === 'ouvert');
  const sansDroits = state.envois.filter(e => !e.droitsConfirmes).length;
  const prises = state.prisesTiers ? state.prisesTiers.total : null;

  return `
    <div class="chiffres">
      <div class="chiffre"><b>${ouverts.length}</b><span>lot${ouverts.length > 1 ? 's' : ''} ouvert${ouverts.length > 1 ? 's' : ''}</span>
        <small>${ouverts.length ? escapeHtml(ouverts.slice(0, 3).map(e => e.destinataire).join(', ')) + (ouverts.length > 3 ? '…' : '') : 'Aucun matériel confié à l\'extérieur en ce moment'}</small></div>
      <div class="chiffre"><b>${prises === null ? '…' : prises}</b><span>exemplaire${(prises || 0) > 1 ? 's' : ''} pris par des tiers</span>
        <small>sur ${state.envois.length} transmission${state.envois.length > 1 ? 's' : ''} au total, révoquées et expirées comprises — le journal, lui, ne s'efface pas</small></div>
      <div class="chiffre${sansDroits ? ' alerte' : ''}"><b>${sansDroits}</b><span>lot${sansDroits > 1 ? 's' : ''} sans vérification des droits</span>
        <small>${sansDroits ? 'Le matériel de location ne se retransmet pas : c\'est l\'éditeur qui loue au second ensemble.' : 'Droits vérifiés sur tous les lots confiés'}</small></div>
    </div>

    <section class="bloc">
      <h2>Ce qui est confié <span class="h2-total">${lots.length} transmission${lots.length > 1 ? 's' : ''}</span></h2>
      ${lots.map(e => ligneEnvoi(e, { avecSpectacle: true })).join('')
        || '<p class="vide">Aucune transmission. Un lot confié remplace l\'envoi individuel à cinquante musiciens qui ne sont pas les nôtres : un lien, un code, une personne qui en répond.<br>Ça se prépare depuis la fiche du spectacle — c\'est là que se choisissent les parties et l\'opération.</p>'}
    </section>`;
}

/* ---------------------------------------------------------------------------
   LA FICHE MODALE
   ---------------------------------------------------------------------------
   prompt() ne prend qu'un champ, ne valide rien et ne sait pas poser deux
   questions à la fois. Or la création d'un spectacle en pose deux, et c'est la
   seconde qui compte : sur quelle opération se joue-t-il ? La poser plus tard,
   c'est ne jamais la poser.
   --------------------------------------------------------------------------- */

function ouvrirFiche({ titre, sous, corps, valider, libelleOk }){
  const ancien = document.getElementById('ficheOv');
  if(ancien) ancien.remove();
  const ov = document.createElement('div');
  ov.id = 'ficheOv';
  ov.className = 'fiche-ov';
  ov.innerHTML = `
    <div class="fiche-bo" role="dialog" aria-modal="true" aria-label="${escapeAttr(titre)}">
      <h2>${escapeHtml(titre)}</h2>
      ${sous ? `<p class="sous">${sous}</p>` : ''}
      ${corps}
      <div class="fiche-err" id="ficheErr" role="alert"></div>
      <div class="fiche-pied">
        <button type="button" class="co-btn ghost md" id="ficheAnnuler">Annuler</button>
        <button type="button" class="co-btn primary md" id="ficheOk">${escapeHtml(libelleOk || 'Enregistrer')}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const surTouche = (e)=>{ if(e.key === 'Escape') fermer(); };
  function fermer(){ ov.remove(); document.removeEventListener('keydown', surTouche); }
  document.addEventListener('keydown', surTouche);
  ov.addEventListener('click', (e)=>{ if(e.target === ov) fermer(); });
  ov.querySelector('#ficheAnnuler').onclick = fermer;

  const ok = ov.querySelector('#ficheOk');
  ok.onclick = async ()=>{
    const err = ov.querySelector('#ficheErr');
    err.textContent = '';
    ok.disabled = true;
    try{
      const refus = await valider(ov);
      if(refus){ err.textContent = refus; ok.disabled = false; return; }
      fermer();
    }catch(e){
      err.textContent = (e && e.message) || "L'enregistrement a échoué.";
      ok.disabled = false;
    }
  };
  // Entrée valide — sauf dans une zone de texte, où elle sert à aller à la ligne.
  ov.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); ok.click(); }
  });
  const premier = ov.querySelector('input, select, textarea');
  if(premier) premier.focus();
  return ov;
}

function cablerVue(){
  const el = document.getElementById('page');
  const q = (id)=> el.querySelector('#' + id);

  // --- navigation ---
  el.querySelectorAll('[data-ouvrir]').forEach(b => b.onclick = ()=> ouvrirSpectacle(b.dataset.ouvrir, state.tourneeId));
  if(q('btnRetourListe')) q('btnRetourListe').onclick = ()=>{ state.vue = 'spectacles'; state.depot = []; rendre(); };
  if(q('btnRetourSpectacle')) q('btnRetourSpectacle').onclick = ()=>{ state.vue = 'spectacle'; state.depot = []; rendre(); };
  if(q('selOperation')) q('selOperation').onchange = (e)=>{ state.tourneeId = e.target.value; state.selection = new Set(); rendre(); };

  // --- spectacle ---
  if(q('btnNouveauSpectacle')) q('btnNouveauSpectacle').onclick = ()=> ficheSpectacle(null);
  if(q('btnModifierSpectacle')) q('btnModifierSpectacle').onclick = ()=> ficheSpectacle(spectacleCourant());
  if(q('btnNouvellePartie')) q('btnNouvellePartie').onclick = fichePartie;
  if(q('btnDeposer')) q('btnDeposer').onclick = ()=>{ state.vue = 'depot'; state.depot = []; rendre(); };

  if(q('chkChiffrer')) q('chkChiffrer').onchange = (e)=> majSpectacle({ chiffrer: e.target.checked });
  if(q('chkArchive')) q('chkArchive').onchange = (e)=> majSpectacle({ archive: e.target.checked });
  if(q('inpDrive')) q('inpDrive').onchange = (e)=> majSpectacle({ lienDrive: e.target.value.trim() });

  el.querySelectorAll('[data-retirer-partie]').forEach(b => b.onclick = ()=> retirerPartie(b.dataset.retirerPartie));
  el.querySelectorAll('[data-retirer-fichier]').forEach(b => b.onclick = ()=> retirerFichier(b.dataset.retirerFichier));

  // --- programmation ---
  if(q('selProgrammer')) q('selProgrammer').onchange = (e)=>{ if(e.target.value) programmer(state.spectacleId, e.target.value); };
  if(q('selProgrammerIci')) q('selProgrammerIci').onchange = (e)=>{ if(e.target.value) programmer(e.target.value, state.tourneeId); };
  el.querySelectorAll('[data-deprogrammer]').forEach(b => b.onclick = ()=> deprogrammer(b.dataset.deprogrammer));
  el.querySelectorAll('[data-distribuer]').forEach(b => b.onclick = ()=>{
    state.tourneeId = b.dataset.distribuer;
    rendre();
    const cible = document.querySelector('.onglets');
    if(cible) cible.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  el.querySelectorAll('[data-onglet]').forEach(b => b.onclick = ()=>{ state.tourneeId = b.dataset.onglet; state.selection = new Set(); rendre(); });

  // --- dépôt ---
  // Deux zones, le même geste : celle de l'écran de dépôt, et celle posée au
  // bas du matériel. La seconde bascule vers l'écran de dépôt en emportant les
  // fichiers — on n'a pas à ouvrir un écran avant de glisser.
  cablerZoneDepot(q('zoneDepot'), q('inpFichiers'), false);
  cablerZoneDepot(q('zoneDepotRapide'), q('inpFichiersRapide'), true);
  el.querySelectorAll('[data-depot-partie]').forEach(s => s.onchange = ()=>{
    const d = state.depot[Number(s.dataset.depotPartie)];
    if(!d) return;
    d.partieId = s.value;
    // Une décision prise n'a plus à remonter en tête de liste.
    d.sûrete = s.value ? 'exacte' : 'aucune';
    d.candidats = null;
    rendre();
  });
  el.querySelectorAll('[data-depot-retirer]').forEach(b => b.onclick = ()=>{
    state.depot.splice(Number(b.dataset.depotRetirer), 1); rendre();
  });
  if(q('btnConfirmerDepot')) q('btnConfirmerDepot').onclick = confirmerDepot;

  // --- affectation ---
  el.querySelectorAll('[data-affecter]').forEach(s => s.onchange = ()=>{
    if(!s.value) return;
    const [personType, personId] = s.value.split('|');
    affecter(s.dataset.affecter, personType, personId);
  });
  el.querySelectorAll('[data-desaffecter]').forEach(b => b.onclick = ()=> desaffecter(b.dataset.desaffecter));

  el.querySelectorAll('[data-aff-vue]').forEach(b => b.onclick = ()=>{ state.affVue = b.dataset.affVue; rendre(); });
  el.querySelectorAll('[data-mat-mode]').forEach(b => b.onclick = ()=>{ state.matriceMode = b.dataset.matMode; rendre(); });

  // Une case de la matrice : bascule d'une affectation. Le séparateur est « § »
  // et non « | » : les identifiants de partie sont libres, et un « | » dans un
  // id casserait la découpe en silence.
  el.querySelectorAll('[data-case]').forEach(b => b.onclick = ()=>{
    const [partieId, personType, personId] = b.dataset.case.split('§');
    const existante = state.affectations.find(a => a.tourneeId === state.tourneeId
      && a.partieId === partieId && a.personType === personType && a.personId === personId);
    if(existante) desaffecter(existante.id);
    else affecter(partieId, personType, personId);
  });

  // L'en-tête d'une colonne : affecter d'un coup les personnes cochées.
  el.querySelectorAll('[data-col]').forEach(b => b.onclick = ()=> affecterSelection(b.dataset.col));

  // La sélection ne redessine PAS la matrice : cocher huit noms ne doit pas
  // faire sauter le défilement sept fois. Seul le compteur est réécrit.
  el.querySelectorAll('[data-sel]').forEach(c => c.onchange = ()=>{
    if(!state.selection) state.selection = new Set();
    if(c.checked) state.selection.add(c.dataset.sel); else state.selection.delete(c.dataset.sel);
    majCompteurSelection();
  });
  if(q('btnSelTout')) q('btnSelTout').onclick = ()=>{
    const cases = Array.from(el.querySelectorAll('[data-sel]'));
    const toutCoche = cases.length && cases.every(c => c.checked);
    cases.forEach(c => { c.checked = !toutCoche; });
    state.selection = toutCoche ? new Set() : new Set(cases.map(c => c.dataset.sel));
    majCompteurSelection();
  };
  if(q('btnSelVider')) q('btnSelVider').onclick = viderSelection;

  if(q('btnCopierCode')) q('btnCopierCode').onclick = ()=> copierTexte(accesDe(state.tourneeId).code, 'Code copié. À envoyer séparément du lien.');
  if(q('inpCode')) q('inpCode').onchange = (e)=>{
    const code = e.target.value.trim().toUpperCase();
    /* La même règle que côté musicien (mes-dates-vue.js) : ce qui ne passerait
       pas son champ ne doit pas pouvoir être posé ici, sinon on distribue un
       code que personne ne peut saisir. */
    if(code && !/^[A-Z0-9-]{1,32}$/.test(code)){
      alert('Un code ne contient que des lettres, des chiffres et des tirets, et ne dépasse pas 32 caractères.');
      rendre(); return;
    }
    majAcces(state.tourneeId, { code });
  };
  if(q('btnNouveauCode')) q('btnNouveauCode').onclick = ()=> majAcces(state.tourneeId, { code: partitionsNouveauCode() });
  if(q('inpOuvertLe')) q('inpOuvertLe').onchange = (e)=> majAcces(state.tourneeId, { ouvertLe: e.target.value });
  if(q('selReprendre')) q('selReprendre').onchange = (e)=>{ if(e.target.value) reprendreAffectation(e.target.value); };

  // --- retraits ---
  if(q('selOperationRet')) q('selOperationRet').onchange = (e)=>{ state.tourneeId = e.target.value; rendre(); };
  if(q('btnCopierRelance')) q('btnCopierRelance').onclick = copierRelance;

  // --- transmissions ---
  // La liste des parties se montre et se cache SANS rendre() : un rendu
  // complet reconstruirait le formulaire et effacerait le nom du
  // destinataire qu'on vient de taper.
  if(q('envPortee')) q('envPortee').onchange = (e)=>{
    const liste = q('envListeParties');
    if(liste) liste.style.display = e.target.value === 'selection' ? 'grid' : 'none';
  };
  if(q('btnCreerEnvoi')) q('btnCreerEnvoi').onclick = creerEnvoi;

  el.querySelectorAll('[data-copier-lien]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.copierLien);
    if(e) copierTexte(lienEnvoi(e), 'Lien copié.');
  });
  el.querySelectorAll('[data-copier-code]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.copierCode);
    if(e) copierTexte(e.code, 'Code copié. À envoyer séparément du lien.');
  });
  el.querySelectorAll('[data-message-fr]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.messageFr);
    if(e) copierTexte(messageEnvoi(e, 'fr'), 'Message copié — à coller dans le mail.');
  });
  el.querySelectorAll('[data-message-en]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.messageEn);
    if(e) copierTexte(messageEnvoi(e, 'en'), 'Message copié — à coller dans le mail.');
  });
  el.querySelectorAll('[data-basculer]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.basculer);
    if(!e) return;
    if(e.actif && !confirm(`Révoquer le lot confié à « ${e.destinataire} » ?\n\nLe lien cesse immédiatement de fonctionner. Les exemplaires déjà téléchargés, eux, restent chez eux — la révocation ne les rappelle pas.`)) return;
    majEnvoi(e.id, { actif: !e.actif });
  });
  el.querySelectorAll('[data-prolonger]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.prolonger);
    if(!e) return;
    majEnvoi(e.id, { expireLe: addDaysIso(new Date().toISOString().slice(0, 10), ENVOI_DUREE_PROPOSEE) });
  });
  el.querySelectorAll('[data-retirer-envoi]').forEach(b => b.onclick = ()=> retirerEnvoi(b.dataset.retirerEnvoi));
}

/* Le compteur de sélection, réécrit sans reconstruire la matrice. Il porte la
   seule phrase qui explique le geste — la laisser périmée reviendrait à
   proposer une action qui ne correspond plus à l'état de l'écran. */
function majCompteurSelection(){
  const zone = document.getElementById('selInfo');
  const btn = document.getElementById('btnSelTout');
  const n = (state.selection || new Set()).size;
  if(btn){
    const total = document.querySelectorAll('[data-sel]').length;
    btn.textContent = (n && n === total) ? 'Tout décocher' : 'Tout cocher';
  }
  if(!zone) return;
  zone.innerHTML = n
    ? `<b style="color:var(--text)">${n} sélectionné${n > 1 ? 'es' : 'e'}</b> — clique un en-tête de partie pour les y affecter
       <button type="button" class="co-btn sm ghost" id="btnSelVider">Vider</button>`
    : 'Coche des personnes, puis clique un en-tête de partie pour les affecter d\'un coup.';
  const vider = document.getElementById('btnSelVider');
  if(vider) vider.onclick = viderSelection;
}

function viderSelection(){
  state.selection = new Set();
  document.querySelectorAll('[data-sel]').forEach(c => { c.checked = false; });
  majCompteurSelection();
}

/* Une zone de dépôt, la même des deux côtés. Celle posée au bas du matériel
   bascule vers l'écran de dépôt en emportant les fichiers glissés. */
function cablerZoneDepot(zone, inp, versEcranDepot){
  if(!zone || !inp) return;
  const prendre = (fichiers)=>{
    if(!fichiers.length) return;
    if(versEcranDepot){ state.vue = 'depot'; state.depot = []; }
    ajouterAuDepot(fichiers);
  };
  zone.onclick = ()=> inp.click();
  inp.onchange = ()=>{ prendre(Array.from(inp.files || [])); inp.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, (e)=>{ e.preventDefault(); zone.classList.add('survol'); }));
  ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, (e)=>{ e.preventDefault(); zone.classList.remove('survol'); }));
  zone.addEventListener('drop', (e)=> prendre(Array.from((e.dataTransfer || {}).files || [])));
}

/* Affecter d'un coup les personnes cochées à une partie. C'est le geste qui
   remplace vingt sélecteurs — et il ne devine rien : la sélection est faite à
   la main, par quelqu'un qui sait qui joue quoi.
   Une personne déjà affectée à cette partie est simplement ignorée, pas
   signalée : la sélection sert souvent plusieurs colonnes de suite, et un
   avertissement à chaque recoupement rendrait le geste pénible. */
async function affecterSelection(partieId){
  if(!state.tourneeId) return;
  const selection = Array.from(state.selection || []);
  if(!selection.length){
    try{ curieuxFlash('Coche d\'abord des personnes dans la colonne de gauche'); }catch(e){}
    return;
  }
  const partie = state.parties.find(p => p.id === partieId);
  const nouvelles = [];
  selection.forEach(cle => {
    const [personType, personId] = cle.split('|');
    const id = `${state.tourneeId}::${partieId}::${personId}`;
    if(state.affectations.some(a => a.id === id)) return;
    nouvelles.push({ id, tourneeId: state.tourneeId, partieId, personType, personId });
  });
  if(!nouvelles.length){
    try{ curieuxFlash('Ces personnes lisent déjà « ' + (partie ? partie.nom : '') + ' »'); }catch(e){}
    return;
  }
  await assurerAcces(state.tourneeId);
  state.affectations.push(...nouvelles);
  rendre();
  for(const a of nouvelles) await CurieuxDB.upsertOne('partitions_affectations', a);
  /* Un ruban d'annulation GROUPÉ : vingt affectations posées d'un clic doivent
     se retirer d'un clic. Vingt rubans successifs ne s'annulent pas, ils se
     recouvrent. */
  CurieuxAnnuler.proposer({
    texte: `${nouvelles.length} affectation${nouvelles.length > 1 ? 's' : ''} sur « ${partie ? partie.nom : ''} »`,
    retablir: async ()=>{
      const ids = new Set(nouvelles.map(a => a.id));
      state.affectations = state.affectations.filter(a => !ids.has(a.id));
      rendre();
      for(const a of nouvelles) await CurieuxDB.removeOne('partitions_affectations', a.id);
    },
    purger: async ()=>{},
  });
}

/* Les noms à relancer, prêts à coller dans un message groupé. On copie les
   NOMS et rien d'autre : ni lien, ni code — le lien personnel de chacun est
   déjà en circulation, et le code ne se met pas dans le même message que lui. */
function copierRelance(){
  const retraits = retraitsParPersonne(state.tourneeId);
  const noms = effectifAffichable(state.tourneeId).filter(e => {
    const dus = fichiersDus(state.tourneeId, e.personType, e.personId);
    if(!dus.length) return false;
    const pris = retraits.get(e.personType + '|' + e.personId) || new Set();
    return !dus.every(id => pris.has(id));
  }).map(e => e.nom);
  if(!noms.length){ try{ curieuxFlash('Personne à relancer'); }catch(e){} return; }
  copierTexte(noms.join(', '), noms.length + ' nom(s) copié(s)');
}

/* Ouvrir un spectacle, c'est aussi choisir l'opération qu'on va distribuer.
   On garde celle d'où l'on vient si le spectacle y est programmé — c'est le
   cas quand on arrive depuis l'écran « Par opération » —, sinon la première. */
function ouvrirSpectacle(id, tourneeId){
  state.spectacleId = id;
  // Une sélection de noms n'a de sens que dans la matrice où elle a été faite :
  // la traîner d'un spectacle à l'autre ferait affecter les violons d'hier.
  state.selection = new Set();
  const opes = programmationsDe(id).map(p => p.tourneeId);
  if(tourneeId && opes.includes(tourneeId)) state.tourneeId = tourneeId;
  else if(!opes.includes(state.tourneeId)) state.tourneeId = opes[0] || '';
  state.vue = 'spectacle';
  state.depot = [];
  rendre();
}

/* --- Le spectacle : création et fiche ------------------------------------- */

function ficheSpectacle(existant){
  const s = existant || null;
  const dejaProgramme = s ? programmationsDe(s.id).map(p => p.tourneeId) : [];
  ouvrirFiche({
    titre: s ? 'Fiche du spectacle' : 'Nouveau spectacle',
    sous: s
      ? 'Ce qui identifie le matériel. Les opérations se règlent dans la page, juste en dessous.'
      : "Le tiroir où le matériel se range, une fois pour toutes — et l'opération sur laquelle il se joue. On pourra en rattacher d'autres ensuite&nbsp;: une reprise ne coûte pas un octet de plus.",
    libelleOk: s ? 'Enregistrer' : 'Créer le spectacle',
    corps: `
      <label class="co-label" for="fNom">Nom du spectacle</label>
      <input class="co-input" id="fNom" autocomplete="off" placeholder="EXPEDITION 33" value="${escapeAttr(s ? s.nom : '')}">
      <div class="co-field-row" style="margin-top:12px">
        <div class="co-field" style="flex:1 1 210px">
          <label class="co-label" for="fComp">Compositeur</label>
          <input class="co-input" id="fComp" autocomplete="off" value="${escapeAttr(s ? s.compositeur : '')}">
        </div>
        <div class="co-field" style="flex:1 1 210px">
          <label class="co-label" for="fArr">Arrangeur</label>
          <input class="co-input" id="fArr" autocomplete="off" value="${escapeAttr(s ? s.arrangeur : '')}">
        </div>
      </div>
      ${s ? `
      <label class="co-label" for="fNote" style="margin-top:12px">Note interne</label>
      <textarea class="co-textarea" id="fNote" placeholder="Éditeur, numéro de location, état du matériel…">${escapeHtml(s.note || '')}</textarea>`
      : `
      <label class="co-label" for="fOpe" style="margin-top:12px">Opération sur laquelle il se joue</label>
      <select class="co-select" id="fOpe">
        <option value="">— à rattacher plus tard —</option>
        ${optionsOperations('', dejaProgramme)}
      </select>
      <p class="sous" style="margin:6px 0 0">Sans opération, le matériel se range mais ne se distribue pas : personne n'y a accès, et rien ne le signale ailleurs que sur cette page.</p>`}`,
    valider: async (ov)=>{
      const nom = ov.querySelector('#fNom').value.trim();
      if(!nom) return "Il faut un nom — c'est sous lui que tout le matériel se range.";
      // Deux spectacles du même nom, c'est le matériel coupé en deux tiroirs et
      // la moitié des musiciens servis. On refuse, plutôt que de le découvrir
      // à la générale.
      const cle = partitionsNormaliser(nom);
      if(state.spectacles.some(x => x.id !== (s ? s.id : '') && partitionsNormaliser(x.nom) === cle))
        return 'Un spectacle porte déjà ce nom. Ouvre-le plutôt que d\'en créer un second : son matériel s\'y range déjà.';

      const champs = {
        nom,
        compositeur: ov.querySelector('#fComp').value.trim(),
        arrangeur: ov.querySelector('#fArr').value.trim(),
      };
      if(s){
        champs.note = ov.querySelector('#fNote').value.trim();
        Object.assign(s, champs);
        rendre();
        await CurieuxDB.upsertOne('partitions_spectacles', s);
        return '';
      }
      const neuf = Object.assign({ id: genId('spect'), lienDrive: '', chiffrer: false, archive: false, note: '' }, champs);
      const tourneeId = ov.querySelector('#fOpe').value;
      state.spectacles.push(neuf);
      state.spectacleId = neuf.id;
      state.vue = 'spectacle';
      rendre();
      await CurieuxDB.upsertOne('partitions_spectacles', neuf);
      if(tourneeId) await programmer(neuf.id, tourneeId);
      else rendre();
      curieuxFlash(`« ${neuf.nom} » créé${tourneeId ? ' et programmé sur ' + nomOperation(tourneeId) : ''}.`);
      return '';
    },
  });
}

async function majSpectacle(champs){
  const s = spectacleCourant();
  if(!s) return;
  Object.assign(s, champs); rendre();
  await CurieuxDB.upsertOne('partitions_spectacles', s);
}

/* --- La partie ------------------------------------------------------------- */

function fichePartie(){
  const s = spectacleCourant();
  if(!s) return;
  const pupitres = ['', 'Cordes', 'Bois', 'Cuivres', 'Percussions', 'Chant', 'Autre'];
  ouvrirFiche({
    titre: 'Ajouter une partie',
    sous: "L'unité qu'on affecte : Violon 1, Cor 1-2, Piano, Conducteur. Le pupitre se devine du nom — corrige-le s'il se trompe.",
    libelleOk: 'Ajouter',
    corps: `
      <label class="co-label" for="fPartie">Nom de la partie</label>
      <input class="co-input" id="fPartie" autocomplete="off" placeholder="Violon 1">
      <label class="co-label" for="fPupitre" style="margin-top:12px">Pupitre</label>
      <select class="co-select" id="fPupitre">
        <option value="">— deviné du nom —</option>
        ${pupitres.filter(Boolean).map(p => `<option value="${escapeAttr(p)}">${escapeHtml(p)}</option>`).join('')}
      </select>`,
    valider: async (ov)=>{
      const nom = ov.querySelector('#fPartie').value.trim();
      if(!nom) return 'Il faut un nom de partie.';
      const cle = partitionsNormaliser(nom);
      if(partiesDe(s.id).some(p => partitionsNormaliser(p.nom) === cle))
        return 'Cette partie existe déjà dans ce spectacle.';
      const p = creerPartieLocale(nom, ov.querySelector('#fPupitre').value);
      rendre();
      await CurieuxDB.upsertOne('partitions_parties', p);
      return '';
    },
  });
}

function creerPartieLocale(nom, pupitre){
  const p = {
    id: genId('part'), spectacleId: state.spectacleId, nom,
    pupitre: pupitre || partitionsPupitreDe(nom), ordre: partitionsOrdreDe(nom), note: '',
  };
  state.parties.push(p);
  return p;
}

/* Une partie retirée emporte ses fichiers, et ses fichiers sont dans le
   stockage. On ne touche au stockage que dans `purger` : tant que le ruban
   « Annuler » est là, rien n'est parti. */
/* Les lots confiés OUVERTS qui contiennent cette partie. Un lot « tout le
   spectacle » la contient par construction ; un lot sur sélection, seulement
   s'il la nomme. On ne compte pas les lots révoqués ou périmés : ils ne
   servent plus personne. */
function lotsContenant(partie){
  const jour = new Date().toISOString().slice(0, 10);
  return state.envois.filter(e =>
    e.spectacleId === partie.spectacleId
    && e.actif
    && (!e.expireLe || e.expireLe >= jour)
    && (e.toutesParties || (e.parties || []).includes(partie.id)));
}

function retirerPartie(id){
  const p = state.parties.find(x => x.id === id);
  if(!p) return;
  /* Une partie retirée disparaît AUSSI du lot confié à un ensemble tiers, en
     silence et de son côté : il rouvre son lien et le jeu a maigri, sans un
     mot. On ne l'interdit pas — il y a de bonnes raisons de retirer une partie
     pour la redéposer corrigée — mais on le dit, parce que c'est la seule
     personne que la page ne peut pas prévenir. */
  const lots = lotsContenant(p);
  if(lots.length && !confirm(
      `« ${p.nom} » fait partie de ${lots.length} lot${lots.length > 1 ? 's' : ''} confié${lots.length > 1 ? 's' : ''} à l'extérieur :\n`
      + lots.map(e => '  · ' + e.destinataire).join('\n')
      + `\n\nEn la retirant, elle disparaît de leur lien sans qu'ils en soient avertis. Continuer ?`)) return;
  const fs = fichiersDe(id);
  const affs = state.affectations.filter(a => a.partieId === id);
  state.parties = state.parties.filter(x => x.id !== id);
  state.fichiers = state.fichiers.filter(f => f.partieId !== id);
  state.affectations = state.affectations.filter(a => a.partieId !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `« ${p.nom} » retirée${fs.length ? ` (${fs.length} fichier${fs.length > 1 ? 's' : ''})` : ''}`,
    retablir: ()=>{
      state.parties.push(p); state.fichiers.push(...fs); state.affectations.push(...affs); rendre();
    },
    purger: async ()=>{
      for(const a of affs) await CurieuxDB.removeOne('partitions_affectations', a.id);
      for(const f of fs){ await CurieuxDB.removeOne('partitions_fichiers', f.id); await CurieuxDB.retirerPartition(f.chemin); }
      await CurieuxDB.removeOne('partitions_parties', id);
    },
  });
}

function retirerFichier(id){
  const f = state.fichiers.find(x => x.id === id);
  if(!f) return;
  state.fichiers = state.fichiers.filter(x => x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `« ${f.titre || f.nomOrigine} » retiré`,
    retablir: ()=>{ state.fichiers.push(f); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('partitions_fichiers', id); await CurieuxDB.retirerPartition(f.chemin); },
  });
}

/* --- La programmation : le lien spectacle ↔ opération ---------------------- */

/* LA LIGNE D'ACCÈS SE CRÉE AVEC LA PROGRAMMATION, et surtout pas plus tard.
   partition_pour_jeton fait une jointure INTERNE sur partitions_acces : sans
   cette ligne, aucune partition n'est téléchargeable, et rien ne le dit —
   la production affecte tout un orchestre, les musiciens voient leur liste et
   se heurtent à un refus que personne ne sait expliquer. On la crée donc avec
   un code tiré d'office : mieux vaut un code à communiquer qu'un mur muet.
   Elle appartient à l'OPÉRATION, pas au spectacle : deux spectacles sur la
   même soirée partagent un seul code. */
async function assurerAcces(tourneeId){
  if(!tourneeId || state.acces.some(a => a.id === tourneeId)) return;
  const a = { id: tourneeId, code: partitionsNouveauCode(), actif: true, ouvertLe: '' };
  state.acces.push(a);
  await CurieuxDB.upsertOne('partitions_acces', a);
}

async function programmer(spectacleId, tourneeId){
  if(!spectacleId || !tourneeId) return;
  const id = `${spectacleId}::${tourneeId}`;
  if(state.programmations.some(p => p.id === id)){ rendre(); return; }
  const p = { id, spectacleId, tourneeId, note: '' };
  state.programmations.push(p);
  // On recale l'onglet de distribution si celui en cours n'appartient pas à ce
  // spectacle : sinon on vient de programmer et l'écran ne montre rien.
  if(state.spectacleId === spectacleId && !estProgramme(spectacleId, state.tourneeId)) state.tourneeId = tourneeId;
  rendre();
  await CurieuxDB.upsertOne('partitions_programmations', p);
  await assurerAcces(tourneeId);
  rendre();
}

/* Déprogrammer emporte les affectations de CE spectacle sur CETTE opération —
   et rien d'autre. Les laisser derrière donnerait des partitions visibles dans
   l'espace de musiciens sur une opération où l'œuvre n'est plus jouée : une
   erreur qui ne se voit que du côté du musicien, donc jamais. */
function deprogrammer(progId){
  const p = state.programmations.find(x => x.id === progId);
  if(!p) return;
  const affs = affectationsDeSpectacle(p.spectacleId, p.tourneeId);
  if(affs.length && !confirm(
      `« ${nomSpectacle(p.spectacleId)} » est distribué à ${new Set(affs.map(a => a.personType + '|' + a.personId)).size} personne(s) sur « ${nomOperation(p.tourneeId)} ».\n\n`
      + `Le retirer de cette opération retire aussi ces ${affs.length} affectation(s) : ces partitions disparaîtront de leur espace.`)){
    rendre(); return;
  }
  const retirees = new Set(affs.map(a => a.id));
  state.programmations = state.programmations.filter(x => x.id !== progId);
  state.affectations = state.affectations.filter(a => !retirees.has(a.id));
  if(state.tourneeId === p.tourneeId && state.vue === 'spectacle'){
    state.tourneeId = (programmationsDe(p.spectacleId)[0] || {}).tourneeId || '';
  }
  rendre();
  CurieuxAnnuler.proposer({
    texte: `« ${nomSpectacle(p.spectacleId)} » retiré de ${nomOperation(p.tourneeId)}${affs.length ? ` (${affs.length} affectation${affs.length > 1 ? 's' : ''})` : ''}`,
    retablir: ()=>{
      state.programmations.push(p);
      state.affectations.push(...affs);
      state.tourneeId = p.tourneeId;
      rendre();
    },
    purger: async ()=>{
      for(const a of affs) await CurieuxDB.removeOne('partitions_affectations', a.id);
      await CurieuxDB.removeOne('partitions_programmations', progId);
    },
  });
}

/* --- Le dépôt -------------------------------------------------------------- */

function ajouterAuDepot(fichiers){
  const parties = partiesDe(state.spectacleId);
  const pdf = fichiers.filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  const rejetes = fichiers.length - pdf.length;
  pdf.forEach(f => {
    const r = partitionsApparier(f.name, parties);
    state.depot.push({
      fichier: f, nomOrigine: f.name, octets: f.size,
      propose: r.propose, partieId: r.partie ? r.partie.id : '',
      sûrete: r.sûrete, candidats: r.candidats || null,
    });
  });
  if(rejetes) alert(`${rejetes} fichier${rejetes > 1 ? 's ont' : ' a'} été ignoré${rejetes > 1 ? 's' : ''} : seuls les PDF sont acceptés.`);
  rendre();
}

async function confirmerDepot(){
  const btn = document.getElementById('btnConfirmerDepot');
  const aFaire = state.depot.slice();
  if(!aFaire.length || state.depotEnCours) return;
  if(btn) btn.disabled = true;

  let faits = 0;
  const echecs = [];

  /* Un try/finally, et il n'est pas décoratif : la progression est désormais
     lue dans state, et c'est elle qui tient le bouton « Déposer » désactivé.
     Une erreur inattendue au milieu de l'envoi laisserait donc un écran de
     dépôt définitivement bloqué — plus rien à faire que recharger la page,
     avec trente fichiers en attente à re-glisser. */
  try{
    // Les parties manquantes d'abord, toutes ensemble : plusieurs fichiers
    // peuvent viser la même partie neuve, et en créer deux la scinderait en
    // silence.
    const neuves = new Map();
    for(const d of aFaire){
      if(d.partieId) continue;
      const cle = partitionsNormaliser(d.propose);
      if(!neuves.has(cle)){
        const p = creerPartieLocale(d.propose, '');
        neuves.set(cle, p);
        await CurieuxDB.upsertOne('partitions_parties', p);
      }
      d.partieId = neuves.get(cle).id;
    }

    for(const d of aFaire){
      /* La progression passe par une BARRE et non par le libellé du bouton :
         celui-ci changeait de largeur à chaque fichier, faisait sauter la ligne
         de titre, et un bouton qui se réécrit n'a plus l'air désactivé. On pose
         l'état dans state, puis on ne touche qu'à la barre — redessiner l'écran
         à chaque fichier le ferait clignoter trente fois. */
      state.depotEnCours = faits + 1;
      const barre = document.querySelector('.depot-barre i');
      if(barre) barre.style.width = (faits / aFaire.length * 100).toFixed(0) + '%';
      else rendre();
      const depot = await CurieuxDB.deposerPartition(state.spectacleId, d.partieId, d.fichier);
      if(depot.error){ echecs.push(`${d.nomOrigine} — ${depot.error.message || 'échec'}`); continue; }
      const f = {
        id: genId('pfic'), partieId: d.partieId,
        titre: partitionsNomDepuisFichier(d.nomOrigine), chemin: depot.chemin,
        nomOrigine: d.nomOrigine, octets: d.octets, pages: null, empreinte: '',
        ordre: fichiersDe(d.partieId).length,
      };
      state.fichiers.push(f);
      await CurieuxDB.upsertOne('partitions_fichiers', f);
      faits++;
    }

    state.depot = [];
    state.vue = 'spectacle';
  } finally {
    state.depotEnCours = 0;
    rendre();
  }

  // Après le rendu, jamais avant : une boîte de dialogue posée sur l'écran de
  // dépôt donne à lire un décompte d'échecs devant la liste qui les a produits,
  // encore intacte — on croit que rien n'est parti.
  if(echecs.length) alert(`${faits} fichier(s) déposé(s).\n\nÉchecs :\n` + echecs.join('\n'));
  else curieuxFlash(`${faits} fichier${faits > 1 ? 's déposés' : ' déposé'} dans « ${nomSpectacle(state.spectacleId)} ».`);
}

/* --- L'affectation --------------------------------------------------------- */

async function affecter(partieId, personType, personId){
  if(!state.tourneeId) return;
  const id = `${state.tourneeId}::${partieId}::${personId}`;
  if(state.affectations.some(a => a.id === id)) return;
  await assurerAcces(state.tourneeId);
  const a = { id, tourneeId: state.tourneeId, partieId, personType, personId };
  state.affectations.push(a); rendre();
  await CurieuxDB.upsertOne('partitions_affectations', a);
}

function desaffecter(id){
  const a = state.affectations.find(x => x.id === id);
  if(!a) return;
  state.affectations = state.affectations.filter(x => x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: 'Affectation retirée',
    retablir: ()=>{ state.affectations.push(a); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('partitions_affectations', id); },
  });
}

/* Reprendre l'affectation d'une autre opération DU MÊME SPECTACLE. C'est le
   geste qui fait gagner le plus de temps : EXPEDITION 33 porte quatre
   opérations, et l'essentiel des pupitres revient d'une fois sur l'autre. On ne
   reprend QUE les personnes réellement présentes sur la nouvelle opération —
   recopier quelqu'un qui n'y joue pas lui ferait apparaître des partitions dans
   son espace pour une opé où il n'est pas attendu. */
async function reprendreAffectation(sourceId){
  const source = affectationsDeSpectacle(state.spectacleId, sourceId);
  const effectif = new Set(effectifDe(state.tourneeId).map(e => e.personType + '|' + e.personId));
  const existantes = new Set(affectationsDe(state.tourneeId).map(a => a.partieId + '|' + a.personId));
  const nouvelles = [];
  let ecartes = 0;
  source.forEach(a => {
    if(!effectif.has(a.personType + '|' + a.personId)){ ecartes++; return; }
    if(existantes.has(a.partieId + '|' + a.personId)) return;
    nouvelles.push({ id: `${state.tourneeId}::${a.partieId}::${a.personId}`, tourneeId: state.tourneeId,
                     partieId: a.partieId, personType: a.personType, personId: a.personId });
  });
  if(!nouvelles.length){
    alert(ecartes ? `Rien à reprendre : les ${ecartes} personnes de cette opération ne jouent aucune date de celle-ci.`
                  : 'Rien à reprendre — tout est déjà affecté.');
    rendre(); return;
  }
  if(!confirm(`Reprendre ${nouvelles.length} affectation(s) de « ${nomOperation(sourceId)} » ?`
      + (ecartes ? `\n\n${ecartes} seront écartées : ces personnes ne jouent aucune date de cette opération.` : ''))) { rendre(); return; }
  await assurerAcces(state.tourneeId);
  state.affectations.push(...nouvelles); rendre();
  for(const a of nouvelles) await CurieuxDB.upsertOne('partitions_affectations', a);
}

/* Créer un lot confié. Deux refus, et ils ne sont pas symétriques : sans
   destinataire, le filigrane ne désignerait personne et tout le dispositif
   tombe — c'est un refus sec. Les droits, eux, se confirment : on prévient,
   et on laisse passer si la personne assume, parce qu'il existe des cas
   légitimes (matériel propre, arrangement maison, domaine public) que la page
   ne peut pas distinguer. */
async function creerEnvoi(){
  const val = (id)=> (document.getElementById(id) || {}).value || '';
  const coche = (id)=> !!(document.getElementById(id) || {}).checked;
  /* Le formulaire ne vit que dans la fiche d'un spectacle ouvert, donc
     state.spectacleId est nécessairement rempli — mais il ne l'est plus
     d'office au chargement depuis que la page part de la liste, et un lot
     rattaché à un spectacle vide serait un lien qui n'ouvre rien, envoyé à un
     orchestre qui attend son matériel. Une ligne de ceinture. */
  if(!state.spectacleId){
    alert("Ouvre d'abord le spectacle à confier : c'est lui qui décide des parties du lot.");
    return;
  }
  const destinataire = val('envDestinataire').trim();
  if(!destinataire){
    alert("Le nom de l'ensemble destinataire est obligatoire : c'est lui qui se pose sur chaque exemplaire téléchargé, et c'est ce qui rend la transmission traçable.");
    return;
  }
  const portee = val('envPortee');
  const choisies = Array.from(document.querySelectorAll('[data-env-partie]'))
    .filter(c => c.checked).map(c => c.dataset.envPartie);
  if(portee === 'selection' && !choisies.length){
    alert('Aucune partie sélectionnée. Coche celles que tu confies, ou repasse sur « tout le spectacle ».');
    return;
  }
  if(!coche('envDroits') && !confirm("Les droits de diffusion n'ont pas été vérifiés.\n\nLe matériel de LOCATION ne se retransmet pas à un autre ensemble : c'est l'éditeur qui le lui loue. Créer quand même le lien ?")) return;

  const e = {
    id: genId('penv'),
    spectacleId: state.spectacleId,
    tourneeId: val('envOperation'),
    destinataire,
    contactNom: val('envContact').trim(),
    contactEmail: val('envEmail').trim(),
    jeton: CurieuxDB.nouveauJetonEnvoi(),
    // Un code d'office, comme pour une opération : mieux vaut un code à
    // communiquer qu'un lien qui ouvre seul tout le matériel d'un spectacle
    // dès qu'il est transféré une fois.
    code: partitionsNouveauCode(),
    toutesParties: portee !== 'selection',
    parties: portee === 'selection' ? choisies : [],
    ouvertLe: val('envOuvertLe'),
    expireLe: val('envExpireLe'),
    actif: true,
    nominatif: coche('envNominatif'),
    droitsConfirmes: coche('envDroits'),
    note: val('envNote').trim(),
    createdAt: new Date().toISOString(),
  };
  state.envois.push(e);
  rendre();
  /* Pas de retour en arrière sur échec : l'écriture part dans la file de
     rejeu de db.js, comme partout ailleurs dans le projet, et retirer la ligne
     de l'écran ferait réapparaître au prochain rejeu un lot que la production
     croit annulé. On le DIT, en revanche — et on nomme la cause la plus
     probable, qui est une migration pas encore jouée. */
  const res = await CurieuxDB.upsertOne('partitions_envois', e);
  if(res && res.error){
    alert("Le lien est affiché mais n'a pas encore été enregistré : " + (res.error.message || 'échec')
      + "\n\nSi la base n'a pas encore la table des transmissions, joue la migration avant de communiquer ce lien.");
    return;
  }
  try{ curieuxFlash('Lien créé. « Message FR » ou « Message EN » prépare le mail à envoyer.'); }catch(err){}
}

async function majEnvoi(id, champs){
  const e = state.envois.find(x => x.id === id);
  if(!e) return;
  Object.assign(e, champs); rendre();
  await CurieuxDB.upsertOne('partitions_envois', e);
}

/* Retirer une transmission efface le LIEN, pas la trace. Les lignes du journal
   des téléchargements survivent — elles portent le nom de l'ensemble et la
   date, et c'est précisément ce qu'on veut retrouver deux ans plus tard sur
   une partition ressortie d'un pupitre étranger. */
function retirerEnvoi(id){
  const e = state.envois.find(x => x.id === id);
  if(!e) return;
  state.envois = state.envois.filter(x => x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `Transmission à « ${e.destinataire} » retirée`,
    retablir: ()=>{ state.envois.push(e); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('partitions_envois', id); },
  });
}

/* Le presse-papiers demande un contexte sécurisé et une permission ; le repli
   par <textarea> marche partout, y compris derrière un proxy en http. Une
   copie qui échoue en silence ferait envoyer un mail sans lien. */
function copierTexte(texte, message){
  const dire = ()=>{ try{ curieuxFlash(message || 'Copié.'); }catch(e){ } };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(texte).then(dire).catch(()=> repli());
    return;
  }
  repli();
  function repli(){
    const z = document.createElement('textarea');
    z.value = texte;
    z.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(z); z.select();
    try{ document.execCommand('copy'); dire(); }
    catch(err){ prompt('Copie manuelle :', texte); }
    z.remove();
  }
}

async function majAcces(tourneeId, champs){
  if(!tourneeId) return;
  let a = state.acces.find(x => x.id === tourneeId);
  if(!a){ a = { id: tourneeId, code: '', actif: true, ouvertLe: '' }; state.acces.push(a); }
  Object.assign(a, champs); rendre();
  await CurieuxDB.upsertOne('partitions_acces', a);
}

/* --------------------------------------------------------------------------- */

document.querySelectorAll('[data-vue]').forEach(b => b.onclick = ()=>{
  state.vue = b.dataset.vue; state.depot = []; rendre();
});

applyAutoTheme();
charger();
</script>
