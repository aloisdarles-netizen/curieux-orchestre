/* Les journées où un chœur chante, tous spectacles confondus, du plus proche au
   plus lointain. Une journée porte ses chœurs, et non l'inverse : c'est ainsi
   qu'on la lit quand on commande des loges.

   LES LOTS RÉVOQUÉS SONT EXCLUS — leur matériel a été rappelé, le chœur ne
   chante plus. Les lots expirés, NON : un lien expire après que le chœur a pris
   ses partitions, et il chante quand même. Confondre les deux ferait disparaître
   du calendrier les chœurs les mieux préparés.
   Les dates annulées sont exclues aussi : une date annulée n'est pas une date. */
function journeesChorales(){
  const parDate = new Map();
  state.envois.filter(e => estChoeur(e) && e.actif && e.tourneeId).forEach(e => {
    datesDuLot(e).filter(d => !estAnnulee(d)).forEach(d => {
      const cle = e.tourneeId + '|' + d.id;
      if(!parDate.has(cle)){
        parDate.set(cle, {
          date: d.date, ville: d.ville || '', lieu: d.lieu || '',
          nature: natureDate(e.tourneeId, d),
          operation: nomOperation(e.tourneeId),
          spectacleId: e.spectacleId,
          lots: [], effectif: 0,
        });
      }
      const j = parDate.get(cle);
      j.lots.push(e);
      j.effectif += Number(e.effectif) || 0;
    });
  });
  return Array.from(parDate.values())
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
}

/* L'ÉCRAN DE SUPERVISION DES CHŒURS. Même raison d'être que celui des
   transmissions : « quel chœur travaille sur quoi, en ce moment ? » est une
   question qui ne se pose jamais spectacle par spectacle. On n'y crée rien —
   remettre un lot suppose de choisir des voix, donc d'être dans la fiche du
   spectacle. */
function vueChoeurs(){
  chargerJournalTiers();

  const tous = state.envois.filter(e => estChoeur(e));
  const lots = trierEnvois(tous);
  const ouverts = lots.filter(e => etatEnvoi(e).cle === 'ouvert');
  const journees = journeesChorales();
  /* LE CHIFFRE N'EST PLUS LE TOTAL DE LA SÉRIE, et c'est la correction qui
     compte. Additionner trois chœurs qui ne se croisent jamais donnait 130
     choristes — un nombre qui ne correspond à aucune journée, et sur lequel on
     ne peut ni commander des loges, ni réserver un car, ni compter des repas.
     Ce qui dimensionne, c'est LE JOUR LE PLUS CHARGÉ. */
  const pic = journees.reduce((max, j) => j.effectif > (max ? max.effectif : -1) ? j : max, null);
  const sansDroits = tous.filter(e => !e.droitsConfirmes).length;
  const prises = state.prisesTiers
    ? tous.reduce((n, e) => n + ((state.prisesTiers.parEnvoi[e.id] || {}).nb || 0), 0)
    : null;
  // Les spectacles qui portent des voix, qu'un chœur les ait reçues ou non :
  // c'est là que se lit le travail qui reste à faire.
  const avecVoix = state.spectacles
    .filter(sp => !sp.archive && partiesChoeur(sp.id).length)
    .map(sp => ({ sp, voix: partiesChoeur(sp.id), lots: tous.filter(e => e.spectacleId === sp.id) }));
  // Les lots encore vivants qui ne disent pas quand ils chantent. Presque
  // toujours un oubli, et il ne se verrait nulle part ailleurs.
  const sansDates = tous.filter(e => e.actif && e.tourneeId && !datesDuLot(e).filter(d => !estAnnulee(d)).length);

  return `
    <div class="chiffres">
      <div class="chiffre"><b>${ouverts.length}</b><span>chœur${ouverts.length > 1 ? 's' : ''} servi${ouverts.length > 1 ? 's' : ''}</span>
        <small>${ouverts.length ? escapeHtml(ouverts.slice(0, 3).map(e => e.destinataire).join(', ')) + (ouverts.length > 3 ? '…' : '') : 'Aucune partition de chœur dehors en ce moment'}</small></div>
      <div class="chiffre"><b>${pic && pic.effectif ? pic.effectif : '—'}</b><span>choristes, jour le plus chargé</span>
        <small>${pic && pic.effectif
          ? escapeHtml(jourDate(pic.date, { day: 'numeric', month: 'long' })
              + (pic.ville ? ' · ' + pic.ville : '')
              + ' — ' + pic.lots.map(e => e.destinataire).join(', ')
              + '. C\'est ce nombre qui dimensionne les loges, le car et les repas, pas le total de la série.')
          : 'Aucun effectif rattaché à une date — c\'est ce qui chiffre les loges, le transport et les repas.'}</small></div>
      <div class="chiffre"><b>${prises === null ? '…' : prises}</b><span>exemplaire${(prises || 0) > 1 ? 's' : ''} pris</span>
        <small>sur ${tous.length} remise${tous.length > 1 ? 's' : ''} au total, révoquées et expirées comprises</small></div>
      <div class="chiffre${sansDroits ? ' alerte' : ''}"><b>${sansDroits}</b><span>lot${sansDroits > 1 ? 's' : ''} sans vérification des droits</span>
        <small>${sansDroits ? 'Un chœur invité est un tiers au sens des contrats, même quand il chante avec nous.' : 'Droits vérifiés sur tous les lots de chœur'}</small></div>
    </div>

    <section class="bloc">
      <h2>Ce qui est remis <span class="h2-total">${lots.length} remise${lots.length > 1 ? 's' : ''}</span></h2>
      ${lots.map(e => ligneEnvoi(e, { avecSpectacle: true })).join('')
        || '<p class="vide">Aucune partition de chœur remise. Ça se prépare depuis la fiche du spectacle, dans le bloc « Le chœur » — c\'est là que se lisent les voix et leurs tonalités.</p>'}
    </section>

    <section class="bloc">
      <h2>Qui chante quand <span class="h2-total">${journees.length} journée${journees.length > 1 ? 's' : ''}</span></h2>
      <p class="vide">Un chœur amateur ne part pas en tournée : sur une même série, il change d'une ville à l'autre.
        Cette lecture-là est celle de l'exploitation — les loges, le car et les repas se commandent par journée, pas par série.
        Les lots révoqués n'y figurent pas : leur matériel a été rappelé.</p>
      ${journees.map(j => `
        <div class="ligne">
          <span class="l-nom">
            <span class="l-titre">${escapeHtml(jourDate(j.date, { weekday: 'short', day: 'numeric', month: 'long' }))}
              ${j.lots.length > 1 ? '<span class="sur probable">' + j.lots.length + ' chœurs</span>' : ''}
            </span>
            <span class="l-sous">${escapeHtml([j.ville, j.lieu].filter(Boolean).join(' · ') || 'Lieu non précisé')}${j.nature ? ' · ' + escapeHtml(j.nature) : ''} — ${escapeHtml(j.operation)}</span>
            <span class="l-sous">${j.lots.map(e => escapeHtml(e.destinataire) + (e.effectif ? ' (' + e.effectif + ')' : ' <b class="sans-lecteur">effectif inconnu</b>')).join(' · ')}</span>
          </span>
          <span class="l-num">${j.effectif || '—'}</span>
          <button type="button" class="co-btn sm" data-ouvrir-choeur="${escapeAttr(j.spectacleId)}">Ouvrir</button>
        </div>`).join('')
        || '<p class="vide">Aucune journée chorale. Les dates se cochent à la création du lot, dans la fiche du spectacle.</p>'}
      ${sansDates.length ? `<p class="vide sans-lecteur">${sansDates.length} lot${sansDates.length > 1 ? 's' : ''} sans date précisée :
        ${escapeHtml(sansDates.map(e => e.destinataire).join(', '))}. Leur effectif n'est compté sur aucune journée, et leur chef de chœur ne voit pas quand il chante.</p>` : ''}
    </section>

    <section class="bloc">
      <h2>Les spectacles qui portent un chœur <span class="h2-total">${avecVoix.length}</span></h2>
      ${avecVoix.map(({ sp, voix, lots: l }) => {
        const sansTon = voix.filter(v => !String(v.tonalite || '').trim()).length;
        const sansFichier = voix.filter(v => !aUnFichier(v)).length;
        const ouvertsIci = l.filter(e => etatEnvoi(e).cle === 'ouvert');
        return `
          <div class="ligne">
            <span class="l-nom">
              <span class="l-titre">${escapeHtml(sp.nom)}</span>
              <span class="l-sous">${voix.length} voix : ${escapeHtml(voix.map(v => v.nom).join(', '))}</span>
              <span class="l-sous${sansFichier || sansTon ? ' sans-lecteur' : ''}">
                ${sansFichier ? sansFichier + ' sans fichier' : 'Toutes les voix ont un fichier'}
                ${sansTon ? ' · ' + sansTon + ' sans tonalité' : ' · tonalités renseignées'}
                ${ouvertsIci.length ? ' · ' + escapeHtml(ouvertsIci.map(e => e.destinataire).join(', ')) : ' · remis à personne'}</span>
            </span>
            <span class="l-num">${partitionsPoids(voix.reduce((t, v) => t + fichiersDe(v.id).reduce((u, f) => u + (f.octets || 0), 0), 0))}</span>
            <button type="button" class="co-btn sm" data-ouvrir-choeur="${escapeAttr(sp.id)}">Ouvrir</button>
          </div>`;
      }).join('')
        || '<p class="vide">Aucun spectacle ne porte de partie de chœur. Elles se rangent dans la fiche d\'un spectacle, bloc « Le chœur ».</p>'}
    </section>`;
}

      </span>
      <label class="co-check"><input type="checkbox" id="envDroits"> <span>Vérifié</span></label>
    </div>
    <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">

      </span>

  return `

/* ---------------------------------------------------------------------------
   LA FICHE MODALE
   ---------------------------------------------------------------------------
   prompt() ne prend qu'un champ, ne valide rien et ne sait pas poser deux
   questions à la fois. Or la création d'un spectacle en pose deux, et c'est la
   seconde qui compte : sur quelle opération se joue-t-il ? La poser plus tard,
   c'est ne jamais la poser.
   --------------------------------------------------------------------------- */

function ouvrirFiche({ titre, sous, corps, valider, libelleOk }){
  const ancien = document.getElementById('ficheOv');
  if(ancien) ancien.remove();
  const ov = document.createElement('div');
  ov.id = 'ficheOv';
  ov.className = 'fiche-ov';
  ov.innerHTML = `
    <div class="fiche-bo" role="dialog" aria-modal="true" aria-label="${escapeAttr(titre)}">
      <h2>${escapeHtml(titre)}</h2>
      ${sous ? `<p class="sous">${sous}</p>` : ''}
      ${corps}
      <div class="fiche-err" id="ficheErr" role="alert"></div>
      <div class="fiche-pied">
        <button type="button" class="co-btn ghost md" id="ficheAnnuler">Annuler</button>
        <button type="button" class="co-btn primary md" id="ficheOk">${escapeHtml(libelleOk || 'Enregistrer')}</button>
      </div>
    </div>`;
  document.body.appendChild(ov);

  const surTouche = (e)=>{ if(e.key === 'Escape') fermer(); };
  function fermer(){ ov.remove(); document.removeEventListener('keydown', surTouche); }
  document.addEventListener('keydown', surTouche);
  ov.addEventListener('click', (e)=>{ if(e.target === ov) fermer(); });
  ov.querySelector('#ficheAnnuler').onclick = fermer;

  const ok = ov.querySelector('#ficheOk');
  ok.onclick = async ()=>{
    const err = ov.querySelector('#ficheErr');
    err.textContent = '';
    ok.disabled = true;
    try{
      const refus = await valider(ov);
      if(refus){ err.textContent = refus; ok.disabled = false; return; }
      fermer();
    }catch(e){
      err.textContent = (e && e.message) || "L'enregistrement a échoué.";
      ok.disabled = false;
    }
  };
  // Entrée valide — sauf dans une zone de texte, où elle sert à aller à la ligne.
  ov.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && e.target.tagName !== 'TEXTAREA'){ e.preventDefault(); ok.click(); }
  });
  const premier = ov.querySelector('input, select, textarea');
  if(premier) premier.focus();
  return ov;
}

/* Le compteur de sélection, réécrit sans reconstruire la matrice. Il porte la
   seule phrase qui explique le geste — la laisser périmée reviendrait à
   proposer une action qui ne correspond plus à l'état de l'écran. */
function majCompteurSelection(){
  const zone = document.getElementById('selInfo');
  const btn = document.getElementById('btnSelTout');
  const n = (state.selection || new Set()).size;
  if(btn){
    const total = document.querySelectorAll('[data-sel]').length;
    btn.textContent = (n && n === total) ? 'Tout décocher' : 'Tout cocher';
  }
  if(!zone) return;
  zone.innerHTML = n
    ? `<b style="color:var(--text)">${n} sélectionné${n > 1 ? 'es' : 'e'}</b> — clique un en-tête de partie pour les y affecter
       <button type="button" class="co-btn sm ghost" id="btnSelVider">Vider</button>`
    : 'Coche des personnes, puis clique un en-tête de partie pour les affecter d\'un coup.';
  const vider = document.getElementById('btnSelVider');
  if(vider) vider.onclick = viderSelection;
}

function viderSelection(){
  state.selection = new Set();
  document.querySelectorAll('[data-sel]').forEach(c => { c.checked = false; });
  majCompteurSelection();
}

/* Une zone de dépôt, la même des deux côtés. Celle posée au bas du matériel
   bascule vers l'écran de dépôt en emportant les fichiers glissés. */
function cablerZoneDepot(zone, inp, versEcranDepot){
  if(!zone || !inp) return;
  const prendre = (fichiers)=>{
    if(!fichiers.length) return;
    if(versEcranDepot){ state.vue = 'depot'; state.depot = []; }
    ajouterAuDepot(fichiers);
  };
  zone.onclick = ()=> inp.click();
  inp.onchange = ()=>{ prendre(Array.from(inp.files || [])); inp.value = ''; };
  ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, (e)=>{ e.preventDefault(); zone.classList.add('survol'); }));
  ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, (e)=>{ e.preventDefault(); zone.classList.remove('survol'); }));
  zone.addEventListener('drop', (e)=> prendre(Array.from((e.dataTransfer || {}).files || [])));
}

/* ---------------------------------------------------------------------------
   DÉPLACER UNE PARTIE D'UN PUPITRE À L'AUTRE
   ---------------------------------------------------------------------------
   Le pupitre est deviné du nom de fichier (partitionsPupitreDe), et il se
   trompe : un jeu sorti de Dorico en anglais, un intitulé maison, une partie
   double qui relève de deux familles. L'écran le montrait sans permettre de le
   corriger — il fallait retirer la partie, donc ses fichiers, et tout
   redéposer pour un mot mal lu.

   LE GLISSÉ EST CELUI DU NAVIGATEUR, pas une réimplémentation à la souris. Il
   donne l'image de la tuile, le curseur juste, l'échappement par Échap et
   l'annulation par un lâcher hors zone — quatre choses qu'un glissé maison
   rate presque toujours. En contrepartie il ne se déclenche pas au doigt :
   c'est la fiche de la partie qui sert de second chemin, et elle n'est pas un
   pis-aller — elle règle aussi le nom.
   --------------------------------------------------------------------------- */

function cablerDeplacementParties(el){
  el.querySelectorAll('.part-tuile[data-partie]').forEach(t => {
    t.addEventListener('dragstart', (e)=>{
      // text/plain et pas seulement un format maison : sans lui, Firefox
      // refuse d'ouvrir le glissé.
      try{ e.dataTransfer.setData('text/plain', t.dataset.partie); }catch(err){}
      e.dataTransfer.effectAllowed = 'move';
      state.partieGlissee = t.dataset.partie;
      t.classList.add('en-vol');
      // La classe est posée sur <body> : elle révèle les pupitres vides, qui
      // sont ailleurs dans l'arbre que la tuile qu'on tient.
      document.body.classList.add('deplace-partie');
    });
    t.addEventListener('dragend', ()=>{
      t.classList.remove('en-vol');
      document.body.classList.remove('deplace-partie');
      el.querySelectorAll('.pup-groupe.survol').forEach(g => g.classList.remove('survol'));
      state.partieGlissee = '';
    });
  });

  el.querySelectorAll('.pup-groupe[data-pup-cible]').forEach(g => {
    const cible = g.dataset.pupCible;
    g.addEventListener('dragover', (e)=>{
      if(!state.partieGlissee) return;
      e.preventDefault();                       // sans quoi le lâcher n'arrive jamais
      e.dataTransfer.dropEffect = 'move';
      g.classList.add('survol');
    });
    // dragleave part aussi quand on survole un enfant : on ne retire la marque
    // que si le curseur a réellement quitté le groupe.
    g.addEventListener('dragleave', (e)=>{ if(!g.contains(e.relatedTarget)) g.classList.remove('survol'); });
    g.addEventListener('drop', (e)=>{
      e.preventDefault();
      g.classList.remove('survol');
      const id = state.partieGlissee || (()=>{ try{ return e.dataTransfer.getData('text/plain'); }catch(err){ return ''; } })();
      state.partieGlissee = '';
      document.body.classList.remove('deplace-partie');
      if(id) deplacerPartie(id, cible);
    });
  });
}

/* Le déplacement lui-même. Il passe par le ruban d'annulation comme tout ce
   qui se défait ici : un glissé part vite, et la main se trompe de section
   aussi vite. */
async function deplacerPartie(id, pupitre){
  const p = state.parties.find(x => x.id === id);
  if(!p) return;
  const avant = partitionsPupitreNormalise(p.pupitre);
  const apres = partitionsPupitreNormalise(pupitre);
  if(avant === apres) return;
  p.pupitre = apres;
  rendre();
  await CurieuxDB.upsertOne('partitions_parties', p);
  CurieuxAnnuler.proposer({
    texte: `« ${p.nom} » passe de ${avant} à ${apres}`,
    retablir: async ()=>{
      p.pupitre = avant;
      rendre();
      await CurieuxDB.upsertOne('partitions_parties', p);
    },
    // Rien à purger : le pupitre est une colonne, pas une ligne. Le ruban
    // n'est là que pour revenir en arrière.
    purger: async ()=>{},
  });
}

/* Reclasser d'un coup ce que la détection lit autrement aujourd'hui.

   ON NE RECLASSE RIEN EN SILENCE, et c'est la seule façon que ce bouton soit
   acceptable : quelqu'un a peut-être déplacé une partie À LA MAIN, exprès, et
   une reprise automatique la remettrait d'où elle vient sans le dire. La fiche
   liste donc chaque changement, ligne à ligne, toutes cochées ; on décoche ce
   qu'on veut garder. */
function ficheReclasser(){
  const s = spectacleCourant();
  if(!s) return;
  const ecarts = ecartsDePupitre(partiesDe(s.id));
  if(!ecarts.length){ curieuxFlash('Rien à reclasser.'); return; }
  ouvrirFiche({
    titre: 'Reclasser les parties',
    sous: "Ce que le nom de chaque partie dit de son pupitre, comparé au classement enregistré. Décoche ce que tu as rangé toi-même : on ne remet rien en place sans que tu l'aies vu.",
    libelleOk: 'Appliquer',
    corps: `
      <div style="display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto">
        ${ecarts.map(e => `
          <label class="co-check" style="gap:9px;padding:5px 2px;align-items:center">
            <input type="checkbox" data-reclasse="${escapeAttr(e.partie.id)}" checked>
            <span style="min-width:0;display:flex;gap:7px;align-items:center;flex-wrap:wrap">
              <b style="font-weight:800">${escapeHtml(e.partie.nom)}</b>
              ${partitionsPupitreHtml(e.de)}<span style="color:var(--muted)">→</span>${partitionsPupitreHtml(e.vers)}
            </span>
          </label>`).join('')}
      </div>`,
    valider: async (ov)=>{
      const retenus = Array.from(ov.querySelectorAll('[data-reclasse]'))
        .filter(c => c.checked).map(c => c.dataset.reclasse);
      if(!retenus.length) return 'Rien de coché — décoche tout revient à annuler.';
      const faits = ecarts.filter(e => retenus.includes(e.partie.id));
      const avant = faits.map(e => ({ p: e.partie, pupitre: e.partie.pupitre }));
      faits.forEach(e => { e.partie.pupitre = e.vers; });
      rendre();
      for(const e of faits) await CurieuxDB.upsertOne('partitions_parties', e.partie);
      CurieuxAnnuler.proposer({
        texte: `${faits.length} partie${faits.length > 1 ? 's reclassées' : ' reclassée'}`,
        retablir: async ()=>{
          avant.forEach(a => { a.p.pupitre = a.pupitre; });
          rendre();
          for(const a of avant) await CurieuxDB.upsertOne('partitions_parties', a.p);
        },
        purger: async ()=>{},
      });
      return '';
    },
  });
}

/* Affecter d'un coup les personnes cochées à une partie. C'est le geste qui
   remplace vingt sélecteurs — et il ne devine rien : la sélection est faite à
   la main, par quelqu'un qui sait qui joue quoi.
   Une personne déjà affectée à cette partie est simplement ignorée, pas
   signalée : la sélection sert souvent plusieurs colonnes de suite, et un
   avertissement à chaque recoupement rendrait le geste pénible. */
async function affecterSelection(partieId){
  if(!state.tourneeId) return;
  const selection = Array.from(state.selection || []);
  if(!selection.length){
    try{ curieuxFlash('Coche d\'abord des personnes dans la colonne de gauche'); }catch(e){}
    return;
  }
  const partie = state.parties.find(p => p.id === partieId);
  const paires = selection.map(cle => {
    const [personType, personId] = cle.split('|');
    return { partieId, personType, personId };
  });
  const n = await affecterEnMasse(paires, (k) => `${k} affectation${k > 1 ? 's' : ''} sur « ${partie ? partie.nom : ''} »`);
  if(n === 0){
    try{ curieuxFlash('Ces personnes lisent déjà « ' + (partie ? partie.nom : '') + ' »'); }catch(e){}
  }
}

/* Poser plusieurs affectations d'un coup, sur l'opération en cours. C'est le
   seul chemin d'écriture groupée : l'en-tête de colonne et la fiche de
   proposition passent tous deux par ici. Ce qui existe déjà est ignoré sans
   bruit. Rend le nombre d'affectations réellement posées.
   `texte` reçoit ce nombre et rend le libellé du ruban d'annulation. */
async function affecterEnMasse(paires, texte){
  if(!state.tourneeId) return 0;
  const nouvelles = [];
  const vus = new Set();
  paires.forEach(({ partieId, personType, personId }) => {
    const id = `${state.tourneeId}::${partieId}::${personId}`;
    if(vus.has(id) || state.affectations.some(a => a.id === id)) return;
    vus.add(id);
    nouvelles.push({ id, tourneeId: state.tourneeId, partieId, personType, personId });
  });
  if(!nouvelles.length) return 0;
  await assurerAcces(state.tourneeId);
  state.affectations.push(...nouvelles);
  rendre();
  for(const a of nouvelles) await CurieuxDB.upsertOne('partitions_affectations', a);
  /* Un ruban d'annulation GROUPÉ : vingt affectations posées d'un clic doivent
     se retirer d'un clic. Vingt rubans successifs ne s'annulent pas, ils se
     recouvrent. */
  CurieuxAnnuler.proposer({
    texte: texte(nouvelles.length),
    retablir: async ()=>{
      const ids = new Set(nouvelles.map(a => a.id));
      state.affectations = state.affectations.filter(a => !ids.has(a.id));
      rendre();
      for(const a of nouvelles) await CurieuxDB.removeOne('partitions_affectations', a.id);
    },
    purger: async ()=>{},
  });
  return nouvelles.length;
}

/* PROPOSER D'APRÈS LES INSTRUMENTS. La page sait l'instrument de chacun et le
   nom de chaque partie ; elle peut donc dire, pour quatre-vingts pour cent de
   l'effectif, qui lit quoi — et elle le DIT, elle ne l'écrit pas. La fiche
   liste chaque proposition avec sa sûreté, cochée d'avance quand elle est
   sûre ou probable, à choisir dans une liste quand la fiche de la personne ne
   suffit pas à trancher. On décoche, on choisit, on valide : seul ce qui est
   coché s'écrit, et par le même chemin que l'en-tête de colonne — même ruban
   d'annulation groupé. Les personnes qui ont déjà une partie ici ne sont pas
   dans la liste : la proposition sert à qui n'a rien, et ne défait rien. */
function ficheProposition(){
  const s = spectacleCourant();
  if(!s || !state.tourneeId) return;
  const parties = partiesDe(s.id);
  const effectif = effectifAffichable(state.tourneeId, s.id);
  const aff = affectationsDeSpectacle(s.id, state.tourneeId);
  const prop = partitionsProposerAffectations(parties, effectif, aff);
  const nomPartie = (p) => escapeHtml(p.nom);
  const sousNom = (x) => escapeHtml([x.personne.pupitre, x.personne.instrument].filter(Boolean).join(' · ') || 'pupitre et instrument non renseignés');

  const ligne = (x, surete, coche) => `
    <label class="prop-ligne ${surete}">
      <input type="checkbox" data-prop="${escapeAttr(x.partie.id + '§' + x.personne.personType + '§' + x.personne.personId)}"${coche ? ' checked' : ''}>
      <span class="prop-qui"><b>${escapeHtml(x.personne.nom)}</b><small>${sousNom(x)}</small></span>
      <span class="prop-vers">→ <b>${nomPartie(x.partie)}</b><small>${escapeHtml(x.motif)}</small></span>
      <span class="sur ${surete}">${surete === 'exacte' ? 'sûre' : 'probable'}</span>
    </label>`;
  const choix = (x) => `
    <div class="prop-ligne incertaine">
      <span class="prop-qui"><b>${escapeHtml(x.personne.nom)}</b><small>${sousNom(x)}</small></span>
      <span class="prop-vers">
        <select class="co-select" data-prop-choix="${escapeAttr(x.personne.personType + '§' + x.personne.personId)}">
          <option value="">— choisir, ou laisser —</option>
          ${x.memes.length ? `<optgroup label="Même instrument">${x.memes.map(p => `<option value="${escapeAttr(p.id)}">${nomPartie(p)}</option>`).join('')}</optgroup>` : ''}
          ${x.autres.length ? `<optgroup label="Même pupitre">${x.autres.map(p => `<option value="${escapeAttr(p.id)}">${nomPartie(p)}</option>`).join('')}</optgroup>` : ''}
        </select>
        <small>${escapeHtml(x.motif)}</small>
      </span>
      <span class="sur incertaine">à trancher</span>
    </div>`;
  const sans = (x) => `
    <div class="prop-ligne aucune">
      <span class="prop-qui"><b>${escapeHtml(x.personne.nom)}</b><small>${sousNom(x)}</small></span>
      <span class="prop-vers"><small>${escapeHtml(x.motif)}</small></span>
    </div>`;
  const section = (titre, n, corps, aide) => n ? `
    <h3 class="prop-titre">${titre} — ${n}</h3>
    ${aide ? `<p class="sous" style="margin:0 0 6px">${aide}</p>` : ''}
    ${corps}` : '';

  const nProposables = prop.sures.length + prop.probables.length + prop.aTrancher.length;
  if(!nProposables && !prop.sansProposition.length){
    try{ curieuxFlash(prop.dejaServis ? 'Tout le monde a déjà une partie de ce spectacle sur cette opération.' : 'Personne à proposer.'); }catch(e){}
    return;
  }
  const restes = [];
  if(prop.dejaServis) restes.push(`${prop.dejaServis} personne${prop.dejaServis > 1 ? 's ont' : ' a'} déjà une partie de ce spectacle ici — non touchée${prop.dejaServis > 1 ? 's' : ''}`);
  if(prop.techniciens) restes.push(`${prop.techniciens} technicien${prop.techniciens > 1 ? 's' : ''}, sans partition`);

  ouvrirFiche({
    titre: "Proposer d'après les instruments",
    sous: `Ce que l'instrument de chacun dit de sa partie dans « ${escapeHtml(s.nom)} », sur ${escapeHtml(nomOperation(state.tourneeId))}. `
      + "Rien n'est enregistré avant « Affecter » ; ce qui est décoché ou laissé sans choix reste à faire dans la matrice.",
    libelleOk: 'Affecter',
    corps: `
      <div class="prop-liste">
        ${section('Sûres', prop.sures.length, prop.sures.map(x => ligne(x, 'exacte', true)).join(''),
          "Un seul instrument possible, ou le numéro de la fiche est celui de la partie.")}
        ${section('Probables', prop.probables.length, prop.probables.map(x => ligne(x, 'probable', true)).join(''),
          "Une convention plutôt qu'une lecture : le violon solo au premier violon, par exemple. À relire.")}
        ${section('À trancher', prop.aTrancher.length, prop.aTrancher.map(choix).join(''),
          "La fiche ne dit pas laquelle. Les parties encore sans lecteur sont en tête de liste.")}
        ${section('Sans proposition', prop.sansProposition.length, prop.sansProposition.map(sans).join(''),
          "Ni instrument reconnu, ni partie de ce pupitre. Un instrument à renseigner dans l'annuaire, ou une partie qui manque.")}
      </div>
      ${restes.length ? `<p class="sous" style="margin:12px 0 0">${restes.map(escapeHtml).join(' · ')}.</p>` : ''}`,
    valider: async (ov)=>{
      const paires = [];
      ov.querySelectorAll('[data-prop]').forEach(c => {
        if(!c.checked) return;
        const [partieId, personType, personId] = c.dataset.prop.split('§');
        paires.push({ partieId, personType, personId });
      });
      ov.querySelectorAll('[data-prop-choix]').forEach(sel => {
        if(!sel.value) return;
        const [personType, personId] = sel.dataset.propChoix.split('§');
        paires.push({ partieId: sel.value, personType, personId });
      });
      if(!paires.length) return 'Rien de coché, rien de choisi — il n\'y a rien à affecter.';
      const n = await affecterEnMasse(paires, (k) => `${k} affectation${k > 1 ? 's' : ''} proposée${k > 1 ? 's' : ''} d'après les instruments`);
      try{ curieuxFlash(n ? `${n} affectation${n > 1 ? 's posées' : ' posée'}. La matrice reste là pour le reste.` : 'Ces affectations existaient déjà.'); }catch(e){}
      return '';
    },
  });
  // La fiche est plus large que les autres : elle porte trois colonnes.
  const bo = document.querySelector('#ficheOv .fiche-bo');
  if(bo) bo.style.maxWidth = '720px';
}

/* Les noms à relancer, prêts à coller dans un message groupé. On copie les
   NOMS et rien d'autre : ni lien, ni code — le lien personnel de chacun est
   déjà en circulation, et le code ne se met pas dans le même message que lui. */
function copierRelance(){
  const retraits = retraitsParPersonne(state.tourneeId);
  const noms = effectifAffichable(state.tourneeId).filter(e => {
    const dus = fichiersDus(state.tourneeId, e.personType, e.personId);
    if(!dus.length) return false;
    const pris = retraits.get(e.personType + '|' + e.personId) || new Set();
    return !dus.every(id => pris.has(id));
  }).map(e => e.nom);
  if(!noms.length){ try{ curieuxFlash('Personne à relancer'); }catch(e){} return; }
  copierTexte(noms.join(', '), noms.length + ' nom(s) copié(s)');
}

/* Ouvrir un spectacle, c'est aussi choisir l'opération qu'on va distribuer.
   On garde celle d'où l'on vient si le spectacle y est programmé — c'est le
   cas quand on arrive depuis l'écran « Par opération » —, sinon la première. */
function ouvrirSpectacle(id, tourneeId){
  state.spectacleId = id;
  // Une sélection de noms n'a de sens que dans la matrice où elle a été faite :
  // la traîner d'un spectacle à l'autre ferait affecter les violons d'hier.
  state.selection = new Set();
  const opes = programmationsDe(id).map(p => p.tourneeId);
  if(tourneeId && opes.includes(tourneeId)) state.tourneeId = tourneeId;
  else if(!opes.includes(state.tourneeId)) state.tourneeId = opes[0] || '';
  state.vue = 'spectacle';
  state.depot = [];
  rendre();
}

/* --- Le spectacle : création et fiche ------------------------------------- */

function ficheSpectacle(existant){
  const s = existant || null;
  const dejaProgramme = s ? programmationsDe(s.id).map(p => p.tourneeId) : [];
  ouvrirFiche({
    titre: s ? 'Fiche du spectacle' : 'Nouveau spectacle',
    sous: s
      ? 'Ce qui identifie le matériel. Les opérations se règlent dans la page, juste en dessous.'
      : "Le tiroir où le matériel se range, une fois pour toutes — et l'opération sur laquelle il se joue. On pourra en rattacher d'autres ensuite&nbsp;: une reprise ne coûte pas un octet de plus.",
    libelleOk: s ? 'Enregistrer' : 'Créer le spectacle',
    corps: `
      <label class="co-label" for="fNom">Nom du spectacle</label>
      <input class="co-input" id="fNom" autocomplete="off" placeholder="EXPEDITION 33" value="${escapeAttr(s ? s.nom : '')}">
      <div class="co-field-row" style="margin-top:12px">
        <div class="co-field" style="flex:1 1 210px">
          <label class="co-label" for="fComp">Compositeur</label>
          <input class="co-input" id="fComp" autocomplete="off" value="${escapeAttr(s ? s.compositeur : '')}">
        </div>
        <div class="co-field" style="flex:1 1 210px">
          <label class="co-label" for="fArr">Arrangeur</label>
          <input class="co-input" id="fArr" autocomplete="off" value="${escapeAttr(s ? s.arrangeur : '')}">
        </div>
      </div>
      ${s ? `
      <label class="co-label" for="fNote" style="margin-top:12px">Note interne</label>
      <textarea class="co-textarea" id="fNote" placeholder="Éditeur, numéro de location, état du matériel…">${escapeHtml(s.note || '')}</textarea>`
      : `
      <label class="co-label" for="fOpe" style="margin-top:12px">Opération sur laquelle il se joue</label>
      <select class="co-select" id="fOpe">
        <option value="">— à rattacher plus tard —</option>
        ${optionsOperations('', dejaProgramme)}
      </select>
      <p class="sous" style="margin:6px 0 0">Sans opération, le matériel se range mais ne se distribue pas : personne n'y a accès, et rien ne le signale ailleurs que sur cette page.</p>`}`,
    valider: async (ov)=>{
      const nom = ov.querySelector('#fNom').value.trim();
      if(!nom) return "Il faut un nom — c'est sous lui que tout le matériel se range.";
      // Deux spectacles du même nom, c'est le matériel coupé en deux tiroirs et
      // la moitié des musiciens servis. On refuse, plutôt que de le découvrir
      // à la générale.
      const cle = partitionsNormaliser(nom);
      if(state.spectacles.some(x => x.id !== (s ? s.id : '') && partitionsNormaliser(x.nom) === cle))
        return 'Un spectacle porte déjà ce nom. Ouvre-le plutôt que d\'en créer un second : son matériel s\'y range déjà.';

      const champs = {
        nom,
        compositeur: ov.querySelector('#fComp').value.trim(),
        arrangeur: ov.querySelector('#fArr').value.trim(),
      };
      if(s){
        champs.note = ov.querySelector('#fNote').value.trim();
        Object.assign(s, champs);
        rendre();
        await CurieuxDB.upsertOne('partitions_spectacles', s);
        return '';
      }
      const neuf = Object.assign({ id: genId('spect'), lienDrive: '', chiffrer: false, archive: false, note: '' }, champs);
      const tourneeId = ov.querySelector('#fOpe').value;
      state.spectacles.push(neuf);
      state.spectacleId = neuf.id;
      state.vue = 'spectacle';
      rendre();
      await CurieuxDB.upsertOne('partitions_spectacles', neuf);
      if(tourneeId) await programmer(neuf.id, tourneeId);
      else rendre();
      curieuxFlash(`« ${neuf.nom} » créé${tourneeId ? ' et programmé sur ' + nomOperation(tourneeId) : ''}.`);
      return '';
    },
  });
}

async function majSpectacle(champs){
  const s = spectacleCourant();
  if(!s) return;
  Object.assign(s, champs); rendre();
  await CurieuxDB.upsertOne('partitions_spectacles', s);
}

/* --- La partie ------------------------------------------------------------- */

/* La fiche d'une partie — création, et MODIFICATION depuis la tuile.

   La modification n'existait pas : un pupitre mal deviné ou un intitulé de
   fichier illisible ne se corrigeaient qu'en retirant la partie, donc ses
   fichiers, pour tout redéposer. C'est aussi le chemin du doigt, là où le
   glisser-déposer ne se déclenche pas. */
function fichePartie(existant){
  const s = spectacleCourant();
  if(!s) return;
  /* La liste vient de PARTITIONS_PUPITRE_ORDRE : « Chœur » y figure, et il est
     DISTINCT de « Chant », qui désigne les solistes. La confusion n'est pas
     cosmétique — une voix rangée sous « Chant » n'entre pas dans un lot de
     chœur, et le chef de chœur ne la voit jamais. */
  const p = existant || null;
  const pupitres = PARTITIONS_PUPITRE_ORDRE;
  const devine = p ? partitionsPupitreNormalise(partitionsPupitreDe(p.nom)) : '';
  const range = p ? partitionsPupitreNormalise(p.pupitre) : '';
  ouvrirFiche({
    titre: p ? 'Modifier la partie' : 'Ajouter une partie',
    sous: p
      ? "Le nom tel qu'il se lit au pupitre, et la famille à laquelle il appartient. Les fichiers déjà déposés suivent la partie — rien ne se redépose."
      : "L'unité qu'on affecte : Violon 1, Cor 1-2, Piano, Conducteur. Le pupitre se devine du nom — corrige-le s'il se trompe.",
    libelleOk: p ? 'Enregistrer' : 'Ajouter',
    corps: `
      <label class="co-label" for="fPartie">Nom de la partie</label>
      <input class="co-input" id="fPartie" autocomplete="off" placeholder="Violon 1" value="${escapeAttr(p ? p.nom : '')}">
      <label class="co-label" for="fPupitre" style="margin-top:12px">Pupitre</label>
      <select class="co-select" id="fPupitre">
        ${p ? '' : '<option value="">— deviné du nom —</option>'}
        ${pupitres.map(x => `<option value="${escapeAttr(x)}"${p && range === x ? ' selected' : ''}>${escapeHtml(x)}</option>`).join('')}
      </select>
      ${p && devine !== range && devine !== 'Autre'
        ? `<p class="sous" style="margin:6px 0 0">D'après son nom, cette partie relèverait plutôt de <b>${escapeHtml(devine)}</b>.</p>` : ''}`,
    valider: async (ov)=>{
      const nom = ov.querySelector('#fPartie').value.trim();
      if(!nom) return 'Il faut un nom de partie.';
      const cle = partitionsNormaliser(nom);
      if(partiesDe(s.id).some(x => x.id !== (p ? p.id : '') && partitionsNormaliser(x.nom) === cle))
        return 'Cette partie existe déjà dans ce spectacle.';
      const pupitre = ov.querySelector('#fPupitre').value;
      if(p){
        const renommee = partitionsNormaliser(p.nom) !== cle;
        p.nom = nom;
        p.pupitre = partitionsPupitreNormalise(pupitre || partitionsPupitreDe(nom));
        // Une partie renommée reprend sa place dans l'ordre du conducteur :
        // « 120 Oboe » devenu « Hautbois 1-2 » n'a plus à traîner en fin de
        // liste avec ce qu'on n'a pas su classer.
        if(renommee) p.ordre = partitionsOrdreDe(nom);
        rendre();
        await CurieuxDB.upsertOne('partitions_parties', p);
        return '';
      }
      const neuve = creerPartieLocale(nom, pupitre);
      rendre();
      await CurieuxDB.upsertOne('partitions_parties', neuve);
      return '';
    },
  });
}

function creerPartieLocale(nom, pupitre){
  const p = {
    id: genId('part'), spectacleId: state.spectacleId, nom,
    pupitre: pupitre || partitionsPupitreDe(nom), ordre: partitionsOrdreDe(nom), note: '',
    tonalite: '',
  };
  state.parties.push(p);
  return p;
}

/* Une partie retirée emporte ses fichiers, et ses fichiers sont dans le
   stockage. On ne touche au stockage que dans `purger` : tant que le ruban
   « Annuler » est là, rien n'est parti. */
/* TOUT ce qu'une suppression de spectacle emporte, compté avant de le dire.
   C'est la seule façon d'écrire un avertissement qui vaille : « supprimer ce
   spectacle ? » ne renseigne personne, « 38 parties, 41 fichiers (67 Mo),
   52 affectations chez 34 personnes et 2 transmissions » fait réfléchir une
   seconde, et cette seconde est tout ce qu'on cherche. */
function inventaireSpectacle(s){
  const parties = partiesDe(s.id);
  const idsParties = new Set(parties.map(p => p.id));
  const fichiers = state.fichiers.filter(f => idsParties.has(f.partieId));
  const affectations = state.affectations.filter(a => idsParties.has(a.partieId));
  const programmations = programmationsDe(s.id);
  const envois = state.envois.filter(e => e.spectacleId === s.id);
  return {
    parties, fichiers, affectations, programmations, envois,
    personnes: new Set(affectations.map(a => a.personType + '|' + a.personId)).size,
    poids: fichiers.reduce((t, f) => t + (f.octets || 0), 0),
    // Un lot ouvert ou qui va s'ouvrir est un ensemble qui travaille dessus en
    // ce moment, ou s'y prépare. Les lots révoqués et périmés ne retiennent
    // rien : leur lien ne sert déjà plus.
    dehors: envois.filter(e => ['ouvert', 'attente'].includes(etatEnvoi(e).cle)),
  };
}

/* Les lots confiés OUVERTS qui contiennent cette partie. Un lot « tout le
   spectacle » la contient par construction ; un lot sur sélection, seulement
   s'il la nomme. On ne compte pas les lots révoqués ou périmés : ils ne
   servent plus personne. */
function lotsContenant(partie){
  const jour = new Date().toISOString().slice(0, 10);
  const auChoeur = partitionsPupitreNormalise(partie.pupitre) === 'Chœur';
  return state.envois.filter(e =>
    e.spectacleId === partie.spectacleId
    && e.actif
    && (!e.expireLe || e.expireLe >= jour)
    && ((e.parties || []).includes(partie.id)
        // Un lot de chœur « tout le spectacle » ne contient pas les cordes :
        // le prétendre ferait refuser le retrait d'une partie d'orchestre au
        // motif qu'une chorale travaille dessus, ce qui est faux.
        || (e.toutesParties && (!estChoeur(e) || auChoeur))));
}

/* SUPPRIMER UN SPECTACLE, et tout ce qui pend après lui.

   L'ORDRE DE SUPPRESSION N'EST PAS UN DÉTAIL. Les clés étrangères sont en
   « on delete restrict » : les fichiers tiennent aux parties, les parties et
   les envois tiennent au spectacle. Commencer par le spectacle échoue, et
   échoue à moitié — quelques lignes parties, le reste en place, et un écran
   qui ne dit rien de juste. On descend donc l'arbre : affectations, fichiers
   (et leurs objets de stockage), parties, transmissions, programmations, puis
   le spectacle.

   CE QUI SURVIT, ET C'EST VOULU. Le journal des téléchargements ne porte
   aucune clé étrangère : il reste. C'est sa raison d'être — une partition
   retrouvée dans deux ans se rattache à quelqu'un même si le spectacle a été
   effacé entre-temps. Le journal d'audit, lui, garde l'état complet des
   lignes supprimées : elles sont restaurables depuis la corbeille de
   l'administration. Les FICHIERS, non : le stockage ne les rend pas.

   ON PASSE PAR LE RUBAN D'ANNULATION, comme le retrait d'une partie. Rien
   n'est réellement détruit tant qu'il est à l'écran : c'est le dernier filet,
   et le seul qui rattrape un fichier. */
async function supprimerSpectacle(s){
  if(!s) return;
  if(!state.admin){
    alert("La suppression d'un spectacle est réservée aux comptes admin.");
    return;
  }
  const inv = inventaireSpectacle(s);

  /* UN LOT ENCORE DEHORS FAIT REFUSER. Un ensemble tiers qui travaille sur ce
     matériel verrait son lien cesser de fonctionner sans un mot — et c'est la
     seule personne que la page ne peut pas prévenir. Révoquer d'abord est un
     clic, et ce clic est une décision qu'on prend les yeux ouverts. */
  if(inv.dehors.length){
    alert(`Ce matériel est dehors chez ${inv.dehors.length} ensemble${inv.dehors.length > 1 ? 's' : ''} en ce moment :\n`
      + inv.dehors.map(e => '  · ' + e.destinataire + (estChoeur(e) ? ' (chœur)' : '')).join('\n')
      + `\n\nLeur lien cesserait de fonctionner sans qu'ils en soient avertis. Révoque ${inv.dehors.length > 1 ? 'ces remises' : 'cette remise'} d'abord, puis supprime.`);
    return;
  }

  const lignes = [
    `${inv.parties.length} partie${inv.parties.length > 1 ? 's' : ''}`,
    `${inv.fichiers.length} fichier${inv.fichiers.length > 1 ? 's' : ''}${inv.poids ? ' — ' + partitionsPoids(inv.poids) + ', retirés du stockage' : ''}`,
    inv.affectations.length ? `${inv.affectations.length} affectation${inv.affectations.length > 1 ? 's' : ''} chez ${inv.personnes} personne${inv.personnes > 1 ? 's' : ''} — ces partitions disparaîtront de leur espace` : '',
    inv.programmations.length ? `${inv.programmations.length} rattachement${inv.programmations.length > 1 ? 's' : ''} à une opération` : '',
    (()=>{
      const tiers = inv.envois.filter(e => !estChoeur(e)).length;
      const choeurs = inv.envois.filter(estChoeur).length;
      const bouts = [
        tiers ? `${tiers} transmission${tiers > 1 ? 's' : ''}` : '',
        choeurs ? `${choeurs} remise${choeurs > 1 ? 's' : ''} à un chœur` : '',
      ].filter(Boolean);
      return bouts.length ? bouts.join(' et ') + ' (révoquée' + (inv.envois.length > 1 ? 's' : '') + ' ou périmée' + (inv.envois.length > 1 ? 's' : '') + ')' : '';
    })(),
  ].filter(Boolean);

  ouvrirFiche({
    titre: `Supprimer « ${s.nom} » ?`,
    sous: "Un spectacle qui ne se joue plus s'ARCHIVE : il sort des listes et rien n'est perdu. La suppression sert à autre chose — un doublon, un essai, un matériel déposé sous le mauvais nom.",
    libelleOk: 'Supprimer définitivement',
    corps: `
      <p class="sous" style="margin:0 0 6px"><b>Ce qui part avec lui :</b></p>
      <ul style="margin:0 0 12px 18px; padding:0; font-size:13px; line-height:1.7">
        ${lignes.map(l => `<li>${escapeHtml(l)}</li>`).join('')}
      </ul>
      <p class="sous" style="margin:0 0 12px">Ce qui reste : le <b>journal des téléchargements</b> — il doit survivre à ce qu'il décrit, c'est ce qui permet de rattacher une partition retrouvée. Les lignes supprimées restent restaurables depuis la corbeille de l'administration, <b>mais pas les fichiers</b> : le stockage ne les rend pas.</p>
      <label class="co-label" for="fConfirme">Retape le nom du spectacle pour confirmer</label>
      <input class="co-input" id="fConfirme" autocomplete="off" placeholder="${escapeAttr(s.nom)}">`,
    valider: async (ov)=>{
      const saisi = ov.querySelector('#fConfirme').value.trim();
      if(partitionsNormaliser(saisi) !== partitionsNormaliser(s.nom)){
        return 'Le nom ne correspond pas. Recopie-le tel qu\'il est affiché — c\'est la dernière vérification.';
      }
      effacerSpectacle(s, inv);
      return '';
    },
  });
}

function effacerSpectacle(s, inv){
  const idsParties = new Set(inv.parties.map(p => p.id));
  const idsAff = new Set(inv.affectations.map(a => a.id));
  const idsEnvois = new Set(inv.envois.map(e => e.id));
  const idsProg = new Set(inv.programmations.map(p => p.id));

  state.affectations = state.affectations.filter(a => !idsAff.has(a.id));
  state.fichiers = state.fichiers.filter(f => !idsParties.has(f.partieId));
  state.parties = state.parties.filter(p => !idsParties.has(p.id));
  state.envois = state.envois.filter(e => !idsEnvois.has(e.id));
  state.programmations = state.programmations.filter(p => !idsProg.has(p.id));
  state.spectacles = state.spectacles.filter(x => x.id !== s.id);
  state.spectacleId = '';
  state.tourneeId = '';
  state.vue = 'spectacles';
  rendre();

  CurieuxAnnuler.proposer({
    texte: `« ${s.nom} » supprimé${inv.fichiers.length ? ` (${inv.fichiers.length} fichier${inv.fichiers.length > 1 ? 's' : ''})` : ''}`,
    retablir: ()=>{
      state.spectacles.push(s);
      state.parties.push(...inv.parties);
      state.fichiers.push(...inv.fichiers);
      state.affectations.push(...inv.affectations);
      state.envois.push(...inv.envois);
      state.programmations.push(...inv.programmations);
      ouvrirSpectacle(s.id, '');
    },
    // L'ordre descend l'arbre des clés étrangères — voir l'en-tête ci-dessus.
    purger: async ()=>{
      for(const a of inv.affectations) await CurieuxDB.removeOne('partitions_affectations', a.id);
      for(const f of inv.fichiers){
        await CurieuxDB.removeOne('partitions_fichiers', f.id);
        await CurieuxDB.retirerPartition(f.chemin);
      }
      for(const p of inv.parties) await CurieuxDB.removeOne('partitions_parties', p.id);
      for(const e of inv.envois) await CurieuxDB.removeOne('partitions_envois', e.id);
      for(const p of inv.programmations) await CurieuxDB.removeOne('partitions_programmations', p.id);
      await CurieuxDB.removeOne('partitions_spectacles', s.id);
    },
  });
}

function retirerPartie(id){
  const p = state.parties.find(x => x.id === id);
  if(!p) return;
  /* Une partie retirée disparaît AUSSI du lot confié à un ensemble tiers, en
     silence et de son côté : il rouvre son lien et le jeu a maigri, sans un
     mot. On ne l'interdit pas — il y a de bonnes raisons de retirer une partie
     pour la redéposer corrigée — mais on le dit, parce que c'est la seule
     personne que la page ne peut pas prévenir. */
  const lots = lotsContenant(p);
  if(lots.length && !confirm(
      `« ${p.nom} » fait partie de ${lots.length} lot${lots.length > 1 ? 's' : ''} confié${lots.length > 1 ? 's' : ''} à l'extérieur :\n`
      + lots.map(e => '  · ' + e.destinataire).join('\n')
      + `\n\nEn la retirant, elle disparaît de leur lien sans qu'ils en soient avertis. Continuer ?`)) return;
  const fs = fichiersDe(id);
  const affs = state.affectations.filter(a => a.partieId === id);
  state.parties = state.parties.filter(x => x.id !== id);
  state.fichiers = state.fichiers.filter(f => f.partieId !== id);
  state.affectations = state.affectations.filter(a => a.partieId !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `« ${p.nom} » retirée${fs.length ? ` (${fs.length} fichier${fs.length > 1 ? 's' : ''})` : ''}`,
    retablir: ()=>{
      state.parties.push(p); state.fichiers.push(...fs); state.affectations.push(...affs); rendre();
    },
    purger: async ()=>{
      for(const a of affs) await CurieuxDB.removeOne('partitions_affectations', a.id);
      for(const f of fs){ await CurieuxDB.removeOne('partitions_fichiers', f.id); await CurieuxDB.retirerPartition(f.chemin); }
      await CurieuxDB.removeOne('partitions_parties', id);
    },
  });
}

function retirerFichier(id){
  const f = state.fichiers.find(x => x.id === id);
  if(!f) return;
  state.fichiers = state.fichiers.filter(x => x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `« ${f.titre || f.nomOrigine} » retiré`,
    retablir: ()=>{ state.fichiers.push(f); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('partitions_fichiers', id); await CurieuxDB.retirerPartition(f.chemin); },
  });
}

/* --- La programmation : le lien spectacle ↔ opération ---------------------- */

/* LA LIGNE D'ACCÈS SE CRÉE AVEC LA PROGRAMMATION, et surtout pas plus tard.
   partition_pour_jeton fait une jointure INTERNE sur partitions_acces : sans
   cette ligne, aucune partition n'est téléchargeable, et rien ne le dit —
   la production affecte tout un orchestre, les musiciens voient leur liste et
   se heurtent à un refus que personne ne sait expliquer. On la crée donc avec
   un code tiré d'office : mieux vaut un code à communiquer qu'un mur muet.
   Elle appartient à l'OPÉRATION, pas au spectacle : deux spectacles sur la
   même soirée partagent un seul code. */
async function assurerAcces(tourneeId){
  if(!tourneeId || state.acces.some(a => a.id === tourneeId)) return;
  const a = { id: tourneeId, code: partitionsNouveauCode(), actif: true, ouvertLe: '' };
  state.acces.push(a);
  await CurieuxDB.upsertOne('partitions_acces', a);
}

async function programmer(spectacleId, tourneeId){
  if(!spectacleId || !tourneeId) return;
  const id = `${spectacleId}::${tourneeId}`;
  if(state.programmations.some(p => p.id === id)){ rendre(); return; }
  const p = { id, spectacleId, tourneeId, note: '' };
  state.programmations.push(p);
  // On recale l'onglet de distribution si celui en cours n'appartient pas à ce
  // spectacle : sinon on vient de programmer et l'écran ne montre rien.
  if(state.spectacleId === spectacleId && !estProgramme(spectacleId, state.tourneeId)) state.tourneeId = tourneeId;
  rendre();
  await CurieuxDB.upsertOne('partitions_programmations', p);
  await assurerAcces(tourneeId);
  rendre();
}

/* Déprogrammer emporte les affectations de CE spectacle sur CETTE opération —
   et rien d'autre. Les laisser derrière donnerait des partitions visibles dans
   l'espace de musiciens sur une opération où l'œuvre n'est plus jouée : une
   erreur qui ne se voit que du côté du musicien, donc jamais. */
function deprogrammer(progId){
  const p = state.programmations.find(x => x.id === progId);
  if(!p) return;
  const affs = affectationsDeSpectacle(p.spectacleId, p.tourneeId);
  if(affs.length && !confirm(
      `« ${nomSpectacle(p.spectacleId)} » est distribué à ${new Set(affs.map(a => a.personType + '|' + a.personId)).size} personne(s) sur « ${nomOperation(p.tourneeId)} ».\n\n`
      + `Le retirer de cette opération retire aussi ces ${affs.length} affectation(s) : ces partitions disparaîtront de leur espace.`)){
    rendre(); return;
  }
  const retirees = new Set(affs.map(a => a.id));
  state.programmations = state.programmations.filter(x => x.id !== progId);
  state.affectations = state.affectations.filter(a => !retirees.has(a.id));
  if(state.tourneeId === p.tourneeId && state.vue === 'spectacle'){
    state.tourneeId = (programmationsDe(p.spectacleId)[0] || {}).tourneeId || '';
  }
  rendre();
  CurieuxAnnuler.proposer({
    texte: `« ${nomSpectacle(p.spectacleId)} » retiré de ${nomOperation(p.tourneeId)}${affs.length ? ` (${affs.length} affectation${affs.length > 1 ? 's' : ''})` : ''}`,
    retablir: ()=>{
      state.programmations.push(p);
      state.affectations.push(...affs);
      state.tourneeId = p.tourneeId;
      rendre();
    },
    purger: async ()=>{
      for(const a of affs) await CurieuxDB.removeOne('partitions_affectations', a.id);
      await CurieuxDB.removeOne('partitions_programmations', progId);
    },
  });
}

/* --- Le dépôt -------------------------------------------------------------- */

function ajouterAuDepot(fichiers){
  const parties = partiesDe(state.spectacleId);
  const pdf = fichiers.filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  const rejetes = fichiers.length - pdf.length;
  pdf.forEach(f => {
    const r = partitionsApparier(f.name, parties);
    state.depot.push({
      fichier: f, nomOrigine: f.name, octets: f.size,
      propose: r.propose, partieId: r.partie ? r.partie.id : '',
      sûrete: r.sûrete, candidats: r.candidats || null,
    });
  });
  if(rejetes) alert(`${rejetes} fichier${rejetes > 1 ? 's ont' : ' a'} été ignoré${rejetes > 1 ? 's' : ''} : seuls les PDF sont acceptés.`);
  rendre();
}

async function confirmerDepot(){
  const btn = document.getElementById('btnConfirmerDepot');
  const aFaire = state.depot.slice();
  if(!aFaire.length || state.depotEnCours) return;
  if(btn) btn.disabled = true;

  let faits = 0;
  const echecs = [];

  /* Un try/finally, et il n'est pas décoratif : la progression est désormais
     lue dans state, et c'est elle qui tient le bouton « Déposer » désactivé.
     Une erreur inattendue au milieu de l'envoi laisserait donc un écran de
     dépôt définitivement bloqué — plus rien à faire que recharger la page,
     avec trente fichiers en attente à re-glisser. */
  try{
    // Les parties manquantes d'abord, toutes ensemble : plusieurs fichiers
    // peuvent viser la même partie neuve, et en créer deux la scinderait en
    // silence.
    const neuves = new Map();
    for(const d of aFaire){
      if(d.partieId) continue;
      const cle = partitionsNormaliser(d.propose);
      if(!neuves.has(cle)){
        const p = creerPartieLocale(d.propose, '');
        neuves.set(cle, p);
        await CurieuxDB.upsertOne('partitions_parties', p);
      }
      d.partieId = neuves.get(cle).id;
    }

    for(const d of aFaire){
      /* La progression passe par une BARRE et non par le libellé du bouton :
         celui-ci changeait de largeur à chaque fichier, faisait sauter la ligne
         de titre, et un bouton qui se réécrit n'a plus l'air désactivé. On pose
         l'état dans state, puis on ne touche qu'à la barre — redessiner l'écran
         à chaque fichier le ferait clignoter trente fois. */
      state.depotEnCours = faits + 1;
      const barre = document.querySelector('.depot-barre i');
      if(barre) barre.style.width = (faits / aFaire.length * 100).toFixed(0) + '%';
      else rendre();
      const depot = await CurieuxDB.deposerPartition(state.spectacleId, d.partieId, d.fichier);
      if(depot.error){ echecs.push(`${d.nomOrigine} — ${depot.error.message || 'échec'}`); continue; }
      const f = {
        id: genId('pfic'), partieId: d.partieId,
        titre: partitionsNomDepuisFichier(d.nomOrigine), chemin: depot.chemin,
        nomOrigine: d.nomOrigine, octets: d.octets, pages: null, empreinte: '',
        ordre: fichiersDe(d.partieId).length,
      };
      state.fichiers.push(f);
      await CurieuxDB.upsertOne('partitions_fichiers', f);
      faits++;
    }

    state.depot = [];
    state.vue = 'spectacle';
  } finally {
    state.depotEnCours = 0;
    rendre();
  }

  // Après le rendu, jamais avant : une boîte de dialogue posée sur l'écran de
  // dépôt donne à lire un décompte d'échecs devant la liste qui les a produits,
  // encore intacte — on croit que rien n'est parti.
  if(echecs.length) alert(`${faits} fichier(s) déposé(s).\n\nÉchecs :\n` + echecs.join('\n'));
  else curieuxFlash(`${faits} fichier${faits > 1 ? 's déposés' : ' déposé'} dans « ${nomSpectacle(state.spectacleId)} ».`);
}

/* --- L'affectation --------------------------------------------------------- */

async function affecter(partieId, personType, personId){
  if(!state.tourneeId) return;
  const id = `${state.tourneeId}::${partieId}::${personId}`;
  if(state.affectations.some(a => a.id === id)) return;
  await assurerAcces(state.tourneeId);
  const a = { id, tourneeId: state.tourneeId, partieId, personType, personId };
  state.affectations.push(a); rendre();
  await CurieuxDB.upsertOne('partitions_affectations', a);
}

function desaffecter(id){
  const a = state.affectations.find(x => x.id === id);
  if(!a) return;
  state.affectations = state.affectations.filter(x => x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: 'Affectation retirée',
    retablir: ()=>{ state.affectations.push(a); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('partitions_affectations', id); },
  });
}

/* Reprendre l'affectation d'une autre opération DU MÊME SPECTACLE. C'est le
   geste qui fait gagner le plus de temps : EXPEDITION 33 porte quatre
   opérations, et l'essentiel des pupitres revient d'une fois sur l'autre. On ne
   reprend QUE les personnes réellement présentes sur la nouvelle opération —
   recopier quelqu'un qui n'y joue pas lui ferait apparaître des partitions dans
   son espace pour une opé où il n'est pas attendu. */
async function reprendreAffectation(sourceId){
  const source = affectationsDeSpectacle(state.spectacleId, sourceId);
  const effectif = new Set(effectifDe(state.tourneeId).map(e => e.personType + '|' + e.personId));
  const existantes = new Set(affectationsDe(state.tourneeId).map(a => a.partieId + '|' + a.personId));
  const nouvelles = [];
  let ecartes = 0;
  source.forEach(a => {
    if(!effectif.has(a.personType + '|' + a.personId)){ ecartes++; return; }
    if(existantes.has(a.partieId + '|' + a.personId)) return;
    nouvelles.push({ id: `${state.tourneeId}::${a.partieId}::${a.personId}`, tourneeId: state.tourneeId,
                     partieId: a.partieId, personType: a.personType, personId: a.personId });
  });
  if(!nouvelles.length){
    alert(ecartes ? `Rien à reprendre : les ${ecartes} personnes de cette opération ne jouent aucune date de celle-ci.`
                  : 'Rien à reprendre — tout est déjà affecté.');
    rendre(); return;
  }
  if(!confirm(`Reprendre ${nouvelles.length} affectation(s) de « ${nomOperation(sourceId)} » ?`
      + (ecartes ? `\n\n${ecartes} seront écartées : ces personnes ne jouent aucune date de cette opération.` : ''))) { rendre(); return; }
  await assurerAcces(state.tourneeId);
  state.affectations.push(...nouvelles); rendre();
  for(const a of nouvelles) await CurieuxDB.upsertOne('partitions_affectations', a);
}

/* Créer un lot confié. Deux refus, et ils ne sont pas symétriques : sans
   destinataire, le filigrane ne désignerait personne et tout le dispositif
   tombe — c'est un refus sec. Les droits, eux, se confirment : on prévient,
   et on laisse passer si la personne assume, parce qu'il existe des cas
   légitimes (matériel propre, arrangement maison, domaine public) que la page
   ne peut pas distinguer. */
/* ---------------------------------------------------------------------------
   LES GESTES DU CHŒUR
   --------------------------------------------------------------------------- */

/* La tonalité se saisit AU FIL DE LA FRAPPE et s'enregistre à la sortie du
   champ — jamais par un bouton « Enregistrer ». Il y en a une par voix et une
   par numéro : douze boutons sur un écran, c'est douze occasions d'en oublier
   un, et une tonalité notée mais pas enregistrée est pire que pas de tonalité
   du tout — on croit l'avoir dite.

   ON NE RE-REND PAS L'ÉCRAN. Un rendu complet reconstruirait la grille des
   voix et arracherait le curseur du champ suivant, qu'on est justement en
   train de remplir : on tape quatre tonalités à la suite, pas une par visite.
   On met donc à jour ce qui doit l'être — la valeur normalisée, et les
   pense-bêtes des fichiers qui héritent de cette voix — et rien d'autre. */
async function majTonalitePartie(partieId, valeur, champ){
  const p = state.parties.find(x => x.id === partieId);
  if(!p) return;
  const propre = partitionsTonalite(valeur);
  if(propre === (p.tonalite || '')) return;
  p.tonalite = propre;
  if(champ) champ.value = propre;
  // Les numéros sans tonalité propre affichent désormais celle-ci en
  // pense-bête : c'est ce qu'ils porteront réellement.
  document.querySelectorAll('[data-ton-fichier]').forEach(inp => {
    const f = state.fichiers.find(x => x.id === inp.dataset.tonFichier);
    if(f && f.partieId === partieId && !String(f.tonalite || '').trim()){
      inp.placeholder = propre || 'ton';
    }
  });
  const res = await CurieuxDB.upsertOne('partitions_parties', p);
  if(res && res.error) alert("La tonalité n'a pas pu être enregistrée : " + (res.error.message || 'échec'));
}

async function majTonaliteFichier(fichierId, valeur, champ){
  const f = state.fichiers.find(x => x.id === fichierId);
  if(!f) return;
  const propre = partitionsTonalite(valeur);
  if(propre === (f.tonalite || '')) return;
  f.tonalite = propre;
  if(champ) champ.value = propre;
  const res = await CurieuxDB.upsertOne('partitions_fichiers', f);
  if(res && res.error) alert("La tonalité n'a pas pu être enregistrée : " + (res.error.message || 'échec'));
}

/* Faire entrer une partie dans le chœur, ou l'en sortir. C'est un changement
   de PUPITRE, pas une copie : la partie reste une et unique dans le matériel,
   et ses fichiers ne bougent pas. Ce qui change, c'est qui la reçoit — un lot
   de chœur « tout le chœur » la porte désormais, et un lot d'orchestre « tout
   le spectacle » la porte toujours. */
async function versChoeur(partieId){
  const p = state.parties.find(x => x.id === partieId);
  if(!p) return;
  p.pupitre = 'Chœur';
  rendre();
  const res = await CurieuxDB.upsertOne('partitions_parties', p);
  if(res && res.error){
    alert("Le pupitre n'a pas pu être enregistré : " + (res.error.message || 'échec')
      + "\n\nSi la base n'accepte pas encore la valeur « Chœur », joue le bloc L'ESPACE DU CHŒUR de migrations.sql.");
  }
}

async function horsChoeur(partieId){
  const p = state.parties.find(x => x.id === partieId);
  if(!p) return;
  /* UN LOT OUVERT FAIT PRÉVENIR. Sortir une voix du chœur la retire des lots
     « tout le chœur » en cours : le chef de chœur qui rouvre son lien ne la
     trouve plus, et personne ne le lui a dit. Ce n'est pas un refus — il y a
     de bonnes raisons de le faire —, c'est une seconde de réflexion. */
  const lots = lotsContenant(p).filter(estChoeur).filter(e => e.toutesParties);
  if(lots.length && !confirm(
      `« ${p.nom} » est actuellement remise à ${lots.map(e => e.destinataire).join(', ')}.\n\n`
      + "La sortir du chœur la retire de ces lots : le lien reste valide, mais cette voix n'y sera plus. Continuer ?")) return;
  // On la remet au pupitre que son nom suggère, et non à « Autre » : une voix
  // sortie du chœur est le plus souvent une partie de soliste, donc « Chant ».
  p.pupitre = partitionsPupitreDe(p.nom) || 'Autre';
  if(partitionsPupitreNormalise(p.pupitre) === 'Chœur') p.pupitre = 'Chant';
  rendre();
  await CurieuxDB.upsertOne('partitions_parties', p);
}

/* Les quatre voix d'un coup. C'est le geste de départ neuf fois sur dix —
   soprano, alto, ténor, basse — et le faire à la main, c'est quatre fois la
   même fiche modale pour taper quatre mots qu'on connaît d'avance. Les divisi
   s'ajoutent ensuite un par un, parce qu'eux ne se devinent pas. */
async function creerVoixSATB(){
  const s = spectacleCourant();
  if(!s) return;
  const existantes = new Set(partiesDe(s.id).map(p => partitionsNormaliser(p.nom)));
  const neuves = ['Soprano', 'Alto', 'Ténor', 'Basse']
    .filter(nom => !existantes.has(partitionsNormaliser(nom)))
    .map(nom => creerPartieLocale(nom, 'Chœur'));
  if(!neuves.length){
    alert('Les quatre voix existent déjà dans ce spectacle. Rattache-les au chœur depuis le sélecteur ci-dessous.');
    return;
  }
  rendre();
  for(const p of neuves){
    const res = await CurieuxDB.upsertOne('partitions_parties', p);
    if(res && res.error){
      alert("Les voix sont affichées mais n'ont pas toutes été enregistrées : " + (res.error.message || 'échec')
        + "\n\nSi la base n'accepte pas encore le pupitre « Chœur », joue le bloc L'ESPACE DU CHŒUR de migrations.sql.");
      return;
    }
  }
}

/* Une voix de plus — un divisi, un chœur d'enfants, une voix de récitant. La
   tonalité se demande ICI plutôt qu'après : c'est le moment où on l'a en tête. */
function ficheVoix(){
  const s = spectacleCourant();
  if(!s) return;
  ouvrirFiche({
    titre: 'Ajouter une voix',
    sous: "L'unité qu'on remet au chœur : Soprano, Alto 1, Ténor, Basse 2. La tonalité peut attendre — mais elle ne s'écrit nulle part ailleurs.",
    libelleOk: 'Ajouter',
    corps: `
      <label class="co-label" for="fVoix">Nom de la voix</label>
      <input class="co-input" id="fVoix" autocomplete="off" placeholder="Soprano 1">
      <label class="co-label" for="fVoixTon" style="margin-top:12px">Tonalité <em style="font-weight:400;color:var(--muted)">— facultatif</em></label>
      <input class="co-input" id="fVoixTon" autocomplete="off" maxlength="40" placeholder="Ré♭ majeur">`,
    valider: async (ov)=>{
      const nom = ov.querySelector('#fVoix').value.trim();
      if(!nom) return 'Il faut un nom de voix.';
      const cle = partitionsNormaliser(nom);
      if(partiesDe(s.id).some(p => partitionsNormaliser(p.nom) === cle))
        return 'Cette partie existe déjà dans ce spectacle.';
      const p = creerPartieLocale(nom, 'Chœur');
      p.tonalite = partitionsTonalite(ov.querySelector('#fVoixTon').value);
      rendre();
      const res = await CurieuxDB.upsertOne('partitions_parties', p);
      if(res && res.error) return "Enregistrement refusé : " + (res.error.message || 'échec');
      return '';
    },
  });
}

/* REMETTRE LES PARTITIONS À UN CHŒUR. Même dispositif que la transmission à un
   ensemble tiers — un lien, un code, une fenêtre, un filigrane par exemplaire —
   et deux garde-fous de plus, qui tiennent à ce qu'est un chœur :

   1. LA MIGRATION D'ABORD. Sans la colonne `type`, db.js retirerait la colonne
      inconnue et réécrirait la ligne : le lot s'enregistrerait comme une
      transmission ordinaire, et « tout le chœur » deviendrait « tout le
      spectacle » — le matériel d'orchestre complet chez une chorale amateur,
      sans que personne ne s'en aperçoive. On refuse plutôt que de réparer
      après.
   2. LA PORTÉE EST EXPLICITE. « Tout le chœur » n'envoie que les voix ; la
      base applique la même règle de son côté, pour que l'écran ne soit pas le
      seul rempart. */
async function creerChoeur(){
  const val = (id)=> (document.getElementById(id) || {}).value || '';
  const coche = (id)=> !!(document.getElementById(id) || {}).checked;
  if(!state.spectacleId){
    alert("Ouvre d'abord le spectacle : c'est lui qui décide des voix du lot.");
    return;
  }
  if(state.typeAbsent){
    alert("La base n'a pas encore les colonnes « type » et « dates » de partitions_envois.\n\n"
      + "Un lot de chœur créé maintenant s'enregistrerait comme une transmission ordinaire — "
      + "donc avec le matériel d'orchestre complet, et sans les dates chantées. "
      + "Joue le bloc L'ESPACE DU CHŒUR de migrations.sql (il se rejoue sans risque s'il l'a déjà été), "
      + "puis recharge cette page.");
    return;
  }
  const destinataire = val('choDestinataire').trim();
  if(!destinataire){
    alert("Le nom du chœur est obligatoire : c'est lui qui se pose sur chaque exemplaire téléchargé, et c'est ce qui rend la remise traçable.");
    return;
  }
  const portee = val('choPortee');
  const choisies = Array.from(document.querySelectorAll('[data-cho-partie]'))
    .filter(c => c.checked).map(c => c.dataset.choPartie);
  if(portee === 'selection' && !choisies.length){
    alert('Aucune voix sélectionnée. Coche celles que tu remets, ou repasse sur « tout le chœur ».');
    return;
  }
  const effectif = Math.max(0, Math.min(500, Number(val('choEffectif')) || 0));
  const dates = Array.from(document.querySelectorAll('[data-cho-date]'))
    .filter(c => c.checked).map(c => c.dataset.choDate);
  /* PAS DE REFUS, MAIS UNE QUESTION. Un lot sans date reste légitime — une
     préparation sans calendrier arrêté, un chœur qu'on met au travail avant de
     savoir où il chantera. Mais neuf fois sur dix c'est un oubli, et il ne se
     verrait nulle part ailleurs : ni dans les loges, ni dans le transport, ni
     dans les repas. */
  if(val('choOperation') && !dates.length
     && !confirm("Aucune date n'est cochée pour ce chœur.\n\nSon effectif ne sera compté sur aucune journée, et le chef de chœur ne verra pas quand il chante. Créer quand même le lien ?")) return;
  if(!coche('choDroits') && !confirm("Les droits de diffusion n'ont pas été vérifiés.\n\nUn chœur invité est un TIERS au sens des contrats, même quand il chante avec nous : le matériel de location ne lui est pas retransmissible. Créer quand même le lien ?")) return;

  const e = {
    id: genId('pcho'),
    type: 'choeur',
    spectacleId: state.spectacleId,
    tourneeId: val('choOperation'),
    destinataire,
    contactNom: val('choContact').trim(),
    contactEmail: val('choEmail').trim(),
    effectif,
    jeton: CurieuxDB.nouveauJetonEnvoi(),
    code: partitionsNouveauCode(),
    dates,
    toutesParties: portee !== 'selection',
    parties: portee === 'selection' ? choisies : [],
    ouvertLe: val('choOuvertLe'),
    expireLe: val('choExpireLe'),
    actif: true,
    nominatif: coche('choNominatif'),
    droitsConfirmes: coche('choDroits'),
    note: val('choNote').trim(),
    createdAt: new Date().toISOString(),
  };
  state.envois.push(e);
  rendre();
  const res = await CurieuxDB.upsertOne('partitions_envois', e);
  if(res && res.error){
    alert("Le lien est affiché mais n'a pas encore été enregistré : " + (res.error.message || 'échec')
      + "\n\nSi la base n'a pas encore le bloc L'ESPACE DU CHŒUR, joue la migration avant de communiquer ce lien.");
    return;
  }
  try{ curieuxFlash('Lien créé. « Message FR » ou « Message EN » prépare le mail au chef de chœur.'); }catch(err){}
}

async function creerEnvoi(){
  const val = (id)=> (document.getElementById(id) || {}).value || '';
  const coche = (id)=> !!(document.getElementById(id) || {}).checked;
  /* Le formulaire ne vit que dans la fiche d'un spectacle ouvert, donc
     state.spectacleId est nécessairement rempli — mais il ne l'est plus
     d'office au chargement depuis que la page part de la liste, et un lot
     rattaché à un spectacle vide serait un lien qui n'ouvre rien, envoyé à un
     orchestre qui attend son matériel. Une ligne de ceinture. */
  if(!state.spectacleId){
    alert("Ouvre d'abord le spectacle à confier : c'est lui qui décide des parties du lot.");
    return;
  }
  const destinataire = val('envDestinataire').trim();
  if(!destinataire){
    alert("Le nom de l'ensemble destinataire est obligatoire : c'est lui qui se pose sur chaque exemplaire téléchargé, et c'est ce qui rend la transmission traçable.");
    return;
  }
  const portee = val('envPortee');
  const choisies = Array.from(document.querySelectorAll('[data-env-partie]'))
    .filter(c => c.checked).map(c => c.dataset.envPartie);
  if(portee === 'selection' && !choisies.length){
    alert('Aucune partie sélectionnée. Coche celles que tu confies, ou repasse sur « tout le spectacle ».');
    return;
  }
  if(!coche('envDroits') && !confirm("Les droits de diffusion n'ont pas été vérifiés.\n\nLe matériel de LOCATION ne se retransmet pas à un autre ensemble : c'est l'éditeur qui le lui loue. Créer quand même le lien ?")) return;

  const e = {
    id: genId('penv'),
    spectacleId: state.spectacleId,
    tourneeId: val('envOperation'),
    destinataire,
    contactNom: val('envContact').trim(),
    contactEmail: val('envEmail').trim(),
    jeton: CurieuxDB.nouveauJetonEnvoi(),
    // Un code d'office, comme pour une opération : mieux vaut un code à
    // communiquer qu'un lien qui ouvre seul tout le matériel d'un spectacle
    // dès qu'il est transféré une fois.
    code: partitionsNouveauCode(),
    toutesParties: portee !== 'selection',
    parties: portee === 'selection' ? choisies : [],
    ouvertLe: val('envOuvertLe'),
    expireLe: val('envExpireLe'),
    actif: true,
    nominatif: coche('envNominatif'),
    droitsConfirmes: coche('envDroits'),
    note: val('envNote').trim(),
    createdAt: new Date().toISOString(),
  };
  state.envois.push(e);
  rendre();
  /* Pas de retour en arrière sur échec : l'écriture part dans la file de
     rejeu de db.js, comme partout ailleurs dans le projet, et retirer la ligne
     de l'écran ferait réapparaître au prochain rejeu un lot que la production
     croit annulé. On le DIT, en revanche — et on nomme la cause la plus
     probable, qui est une migration pas encore jouée. */
  const res = await CurieuxDB.upsertOne('partitions_envois', e);
  if(res && res.error){
    alert("Le lien est affiché mais n'a pas encore été enregistré : " + (res.error.message || 'échec')
      + "\n\nSi la base n'a pas encore la table des transmissions, joue la migration avant de communiquer ce lien.");
    return;
  }
  try{ curieuxFlash('Lien créé. « Message FR » ou « Message EN » prépare le mail à envoyer.'); }catch(err){}
}

async function majEnvoi(id, champs){
  const e = state.envois.find(x => x.id === id);
  if(!e) return;
  Object.assign(e, champs); rendre();
  await CurieuxDB.upsertOne('partitions_envois', e);
}

/* Retirer une transmission efface le LIEN, pas la trace. Les lignes du journal
   des téléchargements survivent — elles portent le nom de l'ensemble et la
   date, et c'est précisément ce qu'on veut retrouver deux ans plus tard sur
   une partition ressortie d'un pupitre étranger. */
function retirerEnvoi(id){
  const e = state.envois.find(x => x.id === id);
  if(!e) return;
  state.envois = state.envois.filter(x => x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `${estChoeur(e) ? 'Remise au chœur' : 'Transmission à'} « ${e.destinataire} » retirée`,
    retablir: ()=>{ state.envois.push(e); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('partitions_envois', id); },
  });
}

/* Le presse-papiers demande un contexte sécurisé et une permission ; le repli
   par <textarea> marche partout, y compris derrière un proxy en http. Une
   copie qui échoue en silence ferait envoyer un mail sans lien. */
function copierTexte(texte, message){
  const dire = ()=>{ try{ curieuxFlash(message || 'Copié.'); }catch(e){ } };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(texte).then(dire).catch(()=> repli());
    return;
  }
  repli();
  function repli(){
    const z = document.createElement('textarea');
    z.value = texte;
    z.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(z); z.select();
    try{ document.execCommand('copy'); dire(); }
    catch(err){ prompt('Copie manuelle :', texte); }
    z.remove();
  }
}

async function majAcces(tourneeId, champs){
  if(!tourneeId) return;
  let a = state.acces.find(x => x.id === tourneeId);
  if(!a){ a = { id: tourneeId, code: '', actif: true, ouvertLe: '' }; state.acces.push(a); }
  Object.assign(a, champs); rendre();
  await CurieuxDB.upsertOne('partitions_acces', a);
}

/* --------------------------------------------------------------------------- */

document.querySelectorAll('[data-vue]').forEach(b => b.onclick = ()=>{
  state.vue = b.dataset.vue; state.depot = []; rendre();
});

applyAutoTheme();
charger();
</script>
