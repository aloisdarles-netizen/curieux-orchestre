<style>
  /* ==========================================================================
     LA CHARTE DE LA PAGE, ET CE QU'ELLE A CHANGÉ.

     L'écran était une suite de lignes de texte : spectacles en lignes, parties
     en lignes, affectations en lignes. Juste, mais illisible — on ne voyait
     pas qu'il manquait les cuivres, on le lisait, une ligne après l'autre.

     Trois décisions le rendent lisible d'un coup d'œil, et une seule idée les
     tient : MONTRER LES TROUS, puisque c'est la seule chose qu'on vienne
     vraiment y chercher.

       1. UNE TEINTE PAR PUPITRE (base.css, --pup-*). Une liste de quarante
          parties devient six blocs qu'on embrasse du regard.
       2. UNE JAUGE SEGMENTÉE plutôt qu'un pourcentage : un segment par partie,
          rouge si rien n'est déposé. « 75 % » ne dit pas lesquelles manquent.
       3. UNE MATRICE pour la distribution, pas une liste de sélecteurs. Qui lit
          quoi est une question à deux entrées ; on la lisait jusqu'ici dans un
          seul sens, et l'autre — qui n'a rien à jouer — se découvrait à la
          première répétition.

     LES PIÈCES COMMUNES SONT DANS base.css ET partitions-commun.js : la
     pastille de pupitre (.co-pup), la jauge segmentée (.co-seg), le gabarit de
     matrice (.co-matrix). L'espace du musicien les emploie déjà — le musicien
     qui a appris que sa partie est bleue doit la retrouver bleue quand la
     production lui en parle. Ne sont posées ici que les mesures propres à cet
     écran.

     Les classes .bloc / .ligne / .chiffre restent celles de budget.html et
     suivi.html : le jour où la charte bouge, les trois pages bougent ensemble.
     ========================================================================== */
  /* 1240 et non 1180 : la matrice a besoin de cette largeur pour montrer une
     colonne de plus avant de demander un défilement latéral. */
  .wrap{max-width:min(1240px, 97vw); margin:0 auto;}

  .chiffres{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:18px;}
  .chiffre{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
  .chiffre b{
    display:block; font-family:var(--font-display); font-size:28px; font-weight:500; color:var(--accent);
    line-height:1.1; font-variant-numeric:tabular-nums;
  }
  .chiffre span{font-size:12.5px; color:var(--muted); font-weight:600;}
  .chiffre small{display:block; font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.4;}
  .chiffre.alerte b{color:var(--ko);}
  .chiffre .co-seg{margin-top:8px;}

  .bloc{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px;}
  .bloc + .bloc{margin-top:14px;}
  .bloc h2{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:800; margin:0 0 8px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  }
  /* Le titre est en capitales, son appoint ne l'est pas : « 9,4 Mo » y devenait
     « 9,4 MO », qui n'est pas l'unité. */
  .bloc h2 .h2-total{
    margin-left:auto; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:0;
    text-transform:none; font-weight:700; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }

  .ligne{
    display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .ligne:last-child{border-bottom:none;}
  .l-nom{min-width:0;}
  .l-titre{font-weight:700; font-size:13.5px; display:block;}
  .l-sous{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:1px; line-height:1.4;}
  .l-num{text-align:right; font-variant-numeric:tabular-nums; font-size:13px; font-weight:800; white-space:nowrap; color:var(--muted);}
  /* Une pastille de pupitre posée en dernière colonne d'une ligne : sans cela,
     le repli mobile en fait une bande pleine largeur — un aplat de couleur qui
     hurle ce qu'une pastille chuchote. */
  .ligne > .co-pup{justify-self:start; align-self:center;}

  .vide{font-size:13px; color:var(--muted); padding:10px 0; line-height:1.6;}

  /* La jauge de stockage. Le plan Supabase est à 1 Go : à 1,7 Mo la partie
     fusionnée, c'est une vingtaine de programmes. On ne la cache pas dans un
     écran d'administration — elle se lit là où on dépose. */
  .jauge{height:6px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:8px;}
  .jauge i{display:block; height:100%; background:var(--accent); border-radius:999px;}
  .jauge.alerte i{background:var(--ko);}

  /* ---------------------------------------------------------------------
     LA LISTE DES SPECTACLES : des cartes, pas des lignes.

     Un spectacle porte cinq informations qu'on lit ensemble — son nom, ses
     opérations, la complétude de son matériel, sa répartition par pupitre,
     son poids. En ligne, elles se lisaient l'une après l'autre ; en carte,
     d'un seul coup.
     --------------------------------------------------------------------- */
  .spec-grille{display:grid; grid-template-columns:repeat(auto-fill, minmax(268px, 1fr)); gap:12px;}
  /* align-items et justify-content sont posés explicitement, et ce n'est pas
     de la ceinture : sous 820 px, base.css met TOUS les <button> en
     align-items:center pour la doctrine des 44 px. La carte étant un bouton,
     sa jauge segmentée cessait de s'étirer et se recroquevillait à la largeur
     minimale de ses segments — une barre de 86 px perdue au milieu d'une carte
     de 316. */
  .spec-carte{
    position:relative; text-align:left; width:100%; font-family:inherit; cursor:pointer;
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 15px 13px; display:flex; flex-direction:column; gap:9px;
    align-items:stretch; justify-content:flex-start;
    transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .spec-carte:hover{border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow-card);}
  .spec-carte:focus-visible{outline:2px solid var(--text); outline-offset:2px;}
  .spec-carte.archive{opacity:.62;}
  .spec-tete{display:flex; gap:11px; align-items:flex-start;}
  .spec-nom{font-weight:800; font-size:15px; line-height:1.25; color:var(--text); display:block;}
  .spec-auteur{font-size:12px; color:var(--muted); line-height:1.4; margin-top:2px; display:block;}
  .spec-pups{display:flex; gap:4px; flex-wrap:wrap;}
  .spec-pied{
    display:flex; gap:8px; align-items:center; justify-content:space-between;
    font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;
    border-top:1px solid var(--border); padding-top:8px; margin-top:auto;
  }

  /* Les opérations d'un spectacle, en pastilles. Une programmation se lit d'un
     coup d'œil dans la liste des spectacles : c'est elle qui dit à quoi sert ce
     matériel, et son absence est une alerte, pas un détail. */
  .opes{display:flex; flex-wrap:wrap; gap:5px;}
  .ope{
    display:inline-block; font-size:11px; font-weight:700; white-space:nowrap;
    background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:2px 9px;
    max-width:100%; overflow:hidden; text-overflow:ellipsis;
  }
  .ope.vide{color:var(--ko); border-color:var(--ko); white-space:normal;}

  /* ---------------------------------------------------------------------
     LE MATÉRIEL : une tuile par partie, groupées par pupitre.
     Une partie sans fichier est en rouge tireté — c'est le seul état qui
     demande une action, c'est donc le seul qui crie.
     --------------------------------------------------------------------- */
  .pup-bandeau{
    display:flex; align-items:center; gap:9px; margin:14px 0 8px; font-size:11px;
    font-weight:800; text-transform:uppercase; letter-spacing:.06em;
  }
  .pup-bandeau:first-of-type{margin-top:4px;}
  .pup-bandeau .trait{flex:1; height:2px; border-radius:2px;}
  .pup-bandeau .compte{color:var(--muted); font-weight:700; letter-spacing:0; text-transform:none; font-size:11.5px;}

  .part-grille{display:grid; grid-template-columns:repeat(auto-fill, minmax(228px, 1fr)); gap:9px;}
  .part-tuile{
    border:1px solid var(--border); border-left:4px solid var(--border); border-radius:10px;
    padding:9px 11px; background:var(--bg); display:flex; flex-direction:column; gap:5px; min-width:0;
  }
  .part-tuile.sans-fichier{border-style:dashed; border-left-style:solid; border-color:var(--ko); background:var(--ko-tint);}
  .part-nom{font-weight:800; font-size:13.5px; line-height:1.25; display:flex; gap:8px; align-items:baseline;}
  /* Le nom est un bouton, et il ne doit pas en avoir l'air tant qu'on ne le
     vise pas : c'est d'abord un titre. C'est le chemin du doigt vers la fiche,
     là où le glisser-déposer ne se déclenche pas. */
  .part-titre{
    font:inherit; color:inherit; background:none; border:none; padding:0; margin:0;
    min-height:0; cursor:pointer; text-align:left; min-width:0;
  }
  .part-titre:hover{color:var(--accent); text-decoration:underline;}
  .part-titre:focus-visible{outline:2px solid var(--text); outline-offset:2px; border-radius:4px;}

  /* --- Le déplacement d'une partie d'un pupitre à l'autre ---
     La tuile se saisit, le groupe visé s'allume. On ne déplace pas la tuile à
     la main : c'est le glissé natif du navigateur, qui donne l'image, le
     curseur, Échap pour renoncer et le lâcher hors zone pour annuler. */
  .part-tuile{cursor:grab;}
  .part-tuile:active{cursor:grabbing;}
  .part-tuile.en-vol{opacity:.4;}
  .pup-groupe{border-radius:10px; transition:background .12s, box-shadow .12s;}
  .pup-groupe.survol{background:var(--accent-tint); box-shadow:0 0 0 2px var(--accent); padding:2px 8px 8px;}
  /* Les pupitres que ce spectacle n'emploie pas : invisibles, sauf pendant un
     glissé — il faut bien pouvoir y déposer la première partie. */
  .pup-vide{display:none;}
  body.deplace-partie .pup-vide{display:block;}
  .pup-accueil{
    border:2px dashed var(--border); border-radius:10px; padding:16px 12px; text-align:center;
    font-size:12px; font-weight:700; color:var(--muted);
  }
  /* Le retrait est une croix et non le mot « Retirer » : vingt-quatre boutons
     libellés faisaient de la destruction l'élément le plus répété de l'écran,
     alors qu'on vient y lire ce qui manque. La cible garde 24 px. */
  .part-x{
    margin-left:auto; border:none; background:none; cursor:pointer; color:var(--muted);
    font-size:15px; line-height:1; padding:2px 5px; min-height:24px; min-width:24px; border-radius:6px;
  }
  .part-x:hover{color:var(--ko); background:var(--ko-tint);}
  .part-meta{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .part-fic{
    display:flex; gap:7px; align-items:baseline; font-size:11.5px; color:var(--muted);
    padding:3px 0; border-top:1px solid var(--border); min-width:0;
  }
  .part-fic .nom{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text);}
  .part-manque{font-size:11.5px; font-weight:800; color:var(--ko);}

  /* ---------------------------------------------------------------------
     LE CHŒUR. Des tuiles plus larges que celles du matériel, et c'est voulu :
     une voix porte un champ de saisie (sa tonalité) que les autres parties
     n'ont pas, et une tuile de 228 px le coinçait contre son nom. Quatre voix
     tiennent alors sur deux colonnes, ce qui est exactement la lecture qu'on
     cherche — on compare des tonalités, on ne parcourt pas une liste.
     --------------------------------------------------------------------- */
  .voix-grille{display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:9px; margin-top:4px;}
  .voix-tuile{
    border:1px solid var(--border); border-left:4px solid var(--pup-choeur-ink); border-radius:10px;
    padding:9px 11px; background:var(--bg); display:flex; flex-direction:column; gap:5px; min-width:0;
  }
  .voix-tuile.sans-fichier{border-style:dashed; border-left-style:solid; border-color:var(--ko); background:var(--ko-tint);}
  .voix-tete{display:flex; gap:8px; align-items:center; font-size:13.5px; min-width:0;}
  .voix-tete b{font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .voix-tete .det{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; margin-left:auto; white-space:nowrap;}
  .voix-fic{
    display:flex; gap:7px; align-items:center; font-size:11.5px; color:var(--muted);
    padding:3px 0; border-top:1px solid var(--border); min-width:0;
  }
  .voix-fic .nom{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text);}
  .voix-fic .det{font-variant-numeric:tabular-nums; white-space:nowrap;}
  /* Le champ de tonalité. Étroit, tabulaire, et sans les 44 px de hauteur des
     saisies de formulaire : il y en a une par voix et une par numéro, et une
     colonne de gros champs ferait de la tuile un formulaire. La cible tactile
     reste servie sous 760 px, où base.css les rétablit. */
  .co-input.ton{
    width:106px; min-height:0; padding:3px 7px; font-size:11.5px; font-weight:700;
    text-align:center; letter-spacing:.01em; flex:none;
  }
  .co-input.ton::placeholder{font-weight:400; opacity:.6;}

  .sans-lecteur{color:var(--ko); font-weight:700;}

  /* Les onglets d'opération dans l'atelier d'un spectacle : on distribue une
     opération à la fois, et on voit sans chercher combien il y en a d'autres. */
  .onglets{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  /* En colonne, et posé ici plutôt que laissé au défaut : sous 820 px, base.css
     met tout <button> en inline-flex/align-items:center pour la doctrine des
     44 px, et la période de l'opération venait alors se coller À CÔTÉ de son
     nom au lieu de se ranger dessous — deux phrases sur une ligne, dont on ne
     savait plus laquelle était le titre. */
  .onglet{
    border:1px solid var(--border); background:var(--card); border-radius:999px;
    padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--text);
    font-family:inherit; line-height:1.3; text-align:left;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center;
  }
  .onglet small{display:block; font-weight:500; font-size:11px; color:var(--muted);}
  .onglet.actif{background:var(--accent); border-color:var(--accent); color:#fff;}
  .onglet.actif small{color:rgba(255,255,255,.82);}
  .onglet.alerte{border-color:var(--ko);}

  /* Le fil d'Ariane de l'atelier. Sans lui, on ne sait plus dans quel spectacle
     on dépose — et on dépose dans le mauvais. */
  .fil{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;
    font-size:12.5px; color:var(--muted);
  }
  .fil b{font-family:var(--font-display); font-size:22px; font-weight:500; color:var(--text); line-height:1.15;}

  /* ---------------------------------------------------------------------
     LE DÉPÔT
     --------------------------------------------------------------------- */
  .depot-zone{
    border:2px dashed var(--border); border-radius:var(--radius); padding:22px 18px; text-align:center;
    color:var(--muted); font-size:13px; line-height:1.6; cursor:pointer; transition:border-color .12s, background .12s;
  }
  .depot-zone:hover, .depot-zone.survol{border-color:var(--accent); background:var(--champagne);}
  .depot-zone b{display:block; color:var(--text); font-size:15px; margin-bottom:4px;}
  .depot-zone.compacte{padding:13px 16px; font-size:12.5px;}
  .depot-zone.compacte b{font-size:13.5px; margin-bottom:2px;}

  .dep-ligne{
    display:grid; grid-template-columns:minmax(0,1fr) 210px auto; gap:10px; align-items:center;
    padding:9px 0 9px 11px; border-bottom:1px solid var(--border); border-left:3px solid transparent;
  }
  .dep-ligne:last-child{border-bottom:none;}
  .dep-ligne.aRegler{border-left-color:var(--ko); background:var(--ko-tint);}
  .dep-ligne.exacte{border-left-color:var(--ok);}
  .dep-ligne.probable{border-left-color:var(--maybe);}

  /* Les pastilles de sûreté d'appariement. Trois états, trois lectures : ce qui
     est sûr se survole, ce qui ne l'est pas se lit. */
  .sur{
    display:inline-block; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
  }
  .sur.exacte{background:var(--ok-tint); color:var(--ok);}
  .sur.probable{background:var(--maybe-tint); color:var(--maybe);}
  .sur.incertaine, .sur.aucune{background:var(--ko-tint); color:var(--ko);}

  /* La fiche de proposition. Trois colonnes — qui, vers quoi, à quel point on
     en est sûr — et un liseré de la couleur de la sûreté, le même code que
     les lignes du dépôt : ce qu'on a appris à lire là-bas se relit ici. */
  .prop-liste{display:flex; flex-direction:column; gap:0; max-height:56vh; overflow:auto; margin-top:4px;}
  .prop-titre{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:14px 0 4px; display:flex; align-items:center; gap:8px;}
  .prop-titre:first-child{margin-top:0;}
  .prop-ligne{
    display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto; gap:10px; align-items:center;
    padding:7px 8px 7px 10px; border-left:3px solid var(--border); border-bottom:1px solid var(--border); font-size:13px;
  }
  label.prop-ligne{grid-template-columns:auto minmax(0,1.1fr) minmax(0,1.4fr) auto; cursor:pointer;}
  .prop-ligne input[type=checkbox]{width:16px; height:16px; margin:0; accent-color:var(--accent);}
  .prop-ligne.exacte{border-left-color:var(--ok);}
  .prop-ligne.probable{border-left-color:var(--maybe);}
  .prop-ligne.incertaine{border-left-color:var(--ko);}
  .prop-ligne.aucune{border-left-color:var(--border); color:var(--muted);}
  .prop-ligne b{font-weight:800;}
  .prop-ligne small{display:block; font-size:11.5px; color:var(--muted); line-height:1.35;}
  .prop-qui, .prop-vers{min-width:0;}
  .prop-vers .co-select{width:100%; margin-bottom:2px;}
  /* Sous 640 px, deux rangs : qui et la pastille en haut, la partie en
     dessous. Chaque cellule a sa place ÉCRITE — laissé à l'auto-placement,
     la partie passait sous la case à cocher, dans une colonne de 16 px. */
  @media (max-width:640px){
    .prop-ligne{grid-template-columns:minmax(0,1fr) auto; row-gap:4px;}
    .prop-ligne .prop-qui{grid-row:1; grid-column:1;}
    .prop-ligne .sur{grid-row:1; grid-column:2; align-self:start;}
    .prop-ligne .prop-vers{grid-row:2; grid-column:1 / -1;}
    label.prop-ligne{grid-template-columns:auto minmax(0,1fr) auto;}
    label.prop-ligne input[type=checkbox]{grid-row:1 / span 2; grid-column:1; align-self:start; margin-top:3px;}
    label.prop-ligne .prop-qui{grid-column:2;}
    label.prop-ligne .sur{grid-column:3;}
    label.prop-ligne .prop-vers{grid-column:2 / -1;}
  }

  /* La progression du dépôt. Elle était portée par le LIBELLÉ du bouton, qui
     changeait de largeur à chaque fichier et faisait sauter la ligne de titre ;
     et un bouton qui se réécrit n'a plus l'air désactivé. */
  .depot-barre{height:8px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:10px;}
  .depot-barre i{display:block; height:100%; background:var(--ok); border-radius:999px; transition:width .2s;}

  /* ---------------------------------------------------------------------
     LA DISTRIBUTION : la matrice.

     Le gabarit vient de base.css (.co-matrix), comme la vue d'ensemble et les
     dispos — c'est le même geste, il doit se faire au même endroit de l'écran
     et avec la même colonne collante. Ne sont posées ici que les mesures
     propres aux partitions : une colonne de partie est plus large qu'une
     colonne de date, parce qu'elle porte un nom et non un quantième.
     --------------------------------------------------------------------- */
  .co-matrix-name{width:238px;}
  .co-matrix-date, .co-matrix-cell{width:88px; flex:1 0 88px;}
  .mat-col{
    padding:0 0 6px; text-align:center; border-right:1px solid var(--border);
    display:flex; flex-direction:column; align-items:stretch; gap:4px; width:88px; flex:1 0 88px;
  }
  .mat-col .teinte{height:4px; border-radius:0 0 3px 3px;}
  /* L'en-tête de colonne affecte d'un coup toutes les personnes cochées : la
     cible garde donc 24 px de haut. À 15 px — la hauteur d'une ligne de texte
     — on visait « Cor 1-2 » et on manquait, sur le geste le plus lourd de
     l'écran. */
  .mat-col button{
    font-family:inherit; background:none; border:none; cursor:pointer; padding:4px; min-height:24px;
    font-size:10.5px; font-weight:800; color:var(--text); line-height:1.25; text-align:center;
    display:flex; align-items:center; justify-content:center;
    width:100%; word-break:break-word; hyphens:auto;
  }
  .mat-col button:hover{color:var(--accent); text-decoration:underline;}
  .mat-col button:focus-visible{outline:2px solid var(--text); outline-offset:1px;}
  .mat-col .lecteurs-n{font-size:10px; font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums;}
  .mat-col.orpheline .lecteurs-n{color:var(--ko);}
  .mat-col.orpheline button{color:var(--ko);}
  /* Une partie sans aucun fichier déposé : on l'affecte, la personne voit une
     ligne dans son espace et n'a rien à télécharger. Le soulignement tireté le
     dit au moment précis où l'on est sur le point de se tromper. */
  .mat-col.sans-fichier button{text-decoration:underline dashed var(--ko); text-underline-offset:3px;}

  /* La bande colorée couvre toute la ligne ; c'est l'ÉTIQUETTE qui est collée à
     gauche. Coller la bande entière n'aurait rien donné : large comme la ligne,
     elle ne sort jamais du cadre, et son texte s'en allait quand même. */
  .mat-pup{
    display:flex; align-items:center; gap:8px; padding:5px 14px; font-size:10px; font-weight:800;
    text-transform:uppercase; letter-spacing:.06em; width:100%;
  }
  .mat-pup .etiq{position:sticky; left:0;}
  .mat-personne b{font-weight:800; font-size:13px; display:block; line-height:1.3;}
  .mat-personne small{font-size:10.5px; color:var(--muted); display:block; line-height:1.4;}
  /* Étroite, et volontairement : sur toute la largeur du nom, la jauge se
     lisait comme un soulignement de texte. Courte, elle redevient une jauge. */
  .mat-personne .co-seg{margin-top:5px; max-width:56px;}
  .co-matrix-row.orphelin .co-matrix-name{box-shadow:inset 3px 0 0 var(--ko);}
  .co-matrix-row.hors-effectif .mat-personne b{color:var(--ko);}

  .m-case{
    width:34px; height:30px; border-radius:7px; cursor:pointer; font-size:14px; font-weight:800;
    font-family:var(--font-body); display:grid; place-items:center;
    border:1px solid var(--border); background:var(--card); color:transparent;
  }
  .m-case:hover{border-color:var(--accent); color:var(--muted);}
  .m-case.on{background:var(--ok); border-color:var(--ok); color:var(--sur-statut);}
  .m-case.attente{background:var(--maybe-tint); border-color:var(--maybe); color:var(--maybe);}
  .m-case:focus-visible{outline:2px solid var(--text); outline-offset:2px;}

  .mat-legende{display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:10px;}
  .mat-legende span{display:inline-flex; align-items:center; gap:6px;}
  .mat-puce{width:15px; height:15px; border-radius:5px; border:1px solid var(--border); flex-shrink:0;}
  .mat-puce.on{background:var(--ok); border-color:var(--ok);}
  .mat-puce.attente{background:var(--maybe-tint); border-color:var(--maybe);}

  /* Les lecteurs d'une partie, dans la vue en liste : des jetons qu'on retire
     d'un clic. C'est la seule forme qui tienne quand une partie est lue par
     huit personnes et la suivante par une seule. */
  .lecteurs{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .lecteur{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:3px 6px 3px 10px;
  }
  .lecteur button{
    border:none; background:none; cursor:pointer; color:var(--muted); font-size:15px; line-height:1;
    padding:0 2px; min-height:0;
  }
  .lecteur button:hover{color:var(--ko);}
  .lecteur.absent{border-color:var(--ko); color:var(--ko);}

  /* Le code d'accès : c'est une chose qu'on lit à voix haute en répétition.
     Il se lit donc en grand, et se copie d'un bouton. */
  .code-boite{display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  /* La police d'affichage n'a rien à faire ici : son « 3 » s'y lit comme un
     « Ɛ », et ce code est fait pour être dicté en répétition et retapé sur un
     téléphone. Chiffres à chasse fixe, et de l'air entre les caractères. */
  .code-valeur{
    font-family:var(--font-body); font-variant-numeric:tabular-nums;
    font-size:26px; letter-spacing:.18em; font-weight:800;
    color:var(--accent); background:var(--bg); border:1px solid var(--border); border-radius:10px;
    padding:6px 16px; text-transform:uppercase; line-height:1.3;
  }
  .code-valeur.absent{font-size:15px; color:var(--muted); letter-spacing:0; font-weight:700;}
  .code-saisie{display:flex; flex-direction:column; gap:4px;}
  .code-saisie label{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);}

  /* ---------------------------------------------------------------------
     LES RETRAITS : le journal, enfin visible.
     La table existait et n'était affichée nulle part — on avait la preuve de
     qui avait récupéré sa partie sans jamais pouvoir la lire.
     --------------------------------------------------------------------- */
  .ret-ligne{
    display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center;
    padding:8px 0; border-bottom:1px solid var(--border);
  }
  .ret-ligne:last-child{border-bottom:none;}
  .ret-quand{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .ret-jeton{font-size:10.5px; color:var(--muted); font-family:ui-monospace, monospace;}

  .barre{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .barre select, .barre input{max-width:100%;}
  .barre .pousse{margin-left:auto;}

  /* La fiche modale — création et modification d'un spectacle, d'une partie.
     On abandonne prompt() : il ne prend qu'un champ, il ne valide rien, et il
     ne permettait pas de demander l'opération au moment où elle se décide. */
  .fiche-ov{position:fixed; inset:0; background:rgba(20,22,23,.55); display:grid; place-items:center; z-index:200; padding:20px;}
  .fiche-bo{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius-lg, 22px);
    padding:22px 24px; max-width:540px; width:100%; max-height:86vh; overflow:auto;
  }
  .fiche-bo h2{font-family:var(--font-display); font-size:21px; font-weight:500; color:var(--accent); margin:0 0 4px; text-transform:none; letter-spacing:0;}
  .fiche-bo p.sous{font-size:12.5px; color:var(--muted); margin:0 0 16px; line-height:1.5;}
  .fiche-bo label.co-label{margin-top:12px;}
  .fiche-bo label.co-label:first-of-type{margin-top:0;}
  .fiche-err{font-size:12.5px; color:var(--ko); font-weight:700; margin-top:10px; min-height:1px;}
  .fiche-pied{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap;}
  .fiche-pied .co-btn.ghost{margin-left:auto;}

  /* La bannière de migration. Une table absente se lit « aucune opération » —
     et ce n'est pas la même chose à faire ensuite. */
  .banniere-alerte{display:flex; gap:11px; align-items:flex-start; background:var(--danger-tint); border-radius:var(--radius); padding:13px 15px; margin-bottom:16px;}
  .banniere-alerte .sig{color:var(--danger); font-weight:900; font-size:15px; line-height:1.4; flex:0 0 auto;}
  .banniere-alerte p{margin:0; font-size:13.5px; line-height:1.5;}
  /* Deux migrations peuvent manquer à la fois : sans cet écart, les deux
     textes se touchent et se lisent comme une seule phrase. */
  .banniere-alerte p + p{margin-top:7px;}
  .banniere-alerte[hidden]{display:none;}

  /* Entre 761 et 820 px, la matrice est encore une grille mais la doctrine des
     44 px de base.css s'applique déjà à tout <button> : les cases gonfleraient
     d'un tiers et le tableau perdrait la moitié de ses lignes visibles. C'est
     l'exception que base.css se donne déjà pour .co-matrix-btn ; .m-case est
     la même pièce, elle a droit à la même. Sous 761 px la matrice se replie en
     liste, où les 44 px sont au contraire ce qu'il faut. */
  @media (min-width:761px) and (max-width:820px){
    .m-case{min-height:30px;}
  }
  @media (max-width:860px){
    .co-matrix-name{width:180px;}
  }
  @media (max-width:760px){
    .bloc{padding:13px 14px;}
    /* Les lignes s'empilent, et le !important est ici légitime : plusieurs
       d'entre elles portent leur gabarit en attribut de style, posé pour le
       grand écran. Sans cela, la colonne de gauche du bloc « Code d'accès »
       tombait à soixante pixels et sa phrase s'écrivait un mot par ligne. */
    .ligne{grid-template-columns:minmax(0,1fr) !important; gap:8px;}
    .l-num{text-align:left;}
    .code-boite{width:100%;}
    .code-valeur{font-size:23px; letter-spacing:.14em;}
    .dep-ligne{grid-template-columns:minmax(0,1fr); gap:6px;}
    .dep-ligne.aRegler{margin:0 -14px; padding:9px 14px;}
    .part-grille{grid-template-columns:1fr;}
    .voix-grille{grid-template-columns:1fr;}
    /* La cible tactile reprend ses droits : 16 px de police (sans quoi iOS
       zoome sur la saisie) et une hauteur qu'on peut viser du pouce. */
    .co-input.ton{width:100%; min-height:38px; font-size:16px !important;}
    .spec-grille{grid-template-columns:1fr;}
    .ret-ligne{grid-template-columns:minmax(0,1fr) auto;}
    input, select{font-size:16px !important;}
    /* Sous 760 px la matrice ne tient plus : la page bascule d'office en liste
       — voir blocDistribution(). Le bouton de bascule disparaît donc aussi,
       pour ne pas proposer un affichage qu'on ne peut pas rendre. */
    .bascule-matrice{display:none !important;}
  }
  /* 390 px — l'iPhone qu'on a dans la poche en régie. Le titre de bloc et son
     appoint ne tiennent plus côte à côte : l'appoint passe dessous, aligné à
     gauche, plutôt que de compresser les deux. */
  @media (max-width:420px){
    .bloc h2 .h2-total{margin-left:0; width:100%;}
    .fil b{font-size:19px;}
    .code-valeur{font-size:20px; letter-spacing:.1em; padding:6px 12px;}
  }
</style>

<body>
<div class="wrap">
  <div class="co-page-head co-fade">
    <div>
      <h1 class="co-h1">Partitions</h1>
      <p class="co-sub">On crée un spectacle, on dit sur quelle opération il se joue, puis on y lie ses parties et ses musiciens.</p>
    </div>
    <div class="co-actions">
      <button type="button" class="co-btn" data-vue="spectacles">Spectacles</button>
      <button type="button" class="co-btn" data-vue="operations">Par opération</button>
      <button type="button" class="co-btn" data-vue="retraits">Retraits</button>
      <button type="button" class="co-btn" data-vue="choeurs">Chœurs</button>
      <button type="button" class="co-btn" data-vue="transmissions">Transmissions</button>
    </div>
  </div>

  <div class="banniere-alerte" id="migrationBanner" hidden>
    <span class="sig">!</span>
    <div id="migrationTexte"></div>
  </div>

  <div id="page"><div class="co-card co-pad vide">Chargement…</div></div>
</div>
<script>
/* ============================================================================
   Partitions — la page.
   ============================================================================
   Les partitions circulaient par message et par Drive : un lien par pupitre,
   renvoyé à chaque ajout, et personne ne savait qui avait réellement récupéré
   sa partie. Le jour où une partition ressortait ailleurs, rien ne disait d'où
   elle venait. Cette page range le matériel une fois, le distribue nominativement
   à chaque opération, et pose sur chaque exemplaire téléchargé le nom de qui
   l'a pris.

   L'ORDRE DES GESTES, et c'est lui qu'on a corrigé
   -----------------------------------------------
   La première version partait des fichiers : on déposait dans une bibliothèque
   hors sol, puis on ouvrait un SECOND écran où il fallait recroiser à la main
   une opération et un spectacle — sans que rien ne dise lesquels vont ensemble.
   On travaille maintenant dans l'ordre où la production décide :

     1. je crée le SPECTACLE et je dis sur quelle OPÉRATION il se joue ;
     2. j'ouvre ce spectacle et j'y range ses PARTIES et leurs fichiers ;
     3. dans ce même écran, j'y lie les MUSICIENS, opération par opération.

   Tout tient dans une seule page par spectacle. L'écran « Par opération » ne
   sert qu'à la relecture d'avant première répétition : sur cette opé, qu'a-t-on
   programmé, et qui n'a rien à jouer.

   TROIS NIVEAUX, ET C'EST CELUI DU MILIEU QUI TRAVAILLE :
     le SPECTACLE  — EXPEDITION 33. On y dépose le matériel UNE FOIS.
     la PARTIE     — Violon 1, Alto, Piano. C'est l'unité qu'on affecte.
     l'OPÉRATION   — une tournée ou un enregistrement, une ligne de tournees.

   LES RÈGLES QUI TIENNENT TOUT, et qu'il ne faut défaire sous aucun prétexte :

   1. UN SEUL EXEMPLAIRE PROPRE PAR PARTIE, jamais un fichier par musicien·ne.
      C'est ce qui maintient le stockage plat : cinquante musiciens sur une
      partie, c'est un fichier, pas cinquante.
   2. LE MATÉRIEL APPARTIENT AU SPECTACLE, PAS À L'OPÉRATION. EXPEDITION 33
      porte quatre opérations et ne se dépose qu'une fois. C'est pourquoi la
      programmation est une LIGNE DE LIAISON (partitions_programmations) et non
      une colonne sur le spectacle : rattacher une cinquième opération ne coûte
      pas un octet de plus.
   3. LE FILIGRANE SE POSE À LA VOLÉE, dans /api/partition, au moment du
      téléchargement. Le fichier propre ne sort jamais du bucket privé.
   4. L'AFFECTATION PORTE SUR LA PARTIE, pas sur le fichier. Un fichier ajouté
      à trois semaines du concert se propage seul à tous ceux qui la lisent.
   5. LES LIENS PERSONNELS DÉJÀ ENVOYÉS RESTENT VALIDES. Le musicien voit ses
      partitions dans son espace existant ; on ne réémet aucun lien.

   CE QUE CETTE PAGE NE FAIT PAS, et qui est un bon refus :

   — Elle n'AFFECTE PAS toute seule une partie à une personne d'après son
     instrument. musiciens.instrument est du texte libre : 25 valeurs sur 114
     fiches, avec « Flutes » et « Flûtes », « Alto » et « Altos », et un
     « Violoncelles » à espace final. Un appariement appliqué en silence se
     tromperait, et l'erreur ne se découvrirait qu'à la première répétition.
     Elle le PROPOSE — « Proposer d'après les instruments », dans la
     distribution — ligne par ligne, graduée (sûre, probable, à trancher),
     et rien ne s'écrit avant d'avoir été relu et coché. Ce qui est déjà posé
     à la main ne bouge jamais. Voir partitionsProposerAffectations.
   — Elle ne lit PAS la nomenclature de l'opération pour savoir qui joue.
     tournees.nomenclature est un prévisionnel de devis : EXP33-REC-ORCHESTRE
     SYMPHONIQUE y annonce 49 postes et n'a que 16 musiciens affectés. L'effectif
     réel se lit dans dates[].musiciensAssignes, et nulle part ailleurs.
   — Elle n'affiche PAS les partitions dans le navigateur. La CSP interdit
     <object> et <embed> (object-src 'none'), mais pas une <iframe> vers
     /api/partition, qui est same-origin : c'est donc un choix, pas une
     contrainte. Prévisualiser obligerait à poser le filigrane pour un simple
     coup d'œil, donc à écrire une ligne de journal et à brûler un jeton pour
     rien. On télécharge, et le journal ne dit que la vérité.
============================================================================ */

const PLAFOND_STOCKAGE = 1024 * 1024 * 1024;   // le plan Supabase gratuit

let state = {
  vue: 'spectacles',   // 'spectacles' | 'spectacle' | 'depot' | 'operations' | 'retraits' | 'choeurs' | 'transmissions'
  spectacles: [], programmations: [], parties: [], fichiers: [], affectations: [], acces: [], envois: [],
  tournees: [], musiciens: [], techniciens: [],
  spectacleId: '',
  tourneeId: '',      // l'opération en cours de distribution
  depot: [],          // les fichiers choisis, pas encore déposés
  depotEnCours: 0,    // la progression du dépôt, en fichiers traités
  /* La distribution se lit de deux façons : la matrice pour distribuer vite,
     la liste pour relire une partie à la fois. La matrice est le défaut sur
     grand écran ; sous 760 px, blocDistribution() force la liste — une grille
     de vingt colonnes sur un téléphone n'est pas une lecture, c'est un
     labyrinthe. */
  affVue: 'matrice',
  /* Ce que colore la matrice : l'affectation (qui doit lire quoi) ou le
     retrait (qui a effectivement récupéré). Deux questions, deux moments de la
     production — on ne les mélange pas dans une seule couleur. */
  matriceMode: 'affectation',
  /* Les personnes cochées dans la colonne de gauche de la matrice. Un Set et
     non un tableau : on y teste l'appartenance à chaque case dessinée. */
  selection: new Set(),
  /* Le journal des retraits — partitions_telechargements. null tant qu'il n'a
     pas été lu : il compte une ligne par exemplaire sorti, soit la table la
     plus longue de la page, et l'écrasante majorité des ouvertures de cette
     page ne le regarde jamais. Lu au premier écran qui en a besoin, une seule
     fois ensuite. Voir chargerRetraits. */
  retraits: null,
  retraitsEnCours: false,
  // La partie qu'on tient pendant un glissé. Elle vit dans l'état et pas dans
  // le seul dataTransfer : Safari ne rend rien de dataTransfer pendant le
  // survol (seulement au lâcher), si bien qu'on ne pouvait pas savoir qu'un
  // glissé était en cours pour marquer la zone visée.
  partieGlissee: '',
  // Les prises d'exemplaires par des ensembles tiers — et elles seules, pas
  // le journal entier : les remises nominatives en représentent l'écrasante
  // majorité et ne s'affichent nulle part ici. Lu au premier écran qui en a
  // besoin ET qui a quelque chose à en dire, une seule fois ensuite.
  // Voir chargerJournalTiers.
  /* { parEnvoi: { <envoiId>: {nb, derniere} } }. PAS de total global : les
     deux écrans comptent ce qui les concerne — les transmissions d'un côté,
     les chœurs de l'autre —, et un nombre qui mêlerait les deux ne
     répondrait à la question d'aucun des deux. */
  prisesTiers: null,
  prisesTiersEnCours: false,
  // Le compte est-il « admin » ? La page entière est derrière requireAdminAuth
  // (toute l'équipe y entre) ; la SUPPRESSION d'un spectacle, elle, est
  // réservée aux comptes admin, comme le budget et les devis. Lu une fois au
  // chargement : le rôle ne change pas en cours de session.
  admin: false,
  /* La colonne `type` de partitions_envois est-elle absente de la base ?
     Ce n'est pas une coquetterie : sans elle, un lot de chœur s'enregistre
     comme une transmission à un ensemble tiers (db.js retire la colonne
     inconnue et réécrit), et « tout le spectacle » remettrait alors le
     matériel d'orchestre complet à une chorale. On préfère refuser la
     création et le dire. */
  typeAbsent: false,
  chargement: true,
};

/* ---------------------------------------------------------------------------
   LECTURES DÉRIVÉES
   --------------------------------------------------------------------------- */

const parId = (liste) => { const m = new Map(); (liste || []).forEach(x => m.set(x.id, x)); return m; };

function partiesDe(spectacleId){
  return state.parties.filter(p => p.spectacleId === spectacleId)
    .sort((a, b) => (a.ordre - b.ordre) || a.nom.localeCompare(b.nom, 'fr'));
}
function fichiersDe(partieId){
  return state.fichiers.filter(f => f.partieId === partieId)
    .sort((a, b) => (a.ordre - b.ordre) || a.titre.localeCompare(b.titre, 'fr'));
}
/* Les parties dont le RANG stocké ne correspond plus à ce que l'ordre du
   conducteur donnerait aujourd'hui.

   POURQUOI CE DÉCALAGE EXISTE. Le rang est figé à la création de la partie —
   c'est ce qui permet de le corriger à la main sans qu'un redépôt l'écrase.
   Mais quand la reconnaissance des noms s'améliore (elle vient d'apprendre
   l'anglais et l'italien, que les graveurs emploient), le matériel déjà rangé
   garde l'ancien classement : douze parties sur seize en fin de liste, là où
   l'ordre du conducteur est justement ce qui fait voir les trous.

   ON NE TOUCHE QUE LE RANG, JAMAIS LE PUPITRE. Les pupitres ont souvent été
   corrigés à la main, un par un ; les réécrire serait défaire ce travail au
   moment précis où l'on croit le compléter. */
function reclassement(spectacleId){
  const actuel = partiesDe(spectacleId);
  const vise = actuel.slice().sort((a, b) =>
    (partitionsOrdreDe(a.nom) - partitionsOrdreDe(b.nom))
    || String(a.nom).localeCompare(String(b.nom), 'fr'));
  /* ON COMPARE LA SUITE, PAS LES NUMÉROS. Quand la reconnaissance des noms
     s'enrichit, TOUS les rangs se décalent — et proposer de « remettre dans
     l'ordre » seize parties déjà dans l'ordre, pour ne changer que leurs
     numéros, c'est un bouton qui ment. On ne propose donc que si la liste se
     LIT différemment ; sinon il n'y a rien à faire, et on se tait. */
  const bougent = actuel.filter((p, i) => vise[i] && vise[i].id !== p.id);
  if(!bougent.length) return { bougent: [], aEcrire: [] };
  return {
    bougent: vise.filter((p, i) => actuel[i] && actuel[i].id !== p.id),
    aEcrire: actuel.filter(p => partitionsOrdreDe(p.nom) !== (Number(p.ordre) || 0)),
  };
}

async function remettreDansLOrdre(){
  const s = spectacleCourant();
  if(!s) return;
  const { bougent, aEcrire } = reclassement(s.id);
  if(!aEcrire.length) return;
  if(!confirm(`Remettre ${bougent.length} partie${bougent.length > 1 ? 's' : ''} à sa place dans l'ordre du conducteur ?\n\n`
    + bougent.slice(0, 8).map(p => '  · ' + p.nom).join('\n')
    + (bougent.length > 8 ? `\n  · … et ${bougent.length - 8} autre${bougent.length - 8 > 1 ? 's' : ''}` : '')
    + "\n\nSeul l'ordre d'affichage change. Les pupitres, les fichiers et les affectations ne bougent pas.")) return;
  aEcrire.forEach(p => { p.ordre = partitionsOrdreDe(p.nom); });
  rendre();
  for(const p of aEcrire){
    const res = await CurieuxDB.upsertOne('partitions_parties', p);
    if(res && res.error){
      alert("Le nouvel ordre est affiché mais n'a pas été entièrement enregistré : " + (res.error.message || 'échec'));
      return;
    }
  }
  try{ curieuxFlash('Matériel remis dans l\'ordre du conducteur.'); }catch(e){}
}

function poidsSpectacle(spectacleId){
  const ids = new Set(partiesDe(spectacleId).map(p => p.id));
  return state.fichiers.filter(f => ids.has(f.partieId)).reduce((s, f) => s + (f.octets || 0), 0);
}
const poidsTotal = () => state.fichiers.reduce((s, f) => s + (f.octets || 0), 0);

const spectacleCourant = () => state.spectacles.find(s => s.id === state.spectacleId) || null;
const nomSpectacle = (id) => (state.spectacles.find(s => s.id === id) || {}).nom || 'Spectacle supprimé';
const operationDe = (id) => state.tournees.find(t => t.id === id) || null;
const nomOperation = (id) => (operationDe(id) || {}).nom || 'Opération supprimée';

/* Les bornes d'une opération, lues dans ses dates. Elles servent à deux
   choses : dater une programmation dans une liste, et faire remonter ce qui
   n'est pas encore passé — une production travaille sur ce qui arrive. */
function bornesOperation(t){
  const dates = ((t || {}).dates || []).map(d => d.date).filter(Boolean).sort();
  return { debut: dates[0] || '', fin: dates[dates.length - 1] || '' };
}
function periodeOperation(t){ return libelleSerieDates((t || {}).dates || []); }

function trierOperations(liste){
  const auj = new Date().toISOString().slice(0, 10);
  const fin = (t) => bornesOperation(t).fin;
  const debut = (t) => bornesOperation(t).debut;
  const aVenir = liste.filter(t => fin(t) && fin(t) >= auj).sort((a, b) => debut(a).localeCompare(debut(b)));
  const sansDate = liste.filter(t => !fin(t)).sort((a, b) => (a.nom || '').localeCompare(b.nom || '', 'fr'));
  const passees = liste.filter(t => fin(t) && fin(t) < auj).sort((a, b) => fin(b).localeCompare(fin(a)));
  return [...aVenir, ...sansDate, ...passees];
}

/* LA PROGRAMMATION : « ce spectacle se joue sur cette opération ». C'est elle
   qui ouvre tout le reste — sans elle, le matériel se range et ne se distribue
   pas. On rend toujours les opérations RÉSOLUES, y compris celles dont la
   tournée a été supprimée depuis : une programmation orpheline doit se voir
   pour se retirer, pas disparaître en silence. */
function programmationsDe(spectacleId){
  const liste = state.programmations.filter(p => p.spectacleId === spectacleId);
  const rang = new Map(trierOperations(state.tournees).map((t, i) => [t.id, i]));
  return liste.sort((a, b) => (rang.has(a.tourneeId) ? rang.get(a.tourneeId) : 9e9)
                            - (rang.has(b.tourneeId) ? rang.get(b.tourneeId) : 9e9));
}
function operationsDe(spectacleId){
  return programmationsDe(spectacleId).map(p => {
    const t = operationDe(p.tourneeId);
    return {
      progId: p.id, tourneeId: p.tourneeId, tournee: t, supprimee: !t,
      nom: t ? t.nom : 'Opération supprimée',
      periode: t ? periodeOperation(t) : '',
      recording: estRecording(t),
    };
  });
}
function spectaclesDe(tourneeId){
  const ids = new Set(state.programmations.filter(p => p.tourneeId === tourneeId).map(p => p.spectacleId));
  return state.spectacles.filter(s => ids.has(s.id))
    .sort((a, b) => Number(a.archive) - Number(b.archive) || a.nom.localeCompare(b.nom, 'fr'));
}
const estProgramme = (spectacleId, tourneeId) =>
  state.programmations.some(p => p.spectacleId === spectacleId && p.tourneeId === tourneeId);

/* L'effectif RÉEL d'une opération : l'union des personnes affectées sur ses
   dates. C'est la seule source juste — voir la bannière de tête. Une personne
   qui ne joue qu'une date sur trois en fait partie : elle a besoin de sa
   partie autant que les autres. */
function effectifDe(tourneeId){
  const t = operationDe(tourneeId);
  if(!t) return [];
  const compte = new Map();
  (t.dates || []).forEach(d => {
    (d.musiciensAssignes || []).forEach(id => compte.set('musicien|' + id, (compte.get('musicien|' + id) || 0) + 1));
    (d.techniciensAssignes || []).forEach(id => compte.set('technicien|' + id, (compte.get('technicien|' + id) || 0) + 1));
  });
  const mus = parId(state.musiciens), tech = parId(state.techniciens);
  const out = [];
  compte.forEach((nbDates, cle) => {
    const [personType, personId] = cle.split('|');
    const p = (personType === 'musicien' ? mus : tech).get(personId);
    if(!p) return;   // une personne supprimée de l'annuaire depuis
    out.push({
      personType, personId, nbDates,
      nom: [p.prenom, p.nom].filter(Boolean).join(' ') || 'Sans nom',
      pupitre: p.pupitre || p.pole || '',
      instrument: p.instrument || p.poste || '',
    });
  });
  const rangPupitre = (x) => {
    const i = CURIEUX_PUPITRES.indexOf(x.pupitre);
    return i < 0 ? 99 : i;
  };
  return out.sort((a, b) => rangPupitre(a) - rangPupitre(b) || a.nom.localeCompare(b.nom, 'fr'));
}

function affectationsDe(tourneeId){
  return state.affectations.filter(a => a.tourneeId === tourneeId);
}
/* Les affectations d'UN spectacle sur UNE opération. Deux spectacles peuvent
   partager une opération — un concert narratif et son lever de rideau — et
   « qui lit quoi » ne se lit correctement que spectacle par spectacle. */
function affectationsDeSpectacle(spectacleId, tourneeId){
  const ids = new Set(partiesDe(spectacleId).map(p => p.id));
  return state.affectations.filter(a => a.tourneeId === tourneeId && ids.has(a.partieId));
}
const accesDe = (tourneeId) =>
  state.acces.find(a => a.id === tourneeId) || { id: tourneeId, code: '', actif: true, ouvertLe: '' };

/* Une partie porte-t-elle quelque chose ? C'est le test que la jauge segmentée
   applique à chaque segment, et la seule question qui vaille sur un écran de
   dépôt : une partie annoncée sans fichier est du matériel promis et absent. */
const aUnFichier = (p) => fichiersDe(p.id).length > 0;

/* L'effectif à AFFICHER pour une distribution : celui de l'opération, PLUS les
   personnes affectées qui n'y jouent aucune date. Les seconds sont une
   anomalie — un reste d'opération précédente, une date retirée depuis — et les
   masquer les rendrait indétectables tout en leur laissant les partitions dans
   leur espace.
   Quand un spectacle est donné, on ne remonte que SES affectations : sur une
   soirée à deux œuvres, les lecteurs de l'autre programme n'ont rien à faire
   dans cette matrice-ci. Sans spectacle — l'écran des retraits —, c'est
   l'opération entière qui est en question. */
function effectifAffichable(tourneeId, spectacleId){
  const base = effectifDe(tourneeId);
  const connues = new Set(base.map(e => e.personType + '|' + e.personId));
  const mus = parId(state.musiciens), tech = parId(state.techniciens);
  const source = spectacleId ? affectationsDeSpectacle(spectacleId, tourneeId) : affectationsDe(tourneeId);
  source.forEach(a => {
    const cle = a.personType + '|' + a.personId;
    if(connues.has(cle)) return;
    connues.add(cle);
    const p = (a.personType === 'musicien' ? mus : tech).get(a.personId);
    base.push({
      personType: a.personType, personId: a.personId, nbDates: 0,
      nom: p ? ([p.prenom, p.nom].filter(Boolean).join(' ') || 'Sans nom') : 'Personne supprimée',
      pupitre: p ? (p.pupitre || p.pole || '') : '', instrument: p ? (p.instrument || p.poste || '') : '',
      horsEffectif: true,
    });
  });
  return base.sort((a, b) => partitionsRangPupitre(a.pupitre) - partitionsRangPupitre(b.pupitre)
                          || a.nom.localeCompare(b.nom, 'fr'));
}

/* ---------------------------------------------------------------------------
   LE JOURNAL DES RETRAITS
   ---------------------------------------------------------------------------
   partitions_telechargements se remplit à chaque téléchargement depuis
   /api/partition — une ligne par exemplaire sorti, avec le nom de qui l'a
   pris. La table existait, le filigrane s'y appuyait, et aucun écran de
   production ne la montrait : on avait la preuve sans jamais pouvoir la lire.
   C'est pourtant la seule réponse à la question qu'on se pose la veille de la
   première : qui n'a pas encore sa partie ?

   LECTURE SEULE — c'est l'API qui écrit, et un journal ne se corrige pas.

   Le journal fige les libellés au moment du téléchargement (voir
   migrations.sql) : on n'y rejoint donc RIEN par nom, seulement par
   identifiant. Une personne renommée depuis garde ses retraits ; c'est le
   propre d'un journal.
   --------------------------------------------------------------------------- */

/* Lu à la demande, et une seule fois. C'est la table la plus longue de la page
   — une ligne par exemplaire, par personne, par opération — et ouvrir un
   spectacle pour y déposer trois PDF n'a aucune raison de la traîner. */
function chargerRetraits(){
  if(state.retraits !== null || state.retraitsEnCours) return;
  state.retraitsEnCours = true;
  CurieuxDB.fetchAll('partitions_telechargements')
    .catch(()=> [])
    .then(lignes => {
      state.retraits = lignes || [];
      state.retraitsEnCours = false;
      rendreQuandLaSaisieEstFinie();
    });
}

function retraitsDe(tourneeId){
  return (state.retraits || []).filter(r => r.tourneeId === tourneeId);
}

/* Ce que chaque personne a déjà sorti, pour une opération : un ensemble d'ids
   de fichiers. On raisonne en FICHIERS et pas en parties — une partie qui gagne
   un « erratum » trois semaines avant le concert n'est pas récupérée tant que
   le second fichier n'est pas sorti, et c'est précisément ce qu'on veut voir. */
function retraitsParPersonne(tourneeId){
  const m = new Map();
  retraitsDe(tourneeId).forEach(r => {
    const cle = r.personType + '|' + r.personId;
    if(!m.has(cle)) m.set(cle, new Set());
    m.get(cle).add(r.fichierId);
  });
  return m;
}

/* Les fichiers qu'une personne doit avoir, d'après ses affectations sur
   l'opération — toutes parties confondues, y compris celles d'un autre
   spectacle : la question « a-t-elle sa musique ? » ne se pose pas par
   spectacle mais par opération. */
function fichiersDus(tourneeId, personType, personId){
  const ids = [];
  affectationsDe(tourneeId)
    .filter(a => a.personType === personType && a.personId === personId)
    .forEach(a => fichiersDe(a.partieId).forEach(f => ids.push(f.id)));
  return ids;
}

function quandCourt(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return '';
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })
       + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

/* Sous 760 px, la matrice se replie en liste. Le seuil est celui de base.css :
   une grille de vingt colonnes sur un téléphone n'est pas une lecture. */
function mediaPetitEcran(){
  return typeof matchMedia === 'function' && matchMedia('(max-width:760px)').matches;
}

/* ---------------------------------------------------------------------------
   CHARGEMENT
   --------------------------------------------------------------------------- */

async function charger(){
  const [spectacles, programmations, parties, fichiers, affectations, acces, envois,
         tournees, musiciens, techniciens, migrationAbsente, envoisAbsents, typeAbsent, admin] = await Promise.all([
    CurieuxDB.fetchAll('partitions_spectacles').catch(()=> []),
    CurieuxDB.fetchAll('partitions_programmations').catch(()=> []),
    CurieuxDB.fetchAll('partitions_parties').catch(()=> []),
    CurieuxDB.fetchAll('partitions_fichiers').catch(()=> []),
    CurieuxDB.fetchAll('partitions_affectations').catch(()=> []),
    CurieuxDB.fetchAll('partitions_acces').catch(()=> []),
    CurieuxDB.fetchAll('partitions_envois').catch(()=> []),
    CurieuxDB.fetchAll('tournees').catch(()=> []),
    CurieuxDB.fetchAll('musiciens').catch(()=> []),
    CurieuxDB.fetchAll('techniciens').catch(()=> []),
    CurieuxDB.tableManquante('partitions_programmations').catch(()=> false),
    CurieuxDB.tableManquante('partitions_envois').catch(()=> false),
    CurieuxDB.colonneManquante('partitions_envois', 'type,dates').catch(()=> false),
    CurieuxDB.isSuperAdmin().catch(()=> false),
  ]);
  Object.assign(state, { spectacles, programmations, parties, fichiers, affectations, acces, envois,
                         tournees, musiciens, techniciens, admin, typeAbsent, chargement: false });
  // Une liste vide se lit « rien n'est programmé » ; la vérité peut être « la
  // migration n'est pas jouée ». Ce n'est pas la même chose à faire ensuite —
  // et deux migrations peuvent manquer, sans les mêmes conséquences : on nomme
  // celle qui manque plutôt que d'afficher le texte de l'autre.
  poserBandeauMigration(migrationAbsente, envoisAbsents, typeAbsent && !envoisAbsents);

  const url = new URLSearchParams(location.search);
  const spectacle = url.get('spectacle') || '';
  const operation = url.get('operation') || '';
  if(operation) state.tourneeId = operation;
  // Les anciens noms de vue restent valides : des liens et des signets les
  // portent, et ils ne doivent pas atterrir sur un écran au hasard.
  const LEGACY = { bibliotheque: 'spectacles', affectation: 'operations' };
  const vue = url.get('vue');
  if(vue) state.vue = LEGACY[vue] || vue;
  if(spectacle && state.spectacles.some(s => s.id === spectacle)){ ouvrirSpectacle(spectacle, operation); return; }
  /* Une vue demandée gagne toujours ; une opération SANS vue ouvre son écran.
     L'ancienne règle forçait « Par opération » dès qu'une opération
     accompagnait une vue, si bien qu'un lien ?vue=transmissions&operation=…
     atterrissait ailleurs sans rien dire — et qu'un ?operation=… seul restait
     sur la liste des spectacles, avec l'opération retenue mais invisible,
     c'est-à-dire nulle part. */
  if(!vue && operation) state.vue = 'operations';
  rendre();
}

/* Une liste vide se lit « il n'y a rien » ; la vérité peut être « la migration
   n'est pas jouée ». Deux tables peuvent manquer, et pas avec les mêmes
   conséquences : le bandeau nomme celle qui manque et ce qu'elle empêche.
   Afficher le texte de l'une pendant que l'autre manque enverrait jouer le
   mauvais bloc de migrations.sql. */
function poserBandeauMigration(programmationsAbsentes, envoisAbsents, choeurAbsent){
  const manques = [];
  if(programmationsAbsentes) manques.push(`La table <code>partitions_programmations</code> n'existe pas encore dans Supabase :
    aucun spectacle ne peut être rattaché à une opération, et le matériel déjà rangé s'affiche donc comme non distribué.
    Colle le bloc <b>LA PROGRAMMATION D'UN SPECTACLE SUR UNE OPÉRATION</b> de <code>migrations.sql</code> dans l'éditeur SQL.`);
  if(envoisAbsents) manques.push(`La table <code>partitions_envois</code> n'existe pas encore dans Supabase :
    aucun lot ne peut être confié à un ensemble tiers, et un lien créé ici ne serait enregistré nulle part.
    Colle le bloc <b>LA TRANSMISSION À UN TIERS</b> de <code>migrations.sql</code> dans l'éditeur SQL.`);
  /* La colonne manque, mais la table est là : le bloc précédent a été joué,
     celui du chœur non. On ne dit donc pas « la table n'existe pas » — ce
     serait envoyer rejouer le mauvais bloc — et on nomme ce que ça empêche
     VRAIMENT : un lot de chœur enregistré sans son type redeviendrait une
     transmission à un ensemble tiers, qui emporte tout le matériel. */
  if(choeurAbsent) manques.push(`La table <code>partitions_envois</code> n'a pas encore les colonnes de l'espace du chœur
    (<code>type</code>, <code>dates</code>) : cet espace est en lecture seule, et aucun lot de chœur ne peut être créé —
    il s'enregistrerait comme une transmission ordinaire, donc avec le matériel d'orchestre complet, et sans les dates chantées.
    Colle le bloc <b>L'ESPACE DU CHŒUR</b> de <code>migrations.sql</code> dans l'éditeur SQL — il se rejoue sans risque s'il l'a déjà été.`);
  const banniere = document.getElementById('migrationBanner');
  banniere.hidden = !manques.length;
  if(manques.length){
    // Un paragraphe par migration manquante, plus la marche à suivre. Le
    // conteneur est un <div> et non un <p> : un <p> imbriqué dans un <p> est
    // refermé d'office par l'analyseur du navigateur, qui rendait un
    // paragraphe vide et collait les deux textes l'un contre l'autre.
    document.getElementById('migrationTexte').innerHTML =
      manques.map(m => `<p>${m}</p>`).join('') + '<p>Puis recharge cette page.</p>';
  }
}

/* ---------------------------------------------------------------------------
   RENDU
   --------------------------------------------------------------------------- */

function rendre(){
  const onglet = state.vue === 'operations' ? 'operations'
               : state.vue === 'retraits' ? 'retraits'
               : state.vue === 'choeurs' ? 'choeurs'
               : state.vue === 'transmissions' ? 'transmissions' : 'spectacles';
  document.querySelectorAll('[data-vue]').forEach(b => b.classList.toggle('primary', b.dataset.vue === onglet));
  const el = document.getElementById('page');
  if(state.chargement){ el.innerHTML = '<div class="co-card co-pad vide">Chargement…</div>'; return; }
  /* Le défilement de la matrice survit au redessin. Sans cela, cocher une case
     au bout de la vingtième colonne ramenait la page au premier violon : on
     perdait le fil à chaque clic, sur l'écran où l'on en fait le plus. */
  const cadre = el.querySelector('.co-matrix');
  const place = cadre ? { x: cadre.scrollLeft, y: cadre.scrollTop } : null;

  el.innerHTML = state.vue === 'operations' ? vueOperations()
               : state.vue === 'depot' ? vueDepot()
               : state.vue === 'retraits' ? vueRetraits()
               : state.vue === 'choeurs' ? vueChoeurs()
               : state.vue === 'transmissions' ? vueTransmissions()
               : state.vue === 'spectacle' ? vueSpectacle()
               : vueSpectacles();
  cablerVue();

  if(place){
    const neuf = el.querySelector('.co-matrix');
    if(neuf){ neuf.scrollLeft = place.x; neuf.scrollTop = place.y; }
  }
}

function optionsOperations(selectionne, exclure){
  const exclus = new Set(exclure || []);
  return trierOperations(state.tournees.filter(t => !exclus.has(t.id))).map(t => {
    const p = periodeOperation(t);
    return `<option value="${escapeAttr(t.id)}"${t.id === selectionne ? ' selected' : ''}>`
      + `${escapeHtml(t.nom || 'Sans nom')}${estRecording(t) ? ' · Recording' : ''}${p ? ' · ' + escapeHtml(p) : ''}</option>`;
  }).join('');
}

/* --- VUE 1 : LA LISTE DES SPECTACLES -------------------------------------- */

/* Les cinq teintes de la charte, qui tournent d'une carte à l'autre : deux
   voisines ne portent jamais la même, et la grille se relit à l'emplacement.
   Ce sont les couleurs de .co-stats-charte dans base.css ; elles sont reprises
   ici en clair parce qu'une pastille les choisit au rang du spectacle, pas au
   rang de l'élément dans sa grille. */
const SPEC_TEINTES = [['#791649', '#FCF2F0'], ['#CEE1F4', '#791649'], ['#141617', '#FCF2F0'],
                      ['#FEC9E0', '#791649'], ['#EC4B15', '#FCF2F0']];

/* La carte d'un spectacle. Ce qu'on y lit sans cliquer : son nom, les
   opérations sur lesquelles il se joue, la complétude de son matériel (la
   jauge segmentée), sa composition par pupitre, son poids et son état. Six
   informations dans un regard ; en ligne de tableau, elles demandaient six
   lectures successives.

   C'est un <button> : il ne contient donc que du contenu de phrase — des
   <span>, jamais un <div>. partitionsJaugeHtml rend un <span> pour cette
   raison. */
function carteSpectacle(s, index){
  const parties = partiesDe(s.id);
  const ids = new Set(parties.map(p => p.id));
  const nbFichiers = state.fichiers.filter(f => ids.has(f.partieId)).length;
  const vides = parties.filter(p => !aUnFichier(p)).length;
  const opes = operationsDe(s.id);

  const groupes = partitionsGrouperParPupitre(parties);
  const pastilles = groupes.map(g =>
    partitionsPupitreHtml(g.pupitre, {
      texte: g.pupitre + ' ' + g.parties.length,
      titre: g.parties.map(p => p.nom).join(', '),
    })).join('');

  /* L'état en un mot, et il porte le seul verdict qui déclenche une action.
     « vide » n'est pas une alerte : un spectacle qu'on vient de créer est vide
     par construction. */
  const etat = !parties.length ? '<span class="co-chip">vide</span>'
             : vides ? `<span class="co-chip ko">${vides} sans fichier</span>`
             : '<span class="co-chip ok">complet</span>';

  /* Les opérations : c'est la règle de main, et elle se lit ici ou nulle part.
     Le matériel appartient au spectacle, mais il ne se distribue qu'au titre
     d'une opération — un spectacle qui n'en porte aucune est rangé et muet. */
  const pastillesOpes = opes.length
    ? opes.map(o => `<span class="ope"${o.supprimee ? ' style="border-color:var(--ko);color:var(--ko)"' : ''} title="${escapeAttr(o.nom + (o.periode ? ' · ' + o.periode : ''))}">${escapeHtml(o.nom)}</span>`).join('')
    : '<span class="ope vide">Aucune opération — ce matériel ne se distribue pas</span>';

  const [fond, encre] = SPEC_TEINTES[index % SPEC_TEINTES.length];

  return `
    <button type="button" class="spec-carte${s.archive ? ' archive' : ''}" data-ouvrir="${escapeAttr(s.id)}">
      <span class="spec-tete">
        <span class="co-badge co-badge-sm" aria-hidden="true"
              style="--co-tilt:${index % 2 ? '4deg' : '-5deg'}; background:${fond}; color:${encre};">${escapeHtml(partitionsInitiales(s.nom))}</span>
        <span style="min-width:0">
          <span class="spec-nom">${escapeHtml(s.nom || 'Sans nom')}</span>
          <span class="spec-auteur">${escapeHtml([s.compositeur, s.arrangeur && 'arr. ' + s.arrangeur].filter(Boolean).join(' · ')) || 'Aucun auteur renseigné'}${s.archive ? ' — archivé' : ''}</span>
        </span>
      </span>
      ${parties.length ? partitionsJaugeHtml(parties, aUnFichier) : ''}
      ${pastilles ? `<span class="spec-pups">${pastilles}</span>` : ''}
      <span class="opes">${pastillesOpes}</span>
      <span class="spec-pied">
        <span>${parties.length} partie${parties.length > 1 ? 's' : ''} · ${nbFichiers} fichier${nbFichiers > 1 ? 's' : ''} · ${partitionsPoids(poidsSpectacle(s.id))}</span>
        ${etat}
      </span>
    </button>`;
}

function vueSpectacles(){
  const total = poidsTotal();
  const part = Math.min(1, total / PLAFOND_STOCKAGE);
  const chaud = part > 0.8;
  const servies = new Set(state.affectations.map(a => a.personType + '|' + a.personId)).size;
  const orphelins = state.spectacles.filter(s => !s.archive && !programmationsDe(s.id).length);
  // Les parties annoncées sans aucun fichier, tous spectacles confondus. C'est
  // le chiffre qui manquait en tête : le poids rangé disait ce qu'on avait, et
  // rien ne disait ce qu'on attendait encore.
  const vides = state.parties.filter(p => !aUnFichier(p));

  const liste = state.spectacles.slice()
    .sort((a, b) => Number(a.archive) - Number(b.archive) || a.nom.localeCompare(b.nom, 'fr'));

  return `
    <div class="chiffres">
      <div class="chiffre">
        <b>${state.spectacles.length}</b><span>spectacle${state.spectacles.length > 1 ? 's' : ''}</span>
        <small>${state.parties.length} partie${state.parties.length > 1 ? 's' : ''}, ${state.fichiers.length} fichier${state.fichiers.length > 1 ? 's' : ''}</small>
      </div>
      <div class="chiffre${vides.length ? ' alerte' : ''}">
        <b>${vides.length}</b><span>partie${vides.length > 1 ? 's' : ''} sans fichier</span>
        <small>${vides.length ? escapeHtml(vides.slice(0, 3).map(p => p.nom).join(', ')) + (vides.length > 3 ? '…' : '')
                              : 'Tout le matériel annoncé est déposé'}</small>
      </div>
      <div class="chiffre${chaud ? ' alerte' : ''}">
        <b>${partitionsPoids(total)}</b><span>de matériel rangé</span>
        <div class="jauge${chaud ? ' alerte' : ''}"><i style="width:${(part * 100).toFixed(1)}%"></i></div>
        <small>sur 1 Go — soit une vingtaine de programmes à parties fusionnées</small>
      </div>
      <div class="chiffre">
        <b>${servies}</b><span>personnes servies</span>
        <small>${state.affectations.length} affectation(s) sur ${new Set(state.programmations.map(p => p.tourneeId)).size} opération(s)</small>
      </div>
    </div>
    <section class="bloc">
      <h2>Spectacles <span class="h2-total"><button type="button" class="co-btn sm primary" id="btnNouveauSpectacle">Nouveau spectacle</button></span></h2>
      ${orphelins.length ? `<p class="vide sans-lecteur">${orphelins.length} spectacle${orphelins.length > 1 ? 's ne sont rattachés' : ' n\'est rattaché'} à aucune opération : ${escapeHtml(orphelins.slice(0, 4).map(s => s.nom).join(', '))}${orphelins.length > 4 ? '…' : ''}. Tant qu'ils n'en ont pas, personne ne peut recevoir leurs parties.</p>` : ''}
      ${liste.length
        ? `<div class="spec-grille">${liste.map(carteSpectacle).join('')}</div>`
        : '<p class="vide">Aucun spectacle. Commence par en créer un : on lui donne son nom, l\'opération sur laquelle il se joue, et on y range ensuite ses parties et ses musiciens.</p>'}
    </section>`;
}

/* --- VUE 2 : L'ATELIER D'UN SPECTACLE ------------------------------------- */

function vueSpectacle(){
  const s = spectacleCourant();
  if(!s) return '<div class="co-card co-pad vide">Ce spectacle n\'existe plus. <button type="button" class="co-btn sm" id="btnRetourListe">Revenir à la liste</button></div>';
  return blocFil(s) + blocOperations(s) + blocMateriel(s) + blocDistribution(s)
       + blocChoeur(s) + blocTransmissions(s) + blocReglages(s);
}

function blocFil(s){
  return `
    <div class="fil">
      <button type="button" class="co-btn ghost sm" id="btnRetourListe">← Tous les spectacles</button>
      <b>${escapeHtml(s.nom || 'Sans nom')}</b>
      <span>${escapeHtml([s.compositeur, s.arrangeur && 'arr. ' + s.arrangeur].filter(Boolean).join(' · '))}</span>
      ${s.archive ? '<span class="ope">archivé</span>' : ''}
      <span style="margin-left:auto"><button type="button" class="co-btn ghost sm" id="btnModifierSpectacle">Modifier la fiche</button></span>
    </div>`;
}

/* Bloc 1 — LES OPÉRATIONS. C'est le premier bloc parce que c'est la première
   décision : ce matériel, pour quoi ? Tant qu'il n'y en a aucune, la
   distribution plus bas n'a rien à montrer, et on le dit plutôt que d'afficher
   un écran vide. */
function blocOperations(s){
  const opes = operationsDe(s.id);
  const lignes = opes.map(o => {
    const aff = affectationsDeSpectacle(s.id, o.tourneeId);
    const effectif = effectifDe(o.tourneeId);
    const servies = new Set(aff.map(a => a.personType + '|' + a.personId)).size;
    const acces = accesDe(o.tourneeId);
    const etat = o.supprimee ? 'Cette opération a été supprimée — à retirer'
      : !aff.length ? 'Rien de distribué sur cette opération'
      : `${servies} personne${servies > 1 ? 's servies' : ' servie'} sur ${effectif.length} à l'affiche`;
    return `
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(o.nom)}${o.recording ? ' <em style="font-weight:400;color:var(--muted)">· Recording</em>' : ''}</span>
          <span class="l-sous${o.supprimee || !aff.length ? ' sans-lecteur' : ''}">${escapeHtml(o.periode || 'Aucune date')} — ${escapeHtml(etat)}</span>
          <span class="l-sous">Code d'accès : <b>${escapeHtml(acces.code || 'aucun')}</b>${acces.ouvertLe ? ' · ouvert à partir du ' + escapeHtml(acces.ouvertLe) : ''}</span>
        </span>
        <button type="button" class="co-btn sm${o.tourneeId === state.tourneeId ? ' primary' : ''}" data-distribuer="${escapeAttr(o.tourneeId)}">Distribuer</button>
        <button type="button" class="co-btn ghost sm" data-deprogrammer="${escapeAttr(o.progId)}">Retirer</button>
      </div>`;
  }).join('');

  const restantes = state.tournees.filter(t => !estProgramme(s.id, t.id));

  return `
    <section class="bloc">
      <h2>Opérations sur lesquelles ce spectacle se joue</h2>
      ${lignes || '<p class="vide sans-lecteur">Ce spectacle n\'est rattaché à aucune opération. Son matériel se range, mais personne ne peut le recevoir : une partition ne se distribue qu\'au titre d\'une opération.</p>'}
      ${restantes.length ? `
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) 280px">
        <span class="l-nom">
          <span class="l-titre">Programmer sur une autre opération</span>
          <span class="l-sous">Le matériel ne se redépose pas : une reprise coûte un clic, pas un octet.</span>
        </span>
        <select class="co-select" id="selProgrammer">
          <option value="">— choisir une opération —</option>
          ${optionsOperations('', state.programmations.filter(p => p.spectacleId === s.id).map(p => p.tourneeId))}
        </select>
      </div>` : ''}
    </section>`;
}

/* Bloc 2 — LE MATÉRIEL. Les parties du spectacle et leurs fichiers, groupés
   par pupitre. Une partie est une TUILE et non une ligne : la tuile porte son
   nom en tête, ses fichiers en dessous, et son manque en rouge tireté.
   Quarante lignes identiques deviennent six blocs colorés dont un seul, en
   général, demande quelque chose.

   ET LA TUILE SE DÉPLACE. Le pupitre est DEVINÉ du nom de fichier, donc il se
   trompe : un jeu sorti de Dorico en anglais, un intitulé maison, une partie
   double qui relève de deux familles. Jusqu'ici l'erreur était définitive à
   l'écran — il fallait retirer la partie, donc ses fichiers, et redéposer.
   On la corrige maintenant d'un glissé, et la correction vaut aussitôt pour
   l'espace du musicien, qui lit le même pupitre.

   Le glisser-déposer ne marche pas au doigt : sur tablette, le nom de la
   partie est un bouton qui ouvre sa fiche, où le pupitre se choisit dans une
   liste. Le même geste, sans la souris. */
function blocMateriel(s){
  const parties = partiesDe(s.id);
  const groupes = partitionsGrouperParPupitre(parties);
  const manquantes = parties.filter(p => !aUnFichier(p)).length;
  /* Deux commandes voisines et deux gestes différents, qu'il ne faut pas
     confondre : `aReclasser` corrige le PUPITRE d'une partie mal lue (« Oboe »
     rangé dans Autre), `aReordonner` corrige sa PLACE dans l'ordre du
     conducteur. On peut avoir l'un sans l'autre. */
  const aReordonner = reclassement(s.id).bougent;

  const tuile = (p, encre) => {
    const fs = fichiersDe(p.id);
    const poids = fs.reduce((acc, f) => acc + (f.octets || 0), 0);
    /* Le titre d'un fichier n'est écrit que s'il apporte quelque chose. Une
       partie qui ne porte qu'un fichier nommé comme elle donnait « Violon 1 /
       Violon 1 · 391 Ko », où l'on relit deux fois la même chose avant de
       trouver le poids. Même règle que côté musicien (mes-dates-vue.js). */
    const nomUtile = (f) => fs.length > 1
      || partitionsNormaliser(f.titre || '') !== partitionsNormaliser(p.nom);
    /* UNE SEULE CROIX QUAND IL N'Y A QU'UN FICHIER. Deux croix identiques
       l'une au-dessus de l'autre — l'une retirant la partie, l'autre son
       unique fichier — n'ont pas de sens lisible : on vise l'une et on
       déclenche l'autre. Avec un seul fichier, la croix de la partie suffit,
       et son ruban d'annulation dit bien qu'elle emporte le fichier. La
       croix par fichier ne revient que là où elle sert : à partir de deux. */
    const corps = fs.length
      ? fs.map(f => `<span class="part-fic">
           ${nomUtile(f) ? `<span class="nom" title="${escapeAttr(f.nomOrigine || f.titre)}">${escapeHtml(f.titre || f.nomOrigine)}</span>` : '<span class="nom"></span>'}
           <span>${partitionsPoids(f.octets)}${f.pages ? ' · ' + f.pages + ' p.' : ''}</span>
           ${fs.length > 1 ? `<button type="button" class="part-x" data-retirer-fichier="${escapeAttr(f.id)}"
                   title="Retirer ce fichier" aria-label="Retirer le fichier ${escapeAttr(f.titre || f.nomOrigine)}">×</button>` : ''}
         </span>`).join('')
      : '<span class="part-manque">Aucun fichier déposé</span>';
    /* Une tuile vide porte le rouge sur ses quatre côtés : sa teinte de
       pupitre n'est plus l'information du moment, son manque l'est. */
    return `
      <div class="part-tuile${fs.length ? '' : ' sans-fichier'}" draggable="true"
           data-partie="${escapeAttr(p.id)}" style="border-left-color:${fs.length ? encre : 'var(--ko)'}">
        <span class="part-nom">
          <button type="button" class="part-titre" data-modifier-partie="${escapeAttr(p.id)}"
                  title="Modifier le nom ou le pupitre de cette partie">${escapeHtml(p.nom)}</button>
          <button type="button" class="part-x" data-retirer-partie="${escapeAttr(p.id)}"
                  title="Retirer cette partie" aria-label="Retirer la partie ${escapeAttr(p.nom)}">×</button>
        </span>
        ${(()=>{
          /* La tonalité se lit ICI aussi, et pas seulement dans le bloc du
             chœur : c'est dans le matériel qu'on relit le spectacle en entier,
             et une voix sans ton s'y repère au même titre qu'une partie sans
             fichier. Elle est vide partout ailleurs — l'orchestre n'en porte
             pas. */
          const ton = partitionsTonalite(p.tonalite);
          const gauche = fs.length > 1 ? `${fs.length} fichiers · ${partitionsPoids(poids)}` : '';
          const droite = ton ? (gauche ? ' · ' : '') + ton : '';
          return gauche || droite ? `<span class="part-meta">${escapeHtml(gauche)}${escapeHtml(droite)}</span>` : '';
        })()}
        ${corps}
      </div>`;
  };

  const sections = groupes.map(g => {
    const teinte = partitionsPupitreVar(g.pupitre);
    const encre = partitionsPupitreVar(g.pupitre, true);
    const vides = g.parties.filter(p => !aUnFichier(p)).length;
    return `
      <div class="pup-groupe" data-pup-cible="${escapeAttr(g.pupitre)}">
        <div class="pup-bandeau" style="color:${encre}">
          ${escapeHtml(g.pupitre)}
          <span class="trait" style="background:${teinte}"></span>
          <span class="compte">${g.parties.length} partie${g.parties.length > 1 ? 's' : ''}${vides ? ' · ' + vides + ' sans fichier' : ''}</span>
        </div>
        <div class="part-grille">${g.parties.map(p => tuile(p, encre)).join('')}</div>
      </div>`;
  }).join('');

  /* Les pupitres que ce spectacle n'emploie pas. Ils n'ont rien à faire à
     l'écran — une section « Chant » vide au milieu d'un programme symphonique
     est du bruit — mais il faut bien pouvoir y déposer quelque chose. Ils
     n'apparaissent donc QUE pendant un glissé, et disparaissent avec lui. */
  const presents = new Set(groupes.map(g => g.pupitre));
  const absents = parties.length
    ? PARTITIONS_PUPITRE_ORDRE.filter(pup => !presents.has(pup)).map(pup => `
      <div class="pup-groupe pup-vide" data-pup-cible="${escapeAttr(pup)}">
        <div class="pup-bandeau" style="color:${partitionsPupitreVar(pup, true)}">
          ${escapeHtml(pup)}
          <span class="trait" style="background:${partitionsPupitreVar(pup)}"></span>
        </div>
        <div class="part-grille"><div class="pup-accueil">Déposer une partie ici</div></div>
      </div>`).join('')
    : '';

  /* Ce que la détection dirait AUJOURD'HUI, comparé à ce qui est rangé. Le
     bouton n'apparaît que s'il y a un écart : un matériel bien classé n'a pas
     à porter une commande qui ne ferait rien. */
  const aReclasser = ecartsDePupitre(parties);

  return `
    <section class="bloc">
      <h2>Matériel
        <span class="h2-total">
          <button type="button" class="co-btn sm primary" id="btnDeposer">Déposer des fichiers</button>
          <button type="button" class="co-btn sm ghost" id="btnNouvellePartie">Ajouter une partie</button>
          ${aReclasser.length ? `<button type="button" class="co-btn sm ghost" id="btnReclasser">Reclasser ${aReclasser.length} partie${aReclasser.length > 1 ? 's' : ''}…</button>` : ''}
          ${aReordonner.length ? `<button type="button" class="co-btn sm ghost" id="btnReordonner"
            title="${escapeAttr(aReordonner.length + ' partie' + (aReordonner.length > 1 ? 's ne sont' : ' n\'est') + ' pas à sa place dans l\'ordre du conducteur. Les pupitres ne bougent pas.')}">Remettre dans l'ordre (${aReordonner.length})</button>` : ''}
        </span>
      </h2>
      ${parties.length ? partitionsJaugeHtml(parties, aUnFichier) : ''}
      ${manquantes ? `<p class="vide sans-lecteur">${manquantes} partie${manquantes > 1 ? 's sont annoncées' : ' est annoncée'} sans aucun fichier déposé — ${manquantes > 1 ? 'elles sont' : 'elle est'} en rouge ci-dessous.</p>` : ''}
      ${parties.length ? '<p class="vide" style="padding:2px 0 0">Glisse une tuile d\'un pupitre à l\'autre pour la reclasser. Au doigt, ouvre son nom : le pupitre s\'y choisit dans une liste.</p>' : ''}
      ${sections || '<p class="vide">Rien de rangé. Dépose les PDF : la page lit leur nom et propose la partie de chacun.</p>'}
      ${absents}
      <div class="depot-zone compacte" id="zoneDepotRapide" style="margin-top:14px">
        <b>Glisse des PDF ici</b>
        Ils rejoignent l'écran de dépôt, déjà appariés à leur partie.
        <input type="file" id="inpFichiersRapide" accept="application/pdf,.pdf" multiple hidden>
      </div>
    </section>`;
}

/* Les parties dont le pupitre RANGÉ diffère de celui que la détection donne
   aujourd'hui. C'est la question qui se pose après coup : la détection a
   appris des noms qu'elle ne connaissait pas — l'anglais de Dorico, par
   exemple —, et le matériel déjà déposé garde pourtant le classement de son
