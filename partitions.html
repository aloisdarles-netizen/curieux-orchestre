<link rel="stylesheet" href="assets/base.css">
<style>
  /* ==========================================================================
     LA CHARTE DE LA PAGE BUDGET, et pas une autre.
     Une carte blanche par section, son titre en petites capitales, ses lignes
     séparées d'un filet. Les classes reprennent celles de budget.html et
     suivi.html pour que les trois pages bougent ensemble le jour où la charte
     bouge.
     ========================================================================== */
  .wrap{max-width:min(1180px, 97vw); margin:0 auto;}

  .chiffres{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px; margin-bottom:18px;}
  .chiffre{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;}
  .chiffre b{
    display:block; font-family:var(--font-display); font-size:28px; font-weight:500; color:var(--accent);
    line-height:1.1; font-variant-numeric:tabular-nums;
  }
  .chiffre span{font-size:12.5px; color:var(--muted); font-weight:600;}
  .chiffre small{display:block; font-size:11.5px; color:var(--muted); margin-top:4px; line-height:1.4;}
  .chiffre.alerte b{color:var(--ko);}

  .bloc{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px;}
  .bloc + .bloc{margin-top:14px;}
  .bloc h2{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:800; margin:0 0 8px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  }
  .bloc h2 .h2-total{margin-left:auto; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:0;}

  .ligne{
    display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .ligne:last-child{border-bottom:none;}
  .l-nom{min-width:0;}
  .l-titre{font-weight:700; font-size:13.5px; display:block;}
  .l-sous{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:1px; line-height:1.4;}
  .l-num{text-align:right; font-variant-numeric:tabular-nums; font-size:13px; font-weight:800; white-space:nowrap; color:var(--muted);}

  .vide{font-size:13px; color:var(--muted); padding:10px 0; line-height:1.6;}

  /* La jauge de stockage. Le plan Supabase est à 1 Go : à 1,7 Mo la partie
     fusionnée, c'est une vingtaine de programmes. On ne la cache pas dans un
     écran d'administration — elle se lit là où on dépose. */
  .jauge{height:6px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:8px;}
  .jauge i{display:block; height:100%; background:var(--accent); border-radius:999px;}
  .jauge.alerte i{background:var(--ko);}

  /* Les pastilles de sûreté d'appariement. Trois états, trois lectures : ce qui
     est sûr se survole, ce qui ne l'est pas se lit. */
  .sur{
    display:inline-block; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
  }
  .sur.exacte{background:var(--ok-tint); color:var(--ok);}
  .sur.probable{background:var(--maybe-tint); color:var(--maybe);}
  .sur.incertaine, .sur.aucune{background:var(--ko-tint); color:var(--ko);}

  .depot-zone{
    border:2px dashed var(--border); border-radius:var(--radius); padding:26px 18px; text-align:center;
    color:var(--muted); font-size:13.5px; line-height:1.6; cursor:pointer; transition:border-color .12s, background .12s;
  }
  .depot-zone:hover, .depot-zone.survol{border-color:var(--accent); background:var(--champagne);}
  .depot-zone b{display:block; color:var(--text); font-size:15px; margin-bottom:4px;}

  .dep-ligne{
    display:grid; grid-template-columns:minmax(0,1fr) 210px auto; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .dep-ligne:last-child{border-bottom:none;}
  .dep-ligne.aRegler{background:var(--ko-tint); margin:0 -18px; padding:9px 18px;}

  /* Les lecteurs d'une partie : des jetons qu'on retire d'un clic. C'est la
     seule forme qui tienne quand une partie est lue par huit personnes et la
     suivante par une seule. */
  .lecteurs{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .lecteur{
    display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600;
    background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:3px 6px 3px 10px;
  }
  .lecteur button{
    border:none; background:none; cursor:pointer; color:var(--muted); font-size:15px; line-height:1;
    padding:0 2px; min-height:0;
  }
  .lecteur button:hover{color:var(--ko);}
  .lecteur.absent{border-color:var(--ko); color:var(--ko);}

  .sans-lecteur{color:var(--ko); font-weight:700;}

  .barre{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .barre select, .barre input{max-width:100%;}

  @media (max-width:760px){
    .bloc{padding:13px 14px;}
    .ligne{grid-template-columns:minmax(0,1fr) auto;}
    .dep-ligne{grid-template-columns:minmax(0,1fr); gap:6px;}
    .dep-ligne.aRegler{margin:0 -14px; padding:9px 14px;}
    input, select{font-size:16px !important;}
  }
</style>

<body>
<div class="wrap">
  <div class="co-page-head co-fade">
    <div>
      <h1 class="co-h1">Partitions</h1>
      <p class="co-sub">La bibliothèque d'orchestre : on y range le matériel par spectacle, et on le sort pour une opération.</p>
    </div>
    <div class="co-actions">
      <button type="button" class="co-btn" data-vue="bibliotheque">Bibliothèque</button>
      <button type="button" class="co-btn" data-vue="affectation">Affectation</button>
      <button type="button" class="co-btn" data-vue="transmissions">Transmissions</button>
    </div>
  </div>

  <div id="page"><div class="co-card co-pad vide">Chargement…</div></div>
</div>

<script>
/* ============================================================================
   Partitions — la page.
   ============================================================================
   Les partitions circulaient par message et par Drive : un lien par pupitre,
   renvoyé à chaque ajout, et personne ne savait qui avait réellement récupéré
   sa partie. Le jour où une partition ressortait ailleurs, rien ne disait d'où
   elle venait. Cette page range le matériel une fois, le distribue nominativement
   à chaque opération, et pose sur chaque exemplaire téléchargé le nom de qui
   l'a pris.

   TROIS NIVEAUX, ET C'EST CELUI DU MILIEU QUI TRAVAILLE :
     le SPECTACLE  — EXPEDITION 33. On y dépose le matériel UNE FOIS.
     la PARTIE     — Violon 1, Alto, Piano. C'est l'unité qu'on affecte.
     l'OPÉRATION   — une tournée ou un enregistrement, une ligne de tournees.

   LES RÈGLES QUI TIENNENT TOUT, et qu'il ne faut défaire sous aucun prétexte :

   1. UN SEUL EXEMPLAIRE PROPRE PAR PARTIE, jamais un fichier par musicien·ne.
      C'est ce qui maintient le stockage plat : cinquante musiciens sur une
      partie, c'est un fichier, pas cinquante.
   2. LE FILIGRANE SE POSE À LA VOLÉE, dans /api/partition, au moment du
      téléchargement. Le fichier propre ne sort jamais du bucket privé.
   3. L'AFFECTATION PORTE SUR LA PARTIE, pas sur le fichier. Un fichier ajouté
      à trois semaines du concert se propage seul à tous ceux qui la lisent.
   4. LES LIENS PERSONNELS DÉJÀ ENVOYÉS RESTENT VALIDES. Le musicien voit ses
      partitions dans son espace existant ; on ne réémet aucun lien.

   CE QUE CETTE PAGE NE FAIT PAS, et qui est un bon refus :

   — Elle n'apparie PAS automatiquement une partie à une personne d'après son
     instrument. musiciens.instrument est du texte libre : 25 valeurs sur 114
     fiches, avec « Flutes » et « Flûtes », « Alto » et « Altos », et un
     « Violoncelles » à espace final. Un appariement automatique se tromperait,
     et l'erreur ne se découvrirait qu'à la première répétition. L'affectation
     est donc nominative, et la page se contente de la rendre rapide.
   — Elle ne lit PAS la nomenclature de l'opération pour savoir qui joue.
     tournees.nomenclature est un prévisionnel de devis : EXP33-REC-ORCHESTRE
     SYMPHONIQUE y annonce 49 postes et n'a que 16 musiciens affectés. L'effectif
     réel se lit dans dates[].musiciensAssignes, et nulle part ailleurs.
   — Elle n'affiche PAS les partitions dans le navigateur. La CSP interdit
     <object> et <embed> (object-src 'none'), mais pas une <iframe> vers
     /api/partition, qui est same-origin : c'est donc un choix, pas une
     contrainte. Prévisualiser obligerait à poser le filigrane pour un simple
     coup d'œil, donc à écrire une ligne de journal et à brûler un jeton pour
     rien. On télécharge, et le journal ne dit que la vérité.
============================================================================ */

const PLAFOND_STOCKAGE = 1024 * 1024 * 1024;   // le plan Supabase gratuit

let state = {
  vue: 'bibliotheque',
  spectacles: [], parties: [], fichiers: [], affectations: [], acces: [], envois: [],
  tournees: [], musiciens: [], techniciens: [],
  spectacleId: '',
  tourneeId: '',
  depot: [],          // les fichiers choisis, pas encore déposés
  // Le journal des téléchargements n'est lu QU'À L'OUVERTURE de l'onglet
  // Transmissions, et une seule fois. C'est une table qui grossit d'une ligne
  // par partition remise : la charger à chaque ouverture de la bibliothèque
  // ferait payer une saison de téléchargements à qui vient déposer trois PDF.
  telechargements: null,
  telechargementsEnCours: false,
  chargement: true,
};

/* ---------------------------------------------------------------------------
   LECTURES DÉRIVÉES
   --------------------------------------------------------------------------- */

const parId = (liste) => { const m = new Map(); (liste || []).forEach(x => m.set(x.id, x)); return m; };

function partiesDe(spectacleId){
  return state.parties.filter(p => p.spectacleId === spectacleId)
    .sort((a, b) => (a.ordre - b.ordre) || a.nom.localeCompare(b.nom, 'fr'));
}
function fichiersDe(partieId){
  return state.fichiers.filter(f => f.partieId === partieId)
    .sort((a, b) => (a.ordre - b.ordre) || a.titre.localeCompare(b.titre, 'fr'));
}
function poidsSpectacle(spectacleId){
  const ids = new Set(partiesDe(spectacleId).map(p => p.id));
  return state.fichiers.filter(f => ids.has(f.partieId)).reduce((s, f) => s + (f.octets || 0), 0);
}
const poidsTotal = () => state.fichiers.reduce((s, f) => s + (f.octets || 0), 0);

/* L'effectif RÉEL d'une opération : l'union des personnes affectées sur ses
   dates. C'est la seule source juste — voir la bannière de tête. Une personne
   qui ne joue qu'une date sur trois en fait partie : elle a besoin de sa
   partie autant que les autres. */
function effectifDe(tourneeId){
  const t = state.tournees.find(x => x.id === tourneeId);
  if(!t) return [];
  const compte = new Map();
  (t.dates || []).forEach(d => {
    (d.musiciensAssignes || []).forEach(id => compte.set('musicien|' + id, (compte.get('musicien|' + id) || 0) + 1));
    (d.techniciensAssignes || []).forEach(id => compte.set('technicien|' + id, (compte.get('technicien|' + id) || 0) + 1));
  });
  const mus = parId(state.musiciens), tech = parId(state.techniciens);
  const out = [];
  compte.forEach((nbDates, cle) => {
    const [personType, personId] = cle.split('|');
    const p = (personType === 'musicien' ? mus : tech).get(personId);
    if(!p) return;   // une personne supprimée de l'annuaire depuis
    out.push({
      personType, personId, nbDates,
      nom: [p.prenom, p.nom].filter(Boolean).join(' ') || 'Sans nom',
      pupitre: p.pupitre || p.pole || '',
      instrument: p.instrument || p.poste || '',
    });
  });
  const rangPupitre = (x) => {
    const i = CURIEUX_PUPITRES.indexOf(x.pupitre);
    return i < 0 ? 99 : i;
  };
  return out.sort((a, b) => rangPupitre(a) - rangPupitre(b) || a.nom.localeCompare(b.nom, 'fr'));
}

function affectationsDe(tourneeId){
  return state.affectations.filter(a => a.tourneeId === tourneeId);
}

/* ---------------------------------------------------------------------------
   CHARGEMENT
   --------------------------------------------------------------------------- */

async function charger(){
  const [spectacles, parties, fichiers, affectations, acces, envois, tournees, musiciens, techniciens] = await Promise.all([
    CurieuxDB.fetchAll('partitions_spectacles').catch(()=> []),
    CurieuxDB.fetchAll('partitions_parties').catch(()=> []),
    CurieuxDB.fetchAll('partitions_fichiers').catch(()=> []),
    CurieuxDB.fetchAll('partitions_affectations').catch(()=> []),
    CurieuxDB.fetchAll('partitions_acces').catch(()=> []),
    CurieuxDB.fetchAll('partitions_envois').catch(()=> []),
    CurieuxDB.fetchAll('tournees').catch(()=> []),
    CurieuxDB.fetchAll('musiciens').catch(()=> []),
    CurieuxDB.fetchAll('techniciens').catch(()=> []),
  ]);
  Object.assign(state, { spectacles, parties, fichiers, affectations, acces, envois, tournees, musiciens, techniciens, chargement: false });

  const url = new URLSearchParams(location.search);
  state.spectacleId = url.get('spectacle') || state.spectacleId || (spectacles[0] || {}).id || '';
  state.tourneeId = url.get('operation') || state.tourneeId || '';
  if(url.get('vue')) state.vue = url.get('vue');
  rendre();
}

/* ---------------------------------------------------------------------------
   RENDU
   --------------------------------------------------------------------------- */

function rendre(){
  document.querySelectorAll('[data-vue]').forEach(b => {
    b.classList.toggle('primary', b.dataset.vue === state.vue);
  });
  const el = document.getElementById('page');
  if(state.chargement){ el.innerHTML = '<div class="co-card co-pad vide">Chargement…</div>'; return; }
  el.innerHTML = state.vue === 'affectation' ? vueAffectation()
               : state.vue === 'depot' ? vueDepot()
               : state.vue === 'transmissions' ? vueTransmissions()
               : vueBibliotheque();
  cablerVue();
}

function enteteStockage(){
  const total = poidsTotal();
  const part = Math.min(1, total / PLAFOND_STOCKAGE);
  const chaud = part > 0.8;
  return `
    <div class="chiffres">
      <div class="chiffre">
        <b>${state.spectacles.length}</b><span>spectacle${state.spectacles.length > 1 ? 's' : ''}</span>
        <small>${state.parties.length} partie${state.parties.length > 1 ? 's' : ''}, ${state.fichiers.length} fichier${state.fichiers.length > 1 ? 's' : ''}</small>
      </div>
      <div class="chiffre${chaud ? ' alerte' : ''}">
        <b>${partitionsPoids(total)}</b><span>de matériel rangé</span>
        <div class="jauge${chaud ? ' alerte' : ''}"><i style="width:${(part * 100).toFixed(1)}%"></i></div>
        <small>sur 1 Go — soit une vingtaine de programmes à parties fusionnées</small>
      </div>
      <div class="chiffre">
        <b>${state.affectations.length}</b><span>affectations</span>
        <small>sur ${new Set(state.affectations.map(a => a.tourneeId)).size} opération(s)</small>
      </div>
    </div>`;
}

/* --- VUE 1 : LA BIBLIOTHÈQUE ---------------------------------------------- */

function vueBibliotheque(){
  const spectacle = state.spectacles.find(s => s.id === state.spectacleId);
  const listeSpectacles = state.spectacles.slice()
    .sort((a, b) => Number(a.archive) - Number(b.archive) || a.nom.localeCompare(b.nom, 'fr'));

  const cartes = listeSpectacles.map(s => {
    const nbParties = partiesDe(s.id).length;
    const ids = new Set(partiesDe(s.id).map(p => p.id));
    const nbFichiers = state.fichiers.filter(f => ids.has(f.partieId)).length;
    const actif = s.id === state.spectacleId;
    return `
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(s.nom || 'Sans nom')}${s.archive ? ' <em style="font-weight:400;color:var(--muted)">— archivé</em>' : ''}</span>
          <span class="l-sous">${escapeHtml([s.compositeur, s.arrangeur && 'arr. ' + s.arrangeur].filter(Boolean).join(' · ')) || 'Aucun auteur renseigné'}</span>
        </span>
        <span class="l-num">${nbParties} partie${nbParties > 1 ? 's' : ''}<br><em style="font-weight:400">${nbFichiers} fichier${nbFichiers > 1 ? 's' : ''} · ${partitionsPoids(poidsSpectacle(s.id))}</em></span>
        <button type="button" class="co-btn sm${actif ? ' primary' : ''}" data-ouvrir="${escapeAttr(s.id)}">${actif ? 'Ouvert' : 'Ouvrir'}</button>
      </div>`;
  }).join('');

  return `
    ${enteteStockage()}
    <section class="bloc">
      <h2>Spectacles <span class="h2-total"><button type="button" class="co-btn sm" id="btnNouveauSpectacle">Nouveau spectacle</button></span></h2>
      ${cartes || '<p class="vide">Aucun spectacle. Commence par en créer un — c\'est le tiroir où le matériel se range, et il sert ensuite à toutes les opérations qui le jouent.</p>'}
    </section>
    ${spectacle ? vueMateriel(spectacle) : ''}`;
}

function vueMateriel(spectacle){
  const parties = partiesDe(spectacle.id);
  const lignes = parties.map(p => {
    const fs = fichiersDe(p.id);
    const poids = fs.reduce((s, f) => s + (f.octets || 0), 0);
    const detail = fs.length
      ? fs.map(f => `<span class="l-sous">— ${escapeHtml(f.titre || f.nomOrigine)} · ${partitionsPoids(f.octets)}${f.pages ? ' · ' + f.pages + ' p.' : ''}
           <button type="button" class="co-btn ghost sm" data-retirer-fichier="${escapeAttr(f.id)}" style="padding:1px 8px;min-height:0;font-size:11px">retirer</button></span>`).join('')
      : '<span class="l-sous sans-lecteur">Aucun fichier — cette partie est annoncée mais rien n\'est déposé</span>';
    return `
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">${escapeHtml(p.nom)}</span>
          ${detail}
        </span>
        <span class="l-num">${escapeHtml(p.pupitre || '—')}${poids ? '<br><em style="font-weight:400">' + partitionsPoids(poids) + '</em>' : ''}</span>
        <button type="button" class="co-btn ghost sm" data-retirer-partie="${escapeAttr(p.id)}">Retirer</button>
      </div>`;
  }).join('');

  const manquantes = parties.filter(p => !fichiersDe(p.id).length).length;

  return `
    <section class="bloc">
      <h2>Matériel — ${escapeHtml(spectacle.nom)}
        <span class="h2-total">
          <button type="button" class="co-btn sm primary" id="btnDeposer">Déposer des fichiers</button>
          <button type="button" class="co-btn sm" id="btnNouvellePartie">Ajouter une partie</button>
          <button type="button" class="co-btn ghost sm" id="btnReglagesSpectacle">Réglages</button>
        </span>
      </h2>
      ${manquantes ? `<p class="vide sans-lecteur">${manquantes} partie${manquantes > 1 ? 's sont annoncées' : ' est annoncée'} sans aucun fichier déposé.</p>` : ''}
      ${lignes || '<p class="vide">Rien de rangé. Dépose les PDF : la page lit leur nom et propose la partie de chacun.</p>'}
    </section>
    <section class="bloc">
      <h2>Réglages de ce spectacle</h2>
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">Chiffrer les partitions au téléchargement</span>
          <span class="l-sous">AES-256, le code de l'opération sert de mot de passe. forScore sait l'ouvrir ; MobileSheets et Newzik ne le documentent pas — à vérifier sur les tablettes du pupitre avant d'activer.</span>
        </span>
        <span></span>
        <label class="co-check"><input type="checkbox" id="chkChiffrer" ${spectacle.chiffrer ? 'checked' : ''}> <span>${spectacle.chiffrer ? 'Activé' : 'Désactivé'}</span></label>
      </div>
      <div class="ligne">
        <span class="l-nom">
          <span class="l-titre">Sauvegarde sur le Drive</span>
          <span class="l-sous">Le lien du dossier qui garde le matériel hors de ce site. Si l'application disparaît, le matériel ne disparaît pas avec elle.</span>
        </span>
        <span></span>
        <input class="co-input" id="inpDrive" style="width:260px" placeholder="https://drive.google.com/…" value="${escapeAttr(spectacle.lienDrive || '')}">
      </div>
    </section>`;
}

/* --- VUE 2 : LE DÉPÔT ------------------------------------------------------ */

function vueDepot(){
  const spectacle = state.spectacles.find(s => s.id === state.spectacleId);
  if(!spectacle) return '<div class="co-card co-pad vide">Choisis d\'abord un spectacle.</div>';
  const parties = partiesDe(spectacle.id);

  /* Ce qui n'a pas été reconnu remonte en tête. C'est tout l'intérêt de l'écran :
     on ne relit pas trente lignes, on règle les quatre qui posent question. */
  const rang = { aucune: 0, incertaine: 1, probable: 2, exacte: 3 };
  const liste = state.depot.slice().sort((a, b) => (rang[a.sûrete] - rang[b.sûrete]) || a.nomOrigine.localeCompare(b.nomOrigine, 'fr'));

  const lignes = liste.map((d, i) => {
    const idx = state.depot.indexOf(d);
    const options = [
      `<option value="">— nouvelle partie « ${escapeHtml(d.propose)} » —</option>`,
      ...parties.map(p => `<option value="${escapeAttr(p.id)}"${d.partieId === p.id ? ' selected' : ''}>${escapeHtml(p.nom)}</option>`),
    ].join('');
    const aRegler = d.sûrete === 'aucune' || d.sûrete === 'incertaine';
    const indice = d.candidats && d.candidats.length
      ? `Plusieurs parties possibles : ${escapeHtml(d.candidats.map(c => c.nom).join(', '))} — à trancher.`
      : d.sûrete === 'aucune' ? `Aucune partie ne correspond : une nouvelle sera créée, pupitre ${escapeHtml(partitionsPupitreDe(d.propose))}.`
      : '';
    return `
      <div class="dep-ligne${aRegler ? ' aRegler' : ''}">
        <span class="l-nom">

        <small>${sansLecteur.length ? escapeHtml(sansLecteur.slice(0, 4).map(p => p.nom).join(', ')) + (sansLecteur.length > 4 ? '…' : '') : 'Tout le matériel est distribué'}</small></div>
      <div class="chiffre${sansPartie.length ? ' alerte' : ''}"><b>${sansPartie.length}</b><span>personnes sans partie</span>
        <small>${sansPartie.length ? escapeHtml(sansPartie.slice(0, 4).map(p => p.nom).join(', ')) + (sansPartie.length > 4 ? '…' : '') : 'Tout le monde a de quoi jouer'}</small></div>
    </div>

    <section class="bloc">
      <h2>Code d'accès — ${escapeHtml(operation ? operation.nom : '')}</h2>
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto auto">
        <span class="l-nom">
          <span class="l-titre">Le code que les musiciens saisissent une fois</span>
          <span class="l-sous">Leur lien personnel dit qui ils sont ; ce code dit qu'ils sont bien censés jouer ça maintenant. Un lien transféré ne donne rien sans lui. Communique-le en répétition ou par message groupé — pas dans le même message que le lien.</span>
        </span>
        <input class="co-input" id="inpCode" style="width:130px;font-weight:800;letter-spacing:.08em;text-transform:uppercase" maxlength="32" value="${escapeAttr(acces.code)}" placeholder="aucun">
        <button type="button" class="co-btn sm" id="btnNouveauCode">Tirer un code</button>
      </div>
      <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
        <span class="l-nom">
          <span class="l-titre">Ouvrir le matériel à partir du</span>

            <option value="">Reprendre l'affectation de…</option>
            ${autres.map(t => `<option value="${escapeAttr(t.id)}">${escapeHtml(t.nom)} (${affectationsDe(t.id).length})</option>`).join('')}

          <span class="l-sous">${escapeHtml([p.pupitre, p.instrument].filter(Boolean).join(' · '))} — ${p.nbDates} date${p.nbDates > 1 ? 's' : ''}</span></span>
        <span class="l-num">—</span>

}

/* --- VUE 4 : LES TRANSMISSIONS À UN TIERS ----------------------------------
   Un orchestre étranger reprend le programme et doit travailler dessus. Ses
   cinquante musiciens ne sont pas les nôtres : ils n'ont ni fiche dans
   l'annuaire, ni lien personnel, et leur en créer cinquante pour une
   coproduction serait faux (ils apparaîtraient ensuite dans les plannings et
   les budgets) autant qu'ingérable. On confie donc le lot à la MAISON,
   représentée par la personne qui en répond — bibliothécaire, régisseur
   d'orchestre —, avec un lien, un code et une date de fin. C'est elle qui
   distribue en interne, comme elle le fait déjà pour son propre matériel.

   RIEN N'EST ASSOUPLI POUR AUTANT. Le bucket reste privé, le fichier propre ne
   sort jamais, chaque exemplaire est filigrané à la volée et journalisé un par
   un — au nom de l'ensemble, qui est le bon niveau de responsabilité pour une
   transmission entre maisons.

   CE QUE CET ÉCRAN NE VÉRIFIE PAS, ET QUI EST LE RISQUE PRINCIPAL : les
   DROITS. Retransmettre du matériel de LOCATION (Durand, Boosey, Schott…) à un
   autre ensemble est interdit par la quasi-totalité des contrats de location —
   c'est l'éditeur qui loue au second ensemble, pas nous qui lui prêtons. Aucun
   logiciel ne peut le savoir. La case à cocher n'autorise rien : elle
   enregistre que quelqu'un l'a affirmé, avec la date et l'auteur, dans le
   journal d'audit.
   --------------------------------------------------------------------------- */

const ENVOI_DUREE_PROPOSEE = 90;   // jours — le temps d'une préparation d'orchestre

function lienEnvoi(e){
  return `${location.origin}/partition-envoi.html?e=${encodeURIComponent(e.jeton)}`;
}

/* Une date d'écran et de courrier, jamais la forme ISO. « 2026-12-01 » se lit
   dans une base de données ; dans un mail à un bibliothécaire, il se lit comme
   une négligence — et à l'étranger, « 01/12/2026 » se lit parfois janvier. D'où
   la forme longue pour l'anglais, qui ne peut pas se confondre. */
function jourEnvoi(iso, langue){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return iso;
  return langue === 'en'
    ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })
    : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

/* L'état d'un lot, en un mot. L'ordre des tests compte : un lot révoqué reste
   révoqué même s'il a par ailleurs expiré — c'est la décision qu'on a prise
   qui doit se lire, pas le calendrier. */
function etatEnvoi(e){
  const jour = new Date().toISOString().slice(0, 10);
  if(!e.actif) return { cle: 'revoque', libelle: 'révoqué', classe: 'ko' };
  if(e.expireLe && e.expireLe < jour) return { cle: 'expire', libelle: 'expiré', classe: 'ko' };
  if(e.ouvertLe && e.ouvertLe > jour) return { cle: 'attente', libelle: 'ouvre le ' + jourEnvoi(e.ouvertLe), classe: 'maybe' };
  return { cle: 'ouvert', libelle: 'ouvert', classe: 'ok' };
}

function partiesDuLot(e){
  const parties = partiesDe(e.spectacleId);
  return e.toutesParties ? parties : parties.filter(p => (e.parties || []).includes(p.id));
}

function prisesDe(envoiId){
  if(!state.telechargements) return null;
  return state.telechargements.filter(t => t.personType === 'tiers' && t.personId === envoiId);
}

/* Le message à envoyer, prêt à coller dans un mail. C'est LE geste qui fait
   gagner du temps : le lien et le code ne suffisent pas, il faut dire ce qu'on
   confie, jusqu'à quand, et à quelles conditions — et le dire dans une langue
   que le destinataire lit. Une transmission à un orchestre étranger
   accompagnée d'un mot en français, c'est un appel téléphonique et deux jours
   perdus. */
function messageEnvoi(e, langue){
  const spectacle = (state.spectacles.find(x => x.id === e.spectacleId) || {}).nom || '';
  const operation = (state.tournees.find(t => t.id === e.tourneeId) || {}).nom || '';
  const nb = partiesDuLot(e).length;
  const lien = lienEnvoi(e);
  // « le matériel de EXPEDITION 33 » se corrige tout seul : un titre qui
  // commence par une voyelle prend l'élision. Un détail, mais il se voit dans
  // la première ligne d'un mail à une maison qu'on ne connaît pas encore.
  const de = /^[AEIOUYÀÂÉÈÊÎÔÛaeiouyàâéèêîôûh]/.test(spectacle) ? "d'" : 'de ';
  /* Les lignes à null sont celles qui n'ont pas lieu d'être (pas de code, pas
     de date de fin) ; les chaînes vides sont des SAUTS DE PARAGRAPHE et
     doivent survivre au filtre. Les confondre donne un pavé de huit lignes
     collées, qu'on relit deux fois avant de trouver le code. */
  if(langue === 'en'){
    return [
      `Dear ${e.contactNom || 'colleague'},`,
      '',
      `Please find below the orchestral material for ${spectacle}${operation ? ` (${operation})` : ''}, entrusted to ${e.destinataire} for your work.`,
      '',
      `Link:  ${lien}`,
      e.code ? `Code:  ${e.code}` : null,
      '',
      `The set contains ${nb} part${nb > 1 ? 's' : ''}. You can download everything as a single archive, or part by part.`,
      e.expireLe ? `The link stays open until ${jourEnvoi(e.expireLe, 'en')}.` : null,
      '',
      'Every copy downloaded carries your ensemble’s name and an invisible mark identifying the origin of any copy found in circulation. Please do not pass the material on beyond your ensemble.',
      '',
      'With best regards,',
    ].filter(l => l !== null).join('\n');
  }
  return [
    e.contactNom ? `Bonjour ${e.contactNom},` : 'Bonjour,',
    '',
    `Vous trouverez ci-dessous le matériel d'orchestre ${de}${spectacle}${operation ? ` (${operation})` : ''}, que nous confions à ${e.destinataire} pour votre travail.`,
    '',
    `Lien : ${lien}`,
    e.code ? `Code : ${e.code}` : null,
    '',
    `Le lot contient ${nb} partie${nb > 1 ? 's' : ''}. Tout se télécharge d'un bloc, ou partie par partie.`,
    e.expireLe ? `Le lien reste ouvert jusqu'au ${jourEnvoi(e.expireLe)}.` : null,
    '',
    "Chaque exemplaire téléchargé porte le nom de votre ensemble, ainsi qu'une marque invisible permettant d'identifier l'origine d'un exemplaire qui circulerait. Merci de ne pas rediffuser ce matériel au-delà de votre orchestre.",
    '',
    'Bien cordialement,',
  ].filter(l => l !== null).join('\n');
}

          ${parties.map(p => `<label class="lecteur" style="padding:3px 10px"><input type="checkbox" data-env-partie="${escapeAttr(p.id)}" style="margin-right:6px"> ${escapeHtml(p.nom)}</label>`).join('')
            || '<span class="l-sous">Ce spectacle n\'a aucune partie.</span>'}

    <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto auto">
      <span class="l-nom">
        <span class="l-titre">Fenêtre d'accès</span>
        <span class="l-sous">Un lot confié sans date de fin reste ouvert des années. Trois mois couvrent une préparation d'orchestre ; on prolonge d'un clic si besoin.</span>

      <input class="co-input" type="date" id="envOuvertLe" value="" title="Ouvrir à partir du">
      <input class="co-input" type="date" id="envExpireLe" value="${escapeAttr(addDaysIso(aujourdHui, ENVOI_DUREE_PROPOSEE))}" title="Fermer le">

      <span class="l-nom">
        <span class="l-titre">Distribution nominative</span>
        <span class="l-sous">Le destinataire saisit le nom de chaque musicien avant de prendre sa partie. On retrouve la traçabilité individuelle sans créer une seule fiche — mais c'est LUI qui saisit : à convenir avec lui, sinon il abandonne au troisième pupitre.</span>
      </span>
      <label class="co-check"><input type="checkbox" id="envNominatif"> <span>Exiger un nom</span></label>
    </div>
    <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">
      <span class="l-nom">
        <span class="l-titre sans-lecteur">Droits de diffusion</span>
        <span class="l-sous">Le matériel de LOCATION (Durand, Boosey, Schott, Universal…) ne se retransmet pas : c'est l'éditeur qui loue au second ensemble. Cette case n'autorise rien — elle enregistre, avec la date et l'auteur, que quelqu'un l'a vérifié.</span>
      </span>
      <label class="co-check"><input type="checkbox" id="envDroits"> <span>Vérifié</span></label>
    </div>
    <div class="ligne" style="grid-template-columns:minmax(0,1fr) auto">

        <span class="l-titre">Mot affiché au destinataire <em style="font-weight:400;color:var(--muted)">— facultatif</em></span>
        <input class="co-input" id="envNote" style="width:100%" maxlength="240" placeholder="Matériel en cours de correction — version définitive le 12 mars.">

  return `

      <div class="chiffre"><b>${prises === null ? '…' : prises}</b><span>exemplaires pris par des tiers</span>
        <small>sur ${state.envois.length} transmission${state.envois.length > 1 ? 's' : ''} au total, révoquées et expirées comprises — le journal, lui, ne s'efface pas</small></div>
      <div class="chiffre${sansDroits ? ' alerte' : ''}"><b>${sansDroits}</b><span>lot${sansDroits > 1 ? 's' : ''} sans vérification des droits</span>
        <small>${sansDroits ? 'Le matériel de location ne se retransmet pas : c\'est l\'éditeur qui loue au second ensemble.' : 'Droits vérifiés sur tous les lots confiés'}</small></div>
    </div>

    <section class="bloc">
      <h2>Confier un lot${spectacle ? ' — ' + escapeHtml(spectacle.nom) : ''}</h2>
      ${formulaire}
    </section>

    <section class="bloc">
      <h2>Ce qui est confié <span class="h2-total">${lots.length} transmission${lots.length > 1 ? 's' : ''}</span></h2>
      ${lignes || '<p class="vide">Aucune transmission. Un lot confié remplace l\'envoi individuel à cinquante musiciens qui ne sont pas les nôtres : un lien, un code, une personne qui en répond.</p>'}
    </section>`;
}

/* ---------------------------------------------------------------------------
   ACTIONS
   --------------------------------------------------------------------------- */

function cablerVue(){
  const el = document.getElementById('page');

  el.querySelectorAll('[data-ouvrir]').forEach(b => b.onclick = ()=>{
    state.spectacleId = b.dataset.ouvrir; rendre();
  });
  const q = (id)=> el.querySelector('#' + id);

  if(q('btnNouveauSpectacle')) q('btnNouveauSpectacle').onclick = nouveauSpectacle;
  if(q('btnNouvellePartie')) q('btnNouvellePartie').onclick = nouvellePartie;
  if(q('btnDeposer')) q('btnDeposer').onclick = ()=>{ state.vue = 'depot'; state.depot = []; rendre(); };
  if(q('btnRetourBiblio')) q('btnRetourBiblio').onclick = ()=>{ state.vue = 'bibliotheque'; state.depot = []; rendre(); };
  if(q('btnReglagesSpectacle')) q('btnReglagesSpectacle').onclick = ()=> document.getElementById('chkChiffrer').scrollIntoView({ behavior: 'smooth', block: 'center' });

  if(q('chkChiffrer')) q('chkChiffrer').onchange = (e)=> majSpectacle({ chiffrer: e.target.checked });
  if(q('inpDrive')) q('inpDrive').onchange = (e)=> majSpectacle({ lienDrive: e.target.value.trim() });

  el.querySelectorAll('[data-retirer-partie]').forEach(b => b.onclick = ()=> retirerPartie(b.dataset.retirerPartie));
  el.querySelectorAll('[data-retirer-fichier]').forEach(b => b.onclick = ()=> retirerFichier(b.dataset.retirerFichier));

  // --- dépôt ---
  const zone = q('zoneDepot'), inp = q('inpFichiers');
  if(zone && inp){
    zone.onclick = ()=> inp.click();
    inp.onchange = ()=>{ ajouterAuDepot(Array.from(inp.files || [])); inp.value = ''; };
    ['dragenter', 'dragover'].forEach(ev => zone.addEventListener(ev, (e)=>{ e.preventDefault(); zone.classList.add('survol'); }));
    ['dragleave', 'drop'].forEach(ev => zone.addEventListener(ev, (e)=>{ e.preventDefault(); zone.classList.remove('survol'); }));
    zone.addEventListener('drop', (e)=> ajouterAuDepot(Array.from((e.dataTransfer || {}).files || [])));
  }
  el.querySelectorAll('[data-depot-partie]').forEach(s => s.onchange = ()=>{
    const d = state.depot[Number(s.dataset.depotPartie)];
    if(!d) return;
    d.partieId = s.value;
    // Une décision prise n'a plus à remonter en tête de liste.
    d.sûrete = s.value ? 'exacte' : 'aucune';
    d.candidats = null;
    rendre();
  });
  el.querySelectorAll('[data-depot-retirer]').forEach(b => b.onclick = ()=>{
    state.depot.splice(Number(b.dataset.depotRetirer), 1); rendre();
  });
  if(q('btnConfirmerDepot')) q('btnConfirmerDepot').onclick = confirmerDepot;

  // --- affectation ---
  if(q('selOperation')) q('selOperation').onchange = (e)=>{ state.tourneeId = e.target.value; rendre(); };
  if(q('selSpectacleAff')) q('selSpectacleAff').onchange = (e)=>{ state.spectacleId = e.target.value; rendre(); };
  el.querySelectorAll('[data-affecter]').forEach(s => s.onchange = ()=>{
    if(!s.value) return;
    const [personType, personId] = s.value.split('|');
    affecter(s.dataset.affecter, personType, personId);
  });
  el.querySelectorAll('[data-desaffecter]').forEach(b => b.onclick = ()=> desaffecter(b.dataset.desaffecter));
  if(q('inpCode')) q('inpCode').onchange = (e)=> majAcces({ code: e.target.value.trim().toUpperCase() });
  if(q('btnNouveauCode')) q('btnNouveauCode').onclick = ()=> majAcces({ code: partitionsNouveauCode() });
  if(q('inpOuvertLe')) q('inpOuvertLe').onchange = (e)=> majAcces({ ouvertLe: e.target.value });
  if(q('selReprendre')) q('selReprendre').onchange = (e)=>{ if(e.target.value) reprendreAffectation(e.target.value); };

  // --- transmissions ---
  if(q('selSpectacleEnvoi')) q('selSpectacleEnvoi').onchange = (e)=>{ state.spectacleId = e.target.value; rendre(); };
  // La liste des parties se montre et se cache SANS rendre() : un rendu
  // complet reconstruirait le formulaire et effacerait le nom du
  // destinataire qu'on vient de taper.
  if(q('envPortee')) q('envPortee').onchange = (e)=>{
    const liste = q('envListeParties');
    if(liste) liste.style.display = e.target.value === 'selection' ? 'grid' : 'none';
  };
  if(q('btnCreerEnvoi')) q('btnCreerEnvoi').onclick = creerEnvoi;

  el.querySelectorAll('[data-copier-lien]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.copierLien);
    if(e) copierTexte(lienEnvoi(e), 'Lien copié.');
  });
  el.querySelectorAll('[data-copier-code]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.copierCode);
    if(e) copierTexte(e.code, 'Code copié. À envoyer séparément du lien.');
  });
  el.querySelectorAll('[data-message-fr]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.messageFr);
    if(e) copierTexte(messageEnvoi(e, 'fr'), 'Message copié — à coller dans le mail.');
  });
  el.querySelectorAll('[data-message-en]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.messageEn);
    if(e) copierTexte(messageEnvoi(e, 'en'), 'Message copié — à coller dans le mail.');
  });
  el.querySelectorAll('[data-basculer]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.basculer);
    if(!e) return;
    if(e.actif && !confirm(`Révoquer le lot confié à « ${e.destinataire} » ?\n\nLe lien cesse immédiatement de fonctionner. Les exemplaires déjà téléchargés, eux, restent chez eux — la révocation ne les rappelle pas.`)) return;
    majEnvoi(e.id, { actif: !e.actif });
  });
  el.querySelectorAll('[data-prolonger]').forEach(b => b.onclick = ()=>{
    const e = state.envois.find(x => x.id === b.dataset.prolonger);
    if(!e) return;
    majEnvoi(e.id, { expireLe: addDaysIso(new Date().toISOString().slice(0, 10), ENVOI_DUREE_PROPOSEE) });
  });
  el.querySelectorAll('[data-retirer-envoi]').forEach(b => b.onclick = ()=> retirerEnvoi(b.dataset.retirerEnvoi));
}

async function nouveauSpectacle(){
  const nom = prompt('Nom du spectacle — celui sous lequel on range son matériel (ex. EXPEDITION 33) :');
  if(!nom || !nom.trim()) return;
  const s = { id: genId('spect'), nom: nom.trim(), compositeur: '', arrangeur: '', lienDrive: '', chiffrer: false, archive: false, note: '' };
  state.spectacles.push(s); state.spectacleId = s.id; rendre();
  await CurieuxDB.upsertOne('partitions_spectacles', s);
}

async function majSpectacle(champs){
  const s = state.spectacles.find(x => x.id === state.spectacleId);
  if(!s) return;
  Object.assign(s, champs); rendre();
  await CurieuxDB.upsertOne('partitions_spectacles', s);
}

async function nouvellePartie(){
  const nom = prompt('Nom de la partie (ex. Violon 1, Cor 1-2, Conducteur) :');
  if(!nom || !nom.trim()) return;
  const p = creerPartieLocale(nom.trim());
  rendre();
  await CurieuxDB.upsertOne('partitions_parties', p);
}

function creerPartieLocale(nom){
  const p = {
    id: genId('part'), spectacleId: state.spectacleId, nom,
    pupitre: partitionsPupitreDe(nom), ordre: partitionsOrdreDe(nom), note: '',
  };
  state.parties.push(p);
  return p;
}

/* Une partie retirée emporte ses fichiers, et ses fichiers sont dans le
   stockage. On ne touche au stockage que dans `purger` : tant que le ruban
   « Annuler » est là, rien n'est parti. */
function retirerPartie(id){
  const p = state.parties.find(x => x.id === id);
  if(!p) return;
  const fs = fichiersDe(id);
  const affs = state.affectations.filter(a => a.partieId === id);
  state.parties = state.parties.filter(x => x.id !== id);
  state.fichiers = state.fichiers.filter(f => f.partieId !== id);
  state.affectations = state.affectations.filter(a => a.partieId !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `« ${p.nom} » retirée${fs.length ? ` (${fs.length} fichier${fs.length > 1 ? 's' : ''})` : ''}`,
    retablir: ()=>{
      state.parties.push(p); state.fichiers.push(...fs); state.affectations.push(...affs); rendre();
    },
    purger: async ()=>{
      for(const a of affs) await CurieuxDB.removeOne('partitions_affectations', a.id);
      for(const f of fs){ await CurieuxDB.removeOne('partitions_fichiers', f.id); await CurieuxDB.retirerPartition(f.chemin); }
      await CurieuxDB.removeOne('partitions_parties', id);
    },
  });
}

function retirerFichier(id){
  const f = state.fichiers.find(x => x.id === id);
  if(!f) return;
  state.fichiers = state.fichiers.filter(x => x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `« ${f.titre || f.nomOrigine} » retiré`,
    retablir: ()=>{ state.fichiers.push(f); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('partitions_fichiers', id); await CurieuxDB.retirerPartition(f.chemin); },
  });
}

function ajouterAuDepot(fichiers){
  const parties = partiesDe(state.spectacleId);
  const pdf = fichiers.filter(f => /\.pdf$/i.test(f.name) || f.type === 'application/pdf');
  const rejetes = fichiers.length - pdf.length;
  pdf.forEach(f => {
    const r = partitionsApparier(f.name, parties);
    state.depot.push({
      fichier: f, nomOrigine: f.name, octets: f.size,
      propose: r.propose, partieId: r.partie ? r.partie.id : '',
      sûrete: r.sûrete, candidats: r.candidats || null,
    });
  });
  if(rejetes) alert(`${rejetes} fichier${rejetes > 1 ? 's ont' : ' a'} été ignoré${rejetes > 1 ? 's' : ''} : seuls les PDF sont acceptés.`);
  rendre();
}

async function confirmerDepot(){
  const btn = document.getElementById('btnConfirmerDepot');
  const aFaire = state.depot.slice();
  if(!aFaire.length) return;
  btn.disabled = true;

  // Les parties manquantes d'abord, toutes ensemble : plusieurs fichiers
  // peuvent viser la même partie neuve, et en créer deux la scinderait en
  // silence.
  const neuves = new Map();
  for(const d of aFaire){
    if(d.partieId) continue;
    const cle = partitionsNormaliser(d.propose);
    if(!neuves.has(cle)){
      const p = creerPartieLocale(d.propose);
      neuves.set(cle, p);
      await CurieuxDB.upsertOne('partitions_parties', p);
    }
    d.partieId = neuves.get(cle).id;
  }

  let faits = 0, echecs = [];
  for(const d of aFaire){
    btn.textContent = `Dépôt ${faits + 1} / ${aFaire.length}…`;
    const depot = await CurieuxDB.deposerPartition(state.spectacleId, d.partieId, d.fichier);
    if(depot.error){ echecs.push(`${d.nomOrigine} — ${depot.error.message || 'échec'}`); continue; }
    const f = {
      id: genId('pfic'), partieId: d.partieId,
      titre: partitionsNomDepuisFichier(d.nomOrigine), chemin: depot.chemin,
      nomOrigine: d.nomOrigine, octets: d.octets, pages: null, empreinte: '',
      ordre: fichiersDe(d.partieId).length,
    };
    state.fichiers.push(f);
    await CurieuxDB.upsertOne('partitions_fichiers', f);
    faits++;
  }

  state.depot = [];
  state.vue = 'bibliotheque';
  rendre();
  if(echecs.length) alert(`${faits} fichier(s) déposé(s).\n\nÉchecs :\n` + echecs.join('\n'));
}

/* LA LIGNE D'ACCÈS SE CRÉE À LA PREMIÈRE AFFECTATION, et surtout pas plus tard.
   partition_pour_jeton fait une jointure INTERNE sur partitions_acces : sans
   cette ligne, aucune partition n'est téléchargeable, et rien ne le dit —
   la production affecte tout un orchestre, les musiciens voient leur liste et
   se heurtent à un refus que personne ne sait expliquer. On la crée donc avec
   un code tiré d'office : mieux vaut un code à communiquer qu'un mur muet. */
async function assurerAcces(){
  if(state.acces.some(a => a.id === state.tourneeId)) return;
  const a = { id: state.tourneeId, code: partitionsNouveauCode(), actif: true, ouvertLe: '' };
  state.acces.push(a);
  await CurieuxDB.upsertOne('partitions_acces', a);
}

async function affecter(partieId, personType, personId){
  const id = `${state.tourneeId}::${partieId}::${personId}`;
  if(state.affectations.some(a => a.id === id)) return;
  await assurerAcces();
  const a = { id, tourneeId: state.tourneeId, partieId, personType, personId };
  state.affectations.push(a); rendre();
  await CurieuxDB.upsertOne('partitions_affectations', a);
}

function desaffecter(id){
  const a = state.affectations.find(x => x.id === id);
  if(!a) return;
  state.affectations = state.affectations.filter(x => x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: 'Affectation retirée',
    retablir: ()=>{ state.affectations.push(a); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('partitions_affectations', id); },
  });
}

/* Reprendre l'affectation d'une autre opération. C'est le geste qui fait gagner
   le plus de temps : EXPEDITION 33 porte quatre opérations, et l'essentiel des
   pupitres revient d'une fois sur l'autre. On ne reprend QUE les personnes
   réellement présentes sur la nouvelle opération — recopier quelqu'un qui n'y
   joue pas lui ferait apparaître des partitions dans son espace pour une opé
   où il n'est pas attendu. */
async function reprendreAffectation(sourceId){
  const source = affectationsDe(sourceId);
  const effectif = new Set(effectifDe(state.tourneeId).map(e => e.personType + '|' + e.personId));
  const existantes = new Set(affectationsDe(state.tourneeId).map(a => a.partieId + '|' + a.personId));
  const nouvelles = [];
  let ecartes = 0;
  source.forEach(a => {
    if(!effectif.has(a.personType + '|' + a.personId)){ ecartes++; return; }
    if(existantes.has(a.partieId + '|' + a.personId)) return;
    nouvelles.push({ id: `${state.tourneeId}::${a.partieId}::${a.personId}`, tourneeId: state.tourneeId,
                     partieId: a.partieId, personType: a.personType, personId: a.personId });
  });
  if(!nouvelles.length){
    alert(ecartes ? `Rien à reprendre : les ${ecartes} personnes de cette opération ne jouent aucune date de celle-ci.`
                  : 'Rien à reprendre — tout est déjà affecté.');
    rendre(); return;
  }
  const nomSource = (state.tournees.find(t => t.id === sourceId) || {}).nom || '';
  if(!confirm(`Reprendre ${nouvelles.length} affectation(s) de « ${nomSource} » ?`
      + (ecartes ? `\n\n${ecartes} seront écartées : ces personnes ne jouent aucune date de cette opération.` : ''))) { rendre(); return; }
  await assurerAcces();
  state.affectations.push(...nouvelles); rendre();
  for(const a of nouvelles) await CurieuxDB.upsertOne('partitions_affectations', a);
}

/* Créer un lot confié. Deux refus, et ils ne sont pas symétriques : sans
   destinataire, le filigrane ne désignerait personne et tout le dispositif
   tombe — c'est un refus sec. Les droits, eux, se confirment : on prévient,
   et on laisse passer si la personne assume, parce qu'il existe des cas
   légitimes (matériel propre, arrangement maison, domaine public) que la page
   ne peut pas distinguer. */
async function creerEnvoi(){
  const val = (id)=> (document.getElementById(id) || {}).value || '';
  const coche = (id)=> !!(document.getElementById(id) || {}).checked;
  const destinataire = val('envDestinataire').trim();
  if(!destinataire){
    alert("Le nom de l'ensemble destinataire est obligatoire : c'est lui qui se pose sur chaque exemplaire téléchargé, et c'est ce qui rend la transmission traçable.");
    return;
  }
  const portee = val('envPortee');
  const choisies = Array.from(document.querySelectorAll('[data-env-partie]'))
    .filter(c => c.checked).map(c => c.dataset.envPartie);
  if(portee === 'selection' && !choisies.length){
    alert('Aucune partie sélectionnée. Coche celles que tu confies, ou repasse sur « tout le spectacle ».');
    return;
  }
  if(!coche('envDroits') && !confirm("Les droits de diffusion n'ont pas été vérifiés.\n\nLe matériel de LOCATION ne se retransmet pas à un autre ensemble : c'est l'éditeur qui le lui loue. Créer quand même le lien ?")) return;

  const e = {
    id: genId('penv'),
    spectacleId: state.spectacleId,
    tourneeId: val('envOperation'),
    destinataire,
    contactNom: val('envContact').trim(),
    contactEmail: val('envEmail').trim(),
    jeton: CurieuxDB.nouveauJetonEnvoi(),
    // Un code d'office, comme pour une opération : mieux vaut un code à
    // communiquer qu'un lien qui ouvre seul tout le matériel d'un spectacle
    // dès qu'il est transféré une fois.
    code: partitionsNouveauCode(),
    toutesParties: portee !== 'selection',
    parties: portee === 'selection' ? choisies : [],
    ouvertLe: val('envOuvertLe'),
    expireLe: val('envExpireLe'),
    actif: true,
    nominatif: coche('envNominatif'),
    droitsConfirmes: coche('envDroits'),
    note: val('envNote').trim(),
    createdAt: new Date().toISOString(),
  };
  state.envois.push(e);
  rendre();
  /* Pas de retour en arrière sur échec : l'écriture part dans la file de
     rejeu de db.js, comme partout ailleurs dans le projet, et retirer la ligne
     de l'écran ferait réapparaître au prochain rejeu un lot que la production
     croit annulé. On le DIT, en revanche — et on nomme la cause la plus
     probable, qui est une migration pas encore jouée. */
  const res = await CurieuxDB.upsertOne('partitions_envois', e);
  if(res && res.error){
    alert("Le lien est affiché mais n'a pas encore été enregistré : " + (res.error.message || 'échec')
      + "\n\nSi la base n'a pas encore la table des transmissions, joue la migration avant de communiquer ce lien.");
    return;
  }
  try{ curieuxFlash('Lien créé. « Message FR » ou « Message EN » prépare le mail à envoyer.'); }catch(err){}
}

async function majEnvoi(id, champs){
  const e = state.envois.find(x => x.id === id);
  if(!e) return;
  Object.assign(e, champs); rendre();
  await CurieuxDB.upsertOne('partitions_envois', e);
}

/* Retirer une transmission efface le LIEN, pas la trace. Les lignes du journal
   des téléchargements survivent — elles portent le nom de l'ensemble et la
   date, et c'est précisément ce qu'on veut retrouver deux ans plus tard sur
   une partition ressortie d'un pupitre étranger. */
function retirerEnvoi(id){
  const e = state.envois.find(x => x.id === id);
  if(!e) return;
  state.envois = state.envois.filter(x => x.id !== id);
  rendre();
  CurieuxAnnuler.proposer({
    texte: `Transmission à « ${e.destinataire} » retirée`,
    retablir: ()=>{ state.envois.push(e); rendre(); },
    purger: async ()=>{ await CurieuxDB.removeOne('partitions_envois', id); },
  });
}

/* Le presse-papiers demande un contexte sécurisé et une permission ; le repli
   par <textarea> marche partout, y compris derrière un proxy en http. Une
   copie qui échoue en silence ferait envoyer un mail sans lien. */
function copierTexte(texte, message){
  const dire = ()=>{ try{ curieuxFlash(message || 'Copié.'); }catch(e){ } };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(texte).then(dire).catch(()=> repli());
    return;
  }
  repli();
  function repli(){
    const z = document.createElement('textarea');
    z.value = texte;
    z.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(z); z.select();
    try{ document.execCommand('copy'); dire(); }
    catch(err){ prompt('Copie manuelle :', texte); }
    z.remove();
  }
}

async function majAcces(champs){
  let a = state.acces.find(x => x.id === state.tourneeId);
  if(!a){ a = { id: state.tourneeId, code: '', actif: true, ouvertLe: '' }; state.acces.push(a); }
  Object.assign(a, champs); rendre();
  await CurieuxDB.upsertOne('partitions_acces', a);
}

/* --------------------------------------------------------------------------- */

document.querySelectorAll('[data-vue]').forEach(b => b.onclick = ()=>{
  state.vue = b.dataset.vue; state.depot = []; rendre();
});

applyAutoTheme();
charger();
</script>
