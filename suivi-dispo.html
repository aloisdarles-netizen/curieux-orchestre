<link rel="stylesheet" href="assets/base.css">
<style>
  .wrap{max-width:1280px; margin:0 auto;}

  /* ------------------------------------------------------------------------
     Avec deux productions la page se lisait encore ; avec douze tournées et dix
     recordings, c'est un mur. On la coupe en deux : un sommaire collant à
     gauche, qui dit d'un coup d'œil où il manque des réponses et permet d'y
     aller, et les cartes à droite, repliées d'office.
     ------------------------------------------------------------------------ */
  .suivi-colonnes{ display:grid; grid-template-columns:250px minmax(0, 1fr); gap:20px; align-items:start; }
  @media (max-width:900px){ .suivi-colonnes{ grid-template-columns:1fr; } }

  .projets-menu{
    position:sticky; top:74px; background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:12px 12px 10px; max-height:calc(100vh - 100px);
    display:flex; flex-direction:column; gap:9px;
  }
  @media (max-width:900px){ .projets-menu{ position:static; max-height:none; } }
  .projets-menu-titre{
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em;
    color:var(--accent); margin:0;
  }
  .projets-filtres{ display:flex; gap:4px; flex-wrap:wrap; }
  .projets-filtres button{
    font-size:11px; font-weight:700; padding:5px 10px; border-radius:20px;
    background:var(--bg); color:var(--muted); border:1px solid var(--border);
  }
  .projets-filtres button[aria-pressed="true"]{
    background:var(--accent); color:var(--blanc); border-color:var(--accent);
  }
  .projets-option{
    display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted);
    cursor:pointer; padding:1px 2px;
  }
  .projets-liste{ overflow-y:auto; display:flex; flex-direction:column; gap:2px; margin:0 -4px; padding:0 4px; }
  .projets-liste a{
    display:flex; align-items:center; gap:7px; text-decoration:none; color:var(--text);
    font-size:12.5px; font-weight:700; padding:7px 8px; border-radius:8px; line-height:1.25;
  }
  .projets-liste a:hover{ background:var(--bg); }
  .projets-liste a.actif{ background:var(--accent-tint); color:var(--tint-ink); }
  .projets-liste .nom{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .projets-liste .compte{
    flex:0 0 auto; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:20px;
    background:var(--ok-tint); color:var(--ok);
  }
  .projets-liste .compte.reste{ background:var(--maybe-tint); color:var(--maybe); }
  .projets-liste .marque-reco{
    flex:0 0 auto; width:7px; height:7px; border-radius:50%; background:var(--accent);
    opacity:.55;
  }
  .projets-menu-pied{ display:flex; gap:5px; border-top:1px solid var(--border); padding-top:8px; }
  .projets-menu-pied button{ font-size:11px; padding:5px 9px; background:var(--bg); color:var(--muted); }
  .projets-menu-pied button:hover{ background:var(--accent-tint); color:var(--tint-ink); }

  /* En-tête de carte cliquable : on replie ce qu'on ne regarde pas. */
  .tournee-head{ cursor:pointer; user-select:none; }
  .tournee-head .caret{
    margin-left:auto; flex:0 0 auto; color:var(--muted); font-size:12px;
    transition:transform .15s ease;
  }
  .tournee-card[data-replie="1"] .caret{ transform:rotate(-90deg); }
  .tournee-card[data-replie="1"] .carte-corps{ display:none; }
  .tournee-resume{
    font-size:11.5px; font-weight:700; color:var(--muted); white-space:nowrap;
  }
  .tournee-resume b{ color:var(--maybe); }

  /* Liens personnels : une ligne par personne, et une seule. */
  .perso-ligne{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:8px 0; border-bottom:1px solid var(--border);
  }
  .perso-ligne:last-child{ border-bottom:none; }

  button{
    cursor:pointer; border:none; border-radius:8px; font-size:13px; font-weight:700;
    padding:9px 15px; transition:background .15s, transform .1s; font-family:inherit;
  }

  .tournee-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:0; margin-bottom:20px; overflow:hidden;
  }
  .tournee-head{
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
    padding:16px 20px 0;
  }
  .tournee-name{font-family:var(--font-display); font-size:18px; font-weight:500;}
  .tournee-meta{color:var(--muted); font-size:12px; font-weight:700; padding:2px 20px 14px; border-bottom:1px solid var(--border);}
  /* Alternance de blancs : sur seize lignes de personnes, l'œil perdait la ligne
     qu'il suivait entre le nom et les boutons du bout. */
  .dispo-row{display:flex; align-items:center; gap:12px; padding:var(--row-pad) 20px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .dispo-row:nth-of-type(even){background:var(--row-alt);}
  .role-subheader{
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    padding:10px 20px 4px;
  }
  /* Le statut de réponse est l'information qu'on vient chercher : il passe de
     11 px à 14 px, sur une largeur fixe pour que la colonne s'aligne. */
  .dispo-statut{width:130px; font-size:14px; font-weight:800; white-space:nowrap;}
  .suivi-resume{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .suivi-resume .pct{font-family:var(--font-display); font-size:26px; color:var(--accent); font-weight:500;}
  .suivi-resume .jauge{flex:1; min-width:200px;}
  .suivi-resume .detail{font-size:12px; color:var(--muted); margin-top:6px; font-weight:600;}
  
</style>

<body>
<div class="wrap">
  <div class="co-page-head co-fade">
    <div>
      <h1>Demandes titulaires</h1>
      <p class="subtitle">Suis qui a répondu, projet par projet. Les musicien·nes titulaires sont sollicité·es d'office ; les technicien·nes le sont sur les tournées seulement — en studio, on les ajoute à la main, séance par séance.</p>
    </div>
  </div>

  <!-- Un pourcentage ne dit pas quoi faire : « 0 % » sur deux demandes reste
       « 0 % » qu'il manque une réponse ou vingt. Ce qu'on vient chercher ici,
       c'est combien de personnes sont encore en attente, et lesquelles n'ont
       jamais ouvert leur lien — ce ne sont pas les mêmes relances. -->
  <div class="co-card co-pad-lg co-fade" id="resumeCard" style="margin-bottom:20px; display:none;">
    <div class="co-stats co-stats-sm co-stats-charte" id="resumeChiffres" style="margin-bottom:14px;"></div>
    <div class="suivi-resume">
      <div class="jauge">
        <div class="detail" id="resumeDetail"></div>
      </div>
      <button type="button" class="co-btn tonic md" id="relancerTousBtn" title="Ouvrir la première relance de chaque personne encore en attente">Relancer les retardataires</button>
    </div>
  </div>

  <div class="suivi-colonnes">
    <aside class="projets-menu co-fade" id="projetsMenu" hidden>
      <p class="projets-menu-titre">Projets</p>
      <div class="projets-filtres" id="projetsFiltres">
        <button type="button" data-filtre-nature="tous" aria-pressed="true">Tous</button>
        <button type="button" data-filtre-nature="tournee" aria-pressed="false">Tournées</button>
        <button type="button" data-filtre-nature="recording" aria-pressed="false">Recordings</button>
      </div>
      <label class="projets-option">
        <input type="checkbox" id="filtreEnAttente"> Seulement ceux où il manque des réponses
      </label>
      <div class="projets-liste" id="projetsListe"></div>
      <div class="projets-menu-pied">
        <button type="button" id="toutReplierBtn">Tout replier</button>
        <button type="button" id="toutDeplierBtn">Tout déplier</button>
      </div>
    </aside>
    <div id="holder"><div class="empty-hint">Chargement…</div></div>
  </div>
</div>

<script>
let tourneesCache = [];
let musiciansCache = [];
let techniciansCache = [];
let dispoDemandesCache = [];

function loadTournees(){ return tourneesCache; }
function loadMusicians(){ return musiciansCache; }
function loadTechnicians(){ return techniciansCache; }
function loadDispoDemandes(){ return dispoDemandesCache; }

function fmtDateFR(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  const months = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `${parseInt(d,10)} ${months[parseInt(m,10)-1]} ${y}`;
}

// Lien unique de l'espace personnel : il regroupe les disponibilités, les
// infos et les remplaçant·es. Le jeton de demande y est accepté au même titre
// que le jeton permanent, donc les liens déjà envoyés restent valables.
function dispoLinkUrl(demandeId){
  return lienPublic('mon-espace.html', 'token=' + encodeURIComponent(demandeId));
}

function normalizeWhatsappPhone(phone){
  let digits = (phone || '').replace(/[^\d+]/g, '');
  if(digits.startsWith('+')) digits = digits.slice(1);
  else if(digits.startsWith('0') && digits.length === 10) digits = '33' + digits.slice(1);
  return digits;
}

// Les liens des titulaires existent d'office.
//
// Il fallait auparavant les créer un par un, tournée par tournée : sur vingt
// personnes et trois tournées, soixante clics avant de pouvoir seulement
// commencer à demander les dispos — et un lien oublié, c'est quelqu'un qu'on
// ne relance jamais parce qu'il n'apparaît nulle part.
//
// Ils sont donc posés au chargement, pour chaque titulaire et chaque tournée à
// venir qui a au moins une date à répondre. L'opération est sans effet si les
// liens existent déjà, et se fait en une seule écriture. Les remplaçant·es
// gardent leur régime : on ne les sollicite qu'à la demande.
// Qui reçoit une demande d'office sur un projet ?
//
// Sur une tournée : tous les titulaires, musicien·nes comme technicien·nes —
// la tournée part avec son équipe complète.
//
// Sur un recording : les musicien·nes seulement. Une séance de studio ne
// mobilise pas la régie plateau, la lumière ni le son de façade ; elle demande
// un·e ingé son, parfois une direction artistique, et c'est tout. Réclamer
// leurs dispo à quinze technicien·nes qui ne viendront pas, c'est du bruit pour
// eux et une liste illisible pour nous. Celles et ceux qui sont concerné·es
// s'ajoutent à la main, par le champ de recherche en bas de carte.
function titulairesPourProjet(tournee){
  const musiciens = loadMusicians()
    .filter(m=> (m.statutPoste || 'titulaire') === 'titulaire').map(p=> ({ p, type:'musicien' }));
  if(estRecording(tournee)) return musiciens;
  return [
    ...musiciens,
    ...loadTechnicians().filter(t=> (t.statutPoste || 'titulaire') === 'titulaire').map(p=> ({ p, type:'technicien' })),
  ];
}

async function assurerLiensTitulaires(tourneesAVenir){
  const existantes = new Set(loadDispoDemandes().map(d=> `${d.tourneeId}:${d.personType}:${d.personId}`));
  const aCreer = [];
  tourneesAVenir.forEach(t=>{
    if(!(t.dates || []).some(d=> d.date && d.statut !== 'annulee')) return;
    titulairesPourProjet(t).forEach(({ p, type })=>{
      if(existantes.has(`${t.id}:${type}:${p.id}`)) return;
      aCreer.push({ id: genId('demande'), tourneeId: t.id, personType: type, personId: p.id, dates: [] });
    });
  });
  if(aCreer.length === 0) return 0;

  const { error } = await CurieuxDB.syncCollection('dispo_demandes', aCreer);
  if(error){
    console.warn('[suivi-dispo] création des liens titulaires', error.message);
    return 0;
  }
  dispoDemandesCache = [...dispoDemandesCache, ...aCreer];
  return aCreer.length;
}

async function generateDispoLink(tourneeId, personType, personId, dates){
  const demandes = loadDispoDemandes();
  const existing = demandes.find(d=> d.tourneeId === tourneeId && d.personType === personType && d.personId === personId);
  if(existing) return existing;
  const entry = { id: genId('demande'), tourneeId, personType, personId, dates: dates || [] };
  demandes.push(entry);
  dispoDemandesCache = demandes;
  const { error } = await CurieuxDB.upsertOne('dispo_demandes', entry);
  if(error){
    dispoDemandesCache = dispoDemandesCache.filter(d=> d.id !== entry.id);
    alert("La création du lien a échoué, réessaie. (" + error.message + ")");
    return null;
  }
  return entry;
}

// Liste des cases à cocher pour une tournée donnée — extrait à part pour pouvoir la
// regénérer seule quand on change de tournée dans le menu déroulant (voir bindDatesPanel).
function datesChecklistHtml(tourneeId, checkedIds){
  const tournee = loadTournees().find(t=> t.id === tourneeId);
  const dates = (tournee && tournee.dates || []).filter(d=> d.date && d.statut !== 'annulee')
    .slice().sort((a,b)=> a.date.localeCompare(b.date));
  if(dates.length === 0) return `<div class="empty-hint" style="padding:6px 0;">Aucune date pour l'instant.</div>`;
  const checkedSet = checkedIds ? new Set(checkedIds) : null;
  return dates.map(d=> `
    <label style="display:flex; align-items:center; gap:6px; font-size:12px; padding:3px 0;">
      <input type="checkbox" data-date-checkbox value="${escapeAttr(d.id)}" ${(!checkedSet || checkedSet.has(d.id)) ? 'checked' : ''}>
      ${escapeHtml(fmtDateFR(d.date))}${d.ville ? ' · '+escapeHtml(d.ville) : ''}
    </label>
  `).join('');
}

// Panneau de sélection de dates précises. checkedIds=null = pas de restriction connue,
// tout est coché par défaut (flux "nouveau lien") ; un tableau (même vide) coche
// exactement ces dates (flux "modifier les dates" d'un lien existant). dates:[] envoyé à
// la sauvegarde = pas de restriction (valable pour les dates ajoutées plus tard) — on ne
// renvoie [] que si TOUT est coché. allowTourneeSwitch affiche un menu déroulant pour
// choisir la tournée (utile pour générer un lien sans être limité à la tournée de la
// carte en cours) — pas proposé en modification d'un lien existant, où la tournée est
// fixée par le lien lui-même.
function remplacantDatesPanelHtml(tourneeId, checkedIds, confirmLabel, allowTourneeSwitch){
  const tourneeSelectHtml = allowTourneeSwitch ? `
    <select data-tournee-select style="width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:8px; font-size:12px; background:var(--card); color:var(--text); font-family:inherit; margin-bottom:8px;">
      ${loadTournees().map(t=> `<option value="${escapeAttr(t.id)}" ${t.id===tourneeId?'selected':''}>${escapeHtml((t.nom || 'Tournée sans nom') + suffixeProjetTexte(t))}</option>`).join('')}
    </select>
  ` : '';
  return `
    ${tourneeSelectHtml}
    <div style="font-size:11.5px; color:var(--muted); margin-bottom:6px;">Dates proposées à cette personne :</div>
    <div data-dates-checklist>${datesChecklistHtml(tourneeId, checkedIds)}</div>
    <div style="display:flex; gap:8px; margin-top:8px;">
      <button type="button" class="co-btn ghost sm" data-toggle-all-dates>Tout (dé)cocher</button>
      <button type="button" class="co-btn secondary sm" data-confirm-gen-dates>${escapeHtml(confirmLabel || 'Générer le lien')}</button>
    </div>
  `;
}

// Câble les interactions communes d'un panneau de dates (bascule de tournée, tout cocher,
// confirmation) une fois injecté dans le DOM. onConfirm(selectedTourneeId, dates) reçoit
// dates=[] quand tout est coché (pas de restriction) ; selectedTourneeId est null si le
// panneau n'a pas de menu déroulant de tournée (flux "modifier les dates").
function bindDatesPanel(panel, onConfirm){
  const tourneeSelect = panel.querySelector('[data-tournee-select]');
  if(tourneeSelect) tourneeSelect.addEventListener('change', ()=>{
    panel.querySelector('[data-dates-checklist]').innerHTML = datesChecklistHtml(tourneeSelect.value, null);
  });
  const toggleAllBtn = panel.querySelector('[data-toggle-all-dates]');
  if(toggleAllBtn) toggleAllBtn.addEventListener('click', ()=>{
    const boxes = panel.querySelectorAll('[data-date-checkbox]');
    const allChecked = Array.from(boxes).every(b=> b.checked);
    boxes.forEach(b=> b.checked = !allChecked);
  });
  const confirmBtn = panel.querySelector('[data-confirm-gen-dates]');
  if(confirmBtn) confirmBtn.addEventListener('click', async ()=>{
    const boxes = Array.from(panel.querySelectorAll('[data-date-checkbox]'));
    const checked = boxes.filter(b=> b.checked).map(b=> b.value);
    const dates = (checked.length === boxes.length) ? [] : checked;
    confirmBtn.disabled = true; confirmBtn.textContent = '…';
    await onConfirm(tourneeSelect ? tourneeSelect.value : null, dates);
  });
}

// Recherche ponctuelle d'un·e remplaçant·e (musicien·ne, ou technicien·ne du pôle Régie)
// à qui générer un lien de dispo à la demande, en dehors des titulaires — même logique
// que la modale de tournees.html, adaptée à une carte par tournée sur cette page.
function renderAddRemplacantResults(tourneeId, query, holder){
  const q = (query || '').toLowerCase().trim();
  if(!q){ holder.innerHTML = ''; return; }

  const demandes = loadDispoDemandes();
  const alreadyDemanded = new Set(
    demandes.filter(d=> d.tourneeId === tourneeId).map(d=> `${d.personType}:${d.personId}`)
  );

  // Sur un recording, aucun·e technicien·ne n'a reçu de demande d'office : la
  // recherche doit donc les proposer tous, titulaires compris — c'est le seul
  // moyen d'ajouter l'ingé son de la séance. Sur une tournée, les titulaires
  // sont déjà dans la carte : on ne propose que les remplaçant·es de régie.
  const reco = estRecording(loadTournees().find(t=> t.id === tourneeId));
  const remplacantMusiciens = loadMusicians()
    .filter(m=> (m.statutPoste||'titulaire') === 'remplacant' && !alreadyDemanded.has(`musicien:${m.id}`))
    .map(m=> ({ person:m, personType:'musicien', roleLabel: m.instrument || 'Musicien·ne' }));
  const remplacantTechniciens = loadTechnicians()
    .filter(t=> !alreadyDemanded.has(`technicien:${t.id}`)
      && (reco || (t.pole === 'Régie générale' && (t.statutPoste||'titulaire') === 'remplacant')))
    .map(t=> ({ person:t, personType:'technicien', roleLabel: t.poste || 'Technicien·ne' }));

  const results = [...remplacantMusiciens, ...remplacantTechniciens].filter(r=>{
    const haystack = [r.person.prenom, r.person.nom, r.roleLabel].filter(Boolean).join(' ').toLowerCase();
    return haystack.includes(q);
  }).slice(0, 8);

  if(results.length === 0){
    holder.innerHTML = `<div class="empty-hint" style="padding:10px 4px;">Personne à ajouter sous ce nom.</div>`;
    return;
  }
  holder.innerHTML = results.map(r=> `
    <div data-remplacant-row data-person-type="${r.personType}" data-person-id="${escapeAttr(r.person.id)}" style="padding:7px 4px; border-bottom:1px solid var(--border);">
      <div style="display:flex; align-items:center; gap:10px;">
        <div style="flex:1; min-width:0;">
          <div style="font-weight:700; font-size:13px;">${escapeHtml(fullName(r.person))}</div>
          <div style="font-size:11.5px; color:var(--muted);">${escapeHtml(r.roleLabel)}</div>
        </div>
        <button type="button" class="co-btn secondary sm" data-toggle-dates>+ Générer</button>
      </div>
      <div data-dates-panel style="display:none; margin-top:8px; padding:8px 10px; background:var(--bg); border-radius:8px;"></div>
    </div>
  `).join('');

  holder.querySelectorAll('[data-toggle-dates]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const row = btn.closest('[data-remplacant-row]');
      const panel = row.querySelector('[data-dates-panel]');
      const opening = panel.style.display === 'none';
      holder.querySelectorAll('[data-dates-panel]').forEach(p=> p.style.display = 'none');
      if(!opening) return;
      panel.innerHTML = remplacantDatesPanelHtml(tourneeId, null, 'Générer le lien', true);
      panel.style.display = 'block';
      bindDatesPanel(panel, async (selectedTourneeId, dates)=>{
        await generateDispoLink(selectedTourneeId || tourneeId, row.dataset.personType, row.dataset.personId, dates);
        const searchInput = document.querySelector(`[data-remplacant-search][data-tournee="${tourneeId}"]`);
        if(searchInput) searchInput.value = '';
        render();
      });
    });
  });
}

function rowFor(tourneeId, person, personType, roleLabel, answerableDates){
  const demandes = loadDispoDemandes();
  const existing = demandes.find(d=> d.tourneeId === tourneeId && d.personType === personType && d.personId === person.id);
  const url = existing ? dispoLinkUrl(existing.id) : null;
  const dispo = person.disponibilites || {};
  // Si le lien est restreint à des dates précises, on ne compte que celles-là — sinon on
  // compare aux dates envoyées à tout le monde. Avant ce correctif, le statut se basait
  // uniquement sur "a déjà validé une fois" (lastRespondedAt), ce qui affichait "Nouvelles
  // dates" pour quelqu'un qui n'avait en réalité rempli qu'une partie de ses dispo — d'où
  // le calcul explicite du nombre de dates manquantes ci-dessous.
  const relevantDates = (existing && existing.dates && existing.dates.length > 0)
    ? answerableDates.filter(d=> existing.dates.includes(d.id))
    : answerableDates;
  const missingDates = existing ? relevantDates.filter(d=> !dispo[d.date]) : [];
  const answeredCount = relevantDates.length - missingDates.length;
  let statusHtml;
  if(!existing){
    statusHtml = '';
  } else if(relevantDates.length > 0 && missingDates.length === 0){
    statusHtml = `<span class="dispo-statut" style="color:var(--ok);">✓ Répondu</span>`;
  } else if(answeredCount > 0){
    statusHtml = `<span class="dispo-statut" style="color:var(--maybe);" title="${missingDates.length} date${missingDates.length>1?'s':''} pas encore renseignée${missingDates.length>1?'s':''}">◐ ${answeredCount}/${relevantDates.length} dates</span>`;
  } else {
    statusHtml = `<span class="dispo-statut" style="color:var(--muted);">En attente</span>`;
  }
  const tourneeObj = loadTournees().find(t=> t.id === tourneeId);
  let relanceHtml = '';
  if(existing && missingDates.length > 0){

    const relanceLabel = existing.lastReminderAt ? 'Relancer' : 'Première relance';

    } else {
      relanceHtml = `<button type="button" class="co-btn ghost sm" data-copy-relance="${escapeAttr(message)}" data-mark-reminder="${escapeAttr(existing.id)}" title="Copier un message de relance (pas de contact enregistré)"><svg width="12" height="12" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:3px;"><path d="M12 3.5a5 5 0 0 0-5 5v3.2c0 1-.4 2-1.1 2.7L5 15.5h14l-.9-1.1a4 4 0 0 1-1.1-2.7V8.5a5 5 0 0 0-5-5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path><path d="M9.5 18.5a2.5 2.5 0 0 0 5 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path></svg>${relanceLabel}</button>`;

  }
  const isRemplacant = (person.statutPoste || 'titulaire') === 'remplacant';
  // Les technicien·nes (titulaires ou remplaçant·es) peuvent être sollicité·es sur une
  // partie seulement des dates d'une tournée (contrairement aux musicien·nes titulaires,
  // engagé·es sur la tournée entière) — on leur propose donc toujours le choix des dates,
  // à la génération comme après coup. Les remplaçant·es (tout pupitre) gardent ce choix
  // aussi, puisqu'ils/elles ne sont jamais sollicité·es par défaut sur la tournée entière.

  const datesTag = existing && existing.dates && existing.dates.length > 0
    ? `<span style="font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:2px 7px; border-radius:20px; background:var(--border); color:var(--muted); vertical-align:middle;" title="Lien restreint à ${existing.dates.length} date${existing.dates.length>1?'s':''}">${existing.dates.length} date${existing.dates.length>1?'s':''}</span>`
    : '';
  return `
    <div data-demande-wrap="${existing ? escapeAttr(existing.id) : ''}">
      <div class="dispo-row">

          <div style="font-size:11.5px; color:var(--muted);">${escapeHtml(roleLabel)}</div>

        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">

            ? `<a class="co-btn ghost sm" href="${escapeAttr(url)}" target="_blank" rel="noopener" title="Ouvrir le lien tel que la personne le voit — pour vérifier ou y accéder rapidement"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:2px;"><path d="M9 6.5H6a2 2 0 0 0-2 2v9.5a2 2 0 0 0 2 2h9.5a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path><path d="M14 4.5h5.5V10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path><line x1="19.3" y1="4.7" x2="11.5" y2="12.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></line></svg> Ouvrir</a>
               <button type="button" class="co-btn ghost sm" data-copy-link="${escapeAttr(url)}"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:2px;"><rect x="3.5" y="5.5" width="12" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"></rect><rect x="7.5" y="2" width="12" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"></rect><line x1="10.5" y1="6.5" x2="16.5" y2="6.5" stroke="currentColor" stroke-width="1.4"></line><line x1="10.5" y1="10" x2="16.5" y2="10" stroke="currentColor" stroke-width="1.4"></line></svg> Copier</button>
               ${showDatesOption ? `<button type="button" class="co-btn ghost sm" data-toggle-edit-dates data-tournee="${escapeAttr(tourneeId)}" title="Modifier les dates proposées"><svg width="12" height="12" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:3px;"><rect x="3.5" y="5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"></rect><line x1="3.5" y1="9.5" x2="20.5" y2="9.5" stroke="currentColor" stroke-width="1.6"></line><line x1="8" y1="3" x2="8" y2="6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line><line x1="16" y1="3" x2="16" y2="6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line></svg>Dates</button>` : ''}
               <button type="button" class="co-btn ghost sm" data-delete-link="${escapeAttr(existing.id)}" title="Supprimer ce lien" style="color:var(--ko, #b23b2e);"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px;"><rect x="3.5" y="6.5" width="17" height="2" rx="1" fill="currentColor" stroke="none"></rect><rect x="9.5" y="9.5" width="1.6" height="9" rx="0.8" fill="currentColor" stroke="none"></rect><rect x="12.9" y="9.5" width="1.6" height="9" rx="0.8" fill="currentColor" stroke="none"></rect><path d="M9 6.5V4.3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2.2" fill="none" stroke="currentColor" stroke-width="1.6"></path><path d="M6.2 6.5l1 13.3a1.4 1.4 0 0 0 1.4 1.3h6.8a1.4 1.4 0 0 0 1.4-1.3l1-13.3" fill="none" stroke="currentColor" stroke-width="1.6"></path></svg></button>`

      ${(!existing && personType === 'technicien') ? `<div data-new-dates-panel style="display:none; margin:0 0 10px; padding:8px 10px; background:var(--bg); border-radius:8px;"></div>` : ''}
    </div>
  `;
}

async function removeDispoLink(demandeId){
  const { error } = await CurieuxDB.removeOne('dispo_demandes', demandeId);
  if(error) return { error };
  dispoDemandesCache = dispoDemandesCache.filter(d=> d.id !== demandeId);
  return { error: null };
}

async function updateDispoLinkDates(demandeId, dates){
  const entry = dispoDemandesCache.find(d=> d.id === demandeId);
  if(!entry) return;
  entry.dates = dates;
  await CurieuxDB.upsertOne('dispo_demandes', entry);
}

async function markReminderSent(demandeId){
  const entry = dispoDemandesCache.find(d=> d.id === demandeId);
  if(!entry) return;
  entry.lastReminderAt = new Date().toISOString();
  await CurieuxDB.upsertOne('dispo_demandes', entry);
}

// Avancement global des demandes, toutes tournées à venir confondues — la même
// règle que sur chaque ligne : une réponse est complète quand plus aucune date
// pertinente ne manque à la personne.
function renderResume(tournees){
  const carte = document.getElementById('resumeCard');
  const demandes = loadDispoDemandes();
  let total = 0, completes = 0, partielles = 0, jamaisOuvertes = 0, relancees = 0;
  const tourneesEnRetard = new Map();
  tournees.forEach(t=>{
    const answerable = (t.dates||[]).filter(d=> d.date && d.statut !== 'annulee');
    demandes.filter(d=> d.tourneeId === t.id).forEach(dem=>{
      const personne = (dem.personType === 'musicien' ? loadMusicians() : loadTechnicians())
        .find(x=> x.id === dem.personId);
      if(!personne) return;
      const dispo = personne.disponibilites || {};
      const pertinentes = (dem.dates && dem.dates.length)
        ? answerable.filter(d=> dem.dates.includes(d.id))
        : answerable;
      if(pertinentes.length === 0) return;
      total++;
      const manquantes = pertinentes.filter(d=> !dispo[d.date]).length;
      if(manquantes === 0){ completes++; return; }
      // Une personne qui n'a rien répondu du tout et une personne qui a répondu
      // à moitié n'appellent pas la même relance : on les compte à part.
      if(manquantes === pertinentes.length) jamaisOuvertes++; else partielles++;
      if(dem.lastReminderAt) relancees++;
      tourneesEnRetard.set(t.id, (tourneesEnRetard.get(t.id) || 0) + 1);
    });
  });
  if(total === 0){ carte.style.display = 'none'; return; }
  carte.style.display = '';

  const attente = total - completes;
  const tuile = (nombre, libelle)=>
    `<div class="co-stat"><div class="co-stat-num">${nombre}</div><div class="co-stat-label">${libelle}</div></div>`;
  document.getElementById('resumeChiffres').innerHTML = [
    tuile(attente, attente > 1 ? 'personnes à relancer' : 'personne à relancer'),
    tuile(jamaisOuvertes, jamaisOuvertes > 1 ? 'sans aucune réponse' : 'sans aucune réponse'),
    tuile(partielles, partielles > 1 ? 'réponses partielles' : 'réponse partielle'),
    tuile(completes, completes > 1 ? 'réponses complètes' : 'réponse complète'),
  ].join('');

  const detail = [];
  if(attente === 0) detail.push('Tout le monde a répondu.');
  else {
    const noms = [...tourneesEnRetard.entries()]
      .sort((a, b)=> b[1] - a[1])
      .map(([id, n])=>{
        const t = tournees.find(x=> x.id === id);
        return `${(t && t.nom) || 'Tournée'} (${n})`;
      });
    detail.push('En attente sur : ' + noms.join(' · ') + '.');
    if(relancees) detail.push(`${relancees} déjà relancée${relancees > 1 ? 's' : ''} au moins une fois.`);
  }
  document.getElementById('resumeDetail').textContent = detail.join(' ');
}

async function relancerRetardataires(){
  const demandes = loadDispoDemandes();
  const today = new Date().toISOString().slice(0, 10);
  const lignes = [];
  loadTournees().forEach(t=>{
    const answerable = (t.dates||[]).filter(d=> d.date && d.statut !== 'annulee');
    if(answerable.length === 0 || answerable.every(d=> d.date < today)) return;
    demandes.filter(d=> d.tourneeId === t.id).forEach(dem=>{
      const personne = (dem.personType === 'musicien' ? loadMusicians() : loadTechnicians())
        .find(x=> x.id === dem.personId);
      if(!personne) return;
      const dispo = personne.disponibilites || {};
      const pertinentes = (dem.dates && dem.dates.length)
        ? answerable.filter(d=> dem.dates.includes(d.id))
        : answerable;
      const manquantes = pertinentes.filter(d=> !dispo[d.date]);
      if(manquantes.length === 0) return;
      lignes.push(`${fullName(personne)} — ${t.nom || 'Tournée'} — manque : `
        + manquantes.map(d=> fmtDateFR(d.date)).join(', ')
        + ` — ${dispoLinkUrl(dem.id)}`);
    });
  });
  const btn = document.getElementById('relancerTousBtn');
  if(lignes.length === 0){ btn.textContent = '✓ Personne à relancer'; return; }
  try{
    await navigator.clipboard.writeText(lignes.join('\n'));
    btn.textContent = `✓ ${lignes.length} relance${lignes.length>1?'s':''} copiée${lignes.length>1?'s':''}`;
  }catch(e){
    btn.textContent = 'Copie impossible — relance ligne par ligne';
  }
}
document.getElementById('relancerTousBtn').addEventListener('click', relancerRetardataires);

/* Où en est un projet : combien de personnes sollicitées, combien ont fini.
 * Sert au sommaire (le compteur à droite de chaque ligne) et au résumé posé
 * sur la barre de titre d'une carte repliée — c'est ce qui permet de replier
 * sans rien perdre de vue. */
function avancementProjet(t){
  const answerable = (t.dates || []).filter(d=> d.date && d.statut !== 'annulee');
  let total = 0, repondu = 0;
  loadDispoDemandes().filter(d=> d.tourneeId === t.id).forEach(dem=>{
    const personne = (dem.personType === 'musicien' ? loadMusicians() : loadTechnicians())
      .find(x=> x.id === dem.personId);
    if(!personne) return;
    const pertinentes = (dem.dates && dem.dates.length)
      ? answerable.filter(d=> dem.dates.includes(d.id))
      : answerable;
    if(pertinentes.length === 0) return;
    total++;
    const dispo = personne.disponibilites || {};
    if(pertinentes.every(d=> dispo[d.date])) repondu++;
  });
  return { total, repondu, reste: total - repondu };
}

/* Repli des cartes.
 *
 * Au-delà de quatre projets, tout déplier fait une page de plusieurs milliers
 * de pixels où l'on ne trouve plus rien : on replie d'office et le sommaire
 * devient le point d'entrée. Le choix de chacun est retenu d'une visite à
 * l'autre, pour ne pas rouvrir vingt fois la même carte. */
const REPLI_CLE = 'suiviDispoReplis';
let repliManuel = (()=>{ try{ return JSON.parse(localStorage.getItem(REPLI_CLE) || '{}'); }catch(e){ return {}; } })();
let repliDefaut = false;
function estReplie(id){
  return Object.prototype.hasOwnProperty.call(repliManuel, id) ? !!repliManuel[id] : repliDefaut;
}
function poserRepli(id, valeur){
  repliManuel[id] = valeur;
  try{ localStorage.setItem(REPLI_CLE, JSON.stringify(repliManuel)); }catch(e){}
}

// Filtres du sommaire, en mémoire seulement : ils répondent à « qu'est-ce que
// je regarde là, maintenant », pas à une préférence durable.
let filtreNature = 'tous';
let filtreEnAttenteSeul = false;

function projetsVisibles(liste){
  return liste.filter(t=>{
    if(filtreNature === 'recording' && !estRecording(t)) return false;
    if(filtreNature === 'tournee' && estRecording(t)) return false;
    if(filtreEnAttenteSeul && avancementProjet(t).reste === 0) return false;
    return true;
  });
}

/* Le lien personnel permanent appartient à la PERSONNE, pas au projet.
 *
 * mon-espace.html regroupe déjà toutes les demandes en cours de quelqu'un :
 * un seul lien suffit, quel que soit le nombre de projets. Il figurait pourtant
 * sur chaque ligne de chaque carte — avec douze tournées et dix recordings, la
 * même URL apparaissait vingt-deux fois pour la même personne, ce qui laissait
 * croire qu'il fallait en envoyer un par projet. Il est donc sorti des cartes
 * pour ce volet, où chaque personne figure une fois et une seule. */
function renderLiensPersonnels(projets){
  const enCours = new Map();          // `${type}:${id}` -> { personne, type, projets:Set }
  const idsProjets = new Set(projets.map(t=> t.id));
  loadDispoDemandes().forEach(dem=>{
    if(!idsProjets.has(dem.tourneeId)) return;
    const personne = (dem.personType === 'musicien' ? loadMusicians() : loadTechnicians())
      .find(x=> x.id === dem.personId);
    if(!personne) return;
    const cle = `${dem.personType}:${dem.personId}`;
    if(!enCours.has(cle)) enCours.set(cle, { personne, type: dem.personType, projets: new Set() });
    enCours.get(cle).projets.add(dem.tourneeId);
  });
  if(enCours.size === 0) return '';

  const lignes = [...enCours.values()]
    .sort((a, b)=> fullName(a.personne).localeCompare(fullName(b.personne)))
    .map(({ personne, type, projets: p })=> `
      <div class="perso-ligne" data-perso-nom="${escapeAttr(fullName(personne).toLowerCase())}">
        <div style="flex:1; min-width:150px;">
          <div style="font-weight:700; font-size:13px;">${escapeHtml(fullName(personne))}</div>
          <div style="font-size:11.5px; color:var(--muted);">${p.size} projet${p.size>1?'s':''} en cours</div>
        </div>
        <button type="button" class="co-btn ghost sm" data-lien-permanent
          data-person-type="${type}" data-person-id="${escapeAttr(personne.id)}"
          title="Copier le lien personnel de ${escapeAttr(fullName(personne))} — il couvre tous ses projets et survit à la suppression de l'un d'eux">Copier son lien</button>
      </div>`).join('');

  return `
    <div class="tournee-card" data-tournee-id="__perso" id="projet-__perso" data-replie="1">
      <div class="tournee-head" data-replier="__perso" role="button" tabindex="0" aria-expanded="false">
        <div class="tournee-name">Liens personnels</div>
        <span class="tournee-resume">${enCours.size} personne${enCours.size>1?'s':''}</span>
        <span class="caret" aria-hidden="true">▾</span>
      </div>
      <div class="carte-corps">
        <div class="tournee-meta">Un seul lien par personne, valable pour tous ses projets — c'est celui qu'on envoie. La page qu'il ouvre liste elle-même les demandes en cours.</div>
        <input type="text" id="recherchePerso" placeholder="Chercher une personne…"
          style="width:100%; padding:9px 11px; margin-bottom:6px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--bg); color:var(--text); font-family:inherit; box-sizing:border-box;">
        ${lignes}
      </div>
    </div>`;
}

/* Le sommaire des projets, à gauche.
 *
 * Il porte trois choses : où il manque des réponses (le compteur), comment y
 * aller (le lien d'ancre, qui déplie la carte au passage), et de quoi réduire
 * la liste quand elle compte vingt entrées. */
function renderSommaire(tous, visibles){
  const menu = document.getElementById('projetsMenu');
  const liste = document.getElementById('projetsListe');
  if(!menu || !liste) return;
  menu.hidden = tous.length < 2;          // sous deux projets, un sommaire est du bruit
  if(menu.hidden) return;

  const idsVisibles = new Set(visibles.map(t=> t.id));
  liste.innerHTML = tous.map(t=>{
    const av = avancementProjet(t);
    const compte = av.reste
      ? `<span class="compte reste" title="${av.reste} personne${av.reste>1?'s':''} n'a pas fini de répondre">${av.reste}</span>`
      : `<span class="compte" title="Tout le monde a répondu">✓</span>`;
    // Un projet écarté par le filtre reste dans le sommaire, en retrait : on
    // veut voir qu'il existe, et retrouver son compteur sans changer de filtre.
    return `<a href="#projet-${escapeAttr(t.id)}" data-aller="${escapeAttr(t.id)}"
      style="${idsVisibles.has(t.id) ? '' : 'opacity:.4;'}">
      ${estRecording(t) ? '<span class="marque-reco" title="Recording"></span>' : ''}
      <span class="nom">${escapeHtml(t.nom || 'Sans nom')}</span>${compte}
    </a>`;
  }).join('');

  // Un clic dans le sommaire déplie la carte visée : arriver sur un titre
  // replié n'apprendrait rien.
  liste.querySelectorAll('[data-aller]').forEach(a=>{
    a.addEventListener('click', ()=>{
      const id = a.dataset.aller;
      poserRepli(id, false);
      const carte = document.getElementById('projet-' + id);
      if(carte){
        carte.dataset.replie = '0';
        const tete = carte.querySelector('[data-replier]');
        if(tete) tete.setAttribute('aria-expanded', 'true');
      }
      liste.querySelectorAll('a').forEach(x=> x.classList.remove('actif'));
      a.classList.add('actif');
    });
  });
}

function render(){
  const tournees = loadTournees();
  const holder = document.getElementById('holder');
  if(tournees.length === 0){
    holder.innerHTML = `<div class="empty-hint">Aucune tournée pour l'instant — crée-en une dans <a href="tournees.html">Tournées</a>.</div>`;
    return;
  }

  const titulaireMusiciens = loadMusicians().filter(m=> (m.statutPoste||'titulaire') === 'titulaire')
    .sort((a,b)=> fullName(a).localeCompare(fullName(b)));
  const titulaireTechniciens = loadTechnicians().filter(t=> (t.statutPoste||'titulaire') === 'titulaire')
    .slice().sort((a,b)=> fullName(a).localeCompare(fullName(b)));

  // Une tournée "passée" (toutes ses dates derrière nous) est repliée dans une
  // section à part, pour ne pas rendre la page illisible au fil des saisons
  // (même règle que tournees.html).
  const today = new Date().toISOString().slice(0, 10);
  const isPastTournee = tr => (tr.dates||[]).length > 0 && (tr.dates||[]).every(d=> d.date && d.date < today);
  const upcomingTournees = tournees.filter(t=> !isPastTournee(t));
  const pastTournees = tournees.filter(isPastTournee);

  const renderTourneeCard = (t) => {
    const reco = estRecording(t);
    const answerableDates = (t.dates||[]).filter(d=> d.date && d.statut !== 'annulee');
    const demandes = loadDispoDemandes();
    const dejaSollicites = new Set(
      demandes.filter(d=> d.tourneeId === t.id).map(d=> `${d.personType}:${d.personId}`)
    );
    const remplacantMusiciens = loadMusicians()
      .filter(m=> (m.statutPoste||'titulaire') === 'remplacant' && dejaSollicites.has(`musicien:${m.id}`))
      .sort((a,b)=> fullName(a).localeCompare(fullName(b)));
    // Sur un recording, aucun·e technicien·ne n'est sollicité·e d'office : on ne
    // liste donc que celles et ceux à qui on a déjà demandé quelque chose,
    // titulaires compris. Sur une tournée, les titulaires sont là par défaut.
    const technicienTitulairesAffiches = reco
      ? titulaireTechniciens.filter(p=> dejaSollicites.has(`technicien:${p.id}`))
      : titulaireTechniciens;
    const remplacantTechniciens = loadTechnicians()
      .filter(p=> (p.statutPoste||'titulaire') === 'remplacant' && dejaSollicites.has(`technicien:${p.id}`))
      .sort((a,b)=> fullName(a).localeCompare(fullName(b)));
    // Les recordings créés avant ce changement ont reçu des demandes pour tous
    // les technicien·nes titulaires : elles sont là sans que personne l'ait
    // décidé. On propose de les retirer en bloc — mais seulement celles restées
    // sans la moindre réponse, jamais un travail déjà fait.
    const technicienSansReponse = !reco ? [] : demandes.filter(dem=>{
      if(dem.tourneeId !== t.id || dem.personType !== 'technicien') return false;
      const p = loadTechnicians().find(x=> x.id === dem.personId);
      if(!p || (p.statutPoste || 'titulaire') !== 'titulaire') return false;
      const dispo = p.disponibilites || {};
      const pertinentes = (dem.dates && dem.dates.length)
        ? answerableDates.filter(d=> dem.dates.includes(d.id)) : answerableDates;
      return pertinentes.every(d=> !dispo[d.date]);
    });
    const musicienRows = [
      ...titulaireMusiciens.map(m=> rowFor(t.id, m, 'musicien', m.instrument || 'Musicien·ne', answerableDates)),
      ...remplacantMusiciens.map(m=> rowFor(t.id, m, 'musicien', m.instrument || 'Musicien·ne', answerableDates)),
    ].join('');
    const technicienRows = [
      ...technicienTitulairesAffiches.map(p=> rowFor(t.id, p, 'technicien', p.poste || 'Technicien·ne', answerableDates)),
      ...remplacantTechniciens.map(p=> rowFor(t.id, p, 'technicien', p.poste || 'Technicien·ne', answerableDates)),
    ].join('');
    const rows = `
      ${musicienRows ? `<div class="role-subheader">Musicien·nes</div>${musicienRows}` : ''}
      ${technicienRows ? `<div class="role-subheader">Technicien·nes</div>${technicienRows}` : ''}
    `;
    const av = avancementProjet(t);
    const replie = estReplie(t.id) ? '1' : '0';
    return `
      <div class="tournee-card" data-tournee-id="${escapeAttr(t.id)}" id="projet-${escapeAttr(t.id)}" data-replie="${replie}">
        <div class="tournee-head" data-replier="${escapeAttr(t.id)}" role="button" tabindex="0"
             aria-expanded="${replie === '1' ? 'false' : 'true'}">
          <div class="tournee-name">${escapeHtml(t.nom || 'Tournée sans nom')}${pastilleProjetHtml(t)}</div>
          <span class="tournee-resume">${av.total === 0 ? 'personne sollicité·e'
            : (av.reste ? `<b>${av.reste} en attente</b> · ${av.repondu}/${av.total} répondu` : `${av.total} réponse${av.total>1?'s':''} complète${av.total>1?'s':''}`)}</span>
          <span class="caret" aria-hidden="true">▾</span>
        </div>
        <div class="carte-corps">
          <div class="tournee-meta">${answerableDates.length} ${reco ? 'séance' : 'date'}${answerableDates.length>1?'s':''}
            <button type="button" class="co-btn secondary sm" style="margin-left:10px;" data-copy-all="${escapeAttr(t.id)}"><svg width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:2px;"><rect x="3.5" y="5.5" width="12" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"></rect><rect x="7.5" y="2" width="12" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"></rect><line x1="10.5" y1="6.5" x2="16.5" y2="6.5" stroke="currentColor" stroke-width="1.4"></line><line x1="10.5" y1="10" x2="16.5" y2="10" stroke="currentColor" stroke-width="1.4"></line></svg> Copier tous les liens</button>
          </div>
          ${reco && technicienSansReponse.length ? `<div class="empty-hint" style="text-align:left; padding:9px 12px; margin-bottom:10px;">
            ${technicienSansReponse.length} technicien·ne${technicienSansReponse.length>1?'s ont':' a'} reçu une demande sur ce recording, avant qu'on cesse de les solliciter d'office. ${technicienSansReponse.length>1?'Aucune n\'a':'Elle n\'a'} encore répondu.
            <button type="button" class="co-btn ghost sm" style="margin-left:8px;" data-purger-techs="${escapeAttr(t.id)}">Retirer ${technicienSansReponse.length>1?'ces demandes':'cette demande'}</button>
          </div>` : ''}
          ${(musicienRows || technicienRows) ? rows : `<div class="empty-hint">Personne n'est encore sollicité·e sur ${reco ? 'ce recording' : 'cette tournée'}.</div>`}
          <div style="margin-top:12px; padding-top:12px; border-top:1px solid var(--border);">
            <input type="text" data-remplacant-search data-tournee="${escapeAttr(t.id)}" placeholder="${reco ? 'Ajouter un·e technicien·ne ou remplaçant·e à la demande…' : 'Ajouter un·e remplaçant·e à la demande…'}" style="width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--bg); color:var(--text); font-family:inherit; box-sizing:border-box;">
            <div data-remplacant-results data-tournee="${escapeAttr(t.id)}" style="margin-top:6px;"></div>
          </div>
        </div>
      </div>
    `;
  };

  renderResume(upcomingTournees);

  // Au-delà de quatre projets, on replie d'office : c'est le seuil à partir
  // duquel la page cesse de se parcourir d'un coup d'œil.
  repliDefaut = upcomingTournees.length > 4;

  const visibles = projetsVisibles(upcomingTournees);
  renderSommaire(upcomingTournees, visibles);

  const upcomingHtml = visibles.length
    ? visibles.map(renderTourneeCard).join('')
    : (upcomingTournees.length
        ? `<div class="empty-hint">Aucun projet ne correspond au filtre — décoche ou choisis « Tous » à gauche.</div>`
        : (pastTournees.length ? `<div class="empty-hint">Aucun projet à venir — ${pastTournees.length} projet${pastTournees.length>1?'s':''} passé${pastTournees.length>1?'s':''} plus bas.</div>` : ''));
  const pastHtml = pastTournees.length
    ? `<details style="margin-top:20px;">
        <summary style="cursor:pointer; font-weight:700; color:var(--muted); padding:10px 4px;">Projets passés (${pastTournees.length})</summary>
        ${pastTournees.map(renderTourneeCard).join('')}
      </details>`
    : '';
  holder.innerHTML = renderLiensPersonnels(upcomingTournees) + upcomingHtml + pastHtml;

  // Replier / déplier une carte, à la souris comme au clavier.
  holder.querySelectorAll('[data-replier]').forEach(tete=>{
    const basculer = ()=>{
      const carte = tete.closest('.tournee-card');
      const replie = carte.dataset.replie === '1';
      carte.dataset.replie = replie ? '0' : '1';
      tete.setAttribute('aria-expanded', replie ? 'true' : 'false');
      poserRepli(tete.dataset.replier, !replie);
    };
    tete.addEventListener('click', (e)=>{
      if(e.target.closest('button[data-copy-all]')) return;   // le bouton garde son rôle
      basculer();
    });
    tete.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); basculer(); }
    });
  });

  const recherchePerso = document.getElementById('recherchePerso');
  if(recherchePerso) recherchePerso.addEventListener('input', ()=>{
    const q = recherchePerso.value.toLowerCase().trim();
    holder.querySelectorAll('[data-perso-nom]').forEach(l=>{
      l.style.display = (!q || l.dataset.persoNom.includes(q)) ? '' : 'none';
    });
  });

  holder.querySelectorAll('[data-remplacant-search]').forEach(input=>{
    input.addEventListener('input', (e)=>{
      const tourneeId = input.dataset.tournee;
      const results = holder.querySelector(`[data-remplacant-results][data-tournee="${tourneeId}"]`);
      renderAddRemplacantResults(tourneeId, e.target.value, results);
    });
  });

  holder.querySelectorAll('[data-gen-link]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      btn.disabled = true; btn.textContent = '…';
      await generateDispoLink(btn.dataset.tournee, btn.dataset.personType, btn.dataset.personId);
      render();
    });
  });
  holder.querySelectorAll('[data-toggle-new-dates]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wrap = btn.closest('[data-demande-wrap]');
      const panel = wrap.querySelector('[data-new-dates-panel]');
      const opening = panel.style.display === 'none';
      holder.querySelectorAll('[data-new-dates-panel], [data-edit-dates-panel]').forEach(p=> p.style.display = 'none');
      if(!opening) return;
      panel.innerHTML = remplacantDatesPanelHtml(btn.dataset.tournee, null, 'Générer le lien', true);
      panel.style.display = 'block';
      bindDatesPanel(panel, async (selectedTourneeId, dates)=>{
        await generateDispoLink(selectedTourneeId || btn.dataset.tournee, btn.dataset.personType, btn.dataset.personId, dates);
        render();
      });
    });
  });
  holder.querySelectorAll('[data-copy-relance]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      navigator.clipboard.writeText(btn.dataset.copyRelance);
      btn.textContent = '✓ Copié';
      if(btn.dataset.markReminder) await markReminderSent(btn.dataset.markReminder);
      setTimeout(render, 1200);
    });
  });
  holder.querySelectorAll('a[data-mark-reminder]').forEach(a=>{
    a.addEventListener('click', ()=>{
      markReminderSent(a.dataset.markReminder).then(render);
    });
  });
  holder.querySelectorAll('[data-purger-techs]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const t = loadTournees().find(x=> x.id === btn.dataset.purgerTechs);
      if(!t) return;
      const answerable = (t.dates||[]).filter(d=> d.date && d.statut !== 'annulee');
      const aRetirer = loadDispoDemandes().filter(dem=>{
        if(dem.tourneeId !== t.id || dem.personType !== 'technicien') return false;
        const p = loadTechnicians().find(x=> x.id === dem.personId);
        if(!p || (p.statutPoste || 'titulaire') !== 'titulaire') return false;
        const dispo = p.disponibilites || {};
        const pertinentes = (dem.dates && dem.dates.length)
          ? answerable.filter(d=> dem.dates.includes(d.id)) : answerable;
        return pertinentes.every(d=> !dispo[d.date]);
      });
      if(!aRetirer.length) return;
      if(!confirm(`Retirer ${aRetirer.length} demande${aRetirer.length>1?'s':''} de dispo adressée${aRetirer.length>1?'s':''} aux technicien·nes sur « ${t.nom || 'ce recording'} » ?\n\nAucune n'a reçu de réponse. Tu pourras réajouter qui tu veux par le champ de recherche.`)) return;
      btn.disabled = true; btn.textContent = '…';
      for(const dem of aRetirer) await removeDispoLink(dem.id);
      render();
    });
  });

  holder.querySelectorAll('[data-delete-link]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      if(!confirm('Supprimer ce lien ? La personne ne pourra plus y accéder pour donner ou mettre à jour ses dispo.')) return;
      btn.disabled = true;
      const { error } = await removeDispoLink(btn.dataset.deleteLink);
      if(error){
        alert("La suppression a échoué, réessaie. (" + error.message + ")");
        btn.disabled = false;
        return;
      }
      render();
    });
  });
  holder.querySelectorAll('[data-toggle-edit-dates]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const wrap = btn.closest('[data-demande-wrap]');
      const demandeId = wrap.dataset.demandeWrap;
      const panel = wrap.querySelector('[data-edit-dates-panel]');
      const opening = panel.style.display === 'none';
      holder.querySelectorAll('[data-edit-dates-panel]').forEach(p=> p.style.display = 'none');
      if(!opening) return;
      const entry = loadDispoDemandes().find(d=> d.id === demandeId);
      const currentDates = (entry && entry.dates && entry.dates.length > 0) ? entry.dates : null;
      panel.innerHTML = remplacantDatesPanelHtml(btn.dataset.tournee, currentDates, 'Enregistrer les dates', false);
      panel.style.display = 'block';
      bindDatesPanel(panel, async (_selectedTourneeId, dates)=>{
        await updateDispoLinkDates(demandeId, dates);
        render();
      });
    });
  });
  // Lien permanent (I3) : contrairement au lien de dispo, il n'est rattaché à
  // aucune tournée. Supprimer une vieille tournée ne coupe donc plus l'accès
  // de la personne à ses infos et à sa liste de remplaçant·es.
  holder.querySelectorAll('[data-lien-permanent]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const libelle = btn.textContent;
      btn.disabled = true; btn.textContent = '…';
      const res = await CurieuxDB.ensureAccesPersonnel(btn.dataset.personId, btn.dataset.personType);
      btn.disabled = false;
      if(!res.token){
        btn.textContent = libelle;
        alert(res.migrationAbsente
          ? "Les liens permanents ne sont pas encore actifs sur cette base.\n\nApplique migrations.sql dans Supabase (SQL Editor) pour les activer."
          : "Le lien n'a pas pu être créé :\n\n" + ((res.error && res.error.message) || 'raison inconnue'));
        return;
      }
      const token = res.token;
      await navigator.clipboard.writeText(lienPublic('mon-espace.html', 'token=' + encodeURIComponent(token)));
      btn.textContent = '✓ Copié';
      setTimeout(()=>{ btn.textContent = libelle; }, 1600);
    });
  });

  holder.querySelectorAll('[data-copy-link]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      navigator.clipboard.writeText(btn.dataset.copyLink).then(()=>{
        const old = btn.textContent;
        btn.textContent = '✓ Copié';
        setTimeout(()=>{ btn.textContent = old; }, 1500);
      });
    });
  });
  holder.querySelectorAll('[data-copy-all]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const tourneeId = btn.dataset.copyAll;
      const people = [
        ...titulaireMusiciens.map(person=>({ person, personType:'musicien' })),
        ...titulaireTechniciens.map(person=>({ person, personType:'technicien' })),
      ];
      const lines = [];
      for(const { person, personType } of people){
        const entry = await generateDispoLink(tourneeId, personType, person.id);
        if(entry) lines.push(`${fullName(person)} : ${dispoLinkUrl(entry.id)}`);
      }
      render();
      navigator.clipboard.writeText(lines.join('\n')).then(()=>{
        alert(`${lines.length} lien${lines.length>1?'s':''} copié${lines.length>1?'s':''} dans le presse-papiers.`);
      });
    });
  });
}

injectCurieuxFonts();

applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);

async function initData(){
  [tourneesCache, musiciansCache, techniciansCache, dispoDemandesCache] = await Promise.all([
    CurieuxDB.fetchAll('tournees'),
    CurieuxDB.fetchAll('musiciens'),
    CurieuxDB.fetchAll('techniciens'),
    CurieuxDB.fetchAll('dispo_demandes'),
  ]);
  render();

  // Après un premier rendu — la page s'affiche tout de suite, les liens
  // manquants se posent derrière et déclenchent un second rendu s'il y en a.
  const aujourdhui = new Date().toISOString().slice(0, 10);
  const aVenir = tourneesCache.filter(t=>
    !((t.dates || []).length > 0 && (t.dates || []).every(d=> d.date && d.date < aujourdhui)));
  if(await assurerLiensTitulaires(aVenir)) render();
}
CurieuxDB.subscribe('tournees', ()=>{ CurieuxDB.fetchAll('tournees').then(list=>{ tourneesCache = list; curieuxRafraichir(render); }); });
CurieuxDB.subscribe('musiciens', ()=>{ CurieuxDB.fetchAll('musiciens').then(list=>{ musiciansCache = list; curieuxRafraichir(render); }); });
CurieuxDB.subscribe('techniciens', ()=>{ CurieuxDB.fetchAll('techniciens').then(list=>{ techniciansCache = list; curieuxRafraichir(render); }); });
CurieuxDB.subscribe('dispo_demandes', ()=>{ CurieuxDB.fetchAll('dispo_demandes').then(list=>{ dispoDemandesCache = list; curieuxRafraichir(render); }); });
initData();
</script>
</body>
</html>
