<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Mes infos</title>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/db.js"></script>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<!-- Page volontairement PUBLIQUE (pas de mot de passe d'accueil), comme
     dispo-titulaire.html : c'est le même lien personnel imprévisible
     (dispo_demandes.id) qui sert d'identification, pas un compte. -->
<script>try{ injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); injectBugReportWidget(); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  body{
    margin:0; font-family:'Host Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:20px 14px 80px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .brand-logo-img{height:30px; width:auto; display:block; margin:0 0 22px;}
  .state-box{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:22px 20px; text-align:center; color:var(--muted); font-size:14px;}

  .identity-banner{
    background:var(--champagne); border-radius:var(--radius); padding:14px 18px; margin-bottom:16px; font-size:14px;
  }
  .identity-banner strong{color:var(--accent-dark);}
  .identity-note{font-size:11.5px; color:var(--muted); margin-top:4px;}

  h1{font-size:20px; margin:0 0 6px; font-weight:900; letter-spacing:-.01em; font-family:'Ufficio Display', 'Host Grotesk', sans-serif;}
  input[type=text], input[type=date], select, textarea{
    padding:9px 11px; border:1px solid var(--border); border-radius:6px; font-size:14px;
    width:100%; background:var(--card); color:var(--text); font-family:inherit;
  }
  textarea{min-height:56px; resize:vertical;}
  input:focus, textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
  .field-row{display:flex; gap:12px; flex-wrap:wrap;}
  .field-row .field{flex:1 1 160px;}

  .section-label{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-dark);
    margin:18px 0 8px;
  }
  .section-label:first-child{margin-top:4px;}

  .save-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:20; display:none;
    background:var(--card); border-top:1px solid var(--border);
    box-shadow:0 -8px 24px rgba(0,0,0,.1);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .save-bar.visible{display:block;}
  .save-bar-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;}
  .save-status{font-size:12px; color:var(--muted); line-height:1.3;}
  .save-status.dirty{color:#b8792a; font-weight:700;}
  .save-status.saved{color:var(--ok); font-weight:700;}
  .save-btn{
    flex-shrink:0; padding:11px 20px; border-radius:9px; border:none; background:var(--accent-solid); color:#fff;
    font-size:13.5px; font-weight:800; cursor:pointer; font-family:inherit; transition:background .15s, opacity .15s;
  }
  .save-btn:disabled{opacity:.45; cursor:default;}
  .save-btn:not(:disabled):hover{background:var(--accent-dark);}

  .tier-badge{
    display:inline-block; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    padding:1px 6px; border-radius:20px; margin-left:6px; vertical-align:middle;
  }
  .tier-badge.obligatoire{background:var(--danger-tint); color:var(--danger);}
  .tier-badge.conseille{background:var(--accent-tint); color:var(--accent-dark);}
  .tier-badge.facultatif{background:var(--border); color:var(--muted);}

  .completion-banner{border-radius:10px; padding:11px 16px; margin-bottom:16px; font-size:13px; font-weight:600;}
  .completion-banner.missing{background:var(--danger-tint); color:var(--danger);}
  .completion-banner.ok{background:var(--ok-tint); color:var(--ok);}

  

  .rgpd-encart{
    background:var(--accent-tint); border-radius:8px; padding:12px 14px;
    font-size:12.5px; line-height:1.55; color:var(--text); margin:0 0 16px;
  }
  .rgpd-encart a{color:var(--accent-dark); font-weight:700;}
</style>
</head>
<body>
<div class="wrap">
  <img class="brand-logo-img" alt="Curieux orchestre">
  <a href="#" id="backToDispoLink" style="display:none; font-size:12.5px; color:var(--muted); margin:-14px 0 18px; text-decoration:none;">← Revenir à mon espace</a>
  <div id="content"><div class="state-box">Chargement…</div></div>
</div>
<div class="save-bar" id="saveBar">
  <div class="save-bar-inner">
    <span class="save-status saved" id="saveStatus">Tes infos sont à jour.</span>
    <button type="button" class="save-btn" id="saveBtn" disabled>Valider mes infos</button>
  </div>
</div>

<script>

let state = { token:null, person:null, personType:null, info:null };

function showState(html){
  document.getElementById('content').innerHTML = `<div class="state-box">${html}</div>`;
}

async function init(){
  if(!window.supabase){ showState("La librairie n'a pas pu être chargée. Réessaie dans un instant."); return; }
  const token = new URLSearchParams(location.search).get('token');
  if(!token){ showState("Lien invalide — il manque le jeton d'accès."); return; }

  const { data: demandeRows } = await supabaseClient.rpc('get_dispo_demande_by_token', { p_token: token });
  const demande = (demandeRows || [])[0];
  if(!demande){ showState("Ce lien n'est plus valide. Contacte la production pour en obtenir un nouveau."); return; }

  // Voir C1 : lecture de sa propre fiche par fonction à jeton, le répertoire
  // n'étant plus ouvert à la clé anonyme.
  const person = await CurieuxDB.getOwnPersonByToken(token, demande.person_type, demande.person_id);
  if(!person){ showState("Cette fiche n'existe plus."); return; }

  state.token = token;
  state.person = person;
  state.personType = demande.person_type;
  state.info = (await CurieuxDB.getInfosSocialesByToken(token)) || { extra: {} };

  const backLink = document.getElementById('backToDispoLink');
  backLink.href = 'mon-espace.html?token=' + encodeURIComponent(token);
  backLink.style.display = 'inline-block';

  render();
}

function tierBadge(tier){
  const labels = { obligatoire:'Obligatoire', conseille:'Conseillé', facultatif:'Facultatif' };
  return `<span class="tier-badge ${tier}">${labels[tier]}</span>`;
}

// Minimum pour une première fiche exploitable : coordonnées +
// identité civile de base. Le reste (RIB, n° sécu...) est conseillé mais pas
// bloquant — beaucoup de gens ne l'ont pas sous la main au premier passage.
const REQUIRED_FIELDS = [
  { key:'telephone', label:'Téléphone', source:'person' },
  { key:'email', label:'Email', source:'person' },
  { key:'genre', label:'Genre', source:'info' },
  { key:'dateNaissance', label:'Date de naissance', source:'info' },
  { key:'lieuNaissance', label:'Ville de naissance', source:'info' },
  { key:'nationalite', label:'Nationalité', source:'info' },
  { key:'adresse', label:'Adresse postale', source:'info' },
];
function computeMissingRequired(){
  return REQUIRED_FIELDS
    .filter(f=> !((f.source === 'person' ? state.person[f.key] : state.info[f.key]) || '').toString().trim())
    .map(f=> f.label);
}
function updateCompletionBanner(){
  const el = document.getElementById('completionBanner');
  if(!el) return;
  const missing = computeMissingRequired();
  if(missing.length){
    el.className = 'completion-banner missing';
    el.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" style="vertical-align:-3px; margin-right:4px;"><path d="M12 3.5 22 20.5H2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><line x1="12" y1="9.5" x2="12" y2="14.3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><circle cx="12" cy="17.2" r="1" fill="currentColor"></circle></svg>Il manque encore des infos obligatoires : <strong>${missing.map(escapeHtml).join(', ')}</strong>`;
  } else {
    el.className = 'completion-banner ok';
    el.textContent = '✓ Ta fiche contient toutes les infos obligatoires — merci !';
  }
}

function render(){
  const info = state.info;

  document.getElementById('content').innerHTML = `
    <h1>Mes infos</h1>
      <!-- Information des personnes (I2) : ces données sont demandées au moment
           où elles sont saisies, avec la finalité, la durée et le moyen de
           demander l'effacement — voir mentions-legales.html. -->
      <div class="rgpd-encart">
        <strong>Pourquoi ces informations&nbsp;?</strong> Elles servent uniquement à
        établir ton contrat et les déclarations d'embauche. Elles sont réservées
        aux comptes administrateurs de la production, ne sont jamais transmises à
        des tiers en dehors des organismes sociaux, et tu peux demander leur
        correction ou leur suppression à tout moment.
        <a href="mentions-legales.html" target="_blank" rel="noopener">En savoir plus</a>
      </div>

    <div class="identity-banner">
      Bonjour <strong>${escapeHtml(fullName(state.person))}</strong> — on a besoin de ces informations pour ta fiche
      musicien·ne/technicien·ne (identité civile, n° sécu, RIB, statut intermittent).
      <div class="identity-note">Ce lien t'est personnel, pas la peine de le transférer. Tu peux revenir dessus à tout moment pour mettre à jour tes infos.</div>
    </div>

    <div class="completion-banner" id="completionBanner"></div>

    <div class="section-label">Coordonnées</div>
    <div class="field-row">
      <div class="field"><label for="mi_telephone">Téléphone ${tierBadge('obligatoire')}</label><input id="mi_telephone" type="text" data-person-field="telephone" value="${escapeAttr(state.person.telephone || '')}" inputmode="tel" autocomplete="tel"></div>
      <div class="field"><label for="mi_email">Email ${tierBadge('obligatoire')}</label><input id="mi_email" type="text" data-person-field="email" value="${escapeAttr(state.person.email || '')}" inputmode="email" autocomplete="email"></div>
    </div>

    <div class="section-label">Identité civile</div>
    <p style="font-size:12px; color:var(--muted); margin:-4px 0 10px;">Ta fiche t'affiche partout sous <strong>${escapeHtml(state.person.prenom || '')}</strong>. Si tu préfères qu'on t'appelle autrement (annuaire, plannings, feuilles de route…), indique-le ci-dessous — ton prénom d'état civil est conservé de son côté pour les documents administratifs.</p>
    <div class="field">
      <label for="mi_prenomUsage">Prénom d'usage ${tierBadge('facultatif')}</label>
      <input id="mi_prenomUsage" type="text" placeholder="Laisse vide si «${escapeAttr(state.person.prenom || '')}» est déjà correct" autocomplete="given-name">
    </div>
    <div class="field-row">
      <div class="field"><label for="mi_dateNaissance">Date de naissance ${tierBadge('obligatoire')}</label><input id="mi_dateNaissance" type="date" data-info-field="dateNaissance" value="${escapeAttr(info.dateNaissance || '')}" autocomplete="bday"></div>
      <div class="field"><label for="mi_lieuNaissance">Ville de naissance ${tierBadge('obligatoire')}</label><input id="mi_lieuNaissance" type="text" data-info-field="lieuNaissance" value="${escapeAttr(info.lieuNaissance || '')}" autocomplete="address-level2"></div>
      <div class="field"><label for="mi_nationalite">Nationalité ${tierBadge('obligatoire')}</label><input id="mi_nationalite" type="text" data-info-field="nationalite" value="${escapeAttr(info.nationalite || '')}" autocomplete="country-name"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="mi_genre">Genre ${tierBadge('obligatoire')}</label>
        <select data-info-field="genre" id="mi_genre">
          <option value="">Non renseigné</option>
          <option value="femme" ${info.genre==='femme'?'selected':''}>Femme</option>
          <option value="homme" ${info.genre==='homme'?'selected':''}>Homme</option>
          <option value="non-binaire" ${info.genre==='non-binaire'?'selected':''}>Non-binaire</option>
          <option value="autre" ${info.genre==='autre'?'selected':''}>Autre</option>
          <option value="npr" ${info.genre==='npr'?'selected':''}>Préfère ne pas préciser</option>
        </select>
      </div>
      <div class="field" id="mi_genreDetailField" style="${info.genre==='autre' ? '' : 'display:none;'}">
        <label for="mi_genreDetail">Préciser</label>
        <input id="mi_genreDetail" type="text" data-info-field="genreDetail" value="${escapeAttr(info.genreDetail || '')}">
      </div>
    </div>
    <div class="field">
      <label for="mi_adresse">Adresse postale ${tierBadge('obligatoire')}</label>
      <textarea id="mi_adresse" data-info-field="adresse">${escapeHtml(info.adresse || '')}</textarea>
    </div>

    <div class="section-label">Sécurité sociale</div>
    <div class="field">
      <label for="mi_numSecu">N° de sécurité sociale (NIR) ${tierBadge('conseille')}</label>
      <input id="mi_numSecu" type="text" data-info-field="numSecu" value="${escapeAttr(info.numSecu || '')}" inputmode="numeric" pattern="[0-9 ]{13,21}" title="13 ou 15 chiffres, espaces autorisés" placeholder=" ">
    </div>

    <div class="section-label">Coordonnées bancaires</div>
    <div class="field-row">
      <div class="field"><label for="mi_iban">IBAN ${tierBadge('conseille')}</label><input id="mi_iban" type="text" data-info-field="iban" value="${escapeAttr(info.iban || '')}" pattern="[A-Za-z]{2}[0-9]{2}[A-Za-z0-9 ]{10,34}" title="Commence par 2 lettres de pays, ex : FR76 3000 …" placeholder=" "></div>
      <div class="field"><label for="mi_bic">BIC ${tierBadge('conseille')}</label><input id="mi_bic" type="text" data-info-field="bic" value="${escapeAttr(info.bic || '')}" pattern="[A-Za-z0-9]{8}|[A-Za-z0-9]{11}" title="8 ou 11 caractères" placeholder=" "></div>
    </div>
    <div class="field">
      <label for="mi_titulaireCompte">Titulaire du compte ${tierBadge('conseille')}</label>
      <input id="mi_titulaireCompte" type="text" data-info-field="titulaireCompte" value="${escapeAttr(info.titulaireCompte || '')}" autocomplete="name">
    </div>

    <div class="section-label">Statut intermittent</div>
    <div class="field-row">
      <div class="field"><label for="mi_numCongesSpectacles">N° Congés Spectacles ${tierBadge('conseille')}</label><input id="mi_numCongesSpectacles" type="text" data-info-field="numCongesSpectacles" value="${escapeAttr(info.numCongesSpectacles || '')}" inputmode="numeric"></div>
      <div class="field"><label for="mi_numAudiens">N° Audiens ${tierBadge('conseille')}</label><input id="mi_numAudiens" type="text" data-info-field="numAudiens" value="${escapeAttr(info.numAudiens || '')}" inputmode="numeric"></div>
    </div>

    <div class="section-label">Contact d'urgence</div>
    <div class="field-row">
      <div class="field"><label for="mi_contactUrgenceNom">Nom ${tierBadge('conseille')}</label><input id="mi_contactUrgenceNom" type="text" data-info-field="contactUrgenceNom" value="${escapeAttr(info.contactUrgenceNom || '')}"></div>
      <div class="field"><label for="mi_contactUrgenceTel">Téléphone ${tierBadge('conseille')}</label><input id="mi_contactUrgenceTel" type="text" data-info-field="contactUrgenceTel" value="${escapeAttr(info.contactUrgenceTel || '')}" inputmode="tel"></div>
    </div>

    <div class="section-label">Autres infos pratiques</div>
    <div class="field-row">
      <div class="field">
        <label for="mi_permisConduire">Permis de conduire ${tierBadge('facultatif')}</label>
        <select data-info-field="permisConduire" id="mi_permisConduire">
          <option value="">Non renseigné</option>
          <option value="oui" ${info.permisConduire==='oui'?'selected':''}>Oui</option>
          <option value="non" ${info.permisConduire==='non'?'selected':''}>Non</option>
        </select>
      </div>
      <div class="field" id="mi_permisTypeField" style="${info.permisConduire==='oui' ? '' : 'display:none;'}">
        <label for="mi_permisConduireType">Type de permis</label>
        <select data-info-field="permisConduireType" id="mi_permisConduireType">
          <option value="B" ${info.permisConduireType!=='autre'?'selected':''}>Permis B</option>
          <option value="autre" ${info.permisConduireType==='autre'?'selected':''}>Autre</option>
        </select>
      </div>
      <div class="field" id="mi_permisTypeDetailField" style="${info.permisConduire==='oui' && info.permisConduireType==='autre' ? '' : 'display:none;'}">
        <label for="mi_permisConduireTypeDetail">Préciser</label>
        <input id="mi_permisConduireTypeDetail" type="text" data-info-field="permisConduireTypeDetail" value="${escapeAttr(info.permisConduireTypeDetail || '')}">
      </div>
      <div class="field"><label for="mi_tailleVetement">Taille de vêtement ${tierBadge('facultatif')}</label><input id="mi_tailleVetement" type="text" data-info-field="tailleVetement" value="${escapeAttr(info.tailleVetement || '')}"></div>
    </div>
  `;
  bindEvents();
  updateCompletionBanner();
  document.getElementById('saveBar').classList.add('visible');
}

// Comme dispo-titulaire.html : rien n'est enregistré tant que la personne n'a
// pas cliqué "Valider mes infos" — pas de sauvegarde automatique au fil de la
// frappe, pour que ce soit un vrai geste volontaire de validation.
let hasUnsavedChanges = false;
window.addEventListener('beforeunload', (e)=>{
  if(!hasUnsavedChanges) return;
  e.preventDefault();
  e.returnValue = '';
});

function markDirty(){
  const status = document.getElementById('saveStatus');
  const btn = document.getElementById('saveBtn');
  status.textContent = 'Modifications non enregistrées.';
  status.className = 'save-status dirty';
  btn.disabled = false;
  hasUnsavedChanges = true;
}

async function doSave(){
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';

  const prenomUsageInput = document.getElementById('mi_prenomUsage');
  const prenomUsageVal = prenomUsageInput ? prenomUsageInput.value.trim() : '';
  const prenomChanged = prenomUsageVal.length > 0 && prenomUsageVal !== (state.person.prenom || '');

  const [personRes, infoRes, prenomRes] = await Promise.all([
    CurieuxDB.updateOwnContactByToken(state.token, state.person.telephone || '', state.person.email || ''),
    CurieuxDB.upsertInfosSocialesByToken(state.token, state.info),
    prenomChanged ? CurieuxDB.updateOwnPrenomUsageByToken(state.token, prenomUsageVal) : Promise.resolve({ error: null })
  ]);
  btn.textContent = 'Valider mes infos';
  if(personRes.error || infoRes.error || prenomRes.error){
    status.textContent = "Erreur d'enregistrement — réessaie.";
    status.className = 'save-status dirty';
    btn.disabled = false;
    return;
  }
  status.textContent = '✓ Infos enregistrées.';
  status.className = 'save-status saved';
  hasUnsavedChanges = false;
  if(prenomChanged){
    state.person.prenom = prenomUsageVal;
    render(); // rafraîchit la phrase d'intro et vide le champ, maintenant appliqué
  }
}
document.getElementById('saveBtn').addEventListener('click', doSave);

function bindEvents(){
  document.getElementById('mi_prenomUsage').addEventListener('input', markDirty);

  document.querySelectorAll('[data-person-field]').forEach(el=>{
    el.addEventListener('input', ()=>{
      state.person[el.dataset.personField] = el.value;
      updateCompletionBanner();
      markDirty();
    });
  });

  document.querySelectorAll('[data-info-field]').forEach(el=>{
    el.addEventListener('input', ()=>{
      state.info[el.dataset.infoField] = el.value;
      updateCompletionBanner();
      markDirty();
    });
  });

  // Affiche "Préciser" seulement si le genre choisi est "Autre".
  const genreField = document.getElementById('mi_genre');
  const genreDetailField = document.getElementById('mi_genreDetailField');
  genreField.addEventListener('change', ()=>{
    genreDetailField.style.display = genreField.value === 'autre' ? '' : 'none';
  });

  // Affiche "Type de permis" seulement si "Oui", et "Préciser" seulement si
  // le type est "Autre" — sans re-render (perdrait le focus en cours de frappe).
  const permisField = document.getElementById('mi_permisConduire');
  const permisTypeField = document.getElementById('mi_permisTypeField');
  const permisTypeSelect = document.getElementById('mi_permisConduireType');
  const permisTypeDetailField = document.getElementById('mi_permisTypeDetailField');
  permisField.addEventListener('change', ()=>{
    permisTypeField.style.display = permisField.value === 'oui' ? '' : 'none';
    permisTypeDetailField.style.display = permisField.value === 'oui' && permisTypeSelect.value === 'autre' ? '' : 'none';
  });
  permisTypeSelect.addEventListener('change', ()=>{
    permisTypeDetailField.style.display = permisField.value === 'oui' && permisTypeSelect.value === 'autre' ? '' : 'none';
  });
}

applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);
init();
</script>
</body>
</html>
