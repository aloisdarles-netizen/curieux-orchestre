    <main data-screen-label="Accueil" style="max-width:1240px; margin:0 auto; padding:24px 20px 60px; animation:coFadeUp .4s ease both;">
      <div style="display:flex; align-items:center; gap:16px; margin-bottom:18px;">
        <img src="a646fc29-dc72-41cf-ba9b-6ac79b5848cf" alt="" style="height:58px; width:auto; transform:rotate(-8deg); flex-shrink:0;">
        <div>
          <p style="margin:0 0 4px; font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--tonic);">Outils de production</p>
          <h1 style="font-family:var(--font-display); font-size:34px; margin:0; letter-spacing:.01em; color:var(--accent);">Salut Michel</h1>
        </div>
      </div>
      <div style="display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); column-gap:18px; row-gap:14px; padding:6px;">
        <sc-for list="{{ homeSections }}" as="sec" hint-placeholder-count="6">
          <section style="grid-column:{{ sec.span }}; background:{{ sec.cardBg }}; border-radius:16px; padding:16px 18px 15px; transform:{{ sec.tileTilt }}; box-shadow:0 0 0 4px var(--card), 7px 9px 0 rgba(20,22,23,.10); transition:transform .22s cubic-bezier(.34,1.5,.6,1), box-shadow .22s ease;" style-hover="transform:rotate(0deg) translateY(-3px); box-shadow:0 0 0 4px var(--card), 10px 13px 0 rgba(20,22,23,.13);">
            <div style="display:flex; gap:11px; align-items:center; margin-bottom:11px;">
              <span style="width:38px; height:38px; border-radius:11px; flex-shrink:0; background:{{ sec.chipBg }}; color:{{ sec.chipFg }}; display:grid; place-items:center; font-family:var(--font-display); font-size:19px; transform:{{ sec.tilt }}; box-shadow:0 3px 8px rgba(20,22,23,.18);">{{ sec.chip }}</span>
              <h2 style="font-family:var(--font-display); font-size:21px; line-height:1.1; margin:0; letter-spacing:.02em; text-transform:uppercase; color:{{ sec.fg }};">{{ sec.titre }}</h2>
            </div>
            <sc-if value="{{ sec.hasStats }}" hint-placeholder-val="{{ false }}">
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:8px; margin-bottom:12px;">
                <sc-for list="{{ sec.stats }}" as="ms" hint-placeholder-count="7">
                  <span style="display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:2px; background:{{ ms.bg }}; color:{{ ms.fg }}; border-radius:10px; padding:9px 8px; transform:{{ ms.tilt }}; box-shadow:0 2px 6px rgba(20,22,23,.18);">
                    <span style="font-family:var(--font-display); font-size:21px; line-height:1;">{{ ms.num }}</span>
                    <span style="font-size:10.5px; font-weight:700; opacity:.9; text-wrap:pretty;">{{ ms.label }}</span>
                  </span>
                </sc-for>
              </div>
            </sc-if>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              <sc-for list="{{ sec.links }}" as="lnk" hint-placeholder-count="3">
                <button sc-camel-on-click="{{ lnk.onClick }}" title="{{ lnk.title }}" style="display:inline-flex; align-items:center; cursor:pointer; border:1px solid transparent; background:{{ sec.linkBg }}; font-family:var(--font-body); font-size:12.5px; font-weight:700; letter-spacing:.01em; color:{{ sec.linkFg }}; padding:8px 15px; border-radius:10px; transition:transform .14s cubic-bezier(.34,1.5,.6,1), border-color .14s ease;" style-hover="transform:translateY(-1px); border-color:{{ sec.linkFg }};">{{ lnk.label }}</button>
              </sc-for>
            </div>
          </section>
        </sc-for>
      </div>
    </main>
  </sc-if>
