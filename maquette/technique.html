    <main data-screen-label="Technique — avancement" style="max-width:1100px; margin:0 auto; padding:28px 20px 80px; animation:coFadeUp .4s ease both;">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;">
        <div>
          <h1 style="font-family:var(--font-display); font-size:28px; margin:0 0 4px; color:var(--accent);">Direction technique</h1>
          <p style="color:var(--muted); font-size:13.5px; margin:0;">L'avancement, date par date — clique une carte pour ouvrir le détail.</p>
        </div>
        <sc-raw-select style="padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--card); color:var(--text); font-family:var(--font-body);">
          <option>L'Atelier de Joe Hisaishi — Printemps 2027</option>
          <option>La Curieuse Soirée 2027</option>
        </sc-raw-select>
      </div>
      <sc-raw-select style="padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13.5px; background:var(--card); color:var(--text); font-family:var(--font-body); margin-bottom:16px;">
        <option>L'Atelier de Joe Hisaishi — Printemps 2027</option>
        <option>La Curieuse Soirée 2027</option>
      </sc-raw-select>
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(480px, 1fr)); gap:14px;">
        <sc-for list="{{ techCards }}" as="t" hint-placeholder-count="6">
          <button sc-camel-on-click="{{ t.onOpen }}" style="text-align:left; cursor:pointer; font-family:var(--font-body); background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; color:var(--text); transition:border-color .15s, transform .1s;" style-hover="border-color:var(--accent); transform:translateY(-1px);">
            <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:4px;">
              <span style="font-weight:800; font-size:17px;">{{ t.titre }}</span>
              <span style="display:inline-flex; align-items:baseline; gap:10px; white-space:nowrap;"><span style="font-size:14px; font-weight:800; color:{{ t.pctColor }};">{{ t.pct }}</span><span style="font-size:13px; color:var(--muted); font-weight:700;">{{ t.jour }}</span></span>
            </div>
            <div style="height:10px;"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
              <div>
                <div style="font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--ok); margin-bottom:5px;">✓ Fait</div>
                <div style="display:flex; flex-direction:column; align-items:flex-start; gap:5px;">
                  <sc-for list="{{ t.chips.ok }}" as="ch" hint-placeholder-count="4">
                    <span style="display:inline-flex; align-items:center; font-size:12.5px; font-weight:700; padding:4px 12px; border-radius:999px; white-space:nowrap; background:{{ ch.bg }}; color:{{ ch.fg }};">{{ ch.txt }}</span>
                  </sc-for>
                </div>
              </div>
              <div>
                <div style="font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--maybe); margin-bottom:5px;">À faire</div>
                <div style="display:flex; flex-direction:column; align-items:flex-start; gap:5px;">
                  <sc-for list="{{ t.chips.todo }}" as="ch" hint-placeholder-count="3">
                    <span style="display:inline-flex; align-items:center; font-size:12.5px; font-weight:700; padding:4px 12px; border-radius:999px; white-space:nowrap; background:{{ ch.bg }}; color:{{ ch.fg }};">{{ ch.txt }}</span>
                  </sc-for>
                </div>
              </div>
            </div>
          </button>
        </sc-for>
      </div>
    </main>
  </sc-if>
