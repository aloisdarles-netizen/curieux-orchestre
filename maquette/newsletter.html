    <main data-screen-label="Journal des changements" style="max-width:820px; margin:0 auto; padding:28px 20px 80px; animation:coFadeUp .4s ease both;">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:6px;">
        <h1 style="font-family:var(--font-display); font-size:28px; margin:0; color:var(--accent);">Journal des changements</h1>
        <div style="display:flex; gap:10px;">
          <x-import component-from-global-scope="CurieuxOrchestreDesignSystem_ecc9f4.Button" variant="secondary" size="sm" hint-size="auto,36px">Copier le récap</x-import>
          <button sc-camel-on-click="{{ onJournalSent }}" style="cursor:pointer; border:none; background:var(--accent); color:#FCF2F0; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700; font-family:var(--font-body);">{{ journalBtn }}</button>
        </div>
      </div>
      <p style="color:var(--muted); font-size:13px; margin:0 0 20px;">{{ journalLastSent }} — voici ce qui a bougé depuis.</p>
      <sc-for list="{{ journalGroups }}" as="g" hint-placeholder-count="3">
        <div style="background:var(--card); border:1px solid var(--border); border-radius:12px; padding:14px 18px; margin-bottom:10px;">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:6px;">
            <span style="font-weight:800; font-size:13.5px;">{{ g.titre }}</span>
            <span style="font-size:10.5px; font-weight:800; padding:3px 10px; border-radius:999px; background:{{ g.pillBg }}; color:{{ g.pillFg }};">{{ g.pill }}</span>
          </div>
          <sc-if value="{{ g.hasRows }}" hint-placeholder-val="{{ true }}">
            <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="2">
              <p style="margin:0 0 3px; font-size:13px; color:var(--text); line-height:1.55;">{{ r }}</p>
            </sc-for>
          </sc-if>
          <sc-if value="{{ g.hasRowsNot }}" hint-placeholder-val="{{ false }}">
            <p style="margin:0; font-size:12.5px; color:var(--muted);">Rien à signaler.</p>
          </sc-if>
        </div>
      </sc-for>
    </main>
  </sc-if>
