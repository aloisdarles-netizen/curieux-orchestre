    <main data-screen-label="Annuaire" style="max-width:1100px; margin:0 auto; padding:28px 20px 80px; animation:coFadeUp .4s ease both;">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;">
        <div>
          <h1 style="font-family:var(--font-display); font-size:28px; margin:0 0 4px; color:var(--accent);">{{ annTitle }}</h1>
          <p style="color:var(--muted); font-size:13.5px; margin:0;">{{ annCount }} — contact en un clic, remplaçant·es par ordre de préférence.</p>
        </div>
        <sc-if value="{{ hasAnnFilter }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex; gap:6px;">
            <sc-for list="{{ annFilterBtns }}" as="fb" hint-placeholder-count="3">
              <button sc-camel-on-click="{{ fb.onClick }}" style="cursor:pointer; border:1px solid {{ fb.bd }}; background:{{ fb.bg }}; color:{{ fb.fg }}; border-radius:999px; padding:6px 13px; font-size:12px; font-weight:700; font-family:var(--font-body);">{{ fb.label }}</button>
            </sc-for>
          </div>
        </sc-if>
        <div style="display:flex; gap:10px;">
          <x-import component-from-global-scope="CurieuxOrchestreDesignSystem_ecc9f4.Button" variant="secondary" size="sm" hint-size="auto,36px">Importer (coller)</x-import>
          <x-import component-from-global-scope="CurieuxOrchestreDesignSystem_ecc9f4.Button" variant="primary" size="sm" hint-size="auto,36px">{{ annAdd }}</x-import>
        </div>
      </div>
      <section style="background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden;">
        <sc-for list="{{ annRows }}" as="p" hint-placeholder-count="10">
          <div style="display:flex; align-items:center; gap:14px; padding:var(--row-pad) 20px; border-bottom:1px solid var(--border); flex-wrap:wrap; background:{{ p.rowBg }};">
            <span style="width:36px; height:36px; border-radius:11px; flex-shrink:0; background:{{ p.avBg }}; color:{{ p.avFg }}; display:grid; place-items:center; font-family:var(--font-display); font-size:14px; transform:{{ p.avTilt }}; box-shadow:0 2px 6px rgba(20,22,23,.12);">{{ p.av }}</span>
            <span style="flex:1; min-width:170px;">
              <span style="font-weight:800; font-size:13.5px;">{{ p.nom }}</span><span style="font-size:9px; font-weight:800; text-transform:uppercase; padding:1px 6px; border-radius:999px; background:{{ p.tagBg }}; color:var(--tint-ink); margin-left:{{ p.tagMl }};">{{ p.tag }}</span>
              <span style="display:block; font-size:11.5px; color:var(--muted);">{{ p.role }}</span>
            </span>
            <span style="width:110px;"><span style="font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:3px 10px; border-radius:999px; background:{{ p.pupBg }}; color:{{ p.pupFg }};">{{ p.pup }}</span></span>
            <span style="width:140px; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;">{{ p.tel }}</span>
            <span style="flex:1; min-width:160px; font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ p.mail }}</span>
            <span style="width:132px;"><sc-if value="{{ p.hasRempl }}" hint-placeholder-val="{{ false }}"><button sc-camel-on-click="{{ p.onRempl }}" title="Voir ses remplaçant·es par ordre de préférence" style="cursor:pointer; border:none; background:transparent; color:var(--accent); font-size:11.5px; font-weight:700; font-family:var(--font-body); text-decoration:underline; padding:0;">{{ p.remplTxt }}</button></sc-if></span>
            <span style="display:flex; gap:6px;">
              <button title="Appeler" style="cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text); border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:700; font-family:var(--font-body);">Appeler</button>
              <button title="Écrire" style="cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--text); border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:700; font-family:var(--font-body);">Écrire</button>
              <button title="Modifier la fiche" style="cursor:pointer; border:1px solid var(--border); background:transparent; color:var(--muted); border-radius:8px; width:28px; height:28px; font-weight:800;">✎</button>
            </span>
          </div>
        </sc-for>
      </section>
    </main>
  </sc-if>
