    <main data-screen-label="Matériel" style="max-width:980px; margin:0 auto; padding:28px 20px 80px; animation:coFadeUp .4s ease both;">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;">
        <div>
          <h1 style="font-family:var(--font-display); font-size:28px; margin:0 0 4px; color:var(--accent);">Matériel</h1>
          <p style="color:var(--muted); font-size:13.5px; margin:0;">Ce qu'on amène — kits, et ce qu'ils contiennent.</p>
        </div>
        <x-import component-from-global-scope="CurieuxOrchestreDesignSystem_ecc9f4.Button" variant="primary" size="sm" hint-size="auto,36px">+ Ajouter un lot</x-import>
      </div>
      <sc-for list="{{ matLots }}" as="l" hint-placeholder-count="5">
        <div style="background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 18px; margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div style="min-width:0; display:flex; gap:11px; align-items:flex-start;">
              <span style="width:34px; height:34px; border-radius:10px; flex-shrink:0; background:{{ l.catBg }}; color:{{ l.catFg }}; display:grid; place-items:center; font-size:16px; transform:rotate(-5deg); box-shadow:0 2px 6px rgba(20,22,23,.14);">{{ l.icon }}</span>
              <div style="min-width:0;">
              <div style="font-weight:800; font-size:14.5px;">{{ l.nom }}</div>
              <sc-if value="{{ l.hasProv }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px; color:var(--muted); margin-top:2px;">{{ l.prov }}</div></sc-if>
              <sc-if value="{{ l.hasDesc }}" hint-placeholder-val="{{ false }}"><div style="font-size:12px; color:var(--muted); margin-top:2px;">{{ l.desc }}</div></sc-if>
              </div>
            </div>
            <span style="font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; padding:3px 10px; border-radius:999px; white-space:nowrap; background:{{ l.catBg }}; color:{{ l.catFg }};">{{ l.cat }}</span>
          </div>
          <sc-if value="{{ l.hasDates }}" hint-placeholder-val="{{ false }}"><div style="font-size:11.5px; color:var(--muted); margin-top:6px;">{{ l.dates }}</div></sc-if>
          <div style="display:flex; gap:6px; margin-top:10px; border-top:1px solid var(--border); padding-top:9px;">
            <button style="cursor:pointer; border:none; background:transparent; color:var(--muted); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; font-family:var(--font-body);">Modifier</button>
            <button style="cursor:pointer; border:none; background:var(--accent-tint); color:var(--tint-ink); border-radius:8px; padding:6px 11px; font-size:12px; font-weight:700; font-family:var(--font-body);">+ Sous-lot</button>
            <button style="cursor:pointer; border:none; background:transparent; color:var(--ko); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; font-family:var(--font-body);">Supprimer</button>
          </div>
          <sc-if value="{{ l.hasSous }}" hint-placeholder-val="{{ false }}">
            <div style="margin:10px 0 0 20px; padding-left:14px; border-left:2px solid var(--border); display:flex; flex-direction:column; gap:8px;">
              <sc-for list="{{ l.sous }}" as="sl" hint-placeholder-count="1">
                <div style="background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 14px;">
                  <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
                    <div style="min-width:0;">
                      <div style="font-weight:800; font-size:13px;">{{ sl.nom }}</div>
                      <sc-if value="{{ sl.hasDesc }}" hint-placeholder-val="{{ false }}"><div style="font-size:11.5px; color:var(--muted); margin-top:2px;">{{ sl.desc }}</div></sc-if>
                    </div>
                    <span style="font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; padding:2px 9px; border-radius:999px; white-space:nowrap; background:{{ sl.catBg }}; color:{{ sl.catFg }};">{{ sl.cat }}</span>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </main>
  </sc-if>
