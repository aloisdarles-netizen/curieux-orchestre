    <main data-screen-label="Feuilles de route" style="max-width:1100px; margin:0 auto; padding:28px 20px 80px; animation:coFadeUp .4s ease both;">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px;">
        <div>
          <h1 style="font-family:var(--font-display); font-size:28px; margin:0 0 4px; color:var(--accent);">Feuilles de route</h1>
          <p style="color:var(--muted); font-size:13.5px; margin:0;">Une feuille par date — les sections vertes sont prêtes, les orange restent à compléter.</p>
        </div>
        <x-import component-from-global-scope="CurieuxOrchestreDesignSystem_ecc9f4.Button" variant="primary" size="sm" hint-size="auto,36px">+ Nouvelle feuille de route</x-import>
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(440px, 1fr)); gap:14px;">
        <sc-for list="{{ fdrList }}" as="f" hint-placeholder-count="5">
          <button sc-camel-on-click="{{ f.onOpen }}" style="text-align:left; cursor:pointer; font-family:var(--font-body); background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; color:var(--text); transition:border-color .15s, transform .1s;" style-hover="border-color:var(--accent); transform:translateY(-1px);">
            <div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px;">
              <span style="font-weight:800; font-size:15px;">{{ f.titre }}</span>
              <span style="font-size:12px; color:var(--muted); font-weight:700; white-space:nowrap;">{{ f.jour }}</span>
            </div>
            <div style="display:flex; align-items:center; gap:10px; margin:0 0 10px;">
              <div style="flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden;"><div style="height:100%; width:{{ f.pctW }}; background:{{ f.pctColor }}; border-radius:999px;"></div></div>
              <span style="font-size:11.5px; font-weight:800; color:{{ f.pctColor }}; white-space:nowrap;">{{ f.ratio }}</span>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:6px;">
              <sc-for list="{{ f.chips }}" as="ch" hint-placeholder-count="6">
                <span style="display:inline-flex; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; white-space:nowrap; background:{{ ch.pillBg }}; color:{{ ch.pillFg }};">{{ ch.pill }}</span>
              </sc-for>
            </div>
          </button>
        </sc-for>
      </div>
    </main>
  </sc-if>
