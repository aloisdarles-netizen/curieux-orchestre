    <main data-screen-label="Feuille de route — éditeur" style="max-width:920px; margin:0 auto; padding:24px 20px 80px; animation:coFadeUp .4s ease both;">
      <button sc-camel-on-click="{{ backToFdr }}" style="cursor:pointer; border:none; background:transparent; color:var(--accent); font-size:13px; font-weight:800; font-family:var(--font-body); padding:0; margin-bottom:14px;">← Feuilles de route</button>
      <div style="background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px 22px; margin-bottom:20px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;">
        <div style="flex:1; min-width:220px;">
          <h1 style="font-family:var(--font-display); font-size:26px; margin:0 0 2px; color:var(--accent);">{{ fdrTitre }}</h1>
          <span style="font-size:13px; color:var(--muted); font-weight:700;">{{ fdrJour }} · les contacts saisis alimentent automatiquement le carnet</span>
        </div>
        <x-import component-from-global-scope="CurieuxOrchestreDesignSystem_ecc9f4.Button" variant="primary" size="sm" hint-size="auto,36px">Générer le PDF</x-import>
      </div>
      <sc-for list="{{ fdrSections }}" as="s" hint-placeholder-count="7">
        <div style="background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px 24px; margin-bottom:14px; display:flex; gap:18px; align-items:flex-start;">
          <span style="width:48px; height:48px; border-radius:13px; flex-shrink:0; background:{{ s.icBg }}; color:{{ s.icFg }}; display:grid; place-items:center; font-size:23px; transform:{{ s.icTilt }}; box-shadow:0 2px 6px rgba(20,22,23,.12);">{{ s.icon }}</span>
          <div style="flex:1; min-width:0;">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:9px;">
              <span style="font-family:var(--font-display); font-weight:800; font-size:17px; text-transform:uppercase; letter-spacing:.04em; color:var(--accent);">{{ s.titre }}</span>
              <label style="display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); font-weight:600; cursor:pointer;"><input type="checkbox" checked="{{ true }}" sc-camel-on-change="{{ noop }}"> Inclure cette section</label>
            </div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              <sc-for list="{{ s.lines }}" as="ln" hint-placeholder-count="2">
                <p style="margin:0; padding:9px 14px; font-size:15px; color:var(--text); line-height:1.5; background:var(--bg); border-radius:9px;">{{ ln }}</p>
              </sc-for>
            </div>
            <button style="cursor:pointer; border:none; background:transparent; color:var(--accent); font-size:13.5px; font-weight:800; font-family:var(--font-body); padding:10px 0 0;">{{ s.action }} →</button>
          </div>
        </div>
      </sc-for>
    </main>
  </sc-if>
