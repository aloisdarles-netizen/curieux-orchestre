    <main data-screen-label="Infos sociales" style="max-width:1000px; margin:0 auto; padding:28px 20px 80px; animation:coFadeUp .4s ease both;">
      <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:14px;">
        <div>
          <h1 style="font-family:var(--font-display); font-size:28px; margin:0 0 4px; color:var(--accent);">Infos sociales</h1>
          <p style="color:var(--muted); font-size:13.5px; margin:0;">Identité, sécurité sociale, RIB — pour les déclarations d'embauche.</p>
        </div>
        <button style="cursor:pointer; border:none; background:var(--accent); color:#FCF2F0; border-radius:999px; padding:9px 18px; font-size:13px; font-weight:700; font-family:var(--font-body); opacity:{{ exportOp }};">{{ exportLabel }}</button>
      </div>
      <div style="background:var(--maybe-tint); color:var(--maybe); border-radius:10px; padding:10px 14px; font-size:12.5px; font-weight:600; margin-bottom:16px;">Données sensibles — accès restreint et journalisé. Les numéros restent masqués à l'écran, complets uniquement dans l'export.</div>
      <section style="background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden;">
        <sc-for list="{{ infoRows }}" as="p" hint-placeholder-count="10">
          <div style="padding:var(--row-pad) 20px; border-bottom:1px solid var(--border); background:{{ p.rowBg }};">
            <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:8px;">
              <button sc-camel-on-click="{{ p.onCheck }}" title="Inclure dans l'export" style="width:22px; height:22px; border-radius:6px; cursor:pointer; border:1px solid var(--border); background:{{ p.cBg }}; color:{{ p.cFg }}; font-size:13px; font-weight:800; flex-shrink:0;">{{ p.cSym }}</button>
              <span style="flex:1; min-width:160px;">
                <span style="font-weight:800; font-size:16px;">{{ p.nom }}</span>
                <span style="font-size:12.5px; color:var(--muted); margin-left:8px;">{{ p.role }}</span>
              </span>
              <span style="font-size:10.5px; font-weight:800; padding:4px 10px; border-radius:999px; white-space:nowrap; background:{{ p.pillBg }}; color:{{ p.pillFg }};">{{ p.pill }}</span>
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:6px 16px; padding-left:36px;">
              <sc-for list="{{ p.fields }}" as="f" hint-placeholder-count="6">
                <span style="min-width:0;">
                  <span style="display:block; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);">{{ f.label }}</span>
                  <span style="font-size:12px; color:var(--text); font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block;">{{ f.val }}</span>
                </span>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </section>
    </main>
  </sc-if>
