<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Finaliser mon compte</title>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/db.js"></script>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<script>try{ injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); injectBugReportWidget(); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* ==========================================================================
     Finaliser son compte — choix du mot de passe après le lien reçu par email.

     Hors maquette : même encart et mêmes champs que la connexion, empruntés à
     base.css. Le confort de saisie sur téléphone (16 px minimum, sinon iOS
     zoome) y est déjà traité pour toutes les pages.
     ========================================================================== */
  body{
    min-height:100vh; display:flex; padding:24px 16px;
  }
  .wrap{max-width:380px; width:100%; margin:auto;}
  .brand-logo-img{height:36px; width:auto; display:block; margin:0 auto 22px;}
  .card{padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.1); text-align:center;}
  .card h1{margin-bottom:6px;}
  p.hint{color:var(--muted); font-size:12.5px; margin:0 0 18px; line-height:1.5;}
  .field{margin-bottom:12px; text-align:left;}
  .msg{font-size:12.5px; margin-top:10px; display:none;}
  .msg.error{color:var(--danger);}
  .switch-link{font-size:12.5px; color:var(--muted); margin-top:18px;}
  .switch-link a{color:var(--accent); font-weight:700; text-decoration:none;}
  .switch-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <div class="co-card card co-fade">
    <img class="brand-logo-img" alt="Curieux orchestre">
    <h1 class="co-h1">Finalise ton compte</h1>
    <p class="hint">Connecté·e via le lien reçu par email. Choisis un mot de passe pour pouvoir te reconnecter directement la prochaine fois, sans redemander de lien.</p>

    <form id="setPasswordForm">
      <div class="field">
        <label class="co-label" for="newPassword">Mot de passe</label>
        <input class="co-input" type="password" id="newPassword" minlength="6" required autocomplete="new-password">
      </div>
      <div class="field">
        <label class="co-label" for="confirmPassword">Confirmer le mot de passe</label>
        <input class="co-input" type="password" id="confirmPassword" minlength="6" required autocomplete="new-password">
      </div>
      <button type="submit" class="co-btn primary block" id="setPasswordBtn">Définir le mot de passe</button>
      <div class="msg error" id="setPasswordError"></div>
    </form>

    <div class="switch-link"><a href="#" id="skipLink">Plus tard, continuer sans mot de passe</a></div>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const redirect = params.get('redirect') || 'accueil.html';

(async ()=>{
  const session = await CurieuxDB.getSession();
  if(!session){
    location.replace('admin-login.html?redirect=' + encodeURIComponent(redirect));
  }
})();

document.getElementById('skipLink').addEventListener('click', (e)=>{
  e.preventDefault();
  location.replace(redirect);
});

document.getElementById('setPasswordForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const errorEl = document.getElementById('setPasswordError');
  errorEl.style.display = 'none';

  if(newPassword !== confirmPassword){
    errorEl.textContent = 'Les deux mots de passe ne correspondent pas.';
    errorEl.style.display = 'block';
    return;
  }

  const btn = document.getElementById('setPasswordBtn');
  btn.disabled = true; btn.textContent = 'Enregistrement…';
  const { error } = await CurieuxDB.updateOwnPassword(newPassword);
  btn.disabled = false; btn.textContent = 'Définir le mot de passe';

  if(error){
    errorEl.textContent = translateAuthError(error.message);
    errorEl.style.display = 'block';
    return;
  }
  location.replace(redirect);
});

applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);
</script>
</body>
</html>
