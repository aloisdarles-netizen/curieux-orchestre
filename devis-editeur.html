<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<script>try{ hideCurieuxPageUntilAuth(); injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); injectBugReportWidget(); document.addEventListener('DOMContentLoaded', requireSuperAdminAuth); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* Cette page seule s'affranchit de la largeur de lecture du site : une
     feuille de chiffrage porte huit colonnes de chiffres, la brider à 1080 px
     tassait toute la partie droite. On prend la largeur de l'écran, avec un
     plafond pour ne pas étirer les lignes à l'infini sur un grand moniteur. */
  .wrap{max-width:min(1720px, 97vw); margin:0 auto;}
  /* Le bandeau du site est centré sur 1240 px : sur cette page élargie, on
     l'aligne sur le contenu pour que la navigation ne flotte pas à gauche. */
  body.co-has-topbar .co-topbar-in{ max-width:min(1720px, 97vw); }
  button{
    cursor:pointer; border:none; border-radius:8px; font-size:13px; font-weight:700;
    padding:9px 15px; transition:background .15s, transform .1s; font-family:inherit;
  }
  input, textarea, select{
    padding:7px 9px; border:1px solid var(--border); border-radius:6px; font-size:13px;
    background:var(--card); color:var(--text); font-family:inherit;
  }
  textarea{resize:vertical; width:100%;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}

  .carte{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 18px; margin-bottom:14px;}
  .carte h2{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--accent-dark); margin:0 0 12px;}

  .entete-grid{display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px;}
  @media (max-width:760px){ .entete-grid{grid-template-columns:1fr;} }

  .fige-note{
    background:var(--secondary-tint, #FEC9E0); color:var(--accent-dark);
    border-radius:12px; padding:12px 16px; font-size:13.5px; font-weight:700; margin-bottom:14px;
  }
  :root[data-theme="dark"] .fige-note{ color:var(--text); }
  .budget-note, .devis-note{
    border-radius:12px; padding:12px 16px; font-size:13px; margin-bottom:14px; line-height:1.55;
  }
  .budget-note{ background:var(--accent-tint); color:var(--accent-dark); }
  .devis-note{ background:var(--secondary-tint, #FEC9E0); color:var(--accent-dark); }
  :root[data-theme="dark"] .budget-note, :root[data-theme="dark"] .devis-note{ color:var(--text); }
  .budget-note a, .devis-note a, .fige-note a{ color:inherit; }

  /* --- La feuille de chiffrage ----------------------------------------
     Assumée comme un outil de travail : on quitte ici l'habillage de la
     charte (cartes crème, texte de lecture) pour une grille de tableur —
     filets fins, chiffres tabulaires alignés à droite, lignes zébrées. La
     charte reste sur le bandeau, les titres et les boutons ; le tableau,
     lui, doit se lire en diagonale sur quarante lignes. */
  .sec-carte{margin-bottom:18px; padding:0; overflow:hidden;}
  .sec-head{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:12px 16px; background:var(--bg); border-bottom:1px solid var(--border);
  }
  .sec-head .sec-num{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%; display:grid; place-items:center;
    background:var(--accent); color:var(--card); font-size:11.5px; font-weight:800;
  }
  .sec-head .sec-titre{
    flex:1 1 240px; font-weight:800; font-size:14.5px; border:none; background:transparent;
    padding:4px 2px; color:var(--text);
  }
  .sec-head .sec-titre:focus{background:var(--card); border-radius:6px; outline:1px solid var(--accent);}
  .sec-head select{width:auto; font-size:11.5px; padding:5px 7px;}
  .sec-outils{display:flex; gap:2px; opacity:.45; transition:opacity .15s;}
  .sec-carte:hover .sec-outils, .sec-carte:focus-within .sec-outils{opacity:1;}

  .lignes-scroll{overflow-x:auto;}
  table.feuille{width:100%; border-collapse:collapse; min-width:1020px; font-variant-numeric:tabular-nums;}

  /* En-tête de colonnes : une seule fois par section (et non par groupe,
     qui répétait la même rangée jusqu'à cinq fois dans une seule section).
     Pas de position:sticky ici : la table vit dans un conteneur à défilement
     horizontal, où un sticky vertical n'a aucun effet — autant ne pas le
     laisser croire. Les sections restent courtes, l'en-tête reste proche. */
  table.feuille thead th{
    font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); text-align:left; padding:7px 8px; white-space:nowrap;
    background:var(--card); border-bottom:1.5px solid var(--accent);
  }
  table.feuille th.n, table.feuille td.n{text-align:right;}

  /* Bandeau de groupe : une rangée pleine largeur, pas un titre flottant. */
  tr.grp-band td{
    background:var(--accent-tint); padding:0; border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }
  .grp-band-in{display:flex; align-items:center; gap:8px;}
  .grp-band-in input{flex:1 1 auto;}
  .grp-detacher{
    flex:0 0 auto; white-space:nowrap; font-size:10.5px !important; font-weight:800;
    opacity:0; transition:opacity .12s; margin-right:8px; color:var(--accent-dark);
  }
  tr.grp-band:hover .grp-detacher, tr.grp-band:focus-within .grp-detacher{opacity:1;}
  tr.grp-band input{
    width:100%; border:none; background:transparent; padding:6px 10px;
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.07em;
    color:var(--accent-dark);
  }
  tr.grp-band input::placeholder{text-transform:none; letter-spacing:0; font-weight:600; opacity:.55;}

  /* Les lignes : zébrées, séparées par des filets fins, surlignées au survol. */
  tr.lg > td{
    padding:0; border-bottom:1px solid var(--border);
    background:var(--card); transition:background .1s;
  }
  tbody tr.lg:nth-child(even) > td{background:var(--bg);}
  tr.lg:hover > td{background:var(--accent-tint);}
  tr.lg > td + td{border-left:1px solid var(--border);}

  /* Les champs ne se dessinent qu'au survol ou à la saisie : au repos, on lit
     des valeurs, pas une forêt de boîtes. */
  table.feuille input, table.feuille select{
    width:100%; border:1px solid transparent; background:transparent;
    padding:7px 8px; font-size:13px; border-radius:0; color:inherit;
  }
  table.feuille input.n{text-align:right; font-weight:700;}
  tr.lg:hover input, tr.lg:hover select{border-color:var(--border);}
  table.feuille input:focus, table.feuille select:focus{
    outline:none; border-color:var(--accent); background:var(--card);
    box-shadow:inset 0 0 0 1px var(--accent);
  }
  /* Hiérarchie de lecture, du plus fort au plus discret :
     1. le TOTAL (prune, gros) — ce qu'on cherche des yeux ;
     2. l'INTITULÉ (noir, gras) — ce dont on parle ;
     3. les nombres saisis (jours, qté, P.U.) — fermes mais neutres ;
     4. noms et unités (gris, italique pour les noms) — le contexte. */
  td.c-intitule input{font-weight:800; font-size:13.5px; color:var(--text);}
  td.c-noms input{font-size:12px; font-style:italic; color:var(--muted);}
  td.c-unite input{font-size:12px; color:var(--muted);}

  /* Le total : la colonne qu'on cherche des yeux. */
  td.c-total{
    text-align:right; font-weight:800; font-size:14.5px; white-space:nowrap;
    padding:7px 10px !important; color:var(--accent-dark);
  }
  tr.lg.hors td.c-total, tr.lg.optionnelle td.c-total{color:var(--muted); font-size:13px;}
  td.c-total .opt{display:block; font-size:9.5px; font-weight:800; color:var(--orange); letter-spacing:.05em;}

  /* Régime et état : des pastilles colorées, lisibles d'un coup d'œil, qui
     restent des menus déroulants. Une ligne « normale » ne montre donc aucune
     commande — seules les exceptions se signalent. */
  select.chip{
    font-size:10.5px !important; font-weight:800; padding:4px 6px !important;
    border-radius:20px !important; text-align:center; -webkit-appearance:none; appearance:none;
    border:1px solid transparent !important; cursor:pointer;
  }
  select.chip.r-production{background:#e6eefa; color:#33526f;}
  select.chip.r-musicien{background:#fde4ef; color:#8a1c55;}
  select.chip.r-auteur{background:#fde8dd; color:#a03c12;}
  select.chip.r-facture{background:#eceaf0; color:#5b4f63;}
  select.chip.r-aucun{background:transparent; color:var(--muted);}
  select.chip.e-incluse{background:transparent; color:var(--muted);}
  select.chip.e-optionnelle{background:#fde8dd; color:#a03c12;}
  select.chip.e-hors_devis{background:#eceaf0; color:#5b4f63;}
  :root[data-theme="dark"] select.chip.r-production{background:#26364a; color:#bcd6f2;}
  :root[data-theme="dark"] select.chip.r-musicien{background:#4a2436; color:#f5bcd8;}
  :root[data-theme="dark"] select.chip.r-auteur{background:#4a2a18; color:#f3b48c;}
  :root[data-theme="dark"] select.chip.r-facture{background:#33303a; color:#c3b9cc;}
  :root[data-theme="dark"] select.chip.e-optionnelle{background:#4a2a18; color:#f3b48c;}
  :root[data-theme="dark"] select.chip.e-hors_devis{background:#33303a; color:#c3b9cc;}

  /* Les outils de ligne n'apparaissent qu'au survol : ils encombraient chaque
     rangée de cinq icônes permanentes. */
  td.c-outils{white-space:nowrap; text-align:right; padding-right:6px !important;}
  td.c-outils .outils{display:inline-flex; gap:1px; opacity:0; transition:opacity .12s;}
  tr.lg:hover .outils, tr.lg:focus-within .outils{opacity:1;}
  .l-btn{
    background:transparent; border:none; padding:5px 5px; font-size:11.5px; color:var(--muted);
    border-radius:5px; cursor:pointer; line-height:1;
  }
  .l-btn:hover{background:var(--border); color:var(--text);}
  .l-btn.actif{opacity:1; color:var(--orange);}

  /* États particuliers d'une ligne. */
  tr.lg.discuter > td{background:#fff6d6;}
  tr.lg.discuter:hover > td{background:#ffefb8;}
  :root[data-theme="dark"] tr.lg.discuter > td{background:#3a3320;}
  :root[data-theme="dark"] tr.lg.discuter:hover > td{background:#463d26;}
  tr.lg.hors td.c-intitule input, tr.lg.hors td.c-total{color:var(--muted); text-decoration:line-through;}
  tr.lg.optionnelle td.c-total{color:var(--muted);}

  /* Rangée d'ajout, discrète, en fin de groupe. */
  tr.ajout td{padding:5px 8px; border-bottom:1px solid var(--border); background:var(--card);}
  tr.ajout .co-btn{padding:5px 11px; font-size:11.5px;}

  .sec-pied{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 16px; background:var(--bg); border-top:1px solid var(--border);
  }
  .sec-soustotal{
    margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums; font-size:14px;
  }
  .sec-soustotal small{font-weight:700; font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-right:6px;}

  /* --- Charges / divers / totaux --------------------------------------- */
  .calc-ligne{display:flex; align-items:baseline; gap:10px; padding:6px 0; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  .calc-ligne:last-child{border-bottom:none;}
  .calc-ligne .lib{flex:1 1 240px;}
  .calc-ligne .assiette{color:var(--muted); font-size:12px;}
  .calc-ligne .mont{margin-left:auto; font-weight:800; font-variant-numeric:tabular-nums;}
  .calc-ligne input.pct{width:76px; text-align:right;}
  .calc-ligne input.mt{width:110px; text-align:right;}

  .totaux-barre{
    position:sticky; bottom:0; z-index:30;
    background:var(--accent); color:#FCF2F0; border-radius:14px 14px 0 0;
    padding:12px 20px; display:flex; gap:18px; align-items:baseline; flex-wrap:wrap;
    box-shadow:0 -6px 24px rgba(20,22,23,.18); margin-top:20px;
  }
  /* En sombre, l'accent devient le bleu glacier (clair) : l'encre passe au
     noir — crème sur glacier était illisible. */
  :root[data-theme="dark"] .totaux-barre{ color:#141617; }
  .totaux-barre b{font-size:19px; font-variant-numeric:tabular-nums; font-family:var(--font-display); font-weight:500;}
  .totaux-barre .tt{font-size:12px; opacity:.85;}
  .totaux-barre .etat-sauvegarde{margin-left:auto; font-size:11.5px; opacity:.8;}

  .cible-bloc{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .cible-bloc input{width:130px; text-align:right;}

  .options-note{font-size:12.5px; color:var(--muted); margin-top:8px;}

  .fige .peut-figer{pointer-events:none; opacity:.62;}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(20,15,10,.5); align-items:center; justify-content:center; padding:20px; z-index:50; overflow-y:auto;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--card); border-radius:14px; padding:24px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; margin:auto;}
  .modal h2{font-size:17px; margin:0 0 14px;}
  .poste-row{display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border);}
  .poste-row b{flex:1;}
  @media (max-width:600px){ input, select, textarea{ font-size:16px !important; } }
</style>
</head>
<body>
<div class="wrap" id="page">
  <div class="co-page-head co-fade">
    <div>
      <a class="co-back" href="devis.html">← Tous les devis</a>
      <h1 id="pageTitre">Devis</h1>
      <p class="subtitle" id="pageSousTitre"></p>
    </div>
    <div class="co-actions" id="actionsHaut"></div>
  </div>

  <div class="fige-note" id="figeNote" style="display:none;"></div>

  <div id="editeur"></div>

  <div class="totaux-barre" id="totauxBarre"></div>
</div>

<!-- Bibliothèque de postes -->
<div class="modal-overlay" id="postesOverlay">
  <div class="modal">
    <h2>Bibliothèque de postes</h2>
    <p style="font-size:12.5px; color:var(--muted); margin:0 0 12px;">Clique un poste pour l'ajouter au groupe choisi. L'étoile ☆ d'une ligne du devis l'enregistre ici.</p>
    <div id="postesListe"></div>
    <div class="modal-actions" style="display:flex; justify-content:flex-end; margin-top:16px;">
      <button type="button" class="co-btn ghost" id="postesFermer">Fermer</button>
    </div>
  </div>
</div>

<script>
function montantCibleSuggere(total){
  const pas = total >= 20000 ? 1000 : (total >= 5000 ? 500 : 100);
  return Math.max(pas, Math.ceil((total - 1) / pas) * pas);
}

const UNITES_USUELLES = ['Forfait','Forfaits','Journée','Journées','Cachet','Cachets','Cachets (0,5j)','Services','Repas','Jours','Unité','Fiches'];

let devis = null;            // le document en cours d'édition
let tousDevis = [];          // pour la numérotation et les variantes
let clientsCache = [], postesCache = [], reglagesCache = {}, annuaireNoms = [];
let posteCibleGroupe = null; // groupe qui recevra le poste choisi dans la modale

// --- Sauvegarde débouncée ---------------------------------------------------
let timerSauvegarde = null, sauvegardeEnCours = false;
function marquerModifie(){
  if(devis.fige) return;
  afficherEtatSauvegarde('Modifications…');
  clearTimeout(timerSauvegarde);
  timerSauvegarde = setTimeout(sauvegarder, 700);
}
async function sauvegarder(){
  if(sauvegardeEnCours){ marquerModifie(); return; }
  sauvegardeEnCours = true;
  afficherEtatSauvegarde('Enregistrement…');
  const { error } = await CurieuxDB.upsertOne('devis', devis);
  sauvegardeEnCours = false;
  afficherEtatSauvegarde(error ? '⚠ Non enregistré — réessaie' : 'Enregistré ✓');
}
function afficherEtatSauvegarde(texte){
  const el = document.getElementById('etatSauvegarde');
  if(el) el.textContent = texte;
}
window.addEventListener('beforeunload', ()=>{ if(timerSauvegarde){ clearTimeout(timerSauvegarde); sauvegarder(); } });

// --- Chargement -------------------------------------------------------------
async function charger(){
  const id = new URLSearchParams(location.search).get('id');
  const [tous, clients, postes, reglages, musiciens, techniciens] = await Promise.all([
    CurieuxDB.fetchAll('devis'),
    CurieuxDB.fetchAll('devis_clients'),
    CurieuxDB.fetchAll('devis_postes'),
    CurieuxDB.fetchDevisReglages(),
    CurieuxDB.fetchAll('musiciens'),
    CurieuxDB.fetchAll('techniciens'),
  ]);
  tousDevis = tous; clientsCache = clients; postesCache = postes; reglagesCache = reglages;
  annuaireNoms = [...musiciens, ...techniciens].map(p=> [p.prenom, p.nom].filter(Boolean).join(' ')).filter(Boolean).sort();
  devis = tous.find(d=> d.id === id);
  if(!devis){
    document.getElementById('editeur').innerHTML = '<p class="empty-hint co-vide">Ce devis n\'existe pas (ou la migration SQL n\'est pas passée).</p>';
    return;
  }
  renderTout();
}

// --- Rendu ------------------------------------------------------------------
function renderTout(){
  document.getElementById('page').classList.toggle('fige', !!devis.fige);
  renderTete();
  renderEditeur();
  renderTotaux();
}

function renderTete(){
  const estBudget = typeDocDe(devis) === 'budget';
  document.getElementById('pageTitre').textContent = devis.titre || 'Sans titre';
  const morceaux = [estBudget ? 'Budget prévisionnel (interne)' : 'Devis client'];
  if(devis.numero) morceaux.push(devis.numero);
  if(!estBudget) morceaux.push(DEVIS_STATUTS[devis.statut] || 'Brouillon');
  if(devis.variante) morceaux.push('variante « ' + devis.variante + ' »');
  document.getElementById('pageSousTitre').textContent = morceaux.join(' · ');

  // Le bandeau dit toujours à quel document on touche : un budget se retravaille
  // sans fin, un devis envoyé est figé.
  const note = document.getElementById('figeNote');
  const budgetSource = devis.budgetId ? tousDevis.find(d=> d.id === devis.budgetId) : null;
  if(devis.fige){
    note.style.display = 'block'; note.className = 'fige-note';
    note.innerHTML = 'Ce devis a été envoyé : il est figé, à l\'image de ce que le client a reçu. '
      + 'Pour continuer à travailler, duplique-le en nouvelle variante'
      + (budgetSource ? ` — ou reprends <a href="devis-editeur.html?id=${encodeURIComponent(budgetSource.id)}">son budget</a>.` : '.');
  } else if(estBudget){
    note.style.display = 'block'; note.className = 'budget-note';
    note.innerHTML = '<b>Budget prévisionnel — document interne.</b> Il n\'est ni numéroté ni envoyé : '
      + 'c\'est ton outil de travail, tu le retouches quand tu veux. Quand le chiffrage tient, '
      + '« Générer le devis client » en tire la version commerciale, que tu pourras dépouiller sans y toucher.';
  } else {
    note.style.display = 'block'; note.className = 'devis-note';
    note.innerHTML = '<b>Devis client.</b> C\'est ce document qui part chez le client et suit le cycle '
      + 'brouillon → envoyé → accepté.'
      + (budgetSource ? ` Il vient du budget <a href="devis-editeur.html?id=${encodeURIComponent(budgetSource.id)}">${escapeHtml(budgetSource.titre || 'sans titre')}</a>.` : '');
  }

  const variantes = tousDevis.filter(d=> d.projetId === devis.projetId);
  const actions = [];
  actions.push(`<button type="button" class="co-btn secondary md" id="pdfBtn">${estBudget ? 'PDF budget' : 'PDF'}</button>`);
  if(estBudget) actions.push('<button type="button" class="co-btn primary md" id="genererBtn">Générer le devis client</button>');
  actions.push(`<button type="button" class="co-btn secondary md" id="dupliquerBtn">Dupliquer${estBudget ? ' ce budget' : ' en variante'}</button>`);
  if(variantes.length > 1 && !devis.retenue) actions.push('<button type="button" class="co-btn secondary md" id="retenueBtn">Marquer retenu</button>');
  if(!estBudget && !devis.fige && devis.statut === 'brouillon') actions.push('<button type="button" class="co-btn primary md" id="envoyerBtn">Passer en « envoyé »</button>');
  if(!estBudget && devis.statut === 'envoye'){
    actions.push('<button type="button" class="co-btn primary md" id="accepteBtn">Accepté ✓</button>');
    actions.push('<button type="button" class="co-btn ghost md" id="refuseBtn">Refusé</button>');
  }
  actions.push('<button type="button" class="co-btn danger md" id="supprimerBtn">Supprimer</button>');
  document.getElementById('actionsHaut').innerHTML = actions.join('');

  const genererBtn = document.getElementById('genererBtn');
  if(genererBtn) genererBtn.addEventListener('click', async ()=>{
    const dejaTires = tousDevis.filter(d=> d.budgetId === devis.id).length;
    if(dejaTires && !confirm(`Ce budget a déjà donné ${dejaTires} devis client. En générer un de plus ?`)) return;
    const copie = JSON.parse(JSON.stringify(devis));
    copie.id = genId('devis');
    copie.typeDoc = 'devis';
    copie.budgetId = devis.id;
    copie.numero = ''; copie.statut = 'brouillon'; copie.fige = false; copie.retenue = false;
    copie.memo = '';                       // le mémo interne ne suit pas côté client
    copie.variante = dejaTires ? `Devis client ${dejaTires + 1}` : 'Devis client';
    const { error } = await CurieuxDB.upsertOne('devis', copie);
    if(error){ alert('Génération impossible :\n\n' + error.message); return; }
    location.href = 'devis-editeur.html?id=' + encodeURIComponent(copie.id);
  });

  document.getElementById('pdfBtn').addEventListener('click', ()=>{
    const client = clientsCache.find(c=> c.id === devis.clientId) || null;
    try{ genererDevisPdf(devis, client, reglagesCache); }
    catch(e){ alert('Le PDF n\'a pas pu être généré :\n\n' + e.message); }
  });
  document.getElementById('dupliquerBtn').addEventListener('click', async ()=>{
    const copie = JSON.parse(JSON.stringify(devis));
    copie.id = genId('devis');
    copie.typeDoc = typeDocDe(devis);
    copie.numero = ''; copie.statut = 'brouillon'; copie.fige = false; copie.retenue = false;
    copie.variante = prompt('Nom de la nouvelle variante ? (ex. « Sans clip »)', devis.variante ? devis.variante + ' (copie)' : 'Variante 2') || 'Variante';
    const { error } = await CurieuxDB.upsertOne('devis', copie);
    if(error){ alert('Duplication impossible :\n\n' + error.message); return; }
    location.href = 'devis-editeur.html?id=' + encodeURIComponent(copie.id);
  });
  const retenueBtn = document.getElementById('retenueBtn');
  if(retenueBtn) retenueBtn.addEventListener('click', async ()=>{
    for(const v of variantes){
      const doitEtre = v.id === devis.id;
      if(!!v.retenue !== doitEtre){ v.retenue = doitEtre; await CurieuxDB.upsertOne('devis', v); }
    }
    devis.retenue = true;
    renderTete();
  });
  const envoyerBtn = document.getElementById('envoyerBtn');
  if(envoyerBtn) envoyerBtn.addEventListener('click', async ()=>{
    if(!confirm('Passer ce devis en « envoyé » ?\n\nIl reçoit son numéro définitif et devient figé — la suite du travail se fait en le dupliquant.')) return;
    devis.numero = devis.numero || prochainNumeroDevis(tousDevis);
    devis.statut = 'envoye'; devis.fige = true;
    devis.dateEnvoi = new Date().toISOString().slice(0, 10);
    await CurieuxDB.upsertOne('devis', devis);
    renderTout();
  });
  const accepteBtn = document.getElementById('accepteBtn');
  if(accepteBtn) accepteBtn.addEventListener('click', async ()=>{
    devis.statut = 'accepte';
    await CurieuxDB.upsertOne('devis', devis); renderTete();
  });
  const refuseBtn = document.getElementById('refuseBtn');
  if(refuseBtn) refuseBtn.addEventListener('click', async ()=>{
    devis.statut = 'refuse';
    await CurieuxDB.upsertOne('devis', devis); renderTete();
  });
  document.getElementById('supprimerBtn').addEventListener('click', async ()=>{
    if(!confirm(`Supprimer définitivement « ${devis.titre || 'ce devis'} »${devis.variante ? ' (' + devis.variante + ')' : ''} ?`)) return;
    await CurieuxDB.removeOne('devis', devis.id);
    location.href = 'devis.html';
  });
}

function renderSection(sec, si){
  const fige = devis.fige ? 'disabled' : '';
  const tvaDefaut = devisNombre(devis.tvaDefaut, 20);
  const nbCols = sec.remuneration ? 9 : 8;

  // Une seule table par section : un en-tête de colonnes, puis un <tbody> par
  // groupe. Avant, chaque groupe portait sa propre table et donc sa propre
  // rangée d'intitulés — la même ligne répétée cinq fois dans une section.
  const corps = (sec.groupes || []).map((grp, gi)=> `
    <tbody data-groupe="${si}:${gi}">
      ${(sec.groupes.length > 1 || grp.titre) ? `<tr class="grp-band"><td colspan="${nbCols}">
        <div class="grp-band-in">
          <input type="text" value="${escapeAttr(grp.titre || '')}" placeholder="Titre du groupe (Préparation, REC, Captation…)" data-grp-titre="${si}:${gi}" ${fige}>
          <button type="button" class="l-btn grp-detacher" data-grp-detacher="${si}:${gi}" ${fige}
            title="Détacher ce groupe : il devient une section à part entière, avec son propre sous-total, son taux de TVA et sa case « hors frais généraux ».">⤴ En faire une section</button>
        </div>
      </td></tr>` : ''}
      ${(grp.lignes || []).map((l, li)=> renderLigne(sec, si, gi, l, li)).join('')}
      <tr class="ajout"><td colspan="${nbCols}">
        <button type="button" class="co-btn ghost sm peut-figer" data-ajout-ligne="${si}:${gi}" ${fige}>+ Ligne</button>
        <button type="button" class="co-btn ghost sm peut-figer" data-ajout-poste="${si}:${gi}" ${fige}>+ Depuis la bibliothèque</button>
      </td></tr>
    </tbody>`).join('');

  return `<div class="carte sec-carte peut-figer" data-section="${si}">
    <div class="sec-head">
      <span class="sec-num">${si + 1}</span>
      <input type="text" class="sec-titre" value="${escapeAttr(sec.titre || '')}" placeholder="Titre de la section" data-sec-titre="${si}" ${fige}>
      <label style="font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px; white-space:nowrap;"
             title="Coché, les lignes de cette section alimentent les charges patronales, selon le régime choisi ligne par ligne.">
        <input type="checkbox" data-sec-rem="${si}" ${sec.remuneration ? 'checked' : ''} ${fige} style="width:auto;"> rémunération
      </label>
      <label style="font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px; white-space:nowrap;"
             title="Coché, cette section — et les charges patronales qu'elle génère — sort de l'assiette sur laquelle les frais généraux et les imprévus sont calculés. Le montant des lignes reste dans le total du devis : seuls les frais généraux et les imprévus diminuent. À utiliser quand un financeur impose de ne pas prélever de frais généraux sur un poste (sous-traitance refacturée, achats à l'euro l'euro…).">
        <input type="checkbox" data-sec-horsfg="${si}" ${sec.horsFG ? 'checked' : ''} ${fige} style="width:auto;"> hors frais généraux
      </label>
      <select data-sec-tva="${si}" title="TVA de la section" ${fige}>
        <option value="" ${sec.tva == null || sec.tva === '' ? 'selected' : ''}>TVA ${tvaDefaut.toLocaleString('fr-FR')} % (défaut)</option>
        <option value="5.5" ${String(sec.tva) === '5.5' ? 'selected' : ''}>TVA 5,5 %</option>
        <option value="20" ${String(sec.tva) === '20' ? 'selected' : ''}>TVA 20 %</option>
        <option value="0" ${String(sec.tva) === '0' ? 'selected' : ''}>TVA 0 %</option>
      </select>
      <span class="sec-outils">
        <button type="button" class="l-btn" data-sec-monter="${si}" title="Monter la section" ${fige}>▲</button>
        <button type="button" class="l-btn" data-sec-descendre="${si}" title="Descendre la section" ${fige}>▼</button>
        <button type="button" class="l-btn" data-sec-suppr="${si}" title="Supprimer la section" ${fige}>✕</button>
      </span>
    </div>

    <div class="lignes-scroll"><table class="feuille">
      <colgroup>
        <col style="width:25%"><col style="width:20%">
        <col style="width:64px"><col style="width:60px"><col style="width:124px"><col style="width:110px">
        ${sec.remuneration ? '<col style="width:104px">' : ''}
        <col style="width:128px"><col style="width:120px">
      </colgroup>
      <thead><tr>
        <th>Intitulé</th><th>Nom / infos</th>
        <th class="n">Jours</th><th class="n">Qté</th><th>Unité</th><th class="n">P.U. €</th>
        ${sec.remuneration ? '<th>Régime</th>' : ''}
        <th class="n">Total</th><th></th>
      </tr></thead>
      ${corps}
    </table></div>

    <div class="sec-pied">
      <button type="button" class="co-btn ghost sm peut-figer" data-ajout-groupe="${si}" ${fige}>+ Groupe</button>
      <span class="sec-soustotal" data-sec-soustotal="${si}"></span>
    </div>
  </div>`;
}

    l.discuter ? 'discuter' : '',

  return `<tr class="${classes}" data-ligne="${cle}">

    ${sec.remuneration ? `<td><select class="chip r-${escapeAttr(l.regime || 'aucun')}" data-l="${cle}:regime" ${fige}>
      ${DEVIS_REGIMES.map(([v, lib, court])=> `<option value="${v}" ${l.regime === v ? 'selected' : ''} title="${escapeAttr(lib)}">${escapeHtml(court || lib)}</option>`).join('')}
    </select></td>` : ''}
    <td class="c-total" data-total="${cle}">${l.etat === 'optionnelle' ? '<span class="opt">OPTION</span>' : ''}${fmtEurosDevis(totalLigneDevis(l))}</td>
    <td class="c-outils"><span class="outils"><select class="chip e-${escapeAttr(etat)}" data-l="${cle}:etat" title="État de la ligne" ${fige}>
        <option value="incluse" ${etat === 'incluse' ? 'selected' : ''}>Incluse</option>
        <option value="optionnelle" ${etat === 'optionnelle' ? 'selected' : ''}>Option</option>
        <option value="hors_devis" ${etat === 'hors_devis' ? 'selected' : ''}>Hors devis</option>
      </select><button type="button" class="l-btn${l.discuter ? ' actif' : ''}" data-l-discuter="${cle}" title="À discuter" ${fige}>${l.discuter ? '●' : '○'}</button><button type="button" class="l-btn" data-l-poste="${cle}" title="Enregistrer dans la bibliothèque" ${fige}>☆</button><button type="button" class="l-btn" data-l-monter="${cle}" title="Monter" ${fige}>▲</button><button type="button" class="l-btn" data-l-descendre="${cle}" title="Descendre" ${fige}>▼</button><button type="button" class="l-btn" data-l-suppr="${cle}" title="Supprimer" ${fige}>✕</button></span></td>
  </tr>`;
}

function renderRendus(){

  holder.innerHTML = (devis.rendus || []).map((r, i)=> `
    <div style="display:flex; gap:8px; margin-bottom:8px; align-items:flex-start;">

      <textarea rows="3" data-rendu-texte="${i}" placeholder="Un titre par ligne" style="flex:1;" ${fige}>${escapeHtml(r.texte || '')}</textarea>

    </div>`).join('');
  holder.querySelectorAll('[data-rendu-titre]').forEach(el=> el.addEventListener('input', ()=>{
    devis.rendus[+el.dataset.renduTitre].titre = el.value; marquerModifie();
  }));
  holder.querySelectorAll('[data-rendu-texte]').forEach(el=> el.addEventListener('input', ()=>{

  holder.querySelectorAll('[data-rendu-suppr]').forEach(el=> el.addEventListener('click', ()=>{

      <span class="lib">Imprévus</span>
      <span class="assiette">base ${fmtEurosDevis(calc.baseFG)}</span>
      <input type="number" step="0.0001" class="pct" id="dImprevus" value="${escapeAttr(devis.imprevusPct != null ? devis.imprevusPct : 7)}" ${fige}> %
      <span class="mont" id="imprevusMont">${fmtEurosDevis(calc.imprevus)}</span>
    </div>
    <div class="calc-ligne">
      <span class="lib">Émission fiches de paie / forfait compta</span>
      <input type="number" class="pct" id="dFichesNb" value="${escapeAttr(fp.nb || 0)}" ${fige}> fiches ×
      <input type="number" step="0.5" class="pct" id="dFichesPrix" value="${escapeAttr(fp.prix != null ? fp.prix : 28)}" ${fige}> €
      <span class="mont" id="fichesMont">${fmtEurosDevis(calc.fichesPaie)}</span>
    </div>
    <div class="calc-ligne">
      <span class="lib">Remise commerciale (déduite du total HT)</span>
      <input type="text" id="dRemiseLib" value="${escapeAttr((devis.remise || {}).libelle || 'Remise commerciale')}" style="flex:1 1 150px;" ${fige}>
      − <input type="number" step="0.01" class="mt" id="dRemiseMont" value="${escapeAttr((devis.remise || {}).montant || 0)}" ${fige}> €
    </div>
    <div class="calc-ligne cible-bloc" style="border-top:1.5px solid var(--accent); padding-top:12px;">
      <span class="lib" style="font-weight:800;">Caler sur un montant cible (HT)</span>
      <input type="number" step="0.01" id="cibleMontant" value="${escapeAttr(montantCibleSuggere(calc.totalHT))}" ${fige}>
      <button type="button" class="co-btn secondary sm" id="cibleBtn" ${fige}>Caler via les imprévus</button>
      <span style="font-size:11.5px; color:var(--muted);">ajuste le % d'imprévus pour tomber pile</span>
    </div>`;

  const lier = (id, fn)=> document.getElementById(id).addEventListener('input', ()=>{ fn(); marquerModifie(); majTotaux(); });
  lier('dFraisGeneraux', ()=> devis.fraisGenerauxPct = devisNombre(document.getElementById('dFraisGeneraux').value, 0));
  lier('dImprevus', ()=> devis.imprevusPct = devisNombre(document.getElementById('dImprevus').value, 0));
  lier('dFichesNb', ()=> { devis.fichesPaie = devis.fichesPaie || {}; devis.fichesPaie.nb = devisNombre(document.getElementById('dFichesNb').value, 0); });
  lier('dFichesPrix', ()=> { devis.fichesPaie = devis.fichesPaie || {}; devis.fichesPaie.prix = devisNombre(document.getElementById('dFichesPrix').value, 0); });
  lier('dRemiseLib', ()=> { devis.remise = devis.remise || {}; devis.remise.libelle = document.getElementById('dRemiseLib').value; });
  lier('dRemiseMont', ()=> { devis.remise = devis.remise || {}; devis.remise.montant = devisNombre(document.getElementById('dRemiseMont').value, 0); });

  const cibleChamp = document.getElementById('cibleMontant');
  cibleChamp.addEventListener('input', ()=>{ cibleChamp.dataset.touche = '1'; });
  document.getElementById('cibleBtn').addEventListener('click', ()=>{
    const cible = devisNombre(document.getElementById('cibleMontant').value, 0);

    const p = resoudreImprevusPourCible(devis, cible);

    devis.imprevusPct = Math.round(p * 100000) / 100000;
    document.getElementById('dImprevus').value = devis.imprevusPct;
    marquerModifie(); majTotaux();
  });
}

    <span><span class="tt">TOTAL HT</span><br><b id="totalHT">${fmtEurosDevis(calc.totalHT)}</b></span>
    <span>${tva}<br><span class="tt">TOTAL TTC</span> <b id="totalTTC" style="font-size:16px;">${fmtEurosDevis(calc.totalTTC)}</b></span>
    ${calc.options.length ? `<span class="tt">+ ${calc.options.length} option${calc.options.length > 1 ? 's' : ''} : ${fmtEurosDevis(calc.optionsTotal)} HT</span>` : ''}
    <span class="etat-sauvegarde" id="etatSauvegarde">Enregistré ✓</span>`;
}

/* Recalcule et met à jour les montants SANS re-rendre les champs : la frappe
   garde le focus, seuls les totaux bougent. */
function majTotaux(){
  const calc = calculerDevis(devis);
  document.querySelectorAll('[data-total]').forEach(el=>{
    const [si, gi, li] = el.dataset.total.split(':').map(Number);
    const l = devis.sections[si].groupes[gi].lignes[li];
    if(!l) return;
    el.innerHTML = (l.etat === 'optionnelle' ? '<span class="opt">OPTION</span>' : '')
      + escapeHtml(fmtEurosDevis(totalLigneDevis(l)));
  });
  calc.sections.forEach((s, si)=>{
    const el = document.querySelector(`[data-sec-soustotal="${si}"]`);
    if(el) el.innerHTML = '<small>Sous-total</small>' + escapeHtml(fmtEurosDevis(s.sousTotal));
  });
  calc.chargesLignes.forEach(c=>{
    const el = document.querySelector(`[data-charge-mont="${c.cle}"]`);
    if(el) el.textContent = fmtEurosDevis(c.montant);
    const assiette = el && el.closest('.calc-ligne') && el.closest('.calc-ligne').querySelector('.assiette');
    if(assiette) assiette.textContent = 'assiette ' + fmtEurosDevis(c.assiette);
  });
  const ct = document.getElementById('chargesTotal'); if(ct) ct.textContent = fmtEurosDevis(calc.chargesTotal);
  const fg = document.getElementById('fgMont'); if(fg) fg.textContent = fmtEurosDevis(calc.fraisGeneraux);
  const im = document.getElementById('imprevusMont'); if(im) im.textContent = fmtEurosDevis(calc.imprevus);
  const fi = document.getElementById('fichesMont'); if(fi) fi.textContent = fmtEurosDevis(calc.fichesPaie);
  document.querySelectorAll('#diversCarte .assiette').forEach(el=> el.textContent = 'base ' + fmtEurosDevis(calc.baseFG));
  const cible = document.getElementById('cibleMontant');
  if(cible && !cible.dataset.touche && document.activeElement !== cible){
    cible.value = montantCibleSuggere(calc.totalHT);
  }
  renderTotaux();
}

// --- Branchements -----------------------------------------------------------
function brancherEntete(){
  const lier = (id, fn, evenement)=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener(evenement || 'input', ()=>{ fn(el); marquerModifie(); });
  };
  lier('dTitre', el=> { devis.titre = el.value; document.getElementById('pageTitre').textContent = el.value || 'Devis sans titre'; });
  lier('dClient', el=> devis.clientId = el.value, 'change');
  lier('dVariante', el=> devis.variante = el.value);
  lier('dDate', el=> devis.date = el.value);
  lier('dValidite', el=> devis.validiteJours = devisNombre(el.value, 30));
  lier('dAcompte', el=> devis.acomptePct = devisNombre(el.value, 30));
  lier('dIntervention', el=> devis.intervention = el.value);
  lier('dHorsDevis', el=> devis.horsDevisTexte = el.value);
  lier('dMemo', el=> devis.memo = el.value);
  lier('dConditions', el=> devis.conditionsReglement = el.value);
  const aj = document.getElementById('ajouterRendu');
  if(aj) aj.addEventListener('click', ()=>{
    devis.rendus = devis.rendus || [];
    devis.rendus.push({ titre: '', texte: '' });
    marquerModifie(); renderRendus();
  });
}

function brancherSections(){
  const ed = document.getElementById('editeur');

  // Champs de ligne : la frappe met à jour le modèle + les totaux, sans re-rendu.
  ed.querySelectorAll('[data-l]').forEach(el=>{
    const [si, gi, li, champ] = el.dataset.l.split(':');
    const evenement = el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(evenement, ()=>{
      const l = devis.sections[+si].groupes[+gi].lignes[+li];
      if(!l) return;
      if(champ === 'journees' || champ === 'qte' || champ === 'prix'){
        l[champ] = el.value === '' ? '' : el.value.replace(',', '.');
      } else {
        l[champ] = el.value;
      }
      if(champ === 'regime'){
        el.className = 'chip r-' + (l.regime || 'aucun');
      }
      if(champ === 'etat'){
        el.className = 'chip e-' + (l.etat || 'incluse');
        const tr = el.closest('tr');
        if(tr){
          tr.classList.toggle('optionnelle', l.etat === 'optionnelle');
          tr.classList.toggle('hors', l.etat === 'hors_devis');
        }
      }
      marquerModifie(); majTotaux();
    });
  });

  ed.querySelectorAll('[data-sec-titre]').forEach(el=> el.addEventListener('input', ()=>{
    devis.sections[+el.dataset.secTitre].titre = el.value; marquerModifie();
  }));
  ed.querySelectorAll('[data-grp-titre]').forEach(el=> el.addEventListener('input', ()=>{
    const [si, gi] = el.dataset.grpTitre.split(':').map(Number);
    devis.sections[si].groupes[gi].titre = el.value; marquerModifie();
  }));
  ed.querySelectorAll('[data-sec-horsfg]').forEach(el=> el.addEventListener('change', ()=>{
    devis.sections[+el.dataset.secHorsfg].horsFG = el.checked;
    marquerModifie(); renderDivers(); majTotaux();
  }));
  ed.querySelectorAll('[data-sec-rem]').forEach(el=> el.addEventListener('change', ()=>{
    devis.sections[+el.dataset.secRem].remuneration = el.checked;
    marquerModifie(); renderEditeur(); majTotaux();
  }));
  ed.querySelectorAll('[data-sec-tva]').forEach(el=> el.addEventListener('change', ()=>{
    devis.sections[+el.dataset.secTva].tva = el.value === '' ? null : devisNombre(el.value, null);
    marquerModifie(); majTotaux();
  }));
  ed.querySelectorAll('[data-sec-monter]').forEach(el=> el.addEventListener('click', ()=> bougerSection(+el.dataset.secMonter, -1)));
  ed.querySelectorAll('[data-sec-descendre]').forEach(el=> el.addEventListener('click', ()=> bougerSection(+el.dataset.secDescendre, +1)));
  ed.querySelectorAll('[data-sec-suppr]').forEach(el=> el.addEventListener('click', ()=>{
    const si = +el.dataset.secSuppr;
    const sec = devis.sections[si];
    const nb = (sec.groupes || []).reduce((s, g)=> s + (g.lignes || []).length, 0);
    if(!confirm(`Supprimer la section « ${sec.titre || 'sans titre'} »${nb ? ` et ses ${nb} ligne${nb > 1 ? 's' : ''}` : ''} ?`)) return;
    devis.sections.splice(si, 1);
    marquerModifie(); renderEditeur(); majTotaux();
  }));

  ed.querySelectorAll('[data-ajout-ligne]').forEach(el=> el.addEventListener('click', ()=>{
    const [si, gi] = el.dataset.ajoutLigne.split(':').map(Number);
    devis.sections[si].groupes[gi].lignes.push(nouvelleLigneDevis(devis.sections[si].remuneration));
    marquerModifie(); renderEditeur(); majTotaux();
    // Le focus va sur l'intitulé de la ligne qu'on vient d'ajouter.
    const lignes = devis.sections[si].groupes[gi].lignes;
    const champ = document.querySelector(`[data-l="${si}:${gi}:${lignes.length - 1}:intitule"]`);
    if(champ) champ.focus();
  }));
  ed.querySelectorAll('[data-grp-detacher]').forEach(el=> el.addEventListener('click', ()=>{
    const [si, gi] = el.dataset.grpDetacher.split(':').map(Number);
    const sec = devis.sections[si];
    const grp = sec.groupes[gi];
    if(sec.groupes.length === 1){
      alert('Ce groupe est le seul de sa section : elle joue déjà ce rôle.');
      return;
    }
    sec.groupes.splice(gi, 1);
    devis.sections.splice(si + 1, 0, {
      id: genId('sec'),
      titre: grp.titre || 'Nouvelle section',
      remuneration: sec.remuneration,
      tva: sec.tva,
      horsFG: !!sec.horsFG,
      // Le titre remonte sur la section : le garder aussi sur le groupe le
      // ferait apparaître deux fois, l'un sous l'autre.
      groupes: [{ ...grp, titre: '' }],
    });
    marquerModifie(); renderEditeur(); majTotaux();
  }));

  ed.querySelectorAll('[data-ajout-groupe]').forEach(el=> el.addEventListener('click', ()=>{
    devis.sections[+el.dataset.ajoutGroupe].groupes.push({ id: genId('grp'), titre: '', lignes: [] });
    marquerModifie(); renderEditeur();
  }));
  ed.querySelectorAll('[data-ajout-poste]').forEach(el=> el.addEventListener('click', ()=>{
    posteCibleGroupe = el.dataset.ajoutPoste;
    renderPostes();
    document.getElementById('postesOverlay').classList.add('open');
  }));

  const ajSection = document.getElementById('ajouterSection');
  if(ajSection) ajSection.addEventListener('click', ()=>{
    devis.sections.push({ id: genId('sec'), titre: '', remuneration: false, tva: null,
      groupes: [{ id: genId('grp'), titre: '', lignes: [] }] });
    marquerModifie(); renderEditeur();
  });

  ed.querySelectorAll('[data-l-suppr]').forEach(el=> el.addEventListener('click', ()=>{
    const [si, gi, li] = el.dataset.lSuppr.split(':').map(Number);
    devis.sections[si].groupes[gi].lignes.splice(li, 1);
    marquerModifie(); renderEditeur(); majTotaux();
  }));
  ed.querySelectorAll('[data-l-discuter]').forEach(el=> el.addEventListener('click', ()=>{
    const [si, gi, li] = el.dataset.lDiscuter.split(':').map(Number);
    const l = devis.sections[si].groupes[gi].lignes[li];
    l.discuter = !l.discuter;
    el.textContent = l.discuter ? '●' : '○';
    el.classList.toggle('actif', !!l.discuter);
    const tr = el.closest('tr');
    if(tr) tr.classList.toggle('discuter', !!l.discuter);
    marquerModifie();
  }));
  ed.querySelectorAll('[data-l-monter]').forEach(el=> el.addEventListener('click', ()=> bougerLigne(el.dataset.lMonter, -1)));
  ed.querySelectorAll('[data-l-descendre]').forEach(el=> el.addEventListener('click', ()=> bougerLigne(el.dataset.lDescendre, +1)));
  ed.querySelectorAll('[data-l-poste]').forEach(el=> el.addEventListener('click', async ()=>{
    const [si, gi, li] = el.dataset.lPoste.split(':').map(Number);
    const l = devis.sections[si].groupes[gi].lignes[li];
    const poste = { id: genId('poste'), intitule: l.intitule || '', unite: l.unite || '',
      prix: devisNombre(l.prix, 0), regime: l.regime || 'aucun' };
    if(!poste.intitule){ alert('Donne d\'abord un intitulé à la ligne.'); return; }
    const { error } = await CurieuxDB.upsertOne('devis_postes', poste);
    if(error){ alert('Enregistrement impossible :\n\n' + error.message); return; }
    postesCache.push(poste);
    el.textContent = '★';
  }));
}

function bougerLigne(cle, delta){
  const [si, gi, li] = cle.split(':').map(Number);
  const lignes = devis.sections[si].groupes[gi].lignes;
  const vers = li + delta;
  if(vers < 0 || vers >= lignes.length) return;
  [lignes[li], lignes[vers]] = [lignes[vers], lignes[li]];
  marquerModifie(); renderEditeur(); majTotaux();
}
function bougerSection(si, delta){
  const vers = si + delta;
  if(vers < 0 || vers >= devis.sections.length) return;
  [devis.sections[si], devis.sections[vers]] = [devis.sections[vers], devis.sections[si]];
  marquerModifie(); renderEditeur(); majTotaux();
}

// --- Bibliothèque de postes -------------------------------------------------
function renderPostes(){
  const holder = document.getElementById('postesListe');
  if(postesCache.length === 0){
    holder.innerHTML = '<p style="color:var(--muted); font-size:13px;">Vide pour l\'instant — enregistre une ligne avec son étoile ☆ pour la retrouver ici.</p>';
    return;
  }
  holder.innerHTML = postesCache.map(p=> `
    <div class="poste-row">
      <b>${escapeHtml(p.intitule)}</b>
      <span style="color:var(--muted); font-size:12px;">${escapeHtml([p.unite, p.prix != null ? fmtEurosDevis(p.prix) : ''].filter(Boolean).join(' · '))}</span>
      <button type="button" class="co-btn secondary sm" data-poste-prendre="${escapeAttr(p.id)}">Ajouter</button>
      <button type="button" class="l-btn" data-poste-suppr="${escapeAttr(p.id)}" title="Retirer de la bibliothèque">✕</button>
    </div>`).join('');
  holder.querySelectorAll('[data-poste-prendre]').forEach(b=> b.addEventListener('click', ()=>{
    const p = postesCache.find(x=> x.id === b.dataset.postePrendre);
    if(!p || !posteCibleGroupe) return;
    const [si, gi] = posteCibleGroupe.split(':').map(Number);
    const l = nouvelleLigneDevis(devis.sections[si].remuneration);
    l.intitule = p.intitule; l.unite = p.unite || ''; l.prix = p.prix != null ? p.prix : 0;
    if(devis.sections[si].remuneration && p.regime) l.regime = p.regime;
    devis.sections[si].groupes[gi].lignes.push(l);
    document.getElementById('postesOverlay').classList.remove('open');
    marquerModifie(); renderEditeur(); majTotaux();
  }));
  holder.querySelectorAll('[data-poste-suppr]').forEach(b=> b.addEventListener('click', async ()=>{
    await CurieuxDB.removeOne('devis_postes', b.dataset.posteSuppr);
    postesCache = postesCache.filter(x=> x.id !== b.dataset.posteSuppr);
    renderPostes();
  }));
}
document.getElementById('postesFermer').addEventListener('click', ()=> document.getElementById('postesOverlay').classList.remove('open'));
document.getElementById('postesOverlay').addEventListener('click', (e)=>{
  if(e.target === document.getElementById('postesOverlay')) document.getElementById('postesOverlay').classList.remove('open');
});

// Autocomplétions partagées (annuaire + unités usuelles).
const dl1 = document.createElement('datalist'); dl1.id = 'unitesUsuelles';
dl1.innerHTML = UNITES_USUELLES.map(u=> `<option value="${escapeAttr(u)}">`).join('');
document.body.appendChild(dl1);
const dl2 = document.createElement('datalist'); dl2.id = 'annuaireNoms';
document.body.appendChild(dl2);

charger().then(()=>{
  dl2.innerHTML = annuaireNoms.map(n=> `<option value="${escapeAttr(n)}">`).join('');
});
</script>
