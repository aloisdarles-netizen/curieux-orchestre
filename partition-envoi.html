     droit sur chaque fichier se vérifie en base (envoi_partitions) puis dans
     /api/partition — jamais ici. Pas de PWA : le bibliothécaire d'un orchestre
     étranger n'installe pas notre application, il vient une fois chercher un
     jeu de parties. -->

<style>
  /* Une colonne, même sur grand écran. Un bibliothécaire travaille sur un
     ordinateur, mais une liste de parties étirée sur 1 100 px met le poids du
     fichier à vingt centimètres de son nom. */
  .wrap{max-width:720px; margin:0 auto; padding-bottom:40px;}
  .entete{margin-bottom:16px;}
  .sous{color:var(--muted); font-size:13.5px; margin:4px 0 0; line-height:1.55;}

  /* LE JAPONAIS A BESOIN D'UNE POLICE, PAS D'UN REPLI GÉNÉRIQUE.
     Les deux fontes de la maison — Ufficio, Host Grotesk — n'ont pas un seul
     idéogramme : sur une page japonaise, le navigateur tombait sur le
     « sans-serif » du système, c'est-à-dire n'importe quoi selon la machine,
     avec des graisses synthétisées qui vont du gras baveux à l'illisible.
     On garde les fontes de la maison EN TÊTE — elles portent les chiffres, les
     unités et le nom des fichiers, qui restent en caractères latins — et on
     nomme derrière elles les gothiques japonaises réellement installées sur
     macOS, iOS, Windows et Android. L'interligne s'ouvre aussi : un texte
     japonais à 1,55 se lit comme un bloc. */
  :root[lang="ja"]{
    --font-display:'Ufficio Display', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
                   'Yu Gothic Medium', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP',
                   'IPAexGothic', 'IPAGothic', sans-serif;
    --font-body:'Host Grotesk', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN',
                'Yu Gothic Medium', 'Yu Gothic', Meiryo, 'Noto Sans JP', 'Noto Sans CJK JP',
                'IPAexGothic', 'IPAGothic', sans-serif;
  }
  :root[lang="ja"] .sous,
  :root[lang="ja"] .pied,
  :root[lang="ja"] .aide{line-height:1.85;}

  /* LE LOGO PORTE LA PAGE.
     Ailleurs dans l'application, il n'est qu'un repère de navigation : on sait
     où on est, on y est tous les jours, 30 px suffisent. ICI, c'est la seule
     marque de provenance qu'un bibliothécaire étranger reconnaîtra avant
     d'avoir lu une ligne — et il arrive par un lien reçu dans un courriel, sur
     une page qu'il ne reverra pas. Le fichier fait 900 × 273 px : à 80 px de
     haut on reste en deçà de sa définition native, donc net sur tous les
     écrans. La surcharge est LOCALE à cette page : base.css ne bouge pas, et
     les écrans de production gardent leur bandeau discret.

     Les pastilles de langue remontent sur la même ligne. Empilées sous un logo
     de 80 px, elles repoussaient la liste des parties sous la ligne de
     flottaison — or c'est la liste qu'on vient chercher. */
  .masthead{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; flex-wrap:wrap; margin-bottom:20px;
  }
  .masthead .brand-logo-img{height:80px;}
  .masthead .langues{flex:1 1 auto; margin-bottom:0;}

  /* Sept pastilles tiennent sur une ligne à 390 px, mais pas sur un vieil
     iPhone SE à 320. Elles passent à la ligne plutôt que de pousser la page
     en travers. */
  .langues{display:flex; gap:6px; justify-content:flex-end; flex-wrap:wrap; margin-bottom:10px;}
  .langues button{
    border:1px solid var(--border); background:var(--card); color:var(--muted);
    border-radius:999px; padding:3px 12px; font-size:11.5px; font-weight:800;
    cursor:pointer; letter-spacing:.04em; min-height:0;
  }
  .langues button.actif{background:var(--accent); border-color:var(--accent); color:#fff;}

  .bandeau{
    display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
    font-size:12.5px; color:var(--muted); margin-top:10px;
  }
  .etiq{
    display:inline-block; font-size:10.5px; font-weight:800; padding:2px 8px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.04em; white-space:nowrap;
  }
  .etiq.ok{background:var(--ok-tint); color:var(--ok);}
  .etiq.ko{background:var(--ko-tint); color:var(--ko);}
  .etiq.att{background:var(--maybe-tint); color:var(--maybe);}

  .bloc{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px;}
  .bloc + .bloc{margin-top:14px;}
  .bloc h2{
    font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
    font-weight:800; margin:0 0 8px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;
  }
  .bloc h2 .total{margin-left:auto; color:var(--text); font-variant-numeric:tabular-nums; letter-spacing:0;}

  .pupitre{
    margin:14px 0 6px; padding-top:10px; border-top:1px solid var(--border);
  }
  .pupitre:first-of-type{border-top:none; padding-top:0; margin-top:4px;}

  .fic{
    display:flex; gap:10px; align-items:center; text-decoration:none; color:inherit;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .fic:last-child{border-bottom:none;}
  .fic-nom{flex:1; min-width:0; font-weight:700; font-size:13.5px;}
  .fic-det{font-size:12px; color:var(--muted); font-weight:400; display:block; margin-top:1px;}
  /* Le nom de l'instrument dans la langue du lecteur. Il se lit comme un NOM,
     pas comme une métrique : sans ce contraste, « Bratsche » se perdait entre
     le poids et le nombre de pages. */
  .fic-trad{color:var(--text); font-weight:600;}
  .fic-fleche{color:var(--accent); font-weight:800; font-size:16px;}
  .fic.inerte{opacity:.5; pointer-events:none;}

  .rien{font-size:13px; color:var(--muted); padding:10px 0; line-height:1.6;}

  .forme{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:8px 0 4px;}
  .aide{font-size:12px; color:var(--muted); line-height:1.55; margin:4px 0 0;}
  .erreur{font-size:12.5px; color:var(--ko); font-weight:700; line-height:1.55; margin:6px 0 0;}
  .erreur:empty{display:none;}

  .progres{height:6px; background:var(--border); border-radius:999px; overflow:hidden; margin-top:10px;}
  .progres i{display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .2s;}

  .pied{
    margin-top:26px; padding-top:16px; border-top:1px solid var(--border);
    font-size:12px; color:var(--muted); line-height:1.6;
  }
  .pied p{margin:0 0 9px;}
  .pied p:last-child{margin-bottom:0;}
  .pied strong{color:var(--text);}

  @media (max-width:760px){
    .bloc{padding:13px 14px;}
    input, select{font-size:16px !important;}
    /* 56 px sur téléphone : le logo reste deux fois plus grand qu'avant sans
       manger le tiers haut d'un écran de 667 px. */
    .masthead .brand-logo-img{height:56px;}
    .masthead{gap:10px; margin-bottom:16px;}
  }

<script>
/* ============================================================================
   Le matériel confié à un ensemble tiers — la page du destinataire.
   ============================================================================
   Un orchestre étranger reprend le programme et a besoin du matériel pour
   travailler. Ses cinquante musiciens ne sont pas les nôtres : ils n'ont ni
   fiche dans l'annuaire, ni lien personnel, et leur en créer cinquante pour
   une coproduction serait à la fois faux et ingérable. On confie donc le lot à
   la MAISON, représentée par la personne qui en répond — son bibliothécaire,
   son régisseur d'orchestre —, et c'est elle qui distribue en interne, comme
   elle le fait déjà pour son propre matériel.

   CE QUE CETTE PAGE CHANGE, ET CE QU'ELLE NE CHANGE PAS
   ----------------------------------------------------
   Elle ne change RIEN au dispositif : le bucket reste privé, le fichier propre
   ne sort jamais, chaque exemplaire est filigrané à la volée par
   /api/partition et journalisé un par un. Seule la MENTION change — « confié
   à », et le nom d'une maison plutôt que celui d'une personne. C'est le bon
   niveau de responsabilité : un exemplaire qui ressort désigne l'ensemble qui
   l'a reçu, et le contact nommé qui en a signé la réception.

   POURQUOI ELLE EST BILINGUE
   --------------------------
   Parce que le destinataire est, par construction, souvent étranger. Une page
   en français devant un bibliothécaire de Tokyo ou de Leipzig, c'est un appel
   téléphonique à la production et deux jours perdus. La langue se devine du
   navigateur, se change d'un bouton, et se retient.

   L'ARCHIVE EST ASSEMBLÉE ICI, dans ce navigateur (voir assets/zip.js) : les
   parties sont récupérées une par une, filigranées chacune côté serveur, puis
   rangées localement. Aucun plafond de fonction serverless n'est approché, et
   une coupure en cours de route laisse tout le reste téléchargeable à l'unité.
============================================================================ */

const params = new URLSearchParams(location.search);
const JETON = params.get('e') || params.get('envoi') || '';

/* Les langues servies, côte à côte. Pas de fichier de traduction ni de
   mécanique : une quarantaine de chaînes par langue, lues et corrigées d'un
   coup d'œil. Une chaîne manquante retombe sur le français plutôt que
   d'afficher sa clé.

   EN AJOUTER UNE : une entrée dans LANGUES (code, étiquette, nom, locale) et
   un bloc dans TEXTES, recopié sur l'anglais. Rien d'autre — la barre de
   langues, la date, le poids et les pupitres suivent tout seuls. */
const LANGUES = [
  { code: 'fr', etiquette: 'FR', nom: 'Français', locale: 'fr-FR' },
  { code: 'en', etiquette: 'EN', nom: 'English',  locale: 'en-GB' },
  { code: 'de', etiquette: 'DE', nom: 'Deutsch',  locale: 'de-DE' },
  { code: 'es', etiquette: 'ES', nom: 'Español',  locale: 'es-ES' },
  { code: 'it', etiquette: 'IT', nom: 'Italiano', locale: 'it-IT' },
  { code: 'nl', etiquette: 'NL', nom: 'Nederlands', locale: 'nl-NL' },
  { code: 'ja', etiquette: 'JA', nom: '日本語', locale: 'ja-JP' },
];

/* Le poids se lit dans les conventions du lecteur : « 18,4 Mo » devant un
   bibliothécaire de Leipzig se lit comme une coquille — l'unité ET la virgule
   décimale sont françaises. Une seule mécanique, deux réglages. Les seuils
   sont ceux de partitionsPoids : jamais plus de trois chiffres significatifs,
   jamais d'octets bruts au-delà du kilo. */
function poidsFormate(octets, unites, virgule){
  const n = Number(octets) || 0;
  const dec = (x, d)=> x.toFixed(d).replace('.', virgule);
  if(n < 1024) return n + ' ' + unites[0];
  if(n < 1048576) return dec(n / 1024, 0) + ' ' + unites[1];
  const mo = n / 1048576;
  if(mo < 10) return dec(mo, 1) + ' ' + unites[2];
  if(mo < 1024) return dec(mo, 0) + ' ' + unites[2];
  return dec(mo / 1024, 2) + ' ' + unites[3];
}

const CLE_LANGUE = 'curieuxEnvoiLangue';
const CLE_CODE = 'curieuxEnvoiCode:' + JETON;
/* PAS DE CLÉ POUR LE NOM, et c'est délibéré. Le code, lui, se retient
   quatorze jours : il désigne le LOT, il ne change pas d'un exemplaire à
   l'autre. Le nom désigne UNE personne, et un nom retenu d'une session sur
   l'autre est un exemplaire qui repart au nom du précédent — le registre
   désigne alors quelqu'un qui n'a jamais reçu cette partie, ce qui est pire
   que pas de registre du tout. Il vit le temps de la page, et se retape. */

/* La langue du destinataire, dans cet ordre : son choix retenu, le `lang` du
   lien — c'est lui qu'on met dans le courriel d'envoi quand on SAIT à qui on
   écrit —, puis ses préférences de navigateur, dans l'ordre où il les a
   déclarées. L'anglais en dernier recours : devant un lecteur dont on ne sert
   pas la langue, c'est lui qui a le plus de chances d'être lu. */
function langueInitiale(){
  const connue = (v)=> LANGUES.some(l => l.code === String(v || '').slice(0, 2).toLowerCase())
    ? String(v).slice(0, 2).toLowerCase() : '';
  try{
    const retenu = connue(localStorage.getItem(CLE_LANGUE));
    if(retenu) return retenu;
  }catch(e){}
  const demande = connue(params.get('lang'));
  if(demande) return demande;
  const preferees = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || ''];
  for(let i = 0; i < preferees.length; i++){
    const c = connue(preferees[i]);
    if(c) return c;
  }
  return 'en';
}
let LANGUE = langueInitiale();
function T(cle){ return TEXTES[LANGUE][cle] !== undefined ? TEXTES[LANGUE][cle] : TEXTES.fr[cle]; }

/* Le code et le nom sont retenus quatorze jours, comme côté musicien : le
   temps d'une production, pas celui d'une saison. Tout est enveloppé — le
   stockage lève en navigation privée, et une commodité ne doit jamais casser
   la page. */
function lireRetenu(cle){
  try{
    const j = JSON.parse(localStorage.getItem(cle) || 'null');
    if(!j || !j.quand || Date.now() - j.quand > 14 * 86400000) return '';
    return j.valeur || '';
  }catch(e){ return ''; }
}
function ecrireRetenu(cle, valeur){
  try{ localStorage.setItem(cle, JSON.stringify({ quand: Date.now(), valeur })); }catch(e){}
}

function jourLisible(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T12:00:00');
  if(isNaN(d)) return iso;
  const l = LANGUES.find(x => x.code === LANGUE);
  return d.toLocaleDateString(l ? l.locale : 'en-GB',
    { day: 'numeric', month: 'long', year: 'numeric' });
}

let CHARGE = null;
/* L'archive en cours n'est PAS un état du DOM. Basculer la langue ou oublier
   le code reconstruit l'écran pendant la préparation : le nouveau bouton
   naissait actif, un second clic relançait les trente-deux parties, et le
   registre comptait chaque exemplaire deux fois — au nom du même ensemble, ce
   qui est exactement ce qu'un registre de traçabilité ne doit pas faire. */
let ARCHIVE_EN_COURS = false;
/* Un refus survenu avant le chargement doit lui aussi suivre la langue : la
   page bilingue restait en français devant le seul public qui ne la lit pas. */
let REFUS = null;
let CODE = lireRetenu(CLE_CODE);
let NOM = '';

function etat(html){
  document.getElementById('sousTitre').textContent = '';
  document.getElementById('contenu').innerHTML = `<div class="co-card co-pad rien" style="text-align:center">${html}</div>`;
  document.getElementById('pied').innerHTML = '';
}

function rendreLangues(){
  document.getElementById('langues').innerHTML = LANGUES.map(l =>
    `<button type="button" data-langue="${l.code}" lang="${l.code}"
       class="${l.code === LANGUE ? 'actif' : ''}"${l.code === LANGUE ? ' aria-current="true"' : ''}
       title="${escapeAttr(l.nom)}" aria-label="${escapeAttr(l.nom)}">${escapeHtml(l.etiquette)}</button>`).join('');
  document.querySelectorAll('[data-langue]').forEach(b => b.onclick = ()=>{
    LANGUE = b.dataset.langue;
    try{ localStorage.setItem(CLE_LANGUE, LANGUE); }catch(e){}
    document.documentElement.lang = LANGUE;
    rendre();
  });
}

/* L'URL d'un exemplaire. Le code et le nom y passent en clair : c'est une
   requête vers notre propre serveur, en HTTPS, et c'est là que la base les
   vérifie. Un lien recopié sans le code ne donne rien. */
function urlFichier(fichierId){
  let u = `/api/partition?envoi=${encodeURIComponent(JETON)}&fichier=${encodeURIComponent(fichierId)}`;
  if(CODE) u += `&code=${encodeURIComponent(CODE)}`;
  if(NOM) u += `&pour=${encodeURIComponent(NOM)}`;
  return u;
}

/* Le nom d'un fichier dans l'archive. « Violon 1.pdf » et non l'identifiant de
   stockage : c'est ce que le bibliothécaire va voir dans son dossier, puis
   dans son logiciel de pupitre. Le titre du fichier n'est ajouté que s'il
   apporte quelque chose — une partie qui ne porte qu'un fichier nommé comme
   elle donnerait « Violon 1 — Violon 1 ». */
function nomArchive(partie, fichier){
  const titre = (fichier.titre || '').trim();
  const ajout = titre && (partie.fichiers || []).length > 1
    && titre.toLowerCase() !== (partie.nom || '').trim().toLowerCase()
    ? ' - ' + titre : '';
  return `${partie.nom || 'Partie'}${ajout}.pdf`;
}

function rendre(){
  rendreLangues();
  /* L'onglet aussi : un bibliothécaire garde la page ouverte pendant qu'il
     range les parties, et « Matériel confié » dans une barre d'onglets est le
     seul endroit où la page reste en français. */
  document.title = 'Curieux orchestre — ' + T('titre');
  if(REFUS){ document.getElementById('titre').textContent = T('titre'); etat(escapeHtml(T(REFUS))); return; }
  const c = CHARGE;
  document.getElementById('titre').textContent = c && c.destinataire
    ? T('pourEnsemble')(c.destinataire) : T('titre');
  // Le bouton de langue appelle rendre() : il peut être cliqué avant que le
  // lot soit revenu de la base. Sans ce garde-fou, la page se vide.
  if(!c) return;

  // Un lien de chœur ouvert ici : on l'emmène à sa page plutôt que de lui
  // faire lire « lien invalide » alors qu'il a le bon lien.
  if(c.type === 'choeur'){
    etat(escapeHtml(T('mauvaisePage'))
      + `<br><br><a class="co-btn sm primary" href="partition-choeur.html?c=${escapeAttr(encodeURIComponent(JETON))}">${escapeHtml(T('mauvaisePageLien'))}</a>`);
    return;
  }

  /* Les trois refus, dits en toutes lettres. « Lien invalide » devant
     quelqu'un qui a le bon lien mais un lot expiré la veille, c'est un appel
     téléphonique et une matinée perdue des deux côtés.

     LE MOTIF VIENT DE LA BASE, jamais d'un calcul refait ici. La page compare
     avec l'horloge du navigateur ; la base avec la sienne. Un bibliothécaire à
     New York le 1er décembre au soir est déjà le 2 pour nous : les deux juges
     se contredisaient, et l'écran affichait « disponible à partir du . » — une
     phrase sans date. `etat` n'existe pas sur une base dont la migration est
     plus ancienne : on retombe alors sur ce qu'on sait. */
  const etatLot = c.etat || (!c.actif ? 'revoque' : c.ouvert ? 'ouvert' : c.ouvertLe ? 'attente' : 'expire');
  if(etatLot === 'revoque'){ etat(escapeHtml(T('revoque'))); return; }
  if(etatLot === 'expire'){
    etat(escapeHtml(c.expireLe ? T('expire')(jourLisible(c.expireLe)) : T('revoque'))); return;
  }
  /* La base peut fermer un lot pour une raison que la page n'a pas vue : elle
     compare à SA date du jour, la page à celle du navigateur, et un
     bibliothécaire à New York ouvre son lien le 1er décembre au soir quand il
     est déjà le 2 à Paris. Sans ce repli, la page annonçait « disponible à
     partir du . » — une phrase sans date, qui ne veut rien dire. */
  if(etatLot !== 'ouvert'){
    etat(escapeHtml(c.ouvertLe ? T('pasOuvert')(jourLisible(c.ouvertLe)) : T('revoque')));
    return;
  }

  const parties = c.parties || [];
  const fichiers = parties.reduce((s, p)=> s + (p.fichiers || []).length, 0);
  const poids = parties.reduce((s, p)=> s + (p.fichiers || []).reduce((t, f)=> t + (f.octets || 0), 0), 0);

  const contexte = [c.spectacle, c.compositeur, c.operation].filter(Boolean).join(' · ');
  document.getElementById('sousTitre').innerHTML =
    escapeHtml(T('sousTitre'))
    + (contexte ? `<br><strong style="color:var(--text)">${escapeHtml(contexte)}</strong>` : '')
    + `<span class="bandeau">
        <span class="etiq ok">${escapeHtml(T('partiesN')(parties.length))}</span>
        <span>${escapeHtml(T('fichiersN')(fichiers))} · ${escapeHtml(T('poids')(poids))}</span>
        ${c.expireLe ? `<span class="etiq att">${escapeHtml(T('expireLe')(jourLisible(c.expireLe)))}</span>` : ''}
      </span>`;

  let html = '';

  // Le code d'abord : sans lui, la liste s'affiche mais rien ne se télécharge.
  // On le demande APRÈS avoir dit ce que contient le lot — un champ nu, sans
  // savoir ce qu'il ouvre, ne se remplit pas.
  if(c.codeRequis && !CODE){
    html += `<section class="bloc">
      <h2>${escapeHtml(T('codeTitre'))}</h2>
      <form class="forme" id="formCode">
        <input class="co-input" id="inpCode" style="width:150px;font-weight:800;letter-spacing:.08em;text-transform:uppercase"
               maxlength="32" inputmode="latin" autocapitalize="characters"
               placeholder="${escapeAttr(T('codeChamp'))}" aria-label="${escapeAttr(T('codeTitre'))}">
        <button type="submit" class="co-btn primary sm">${escapeHtml(T('ouvrir'))}</button>
      </form>
      <p class="erreur" id="errCode"></p>
      <p class="aide">${escapeHtml(T('codeAide'))}</p>
    </section>`;
  }

  // Le nom par exemplaire, quand le lot est distribué nominativement. La base
  // refuse le téléchargement s'il manque : le champ n'est pas une politesse.
  if(c.nominatif){
    html += `<section class="bloc">
      <h2>${escapeHtml(T('nomTitre'))}</h2>
      <form class="forme" id="formNom">
        <input class="co-input" id="inpNom" style="width:min(300px,100%)" maxlength="60"
               placeholder="${escapeAttr(T('nomChamp'))}" aria-label="${escapeAttr(T('nomTitre'))}"
               value="${escapeAttr(NOM)}">
        <button type="submit" class="co-btn sm">${escapeHtml(T('valider'))}</button>
      </form>
      <p class="erreur" id="errNom"></p>
      <p class="aide">${escapeHtml(T('nomAide'))}</p>
    </section>`;
  }

  const pret = (!c.codeRequis || CODE) && (!c.nominatif || NOM);

  html += `<section class="bloc">
    <h2>${escapeHtml(T('lot'))}
      <span class="total">
        ${fichiers && pret && !c.nominatif ? `<button type="button" class="co-btn sm primary" id="btnTout"${ARCHIVE_EN_COURS ? ' disabled' : ''}>${escapeHtml(ARCHIVE_EN_COURS ? T('enCours')('…', fichiers) : T('toutPrendre'))}</button>` : ''}
        ${c.codeRequis && CODE ? `<button type="button" class="co-btn ghost sm" id="btnOublier" style="margin-left:8px">${escapeHtml(T('oublier'))}</button>` : ''}
      </span>
    </h2>
    <div id="progres"></div>
    ${c.nominatif && fichiers ? `<p class="aide">${escapeHtml(T('pasDArchive'))}</p>` : ''}`;

  if(!fichiers){
    html += `<p class="rien">${escapeHtml(T('rien'))}</p>`;
  } else {
    /* Le groupement par pupitre est celui de partitions-commun.js, donc le
       même que dans l'espace des musiciens, teintes comprises. Regrouper
       vraiment — au lieu de poser un titre chaque fois que la valeur change —
       évite aussi le « Cordes » affiché deux fois quand une partie revient
       plus bas dans l'ordre du conducteur. */
    partitionsGrouperParPupitre(parties).forEach(groupe => {
      html += `<div class="pupitre">${partitionsPupitreHtml(groupe.pupitre, { langue: LANGUE })}</div>`;
      groupe.parties.forEach(p => {
      (p.fichiers || []).forEach(f => {
        const nom = nomArchive(p, f).replace(/\.pdf$/, '');
        /* LE NOM AFFICHÉ RESTE CELUI DU FICHIER. C'est lui que le
           bibliothécaire retrouvera dans son dossier puis dans son logiciel de
           pupitre : une page qui annoncerait « Horn 1-2 » pour un fichier
           « Cor 1-2.pdf » ferait chercher une partie qui ne manque pas.
           La traduction vient donc À CÔTÉ, et seulement quand elle apprend
           quelque chose — « Piano » traduit par « Piano » est du bruit. */
        const glose = partitionsNomTraduit(nom, LANGUE);
        const utile = partitionsNormaliser(glose) !== partitionsNormaliser(nom);
        const detail = [T('poids')(f.octets), f.pages ? T('pages')(f.pages) : ''].filter(Boolean).join(' · ');
        const traduit = utile ? `<span class="fic-trad" lang="${LANGUE}">${escapeHtml(glose)}</span> · ` : '';
        html += `<a class="fic${pret ? '' : ' inerte'}" ${pret ? `href="${escapeAttr(urlFichier(f.id))}" download` : 'href="#" aria-disabled="true"'}>
          <span class="fic-nom">${escapeHtml(nom)}<span class="fic-det">${traduit}${escapeHtml(detail)}</span></span>
          <span class="fic-fleche">↓</span>
        </a>`;
      });
      });
    });
  }
  html += '</section>';

  document.getElementById('contenu').innerHTML = html;
  document.getElementById('pied').innerHTML = `<div class="pied">
    <p>${escapeHtml(T('piedFiligrane'))}</p>
    <p><strong>${escapeHtml(T('piedUsage')(!!c.expireLe))}</strong></p>
    ${c.note ? `<p>${escapeHtml(c.note)}</p>` : ''}
    <p>${escapeHtml(T('piedContact'))}</p>
  </div>`;

  cabler();
}

function cabler(){
  /* Un formulaire qui ne fait RIEN quand on valide se lit comme une panne.
     C'était le cas des deux : saisie refusée, champ repris, aucun mot. Un
     bibliothécaire à l'étranger, devant un écran qui ne réagit pas, appelle
     la production — ou renonce. */
  const dire = (id, message)=>{
    const zone = document.getElementById(id);
    if(zone) zone.textContent = message;
  };

  const formCode = document.getElementById('formCode');
  if(formCode) formCode.onsubmit = (e)=>{
    e.preventDefault();
    const champ = document.getElementById('inpCode');
    const v = (champ.value || '').trim().toUpperCase();
    if(!/^[A-Za-z0-9-]{1,32}$/.test(v)){
      dire('errCode', T('codeInvalide'));
      champ.focus();
      return;
    }
    CODE = v; ecrireRetenu(CLE_CODE, v); rendre();
  };

  const formNom = document.getElementById('formNom');
  if(formNom) formNom.onsubmit = (e)=>{
    e.preventDefault();
    const champ = document.getElementById('inpNom');
    const v = (champ.value || '').trim().replace(/\s+/g, ' ');
    /* Le même jeu de caractères que celui qu'accepte /api/partition : refuser
       ici évite un 400 incompréhensible après trente secondes d'attente. La
       VIRGULE en fait partie — « Müller, Anna » est la forme courante des
       bibliothèques d'orchestre allemandes, et la refuser sans un mot était le
       plus sûr moyen de bloquer quelqu'un. */
    if(!/^[\p{L}\p{M}\s'’.·,-]{2,60}$/u.test(v)){
      dire('errNom', T('nomInvalide'));
      champ.focus();
      return;
    }
    NOM = v; rendre();
  };

  const btnOublier = document.getElementById('btnOublier');
  if(btnOublier) btnOublier.onclick = ()=>{
    try{ localStorage.removeItem(CLE_CODE); }catch(e){}
    CODE = ''; rendre();
  };

  const btnTout = document.getElementById('btnTout');
  if(btnTout) btnTout.onclick = toutTelecharger;
}

/* Tout prendre d'un coup. Chaque partie est récupérée séparément — donc
   filigranée et journalisée séparément, comme si le bibliothécaire les avait
   prises une par une — puis rangée dans une archive assemblée ici. On ne
   parallélise PAS : /api/partition pose un filigrane par appel, et trente
   appels simultanés feraient tomber la fonction plutôt que d'aller plus vite. */
async function toutTelecharger(){
  const c = CHARGE;
  if(ARCHIVE_EN_COURS) return;
  if(c.nominatif && !NOM){ alert(T('nomManque')); return; }
  const btn = document.getElementById('btnTout');
  const progres = document.getElementById('progres');
  const aPrendre = [];
  (c.parties || []).forEach(p => (p.fichiers || []).forEach(f => aPrendre.push({ partie: p, fichier: f })));
  if(!aPrendre.length) return;

  ARCHIVE_EN_COURS = true;
  btn.disabled = true;
  const entrees = [];
  const echecs = [];
  for(let i = 0; i < aPrendre.length; i++){
    const { partie, fichier } = aPrendre[i];
    btn.textContent = T('enCours')(i + 1, aPrendre.length);
    progres.innerHTML = `<div class="progres"><i style="width:${Math.round(i / aPrendre.length * 100)}%"></i></div>`;
    try{
      const rep = await fetch(urlFichier(fichier.id), { credentials: 'omit' });
      if(!rep.ok) throw new Error('HTTP ' + rep.status);
      entrees.push({ nom: nomArchive(partie, fichier), octets: await rep.arrayBuffer() });
    }catch(e){
      console.warn('[envoi] ', fichier.id, e && e.message);
      echecs.push(fichier.id);
    }
  }

  ARCHIVE_EN_COURS = false;
  progres.innerHTML = '';
  btn.disabled = false;
  btn.textContent = T('toutPrendre');

  if(!entrees.length){ alert(T('echecTotal')); return; }
  /* L'assemblage peut échouer là où rien d'autre n'échoue : un matériel
     d'opéra dépasse ce qu'un navigateur accepte d'allouer d'un bloc. Sans ce
     filet, toutes les parties avaient été filigranées ET inscrites au
     registre, et l'écran revenait au repos sans un mot — le bibliothécaire
     croit avoir téléchargé, nous croyons qu'il l'a fait. */
  try {
    const nomLot = [c.spectacle || 'Partitions', c.destinataire].filter(Boolean).join(' - ') + '.zip';
    CurieuxZip.enregistrer(CurieuxZip.creer(entrees), nomLot);
  } catch(e) {
    console.error('[envoi] archive', e && e.message);
    alert(T('archiveImpossible'));
    return;
  }
  if(echecs.length) alert(T('echecPartiel')(echecs.length));
}

async function init(){
  document.documentElement.lang = LANGUE;
  rendreLangues();
  const refuser = (cle)=>{ REFUS = cle; etat(escapeHtml(T(cle))); };
  if(!window.supabase || !JETON){ refuser('lienInvalide'); return; }

  const charge = await CurieuxDB.envoiPartitions(JETON);
  if(charge && charge.migrationAbsente){ refuser('pasActive'); return; }
  if(!charge){ refuser('lienInvalide'); return; }

  CHARGE = charge;
  rendre();
}

init();
applyBrandLogo();
setInterval(applyAutoTheme, 5 * 60 * 1000);
</script>
