<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Tes disponibilités</title>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/db.js"></script>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<!-- Page volontairement PUBLIQUE : pas de hideCurieuxPageUntilAuth()/requireAdminAuth()
     ici, contrairement à toutes les autres pages — ce lien est envoyé à des titulaires qui n'ont
     pas de compte admin de l'app interne. L'identification se fait par le token imprévisible
     dans l'URL, pas par un compte. -->
<script>try{ injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); injectBugReportWidget(); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  body{
    margin:0; font-family:'Host Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding:20px 14px 80px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .brand-logo-img{height:30px; width:auto; display:block; margin:0 0 22px;}

  .state-box{padding:22px 20px; text-align:center; color:var(--muted); font-size:14px;}

  .identity-banner{
    background:var(--champagne); border-radius:var(--radius); padding:18px 20px; margin-bottom:18px;
    font-size:15px; line-height:1.45;
  }
  .identity-banner strong{color:var(--accent-dark);}
  .identity-meta{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:10px;}
  .identity-meta-item{font-size:12.5px; color:var(--muted); font-weight:600; display:flex; align-items:center; gap:5px;}
  .identity-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
  .identity-action{
    flex:1 1 220px; display:flex; align-items:center; gap:11px; text-decoration:none; color:var(--text);
    background:var(--card); border:1px solid var(--old-champagne); border-radius:var(--radius); padding:11px 14px;
    transition:border-color .15s, transform .1s, box-shadow .15s;
  }
  .identity-action:hover{border-color:var(--accent); transform:translateY(-1px); box-shadow:0 4px 10px rgba(20,15,10,.06);}
  button.identity-action{font-family:inherit; font-size:inherit; cursor:pointer; text-align:left; width:100%;}
  .identity-action-icon{flex-shrink:0; color:var(--accent-dark); display:flex;}
  .identity-action-title{display:block; font-size:13.5px; font-weight:800; color:var(--accent-dark);}
  .identity-action-sub{display:block; font-size:11.5px; color:var(--muted); margin-top:1px;}

  .contact-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px;}
  .contact-card-label{font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:8px;}
  .contact-card-row{display:flex; gap:8px; flex-wrap:wrap;}
  .contact-input{
    flex:1; min-width:150px; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-size:13.5px;
    background:var(--bg); color:var(--text); font-family:inherit;
  }
  .contact-input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .intro-text{font-size:12.5px; color:var(--muted); line-height:1.55; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; margin-bottom:22px;}
  .intro-text p{margin:0 0 8px;}
  .intro-text p:last-child{margin-bottom:0;}

  .month-header{
    font-size:13.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--accent-dark);
    margin:26px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .month-header::before{content:''; width:5px; height:14px; border-radius:3px; background:var(--accent); display:inline-block;}

  .bloc-banner{
    font-size:11.5px; color:var(--accent-dark); background:var(--accent-tint); border-radius:8px;
    padding:7px 12px; margin-bottom:8px; display:flex; align-items:center; gap:6px;
  }
  .travel-note{
    font-size:11.5px; color:var(--muted); text-align:center; padding:6px 0; font-style:italic;
  }

  .date-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:10px;
  }
  .date-card-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .date-label{font-weight:800; font-size:14.5px;}
  .date-place{color:var(--muted); font-size:12.5px;}
  .isolated-tag{
    font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    padding:2px 7px; border-radius:999px; background:var(--border); color:var(--muted); margin-left:8px; vertical-align:middle;
  }

  .state-toggle{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-bottom:8px;}
  .state-btn{
    padding:9px 4px; border-radius:8px; border:1px solid var(--border); background:var(--bg);
    color:var(--muted); font-size:12px; font-weight:700; cursor:pointer; font-family:inherit;
    transition:background .15s, color .15s, border-color .15s;
  }
  .state-btn.active.dispo{background:var(--ok); border-color:var(--ok); color:#fff;}
  .state-btn.active.indispo{background:var(--ko); border-color:var(--ko); color:#fff;}
  .state-btn.active.incertain{background:var(--maybe); border-color:var(--maybe); color:#fff;}

  /* ==========================================================================
     Dates déjà affectées.

     Se déclarer indisponible sur une date dont l'équipe est bouclée ne se
     règle pas par un bouton : cela demande un coup de fil, parce qu'il faut
     trouver quelqu'un d'autre. La date porte donc une étiquette, le bouton
     « Indisponible » est barré, et un clic dessus ouvre de quoi joindre la
     production tout de suite. La base refuse la bascule de son côté (voir
     update_own_disponibilites_by_token dans migrations.sql) : l'interface
     explique, elle ne garde pas seule la porte.
     ========================================================================== */
  .date-card.affectee{border-color:var(--accent); background:var(--champagne);}
  .affecte-tag{
    display:inline-block; margin-left:8px; font-size:9.5px; font-weight:800;
    text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:999px;
    background:var(--accent-solid); color:#FCF2F0; vertical-align:middle;
  }
  .state-btn.verrouille{
    opacity:.45; cursor:not-allowed; text-decoration:line-through;
  }
  .state-btn.verrouille:hover{background:var(--bg);}
  .alerte-affecte{
    margin:8px 0 0; padding:11px 13px; border-radius:10px;
    background:var(--card); border:1px solid var(--accent);
    font-size:12.5px; line-height:1.5;
  }
  .alerte-affecte strong{color:var(--accent);}
  .alerte-affecte .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:9px;}
  .alerte-affecte a{
    display:inline-block; padding:7px 13px; border-radius:8px; font-size:12px; font-weight:800;
    background:var(--accent-solid); color:#FCF2F0; text-decoration:none;
  }
  .alerte-affecte a.secondaire{background:var(--bg); color:var(--accent); border:1px solid var(--border);}

  .date-comment{
    width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:12.5px;
    background:var(--bg); color:var(--text); font-family:inherit;
  }
  .date-comment:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .save-bar{
    position:fixed; bottom:0; left:0; right:0; z-index:20; display:none;
    background:var(--card); border-top:1px solid var(--border);
    box-shadow:0 -8px 24px rgba(0,0,0,.1);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .save-bar.visible{display:block;}
  .save-bar-inner{
    max-width:640px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .save-status{font-size:12px; color:var(--muted); line-height:1.3;}
  .save-status.dirty{color:var(--maybe); font-weight:700;}
  .save-status.saved{color:var(--ok); font-weight:700;}
  .save-btn{
    flex-shrink:0; padding:11px 20px; border-radius:9px; border:none; background:var(--accent-solid); color:#fff;
    font-size:13.5px; font-weight:800; cursor:pointer; font-family:inherit; transition:background .15s, opacity .15s;
  }
  .save-btn:disabled{opacity:.45; cursor:default;}
  .save-btn:not(:disabled):hover{background:var(--accent-dark);}
  

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,15,10,.5);
    align-items:flex-start; justify-content:center; padding:20px; z-index:50; overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--card); border-radius:14px; padding:24px; max-width:480px; width:100%;
    margin-top:20px; box-shadow:0 20px 60px rgba(0,0,0,.25);
  }
  .modal h2{font-size:17px; margin:0 0 4px;}
  .modal-sub{color:var(--muted); font-size:12.5px; margin:0 0 16px;}
  .modal .field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
  .modal .field-row{display:flex; gap:12px; flex-wrap:wrap;}
  .modal .field-row .field{flex:1 1 160px;}
  .modal label{font-size:12px; color:var(--muted); font-weight:600;}
  .modal input[type=text], .modal input[type=date], .modal select, .modal textarea{
    padding:9px 11px; border:1px solid var(--border); border-radius:6px; font-size:14px;
    width:100%; background:var(--bg); color:var(--text); font-family:inherit;
  }
  .modal textarea{min-height:56px; resize:vertical;}
  .modal input:focus, .modal textarea:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .modal-save-hint{font-size:11.5px; color:var(--muted); margin-top:4px;}
  .modal-save-hint.ok{color:var(--ok);}
  .modal-actions{display:flex; align-items:center; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .modal-actions button{font-family:inherit; cursor:pointer;}
  .modal-actions .btn-done{background:var(--accent-solid); color:#fff; border:none; border-radius:9px; padding:10px 18px; font-size:13.5px; font-weight:800;}
  .modal-actions .btn-done:hover{background:var(--accent-dark);}
  .modal-full-link{display:block; margin-top:14px; font-size:12px; color:var(--accent-dark); text-align:center;}

  /* Titres de section au gabarit de la maquette : capitales tracées, couleur
     d'accent, filet tonique — le même repère sur tous les écrans. */
  h2, h2.section-title{
    font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
    color:var(--accent); display:flex; align-items:center; gap:8px;
  }
  h2::before, h2.section-title::before{
    content:''; width:5px; height:15px; border-radius:3px; background:var(--tonic); flex-shrink:0;
  }
  /* Les titres de fenêtre modale gardent leur rendu : ce ne sont pas des
     titres de section. */
  .modal h2, .modal h2::before, .modal-card h2, .modal-card h2::before{
    all:revert;
  }
  .modal h2, .modal-card h2{font-size:17px; font-weight:800; color:var(--text); text-transform:none; letter-spacing:0;}

</style>
</head>
<body>
<div class="wrap">
  <img class="brand-logo-img" alt="Curieux orchestre">
  <div id="content"><div class="co-card co-pad state-box">Chargement…</div></div>
</div>
<div class="save-bar" id="saveBar">
  <div class="save-bar-inner">
    <span class="save-status saved" id="saveStatus">Tes réponses sont à jour.</span>
    <button type="button" class="save-btn" id="saveBtn" disabled>Valider mes réponses</button>
  </div>
</div>

<div class="modal-overlay" id="infosModalOverlay">
  <div class="modal">
    <h2><svg width="18" height="18" viewBox="0 0 24 24" style="vertical-align:-3px; margin-right:5px;"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11" fill="none" stroke="currentColor" stroke-width="1.6"></path><circle cx="12" cy="15.5" r="1.3" fill="currentColor"></circle></svg>Avant de commencer</h2>
    <p class="modal-sub">On a besoin de ces infos pour ta fiche musicien·ne/technicien·ne.</p>
    <div class="field-row">
      <div class="field"><label for="m_telephone">Téléphone</label><input type="text" id="m_telephone" inputmode="tel" autocomplete="tel"></div>
      <div class="field"><label for="m_email">Email</label><input type="text" id="m_email" inputmode="email" autocomplete="email"></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="m_dateNaissance">Date de naissance</label><input type="date" id="m_dateNaissance" autocomplete="bday"></div>
      <div class="field"><label for="m_lieuNaissance">Ville de naissance</label><input type="text" id="m_lieuNaissance" autocomplete="address-level2"></div>
      <div class="field"><label for="m_nationalite">Nationalité</label><input type="text" id="m_nationalite" autocomplete="country-name"></div>
    </div>
    <div class="field-row">
      <div class="field">
        <label for="m_genre">Genre</label>
        <select id="m_genre">
          <option value="">Non renseigné</option>
          <option value="femme">Femme</option>
          <option value="homme">Homme</option>
          <option value="non-binaire">Non-binaire</option>
          <option value="autre">Autre</option>
          <option value="npr">Préfère ne pas préciser</option>
        </select>
      </div>
      <div class="field" id="m_genreDetailField" style="display:none;">
        <label for="m_genreDetail">Préciser</label>
        <input type="text" id="m_genreDetail">
      </div>
    </div>
    <div class="field">
      <label for="m_adresse">Adresse postale</label>
      <textarea id="m_adresse"></textarea>
    </div>
    <div class="modal-save-hint" id="modalSaveHint"></div>
    <div class="modal-actions" style="justify-content:flex-end;">
      <button type="button" class="btn-done" id="infosModalDone">Valider</button>
    </div>
    <a class="modal-full-link" id="modalFullLink" href="#">Voir aussi mes infos complètes (RIB, n° sécu, statut intermittent...) →</a>
  </div>
</div>

<script>
const MONTHS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function fmtMonthYear(iso){
  const [y,m] = iso.split('-');
  return `${MONTHS_FR[parseInt(m,10)-1]} ${y}`;
}
function fmtDateFRLong(iso){
  const [y,m,d] = iso.split('-');
  return `${parseInt(d,10)} ${MONTHS_FR[parseInt(m,10)-1]}`;
}
function fmtDateFRShort(iso){
  const [y,m,d] = iso.split('-');
  const short = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
  return `${parseInt(d,10)} ${short[parseInt(m,10)-1]}`;
}
let state = { demande:null, token:null, tournee:null, person:null, personType:null, info:null };

// Minimum requis pour une fiche exploitable (même liste que mes-infos.html) —
// tant qu'il en manque, la modale "Avant de commencer" s'affiche à l'ouverture
// du lien personnel. Le reste (RIB, n° sécu, statut intermittent...) se
// complète plus tard sur mes-infos.html, pas bloquant ici.
const REQUIRED_FIELDS = [
  { key:'telephone', label:'Téléphone', source:'person' },
  { key:'email', label:'Email', source:'person' },
  { key:'genre', label:'Genre', source:'info' },
  { key:'dateNaissance', label:'Date de naissance', source:'info' },
  { key:'lieuNaissance', label:'Ville de naissance', source:'info' },
  { key:'nationalite', label:'Nationalité', source:'info' },
  { key:'adresse', label:'Adresse postale', source:'info' },
];
function computeMissingRequired(){
  return REQUIRED_FIELDS.filter(f=> !((f.source === 'person' ? state.person[f.key] : state.info[f.key]) || '').toString().trim());
}

function showState(html){
  document.getElementById('content').innerHTML = `<div class="co-card co-pad state-box">${html}</div>`;
}

async function init(){
  if(!window.supabase){ showState("La librairie n'a pas pu être chargée. Réessaie dans un instant."); return; }
  const token = new URLSearchParams(location.search).get('token');
  if(!token){ showState("Lien invalide — il manque le jeton d'accès."); return; }

  const { data: demandeRows } = await supabaseClient.rpc('get_dispo_demande_by_token', { p_token: token });
  const demande = (demandeRows || [])[0];
  if(!demande){ showState("Ce lien n'est plus valide. Contacte la production pour en obtenir un nouveau."); return; }

  // Le répertoire n'est plus lisible par la clé anonyme (voir C1 dans
  // migrations.sql) : on passe par les fonctions à jeton, qui ne rendent que
  // la fiche de la personne du lien et la tournée concernée.
  const [tournee, person] = await Promise.all([
    CurieuxDB.getTourneeByToken(token, demande.tournee_id),
    CurieuxDB.getOwnPersonByToken(token, demande.person_type, demande.person_id)
  ]);
  if(!tournee || !person){ showState("Cette tournée ou cette fiche n'existe plus."); return; }
  const tourneeRes = { data: tournee }, personRes = { data: person };

  state.demande = demande;
  state.token = token;
  state.tournee = tourneeRes.data;
  state.personType = demande.person_type;
  state.person = personRes.data;
  if(!state.person.disponibilites) state.person.disponibilites = {};
  if(!state.person.disponibilites_commentaires) state.person.disponibilites_commentaires = {};
  state.info = (await CurieuxDB.getInfosSocialesByToken(token)) || { extra: {} };
  // Qui prévenir si l'on ne peut plus tenir une date déjà affectée.
  contactProduction = await CurieuxDB.getContactProduction();
  // Cachet individualisé éventuel — jamais lu depuis la tournée elle-même (qui ne
  // contient que le cachet standard, public), seulement via ce token, qui ne peut
  // renvoyer que LE montant de cette personne (voir migrations.sql).
  state.cachetOverride = await CurieuxDB.getCachetOverrideByToken(token);

  render();
  maybeShowInfosModal();
}

function maybeShowInfosModal(){
  const missing = computeMissingRequired();
  if(missing.length === 0) return;
  document.getElementById('modalFullLink').href = 'mes-infos.html?token=' + encodeURIComponent(state.token);
  document.getElementById('m_telephone').value = state.person.telephone || '';
  document.getElementById('m_email').value = state.person.email || '';
  document.getElementById('m_genre').value = state.info.genre || '';
  document.getElementById('m_genreDetail').value = state.info.genreDetail || '';
  document.getElementById('m_genreDetailField').style.display = state.info.genre === 'autre' ? '' : 'none';
  document.getElementById('m_dateNaissance').value = state.info.dateNaissance || '';
  document.getElementById('m_lieuNaissance').value = state.info.lieuNaissance || '';
  document.getElementById('m_nationalite').value = state.info.nationalite || '';
  document.getElementById('m_adresse').value = state.info.adresse || '';
  document.getElementById('infosModalOverlay').classList.add('open');
}

// Comme pour les dispo (bouton "Valider mes réponses") : rien n'est enregistré
// tant que la personne n'a pas cliqué "C'est fait" — pas de sauvegarde
// automatique au fil de la frappe dans la modale.
document.getElementById('m_telephone').addEventListener('input', e=>{ state.person.telephone = e.target.value; });
document.getElementById('m_email').addEventListener('input', e=>{ state.person.email = e.target.value; });
document.getElementById('m_genre').addEventListener('change', e=>{
  state.info.genre = e.target.value;
  document.getElementById('m_genreDetailField').style.display = e.target.value === 'autre' ? '' : 'none';
});
document.getElementById('m_genreDetail').addEventListener('input', e=>{ state.info.genreDetail = e.target.value; });
document.getElementById('m_dateNaissance').addEventListener('input', e=>{ state.info.dateNaissance = e.target.value; });
document.getElementById('m_lieuNaissance').addEventListener('input', e=>{ state.info.lieuNaissance = e.target.value; });
document.getElementById('m_nationalite').addEventListener('input', e=>{ state.info.nationalite = e.target.value; });
document.getElementById('m_adresse').addEventListener('input', e=>{ state.info.adresse = e.target.value; });

function closeInfosModal(){
  document.getElementById('infosModalOverlay').classList.remove('open');
}
// Pas de bouton "Plus tard" : la fiche est requise dès la première visite,
// la modale ne se ferme qu'une fois tous les champs obligatoires remplis.
document.getElementById('infosModalDone').addEventListener('click', async ()=>{
  const btn = document.getElementById('infosModalDone');
  const hint = document.getElementById('modalSaveHint');
  const missing = computeMissingRequired();
  if(missing.length){
    hint.textContent = `Il manque encore : ${missing.map(f=>f.label).join(', ')}`;
    hint.classList.remove('ok');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  const [personRes, infoRes] = await Promise.all([
    CurieuxDB.updateOwnContactByToken(state.token, state.person.telephone || '', state.person.email || ''),
    CurieuxDB.upsertInfosSocialesByToken(state.token, state.info)
  ]);
  btn.disabled = false;
  btn.textContent = 'Valider';
  if(personRes.error || infoRes.error){
    hint.textContent = "Erreur d'enregistrement — réessaie.";
    hint.classList.remove('ok');
    return;
  }
  hint.textContent = '';
  closeInfosModal();
  render(); // reflète le téléphone/email saisis dans la modale sur la fiche contact ci-dessous
});

// ============================================================================
// Dates déjà affectées
//
// La tournée rendue par le jeton porte ses affectations (musiciensAssignes /
// techniciensAssignes) : la page en dispose donc, elle ne les regardait
// simplement pas. Une personne pouvait ainsi se retirer d'une date dont
// l'équipe était bouclée, et la production ne l'apprenait qu'en relisant la
// grille par hasard.
// ============================================================================
function estAffecteSur(d){
  const champ = state.personType === 'musicien' ? 'musiciensAssignes' : 'techniciensAssignes';
  return (d[champ] || []).includes(state.demande.person_id);
}

// Le référent de production, réglé dans le tableau de bord admin. Vaut des
// champs vides tant que personne ne l'a renseigné : l'alerte s'affiche alors
// sans bouton d'appel plutôt que d'ouvrir un numéro vide.
let contactProduction = { nom:'', telephone:'' };

function numeroWhatsapp(tel){
  let chiffres = (tel || '').replace(/[^\d+]/g, '');
  if(chiffres.startsWith('+')) chiffres = chiffres.slice(1);
  else if(chiffres.startsWith('0') && chiffres.length === 10) chiffres = '33' + chiffres.slice(1);
  return chiffres;
}

function ouvrirAlerteAffecte(dateIso){
  const boite = document.querySelector(`[data-alerte="${CSS.escape(dateIso)}"]`);
  if(!boite) return;
  const bouton = document.querySelector(`.state-btn[data-verrouille][data-date="${CSS.escape(dateIso)}"]`);
  if(boite.style.display === 'block'){
    boite.style.display = 'none';
    if(bouton) bouton.setAttribute('aria-expanded', 'false');
    return;
  }

  const jour = fmtDateFRLong(dateIso);
  const message = [
    `Bonjour,`,
    ``,
    `Je suis affecté·e sur la date du ${jour} (${state.tournee.nom || 'tournée'}) et je ne vais finalement pas pouvoir en être.`,
    `Je préviens au plus vite pour que vous puissiez vous organiser.`,
    ``,
    `${fullName(state.person)}`,
  ].join('\n');

  const numero = numeroWhatsapp(contactProduction.telephone);
  const qui = contactProduction.nom || 'la production';
  boite.innerHTML = `
    <strong>Tu es déjà retenu·e sur cette date.</strong>
    L'équipe est constituée autour de toi : te déclarer indisponible ici ne
    préviendrait personne, et il faut te trouver un·e remplaçant·e. Dis-le
    directement à ${escapeHtml(qui)}, c'est réglé en deux minutes.
    <div class="actions">
      ${numero ? `<a href="https://wa.me/${encodeURIComponent(numero)}?text=${encodeURIComponent(message)}" target="_blank" rel="noopener">Prévenir sur WhatsApp</a>` : ''}
      ${contactProduction.telephone ? `<a class="secondaire" href="tel:${escapeAttr(contactProduction.telephone.replace(/\s/g, ''))}">Appeler ${escapeHtml(contactProduction.telephone)}</a>` : ''}
      ${!numero && !contactProduction.telephone ? `<span style="color:var(--muted);">Aucun numéro de production enregistré — écris à la personne qui t'a envoyé ce lien.</span>` : ''}
    </div>
  `;
  boite.style.display = 'block';
  if(bouton) bouton.setAttribute('aria-expanded', 'true');
}

function render(){
  // Le bloc (linkedToNext) se calcule sur TOUTES les dates triées, annulées incluses —
  // exactement comme dans tournees.html. Filtrer les annulées AVANT de calculer le bloc
  // décale artificiellement les liaisons linkedToNext et peut rattacher une date isolée
  // au bloc précédent une fois l'écart comblé par le filtre. On filtre donc seulement
  // à l'affichage, jamais avant computeBlocMap.
  const allDates = (state.tournee.dates || [])
    .filter(d=> d.date)
    .slice().sort((a,b)=> a.date.localeCompare(b.date));
  const restrictedIds = state.demande.dates && state.demande.dates.length > 0 ? new Set(state.demande.dates) : null;
  const dates = allDates.filter(d=> d.statut !== 'annulee' && (!restrictedIds || restrictedIds.has(d.id)));

  if(dates.length === 0){
    showState("Aucune date à renseigner pour l'instant sur cette tournée.");
    return;
  }

  const blocMap = computeBlocMap(allDates);
  const dispo = state.person.disponibilites;
  const commentaires = state.person.disponibilites_commentaires;

  // Une personne peut avoir un cachet différent du cachet standard de la tournée
  // (voir cachet_overrides dans migrations.sql) — elle ne voit jamais le montant des
  // autres, seulement le sien (state.cachetOverride, chargé via token dans init()).
  const cachetLine = state.tournee.cachet_statut === 'defini'
    ? (state.cachetOverride != null
        ? `Cachet brut : <strong>${escapeHtml(String(state.cachetOverride))} € brut</strong>`
        : (state.tournee.cachet_montant != null
            ? `Cachet brut : <strong>${escapeHtml(String(state.tournee.cachet_montant))} € brut</strong>`
            : `Cachet brut : non défini pour l'instant`))
    : `Cachet brut : non défini pour l'instant`;

  let html = `
    <h1>Tes disponibilités</h1>
    <div class="identity-banner">
      Bonjour <strong>${escapeHtml(fullName(state.person))}</strong> — merci de compléter tes dispo pour
      <strong>${escapeHtml(state.tournee.nom || 'la tournée')}</strong>${restrictedIds ? ', sur les dates ci-dessous uniquement' : ''}.
      <div class="identity-meta">
        <span class="identity-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" style="vertical-align:-2px;"><path d="M11 6.5l1.4-1.4a3.5 3.5 0 0 1 5 5L16 11.5M13 17.5l-1.4 1.4a3.5 3.5 0 0 1-5-5L8 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path><line x1="9.3" y1="14.7" x2="14.7" y2="9.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></line></svg> Lien personnel — reviens-y quand tu veux</span>
        <span class="identity-meta-item"><svg width="13" height="13" viewBox="0 0 24 24" style="vertical-align:-2px;"><path d="M15.5 6.6a5.6 5.6 0 0 0-8.4 5v0.8h6.2M7.1 14.4h6.2a5.6 5.6 0 0 0 2.2-1.5M4.8 10.4h7.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg> ${cachetLine}</span>
      </div>
      <div class="identity-actions">
        <a class="identity-action" href="mes-infos.html?token=${encodeURIComponent(state.token)}">
          <span class="identity-action-icon"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><path d="M8 11V7.5a4 4 0 0 1 8 0V11" fill="none" stroke="currentColor" stroke-width="1.6"></path><circle cx="12" cy="15.5" r="1.3" fill="currentColor"></circle></svg></span>
          <span>
            <span class="identity-action-title">Renseigner mes infos</span>
            <span class="identity-action-sub">Identité, RIB, n° sécu…</span>
          </span>
        </a>
        ${(state.person.statut_poste || 'titulaire') === 'titulaire' ? `
        <a class="identity-action" href="mes-remplacants.html?token=${encodeURIComponent(state.token)}">
          <span class="identity-action-icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 7.5h11a4 4 0 0 1 4 4v1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><polyline points="12,4.3 15.2,7.5 12,10.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline><path d="M20 16.5H9a4 4 0 0 1-4-4v-1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path><polyline points="12,13.3 8.8,16.5 12,19.7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></polyline></svg></span>
          <span>
            <span class="identity-action-title">Gérer mes remplaçant·es</span>
            <span class="identity-action-sub">Par ordre de préférence</span>
          </span>
        </a>` : ''}
        <button type="button" class="identity-action" id="icsBtn">
          <span class="identity-action-icon"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"></rect><line x1="4" y1="9.5" x2="20" y2="9.5" stroke="currentColor" stroke-width="1.6"></line><line x1="8" y1="3.5" x2="8" y2="7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><line x1="16" y1="3.5" x2="16" y2="7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></line><circle cx="8.5" cy="13.5" r="1.1" fill="currentColor"></circle><circle cx="12" cy="13.5" r="1.1" fill="currentColor"></circle></svg></span>
          <span>
            <span class="identity-action-title">Ajouter à mon calendrier</span>
            <!-- « Dates confirmées » prêtait à confusion : on pouvait comprendre
                 « confirmées par la production ». L'export ne contient en réalité
                 que les dates où la personne a elle-même répondu « disponible ». -->
            <span class="identity-action-sub">Seulement les dates où tu es disponible · .ics</span>
          </span>
        </button>
      </div>
    </div>
    <div class="contact-card">
      <div class="contact-card-label">Tes coordonnées (visibles dans l'annuaire de la prod)</div>
      <div class="contact-card-row">
        <input type="tel" class="contact-input" id="contactTelephone" placeholder="Téléphone" value="${escapeAttr(state.person.telephone || '')}">
        <input type="email" class="contact-input" id="contactEmail" placeholder="Email" value="${escapeAttr(state.person.email || '')}">
      </div>
    </div>
    <div class="intro-text">
      <p>Les dates ci-dessous sont <strong>strictement confidentielles</strong> — merci de ne pas les diffuser en dehors de l'équipe.</p>
      <p>Ce document ne représente pas une embauche ferme : ce sont des options qui doivent être validées et peuvent évoluer.</p>
      <p>Si tu es indisponible, nous contacterons directement les remplaçant·es concerné·es — inutile de le faire toi-même.</p>
    </div>
  `;

  let currentMonth = null;
  dates.forEach((d, idx)=>{
    const monthKey = d.date.slice(0,7);
    if(monthKey !== currentMonth){
      currentMonth = monthKey;
      html += `<div class="month-header">${escapeHtml(fmtMonthYear(d.date))}</div>`;
    }

    const blocInfo = blocMap.get(d.id);
    if(blocInfo && blocInfo.isFirst){
      html += `<div class="bloc-banner"><svg width="13" height="13" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:4px;"><rect x="3.5" y="5" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"></rect><line x1="3.5" y1="10.3" x2="20.5" y2="10.3" stroke="currentColor" stroke-width="1.6"></line><circle cx="7.5" cy="19.3" r="1.4" fill="currentColor"></circle><circle cx="16.5" cy="19.3" r="1.4" fill="currentColor"></circle></svg>Départ la veille (${escapeHtml(fmtDateFRShort(blocInfo.veille))}), retour le lendemain (${escapeHtml(fmtDateFRShort(blocInfo.lendemain))}).</div>`;
    }

    const current = dispo[d.date] || '';
    const comment = commentaires[d.date] || '';
    // Déjà retenu·e sur cette date : l'équipe est faite, on ne s'en retire pas
    // d'un clic. Sauf si l'on s'était déjà déclaré indisponible avant d'être
    // affecté·e — auquel cas le bouton reste tel quel, il dit l'état réel.
    const affecte = estAffecteSur(d) && current !== 'indispo';
    html += `
      <div class="date-card${affecte ? ' affectee' : ''}" data-date-id="${escapeAttr(d.id)}">
        <div class="date-card-head">
          <div class="date-label">${escapeHtml(fmtDateFRLong(d.date))}${!blocInfo ? '<span class="isolated-tag">Date isolée</span>' : ''}${affecte ? '<span class="affecte-tag">Tu es sur cette date</span>' : ''}</div>
          <div class="date-place">${escapeHtml([d.ville, d.lieu].filter(Boolean).join(' · ') || '—')}</div>
        </div>
        <div class="state-toggle">
          <button type="button" class="state-btn dispo ${current==='dispo'?'active':''}" data-date="${escapeAttr(d.date)}" data-state="dispo">Disponible</button>
          <button type="button" class="state-btn indispo ${current==='indispo'?'active':''}${affecte ? ' verrouille' : ''}"
            data-date="${escapeAttr(d.date)}" data-state="indispo"
            ${affecte ? `data-verrouille="1" aria-expanded="false" aria-controls="alerte-${escapeAttr(d.date)}" title="Tu es affecté·e sur cette date — préviens la production"` : ''}>Indisponible</button>
        </div>
        <div class="alerte-affecte" id="alerte-${escapeAttr(d.date)}" data-alerte="${escapeAttr(d.date)}" role="status" style="display:none;"></div>
        <input type="text" class="date-comment" data-date="${escapeAttr(d.date)}" placeholder="Une précision ? (facultatif)" value="${escapeAttr(comment)}">
      </div>
    `;

    // Jour(s) de trajet à l'intérieur d'un même bloc (ex: Marseille -> Zurich) : simple
    // information, pas de question — même logique que la veille/lendemain de début/fin
    // de bloc, mais pour un écart interne entre deux dates consécutives du bloc.
    const next = dates[idx+1];
    if(next && blocInfo && blocMap.get(next.id) && blocMap.get(next.id).blocDates === blocInfo.blocDates){
      const gap = daysBetween(d.date, next.date);
      if(gap > 1){
        const between = [];
        for(let i=1;i<gap;i++) between.push(fmtDateFRShort(addDaysIso(d.date, i)));
        html += `<div class="travel-note"><svg width="13" height="13" viewBox="0 0 24 24" style="vertical-align:-2px; margin-right:4px;"><rect x="3.5" y="5" width="17" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"></rect><line x1="3.5" y1="10.3" x2="20.5" y2="10.3" stroke="currentColor" stroke-width="1.6"></line><circle cx="7.5" cy="19.3" r="1.4" fill="currentColor"></circle><circle cx="16.5" cy="19.3" r="1.4" fill="currentColor"></circle></svg>Jour${between.length>1?'s':''} de trajet (${escapeHtml(between.join(', '))}) — pas de réponse nécessaire.</div>`;
      }
    }
  });

  document.getElementById('content').innerHTML = html;

  document.querySelectorAll('.state-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const date = btn.dataset.date;
      if(btn.dataset.verrouille){ ouvrirAlerteAffecte(date); return; }
      const wasActive = btn.classList.contains('active');
      if(wasActive) delete state.person.disponibilites[date];
      else state.person.disponibilites[date] = btn.dataset.state;
      btn.closest('.state-toggle').querySelectorAll('.state-btn').forEach(b=>{
        b.classList.toggle('active', !wasActive && b === btn);
      });
      markDirty();
    });
  });
  document.querySelectorAll('.date-comment').forEach(input=>{
    input.addEventListener('input', ()=>{
      const date = input.dataset.date;
      const val = input.value.trim();
      if(val) state.person.disponibilites_commentaires[date] = val;
      else delete state.person.disponibilites_commentaires[date];
      markDirty();
    });
  });
  document.getElementById('contactTelephone').addEventListener('input', (e)=>{
    state.person.telephone = e.target.value.trim();
    markDirty();
  });
  document.getElementById('contactEmail').addEventListener('input', (e)=>{
    state.person.email = e.target.value.trim();
    markDirty();
  });
  document.getElementById('icsBtn').addEventListener('click', downloadIcs);

  document.getElementById('saveBar').classList.add('visible');
}

// Fichier .ics généré côté client, sans dépendance ni service tiers — seules les dates
// où la personne a coché "Disponible" y figurent (jamais une proposition en attente).
function icsEscapeText(str){
  return String(str || '').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}

function buildIcsForTournee(){
  const dispo = state.person.disponibilites;
  const confirmedDates = (state.tournee.dates || [])
    .filter(d=> d.date && d.statut !== 'annulee' && dispo[d.date] === 'dispo')
    .slice().sort((a,b)=> a.date.localeCompare(b.date));
  const nowStamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0] + 'Z';
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Curieux orchestre//dispo-titulaire//FR','CALSCALE:GREGORIAN'];
  confirmedDates.forEach(d=>{
    const location = [d.ville, d.lieu].filter(Boolean).join(', ');
    // Titre de l'événement : nom de la tournée ET ville. Sans la ville, une
    // tournée de 28 dates produisait 28 entrées au titre identique dans le
    // calendrier, impossible à distinguer sans ouvrir chacune. Le séparateur
    // est un point médian et non un tiret, les noms de tournée en contenant
    // souvent un ("EXPEDITION 33 - 26/27").
    const titre = [state.tournee.nom || 'Tournée', d.ville].filter(Boolean).join(' · ');
    lines.push(
      'BEGIN:VEVENT',
      `UID:${state.tournee.id}-${d.id}@curieux-orchestre`,
      `DTSTAMP:${nowStamp}`,
      `DTSTART;VALUE=DATE:${d.date.replace(/-/g,'')}`,
      `DTEND;VALUE=DATE:${addDaysIso(d.date, 1).replace(/-/g,'')}`,
      `SUMMARY:${icsEscapeText(titre)}`,
    );
    if(location) lines.push(`LOCATION:${icsEscapeText(location)}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

function downloadIcs(){
  const dispo = state.person.disponibilites;
  const hasConfirmed = (state.tournee.dates || []).some(d=> d.date && d.statut !== 'annulee' && dispo[d.date] === 'dispo');
  if(!hasConfirmed){
    alert('Aucune date "Disponible" pour l\'instant — coche au moins une date avant d\'exporter.');
    return;
  }
  const blob = new Blob([buildIcsForTournee()], { type: 'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(state.tournee.nom || 'tournee').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.ics`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

let hasUnsavedChanges = false;
window.addEventListener('beforeunload', (e)=>{
  if(!hasUnsavedChanges) return;
  e.preventDefault();
  e.returnValue = '';
});

function markDirty(){
  const status = document.getElementById('saveStatus');
  const btn = document.getElementById('saveBtn');
  status.textContent = 'Modifications non enregistrées.';
  status.className = 'save-status dirty';
  btn.disabled = false;
  hasUnsavedChanges = true;
}

async function doSave(){
  const btn = document.getElementById('saveBtn');
  const status = document.getElementById('saveStatus');
  btn.disabled = true;
  btn.textContent = 'Enregistrement…';
  const [personRes, demandeRes] = await Promise.all([
    CurieuxDB.updateOwnDisponibilitesByToken(
      state.token, state.person.disponibilites, state.person.disponibilites_commentaires,
      state.person.telephone || '', state.person.email || ''
    ),
    supabaseClient.rpc('mark_dispo_responded_by_token', { p_token: state.demande.id })
  ]);
  btn.textContent = 'Valider mes réponses';
  if(personRes.error || demandeRes.error){
    // La base refuse de basculer en « indisponible » une date déjà affectée
    // (voir update_own_disponibilites_by_token). Ce n'est pas une panne : on le
    // dit dans ces mots-là, et on rouvre l'explication sur la date concernée.
    const message = String((personRes.error && personRes.error.message) || '');
    const marqueur = message.match(/AFFECTE_SUR_CES_DATES:([\d\-,]+)/);
    if(marqueur){
      const dates = marqueur[1].split(',').filter(Boolean);
      dates.forEach(iso=> delete state.person.disponibilites[iso]);
      status.textContent = dates.length > 1
        ? "Ces dates sont déjà affectées : préviens la production directement."
        : "Cette date est déjà affectée : préviens la production directement.";
      status.className = 'save-status';
      render();
      dates.forEach(ouvrirAlerteAffecte);
      return;
    }
    status.textContent = "Erreur, tes réponses n'ont pas pu être enregistrées. Réessaie.";
    status.className = 'save-status';
    return;
  }
  status.textContent = '✓ Réponses enregistrées.';
  status.className = 'save-status saved';
  hasUnsavedChanges = false;
}

document.getElementById('saveBtn').addEventListener('click', doSave);

applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);
init();
</script>
