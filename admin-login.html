<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Connexion</title>
<script>
// Capturé avant tout script tiers : supabase-js nettoie le hash de l'URL
// (history.replaceState) une fois la session détectée, donc c'est ici, tout
// en haut, qu'il faut lire "type=magiclink" — plus bas ce serait déjà parti.
window.__curieuxMagicLink = /(^|[#&])type=magiclink(&|$)/.test(location.hash);
</script>
<script src="assets/vendor/supabase-js.js"></script>
<script src="assets/db.js"></script>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<script>try{ injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); injectBugReportWidget(); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* ==========================================================================
     Connexion — écran d'entrée des comptes de production.

     La maquette ne le couvre pas : on n'y arrive pas par le menu, et il
     s'affiche justement avant d'avoir le droit de voir le reste. Il emprunte
     donc son vocabulaire (.co-card, .co-input, .co-btn, .co-h1) au lieu de
     redéfinir un encart, un champ et un bouton pour lui seul — c'est cette
     duplication qui avait fait diverger les pages la première fois.

     Pas de nav.js : le bandeau mènerait à des pages que ce compte n'a pas
     encore le droit d'ouvrir.
     ========================================================================== */
  body{
    min-height:100vh; display:flex; padding:24px 16px;
  }
  .wrap{max-width:380px; width:100%; margin:auto;}
  .brand-logo-img{height:36px; width:auto; display:block; margin:0 auto 22px;}
  .card{padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.1); text-align:center;}
  .card h1{margin-bottom:6px;}
  p.hint{color:var(--muted); font-size:12.5px; margin:0 0 18px; line-height:1.5;}
  .field{margin-bottom:12px; text-align:left;}
  .msg{font-size:12.5px; margin-top:10px; display:none;}
  .msg.error{color:var(--danger);}
  .switch-link{font-size:12.5px; color:var(--muted); margin-top:18px;}
  .switch-link a{color:var(--accent); font-weight:700; text-decoration:none;}
  .switch-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <div class="co-card card co-fade">
    <img class="brand-logo-img" alt="Curieux orchestre">
    <h1 class="co-h1" id="cardTitle">Connexion</h1>
    <p class="hint" id="cardHint">Connecte-toi avec ton compte administrateur·rice.</p>

    <form id="loginForm">
      <div class="field">
        <label class="co-label" for="loginEmail">Email</label>
        <input class="co-input" type="email" id="loginEmail" autocomplete="username" required>
      </div>
      <div class="field">
        <label class="co-label" for="loginPassword">Mot de passe</label>
        <input class="co-input" type="password" id="loginPassword" autocomplete="current-password" required>
      </div>
      <button type="submit" class="co-btn primary block" id="loginBtn">Se connecter</button>
      <div class="msg error" id="loginError"></div>
    </form>

    <div id="notAdminBlock" style="display:none;">
      <p class="hint" style="margin-top:14px;" id="notAdminHint">Ce compte est connecté mais n'est pas encore autorisé. Demande à un·e administrateur·rice de t'ajouter depuis le tableau de bord admin.</p>
      <button type="button" class="co-btn primary block" id="switchAccountBtn">Se connecter avec un autre compte</button>
    </div>

    <div class="switch-link" id="signupLink">Pas encore de compte ? <a href="mailto:alois.darles@lessoudaines.fr?subject=Demande%20de%20compte%20Curieux%20orchestre">Demande-en un par email</a></div>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const redirect = params.get('redirect') || 'accueil.html';
// 'admin' = page cible réservée au rôle admin (infos sociales, dashboard) ;
// 'user' (défaut) = page admin courante, accessible à tout compte listé.
const requiredLevel = params.get('level') === 'admin' ? 'admin' : 'user';

async function hasRequiredAccess(){
  return requiredLevel === 'admin' ? CurieuxDB.isSuperAdmin() : CurieuxDB.hasAppAccess();
}

function showError(msg){
  const el = document.getElementById('loginError');
  el.textContent = msg;
  el.style.display = 'block';
}

async function checkExistingSession(){
  const session = await CurieuxDB.getSession();
  if(!session) return;
  if(await hasRequiredAccess()){
    if(window.__curieuxMagicLink){
      location.replace('definir-mot-de-passe.html?redirect=' + encodeURIComponent(redirect));
      return;
    }
    location.replace(redirect);
    return;
  }
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('signupLink').style.display = 'none';
  document.getElementById('notAdminBlock').style.display = 'block';
  document.getElementById('notAdminHint').textContent = requiredLevel === 'admin'
    ? "Ce compte est connecté mais n'a pas le rôle \"admin\" requis pour cette page. Demande à un·e administrateur·rice de te passer en rôle admin depuis le tableau de bord."
    : "Ce compte est connecté mais n'est pas encore autorisé. Demande à un·e administrateur·rice de t'ajouter depuis le tableau de bord admin.";
  document.getElementById('cardHint').textContent = 'Connecté·e en tant que ' + session.user.email + '.';
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Connexion…';
  document.getElementById('loginError').style.display = 'none';
  const { error } = await CurieuxDB.signIn(email, password);
  btn.disabled = false; btn.textContent = 'Se connecter';
  if(error){
    showError(translateAuthError(error.message));
    return;
  }
  if(await hasRequiredAccess()){
    location.replace(redirect);
  } else {
    checkExistingSession();
  }
});

document.getElementById('switchAccountBtn').addEventListener('click', async ()=>{
  await CurieuxDB.signOut();
  location.reload();
});

applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);
checkExistingSession();
</script>
</body>
</html>
