<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Accès admin</title>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<script>try{ injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); injectBugReportWidget(); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  body{
    margin:0; font-family:'Host Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; display:flex; padding:24px 16px;
    transition:background .3s, color .3s;
  }
  .wrap{max-width:380px; width:100%; margin:auto;}
  .brand-logo-img{height:36px; width:auto; display:block; margin:0 auto 22px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.1); text-align:center;}
  h2{font-size:16px; margin:0 0 10px;}
  p{color:var(--muted); font-size:13.5px; line-height:1.6; margin:0 0 18px;}
  a.btn-primary{
    display:block; background:var(--accent); color:#fff; text-decoration:none;
    border-radius:8px; padding:10px; font-weight:700; font-size:14px;
  }
  a.btn-primary:hover{background:var(--accent-dark);}
  .switch-link{font-size:12.5px; color:var(--muted); margin-top:18px;}
  .switch-link a{color:var(--accent); font-weight:600; text-decoration:none;}
  .switch-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <img class="brand-logo-img" alt="Curieux orchestre">
    <h2>Accès sur demande uniquement</h2>
    <p>Pour des raisons de sécurité, les comptes d'accès aux pages internes ne se créent plus soi-même : demande à un·e administrateur·rice de t'en créer un et de t'ajouter à la liste d'accès.</p>
    <a class="btn-primary" href="mailto:alois.darles@lessoudaines.fr?subject=Demande%20de%20compte%20Curieux%20orchestre">Demander un accès par email</a>
    <div class="switch-link">Déjà un compte ? <a href="admin-login.html">Se connecter</a></div>
  </div>
</div>
<script>
applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);
</script>
</body>
</html>
