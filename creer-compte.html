<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curieux orchestre — Accès admin</title>
<script src="assets/brand-assets.js"></script>
<script src="assets/ui-helpers.js"></script>
<script>try{ injectCurieuxFonts(); applyAutoTheme(); applyCurieuxFavicon(); initCurieuxPWA(); initCurieuxSpeedInsights(); injectBugReportWidget(); }catch(e){}</script>
<link rel="stylesheet" href="assets/base.css">
<style>
  /* ==========================================================================
     Accès admin — la page qui explique que les comptes ne se créent plus seuls.

     Hors maquette, comme les autres écrans d'entrée : elle reprend donc le même
     encart et le même bouton que la connexion plutôt que les redéfinir.
     ========================================================================== */
  body{
    min-height:100vh; display:flex; padding:24px 16px;
  }
  .wrap{max-width:380px; width:100%; margin:auto;}
  .brand-logo-img{height:36px; width:auto; display:block; margin:0 auto 22px;}
  .card{padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.1); text-align:center;}
  .card h1{margin-bottom:10px;}
  .card p{color:var(--muted); font-size:13.5px; line-height:1.6; margin:0 0 18px;}
  .switch-link{font-size:12.5px; color:var(--muted); margin-top:18px;}
  .switch-link a{color:var(--accent); font-weight:700; text-decoration:none;}
  .switch-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <div class="co-card card co-fade">
    <img class="brand-logo-img" alt="Curieux orchestre">
    <h1 class="co-h1">Accès sur demande uniquement</h1>
    <p>Pour des raisons de sécurité, les comptes d'accès aux pages internes ne se créent plus soi-même : demande à un·e administrateur·rice de t'en créer un et de t'ajouter à la liste d'accès.</p>
    <a class="co-btn primary block" href="mailto:alois.darles@lessoudaines.fr?subject=Demande%20de%20compte%20Curieux%20orchestre">Demander un accès par email</a>
    <div class="switch-link">Déjà un compte ? <a href="admin-login.html">Se connecter</a></div>
  </div>
</div>
<script>
applyAutoTheme();
setInterval(applyAutoTheme, 5 * 60 * 1000);
</script>
</body>
</html>
